name: 정원 안드로이드 빌드

on:
  workflow_dispatch:
  push:
    paths:
      - 'garden/**'
      - 'garden-app/**'
      - '.github/workflows/garden-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garden-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm install --no-audit --no-fund

      - name: 안드로이드 프로젝트 만들기
        run: |
          npm run www
          npx cap add android
          # 구글 로그인 라이브러리를 켠다
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          # 버전 번호: 빌드할 때마다 올라감
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Firebase 설정 파일 (있으면)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GARDEN_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "google-services.json 넣음"; else echo "::warning::GARDEN_GOOGLE_SERVICES_JSON 시크릿이 없어서 구글 로그인 없이 빌드합니다"; fi

      - name: 아이콘과 시작 화면
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffdf8c' --splashBackgroundColor '#1d1838' --splashBackgroundColorDark '#1d1838'

      - name: 동기화
        run: npx cap sync android

      - name: 서명 키 (있으면)
        env:
          KEYSTORE_B64: ${{ secrets.GARDEN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GARDEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GARDEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GARDEN_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::서명 키 시크릿이 없어서 시험용(debug) APK만 만듭니다"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  upload {
                      storeFile file('upload.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE
          echo "SIGNED=1" >> $GITHUB_ENV

      - name: 빌드
        working-directory: garden-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.GARDEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GARDEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GARDEN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then ./gradlew --no-daemon assembleRelease bundleRelease; else ./gradlew --no-daemon assembleDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: garden-android
          path: |
            garden-app/android/app/build/outputs/apk/**/*.apk
            garden-app/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
