<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경험 기계 - 이클립스의 딜렘</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#140a20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="eclipse.css">

  <style>
    body { min-height: 100vh; padding-bottom: 56px; word-break: keep-all; overflow-wrap: break-word; }
    .container { max-width: var(--col); margin: 0 auto; padding: 0 20px; }

    /* top bar: back, title, scene count, thin progress line */
    .header {
      position: sticky; top: 0; z-index: 20;
      margin: 0 -20px; padding: 0 20px;
      background: color-mix(in srgb, var(--night) 92%, transparent);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    }
    .bar { display: flex; align-items: center; gap: 6px; height: 56px; }
    .back-btn {
      flex: none; width: 40px; height: 40px; margin-left: -10px;
      display: grid; place-items: center; border-radius: 50%; color: var(--mist);
      transition: transform .15s ease, color .2s ease;
    }
    .back-btn:hover { color: var(--moon); }
    .back-btn:active { transform: scale(.94); }
    .bar-title {
      flex: 1; min-width: 0; font-family: var(--serif); font-weight: 400; font-size: 19px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .stage-label { flex: none; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .progress { display: flex; gap: 4px; }
    .progress-bar { flex: 1; height: 2px; background: var(--line); transition: background .3s ease; }
    .progress-bar.completed { background: var(--corona); }
    .progress-bar.current { background: var(--violet-soft); }

    .intro { padding: 26px 0 0; }
    .intro-meta { font-size: 12.5px; color: var(--dim); }
    .intro-line { font-size: 14px; color: var(--mist); margin-top: 2px; }

    /* scene */
    .scenario-card { padding: 22px 0 0; }
    .context { font-size: 15.5px; line-height: 1.9; color: var(--mist); margin-bottom: 20px; }
    .situation { font-family: var(--serif); font-weight: 400; font-size: 23px; line-height: 1.55; color: var(--moon); }

    /* choices: tappable rows */
    .choices { margin-top: 28px; border-top: 1px solid var(--line); counter-reset: ch; }
    .choice-btn {
      counter-increment: ch;
      display: grid; grid-template-columns: 22px 1fr 10px; gap: 12px; align-items: start;
      width: 100%; text-align: left; padding: 19px 6px 19px 4px;
      border-bottom: 1px solid var(--line);
      font-size: 15.5px; line-height: 1.65; color: var(--moon);
      transition: background .2s ease, transform .15s ease;
    }
    .choice-btn::before { content: counter(ch); font-family: var(--serif); font-size: 18px; line-height: 1.45; color: var(--dim); }
    .choice-btn::after {
      content: ""; width: 8px; height: 8px; margin-top: 9px;
      border-top: 1.5px solid var(--dim); border-right: 1.5px solid var(--dim); transform: rotate(45deg);
    }
    .choice-btn:hover { background: var(--night-2); }
    .choice-btn:active { background: var(--night-3); transform: scale(.99); }
    .choice-btn:active::before { color: var(--moon); }

    /* after a choice */
    .result-section { display: none; margin-top: 28px; }
    .result-section.show { display: block; }
    .selected-choice { padding: 2px 0 2px 16px; border-left: 2px solid var(--moon); margin-bottom: 28px; }
    .selected-header, .outcome-label { font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
    .selected-text { font-size: 15.5px; line-height: 1.65; color: var(--moon); }
    .outcome-card { margin-bottom: 28px; }
    .outcome-text { font-size: 15.5px; line-height: 1.9; color: var(--moon); }

    /* the one special object */
    .principle-card {
      background: var(--night-2); border-radius: var(--r-m);
      padding: 22px 22px 24px; margin-bottom: 26px;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .principle-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .principle-icon { display: grid; color: var(--violet); }
    .principle-icon svg { width: 16px; height: 16px; }
    .principle-label { font-size: 12.5px; color: var(--mist); }
    .principle-name { font-family: var(--serif); font-weight: 400; font-size: 25px; line-height: 1.35; margin-bottom: 8px; }
    .principle-explanation { font-size: 14.5px; line-height: 1.8; color: var(--mist); }

    /* verdict: label + one line */
    .evaluation-card { --tone: var(--mist); margin-bottom: 28px; }
    .evaluation-card.positive, .eval-badge.positive { --tone: var(--ok); }
    .evaluation-card.neutral, .eval-badge.neutral { --tone: var(--mist); }
    .evaluation-card.negative, .eval-badge.negative { --tone: color-mix(in srgb, var(--corona) 45%, var(--moon)); }
    .evaluation-icon, .eval-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12.5px; color: var(--tone); margin-bottom: 4px;
    }
    .evaluation-icon:empty { display: none; }
    .evaluation-icon::before, .eval-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .evaluation-card.insight .evaluation-icon::before { display: none; }
    .evaluation-text { font-size: 15px; line-height: 1.75; color: var(--moon); }

    /* other choices */
    .other-choices-section { margin-bottom: 28px; }
    .other-choices-toggle {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 16px 2px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      font-size: 14.5px; color: var(--mist); transition: color .2s ease;
    }
    .other-choices-toggle:hover, .other-choices-toggle.open { color: var(--moon); }
    .other-choices-toggle svg { transition: transform .2s ease; }
    .other-choices-toggle.open svg { transform: rotate(180deg); }
    .other-choices-content { display: flex; flex-direction: column; }
    .other-choice-card { padding: 18px 2px; border-bottom: 1px solid var(--line); }
    .other-choice-header { margin-bottom: 2px; }
    .other-choice-text { font-size: 15px; line-height: 1.65; color: var(--moon); margin-bottom: 8px; }
    .other-choice-outcome { font-size: 14px; line-height: 1.8; color: var(--mist); margin-bottom: 8px; }
    .other-choice-eval { font-size: 13.5px; line-height: 1.7; color: var(--dim); margin-bottom: 8px; }
    .other-choice-principle { font-size: 13.5px; line-height: 1.7; color: var(--dim); }
    .other-choice-principle strong { color: var(--moon); font-weight: 500; }

    /* pills */
    .next-btn, .home-btn, .restart-btn, .install-btn, .share-btn {
      width: 100%; height: 50px; padding: 0 20px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 15px; transition: transform .15s ease, box-shadow .2s ease, color .2s ease;
    }
    .next-btn, .home-btn { background: var(--moon); color: var(--night); font-weight: 600; }
    .restart-btn, .install-btn, .share-btn { color: var(--moon); box-shadow: inset 0 0 0 1px var(--line); }
    .restart-btn:hover, .install-btn:hover, .share-btn:hover { box-shadow: inset 0 0 0 1px var(--mist); }
    .next-btn:active, .home-btn:active, .restart-btn:active, .install-btn:active, .share-btn:active { transform: scale(.97); }
    .share-btn.success { color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }

    /* result */
    .final-screen { display: none; padding-top: 40px; }
    .final-screen.show { display: block; }
    .container:has(.final-screen.show) .intro,
    .container:has(.final-screen.show) .progress,
    .container:has(.final-screen.show) .stage-label { display: none; }
    .clear-card { text-align: center; padding-bottom: 32px; }
    .clear-icon { width: 56px; margin: 0 auto 30px; }
    .clear-title { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.3; }
    .clear-subtitle { font-size: 14.5px; color: var(--mist); margin-top: 8px; }
    .clear-exp { font-size: 13px; color: var(--dim); margin-top: 6px; }

    .principles-collected { border-top: 1px solid var(--line); padding-top: 26px; margin-bottom: 32px; }
    .principles-title { font-size: 12.5px; color: var(--dim); margin-bottom: 2px; }
    .principle-item { padding: 16px 0; border-bottom: 1px solid var(--line); }
    .principle-item-icon { display: none; }
    .principle-item-name { font-family: var(--serif); font-weight: 400; font-size: 20px; line-height: 1.4; margin-bottom: 4px; }
    .principle-item-desc { font-size: 14px; line-height: 1.75; color: var(--mist); }

    .share-section { margin-bottom: 12px; }
    .share-label { font-size: 12.5px; color: var(--dim); margin-bottom: 10px; }
    .share-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .share-btn { font-size: 14.5px; }
    .action-buttons { display: grid; gap: 8px; }

    /* books */
    .promo-section { margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); }
    .books-section-title { font-size: 12.5px; color: var(--dim); margin-bottom: 16px; }
    .book-feature {
      display: grid; grid-template-columns: 92px 1fr; gap: 18px; align-items: center;
      padding: 18px; margin-bottom: 32px; background: var(--night-2); border-radius: var(--r-m);
      transition: transform .15s ease;
    }
    .book-feature:active { transform: scale(.98); }
    .book-feature img { width: 92px; filter: drop-shadow(0 12px 18px rgba(0,0,0,.5)); }
    .book-feature-title { font-family: var(--serif); font-size: 19px; line-height: 1.35; }
    .book-feature-sub { font-size: 13px; color: var(--mist); margin-top: 4px; }
    .book-feature-more { font-size: 13px; color: var(--dim); margin-top: 10px; }
    .books-grid { display: flex; gap: 20px; }
    .book-item { flex: 1; max-width: 104px; display: flex; flex-direction: column; gap: 8px; transition: transform .15s ease; }
    .book-item:active { transform: scale(.97); }
    .book-item img {
      width: 100%; aspect-ratio: 104 / 161; object-fit: contain; object-position: left bottom;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.5));
    }
    .book-item-title { font-size: 13px; line-height: 1.35; color: var(--mist); }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="bar">
        <a href="index.html" class="back-btn" aria-label="돌아가기">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1 class="bar-title">경험 기계</h1>
        <span class="stage-label" id="stage-label">1 / 3</span>
      </div>
      <div class="progress" id="progress"></div>
    </header>

    <div class="intro">
      <div class="intro-meta">철학 · 사고실험</div>
      <p class="intro-line">완벽한 행복이 보장된다면, 가짜 세계를 선택할 수 있을까?</p>
    </div>

    <div id="game-screen">
      <div class="scenario-card">
        <div class="context" id="context"></div>
        <div class="situation" id="situation"></div>
      </div>

      <div class="choices" id="choices"></div>

      <div class="result-section" id="result-section">
        <div class="selected-choice">
          <div class="selected-header">당신의 선택</div>
          <div class="selected-text" id="selected-text"></div>
        </div>

        <div class="outcome-card">
          <div class="outcome-label">이 선택이 의미하는 것</div>
          <div class="outcome-text" id="outcome-text"></div>
        </div>

        <div class="principle-card">
          <div class="principle-header">
            <span class="principle-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></span>
            <span class="principle-label">발견한 철학적 원칙</span>
          </div>
          <div class="principle-name" id="principle-name"></div>
          <div class="principle-explanation" id="principle-explanation"></div>
        </div>

        <div class="evaluation-card insight">
          <div class="evaluation-icon" id="evaluation-icon">한 줄 해설</div>
          <div class="evaluation-text" id="evaluation-text"></div>
        </div>

        <div class="other-choices-section">
          <button class="other-choices-toggle" id="other-toggle">
            <span>다른 관점은?</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="other-choices-content hidden" id="other-choices-content"></div>
        </div>

        <button class="next-btn" id="next-btn">다음 질문</button>
      </div>
    </div>

    <div class="final-screen" id="final-screen">
      <div class="clear-card">
        <div class="clear-icon" aria-hidden="true"><div class="ecl-mark"><i class="lit"></i><i class="rim"></i><i class="shade"></i></div></div>
        <div class="clear-title">사고실험을 마쳤어요</div>
        <div class="clear-subtitle">경험 기계 딜레마를 끝까지 따라왔어요</div>
        <div class="clear-exp">경험치 +30</div>
      </div>

      <div class="principles-collected">
        <div class="principles-title">발견한 철학적 원칙</div>
        <div id="principles-list"></div>
      </div>

      <div class="share-section">
        <div class="share-label">친구에게 공유하기</div>
        <div class="share-buttons">
          <button class="share-btn" id="native-share-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            공유하기
          </button>
          <button class="share-btn" id="copy-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            링크 복사
          </button>
        </div>
      </div>

      <div class="action-buttons">
        <a href="index.html" class="home-btn">홈으로</a>
        <button class="restart-btn" id="restart-btn">다시 탐험하기</button>
        <button class="install-btn hidden" id="installBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          앱으로 설치하기
        </button>
      </div>

      <div class="promo-section">
        <div class="books-section">
          <div class="books-section-title">이클립스의 책</div>
          <div class="books-grid">
            <a href="https://litt.ly/eclipse.thinker" target="_blank" class="book-item">
              <img src="img/book-philosophy.webp" alt="훔친 철학 편" loading="lazy">
              <div class="book-item-title">훔친 철학 편</div>
            </a>
            <a href="https://litt.ly/eclipse.thinker" target="_blank" class="book-item">
              <img src="img/book-psychology.webp" alt="훔친 심리학 편" loading="lazy">
              <div class="book-item-title">훔친 심리학 편</div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDZ-NATGNFjQ90gswfebIV-0xqhps68qJM",
      authDomain: "eclipse-mindlab.firebaseapp.com",
      projectId: "eclipse-mindlab",
      storageBucket: "eclipse-mindlab.firebasestorage.app",
      messagingSenderId: "181450990304",
      appId: "1:181450990304:web:3043d3857815249f53e685"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    // Firebase 익명 로그인
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        signInAnonymously(auth).catch(console.error);
      }
    });

    const SITE_URL = 'https://eclipse-mindlab.github.io/mindlab/';
    const STORAGE_KEY = 'eclipse_mindlab_profile';
    const SIM_ID = 'experience_machine';

    const stages = [
      {
        id: 1,
        context: "당신 앞에 기계가 있다. 이 기계에 들어가면 원하는 모든 경험을 완벽하게 시뮬레이션해준다. 쾌락, 성공, 사랑... 무엇이든. 뇌가 느끼는 경험은 현실과 구분이 불가능하다.",
        situation: "기계 안에서 당신은 베스트셀러 작가가 될 수도, 세계 여행을 할 수도, 완벽한 사랑을 할 수도 있다. 단, 한 번 들어가면 평생 나올 수 없고, 그것이 가짜라는 사실도 잊게 된다. 들어가겠는가?",
        choices: [
          {
            text: "들어간다. 결국 중요한 건 내가 느끼는 행복 아닌가?",
            outcome: "당신은 쾌락주의(Hedonism)의 입장을 선택했다. 벤담이 말했듯, '쾌락의 양이 같다면 핀볼이나 시만큼이나 좋다'. 경험 자체가 가치라면, 그것이 진짜든 가짜든 상관없다.",
            principle: "쾌락주의",
            principleDesc: "경험 자체가 가치라면, 그 경험이 어디서 오든 중요하지 않다는 입장.",
            evaluation: "이 선택은 '결과'가 '과정'보다 중요하다는 관점을 반영한다.",
            nextStage: "stage2_enter"
          },
          {
            text: "들어가지 않는다. 가짜 행복은 진짜 행복이 아니다.",
            outcome: "당신은 진정성(Authenticity)을 선택했다. 사르트르가 말한 '실존'처럼, 내가 직접 선택하고 책임지는 삶만이 의미가 있다. 시뮬레이션된 성공은 내가 쟁취한 것이 아니다.",
            principle: "진정성",
            principleDesc: "경험의 출처가 중요하다. 스스로 만들어낸 것만이 진짜 가치를 가진다.",
            evaluation: "이 선택은 '과정'이 '결과'만큼, 혹은 더 중요하다는 관점을 반영한다.",
            nextStage: "stage2_refuse"
          },
          {
            text: "잠깐, 더 생각해보고 싶다.",
            outcome: "현명한 선택이다. 이 딜레마는 단순하지 않다. 좀 더 깊이 들어가보자.",
            principle: "철학적 보류",
            principleDesc: "중요한 결정은 서두르지 않는다. 충분히 고민하는 것도 하나의 입장이다.",
            evaluation: "대부분의 철학자들도 이 문제에 대해 오래 고민했다.",
            nextStage: "stage2_think"
          }
        ]
      },
      
      // 들어가기 경로
      {
        id: "stage2_enter",
        context: "당신은 쾌락주의적 입장을 선택했다. 그런데 한 가지 질문이 더 있다.",
        situation: "만약 기계 안에서 '가장 의미 있는 삶'을 살 수 있다면, 그것은 진짜 의미 있는 삶인가? 아니면 기계가 '의미 있다고 느끼게' 해주는 것뿐인가?",
        choices: [

    let currentStageId = 1;
    let collectedPrinciples = [];
    let stageHistory = [];

    function getStageById(id) {
      return stages.find(s => s.id === id);
    }

    function init() {
      renderProgress();
      renderStage();
      
      document.getElementById('next-btn').addEventListener('click', nextStage);
      document.getElementById('restart-btn').addEventListener('click', restart);
      document.getElementById('native-share-btn').addEventListener('click', nativeShare);
      document.getElementById('copy-btn').addEventListener('click', copyLink);
      document.getElementById('other-toggle').addEventListener('click', toggleOtherChoices);
    }

    function toggleOtherChoices() {
      const content = document.getElementById('other-choices-content');
      const toggle = document.getElementById('other-toggle');
      content.classList.toggle('hidden');
      toggle.classList.toggle('open');
    }

    function renderProgress() {
      const totalStages = 3;
      const currentCount = stageHistory.length;
      
      const progressEl = document.getElementById('progress');
      progressEl.innerHTML = Array(totalStages).fill(0).map((_, idx) => {
        let className = 'progress-bar';
        if (idx < currentCount) className += ' completed';
        else if (idx === currentCount) className += ' current';
        return `<div class="${className}"></div>`;
      }).join('');
    }

    function renderStage() {
      const stage = getStageById(currentStageId);
      if (!stage) return;
      
      document.getElementById('stage-label').textContent = `${stageHistory.length + 1} / 3`;
      document.getElementById('context').textContent = stage.context;
      document.getElementById('situation').textContent = stage.situation;
      
      const choicesEl = document.getElementById('choices');
      choicesEl.innerHTML = stage.choices.map((choice, idx) => `
        <button class="choice-btn" data-index="${idx}">${choice.text}</button>
      `).join('');
      
      choicesEl.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => handleChoice(parseInt(btn.dataset.index)));
      });
      
      document.getElementById('choices').classList.remove('hidden');
      document.getElementById('result-section').classList.remove('show');
    }

    function handleChoice(index) {
      const stage = getStageById(currentStageId);
      const choice = stage.choices[index];
      
      stageHistory.push({
        stageId: currentStageId,
        choiceIndex: index,
        principle: choice.principle
      });
      
      if (!collectedPrinciples.find(p => p.name === choice.principle)) {
        collectedPrinciples.push({
          name: choice.principle,
          desc: choice.principleDesc
        });
      }
      
      document.getElementById('choices').classList.add('hidden');
      document.getElementById('result-section').classList.add('show');
      
      document.getElementById('selected-text').textContent = choice.text;
      document.getElementById('outcome-text').textContent = choice.outcome;
      document.getElementById('principle-name').textContent = choice.principle;
      document.getElementById('principle-explanation').textContent = choice.principleDesc;
      document.getElementById('evaluation-text').textContent = choice.evaluation;
      
      const otherChoices = stage.choices.filter((_, i) => i !== index);
      const otherContent = document.getElementById('other-choices-content');
      otherContent.innerHTML = otherChoices.map(c => `
        <div class="other-choice-card">
          <div class="other-choice-text">${c.text}</div>
          <div class="other-choice-outcome">${c.outcome}</div>
          <div class="other-choice-principle"><strong>${c.principle}</strong>: ${c.principleDesc}</div>
        </div>
      `).join('');
      
      document.getElementById('other-choices-content').classList.add('hidden');
      document.getElementById('other-toggle').classList.remove('open');
      
      const nextBtn = document.getElementById('next-btn');
      if (choice.nextStage === 'end') {
        nextBtn.textContent = '결과 보기';
      } else {
        nextBtn.textContent = '다음 질문';
      }
      
      currentStageId = choice.nextStage;
      renderProgress();
    }

    function nextStage() {
      if (currentStageId === 'end') {
        showFinalScreen();
      } else {
        renderStage();
      }
    }

    function showFinalScreen() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('final-screen').classList.add('show');
      
      const principlesList = document.getElementById('principles-list');
      principlesList.innerHTML = collectedPrinciples.map(p => `
        <div class="principle-item">
          <div class="principle-item-icon"></div>
          <div class="principle-item-content">
            <div class="principle-item-name">${p.name}</div>
            <div class="principle-item-desc">${p.desc}</div>
          </div>
        </div>
      `).join('');
      
      saveProgress();
      showInstallButton();
    }

    function saveProgress() {
      let saved = localStorage.getItem(STORAGE_KEY);
      let profile;
      
      if (saved) {
        profile = JSON.parse(saved);
      } else {
        // 프로필 없으면 익명으로 생성
        profile = { name: '익명 탐험가', level: 1, exp: 0, completedSims: [], principles: [] };
      }
      
      if (!profile.completedSims) profile.completedSims = [];
      if (!profile.principles) profile.principles = [];
      
      const isFirstTime = !profile.completedSims.includes(SIM_ID);
      
      if (isFirstTime) {
        profile.completedSims.push(SIM_ID);
        profile.exp = (profile.exp || 0) + 30;
        
        const expNeeded = (profile.level || 1) * 100;
        while (profile.exp >= expNeeded) {
          profile.exp -= expNeeded;
          profile.level = (profile.level || 1) + 1;
        }
      }
      
      collectedPrinciples.forEach(p => {
        if (!profile.principles.find(existing => existing.name === p.name)) {
          profile.principles.push(p);
        }
      });
      
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
      
      // Firebase에도 저장
      const user = auth.currentUser;
      if (user) {
        const docRef = doc(db, 'users', user.uid);
        setDoc(docRef, { ...profile, updatedAt: new Date().toISOString() }, { merge: true })
          .then(() => console.log('클라우드 저장 완료'))
          .catch(console.error);
      }
    }

    function getShareText() {
      return `🧠 이클립스의 딜렘

[경험 기계] 사고실험 완료!

발견한 철학적 원칙 ${collectedPrinciples.length}개:
${collectedPrinciples.map(p => '• ' + p.name).join('\n')}

당신은 경험 기계에 들어가시겠습니까?`;
    }

    function nativeShare() {
      if (navigator.share) {
        navigator.share({
          title: '경험 기계 - 이클립스의 딜렘',
          text: getShareText(),
          url: SITE_URL
        }).catch(() => {});
      } else {
        copyLink();
      }
    }

    function copyLink() {
      const text = getShareText() + '\n' + SITE_URL;
      const btn = document.getElementById('copy-btn');
      
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('success');
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 복사 완료!`;
        setTimeout(() => {
          btn.classList.remove('success');
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 링크 복사`;
        }, 2000);
      });
    }

    function restart() {
      currentStageId = 1;
      collectedPrinciples = [];
      stageHistory = [];
      
      document.getElementById('final-screen').classList.remove('show');
      document.getElementById('game-screen').classList.remove('hidden');
      
      renderProgress();
      renderStage();
    }

    // PWA
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function showInstallButton() {
      if (deferredPrompt && installBtn) {
        installBtn.classList.remove('hidden');
      }
    }

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.classList.add('hidden');
      deferredPrompt = null;
    });

    init();
  </script>
</body>
</html>
