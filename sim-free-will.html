const SIDE={"me1": "L", "brain1": "D", "same1": "C", "alcohol2": "D", "truth2": "L", "chose2": "C", "whitman3": "L", "tumor3": "D", "capacity3": "C", "other3": "P", "past4": "C", "now4": "P", "proxy4": "L", "best4": "D", "daily5": "P", "hold5": "L", "end5": "D"};
const RES={"L": {"title": "끝까지 고르는 사람", "body": "술에도, 병에도, 세월에도 흔들리지만 마지막에 고르는 건 나라고 믿는 쪽입니다. 그래서 핑계를 대기보다 책임을 지고, 고를 수 있는 지금을 미루지 않으려 합니다.\n\n이 믿음은 사람을 일으켜 세웁니다. 다만 같은 잣대를 남에게 댈 때는 조심해야 합니다. 뇌 안에서 무슨 일이 일어나고 있는지는 휘트먼 자신도 몰랐습니다."}, "D": {"title": "원인을 보는 사람", "body": "어떤 선택 앞에서도 그 선택을 만든 원인을 먼저 보는 쪽입니다. 술, 종양, 병, 그리고 뇌. 그래서 남을 쉽게 미워하지 않고, 나 자신도 덜 몰아붙입니다.\n\n이 시선은 사람을 너그럽게 만듭니다. 다만 결정론을 노력해도 소용없다는 말로 받아들이면 곤란합니다. 결정론에서도 밤샘 공부는 합격의 원인입니다. 원인을 아는 것과 손을 놓는 것은 다른 일입니다."}, "C": {"title": "능력을 보는 사람", "body": "모든 일에 원인이 있다는 걸 받아들이면서도, 앞을 내다보고 따져 보고 멈출 수 있는 능력을 자유라고 부르는 쪽입니다. 그래서 책임도 그 능력이 얼마나 남아 있었느냐에 따라 다르게 묻습니다.\n\n가장 균형 잡힌 자리처럼 보입니다. 다만 반대쪽에서는 이렇게 묻습니다. 그 능력을 갖고 태어난 것도, 그 능력을 길러 준 환경도 결국 내가 고른 게 아니지 않느냐고."}, "P": {"title": "흐름으로 보는 사람", "body": "나를 변하지 않는 하나로 보지 않고, 계속 바뀌며 이어지는 흐름으로 보는 쪽입니다. 술 몇 잔에, 종양 하나에, 세월에 사람은 달라집니다. 그래서 어제의 나를 너무 붙들지도, 남의 변화를 너무 원망하지도 않습니다.\n\n이 시선에서 죽음은 갑자기 들이닥치는 낯선 사건보다, 평생 겪어 온 작은 죽음들의 마지막에 가깝습니다. 다만 그 사실을 아는 것과 받아들이는 것 사이에는 꽤 긴 연습이 필요합니다."}};
const CONFIG={id:'free-will',title:'자유의지 시뮬레이터',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-free-will.html',version:5,
stages:[{"badge": "지금", "title": "이 화면을 닫을 자유", "desc": "지금 이 화면을 계속 볼 수도 있고, 바로 닫을 수도 있다. 누가 시키지 않았고, 무엇도 막지 않는다.\n\n둘 중 하나를 고르는 건 누구인가?", "highlight": "어떻게 생각하는가?", "choices": [{"id": "me1", "text": "\"당연히 나다. 닫고 싶으면 지금 닫을 수 있다.\"", "meaning": "대부분의 사람이 이렇게 답한다. 화면을 닫을지 말지 정하는 순간, 우리는 분명히 내가 정한다고 느낀다. 이 느낌이 없다면 결심도, 후회도, 책임도 성립하지 않는다.\n\n다만 정한다고 느끼는 그 순간보다 조금 먼저 뇌가 움직일 준비를 시작한다는 실험이 있다. 그 실험이 무엇을 뜻하는지는 아직 논쟁 중이다.", "principle": {"name": "행위자 인과", "desc": "당구공은 다른 공에 맞아서 굴러간다. 철학자 로더릭 치좀은 사람은 다르다고 봤다. 행동의 원인을 거슬러 올라가면 마지막에 나 자신이 있고, 나보다 앞선 원인은 없다는 것이다. 그는 이것을 흔히 신에게만 있다고 여겨 온 특권이라고 불렀다.", "icon": ""}}, {"id": "brain1", "text": "\"뇌가 먼저 정한다. 내가 골랐다는 느낌은 그 뒤에 따라온다.\"", "meaning": "결정은 뇌 안에서 먼저 끝나고, 내가 정했다는 느낌은 그 뒤에 도착한다는 생각이다. 실제로 사람이 마음먹었다고 느끼기 0.35초쯤 전에 뇌가 이미 움직일 준비를 시작한다는 실험 결과가 있다. 이 생각대로라면 내가 골랐다는 느낌은 결정의 원인이 될 수 없다. 이미 끝난 일을 뒤늦게 전해 듣는 셈이다.\n\n다만 이 실험을 다르게 읽는 과학자들도 있다. 뇌의 신호는 원래 쉬지 않고 오르내리는데, 손이 움직인 순간만 모아서 보면 미리 차오른 것처럼 보일 뿐이라는 것이다.", "principle": {"name": "준비 전위", "desc": "신경과학자 벤저민 리벳은 참가자들에게 손목을 까딱이고 싶을 때 까딱이게 하고, 마음먹은 순간을 기록하게 했다. 그런데 참가자가 마음먹었다고 느끼기 0.35초쯤 전에, 뇌는 이미 움직일 준비를 시작하고 있었다. 이 신호를 준비 전위라고 부른다.", "icon": ""}}, {"id": "same1", "text": "\"나랑 내 뇌가 따로 있나? 같은 말이다.\"", "meaning": "뇌가 고르는 것과 내가 고르는 것을 굳이 나눌 이유가 없다는 생각이다. 따져 보고, 망설이고, 결국 고르는 그 과정 전체가 나다. 그렇다면 뇌가 정했다는 말이 내가 정하지 않았다는 뜻이 되지는 않는다.\n\n다만 이렇게 보면, 뇌가 바뀌는 만큼 나도 바뀐다는 데까지 동의해야 한다.", "principle": {"name": "양립가능론", "desc": "모든 일에 원인이 있어도 자유의지는 있다고 보는 입장이다. 철학자 해리 프랭크퍼트는 책임을 물을 때 중요한 건 그 행동이 정말 그 사람 자신의 생각과 바람에서 나왔느냐라고 봤다. 그렇다면 결정론이 맞더라도 칭찬과 비난은 사라지지 않는다.", "icon": ""}}]}, {"badge": "술", "title": "술이 한 말", "desc": "술자리에서 평소라면 절대 안 했을 말이 나왔다. 다음 날 사람들은 말한다. \"술이 한 말이니까 신경 쓰지 마.\"\n\n흔히 하는 말이다. 그 말은 정말 누가 한 걸까?", "highlight": "어떻게 생각하는가?", "choices": [{"id": "alcohol2", "text": "\"술이 한 거다. 맨정신의 나라면 안 했다.\"", "meaning": "술은 판단을 맡는 뇌 앞쪽의 활동을 떨어뜨린다. 그 상태에서 나온 말은 평소의 내가 따져 보고 고른 말과 다르다. 그러니 그 말의 무게도 다르게 봐야 한다는 생각이다.\n\n다만 이걸 받아들이면 불편한 결론이 따라온다. 소주 몇 잔에 바뀌는 게 의지라면, 맨정신의 의지도 그날 잠을 얼마나 잤는지, 무엇을 먹었는지에 따라 조금씩 바뀌고 있다.", "principle": {"name": "알코올 근시", "desc": "심리학자 클로드 스틸과 로버트 조지프스는 술이 사람의 시야를 좁힌다고 봤다. 취하면 눈앞의 자극에만 반응하고, 그 행동이 가져올 결과나 평소의 원칙은 잘 떠올리지 못한다. 술에 취하면 다른 사람이 되는 것처럼 보이는 이유다.", "icon": ""}}, {"id": "truth2", "text": "\"술은 핑계다. 속에 있던 말이 나온 거다.\"", "meaning": "술이 없던 마음을 만들어 내지는 않는다. 평소에 눌러 두던 생각이 술기운에 밖으로 나왔을 뿐이라는 생각이다. 그러니 그 말도 결국 내 말이다.\n\n다만 그렇다면 맨정신의 나는 진짜 나를 숨기고 사는 셈이 된다. 취한 나와 맨정신의 나 중에 어느 쪽이 진짜인지 정하는 기준은 생각보다 분명하지 않다.", "principle": {"name": "인 비노 베리타스", "desc": "술 속에 진실이 있다는 뜻의 라틴어 격언이다. 로마의 학자 플리니우스도 이 말을 기록했다. 취한 사람은 숨기던 속마음을 드러낸다는 오래된 믿음을 담고 있다.", "icon": ""}}, {"id": "chose2", "text": "\"취할 걸 알면서 마신 것도 나다. 그러니 내 책임이다.\"", "meaning": "말하는 순간의 나는 판단력이 흐려져 있었다. 하지만 그렇게 될 줄 알면서 잔을 든 건 맨정신의 나였다. 책임은 그 순간으로 거슬러 올라간다는 생각이다. 법도 대체로 이렇게 본다.\n\n다만 이 논리는 언제 잔을 내려놓을지 판단할 수 있었다는 전제 위에 서 있다. 그 판단력마저 무너진 사람이라면 이야기가 달라진다.", "principle": {"name": "원인에서 자유로운 행위", "desc": "스스로 술을 마시거나 약을 먹어 판단력을 잃은 상태에서 저지른 일은, 판단력을 잃었다는 이유로 책임을 덜어 주지 않는다는 법 원칙이다. 판단력이 남아 있던 앞선 순간의 선택을 문제 삼는 것이다. 우리 형법에도 이 원칙이 들어 있다.", "icon": ""}}]}, {"badge": "종양", "title": "시계탑의 총성", "desc": "1966년 미국 텍사스, 대학생 찰스 휘트먼이 대학 시계탑 꼭대기에서 총을 쏴 열 명이 넘는 사람을 죽였다. 그는 전날 밤 이렇게 써 두었다. 요즘 나 자신을 잘 모르겠다. 내가 죽으면 내 뇌를 열어 이상이 있는지 확인해 달라.\n\n부검 결과, 두려움과 공격성을 다루는 편도체 근처에서 종양이 나왔다.", "highlight": "총을 쏜 건 누구인가?", "choices": [{"id": "whitman3", "text": "휘트먼이다. 방아쇠를 당긴 건 그 사람이다.", "meaning": "같은 자리에 종양이 있어도 사람을 쏘지 않은 사람은 있을 것이다. 종양이 충동을 키웠을 수는 있지만, 계획하고 총을 챙기고 탑에 오른 건 휘트먼이었다는 생각이다. 대부분의 법정이 이 생각 위에 서 있다.\n\n다만 휘트먼 자신이 스스로를 모르겠다고 썼다. 그 낯선 생각들이 어디서 오는지 그도 알지 못했다.", "principle": {"name": "응보주의", "desc": "잘못한 사람은 그 잘못에 맞는 벌을 받아 마땅하다는 생각이다. 벌의 이유를 사회를 지키거나 사람을 고치는 데서 찾지 않고, 저지른 잘못 그 자체에서 찾는다. 칸트는 사회가 해체되는 날에도 감옥에 남은 마지막 살인자는 처형해야 한다고 썼을 만큼 이 원칙을 엄격하게 봤다.", "icon": ""}}, {"id": "tumor3", "text": "종양이다. 휘트먼도 병의 피해자다.", "meaning": "멀쩡하던 사람이 뇌에 혹이 생긴 뒤 살인자가 됐다면, 그 혹을 원인으로 보는 게 자연스럽다. 휘트먼은 살인자이기 전에 환자였다는 생각이다.\n\n다만 이 논리는 종양에서 멈추지 않는다. 종양은 눈에 보이는 원인일 뿐이고, 유전자와 자란 환경도 똑같이 뇌를 만든다. 그렇다면 모든 범죄자가 피해자가 된다.", "principle": {"name": "브레이크 고장 난 자동차", "desc": "신경생물학자 로버트 사폴스키는 누구도 벌받아 마땅하지 않다고 본다. 사람의 행동은 유전자, 호르몬, 자란 환경이 만든 결과이기 때문이다. 그는 브레이크가 고장 난 차를 예로 든다. 그런 차는 도로에서 치워야 하지만, 차를 미워하거나 차가 벌받아 마땅하다고 말하는 사람은 없다.", "icon": ""}}, {"id": "capacity3", "text": "멈출 힘을 종양이 빼앗았다면, 책임도 그만큼 줄어든다.", "meaning": "원인이 있다는 것만으로 책임이 사라지지는 않는다. 중요한 건 휘트먼이 자기 충동을 따져 보고 멈출 능력을 갖고 있었느냐다. 종양이 그 능력을 망가뜨렸다면, 멀쩡한 뇌로 범죄를 계획한 사람과 똑같이 볼 수는 없다는 생각이다.\n\n다만 그 능력이 얼마나 남아 있었는지는 아무도 잴 수 없다. 조사위원회도 종양이 영향을 줬을 가능성을 배제하지 못했다는 데서 멈췄다.", "principle": {"name": "가질 만한 자유", "desc": "철학자 대니얼 데닛은 우주가 정해진 대로 굴러간다 해도, 앞을 내다보고 따져 보고 하려던 일을 멈출 수 있는 존재는 그럴 수 없는 존재와 다르다고 봤다. 날아오는 공을 보고 고개를 숙이는 사람도 원자로 이루어져 있지만, 피하지 못하는 돌멩이와는 다르다. 데닛은 우리가 가질 만한 자유가 바로 이 능력이라고 했다.", "icon": ""}}, {"id": "other3", "text": "총을 쏜 사람은 이미 원래의 휘트먼이 아니었다.", "meaning": "종양이 자라는 동안 휘트먼의 뇌는 조금씩 바뀌었고, 그와 함께 그 사람도 바뀌었다. 탑에 오른 사람은 가족이 알던 휘트먼과 이름만 같은 다른 사람이었을 수 있다는 생각이다.\n\n다만 그렇다면 언제부터 다른 사람이었는지 물어야 한다. 하루아침에 바뀐 게 아니라면, 경계를 그을 수 있는 날은 없다.", "principle": {"name": "테세우스의 배", "desc": "영웅 테세우스의 배를 오래 보존하면서 썩은 널빤지를 하나씩 새것으로 갈았다. 처음 널빤지가 하나도 남지 않았을 때, 그 배는 여전히 테세우스의 배인가. 플루타르코스가 전한 이 질문은 조금씩 바뀌는 것이 언제까지 같은 것인지를 묻는 대표적인 사고실험이다.", "icon": ""}}]}, {"badge": "치매", "title": "두 사람의 뜻", "desc": "치매는 기억만 앗아 가지 않는다. 평생 점잖던 사람이 가족에게 욕을 하고, 아끼던 물건을 내다 버린다.\n\n건강할 때 그는 이렇게 말해 두었다. \"내가 나를 잃으면, 억지로 생명을 늘리지 말아 달라.\" 그런데 지금의 그는 하루하루를 웃으며 지낸다. 그리고 폐렴이 왔다.", "highlight": "누구의 뜻을 따라야 할까?", "choices": [{"id": "past4", "text": "건강할 때의 뜻. 그때가 온전한 판단이었다.", "meaning": "따져 보고 내다볼 수 있을 때 내린 결정이 더 무겁다는 생각이다. 지금 병든 뇌가 원하는 것보다, 자기 삶 전체를 생각하며 남긴 뜻이 그 사람의 진짜 뜻이라는 것이다. 연명의료 의향서가 이 생각 위에 서 있다.\n\n다만 그 결정을 지금 웃고 있는 사람에게 적용하기는 쉽지 않다. 그때의 그는 지금의 자신이 이렇게 웃게 될 줄 몰랐다.", "principle": {"name": "선행 자율성", "desc": "법철학자 로널드 드워킨은 사람이 건강할 때 자기 삶 전체를 내다보고 내린 결정은, 판단력을 잃은 뒤에도 존중받아야 한다고 봤다. 그는 지금 무엇을 원하느냐보다, 자기 삶이 어떤 모습으로 끝나기를 바랐느냐가 더 중요하다고 했다.", "icon": ""}}, {"id": "now4", "text": "지금의 뜻. 지금 웃고 있는 사람도 그 사람이다.", "meaning": "과거의 그가 남긴 말이, 지금 즐겁게 지내는 사람의 생명까지 정할 수 있는지 의문이라는 생각이다. 지금 그가 원하고 즐기는 것도 진짜다.\n\n다만 이렇게 보면 건강할 때 남긴 말은 그 사람이 변하는 순간 힘을 잃는다. 어떤 의미에서 그때의 그는 이미 떠난 셈이다.", "principle": {"name": "드레서의 반론", "desc": "법학자 레베카 드레서는 드워킨에게 반론했다. 치매에 걸린 사람은 과거의 그와 생각도, 관심도, 즐거움도 다르다. 그렇다면 과거의 그가 남긴 지시가 지금 이 사람의 삶을 마음대로 정할 수는 없다는 것이다.", "icon": ""}}, {"id": "proxy4", "text": "그 사람이라면 지금 뭘 원했을지, 가족이 대신 판단한다.", "meaning": "건강할 때 한 말을 문자 그대로 따르지도, 지금의 웃음만 보지도 않는다. 그 사람을 가장 잘 아는 가족이, 그라면 이 상황에서 무엇을 골랐을지 따져 본다는 생각이다. 그 사람의 뜻이 여전히 이어지고 있다고 보는 것이다.\n\n다만 가족이 짐작한 그의 뜻에는 가족의 바람이 섞이기 쉽다. 그 사람의 뜻과 내 뜻을 가려내는 건 생각보다 어렵다.", "principle": {"name": "대리 판단", "desc": "스스로 결정할 수 없게 된 환자를 대신해, 그 사람이 판단력이 있었다면 무엇을 골랐을지를 가족 등이 추정해 결정하는 원칙이다. 1976년 미국 뉴저지주 대법원의 캐런 앤 퀸런 판결 이후 의료 윤리에 자리 잡았다.", "icon": ""}}, {"id": "best4", "text": "누구의 뜻보다, 지금 그에게 가장 이로운 쪽을 고른다.", "meaning": "그때의 뜻도 지금의 뜻도 결국 그때그때의 뇌가 원한 것이다. 흔들리는 뜻을 따르기보다, 고통은 줄이고 이로움은 늘리는 쪽을 따지는 게 낫다는 생각이다.\n\n다만 무엇이 그에게 이로운지 남이 판단하는 순간, 그 사람의 뜻은 결정에서 빠진다. 평생 자기 삶을 스스로 정해 온 사람에게는 그것도 하나의 상실이다.", "principle": {"name": "최선의 이익", "desc": "본인의 뜻을 알 수 없거나 따르기 어려울 때, 그 사람에게 무엇이 가장 이로운지를 기준으로 치료를 정하는 원칙이다. 어린아이나 의사 결정 능력을 잃은 환자의 치료를 정할 때 널리 쓰인다.", "icon": ""}}]}, {"badge": "죽음", "title": "마지막 선택", "desc": "죽으면 뇌가 멈추고, 고르는 일도 함께 멈춘다. 술 몇 잔에도, 작은 종양에도, 병에도 흔들리던 의지가 죽음 뒤에 남아 있을 거라고 믿기는 어렵다.\n\n그렇다면 지금 이 순간 고른다고 느끼는 이 자유는 무엇일까?", "highlight": "어떻게 받아들이겠는가?", "choices": [{"id": "daily5", "text": "\"나는 이미 조금씩 죽고 있었다. 10년 전의 나도 지금은 없다.\"", "meaning": "10년 전 내가 내린 결정 중에는 지금의 내가 이해하지 못하는 것도 있다. 그때의 생각, 그때의 취향, 그때의 두려움은 이미 사라졌다. 사람은 어느 날 한 번에 죽는다기보다, 매일 조금씩 죽고 새로 태어난다는 생각이다.\n\n이렇게 보면 죽음은 평생 겪어 온 작은 죽음들의 마지막 한 걸음에 가깝다. 그리고 지금의 나로 고를 수 있는 날도 생각보다 많지 않다.", "principle": {"name": "우리는 매일 죽는다", "desc": "세네카는 편지에 이렇게 썼다. 우리는 매일 죽는다. 날마다 삶의 일부가 떨어져 나가기 때문이다. 철학자 데릭 파핏은 내가 시간이 지나도 변하지 않는 단단한 하나라는 믿음을 내려놓은 뒤, 죽음이 덜 두렵게 느껴졌다고 썼다.", "icon": ""}}, {"id": "hold5", "text": "\"그래서 고를 수 있는 지금, 제대로 고르겠다.\"", "meaning": "의지가 언젠가 끝난다는 건 바꿀 수 없다. 그렇다면 고를 수 있는 지금이 더 귀하다는 생각이다. 어떤 생각을 붙들고 살지, 오늘 누구에게 연락할지는 아직 내가 정할 수 있다.\n\n다만 이런 다짐은 오래가지 않는다. 죽음을 가까이 느낀 날의 결심은 일상으로 돌아오면 금방 흐려진다.", "principle": {"name": "르누비에의 정의", "desc": "철학자 윌리엄 제임스는 몇 달째 우울에 빠져 아무 일도 못 하다가, 샤를 르누비에의 글에서 한 문장을 읽었다. 자유의지란 다른 생각도 할 수 있는데 이 생각을 계속 붙들고 있기로 마음먹는 것이다. 제임스는 일기에 이렇게 적었다. 자유의지로 하는 나의 첫 번째 행동은, 자유의지를 믿는 것이다.", "icon": ""}}, {"id": "end5", "text": "\"끝이면 끝이다. 뇌가 하던 일이 멈출 뿐이다.\"", "meaning": "의지가 뇌가 하는 일이라면, 뇌가 멈출 때 의지도 멈춘다. 그 뒤에 고통을 느낄 나도 없으니 두려워할 것도 없다는 생각이다. 가장 담담한 받아들임이다.\n\n다만 이 생각은 죽은 뒤에 대한 두려움은 덜어 주지만, 죽기 전까지의 시간을 어떻게 쓸지는 알려 주지 않는다.", "principle": {"name": "에피쿠로스의 죽음관", "desc": "에피쿠로스는 죽음이 우리에게 아무것도 아니라고 했다. 우리가 있을 때 죽음은 없고, 죽음이 왔을 때 우리는 이미 없다. 그러니 죽음을 미리 두려워할 이유가 없다는 것이다.", "icon": ""}}]}],
calculateResult(choices,principles){
  const c={L:0,D:0,C:0,P:0};choices.forEach(x=>{const k=SIDE[x.choiceId];if(k)c[k]++;});
  const m=Math.max(c.L,c.D,c.C,c.P);const k=['P','C','L','D'].find(t=>c[t]===m);const r=RES[k];
  return {icon:'',label:'당신은',title:r.title,desc:r.body,stats:[{value:c.L+'번',label:'나'},{value:c.D+'번',label:'원인'},{value:c.C+'번',label:'능력'},{value:c.P+'번',label:'흐름'}]};
},
getShareText(t){return '자유의지 시뮬레이터\n\n나는 '+t+'\n\n내 선택은 정말 내가 한 걸까?\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-free-will.html';}
