const SIDE={"cause1": "D", "self1": "L", "want1": "C", "chance1": "D", "story2": "D", "taste2": "L", "weigh2": "C", "make2": "W", "send3": "D", "stop3": "L", "away3": "C", "punish4": "L", "car4": "D", "able4": "C", "react4": "W", "brain5": "D", "hold5": "W", "life5": "C", "now5": "W"};
const RES={"L": {"title": "스스로 움직이는 사람", "body": "배고픔도, 끌림도, 상처도 있었지만 마지막에 정한 건 나라고 보는 쪽입니다. 그래서 핑계를 대기보다 책임을 지고, 다음에는 다르게 할 수 있다고 믿습니다. 철학자 로더릭 치좀은 이것을 신에게만 있다고 여겨 온 특권이라고 불렀습니다.\n\n이 믿음은 사람을 일으켜 세웁니다. 다만 같은 잣대를 남에게 댈 때는 조심해야 합니다. 그 사람이 마지막 순간에 무엇을 정할 수 있었는지는, 그의 뇌와 지나온 삶을 다 들여다보기 전에는 알 수 없습니다."}, "D": {"title": "원인을 보는 사람", "body": "어떤 선택 앞에서도 그 선택을 만든 원인을 먼저 보는 쪽입니다. 배고픔, 끌림, 자라 온 환경, 뇌. 그래서 남을 쉽게 미워하지 않고, 나 자신도 덜 몰아붙입니다.\n\n이 시선은 사람을 너그럽게 만듭니다. 다만 결정론을 노력해도 소용없다는 말로 받아들이면 곤란합니다. 결정론에서도 밤샘 공부는 합격의 원인입니다. 원인을 아는 것과 손을 놓는 것은 다른 일입니다."}, "C": {"title": "능력을 보는 사람", "body": "모든 일에 원인이 있다는 걸 받아들이면서도, 앞을 내다보고 따져 보고 멈출 수 있는 능력을 자유라고 부르는 쪽입니다. 그래서 책임도 그 능력이 얼마나 남아 있었느냐에 따라 다르게 묻습니다.\n\n가장 균형 잡힌 자리처럼 보입니다. 다만 반대쪽에서는 이렇게 묻습니다. 그 능력을 갖고 태어난 것도, 그 능력을 길러 준 환경도 결국 내가 고른 게 아니지 않느냐고."}, "W": {"title": "믿기로 하는 사람", "body": "자유의지가 있는지 없는지는 증명할 수 없다고 인정하고, 그렇다면 어느 쪽을 믿고 사는 게 나은지를 묻는 쪽입니다. 우울에 빠져 있던 윌리엄 제임스가 고른 길이기도 합니다. 그는 자유의지로 하는 첫 번째 행동은 자유의지를 믿는 것이라고 적었습니다.\n\n이 선택은 오늘을 움직이게 합니다. 다만 의지가 언제까지 내 것일지는 아무도 모릅니다. 그래서 이 믿음은 언젠가 끝이 온다는 사실을 늘 곁에 두고 갑니다."}};
const CONFIG={id:'free-will',title:'자유의지 시뮬레이터',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-free-will.html',version:5,
stages:[{"badge": "결정", "title": "새벽 1시의 라면", "desc": "이번 주는 야식을 끊기로 했다. 그런데 새벽 1시, 정신을 차려 보니 냄비에 물을 올리고 있다.\n\n다음 날 아침, 같이 다이어트하는 친구가 한마디 한다. \"의지가 약하네.\"", "highlight": "뭐라고 답하겠는가?", "choices": [{"id": "cause1", "text": "\"그 시간에 그 배고픔이면 누구라도 끓였어.\"", "meaning": "피곤했고, 배가 고팠고, 찬장에 라면이 있었다. 이 조건이 다 갖춰진 순간 결과는 사실상 정해져 있었다는 생각이다. 원인을 다 알면 결과도 계산할 수 있다는 결정론의 출발점이다.\n\n다만 친구는 같은 배고픔을 참았을 수 있다. 그렇다면 차이를 만든 건 무엇이었을까. 결정론은 그것도 원인이라고 답한다. 친구와 나는 서로 다른 원인을 지닌 사람일 뿐이라는 것이다.", "principle": {"name": "라플라스의 악마", "desc": "수학자 피에르시몽 라플라스는 우주의 모든 원자가 어디에 있고 어떤 힘을 받는지 다 아는 존재를 상상했다. 그 존재는 앞으로 일어날 일을 모두 계산해 낼 수 있다. 모든 일이 앞선 원인들로 이미 정해져 있다는 결정론을 가장 선명하게 보여 주는 사고실험이다.", "icon": ""}}, {"id": "self1", "text": "\"참을 수도 있었어. 끓인 건 내 선택이야.\"", "meaning": "배가 고팠던 것도, 라면이 있었던 것도 사실이다. 그래도 마지막에 냄비를 꺼낸 건 나였다는 생각이다. 그래서 핑계를 대지 않고 책임을 진다. 다음에는 참을 수 있다는 믿음도 여기서 나온다.\n\n다만 참을 수도 있었다는 말은 확인할 방법이 없다. 그날 밤을 똑같은 조건으로 한 번 더 돌려 볼 수는 없기 때문이다.", "principle": {"name": "행위자 인과", "desc": "당구공은 다른 공에 맞아서 굴러간다. 철학자 로더릭 치좀은 사람은 다르다고 봤다. 행동의 원인을 거슬러 올라가면 마지막에 나 자신이 있고, 나보다 앞선 원인은 없다는 것이다. 그는 이것을 흔히 신에게만 있다고 여겨 온 특권이라고 불렀다.", "icon": ""}}, {"id": "want1", "text": "\"끓인 건 나 맞아. 근데 먹고 싶어진 건 내가 고른 게 아니잖아.\"", "meaning": "먹을지 말지는 내가 정했다. 하지만 새벽 1시에 라면이 당기는 마음은 어느 순간 그냥 생겨났다. 원하는 대로 하는 것과, 무엇을 원할지 고르는 것은 다른 문제라는 생각이다.\n\n다만 이렇게 나누고 나면 질문이 하나 남는다. 원하는 마음을 내가 고르지 못한다면, 야식을 끊겠다던 결심은 누가 한 걸까.", "principle": {"name": "행위의 자유와 의지의 자유", "desc": "쇼펜하우어는 자유를 둘로 나눴다. 원하는 대로 할 수 있는 행위의 자유, 그리고 무엇을 원할지 고르는 의지의 자유. 그는 사람에게 앞의 것은 있지만 뒤의 것은 없다고 봤다. 사람은 원하는 것을 할 수는 있지만, 무엇을 원할지는 원할 수 없다.", "icon": ""}}, {"id": "chance1", "text": "\"별 이유 없어. 그냥 그 순간 그렇게 됐어.\"", "meaning": "딱히 이유를 댈 수 없는 선택도 있다. 그 순간 그냥 그렇게 됐다는 것이다. 정해진 원인 없이 일어난 일이라면 적어도 결정론에서는 벗어난 셈이다.\n\n다만 아무 원인 없이 저절로 일어난 일을 두고 내가 했다고 말하기도 어렵다. 이유 없이 손이 저절로 튀어 오르면, 우리는 그걸 경련이라고 부른다.", "principle": {"name": "자유의지의 딜레마", "desc": "선택에 원인이 있으면 원인이 정한 것이고, 원인이 없으면 우연이 정한 것이다. 어느 쪽이든 내가 정했다고 말하기 어렵다. 양자역학이 세상에 우연이 있다는 걸 보여 줘도 자유의지 문제가 풀리지 않는 이유다.", "icon": ""}}]}, {"badge": "이유", "title": "왜 그 회사야", "desc": "두 회사에 합격했다. 연봉도 거리도 비슷했는데, 결국 한 곳을 골랐다.\n\n친구가 묻는다. \"왜 거기야?\" 대답은 술술 나온다. 성장 가능성, 분위기, 복지. 그런데 사실 처음 마음이 기운 건 면접 날 본 사무실 창밖 풍경이었다.", "highlight": "그 대답들은 뭐였을까?", "choices": [{"id": "story2", "text": "\"이유는 나중에 붙인 거지. 그냥 끌렸던 거야.\"", "meaning": "고르는 건 이미 끝났고, 말로 하는 이유는 그 뒤에 따라 나왔다는 생각이다. 솔직한 인정이다. 실제로 뇌는 자기가 왜 그랬는지 모를 때도 그럴듯한 이유를 망설임 없이 지어낸다.\n\n다만 이렇게 보면 이유는 나중에 붙였다는 지금의 설명도, 나중에 붙인 이유일 수 있다.", "principle": {"name": "해석기", "desc": "좌뇌와 우뇌를 잇는 신경 다발이 끊어진 환자의 우뇌에만 '걸어라'라는 글자를 보여 주면, 환자는 일어나 걷는다. 왜 걷느냐고 물으면 글자를 보지 못한 좌뇌가 망설임 없이 답한다. 콜라를 가져오려고요. 신경과학자 마이클 가자니가는 이렇게 이유를 지어내는 좌뇌의 역할을 해석기라고 불렀다.", "icon": ""}}, {"id": "taste2", "text": "\"창밖이 좋았던 것도 내 취향이야. 내가 뭘 원하는지 아니까 고른 거지.\"", "meaning": "끌림도 결국 내 취향에서 나왔고, 나는 내가 뭘 원하는지 안다는 생각이다. 그러니 이 선택은 온전히 내 것이다.\n\n다만 무엇을 원하는지 아는 것과, 왜 그걸 원하게 됐는지 아는 것은 다르다. 창밖 풍경에 마음이 기우는 그 취향이 어디서 왔는지 물으면 대답이 막힌다.", "principle": {"name": "스피노자의 돌", "desc": "스피노자는 이렇게 썼다. 누군가 던진 돌이 날아가면서 생각할 수 있다면, 그 돌은 자기가 날고 싶어서 날고 있다고 믿을 것이다. 사람들이 자기가 자유롭다고 믿는 이유도 같다. 자기가 무엇을 원하는지는 알지만, 왜 그걸 원하게 됐는지는 모르기 때문이다.", "icon": ""}}, {"id": "weigh2", "text": "\"끌림으로 시작했어도, 따져 보고 결정한 건 나야.\"", "meaning": "첫 끌림은 내가 고르지 않았다. 하지만 그 뒤에 연봉을 비교하고 출퇴근을 계산했고, 아니다 싶으면 뒤집을 수도 있었다. 그 과정을 거쳤다면 이 결정은 내 것이라는 생각이다.\n\n다만 따져 볼 때 무엇을 더 무겁게 쳤는지도, 처음 기운 마음 쪽으로 이미 기울어 있었을 수 있다.", "principle": {"name": "양립가능론", "desc": "모든 일에 원인이 있어도 자유의지는 있다고 보는 입장이다. 철학자 해리 프랭크퍼트는 책임을 물을 때 중요한 건 그 행동이 정말 그 사람 자신의 생각과 바람에서 나왔느냐라고 봤다. 그렇다면 결정론이 맞더라도 칭찬과 비난은 사라지지 않는다.", "icon": ""}}, {"id": "make2", "text": "\"이유야 어쨌든, 고른 이상 잘한 선택으로 만들면 돼.\"", "meaning": "왜 골랐는지 끝까지 파고들어 봐야 답이 나오지 않는다. 그렇다면 고른 다음에 무엇을 하느냐가 더 중요하다는 생각이다. 출근 첫날부터 마음가짐이 달라진다.\n\n다만 이 태도는 왜 골랐느냐는 질문에 답하지 않는다. 잠시 옆으로 치워 둘 뿐이다.", "principle": {"name": "실용주의", "desc": "철학자 윌리엄 제임스는 끝내 결론이 나지 않는 논쟁 앞에서 이렇게 물으라고 했다. 이쪽이 맞다면 저쪽이 맞을 때와 비교해 내 삶에서 무엇이 달라지는가. 생각의 값어치를 그것이 삶에서 만들어 내는 차이로 따지는 태도를 실용주의라고 부른다.", "icon": ""}}]}, {"badge": "멈춤", "title": "새벽의 메시지", "desc": "헤어진 지 석 달. 잠이 안 와서 그 사람 프로필을 보다가 메시지 창을 열었다.\n\n\"잘 지내?\" 세 글자를 쳤다. 이제 전송 버튼만 누르면 된다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "send3", "text": "보낸다. 생각보다 손이 먼저 나갔다.", "meaning": "망설이는 척했지만 마음은 이미 정해져 있었고, 손가락은 그걸 따라갔을 뿐이다. 실제로 뇌는 내가 결심했다고 느끼기 조금 전부터 움직일 준비를 시작한다는 실험 결과가 있다.\n\n다만 그 실험을 다르게 읽는 과학자들도 있다. 뇌의 신호는 원래 쉬지 않고 오르내리는데, 손이 움직인 순간만 모아서 보면 미리 차오른 것처럼 보일 뿐이라는 것이다. 손이 먼저 나갔다는 느낌만으로 내가 결정하지 않았다고 말하기는 이르다.", "principle": {"name": "준비 전위", "desc": "신경과학자 벤저민 리벳은 참가자들에게 손목을 까딱이고 싶을 때 까딱이게 하고, 마음먹은 순간을 기록하게 했다. 그런데 참가자가 마음먹었다고 느끼기 0.35초쯤 전에, 뇌는 이미 움직일 준비를 시작하고 있었다. 이 신호를 준비 전위라고 부른다.", "icon": ""}}, {"id": "stop3", "text": "지운다. 보내고 싶지만, 안 보내기로 한다.", "meaning": "보내고 싶은 마음이 드는 것까지는 어쩔 수 없다. 하지만 그 마음대로 할지 말지는 내가 정할 수 있다는 생각이다. 다음 날 아침, 보내지 않은 나에게 조금 안도한다.\n\n다만 멈추기로 한 그 결심은 어디서 왔을까. 그것마저 뇌가 먼저 준비한 일이라면, 멈춘 것도 내가 한 일이라고 말할 수 있을지 다시 질문이 된다.", "principle": {"name": "거부권", "desc": "리벳은 자기 실험이 자유의지를 없앤다고 보지 않았다. 뇌가 움직임을 준비한 뒤에도 실제로 손이 움직이기 전 0.2초쯤의 틈이 있고, 그 사이에 움직임을 취소할 수 있다고 봤다. 하고 싶은 마음은 고를 수 없어도, 그 마음을 막을 수는 있다는 것이다.", "icon": ""}}, {"id": "away3", "text": "폰을 거실에 두고 잔다. 내일 아침의 나한테 맡긴다.", "meaning": "새벽의 내가 약하다는 걸 안다. 그래서 지금의 나를 믿는 대신, 아예 보낼 수 없는 상황을 만든다. 앞일을 내다보고 자기 행동을 미리 바꿔 두는 것이다.\n\n다만 이렇게 피해 간 마음은 사라지지 않는다. 다음 새벽에 다시 찾아온다.", "principle": {"name": "가질 만한 자유", "desc": "철학자 대니얼 데닛은 우주가 정해진 대로 굴러간다 해도, 앞을 내다보고 따져 보고 하려던 일을 멈출 수 있는 존재는 그럴 수 없는 존재와 다르다고 봤다. 날아오는 공을 보고 고개를 숙이는 사람도 원자로 이루어져 있지만, 피하지 못하는 돌멩이와는 다르다. 데닛은 우리가 가질 만한 자유가 바로 이 능력이라고 했다.", "icon": ""}}]}, {"badge": "책임", "title": "뉴스 속 가해자", "desc": "길에서 행인을 폭행한 남자의 재판 기사가 떴다. 변호인은 남자가 어릴 때부터 아버지에게 오랫동안 맞으며 자랐다고 했다.\n\n댓글 창이 갈렸다.", "highlight": "어느 쪽에 가까운가?", "choices": [{"id": "punish4", "text": "\"맞고 자란 사람이 다 남을 때리진 않는다. 벌 받아야 한다.\"", "meaning": "같은 상처를 안고도 남을 해치지 않고 사는 사람이 많다. 그러니 마지막에 주먹을 휘두르기로 한 건 그 사람이고, 그 몫의 벌은 그 사람이 받아야 한다는 생각이다. 대부분의 법정이 이 생각 위에 서 있다.\n\n다만 맞고 자라고도 남을 때리지 않은 사람들은, 그렇게 버틸 수 있게 해 준 다른 무언가를 가졌을 수 있다. 좋은 선생님 한 명이나 타고난 기질 같은 것들이다.", "principle": {"name": "응보주의", "desc": "잘못한 사람은 그 잘못에 맞는 벌을 받아 마땅하다는 생각이다. 벌의 이유를 사회를 지키거나 사람을 고치는 데서 찾지 않고, 저지른 잘못 그 자체에서 찾는다. 칸트는 사회가 해체되는 날에도 감옥에 남은 마지막 살인자는 처형해야 한다고 썼을 만큼 이 원칙을 엄격하게 봤다.", "icon": ""}}, {"id": "car4", "text": "\"그렇게 자란 사람한테 똑같이 책임을 묻긴 어렵다. 격리는 하되.\"", "meaning": "그 사람이 그렇게 된 데는 그가 고르지 않은 원인들이 있다. 그렇다고 위험한 사람을 그냥 둘 수는 없다. 다른 사람을 지키기 위해 떼어 놓되, 미워할 이유는 없다는 생각이다.\n\n다만 이 논리를 끝까지 밀면 남을 도운 사람도 칭찬받을 이유가 사라진다. 좋은 일 역시 그 사람이 고르지 않은 원인들이 만든 결과이기 때문이다.", "principle": {"name": "브레이크 고장 난 자동차", "desc": "신경생물학자 로버트 사폴스키는 누구도 벌받아 마땅하지 않다고 본다. 사람의 행동은 유전자, 호르몬, 자란 환경이 만든 결과이기 때문이다. 그는 브레이크가 고장 난 차를 예로 든다. 그런 차는 도로에서 치워야 하지만, 차를 미워하거나 차가 벌받아 마땅하다고 말하는 사람은 없다.", "icon": ""}}, {"id": "able4", "text": "\"그 순간 스스로 멈출 수 있는 상태였는지 따져 봐야 한다.\"", "meaning": "원인이 있다는 사실만으로 책임이 사라지지는 않는다. 그래도 앞일을 따져 보고 행동을 멈출 수 있었던 사람과, 그 능력 자체가 망가진 사람은 다르게 봐야 한다는 생각이다. 법이 심신미약을 따지는 이유이기도 하다.\n\n다만 그 경계는 생각보다 흐리다. 맞고 자라며 생긴 상처가 멈추는 능력을 얼마나 깎았는지, 누가 정확히 잴 수 있을까.", "principle": {"name": "휘트먼의 종양", "desc": "1966년 대학생 찰스 휘트먼은 대학 시계탑 꼭대기에서 총을 쏴 열 명이 넘는 사람을 죽였다. 부검 결과 두려움과 공격성을 다루는 편도체 근처에서 종양이 나왔다. 둘 다 원인이 있더라도, 종양이 멈추는 능력을 앗아 간 사람과 멀쩡한 뇌로 범죄를 계획한 사람에게 똑같은 책임을 물을 필요는 없다는 논의가 여기서 나왔다.", "icon": ""}}, {"id": "react4", "text": "\"원인이 뭐든, 사람을 책임질 줄 아는 존재로 대해야 한다.\"", "meaning": "그를 고장 난 기계처럼 다루면, 그는 자기 행동을 돌아볼 이유가 없어진다. 화를 내고 책임을 묻는 건 그를 여전히 사람으로 대한다는 뜻이기도 하다는 생각이다.\n\n다만 이건 자유의지가 있다는 증명이 될 수 없다. 있다고 여기고 사는 편이 서로에게 낫다는 선택에 가깝다.", "principle": {"name": "반응적 태도", "desc": "철학자 피터 스트로슨은 자유의지 논쟁을 다른 쪽에서 봤다. 우리는 누군가 나를 해치면 분노하고, 도와주면 고마워한다. 스트로슨은 이런 반응이 사람을 사람으로 대하는 방식 그 자체이고, 형이상학 논쟁의 결과에 따라 내려놓을 수 있는 것이 아니라고 봤다.", "icon": ""}}]}, {"badge": "기억", "title": "나를 못 알아보는 할아버지", "desc": "명절에 요양원에 계신 할아버지를 뵈러 갔다. 할아버지가 한참 나를 보시더니 공손하게 물으셨다.\n\n\"누구시더라?\"", "highlight": "돌아오는 길, 어떤 생각이 드는가?", "choices": [{"id": "brain5", "text": "\"마음도 결국 뇌가 하는 일이구나.\"", "meaning": "평생 고집 세고 다정하던 할아버지가, 뇌가 변하자 다른 사람이 됐다. 그렇다면 지금 내 성격과 결심도 뇌가 하는 일이다. 원인을 알고 나니 할아버지를 서운해할 일도 아니다.\n\n다만 같은 논리는 나에게도 돌아온다. 뇌가 망가지는 순간 의지도 함께 사라진다면, 지금 내가 붙들고 있는 것들은 무엇일까.", "principle": {"name": "자유의지 회의론", "desc": "사람의 행동과 의지가 모두 뇌와 그 뇌를 만든 원인들로 설명된다면, 자유의지는 없다고 보는 입장이다. 중세 유럽은 뇌전증 발작을 악령에 씐 탓으로 여겼지만, 원인을 알게 된 지금은 아무도 환자를 탓하지 않는다. 회의론자들은 원인을 알게 될수록 비난도 사라진다고 본다.", "icon": ""}}, {"id": "hold5", "text": "\"아직 머리가 멀쩡할 때, 무엇을 붙들고 살지는 내가 정하겠다.\"", "meaning": "언젠가 의지가 사라질 수 있다는 건 바꿀 수 없다. 하지만 아직은 오늘 무슨 생각을 붙들고 살지 고를 수 있다고 믿기로 한다. 증명은 못 해도 그렇게 사는 쪽을 고른다.\n\n다만 이 믿음은 언제든 흔들린다. 몸이 아프거나 마음이 무너지는 날에는 붙들고 있던 생각부터 손에서 빠져나간다.", "principle": {"name": "르누비에의 정의", "desc": "철학자 윌리엄 제임스는 몇 달째 우울에 빠져 아무 일도 못 하다가, 샤를 르누비에의 글에서 한 문장을 읽었다. 자유의지란 다른 생각도 할 수 있는데 이 생각을 계속 붙들고 있기로 마음먹는 것이다. 제임스는 일기에 이렇게 적었다. 자유의지로 하는 나의 첫 번째 행동은, 자유의지를 믿는 것이다.", "icon": ""}}, {"id": "life5", "text": "\"기억은 잃으셨어도, 살아오며 하신 선택들은 할아버지 거다.\"", "meaning": "지금 할아버지가 나를 못 알아본다고 해서, 평생 가족을 위해 내린 결정들까지 없던 일이 되지는 않는다. 그 선택들은 그때의 할아버지가 한 것이라는 생각이다.\n\n다만 그때의 할아버지와 지금의 할아버지가 같은 사람이냐고 물으면 대답이 쉽지 않다. 무엇이 한 사람을 같은 사람으로 만드는지는 또 다른 오래된 질문이다.", "principle": {"name": "인격 동일성", "desc": "철학자 존 로크는 한 사람을 같은 사람으로 만드는 것을 기억의 이어짐에서 찾았다. 어제의 일을 기억하는 오늘의 나는 어제의 나와 같은 사람이다. 그렇다면 기억을 모두 잃은 사람은 어떻게 봐야 하는지가 이 이론의 오랜 숙제로 남았다.", "icon": ""}}, {"id": "now5", "text": "\"미뤄 둔 걸 더는 미루지 말아야겠다.\"", "meaning": "언젠가 내 의지도 내 것이 아니게 될 수 있다. 그렇다면 미뤄 둔 연락, 미뤄 둔 여행, 미뤄 둔 말을 지금 하는 수밖에 없다는 생각이다. 집에 도착하기 전에 부모님께 전화를 건다.\n\n다만 이런 다짐은 오래가지 않는다. 죽음을 가까이 느낀 날의 결심은 일상으로 돌아오면 금방 흐려진다.", "principle": {"name": "메멘토 모리", "desc": "죽음을 기억하라는 뜻의 라틴어 경구다. 스토아 철학자들은 죽음을 날마다 떠올리는 일을, 오늘을 미루지 않게 하는 훈련으로 여겼다. 세네카는 매일 저녁 하루를 마치 삶의 마지막 날처럼 정리하라고 권했다.", "icon": ""}}]}],
calculateResult(choices,principles){
  const c={L:0,D:0,C:0,W:0};choices.forEach(x=>{const k=SIDE[x.choiceId];if(k)c[k]++;});
  const m=Math.max(c.L,c.D,c.C,c.W);const k=['W','C','L','D'].find(t=>c[t]===m);const r=RES[k];
  return {icon:'',label:'당신은',title:r.title,desc:r.body,stats:[{value:c.L+'번',label:'나'},{value:c.D+'번',label:'원인'},{value:c.C+'번',label:'능력'},{value:c.W+'번',label:'믿음'}]};
},
getShareText(t){return '자유의지 시뮬레이터\n\n나는 '+t+'\n\n내 선택은 정말 내가 한 걸까?\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-free-will.html';}
};
