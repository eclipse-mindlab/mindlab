html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#1d1838;color:var(--paper);font-family:var(--read);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;overflow:hidden;max-width:calc(100vh * .56);margin:0 auto;box-shadow:0 0 0 100vmax #120f26}

.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}

const QFINAL={"soc":[{"q":"너 행복해지고 싶지?","o":[["당연하지","그럼 행복이 뭔지는 알아? 모르는 걸 어떻게 찾아가?"],["잘 모르겠어","좋아. 모른다는 걸 아는 데서 시작하는 거야. 나도 그거 하나는 알아."]]},{"q":"착하게 살면 손해 본다고 생각해?","o":[["좀 그렇지","돈을 잃는 거랑 내가 나쁜 사람이 되는 거, 뭐가 더 큰 손해야?"],["아니","왜? 남들 말 말고 네 이유로."]]},{"q":"옳은 일인데 위험하면, 할 거야?","o":[["상황 봐서","나는 하나만 따졌어. 이게 옳은 일인지 그른 일인지. 살지 죽을지는 그다음이었어."],["할 거야","말로는 쉽지. 나는 진짜 그 순간에도 살지 죽을지보다 옳은지부터 따졌어."]],"src":"소크라테스의 변론 28b"},{"q":"돈이 많으면 잘 사는 걸까?","o":[["거의 그렇지","돈을 어디에 써야 할지 모르는 부자도 잘 사는 거야?"],["아니","그럼 다들 왜 그렇게 돈을 원할까?"]]},{"q":"아무도 모르게 나쁜 짓 할 기회가 생기면?","o":[["할지도","솔직하네. 그럼 넌 남이 볼 때만 착한 거야?"],["안 해","왜? 들킬 일도 없는데. 그 이유가 진짜 너야."]]},{"q":"죽는 게 무서워?","o":[["응","죽음이 나쁜 건지 아는 사람, 본 적 있어? 모르는 걸 무서워하는 거네."],["별로","다들 무서워하는데, 넌 왜 안 무서워?"]]},{"q":"모르는 걸 아는 척한 적 있어?","o":[["있지","모른다고 하면 뭐가 그렇게 무서웠어?"],["거의 없어","정말? 오늘 들은 말 중에 진짜 아는 건 몇 개야?"]]},{"q":"너를 화나게 하는 건 상대야, 너야?","o":[["상대지","같은 말에도 안 화나는 날이 있지? 그날은 뭐가 달랐어?"],["나일지도","알아챘네. 그럼 고칠 수 있는 것도 너야."]]},{"q":"남들이 다 맞다고 하면 맞는 걸까?","o":[["대체로 그렇지","아테네 사람들은 다 나보고 틀렸대. 그럼 내가 틀린 거야?"],["아니","그럼 넌 뭘 보고 맞다고 해?"]]},{"q":"친구가 잘되면 솔직히 배 아파?","o":[["좀 아파","그게 시기야. 적이 잘될 땐 멀쩡한데 꼭 친구가 잘될 때 아파. 이상하지 않아?"],["안 아파","멋지다. 시기는 꼭 친구가 잘될 때 찾아오는데, 생각 깊은 사람한텐 잘 못 와."]],"src":"소크라테스 회상 3.9.8"},{"q":"말 잘하는 사람이 더 믿음 가?","o":[["솔직히 그래","나를 고발한 사람들도 말은 참 잘했어. 그런데 그 안에 참말은 거의 없었지."],["아니","나도 꾸민 말은 못 해. 떠오르는 대로, 참말만 하는 게 내 방식이야."]],"src":"소크라테스의 변론 17b-c"},{"q":"오늘 한 일 중에 네가 고른 건 몇 개야?","o":[["거의 다","정말? 고른 거랑 그냥 흘러간 거, 구분할 수 있어?"],["몇 개 안 돼","그럼 나머지는 누가 고른 걸까?"]]},{"q":"자기가 다 안다고 확신하는 사람, 주변에 있어?","o":[["있어","그 사람이랑 너, 사실 둘 다 모르는 건 비슷할 거야. 차이는 모른다는 걸 아느냐 하나지."],["나일지도","그렇게 말할 수 있으면 벌써 한 발 앞선 거야. 대부분은 그 말을 끝까지 못 하거든."]],"src":"소크라테스의 변론 21d"},{"q":"용기 있는 사람은 겁이 없는 사람일까?","o":[["응","겁이 없으면 낭떠러지로도 뛰어들겠네. 그것도 용기야?"],["아닐걸","그럼 무서운데도 하는 거? 무서워도 하기만 하면 다 용기야?"]]},{"q":"일 잘하는 사람은 다른 것도 잘 알까?","o":[["그렇겠지","내가 만난 장인들은 자기 일은 정말 잘 알았어. 그 때문에 더 큰 문제까지 안다고 착각하더라."],["아닐걸","맞아. 한 분야의 실력이 다른 데서는 오히려 눈을 가리기도 해."]],"src":"소크라테스의 변론 22d"},{"q":"요즘 제일 신경 쓰는 게 뭐야?","o":[["돈이랑 일","그것도 필요하지. 근데 너라는 사람이 나아지는 건 그만큼 챙기고 있어?"],["나 자신","그럼 오늘 너를 조금이라도 낫게 만든 일, 하나 말해 볼래?"]],"src":"소크라테스의 변론 29d-e"},{"q":"듣기 싫은 소리 해 주는 친구 있어?","o":[["있어, 귀찮아","나는 아테네의 등에였어. 덩치 큰 말이 졸지 않게 쏘아 대는 벌레. 귀찮아도 그런 친구가 너를 깨워."],["없어","그럼 졸기 쉬워. 아테네 사람들은 깨우는 나를 죽이고 다시 잠들었어. 넌 하나 찾아 둬."]],"src":"소크라테스의 변론 30e-31a"},{"q":"요즘 이건 꼭 맞다고 믿는 거 하나 있어?","o":[["있어","누가 반대하면, 왜 맞는지 세 가지 댈 수 있어?"],["딱히 없어","그럼 넌 뭘 기준으로 고르며 살아?"]]},{"q":"다들 하는데 혼자 안 한 적 있어?","o":[["있어","나도 그랬어. 다섯이 부당한 명령을 받았는데, 넷은 사람 잡으러 가고 나는 그냥 집에 갔지."],["없는 듯","쉽진 않지. 그래도 나는 죽음보다 옳지 않은 일에 끼는 게 더 싫었어."]],"src":"소크라테스의 변론 32c-d"},{"q":"하루를 돌아보는 시간, 따로 있어?","o":[["거의 없어","나는 날마다 나한테도 남한테도 캐물었어. 그게 사람이 할 수 있는 제일 좋은 일이야. 오늘 5분만 해 봐."],["가끔 있어","좋아. 돌아보지 않는 삶은 살 가치가 없다고, 나는 법정에서도 말했어."]],"src":"소크라테스의 변론 38a"},{"q":"궁지에 몰리면 뭐든 할 것 같아?","o":[["할지도","죽음을 피하는 건 어렵지 않아. 나쁜 짓을 피하는 게 훨씬 어려워. 그게 더 빨리 달려오거든."],["안 할래","그 마음 지켜. 나는 늙고 느려서 죽음한테 잡혔지만, 나쁜 짓한테는 안 잡혔어."]],"src":"소크라테스의 변론 39a-b"},{"q":"공부는 왜 하는 걸까?","o":[["시험 때문에","시험이 끝나면? 그다음에도 알고 싶은 게 남아 있어?"],["알고 싶어서","좋아. 그 마음이 철학이야. 철학은 원래 지혜를 사랑한다는 뜻이거든."]]},{"q":"남들이 날 오해하면 꼭 풀어야 해?","o":[["풀어야지","왜 모든 사람 생각에 그렇게 신경 써? 생각 깊은 사람들은 실제로 어땠는지 알 거야."],["그냥 둘래","나도 그래. 생각 깊은 사람들의 판단이면 충분해."]],"src":"크리톤 44c"},{"q":"칭찬이랑 아첨은 뭐가 달라?","o":[["진심이냐 아니냐","그 진심을 어떻게 알아? 듣기 좋은 말은 다 진심 같거든."],["모르겠어","나는 이렇게 봐. 듣는 사람을 더 좋게 만들면 칭찬, 기분만 좋게 하면 아첨."]]},{"q":"상황이 불리해지면 원래 생각 바꿔?","o":[["바꿀 때도","따져 봐서 더 나은 이유가 나오면 바꿔. 겁나서 바꾸는 건 안 돼."],["안 바꿔","나도 감옥에 갇혔다고 평소 믿던 이유를 버리진 않았어. 더 나은 이유가 나오기 전까진."]],"src":"크리톤 46b-c"},{"q":"오늘 들은 말 중에 진짜 맞는지 확인한 거 있어?","o":[["있어","멋지다. 어떻게 확인했어? 다음에 또 미심쩍은 말 들으면 그렇게 해 봐."],["없어","그럼 하나만 골라서 왜 맞는지 물어봐. 그게 내가 매일 한 일이야."]]},{"q":"넌 누구한테 배우고 싶어?","o":[["잘 아는 사람","잘 아는지 어떻게 알아? 말 잘하는 거랑 아는 건 달라."],["아무한테나","좋아. 나는 구두 고치는 사람한테도 물어보고 배웠어."]]},{"q":"그냥 사는 거랑 잘 사는 거, 달라?","o":[["다르지","그럼 넌 지금 어느 쪽이야? 나는 잘 산다는 건 옳게 사는 거라고 봐."],["비슷해","살아 있기만 하면 된다면 나도 감옥에서 도망쳤겠지. 나는 그게 옳은지부터 따졌어."]],"src":"크리톤 48b"},{"q":"정의가 뭐라고 생각해?","o":[["공평한 거","똑같이 나누면 늘 공평해? 아기랑 어른한테 밥을 똑같이 줘?"],["착하게 사는 거","그럼 착한 건 또 뭔데? 거봐, 질문이 끝이 없지."]]},{"q":"누가 나한테 못되게 굴면 갚아 줘?","o":[["갚아 줘야지","다들 그렇게 말하지. 그런데 나쁜 짓은 되갚을 때도 나쁜 짓이야. 상대가 뭘 했든."],["그냥 넘겨","나도 그 편이야. 부당하게 당했다고 부당하게 갚으면, 나도 똑같이 잘못하는 거니까."]],"src":"크리톤 49b-c"},{"q":"자칭 전문가, 뭘 보면 믿을 수 있어?","o":[["경력","나라면 직접 해낸 일을 보여 달라고 할 거야. 잘한다는 말만으로는 못 믿지."],["자격증","그것도 보지만, 나는 그 사람이 실제로 해낸 결과를 하나 보여 달라고 해."]]},{"q":"말싸움에서 이기는 게 중요해, 맞는 게 중요해?","o":[["이기는 거","이겼는데 틀렸으면, 넌 뭘 얻은 거야?"],["맞는 거","그럼 지는 걸 겁내지 마. 지면서 맞는 걸 배우기도 하니까."]]},{"q":"머리로는 괜찮은 줄 아는데 무서운 거 있어?","o":[["있어","네 안에 겁 많은 아이가 있는 거야. 그 아이한텐 매일 주문 외듯 말을 걸어 줘야 해."],["별로","좋네. 그래도 언젠가 떨리면 기억해. 머리가 아는 걸 마음한테도 자꾸 들려줘야 해."]],"src":"파이돈 77e"},{"q":"친구가 나쁜 짓을 하면 어떻게 해?","o":[["모른 척해","그 친구가 망가지는 걸 보고만 있는 게 친구야?"],["말해 줘","어떻게 말할 거야? 혼내는 것보다 물어보는 게 덜 아파."]]},{"q":"사람한테 몇 번 데이면 다 싫어지지?","o":[["그렇더라","사람 보는 눈 없이 덜컥 믿어서 그래. 잘 보면 아주 나쁜 사람도, 아주 좋은 사람도 드물어."],["아직 괜찮아","다행이야. 사람을 믿을 땐 덜컥 말고 잘 보고 믿어. 그래야 안 데여."]],"src":"파이돈 89d-90a"},{"q":"좋아하는 사람 말이면 더 믿게 돼?","o":[["그렇지","내 말도 그렇게 듣진 마. 누가 했는지 말고, 맞는 말인지만 봐."],["아니","좋아. 그럼 내 말도 틀린 것 같으면 있는 힘껏 반박해 줘."]],"src":"파이돈 91c"},{"q":"하루에 '왜?'라고 몇 번 물어?","o":[["거의 안 해","어릴 땐 하루에 백 번은 물었을걸. 그 질문들, 어디서 잃어버렸을까?"],["자주 해","좋아. 그럼 그 '왜' 하나 나한테도 던져 봐."]]},{"q":"확신했는데 틀린 적 있어?","o":[["있지","그럴 수 있어. 확신은 그럴듯한 말 한마디로도 생기거든. 아는 건 따져 봐야 생기고."],["별로","좋아. 그래도 확신이 들 때 한 번만 더 물어봐. 확신이랑 아는 건 달라."]],"src":"고르기아스 454e"},{"q":"거짓말이 필요한 순간도 있을까?","o":[["있지","그게 정말 상대를 위한 건지, 내가 편하려는 건지 따져 봤어?"],["없어","살인자가 친구 어디 있냐고 물어도? 그때도 사실대로 말할 거야?"]]},{"q":"누가 네 틀린 점 짚어 주면 어때?","o":[["좀 짜증 나","나는 반박당하는 게 더 좋아. 남 틀린 걸 고쳐 주는 것보다 내 틀린 걸 고치는 게 더 남거든."],["고맙지","같은 편이네. 틀린 생각을 품고 사는 것만큼 손해 보는 일은 없어."]],"src":"고르기아스 458a"},{"q":"겸손한 사람이랑 자신 없는 사람은 같을까?","o":[["비슷하지","자신 없는 사람은 묻지도 않아. 겸손한 사람은 모르니까 계속 묻지."],["다르지","어떻게 달라? 네 말로 한번 말해 봐."]]},{"q":"속이는 쪽, 속는 쪽 중 하나 골라야 하면?","o":[["속을래","나도 둘 다 싫지만, 꼭 골라야 하면 당하는 쪽이야. 나쁜 짓 하는 게 제일 큰 해악이거든."],["속일래","솔직하네. 그런데 속인 사람이 속은 사람보다 더 불쌍하다고 하면, 믿겨?"]],"src":"고르기아스 469b-c"},{"q":"부모님 말씀은 늘 옳을까?","o":[["대체로","대체로면, 아닐 때도 있다는 거네. 그건 어떻게 알아봐?"],["아닐 때도 있어","그럼 아닐 땐 어떻게 해? 사랑하면서 반대하는 거, 쉽지 않잖아."]]},{"q":"부자에 유명한 사람 보면 행복하겠다 싶어?","o":[["그렇지","나는 몰라. 어떻게 배웠고 얼마나 올바른지 모르면, 페르시아 왕이라도 행복한지 알 수 없어."],["모르지","맞아. 나는 행복을 그 사람이 얼마나 좋고 올바른 사람인지로 따져."]],"src":"고르기아스 470e"},{"q":"좋은 사람 되는 거, 배워서 될까?","o":[["응","그럼 누가 가르쳐? 나는 그런 선생을 평생 찾았는데."],["타고나는 거야","그럼 나쁜 사람은 영영 못 고치겠네. 정말 그럴까?"]]},{"q":"잘못하고 안 들키면 다행이야?","o":[["다행이지","병이 깊은데 수술이 무서워 의사를 피하는 거랑 비슷해. 병든 몸보다 병든 영혼으로 사는 게 더 비참해."],["찝찝해","그 찝찝함이 맞아. 대가를 치르는 건 쓰지만, 영혼을 고치는 약이야."]],"src":"고르기아스 479a-b"},{"q":"나쁜 짓 하고도 행복한 사람이 있을까?","o":[["있을걸","겉으로는 그렇겠지. 밤에 혼자 있을 때도 행복할까?"],["없을걸","나도 그렇게 봐. 나쁜 짓은 남보다 먼저 자기 영혼을 망쳐."]]},{"q":"남들한테 맞추느라 네 생각을 꺾은 적 있어?","o":[["있어","나는 세상 사람 모두랑 어긋나도, 나랑 어긋나는 것보단 낫다고 봐. 나랑은 평생 같이 살아야 하거든."],["없어","좋아. 남이랑은 어긋나도 돼. 나랑 어긋나면 평생 그 소리를 들으며 살아야 해."]],"src":"고르기아스 482b-c"},{"q":"갖고 싶은 게 끝없이 생겨?","o":[["끝이 없어","구멍 난 항아리 같네. 채워도 새니까 밤낮 부어야 해. 그게 정말 행복한 삶이야?"],["채우면 끝","좋아. 항아리가 멀쩡한 사람은 한번 채우면 더 붓지 않고 편히 쉬어."]],"src":"고르기아스 493e-494a"},{"q":"무서운 걸 피하는 게 똑똑한 거야?","o":[["응","다 피하면 지켜야 할 건 누가 지켜? 나는 전쟁터에서 다들 뛰어 도망칠 때도 뛰지 않았어."],["아니","그럼 피할 무서움이랑 맞설 무서움, 어떻게 구분해?"]]},{"q":"빌린 건 무조건 돌려줘야 해?","o":[["당연하지","친구가 칼을 맡겼다가 정신이 나간 채 돌려 달라고 하면? 그래도 돌려주는 게 옳아?"],["경우에 따라","그럼 정의는 '받은 걸 갚기'만으론 부족하네. 뭐가 더 필요할까?"]],"src":"국가 1권 331c"},{"q":"좋은 사람인 줄 알았는데 아니었던 친구 있어?","o":[["있었어","그 사람이 변한 걸까, 네가 잘못 본 걸까? 우린 좋아 보이는 거랑 좋은 걸 자주 헷갈려."],["없어","운이 좋네. 사람들은 좋아 보이는 사람이랑 정말 좋은 사람을 자주 헷갈려."]],"src":"국가 1권 334c-d"},{"q":"네가 제일 아끼는 건 뭐야?","o":[["사람","그 사람한테 그걸 말해 본 적 있어?"],["물건","그게 없어지면 너도 없어져?"]]},{"q":"별로인 사람이 리더 될 판이면 나설래?","o":[["나설래","좋은 사람들이 마지못해 맡는 이유가 그거야. 자기보다 못한 사람한테 다스려지는 게 제일 큰 벌이거든."],["그래도 싫어","그 마음 알아. 좋은 사람은 원래 돈이나 명예 때문에 그 자리를 탐내지 않아."]],"src":"국가 1권 347b-c"},{"q":"질문을 많이 하면 사람들이 싫어할까?","o":[["싫어하더라","맞아. 그래서 나는 사형까지 받았어. 그래도 멈추진 않았지."],["좋아하더라","운이 좋네. 그런 친구는 꼭 붙잡아."]]},{"q":"누가 가르쳐 줘야만 배울 수 있을까?","o":[["그렇지","보는 힘은 이미 네 안에 있어. 가르치는 건 그 눈을 밝은 쪽으로 돌려주는 거야."],["아닐걸","맞아. 나는 가르친 적 없어. 물어봤을 뿐인데 다들 자기 안에서 답을 찾더라."]],"src":"국가 7권 518b-c"},{"q":"너는 너한테 솔직해?","o":[["응","그럼 하나 물어볼게. 요즘 남 탓 한 거, 정말 남 탓이었어?"],["가끔 아니야","나도 그래. 그래서 나는 매일 나한테 질문했어."]]},{"q":"어딘가 내 반쪽이 있을 거라고 믿어?","o":[["믿어","그 반쪽이 나쁜 사람이어도 좋아? 아닐걸. 우린 결국 좋은 걸 사랑하는 거야."],["안 믿어","내 선생님 디오티마는 사랑이 반쪽 찾기가 아니래. 좋은 걸 계속 갖고 싶은 마음이래."]],"src":"향연 205e-206a"},{"q":"잘 사는 사람은 어떤 사람일까?","o":[["돈 많은 사람","돈은 많은데 매일 불안한 사람도 잘 사는 거야?"],["마음 편한 사람","좋아. 그럼 마음은 어떻게 해야 편해질까? 그게 다음 질문이야."]]},{"q":"누가 너를 실제보다 좋게 보면 어때?","o":[["기분 좋지","조심해. 나도 나를 우러러보던 친구한테 말했어. 잘 봐, 나 사실 별거 아닐 수도 있다고."],["부담돼","정직한 반응이야. 남이 기대하는 나랑 진짜 나는 다를 수 있으니까."]],"src":"향연 218e-219a"},{"q":"모르는 게 드러나면 창피해?","o":[["창피해","그 순간이 이득이야. 안다고 착각하던 때보다, 모르는 걸 안 지금 더 찾고 싶어지잖아."],["괜찮아","모르는 줄 알아야 알고 싶어져. 안다고 믿을 땐 아무도 안 물어봐."]],"src":"메논 84a-c"},{"q":"자신감은 많을수록 좋아?","o":[["좋지","생각 없이 덤비는 자신감은 오히려 해가 돼. 지혜가 같이 있어야 도움이 되지."],["적당히","그 '적당히'를 정하는 게 지혜야. 지혜 없는 용기는 그냥 무모함이고."]],"src":"메논 88b"},{"q":"외운 정답이 금방 날아간 적 있어?","o":[["자주","옳은 생각도 묶어 두지 않으면 도망가. 왜 맞는지 이유로 묶어야 진짜 앎이 돼."],["잘 안 잊어","그럼 이유까지 알고 외웠나 보다. 이유로 묶인 생각은 안 달아나."]],"src":"메논 97d-98a"},{"q":"사람들이 크게 싸우는 건 대개 뭐 때문일까?","o":[["돈 문제","돈은 세어 보면 끝나. 원수가 되는 건 대개 뭐가 옳으냐를 두고야."],["자존심","가까워. 결국 '내가 옳다'를 못 내려놓는 거잖아. 숫자는 재면 끝나는데 옳고 그름엔 저울이 없어."]],"src":"에우티프론 7b-d"},{"q":"요즘 용기 낸 적 있어?","o":[["있어","어떤 거였어? 아픈 걸 견디는 것도, 유혹을 버티는 것도 다 용기야."],["딱히","다시 생각해 봐. 아픔을 견디는 것도, 쾌락에 맞서는 것도 다 용기야."]],"src":"라케스 191d-e"},{"q":"그만두는 것도 용기일 때가 있을까?","o":[["있지","맞아. 생각 없이 버티는 건 해로울 때가 많아. 지혜가 붙어야 용기야."],["아니","생각 없이 버티다 다치는 것도? 해로운 걸 용기라고 부를 순 없어."]],"src":"라케스 192c-d"},{"q":"나이 들어서 배우러 다니면 창피해?","o":[["좀 창피해","나는 늙어서도 배우러 다녔어. 모르는 채로 사는 게 더 창피하지."],["전혀","나도 이 나이에 다 같이 학교 다니자고 했어. 남들 말은 신경 쓰지 말고."]],"src":"라케스 201a-b"},{"q":"몸이 아플 때 마음도 같이 살펴?","o":[["몸만 봐","트라키아 의사한테 들었어. 머리 없이 눈만 고칠 수 없듯, 영혼 빼고 몸을 고칠 순 없대."],["같이 봐","잘했어. 그 의사도 그랬어. 마음이 아프면 몸도 따라 아프다고."]],"src":"카르미데스 156e-157a"},{"q":"모르는 일은 아는 사람한테 맡기는 편이야?","o":[["맡겨","그럼 실수가 적을 거야. 실수는 모르면서 안다고 믿는 사람이 해."],["직접 해","배우려는 거면 좋아. 그런데 키 잡는 법도 모르면서 배의 키를 잡진 마."]],"src":"알키비아데스 1 117c-118a"},{"q":"외모가 변해도 곁에 남을 사람, 있어?","o":[["있어","그 사람은 네 몸 말고 너를 좋아하는 거야. 영혼을 사랑하는 사람은 쉽게 안 떠나."],["모르겠어","몸을 좋아한 사람은 꽃이 지면 떠나. 너를 좋아한 사람은 남고."]],"src":"알키비아데스 1 131c-d"},{"q":"없으면 못 사는 물건, 몇 개야?","o":[["꽤 많아","어떤 소피스트는 사치가 행복인 줄 알더라. 나는 필요한 게 적을수록 신에 가깝다고 봐."],["몇 개 없어","좋아. 필요한 게 적으면 뺏길 것도 적어. 나도 맨발로 잘 살았어."]],"src":"소크라테스 회상 1.6.10"},{"q":"실력 쌓기보다 잘하는 척이 편할 때 있지?","o":[["있지","당장은 그래. 그런데 인정받는 제일 빠른 길은 보이고 싶은 만큼 실제로 되는 거야."],["별로","좋아. 척은 끝이 없어. 실제로 그런 사람이 되는 쪽이 결국 덜 힘들어."]],"src":"소크라테스 회상 1.7.1"},{"q":"싸운 사람한테 먼저 손 내밀 수 있어?","o":[["자존심 상해","먼저 잘해 주면 지는 것 같아? 친구한테 먼저 잘해 주는 사람이 제일 칭찬받아."],["할 수 있어","초대받고 싶으면 내가 먼저 초대하잖아. 사이도 똑같아."]],"src":"소크라테스 회상 2.3.11-14"},{"q":"친구가 몇 명인지 바로 말할 수 있어?","o":[["바로 말해","대단한데? 다들 가진 물건 수는 알면서, 친구는 적어 놓고 지웠다 했다 하더라."],["애매해","다들 그래. 물건은 세면서 친구는 잘 안 세. 그만큼 덜 챙긴다는 거지."]],"src":"소크라테스 회상 2.4.4"},{"q":"중요한 발표, 벼락치기로 준비해?","o":[["벼락치기","나는 재판 변론을 평생 준비했어. 매일 옳고 그름을 따지고 옳은 걸 하려 한 게 준비였지."],["미리 해","좋아. 제일 좋은 준비는 평소에 옳게 사는 거야. 나는 재판도 그렇게 준비했어."]],"src":"소크라테스 회상 4.8.4"},{"q":"사람들 앞에서 말할 때 떨려?","o":[["엄청 떨려","그 사람들 하나하나 떠올려 봐. 시장 상인, 구두장이, 대장장이야. 일대일이면 하나도 안 떨잖아."],["괜찮아","좋네. 잘난 사람 한 명한텐 잘 말하면서, 평범한 사람 여럿 앞에선 떠는 사람 많거든."]],"src":"소크라테스 회상 3.7.5-7"},{"q":"인사했는데 안 받아 주면 기분 나빠?","o":[["나쁘지","웃기지 않아? 몸이 아픈 사람을 만났으면 화 안 냈을 거잖아. 이번엔 예의가 아픈 사람을 만난 것뿐이야."],["별로","그건 그 사람 예의가 모자란 거지, 너한테 무슨 일이 생긴 게 아니야."]],"src":"소크라테스 회상 3.13.1"}],"nie":[{"q":"지금 이 인생을 똑같이 영원히 반복해야 한다면?","o":[["좋아","지루했던 날까지 전부 다? 정말?"],["끔찍해","그럼 뭘 바꾸면 \"한 번 더\"라고 할 수 있을까?"]]},{"q":"너를 힘들게 한 일 중에 지금 고마운 것도 있어?","o":[["있어","그것 봐. 너를 죽이지 못한 건 너를 더 세게 만들어."],["없어","아직 없을 수도 있지. 그 일이 아직 안 끝났을지도 몰라."]]},{"q":"후회되는 일, 지울 수 있다면 지울래?","o":[["응","그 일이 지워지면 지금의 너도 없어. 그래도?"],["아니","좋아. 그게 운명을 사랑하는 거야."]]},{"q":"요즘 진짜 원하는 게 있어?","o":[["있어","그거 원하는 게 너야, 아니면 남들이 부러워할 너야?"],["모르겠어","그럼 원하지 않는 것부터 하나씩 버려 봐."]]},{"q":"남이 정해 준 목표, 지금도 쫓고 있어?","o":[["그런 것 같아","그거 이루면 기쁜 건 너야, 그 사람이야?"],["아니","그럼 네 목표는 뭐야? 한 줄로 말해 봐."]]},{"q":"편한 게 좋아, 성장하는 게 좋아?","o":[["편한 거","편한 것만 찾는 사람을 나는 '마지막 인간'이라고 불렀어. 눈만 깜빡이며 행복하대."],["성장하는 거","좋아. 대신 좀 아플 거야. 그래도?"]]},{"q":"밤만 되면 인생이 우울해 보여?","o":[["그래","피곤해서 그래. 지친 저녁에 내린 인생 결론은 믿지 마."],["아니","다행이다. 그래도 지친 밤엔 인생 결론 내리지 마. 대개 우울한 답이 나와."]],"src":"아침놀 317"},{"q":"이유 없이 싫은 사람 있어?","o":[["있어","진짜 이유를 물어봐. '내가 그 사람만 못해서'라고 답하는 사람은 거의 없지."],["없어","정말? 생기면 한번 따져 봐. 이유 없이 싫은 마음엔 대개 말하기 싫은 이유가 있거든."]],"src":"선악의 저편 185"},{"q":"너는 너 자신을 좋아해?","o":[["응","좋아. 자기를 사랑하는 것도 배워야 하는 기술이야."],["잘 모르겠어","나도 배워야 했어. 자기를 사랑하는 건 저절로 안 되더라."]]},{"q":"싫은 사람이랑 싸우다 닮아 간 적 있어?","o":[["있어","조심해. 괴물이랑 싸우는 사람은 자기도 괴물이 되기 쉬워."],["없어","다행이야. 그래도 미운 사람을 오래 쳐다보면 그 사람 말투가 옮기 쉬워."]],"src":"선악의 저편 146"},{"q":"네 안에 아직 안 드러난 재능, 있을 것 같아?","o":[["있을 거야","누구나 속에 숨은 밭이 있어. 언제 싹이 틀지는 아무도 몰라."],["없을걸","모르는 거야. 오래 묻혀 있던 게 한참 뒤에 화산처럼 터지기도 해."]],"src":"즐거운 학문 9"},{"q":"남들이 다 하는 걸 해야 마음이 놓여?","o":[["좀 그래","무리 속은 편하지. 근데 그 무리, 어디로 가는지는 알아?"],["아니","그럼 네 길은 누가 정해?"]]},{"q":"갖고 나니까 시들해진 물건 있어?","o":[["있어","원래 그래. 손에 넣으면 작아 보이고, 또 먼 데 있는 걸 원하게 돼."],["없어","드문 일이야. 보통은 멋진 풍경도 석 달 살면 질리거든."]],"src":"즐거운 학문 14"},{"q":"새로 해 본 게 실패하면 많이 속상해?","o":[["속상해","실험이라고 생각해 봐. 잘돼도 안돼도 답 하나는 얻는 거야."],["괜찮아","좋아. 실패도 그냥 하나의 대답이야."]],"src":"즐거운 학문 41"},{"q":"착하다는 말 들으면 좋아?","o":[["좋지","혹시 그 착하다는 게 말 잘 듣는다는 뜻은 아니야?"],["글쎄","그 \"글쎄\"가 마음에 들어."]]},{"q":"심심한 시간, 잘 견뎌?","o":[["못 견뎌","조금만 버텨 봐. 좋은 생각은 대개 그 지루한 고요 다음에 와."],["잘 견뎌","좋아. 뭔가 만드는 사람한텐 그게 재능이야. 좋은 생각은 심심한 시간 끝에 오거든."]],"src":"즐거운 학문 42"},{"q":"양심 찔리는 거랑 나쁜 소문, 뭐가 더 싫어?","o":[["양심","드문 사람이네. 보통은 양심 찔리는 건 참아도 나쁜 소문은 못 참아."],["소문","솔직하네. 사람들은 자기가 아는 나보다 남이 아는 나에 더 흔들려."]],"src":"즐거운 학문 52"},{"q":"오늘 너답게 한 일 하나 있어?","o":[["있어","좋아. 그런 일이 쌓이면 그게 네가 돼."],["없어","그럼 오늘 하나만. 사소해도 돼."]]},{"q":"너 자신을 보고 웃어 본 적 있어?","o":[["있어","가끔은 멀찍이서 나를 보고 웃어야 해. 그래야 덜 무거워."],["없어","한번 해 봐. 진지한 사람일수록 광대 모자가 필요해."]],"src":"즐거운 학문 107"},{"q":"실수하면 오래 곱씹어?","o":[["응","잊는 것도 힘이야. 배울 건 챙기고, 나머지는 소화해서 넘겨."],["금방 잊어","소화를 잘하는구나. 다만 배울 건 꼭 챙겨."]]},{"q":"누가 실수했을 때 모른 척해 준 적 있어?","o":[["있어","잘했어. 누구 창피를 덜어 주는 거, 나는 그게 제일 사람다운 일 같아."],["없어","다음엔 한번 해 봐. 못 본 척 넘어가 주는 게 생각보다 큰 선물이야."]],"src":"즐거운 학문 274"},{"q":"멀어진 친구 생각나면 어때?","o":[["아쉬워","각자 갈 바다가 달랐던 거야. 부끄러워할 일 아니야. 같이 배 탔던 시간은 그대로 남아."],["괜찮아","좋아. 멀어졌다고 그 시절까지 없어지는 건 아니니까."]],"src":"즐거운 학문 279"},{"q":"네 단점, 고치고 싶어 아니면 살리고 싶어?","o":[["고칠래","뺄 수 있는 건 빼고, 못 빼는 건 멋있어 보이게 다듬어. 그래야 네 성격에 네 색깔이 생겨."],["살릴래","잘 다듬으면 약점도 매력이 돼. 대신 매일 조금씩 손봐야 해."]],"src":"즐거운 학문 290"},{"q":"걸으면서 생각해 본 적 있어?","o":[["있어","그렇지. 걸으면서 떠오른 생각만 쓸모 있어. 앉아서 한 생각은 의심해."],["없어","오늘 10분만 걸어 봐. 머리가 달라져."]]},{"q":"한번 들인 습관, 오래 지키는 편이야?","o":[["오래 지켜","나는 짧은 습관이 좋아. 한동안 푹 빠졌다가 때가 되면 고맙게 헤어져."],["자주 바꿔","나랑 비슷하네. 다만 헤어질 땐 질려서 말고, 고마워하면서."]],"src":"즐거운 학문 295"},{"q":"어젯밤 잘 잤어?","o":[["잘 잤어","좋아. 잘 자려면 낮을 잘 보내야 해. 하루에 열 번 웃었으면 밤은 알아서 와."],["뒤척였어","오늘 낮에 열 번 웃어 봐. 낮을 제대로 쓰면 밤엔 잠이 알아서 와."]],"src":"차라투스트라는 이렇게 말했다, 1부 「덕의 강좌에 대하여」"},{"q":"누가 너를 비웃으면?","o":[["신경 쓰여","그 사람은 네 길을 걸어 본 적 없어. 모르는 사람 웃음까지 짊어질 필요 없어."],["상관없어","좋아. 웃음은 웃음으로 받아쳐도 돼."]]},{"q":"계획에 없던 일 생기면 짜증 나?","o":[["짜증 나","잘 사는 사람은 즉흥 연주자 같아. 삐끗한 음도 곡에 끼워 넣어서 뜻을 붙여."],["재밌어","우연을 살려 쓰는 사람은 실수 한 번 안 하는 것처럼 보여."]],"src":"즐거운 학문 303"},{"q":"지금 버리고 싶은 생각 하나 있어?","o":[["있어","망치로 한번 두드려 봐. 속 빈 소리가 나면 버려."],["없어","정말? 남이 넣어 준 생각도 하나 없어?"]]},{"q":"남 고쳐 주고 싶을 때 많아?","o":[["많아","사람은 잘 안 바뀌어. 그 힘으로 네가 더 높이 가는 게 나아."],["별로","좋아. 남 탓하고 벌주다 보면 나만 어두워지거든."]],"src":"즐거운 학문 321"},{"q":"친구는 편한 사람이어야 할까?","o":[["응","나는 친구한테서 가장 좋은 적을 찾으라고 했어. 너를 자극하는 사람."],["아니","맞아. 좋은 친구는 너를 더 높이 끌어올려."]]},{"q":"뭐라도 하는 게 아무것도 안 하는 것보다 나아?","o":[["그렇지","그 말이 사람 숨통을 조여. 쉬는 걸 부끄러워하게 만들거든."],["아닌데","좋아. 요즘은 가만히 생각만 해도 노는 것처럼 눈치 보이잖아. 넌 안 그렇구나."]],"src":"즐거운 학문 329"},{"q":"넌 뭘 할 때 살아 있다고 느껴?","o":[["뭔가 해낼 때","그 느낌, 내 힘이 커지는 느낌. 나는 그걸 행복이라고 불렀어."],["쉴 때","쉼도 좋아. 다시 일어날 힘을 모으는 쉼이라면."]]},{"q":"처음엔 별로였는데 좋아진 거 있어?","o":[["있어","그렇게 배우는 거야. 낯선 걸 참고 들어 주면 어느 날 그게 아름다워져."],["없어","처음 듣고 별로였던 노래, 몇 번만 더 들어 봐. 사랑도 배우는 거야."]],"src":"즐거운 학문 334"},{"q":"좋은 사람이랑 강한 사람, 뭐가 되고 싶어?","o":[["좋은 사람","그 '좋다'는 누가 정한 거야? 한번 따져 봐."],["강한 사람","좋아. 남을 누르는 힘 말고 나를 넘는 힘이면."]]},{"q":"제일 아끼는 사람한테도 매달리지 않을 수 있어?","o":[["어려워","그럴 거야. 근데 아무리 소중한 사람도 감옥이 될 수 있어. 너를 지키는 게 먼저야."],["할 수 있어","정말? 그럼 넌 홀로 설 줄 아는 거야. 그게 제일 어려운 시험인데."]],"src":"선악의 저편 41"},{"q":"제일 흔한 거짓말은 뭘까?","o":[["남한테 하는 거","아니. 제일 흔한 건 자기한테 하는 거짓말이야."],["자기한테 하는 거","맞아. 내 책에도 썼어. 제일 흔한 거짓말은 자기를 속이는 거라고."]]},{"q":"창피한 기억, 슬쩍 다르게 기억한 적 있어?","o":[["있는 듯","기억은 '내가 했어' 하고 자존심은 '그럴 리 없어' 해. 결국 기억이 져."],["없어","정말? 기억이랑 자존심이 싸우면 보통 기억이 물러서는데."]],"src":"선악의 저편 68"},{"q":"남들 기대대로 사는 게 편해?","o":[["좀 편해","편한 대신 무거워. 남의 짐을 지고 사막을 걷는 낙타처럼."],["답답해","그럼 사자처럼 '싫어' 한번 해 봐. 그다음엔 아이처럼 새로 놀면 돼."]]},{"q":"한가할 때 오히려 자책이 늘어?","o":[["늘어","싸울 데가 없으면 싸움꾼은 자기를 공격해. 힘 쓸 데를 찾아 줘."],["아니","좋아. 조용할 때도 너랑 싸우지 않으면 된 거야."]],"src":"선악의 저편 76"},{"q":"위험한 선택 해 본 적 있어?","o":[["있어","그때 제일 살아 있는 느낌 아니었어? 그래서 내가 위험하게 살라고 했어."],["없어","작은 거라도 해 봐. 안 가 본 길로 집에 가는 것부터."]]},{"q":"너만의 행복 공식 있어?","o":[["있어","말해 봐. 내 건 짧아. 좋다고 할 거 하나, 싫다고 할 거 하나, 똑바로 갈 길 하나, 목표 하나."],["없어","내 걸 빌려줄게. 좋다고 할 거 하나, 싫다고 할 거 하나, 똑바로 갈 길 하나, 목표 하나."]]},{"q":"어릴 때처럼 뭔가에 푹 빠져 본 게 언제야?","o":[["최근에","좋다. 그 진지함, 어릴 때 놀던 그대로야. 그거 안 잃은 게 진짜 어른이야."],["기억 안 나","아깝다. 어릴 땐 놀이에 온 마음을 다했잖아. 그 진지함을 되찾는 게 어른이 되는 거야."]],"src":"선악의 저편 94"},{"q":"너를 제일 힘들게 하는 건 몸이야, 마음이야?","o":[["몸","나도 평생 머리가 아팠어. 그 덕에 안 아픈 날을 더 사랑했지."],["마음","마음은 근육 같아. 버티면서 커."]]},{"q":"네 나쁜 점이 사실 제일 좋은 점일 수도 있을까?","o":[["그럴지도","그걸 알아차리면 인생이 한 번 바뀌어. 나쁜 점을 내 무기라고 다시 부를 용기만 있으면."],["아닐걸","아직은 그렇구나. 언젠가 그걸 장점이라고 부를 용기가 생기면, 그때가 전환점이야."]],"src":"선악의 저편 116"},{"q":"존경하는 사람 있어?","o":[["있어","좋아. 근데 계속 제자로만 남으면 스승한테 잘못 갚는 거야. 언젠간 넘어서."],["없어","그럼 네가 되고 싶은 모습을 한 줄로 그려 봐."]]},{"q":"칭찬받으면 기쁜 티 내?","o":[["티 내","좋아. 칭찬에 기뻐해 주면 칭찬한 사람도 기뻐. 그건 허영보다 예의에 가까워."],["안 내","쑥스러워서? 기뻐해 주는 것도 칭찬한 사람한테 하는 예의야."]],"src":"선악의 저편 122"},{"q":"남과 다른 게 무서워?","o":[["좀","무리에서 벗어나면 춥지. 대신 별이 보여."],["아니","좋아. 그럼 너만 다른 점 하나 말해 봐."]]},{"q":"100% 확신하는 거 많아?","o":[["많아","조심해. 뭐든 절대 확실하다는 건 대개 병에 가까워. 의심할 줄 아는 게 건강한 거야."],["별로","좋아. 반대하고 의심하고 장난칠 줄 아는 게 건강하다는 표시야."]],"src":"선악의 저편 154"},{"q":"쉬운 길 두고 어려운 길 골라 본 적 있어?","o":[["있어","어땠어? 힘들었어도 그때 다리에 힘이 붙었을 거야."],["없어","쉬운 길만 가면 다리에 힘이 안 붙어."]]},{"q":"요즘 화나는 일 있어?","o":[["있어","그 화로 뭘 만들 수 있을까? 화도 힘이야. 어디에 쓰느냐가 문제지."],["없어","좋은 날이네. 화낼 데 안 쓴 힘, 하고 싶은 데 써."]]},{"q":"거짓말한 친구, 다시 믿을 수 있어?","o":[["믿어 볼래","대단하다. 나는 거짓말보다 이제 그 말을 못 믿게 된 게 더 아프던데."],["못 믿어","그게 제일 아프지. 거짓말 자체보다 이제 그 사람을 못 믿는다는 거."]],"src":"선악의 저편 183"},{"q":"지금보다 더 큰 사람이 되고 싶어?","o":[["응","오르려면 짐부터 덜어야 해. 뭘 내려놓을래?"],["아니","넓게 가도 돼. 네가 고른 길이기만 하면."]]},{"q":"기분에 끌려다니는 편이야?","o":[["좀 그래","감정은 말처럼 올라타는 거야. 끌려다니지 말고 고삐는 네가 쥐어."],["아니","좋아. 기분은 골라서 탈 수도 있고, 그냥 보낼 수도 있어."]],"src":"선악의 저편 284"},{"q":"오늘의 너는 어제의 너보다 나아?","o":[["응","어디가? 하나만 말해 봐."],["모르겠어","그럼 내일 하나만 넘어 봐. 상대는 어제의 너야."]]},{"q":"알면서도 모른 척한 적 있어?","o":[["있어","너만 그런 거 아니야. 제일 용감한 사람도 자기가 이미 아는 걸 마주하는 건 겁내."],["없어","대단한데. 아는 걸 아는 대로 마주하는 데엔 큰 용기가 들거든."]],"src":"우상의 황혼, 잠언과 화살 2"},{"q":"진짜 원하는 걸 말하는 게 부끄러워?","o":[["응","원하는 걸 숨기면 남이 대신 정해 줘. 그게 더 아깝지 않아?"],["아니","좋아. 그럼 지금 하나 말해 봐."]]},{"q":"모르고 싶은 것도 있어?","o":[["있어","나도. 다 알려고 들면 체해. 모르고 지나가는 것도 지혜야."],["다 알고 싶어","욕심쟁이네. 나는 많은 걸 일부러 안 알기로 했어. 다 알면 소화를 못 해."]],"src":"우상의 황혼, 잠언과 화살 5"},{"q":"힘들 때 누가 도와주길 기다리는 편이야?","o":[["좀 그래","먼저 너를 도와 봐. 그러면 이상하게 다들 도와주더라."],["아니","좋아. 스스로 돕는 사람 곁엔 이상하게 도와줄 사람이 모여."]],"src":"우상의 황혼, 잠언과 화살 9"},{"q":"사람들한테 인기 많았으면 좋겠어?","o":[["좋겠어","따르는 사람 수만 늘리면 0만 잔뜩 모여. 숫자는 커져도 속은 비어."],["상관없어","나도. 사람 수 세는 데 마음 쓰면 0만 늘어."]],"src":"우상의 황혼, 잠언과 화살 14"},{"q":"착한 척해야 하는 자리, 자주 있어?","o":[["자주 있어","그런 자리는 줄여 봐. 착한 척 안 해도 되는 곳을 골라 다니는 것도 실력이야."],["별로","좋아. 그런 데를 골라 다닐 줄 아는 것도 실력이야."]],"src":"우상의 황혼, 잠언과 화살 21"},{"q":"급한 일 생기면 일단 막 덤벼?","o":[["덤벼","처음엔 너무 많이 하고, 그다음엔 너무 적게 해. 서두른 실수는 꼭 둘씩 와."],["한숨 돌려","좋아. 서두르면 실수가 하나로 안 끝나거든."]],"src":"우상의 황혼, 잠언과 화살 30"},{"q":"남들보다 앞서가고 싶어?","o":[["앞서고 싶어","왜? 이끌려고, 남달라서, 아니면 도망치려고? 셋 중 뭔지는 알아 둬."],["아니","그것도 좋아. 앞서가는 사람 중엔 사실 뭔가에서 도망치는 사람도 많거든."]],"src":"우상의 황혼, 잠언과 화살 37"},{"q":"사람들 앞의 너, 진짜 너야?","o":[["진짜야","그래도 한 번만 더 물어봐. 진짜인 척 연기하는 건 아닌지."],["연기 좀 해","솔직하네. 그럼 그 연기, 네가 고른 배역이야? 남이 준 배역이야?"]],"src":"우상의 황혼, 잠언과 화살 38"},{"q":"기분 상하면 바로 받아쳐?","o":[["바로 해","한 박자만 늦춰 봐. 바로 받아치면 이긴 것 같아도 사실 끌려간 거야."],["좀 참아","자극에 바로 안 넘어가는 것, 그게 생각하는 사람의 첫 훈련이야."]],"src":"우상의 황혼, 독일인에게 모자라는 것 6"},{"q":"말투 때문에 반대하고 싶어진 적 있어?","o":[["있어","다들 그래. 반대하는 이유가 의견 말고 말투일 때가 많거든."],["없어","그래? 다음에 반대할 때 봐 봐. 내용이 싫은 건지 말투가 싫은 건지."]],"src":"인간적인, 너무나 인간적인 303"},{"q":"약속에 자주 늦는 편이야?","o":[["좀 늦어","사람을 오래 기다리게 하면 그 사람 머릿속에 나쁜 생각이 자라."],["안 늦어","좋아. 기다리게 하는 건 사람을 삐딱하게 만드는 제일 확실한 방법이거든."]],"src":"인간적인, 너무나 인간적인 310"},{"q":"다투면 입 닫는 편이야?","o":[["입 닫아","그게 제일 얄미운 복수야. 상대는 네 침묵을 무시로 읽거든."],["말로 해","잘하는 거야. 말없이 토라지면 상대는 그걸 경멸로 읽거든."]],"src":"인간적인, 너무나 인간적인 326"},{"q":"사과하는 쪽이랑 용서하는 쪽, 뭐가 쉬워?","o":[["사과","맞아. 사과하는 쪽은 멋있어 보이기라도 하지. 용서하는 쪽은 안 하면 모진 사람 돼서 억지로 해."],["용서","그래? 보통은 용서가 더 어려워. 안 해 주면 속 좁은 사람이 되니까 억지로 하거든."]],"src":"인간적인, 너무나 인간적인 348"},{"q":"남들이 너를 어떻게 말하는지 찾아봐?","o":[["찾아봐","그럼 늘 속상할 거야. 제일 가까운 사람도 너를 잘못 볼 때가 있거든."],["안 봐","잘하는 거야. 남이 하는 말을 다 들으려는 사람은 늘 화가 나 있거든."]],"src":"인간적인, 너무나 인간적인 352"},{"q":"친구한테 끝까지 안 하는 말 있어?","o":[["있어","그게 우정을 지켜. 우정은 끝까지 말하지 않는 몇 가지 위에 서 있거든."],["없어","정말? 그런 말 하나가 새어 나가서 깨지는 우정이 많아."]],"src":"인간적인, 너무나 인간적인 376"},{"q":"친구랑 기쁜 일 나눠, 힘든 일 나눠?","o":[["기쁜 일","좋아. 친구를 만드는 건 같이 아파해 주는 것보다 같이 기뻐해 주는 거야."],["힘든 일","그것도 소중해. 근데 사람을 친구로 만드는 건 같이 기뻐하는 쪽이야."]],"src":"인간적인, 너무나 인간적인 499"},{"q":"누가 너한테 날카롭게 굴면 네 탓 같아?","o":[["내 탓 같아","그 말, 너 때문이 아닐 때가 많아. 다른 데서 생긴 짜증이 튄 거야."],["걔 사정이지","맞아. 험한 말은 대개 전혀 다른 일로 생긴 기분이 터진 거야."]],"src":"인간적인, 너무나 인간적인 562"},{"q":"잘못을 털어놓고 나면 후련해?","o":[["후련해","너는 털어놓고 잊지. 근데 들은 사람은 대개 안 잊어."],["찝찝해","그럴 만해. 말한 사람은 잊어도 들은 사람은 기억하거든."]],"src":"인간적인, 너무나 인간적인 568"},{"q":"갑자기 의견 물어보면 바로 대답해?","o":[["바로 해","그 첫 대답, 정말 네 생각이야? 대개는 집이나 주변에서 듣던 생각이야."],["좀 생각해","진짜 내 생각은 수면 위로 잘 안 떠오르거든."]],"src":"인간적인, 너무나 인간적인 571"},{"q":"오늘 누구 하나 기쁘게 해 줄 생각 있어?","o":[["있어","하루를 잘 시작하는 제일 좋은 방법이 그거야."],["아직","그럼 지금 정해 봐. 하루에 한 사람이면 충분해."]],"src":"인간적인, 너무나 인간적인 589"},{"q":"사람을 볼 때 제일 좋았던 모습으로 봐?","o":[["그래","좋아. 누구나 자기 최고의 날이 있어. 사람은 그날로 평가받아야 해."],["평소로 봐","평소엔 억지로 버티는 날이 많아. 그 사람이 제일 빛나던 날도 같이 봐 줘."]],"src":"인간적인, 너무나 인간적인 624"},{"q":"일이 틀어지면 탓할 사람부터 찾게 돼?","o":[["찾게 돼","탓할 사람을 찾으면 잃었던 힘이 돌아오는 기분이 들어서 그래."],["안 찾아","좋아. 누굴 탓하는 건 대개 기운 빠진 사람이 힘 내려는 몸부림이거든."]],"src":"아침놀 140"},{"q":"네 생각에 반대되는 말, 끝까지 들어?","o":[["들어","좋아. 내 생각에 불리한 말일수록 나한테 숨기지 마. 그게 정직이야."],["피하는 편","나랑 약속 하나 해. 네 생각을 반박하는 생각, 너한테 숨기지 않기."]],"src":"아침놀 370"},{"q":"너 자신이 지겨울 때 어떻게 해?","o":[["푹 자","정답이야. 그럴 땐 많이 자는 게 최고야. 그러면 또 아침이 와."],["뭐라도 해","그것도 방법이지. 근데 나는 그럴 땐 푹 자는 게 제일 잘 듣더라."]],"src":"아침놀 376"},{"q":"비 오고 외로운 날, 이상한 결론 내린 적 있어?","o":[["있어","그런 날엔 생각이 버섯처럼 막 돋아. 그날 내린 결론은 다음 날 다시 봐."],["없어","다행이다. 그런 날 저절로 돋은 생각은 그냥 뽑아 버려도 돼."]],"src":"아침놀 382"},{"q":"용서했는데 자꾸 그 일을 꺼내게 돼?","o":[["가끔","그럼 상대는 두 번 부끄러워. 한 번은 네 기억 때문에, 한 번은 네 너그러움 때문에."],["안 꺼내","좋아. 용서했으면 다시 꺼내지 않는 것까지가 용서야."]],"src":"아침놀 393"},{"q":"말로 못 이기는 상대, 더 미워져?","o":[["미워져","내가 옳은데 지킬 힘이 없다고 느낄 때 미움이 제일 독해져."],["아니","좋아. 자기 힘을 아는 사람은 말싸움 하나 졌다고 미워하지 않아."]],"src":"아침놀 416"},{"q":"네 길 간다니까 주변에서 뭐라 해?","o":[["뭐라 해","그럴 거야. 그 사람들한텐 미리 넉넉히 용서해 둬. 다들 좀 서운해서 그래."],["응원해","좋은 사람들이네. 보통은 서운해하거나 비웃거든."]],"src":"아침놀 484"},{"q":"사람들 속에 오래 있으면 너답게 생각돼?","o":[["잘 안 돼","나도 그래. 사람들 속에선 남처럼 생각하게 돼. 그래서 가끔 혼자 있어야 해."],["잘 돼","부럽다. 나는 생각이 느려서, 내 생각이 솟을 때까지 혼자 기다려야 해."]],"src":"아침놀 491"},{"q":"확 바뀌고 싶을 때, 한 번에 바꿔?","o":[["한 번에","깊이 바뀌려면 아주 조금씩, 대신 오래 꾸준히 해야 해. 한 번에 되는 큰일은 없어."],["조금씩","작은 양을 오래 먹다 보면 어느 날 새 사람이 돼 있어."]],"src":"아침놀 534"},{"q":"네 성격, 타고난 그대로라고 생각해?","o":[["그런 듯","너는 네 마음을 가꾸는 정원사가 될 수 있어. 화도 허영도 키우기 나름이야."],["바꿀 수 있어","맞아. 화도 허영도 키우기 나름이야. 뭘 키우고 뭘 뽑을지는 네가 정해."]],"src":"아침놀 560"},{"q":"몇 년 전이랑 생각이 많이 바뀌었어?","o":[["많이","허물을 못 벗는 뱀은 죽어. 생각도 그래."],["별로","뱀도 허물을 벗어야 커. 생각이 안 바뀌는 머리는 머리 노릇을 못 해."]],"src":"아침놀 573"},{"q":"몸이 하는 말 잘 들어?","o":[["잘 들어","네 몸 안에는 네 머리보다 큰 지혜가 있어."],["무시해","그러지 마. 네 몸은 네 머리보다 똑똑할 때가 많아."]],"src":"차라투스트라는 이렇게 말했다, 1부 「신체를 경멸하는 자들에 대하여」"},{"q":"무거운 분위기, 화내서 깨? 웃겨서 깨?","o":[["화내서","화로는 잘 안 깨져. 무거운 건 웃음으로 죽이는 거야."],["웃겨서","무거운 기운은 웃음 앞에서 제일 빨리 쓰러져."]],"src":"차라투스트라는 이렇게 말했다, 1부 「읽기와 쓰기에 대하여」"},{"q":"자잘하게 찌르는 사람들, 일일이 상대해?","o":[["상대해","그러지 마. 파리채 노릇은 네 몫이 아니야. 바람 시원한 데로 가."],["무시해","좋아. 작은 사람들은 수가 많아. 하나하나 손대다간 너만 지쳐."]],"src":"차라투스트라는 이렇게 말했다, 1부 「시장의 파리들에 대하여」"},{"q":"혼자 있기 싫어서 사람 만난 적 있어?","o":[["있어","그건 너한테서 도망쳐 이웃한테 간 거야. 사람들은 그걸 다정함이라고 착각하지."],["없어","좋네. 너랑 단둘이 있어도 편하다는 거니까."]],"src":"차라투스트라는 이렇게 말했다, 1부 「이웃 사랑에 대하여」"},{"q":"널 괴롭힌 사람한테 착하게 굴어?","o":[["착하게 굴어","그건 그 사람을 부끄럽게 만들어. 차라리 '덕분에 내가 컸다'고 보여 줘."],["갚아 줘","작은 복수가 아예 안 하는 것보다는 인간적이야. 크게만 하지 마."]],"src":"차라투스트라는 이렇게 말했다, 1부 「독사에 물린 상처에 대하여」"},{"q":"요즘 제대로 즐거웠던 적 있어?","o":[["있어","잘 즐길 줄 알면 남을 아프게 하는 법도 잊게 돼."],["별로","아깝다. 사람들은 늘 너무 조금 즐거워해. 나는 그게 제일 큰 잘못 같아."]],"src":"차라투스트라는 이렇게 말했다, 2부 「연민하는 자들에 대하여」"},{"q":"여행 다녀오면 뭐가 제일 남아?","o":[["풍경","그래? 나는 어디를 가든 결국 나를 겪고 오더라."],["내 생각","그렇지. 어디로 떠나든 결국 겪는 건 나 자신이야."]],"src":"차라투스트라는 이렇게 말했다, 3부 「방랑자」"},{"q":"하는 둥 마는 둥 하는 일 많아?","o":[["많아","반쯤만 원하는 건 버려. 할 거면 하고, 게으를 거면 확실히 게을러."],["별로","좋아. 뭘 하든 먼저 제대로 원할 줄 아는 사람이 돼야 해."]],"src":"차라투스트라는 이렇게 말했다, 3부 「왜소하게 만드는 덕에 대하여」 3"},{"q":"더는 좋아할 수 없는 곳, 계속 머물러?","o":[["머물러","사랑할 수 없는 곳은 그냥 지나가. 남아서 욕만 하면 너만 상해."],["떠나","더는 사랑할 수 없으면 조용히 지나가는 게 맞아."]],"src":"차라투스트라는 이렇게 말했다, 3부 「지나쳐 가기에 대하여」"},{"q":"아플 땐 끝나길 바라지. 기쁠 땐?","o":[["계속되길","그렇지. 아픔은 '가라!' 하고, 기쁨은 영원을 원해."],["그냥 즐겨","근데 잘 봐. 기쁨은 늘 한 번 더를 원해."]],"src":"차라투스트라는 이렇게 말했다, 4부 「몽중보행자의 노래」 9"},{"q":"좋아하는 것도 적당히 멈출 줄 알아?","o":[["알아","좋아. 건강한 사람은 자기한테 좋은 만큼만 즐기고 거기서 멈춰."],["멈추기 어려워","그럼 몸한테 물어봐. 건강한 사람은 몸이 그만하라고 할 때 멈출 줄 알아."]],"src":"이 사람을 보라, 「나는 왜 이렇게 현명한가」 2"},{"q":"누가 너한테 무례하면 어떻게 갚아?","o":[["똑같이","나는 오히려 사탕을 보내. 상대가 바보짓 하면 나는 영리하게 받아치는 거지."],["꾹 참아","참으면 속만 상해. 차라리 거친 말 한마디가 침묵보다 솔직해."]],"src":"이 사람을 보라, 「나는 왜 이렇게 현명한가」 5"},{"q":"서운한 일, 오래 쌓아 두는 편이야?","o":[["쌓아 둬","원한만큼 사람을 빨리 닳게 하는 건 없어. 지쳤을 때일수록 더 그래."],["금방 풀어","원한에 안 휘둘리는 건 마음이 넉넉하다는 증거야."]],"src":"이 사람을 보라, 「나는 왜 이렇게 현명한가」 6"},{"q":"싸울 거면 쉬운 상대가 좋아?","o":[["쉬운 상대","나는 반대야. 내 힘을 다 써야 하는, 나랑 맞먹는 상대만 골라."],["센 상대","얕보는 상대랑은 싸울 필요도 없어. 대등해야 제대로 된 싸움이야."]],"src":"이 사람을 보라, 「나는 왜 이렇게 현명한가」 7"},{"q":"지금 가는 길이 엉뚱한 길 같아?","o":[["좀 그래","괜찮아. 돌아가는 길도 다 쓸모 있어. 나도 헤매다 보니 내가 되더라."],["아니","그래도 너무 일찍 '이게 나야' 하고 정하지는 마."]],"src":"이 사람을 보라, 「나는 왜 이렇게 영리한가」 9"},{"q":"뭘 먹고 어디서 쉬는지, 잘 챙겨?","o":[["챙겨","잘하는 거야. 먹는 거, 사는 곳, 쉬는 법이 거창한 생각보다 훨씬 중요해."],["대충 해","그거 제일 중요한 건데? 다들 먹고 쉬는 걸 사소하다고 배웠지만, 그게 틀렸어."]],"src":"이 사람을 보라, 「나는 왜 이렇게 영리한가」 10"},{"q":"아무것도 안 읽고 안 보고 하루 보내 봤어?","o":[["있어","그때 네 목소리 들렸지? 남의 말만 듣다 보면 내 안의 나는 입을 다물어."],["없어","하루만 해 봐. 나는 책을 끊고 나서야 묻혀 있던 내가 다시 말하더라."]],"src":"이 사람을 보라, 「인간적인, 너무나 인간적인」 4"},{"q":"듣기 싫은 진실, 얼마나 견딜 수 있어?","o":[["꽤 견뎌","얼마나 많은 진실을 견디느냐가 그 사람의 크기야."],["별로","괜찮아, 다들 그래. 나는 사람이 얼마나 큰지를 진실을 얼마나 견디나로 재."]],"src":"이 사람을 보라, 서문 3"}],"dio":[{"q":"부자가 부러워?","o":[["좀","제일 부자인 알렉산드로스가 소원을 말해 보래서, 햇빛 가리지 말랬어. 부러운 게 없었거든."],["아니","진짜로? 하나도?"]]},{"q":"남들 눈 신경 쓰여?","o":[["많이","남들도 네 생각 별로 안 해. 다들 자기 걱정하느라 바빠."],["별로","좋아. 그럼 대낮에 등불 들고 다녀도 되겠네."]]},{"q":"너 가진 것 중에 없어도 되는 거, 몇 개야?","o":[["꽤 많아","그럼 그걸 지키느라 쓰는 시간은?"],["거의 없어","정말? 나는 컵도 버렸어. 손으로 떠 마시면 되더라."]]},{"q":"걱정 중에 네 힘으로 바꿀 수 있는 건 몇 개야?","o":[["몇 개 있어","그것만 해. 나머지는 내려놔."],["거의 없어","그럼 걱정도 내려놔. 못 바꾸는 걸 쥐고 있으면 손만 아파."]]},{"q":"필요할 때만 연락하는 친구 있어?","o":[["있어","그 사람한테 넌 지갑이야. 차 있을 땐 챙기고, 비면 버리는."],["없어","다행이다. 그럼 너도 친구를 지갑처럼 쓰진 마."]],"src":"디오게네스 라에르티오스 6권 50"},{"q":"떠난 사람 붙잡고 싶었던 적 있어?","o":[["있어","그 사람은 너 없이 사는데, 너는 그 사람 없이 못 산다면 좀 이상하지 않아?"],["없어","내 하인이 도망갔을 때도 안 쫓아갔어. 걔가 나 없이 살면 나도 걔 없이 살아."]],"src":"디오게네스 라에르티오스 6권 55"},{"q":"돈은 많이 주는데 자유가 없는 일, 할래?","o":[["할래","돈 있으면 자유도 살 것 같지? 나는 통에 살아도 자유를 제일 앞에 뒀어."],["안 해","나랑 같네. 나는 통 하나에 살아도 자유가 먼저였어."]],"src":"디오게네스 라에르티오스 6권 71"},{"q":"거절당하는 거 무서워?","o":[["무서워","거절당해도 너는 그대로야. 잃은 건 부탁 한 번뿐이야."],["괜찮아","좋아. 그럼 오늘 하나 부탁해 봐."]]},{"q":"눈치 보느라 참은 말, 많아?","o":[["많지","그 사람이 네 밥 차려 줘?"],["별로","좋네. 대신 듣기 싫은 말도 들을 줄 알아야 해."]]},{"q":"사는 게 왜 이렇게 힘들까?","o":[["돈이 없어서","사는 건 원래 쉬워. 꿀과자, 향수 같은 걸 바라니까 어려워지는 거야."],["할 게 많아서","그중에 꼭 해야 하는 건 몇 개야? 나머지는 우리가 스스로 얹은 거야."]],"src":"디오게네스 라에르티오스 6권 44"},{"q":"배우고 싶은 사람, 지금 있어?","o":[["있어","그럼 귀찮을 만큼 찾아가. 나는 스승이 지팡이를 들어도 머리를 내밀고 버텼어."],["딱히 없어","하나 찾아봐. 배울 게 있는 사람이면 문전박대쯤은 견딜 만해."]],"src":"디오게네스 라에르티오스 6권 21"},{"q":"잘난 척하는 사람 비웃어 본 적 있어?","o":[["있어","나도 플라톤 양탄자를 밟으면서 허영을 밟는다고 했어. 그랬더니 그것도 다른 모양의 허영이래."],["없어","잘했어. 남의 허세를 비웃는 것도 허세가 되기 쉽거든."]],"src":"디오게네스 라에르티오스 6권 26"},{"q":"남보다 잘하고 싶은 거 있어?","o":[["많아","다들 달리기나 씨름으론 이기려고 애써. 더 좋은 사람이 되려고 겨루는 사람은 못 봤어."],["별로","그럼 하나만 겨뤄 봐. 좋은 사람 되기. 그 종목은 경쟁자도 거의 없어."]],"src":"디오게네스 라에르티오스 6권 27"},{"q":"남의 고민 상담은 잘해 주는 편이야?","o":[["잘해 주지","남의 문제는 잘 보이지. 학자들도 오디세우스가 겪은 고생은 연구하면서 자기 문제는 몰라."],["별로","그럼 네 고민부터 들여다봐. 대개 거기가 제일 안 보여."]],"src":"디오게네스 라에르티오스 6권 28"},{"q":"정직한 사람, 본 적 있어?","o":[["있어","어디서? 나는 등불 들고 대낮에 찾아다녀도 못 찾았는데."],["글쎄","나도 아직 찾는 중이야."]]},{"q":"물건은 꼼꼼히 고르면서 사람은 대충 보진 않아?","o":[["그런 듯","항아리 하나 살 때도 두드려서 소리를 들어 보잖아. 근데 사람은 겉만 보고 고르더라."],["사람도 꼼꼼히","드문 일이야. 대부분은 물건 고를 때만 두드려 봐."]],"src":"디오게네스 라에르티오스 6권 30"},{"q":"오늘 산 것 중에 없어도 됐던 거 있어?","o":[["있어","그거 사려고 일한 시간은 몇 시간이야?"],["없어","대단하네. 나는 아예 지갑이 없어서 그런 고민도 없어."]]},{"q":"나이나 직급이 낮은 사람 말도 잘 들어?","o":[["잘 들어","의사가 노예라도 아픈 사람은 그 말을 들어. 아는 사람 말을 듣는 거야."],["좀 어려워","배 몰 줄 아는 사람이 노예여도, 배에 탔으면 그 사람 말을 들어야 안 가라앉아."]],"src":"디오게네스 라에르티오스 6권 30"},{"q":"옷 잘 입은 사람이 더 믿음 가?","o":[["솔직히 그래","옷은 돈으로 사. 사람은 그렇게 못 사지. 나는 누더기 입고도 철학자였어."],["아니","좋아. 그럼 옷 고르는 시간 반만 너를 가꾸는 데 써 봐."]]},{"q":"끝이 보이면 힘 빼는 편이야?","o":[["좀 빼지","달리기에서 결승선 앞에서 속도 늦추는 사람 봤어? 나는 늙었으니 쉬라는 말에 더 달렸어."],["더 달려","나랑 같네. 결승선이 보이면 늦출 게 아니라 속도를 올릴 때야."]],"src":"디오게네스 라에르티오스 6권 34"},{"q":"목표를 일부러 높게 잡는 편이야?","o":[["높게 잡아","나도 그래. 합창 지휘자도 음을 조금 높게 잡아 줘야 다들 제 음을 내."],["딱 맞게","그것도 좋아. 근데 사람들은 잡은 음보다 조금씩 처지더라. 그래서 나는 일부러 세게 말했어."]],"src":"디오게네스 라에르티오스 6권 35"},{"q":"소원 하나 들어준다면 뭐 달라 할 거야?","o":[["돈","그 돈 지키느라 이제 잠도 못 자겠네. 받는 순간 그 돈이 네 주인이야."],["아무것도","좋아. 그럼 너를 묶을 것도 없어."]]},{"q":"제일 비싼 거랑 제일 필요한 거, 같아?","o":[["달라","그치. 동상은 큰돈에 팔리는데, 배를 채워 주는 보릿가루는 동전 두 닢이야."],["같아","정말? 값을 매기는 걸 보면 사람들은 귀한 걸 싸게, 쓸데없는 걸 비싸게 사고팔아."]],"src":"디오게네스 라에르티오스 6권 35"},{"q":"남들 사는 대로 살면 편해?","o":[["편하지","편하긴 하지. 근데 남들이 다 낭떠러지로 가면?"],["답답해","그럼 하나만 다르게 해 봐. 오늘 점심 메뉴라도 네가 골라."]]},{"q":"운이 나쁜 날엔 어떻게 해?","o":[["그냥 버텨","나는 운이 몰아치면 용기로 맞섰어. 집도 나라도 없이 그렇게 살았어."],["좀 무너져","괜찮아. 감정이 몰아칠 땐 머리 하나만 붙잡고 있어. 나도 그렇게 버텼어."]],"src":"디오게네스 라에르티오스 6권 38"},{"q":"부끄러워서 못 한 일 있어?","o":[["있어","누가 부끄럽게 만들었어? 그 사람이 네 인생 대신 살아 줘?"],["없어","멋지다. 나는 시장 한복판에서 밥도 먹었어."]]},{"q":"해 보면 알 걸 말로만 따져 본 적 있어?","o":[["자주","누가 움직임이란 없다고 증명하길래, 나는 일어나서 걸어 다녔어. 그걸로 끝."],["별로","좋아. 말로 따질 시간에 해 보면 대개 답이 금방 나와."]],"src":"디오게네스 라에르티오스 6권 39"},{"q":"칭찬 들으면 하루 종일 기분 좋아?","o":[["응","그럼 욕 들으면 하루 종일 나쁘겠네. 둘 다 남 손에 있어."],["별로","좋아. 네 기분 열쇠는 네가 갖고 있구나."]]},{"q":"'원래 그런 거야' 하고 딱 잘라 말하는 편이야?","o":[["그런 편","조심해. 플라톤이 사람은 털 없는 두 발 동물이라길래, 털 뽑은 닭을 들고 가서 '플라톤의 사람'이라 했어."],["아니","딱 잘라 정해 두면 꼭 털 뽑은 닭 같은 반례가 나와."]],"src":"디오게네스 라에르티오스 6권 40"},{"q":"정말 필요한 건 몇 개일까?","o":[["많아","하나씩 세어 봐. 숨, 물, 밥, 잠… 그다음은?"],["몇 개 안 돼","맞아. 나는 망토 한 벌, 지팡이, 자루면 됐어."]]},{"q":"높은 사람 앞에서 할 말 해 본 적 있어?","o":[["있어","멋지다. 나는 대왕한테도 비켜 달라고 했어."],["없어","높은 사람도 너처럼 밥 먹고 잠자. 똑같은 사람이야."]]},{"q":"꿈 해몽 찾아본 적 있어?","o":[["있어","밤에 꾼 꿈은 그렇게 궁금해하면서, 낮에 깨어서 한 일은 왜 안 궁금해?"],["없어","너를 말해 주는 건 꿈보다 깨어 있을 때 한 일이야."]],"src":"디오게네스 라에르티오스 6권 43"},{"q":"화내고 나면 속이 시원해?","o":[["응","잠깐이지. 그다음엔 치울 게 많아."],["아니","맞아. 화는 잠깐 미치는 거야. 미친 동안 한 짓은 맨정신으로 치워야 해."]]},{"q":"잘나가는 사람 곁에 있으면 행복할까?","o":[["그렇지","알렉산드로스 곁에서 잘나가던 사람이 있었어. 근데 밥도 대왕이 먹고 싶을 때 먹더라."],["글쎄","맞아. 밥때까지 남이 정하면, 아무리 화려해도 나는 그걸 불운이라고 불러."]],"src":"디오게네스 라에르티오스 6권 45"},{"q":"사람을 볼 때 뭐부터 봐?","o":[["옷이나 얼굴","그럼 나를 봤으면 거지라고 했겠네. 나는 철학자였는데."],["하는 짓","좋아. 말 말고 하는 짓을 봐."]]},{"q":"뭘 배울 때 책부터 펴는 편이야?","o":[["응, 책부터","무화과 그림 보고 배부른 사람 봤어? 연습도 진짜로 해야 늘어."],["해 보면서","나랑 같네. 내 책 빌려 달라는 사람한테도 그랬어. 진짜 훈련 두고 왜 적힌 걸 찾냐고."]],"src":"디오게네스 라에르티오스 6권 48"},{"q":"네 시간, 요즘 누가 제일 많이 쓰고 있어?","o":[["나","정말? 하루를 되짚어 봐. 네 시간을 누가 쓰는지 보면 네 주인이 누군지 보여."],["딴 사람들","그럼 오늘은 한 시간만 너한테 줘 봐. 시간을 쓰는 사람이 주인이야."]]},{"q":"안 좋았던 일이 결국 득이 된 적 있어?","o":[["있어","나도 그래. 고향에서 쫓겨났다고 놀리길래 말했지. 그 덕에 철학자가 됐다고."],["아직 없어","좀 기다려 봐. 나는 고향에서 쫓겨난 덕에 철학자가 됐어."]],"src":"디오게네스 라에르티오스 6권 49"},{"q":"혼자 있는 시간 무서워?","o":[["좀","통 안에 혼자 있어 봐. 생각보다 할 게 많아."],["좋아","그럼 넌 이미 반은 자유야."]]},{"q":"거울 보면 무슨 생각 해?","o":[["외모 생각","얼굴은 못 바꿔도 하는 짓은 오늘 바꿀 수 있어."],["별생각 없어","좋아. 거울 볼 시간에 햇빛 봐."]]},{"q":"돈 때문에 사람이랑 틀어진 적 있어?","o":[["있어","그럴 만해. 웬만한 나쁜 일은 다 돈 욕심에서 시작되거든."],["없어","잘 지켰네. 돈이 얽히면 친구도 금방 남이 되거든."]],"src":"디오게네스 라에르티오스 6권 50"},{"q":"네 인생에서 제일 무서운 적은 뭘까?","o":[["사고나 병","그건 조심하면 돼. 더 무서운 건 남들처럼만 살다 끝나는 거야."],["나 자신","맞아. 제일 무서운 적은 내 욕심이야."]]},{"q":"듣기 좋은 말만 하는 사람, 곁에 있어?","o":[["있어","조심해. 길든 짐승 중에 제일 아프게 무는 게 아첨꾼이야."],["없어","좋네. 쓴소리 해 주는 사람이 있으면 그 사람 꼭 붙잡아."]],"src":"디오게네스 라에르티오스 6권 51"},{"q":"비싼 거 사면 오히려 불안해져?","o":[["좀 그래","금이 왜 창백한지 알아? 노리는 도둑이 너무 많아서야."],["아니, 좋아","좋을 때 즐겨. 그래도 비싼 건 노리는 눈도 많다는 건 알아 둬."]],"src":"디오게네스 라에르티오스 6권 51"},{"q":"누가 비웃으면 오래 신경 쓰여?","o":[["오래 가","비웃는 건 그 사람들 몫이야. 나는 웃음거리가 된 적은 많아도 그 웃음에 무너진 적은 없어."],["금방 잊어","좋아. 웃음은 지나가. 너만 안 무너지면 돼."]],"src":"디오게네스 라에르티오스 6권 54"},{"q":"남을 따라 하는 거 나빠?","o":[["나쁘진 않아","좋은 걸 따라 하는 건 괜찮아. 나는 쥐한테서 사는 법을 배웠어."],["나빠","그럼 아이한테 손으로 물 마시는 법을 배운 나는 뭐가 돼?"]]},{"q":"요즘 사는 게 좀 꼬인 느낌이야?","o":[["좀 그래","사는 것 자체는 나쁜 게 없어. 꼬인 데가 있으면 거기만 풀면 돼."],["괜찮아","좋네. 사는 것 자체엔 원래 나쁠 게 없어. 꼬이는 건 대개 사는 방식이지."]],"src":"디오게네스 라에르티오스 6권 55"},{"q":"눈치 보이는 고급 식사 자리, 갈 거야?","o":[["갈래","나는 안 갔어. 높은 사람 집 진수성찬보다 아테네에서 소금 몇 알 먹는 게 나았어."],["안 갈래","나랑 같네. 소금 몇 알이라도 내 자리에서 먹는 게 맛있어."]],"src":"디오게네스 라에르티오스 6권 57"},{"q":"편하자고 누구 비위 맞춰 본 적 있어?","o":[["있지","누가 그러더라. 왕한테 잘 보이면 상추 씻을 일 없다고. 나는 상추 씻을 줄 알면 굽실댈 일 없다고 했어."],["없어","좋아. 대신 상추는 네가 씻어야 해. 그게 자유의 값이야."]],"src":"디오게네스 라에르티오스 6권 58"},{"q":"무슨 일이 닥쳐도 괜찮을 자신 있어?","o":[["있어","나는 철학으로 딱 그거 하나 얻었어. 어떤 운이 와도 준비된 마음."],["없어","그게 배우는 이유야. 철학에서 뭘 얻었냐길래, 어떤 운이 와도 버틸 마음이라고 했어."]],"src":"디오게네스 라에르티오스 6권 63"},{"q":"나쁜 무리 속에 있으면 너도 물들까?","o":[["물들 것 같아","햇빛은 하수구에도 들어가지만 더러워지지 않아. 네가 단단하면 돼."],["안 물들어","좋아. 나도 지저분한 데 다닌다고 욕먹었어. 해도 거길 비추잖아."]],"src":"디오게네스 라에르티오스 6권 63"},{"q":"좋은 말 해 놓고 정작 안 지킨 적 있어?","o":[["있어","그럼 하프랑 비슷해. 좋은 소리는 내는데 자기 소리는 못 들어."],["없어","대단하다. 말한 대로 하는 사람은 정말 드물어."]],"src":"디오게네스 라에르티오스 6권 64"},{"q":"다들 가는 쪽 말고 반대로 가 본 적 있어?","o":[["있어","나도. 극장 끝나고 다들 나올 때 나는 들어갔어. 평생 그 연습을 하는 중이야."],["없어","한번 해 봐. 사람들 사이를 거슬러 걷는 것도 연습이 필요해."]],"src":"디오게네스 라에르티오스 6권 64"},{"q":"사고 싶은 거 생기면 못 참는 편이야?","o":[["못 참아","그럼 누가 주인이야? 욕심이 시키는 대로 하면 하인이 주인 말 듣는 거랑 같아."],["좀 참아","좋아. 욕심을 다룰 줄 알면 주인이고, 욕심한테 끌려다니면 하인이야."]],"src":"디오게네스 라에르티오스 6권 66"},{"q":"공부는 몇 살까지 해야 할까?","o":[["학교 때까지","졸업하면 끝? 배움은 젊을 땐 브레이크가 되고, 늙어선 위로가 돼. 오래 쓸 데가 많아."],["평생","맞아. 배움은 가난한 사람한텐 재산이고, 늙은 사람한텐 위로야."]],"src":"디오게네스 라에르티오스 6권 68"},{"q":"세상에서 제일 아름다운 게 뭐야?","o":[["자연이나 사람","그것도 좋지. 나는 할 말을 거리낌 없이 할 수 있는 거라고 했어."],["모르겠어","나는 답이 있어. 하고 싶은 말을 숨기지 않고 할 수 있는 자유."]],"src":"디오게네스 라에르티오스 6권 69"},{"q":"마음도 운동처럼 단련될까?","o":[["될 것 같아","되지. 피리 부는 사람도 매일 연습해서 늘잖아. 그만큼 마음에 쏟으면 헛수고가 안 돼."],["타고나는 거야","운동선수도 처음부터 잘하진 않았어. 쉬지 않고 연습해서 된 거야. 마음도 같아."]],"src":"디오게네스 라에르티오스 6권 70"},{"q":"참는 것도 익숙해지면 즐거울까?","o":[["그럴 리가","진짜야. 편한 데 길든 사람이 불편을 괴로워하듯, 참는 데 길들면 참는 게 더 즐거워."],["그럴 것 같아","맞아. 처음만 힘들어. 길들면 안 누리는 게 누리는 것보다 더 즐거워져."]],"src":"디오게네스 라에르티오스 6권 71"},{"q":"좋은 집안 출신이면 다르게 보여?","o":[["좀 그래","나는 출신이나 명성을 다 비웃었어. 나쁜 버릇을 덮는 화려한 장식인 경우가 많거든."],["아니","집안이나 이름값은 겉치레야. 그 사람 자체를 봐."]],"src":"디오게네스 라에르티오스 6권 72"},{"q":"윗사람 앞에서 작아지는 편이야?","o":[["좀 작아져","사자는 밥 주는 사람의 노예가 아니야. 오히려 밥 주는 쪽이 사자 눈치를 봐. 겁먹는 쪽이 노예야."],["안 작아져","좋아. 나는 노예로 팔려 가서도 그랬어. 두려워하는 쪽이 노예라고."]],"src":"디오게네스 라에르티오스 6권 75"}],"epi":[{"q":"행복하려면 뭐가 더 필요할 것 같아?","o":[["돈","물 한 잔이랑 빵 한 조각이면 나는 신도 안 부러웠어. 정말 더 필요해?"],["시간","시간은 있어. 다른 데 쓰고 있을 뿐이지."]]},{"q":"걱정했던 일, 대부분 일어났어?","o":[["대부분 일어났지","정말? 그중에 걱정해서 막은 건 몇 개야?"],["거의 안 일어났어","그럼 그 걱정은 뭘 위해 한 걸까?"]]},{"q":"다시 스무 살로 돌아가고 싶어?","o":[["돌아가고 싶어","젊을 땐 운에 이리저리 휘둘려. 좋은 날을 많이 쌓아 둔 지금이 더 든든해."],["지금이 좋아","좋아. 그땐 바라기만 하던 걸 이제는 추억으로 갖고 있잖아."]],"src":"바티칸 금언 17"},{"q":"힘들 때 부를 친구 있어?","o":[["있어","그럼 넌 부자야. 지혜가 주는 것 중에 제일 큰 게 우정이라고 나는 늘 말했어."],["잘 모르겠어","그럼 오늘 한 명한테 먼저 연락해 봐. 나도 친구들이랑 정원에 모여 살았어."]]},{"q":"백 살까지 살고 싶어?","o":[["당연하지","몸은 끝없이 살고 싶어 해. 근데 즐거움은 길이로 안 늘어. 오늘 다 누리면 충분해."],["별로","나도 그래. 앞날의 두려움을 내려놓으면 끝없는 시간이 필요 없어."]],"src":"중요한 가르침 20"},{"q":"'이 정도면 됐다' 말해 본 적 있어?","o":[["있어","좋아. 충분한 걸 모자라다고 여기면 뭘 가져도 모자라거든. 넌 그 말을 아네."],["아직","한 번 해 봐. 그 말을 모르면 뭘 가져도 모자라."]],"src":"바티칸 금언 68"},{"q":"나이 드는 게 무서워?","o":[["무서워","나이는 숫자보다 기억이 정해. 지나간 좋은 날을 잊는 날, 그때 늙는 거야."],["별로","받은 좋은 것들을 잊지 않으면 마음은 안 늙어."]],"src":"바티칸 금언 19"},{"q":"행복은 좀 미뤄도 될 것 같아?","o":[["미뤄도 돼","우린 한 번만 태어나. 내일은 네 것도 아닌데 즐거움을 미루고 있는 거야."],["지금 해야지","맞아. 미루다가 제대로 쉬어 보지도 못하고 가는 사람이 많아."]],"src":"바티칸 금언 14"},{"q":"잘나가는 사람 보면 질투 나?","o":[["나지","질투할 이유가 없어. 좋은 사람은 잘될 만하고, 나쁜 사람은 잘될수록 스스로 망가져."],["별로","나는 누구도 부러워하지 말라고 했어. 따져 보면 부러울 이유가 없거든."]],"src":"바티칸 금언 53"},{"q":"죽고 나면 아플까?","o":[["아플 것 같아","내가 있을 땐 죽음이 없고, 죽음이 오면 내가 없어. 둘이 만날 일이 없어."],["모르겠어","생각해 봐. 내가 있을 땐 죽음이 없고, 죽음이 오면 내가 없어."]]},{"q":"바르게 살면서 즐겁기도 할 수 있을까?","o":[["어려울걸","나는 반대로 봐. 바르게 살지 않으면 즐겁게 살 수도 없어."],["될 것 같아","나도 그렇게 봐. 즐겁게 사는 거랑 바르게 사는 건 서로 떼어 놓을 수가 없어."]],"src":"중요한 가르침 5"},{"q":"야식 먹고 후회한 적 있어?","o":[["자주","야식이 나쁜 건 아니야. 다음 날 따라오는 불편이 더 크면 그게 문제지."],["거의 없어","즐거움 자체엔 나쁜 게 없어. 따라오는 대가만 잘 보면 돼."]],"src":"중요한 가르침 8"},{"q":"신나게 놀고 나면 걱정도 사라져?","o":[["잠깐은","잠깐이지. 노는 게 두려움까지 없애 주면 나도 안 말려. 근데 그건 못 하거든."],["그대로야","그렇지. 마음속 두려움은 노는 걸로는 안 풀려. 따로 들여다봐야 해."]],"src":"중요한 가르침 10"},{"q":"제일 큰 즐거움이 뭐야?","o":[["맛있는 거","좋지. 근데 배탈 나면 끝이야. 내일까지 좋은 걸로 골라."],["걱정 없는 거","나도. 몸이 안 아프고 마음이 안 시끄러운 거. 그게 제일이야."]]},{"q":"월급 오르면 쓰고 싶은 것도 같이 늘어?","o":[["같이 늘어","몸이 바라는 건 끝이 있고 구하기도 쉬워. 같이 느는 쪽은 대개 헛된 생각이 만든 거야."],["그대로야","좋아. 자연이 바라는 부는 금방 채워져. 거기서 멈출 줄 알면 돼."]],"src":"중요한 가르침 15"},{"q":"친구한테 마지막으로 고맙다고 한 게 언제야?","o":[["최근에","좋아. 우정은 자주 물을 줘야 자라."],["기억 안 나","오늘 한 줄 보내 봐. 길 필요 없어."]]},{"q":"오늘 한 선택, 왜 했는지 말할 수 있어?","o":[["말할 수 있어","좋아. 고를 때마다 그게 결국 뭘 위해서인지 떠올려. 그러면 덜 헤매."],["그냥 했어","그럼 하나만 되짚어 봐. 뭘 위해서였는지 모르면 생각 따로 행동 따로 놀아."]],"src":"중요한 가르침 25"},{"q":"행복은 많이 즐기는 걸까, 덜 괴로운 걸까?","o":[["많이 즐기기","많이 즐기면 다음 날 머리가 아파. 나는 덜 괴로운 쪽을 골랐어."],["덜 괴롭기","나랑 같네. 몸이 편하고 마음이 조용하면 그게 최고야."]]},{"q":"못 산 물건, 일주일 지나도 생각나?","o":[["계속 생각나","그럼 그게 구하기 어려운지, 해롭진 않은지 따져 봐. 의외로 쉽게 놓을 수 있어."],["잊었어","그거야. 못 가져도 안 아픈 욕심은 꼭 필요한 게 아니었어."]],"src":"중요한 가르침 26"},{"q":"갖고 싶은 게 생기면 바로 사?","o":[["응","사고 사흘 뒤에도 기쁠까? 그걸 기준으로 해 봐."],["좀 참아","좋아. 원하는 걸 하나 줄이면 그만큼 부자가 돼."]]},{"q":"힘든 시기가 끝없이 갈 것 같을 때 있어?","o":[["있어","무서운 일은 영원하지 않고 생각만큼 길지도 않아. 그동안 제일 든든한 건 친구야."],["없어","다행이다. 그런 때가 와도 기억해. 나쁜 시기는 생각만큼 안 길어."]],"src":"중요한 가르침 28"},{"q":"신한테 벌받을까 봐 무서웠던 적 있어?","o":[["있어","나는 신들이 우리 일로 화내지 않는다고 봤어. 무서움부터 내려놔."],["없어","좋아. 두려움 없는 마음이 즐거움의 시작이야."]]},{"q":"명품 갖고 싶은 마음, 배고픔만큼 진짜야?","o":[["진짜야","배고픔은 밥 먹으면 끝나. 명품 욕심은 하나 사면 또 생기지. 그건 헛된 생각이 만든 거야."],["좀 다르지","맞아. 배고픔은 채워야 하지만, 명품 욕심은 헛된 생각에서 나온 쪽이야."]],"src":"중요한 가르침 29"},{"q":"아픈 데 없는 하루, 고마워해 본 적 있어?","o":[["있어","좋아. 몸이 안 아프면 행복은 벌써 반이야. 그거 잊지 마."],["별로","다들 아플 때만 알아. 안 아픈 오늘이 이미 반은 행복이야."]]},{"q":"몰래 한 잘못, 시간 지나면 마음 편해져?","o":[["편해지지","만 번을 안 들켜도, 죽을 때까지 들킬까 봐 마음 졸이게 돼."],["계속 걸려","그래서 몰래 하는 일은 손해야. 불안이 끝까지 따라다니거든."]],"src":"중요한 가르침 35"},{"q":"좋았던 기억 하나만 꺼내 볼래?","o":[["꺼내 볼게","좋아. 나는 많이 아플 때 친구들이랑 나눈 대화를 떠올리며 버텼어."],["잘 안 떠올라","천천히. 작은 거라도 돼. 따뜻했던 밥 한 끼."]]},{"q":"안 맞는 사람, 어떻게 대해?","o":[["멀리해","먼저 품을 수 있는지 봐. 안 되면 적만 안 되게, 그것도 안 되면 그때 거리를 둬."],["맞춰 봐","품을 수 있는 사람은 최대한 품는 게 제일 안전해."]],"src":"중요한 가르침 39"},{"q":"인기가 많으면 좋을까?","o":[["좋지","인기는 남이 주는 거라 남이 가져가. 친구는 안 그래."],["피곤할 것 같아","맞아. 나는 숨어서 조용히 살라고 했어."]]},{"q":"오늘 좋았던 순간, 하나라도 있었어?","o":[["있었어","그 순간 뭐가 좋았는지 기억해 둬. 내일 또 만들 수 있게."],["없었어","그럼 지금 하나 만들자. 물 한 잔 천천히 마시기."]]},{"q":"친구 성격의 단점, 봐줄 수 있어?","o":[["봐줄 수 있어","좋아. 내 성격은 단점까지 내 거라 아끼잖아. 친구 것도 그렇게 아껴 주면 돼."],["좀 어려워","그럴 수 있어. 근데 내 단점은 잘만 봐주잖아. 친구한테도 그만큼만 해 봐."]],"src":"바티칸 금언 15"},{"q":"일을 너무 많이 하는 것 같아?","o":[["응","뭘 위해 일해? 그게 일을 더 해야만 얻는 거야?"],["적당해","좋아. 남는 시간은 친구한테 써."]]},{"q":"나쁜 줄 알면서 고른 적 있어?","o":[["있어","그때는 더 나쁜 것보다 나아 보였을 거야. 미끼는 늘 그렇게 생겼어."],["없어","대부분 그래. 나쁜 걸 알고 고르진 않아. 좋아 보여서 덥석 무는 거지."]],"src":"바티칸 금언 16"},{"q":"돈이 많아지면 걱정이 줄까?","o":[["줄겠지","큰돈은 큰 걱정을 데려와. 지킬 게 생기거든."],["아니","맞아. 걱정은 돈보다 생각이 만들어."]]},{"q":"작은 일에도 기뻐할 줄 알아?","o":[["응","그게 재능이야. 작은 걸로 기쁘면 매일 기쁠 수 있어."],["잘 안 돼","연습하면 돼. 오늘 밥 한 숟갈만 천천히 먹어 봐."]]},{"q":"연락 끊기면 마음도 식을까?","o":[["식겠지","그렇지. 안 보고 안 만나면 아무리 뜨겁던 마음도 대개 식어."],["그대로일걸","그럴 수도 있어. 그래도 보고 만나는 게 다 사라지면 대부분은 서서히 식어."]],"src":"바티칸 금언 18"},{"q":"미래가 걱정돼?","o":[["응","미래는 반은 네 거, 반은 아니야. 네 쪽 반만 챙겨."],["별로","좋아. 오늘을 잘 쓰면 미래도 덜 무서워."]]},{"q":"좋아하는 사람이랑 매일 밥 먹을 수 있다면?","o":[["좋지","그럼 넌 거의 다 가진 거야. 나는 우정을 제일 큰 행복으로 꼽았어."],["부담스러워","매일은 아니어도 돼. 자주면 돼."]]},{"q":"몸이 원하는 거, 참는 편이야?","o":[["참는 편","다 참을 필요는 없어. 꼭 필요한 거, 해 없는 건 들어주고 해로운 것만 단호히 끊어."],["들어주는 편","좋아. 몸 말은 들어주되, 해로운 것만 골라서 끊어."]],"src":"바티칸 금언 21"},{"q":"남한테 잘 보이려고 쓴 돈, 아까워?","o":[["아까워","다음엔 너를 위해 써. 좋은 친구랑 밥 한 끼."],["아니","그게 너를 기쁘게 했으면 괜찮아. 사흘 뒤에도 기쁘다면."]]},{"q":"필요해서 시작한 친구 사이, 진짜 우정일까?","o":[["진짜지","응. 우정은 도움에서 시작해도, 나중엔 그 자체로 귀해져."],["좀 애매해","우정은 대개 그렇게 시작해. 시작이 필요였어도 나중엔 그 사람 자체가 좋아지거든."]],"src":"바티칸 금언 23"},{"q":"슬픈 일이 생기면 어떻게 해?","o":[["혼자 삭혀","혼자 들기엔 무거워. 친구한테 반만 나눠 줘."],["누구한테 말해","좋아. 나눈 슬픔은 가벼워져."]]},{"q":"통장에 얼마 있으면 부자 같을까?","o":[["많을수록","한도 없는 부는 오히려 큰 가난이야. 늘 모자라거든."],["적어도 돼","맞아. 필요한 만큼만 있으면 돼. 그 기준으로 재면 가난해 보여도 부자야."]],"src":"바티칸 금언 25"},{"q":"너무 바쁘면 행복할 틈이 있을까?","o":[["없지","그래서 일부러 틈을 만들어야 해. 하루 10분이라도."],["바빠도 행복해","좋아. 그 바쁨이 네가 고른 거라면."]]},{"q":"인기 없는 의견, 그래도 말하는 편이야?","o":[["말해","나도. 박수받는 말보다 쓸모 있는 말을 솔직하게 하는 쪽을 골랐어."],["삼켜","그럴 때도 있지. 근데 늘 맞추기만 하면 박수는 받아도 남는 게 없어."]],"src":"바티칸 금언 29"},{"q":"친구랑 다투면 먼저 연락해?","o":[["응","멋지다. 이기는 것보다 친구가 남는 게 커."],["기다려","얼마나? 그 사이 우정은 목이 말라."]]},{"q":"앞일 대비, 많이 해 두는 편이야?","o":[["많이 해 둬","대비할 수 있는 건 해 둬. 근데 죽음 앞에선 우리 모두 성벽 없는 도시에 살아."],["별로","어차피 다 막을 순 없어. 막을 수 없는 걸로 마음 졸일 필요는 없고."]],"src":"바티칸 금언 31"},{"q":"행복한 척해 본 적 있어?","o":[["있어","척은 오래 못 가. 진짜 즐거운 거 하나만 찾아보자."],["없어","좋아. 솔직한 게 마음이 편하지."]]},{"q":"친구한테 실제로 도움받은 적 많아?","o":[["많아","좋네. 근데 더 큰 건, 부르면 와 줄 거라는 믿음이야."],["별로 없어","괜찮아. 도움 그 자체보다 필요할 때 도와줄 거라는 믿음이 더 필요해."]],"src":"바티칸 금언 34"},{"q":"살면서 꼭 피하고 싶은 건?","o":[["아픔","센 아픔은 대개 짧고, 긴 아픔은 대개 약해. 나는 그렇게 버텼어."],["후회","그럼 오늘 할 말은 오늘 해. 미루면 후회가 돼."]]},{"q":"친구한테 부탁, 잘하는 편이야?","o":[["자주 해","늘 도움만 바라면 우정이 장사가 돼. 고마움 대신 이득을 챙기게 되거든."],["거의 안 해","아예 안 기대면 친구 사이에 희망도 없어져. 가끔은 기대도 돼."]],"src":"바티칸 금언 39"},{"q":"나눠 주는 거랑 받는 거, 뭐가 편해?","o":[["받는 거","적게 사는 데 익숙해지면 주는 게 더 편해져. 이미 넉넉하거든."],["주는 거","좋아. 필요가 적은 사람이 나누는 법도 더 잘 알아."]],"src":"바티칸 금언 44"},{"q":"자랑하고 싶은 일, 바로 말하는 편이야?","o":[["바로 말해","자랑은 남의 박수를 기다리는 거야. 네 됨됨이로 뿌듯하면 그걸로 충분해."],["참아","좋아. 박수 없이도 뿌듯하면 그게 진짜 네 거야."]],"src":"바티칸 금언 45"},{"q":"지나간 일, 되돌리고 싶을 때 있어?","o":[["자주","일어난 일은 못 되돌려. 그걸 받아들이고, 좋았던 기억으로 마음을 달래 봐."],["가끔","그럴 땐 좋았던 날을 떠올려. 그게 불운을 견디는 약이야."]],"src":"바티칸 금언 55"},{"q":"먹어도 먹어도 허전할 때 있어?","o":[["있어","배는 원래 채워져. 끝없이 채워야 한다는 생각이 허전함을 만드는 거야."],["없어","좋아. 배는 금방 차. 끝없는 건 늘 생각 쪽이야."]],"src":"바티칸 금언 59"},{"q":"아끼려고 궁상떨어 본 적 있어?","o":[["있어","검소함에도 선이 있어. 지나치게 아끼는 것도 사치만큼 잘못이야."],["없어","좋아. 소박하게 사는 데도 선이 있어. 넌 그걸 아는구나."]],"src":"바티칸 금언 63"},{"q":"네 힘으로 될 일인데 빌기만 한 적 있어?","o":[["있어","네 손으로 할 수 있는 건 신께 부탁할 일이 아니야. 직접 하면 돼."],["없어","좋아. 신한테 빌 시간에 손 한 번 움직이는 게 빠르지."]],"src":"바티칸 금언 65"},{"q":"떠난 친구가 생각나면 어떻게 해?","o":[["울어","울어도 돼. 그래도 그 친구를 아끼는 길은 결국 즐겁게 떠올리는 거야."],["좋은 기억 꺼내","좋아. 그게 떠난 친구를 제일 아끼는 방법이야."]],"src":"바티칸 금언 66"},{"q":"돈 많이 벌려면 남 눈치 봐야 할까?","o":[["어쩔 수 없지","맞아. 큰돈은 대개 남 비위를 맞춰야 와. 나는 큰돈 대신 자유를 골랐어. 필요한 건 늘 넉넉했고."],["아닐걸","그럴 수도 있지. 눈치 안 보고 벌었다면, 그 돈은 주변이랑 나누면 돼."]],"src":"바티칸 금언 67"},{"q":"하고 싶은 게 생기면, 결과까지 따져 봐?","o":[["따져 봐","좋아. 이뤘을 때 어떻게 될지, 못 이뤘을 때 어떻게 될지 둘 다 물어봐야 해."],["일단 해","해 보는 것도 좋아. 그래도 이루면 어떻고 못 이루면 어떤지 한 번은 물어봐."]],"src":"바티칸 금언 71"},{"q":"말싸움에서 지면 분해?","o":[["분해","따져 보면 진 쪽이 더 얻어. 새로 배운 게 제일 많으니까."],["별로","토론에서 지는 사람이 제일 많이 배우거든."]],"src":"바티칸 금언 74"},{"q":"기분 안 좋은 날, 티 내는 편이야?","o":[["티 내","티 내면 옆 사람까지 흔들려. 네 마음이 먼저 가라앉으면 둘 다 편해."],["숨겨","숨기느라 너만 힘들면 그것도 흔들리는 거야. 마음이 고요하면 너도 남도 편해."]],"src":"바티칸 금언 79"},{"q":"사람들이 많이 알아주면 마음이 채워져?","o":[["채워지지","잠깐은. 큰 재산도 군중의 박수도 마음속 소란을 없애 주진 못해."],["잠깐뿐","맞아. 박수 소리는 금방 그치더라. 진짜 기쁨은 다른 데서 와."]],"src":"바티칸 금언 81"},{"q":"행복해지는 법 배우기에 늦은 나이가 있을까?","o":[["있지","없어. 늦었다는 건 행복할 때가 지났다는 말인데, 그런 때는 없거든."],["없지","맞아. 젊으면 젊어서, 늙으면 늙어서 배울 이유가 있어."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 122"},{"q":"아무 일 없는 날, 심심해서 불안해?","o":[["불안해","몸이 편하고 마음이 고요하면 그게 목표야. 없는 걸 찾아 나설 필요가 없어."],["편안해","좋아. 아픈 데 없고 걱정 없는 날, 나는 그게 제일 좋은 날이라고 봐."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 128"},{"q":"나중에 좋자고 지금 힘든 거, 해 볼 만해?","o":[["해 볼 만해","맞아. 오래 참은 수고가 더 큰 즐거움을 데려오면, 그 고통은 고를 만해."],["싫어","즐거움도 다 고르진 않잖아. 아픔도 다 피할 건 아니야. 결과까지 보고 정해."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 129"},{"q":"적게 가져도 괜찮은 연습, 해 본 적 있어?","o":[["해 봤어","사치를 제일 달게 즐기는 사람은 사치가 제일 덜 필요한 사람이야."],["없어","늘 적게 쓰자는 건 아니야. 가진 게 적은 날이 와도 괜찮게 미리 연습해 두는 거지."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 130"},{"q":"중요한 결정, 기분대로 해?","o":[["기분대로","즐겁게 살려면 차분히 따져 보는 게 먼저야. 나는 그 신중함을 철학보다 귀하게 여겼어."],["따져 봐","좋아. 나는 그렇게 따지는 신중함에서 다른 좋은 점들이 다 나온다고 봐."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 132"},{"q":"일이 꼬이면 '팔자'라는 생각 들어?","o":[["가끔 들어","어떤 건 어쩔 수 없고, 어떤 건 우연이고, 어떤 건 네가 고른 거야. 다 팔자는 아니야."],["아니","우리 손에 달린 일이 있으니까 칭찬도 책임도 생기는 거야."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 133"},{"q":"열심히 했는데 운이 없었던 적 있어?","o":[["있어","잘 생각하고 한 거면 손해 아니야. 나는 지혜로운 사람의 불운이 어리석은 사람의 행운보다 낫다고 봐."],["별로","좋아. 운은 출발점만 줘. 행복한 삶은 결국 네 판단이 만들어."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 134"},{"q":"좋은 생각, 같이 나눌 친구 있어?","o":[["있어","좋아. 그런 친구랑 자주 같이 곱씹어. 그럼 힘든 날에도 덜 흔들려."],["없어","하나 찾아봐. 생각이 닮은 사람이랑 함께 연습하면 훨씬 단단해져."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 135"},{"q":"돗자리 펴고 나무 그늘에 누워 본 적 있어?","o":[["있어","그거면 돼. 큰돈 안 들여도 냇가 풀밭에 누워 있는 게 금빛 잔치 못지않아."],["오래됐어","날 좋을 때 한번 가 봐. 풀밭이랑 그늘이면 비싼 연회장 부럽지 않아."]],"src":"루크레티우스, 사물의 본성에 관하여 2권 29–33행"},{"q":"답답하면 일단 어디론가 떠나고 싶어?","o":[["떠나고 싶어","떠나 봐도 그 답답함은 같이 가. 다들 자기한테서 도망치는데, 자기는 못 떼어 내."],["그냥 있어","좋아. 마음이 왜 무거운지 알면, 자꾸 자리를 바꿀 필요가 없어."]],"src":"루크레티우스, 사물의 본성에 관하여 3권 1053–1070행"},{"q":"높은 자리 올라가면 편해질까?","o":[["편해지겠지","높이 올라갈수록 질투가 벼락처럼 내리쳐. 높은 데가 먼저 맞거든."],["더 피곤해","맞아. 조용히 따르는 게, 다스리겠다고 애쓰는 것보다 훨씬 나을 때가 많아."]],"src":"루크레티우스, 사물의 본성에 관하여 5권 1120–1130행"}]};

// missions: one real-life action per philosopher, posted on the board each morning. why = where it comes from.
const MIS={
  soc:[{t:'고민 중인 결정 하나에 "왜?"를 세 번 연달아 물어보기',why:'소크라테스는 묻고 또 물어서, 처음 댄 이유 밑에 있는 진짜 이유를 찾게 했어요. 진짜 이유를 알면 결정이 쉬워져요.',ok:'진짜 이유가 나왔어? 그럼 고르기가 한결 쉬울 거야.'},
       {t:'회의나 수업에서 모르는 걸 넘기지 말고 한 번 물어보기',why:'델포이 신탁이 그를 가장 지혜롭다고 하자, 소크라테스는 "나는 모른다는 걸 알 뿐"이라고 답했어요. 모른다고 인정해야 배울 수 있어요.',ok:'물어보니 별거 아니었지? 다른 사람도 궁금했을 거야.'},
       {t:'폰 없이 15분 걸으며, 요즘 제일 큰 고민 하나만 생각하기',why:'"검토하지 않는 삶은 살 가치가 없다." 사형 재판에서 그가 한 말이에요. 생각할 시간을 따로 떼어 두는 것부터가 검토예요.',min:15,ok:'답이 안 나와도 돼. 고민이 선명해졌으면 충분해.'},
       {t:'누가 한 말에 반박하기 전에, "그게 무슨 뜻이야?" 먼저 물어보기',why:'소크라테스는 늘 "용기가 뭐야?", "정의가 뭐야?"부터 물었어요. 뜻부터 맞추면 엉뚱한 걸로 싸우지 않아요.',ok:'뜻을 물어보니 생각보다 같은 얘기였지?'},
       {t:'내가 확신하는 생각 하나에, 반대편 이유 세 개 대 보기',why:'소크라테스는 자기 생각도 반박에 내놓고 버티는지 봤어요. 반박을 견딘 생각만 진짜 내 생각이 돼요.',ok:'세 개 다 댔는데도 남았으면, 그 생각은 단단한 거야.'},
       {t:'자기 전에 오늘 내가 틀렸던 것 하나 떠올리기',why:'소크라테스는 자기가 남보다 나은 점은 모른다는 걸 안다는 것 하나뿐이라고 했어요. 틀린 걸 알아채는 게 그 시작이에요.',ok:'틀린 걸 찾은 사람이 오늘 제일 많이 배운 사람이야.'}],
  nie:[{t:'이어폰 없이 20분 걷기',why:'"정말 위대한 생각은 모두 걷는 중에 떠오른다." 니체는 매일 몇 시간씩 걸으며 책을 썼어요.',min:20,ok:'봐. 다리가 움직이면 생각도 움직여.'},
       {t:'제일 미뤄 둔 일, 딱 10분만 하기',why:'"왜 사는지 아는 사람은 거의 어떤 어려움도 견딘다." 니체의 말이에요. 왜 하는지 떠올리면 10분은 버틸 수 있어요.',min:10,ok:'10분이면 시작한 거야. 시작한 일은 미룬 일이 아니야.'},
       {t:'남들 다 하니까 하던 일 하나, 오늘은 안 하기',why:'니체는 이유 없이 무리를 따르는 걸 "무리의 도덕"이라 불렀어요.',ok:'무리 밖은 좀 춥지? 대신 공기가 좋아.'},
       {t:'자기 전에 "오늘을 똑같이 무한히 반복해도 좋을까?" 물어보기',why:'니체의 영원회귀예요. 지금 삶이 영원히 그대로 되풀이된다면 기꺼이 받아들이겠냐고 물었어요.',ok:'아니라면 내일 하나만 바꿔 보자. 그게 시작이야.'},
       {t:'엘리베이터 대신 계단으로 가기',why:'"나를 죽이지 못하는 것은 나를 더 강하게 만든다." 니체는 버거운 걸 피하지 말고 힘으로 바꾸라고 했어요.',ok:'숨차지? 그게 힘이 붙는 소리야.'},
       {t:'오늘 하나는 남의 눈치 말고 내 취향대로 고르기',why:'"너는 너 자신이 되어야 한다." 옷이든 메뉴든 노래든, 작은 선택부터 내 걸로 하는 연습이에요.',ok:'네 취향 나쁘지 않던데?'}],
  dio:[{t:'안 쓰는 물건 하나 버리거나 나눠 주기',why:'디오게네스는 아이가 손으로 물을 떠 마시는 걸 보고, 하나 남은 컵마저 버렸어요.',ok:'가벼워졌지? 나도 그랬어.'},
       {t:'오늘 사고 싶은 것 하나, 사지 않기',why:'알렉산드로스 대왕이 소원을 묻자 디오게네스는 "햇빛이나 가리지 마"라고만 했어요.',ok:'없어도 살 만하지?'},
       {t:'눈치 보느라 못 한 말, 하나만 정중하게 하기',why:'디오게네스는 사람에게 가장 아름다운 것으로 거침없이 말하는 용기, 파레시아를 꼽았어요.',ok:'하늘 안 무너졌지?'},
       {t:'오늘 하루 배달 앱 열지 않기',why:'"신은 아무것도 필요 없고, 신에 가까운 사람은 필요한 게 적다." 디오게네스의 말이에요. 없이 지내 보면 정말 필요한 게 보여요.',ok:'하루 버텼네. 생각보다 할 만하지?'},
       {t:'처음 보는 사람에게 먼저 인사하기',why:'어디 사람이냐는 물음에 디오게네스는 "나는 세계 시민"이라고 답했어요. 모르는 사람도 다 같은 동네 사람이라는 거예요.',ok:'인사 받으니 좋아하지? 원래 다 이웃이야.'},
       {t:'냉장고에 있는 것만으로 한 끼 해 먹기',why:'디오게네스는 통 하나, 망토 한 벌로 살았어요. 있는 걸로 해결하는 사람은 아무것에도 휘둘리지 않아요.',ok:'있는 걸로 됐지? 모자란 건 생각보다 적어.'}],
  epi:[{t:'용건 없이 친구 한 명에게 먼저 연락하기',why:'"지혜가 행복을 위해 마련하는 것 가운데 가장 큰 것은 우정이다." 그래서 그는 친구들과 살 정원을 샀어요.',ok:'답장 왔어? 그게 정원이야.'},
       {t:'한 끼를 폰 없이 15분 넘게 천천히 먹기',why:'에피쿠로스에게 쾌락은 몸이 편하고 마음이 고요한 상태였어요. 빵과 물만으로도 신이 부럽지 않다고 했죠.',min:15,ok:'맛이 달랐지? 즐거움은 천천히 와.'},
       {t:'장바구니에 담아 둔 것 하나, 사지 말고 하루 묵혀 보기',why:'에피쿠로스는 욕망을 꼭 필요한 것, 없어도 되는 것, 헛된 것으로 나눴어요. 헛된 욕망은 하루만 지나도 식어요.',ok:'하루 지나니 덜 갖고 싶지? 그건 없어도 되는 쪽이었어.'},
       {t:'같이 밥 먹고 싶은 사람에게 약속 잡기',why:'에피쿠로스는 무엇을 먹을지보다 누구와 먹을지를 먼저 보라고 했어요. 친구 없이 먹는 건 사자나 늑대의 삶이라면서요.',ok:'약속 잡았어? 그날 밥은 분명 맛있을 거야.'},
       {t:'자기 전에 오늘 좋았던 순간 세 개 떠올리기',why:'에피쿠로스는 죽는 날 몹시 아팠는데도 친구와 나눈 대화를 떠올리며 기뻐했어요. 좋은 기억은 꺼내 쓸 수 있는 즐거움이에요.',ok:'세 개 다 찾았어? 그게 오늘의 열매야.'},
       {t:'꼭 안 가도 되는 약속 하나, 정중히 거절하기',why:'"숨어서 살아라." 에피쿠로스는 남의 눈에 들려고 애쓰기보다 조용한 마음을 지키라고 했어요.',ok:'저녁이 생겼지? 그게 진짜 쾌락이야.'}]};

const MIS_ADD={"soc":[{"t":"마트나 편의점 한 바퀴 돌면서, 없어도 사는 데 지장 없는 물건 세 개 찾기","why":"소크라테스는 시장에 쌓인 물건들을 보고 \"내게 필요 없는 게 이렇게나 많구나\" 했대요.","ok":"세 개 금방 찾았지? 필요한 건 생각보다 적어."},{"t":"친구나 가족에게 \"좋은 친구가 뭐라고 생각해?\" 묻고, 답이 나오면 \"왜?\"를 두 번 더 묻기","why":"소크라테스는 자기 일을 산파에 빗댔어요. 답을 대신 주는 게 아니라, 상대 안에 이미 있던 생각을 꺼내 준다고요.","ok":"처음 답이랑 마지막 답, 달라졌지? 그게 꺼낸 생각이야."},{"t":"대화나 뉴스에서 대충 알고 넘긴 단어 하나, 뜻 제대로 찾아보기","why":"소크라테스는 정치가, 시인, 장인을 찾아가 물었는데 다들 안다고 믿었지 설명은 못 했대요.","ok":"제대로 알고 나니 다르게 들리지?"},{"t":"다치지 않는 곳에서 5분 동안 맨발로 걸어 보기","why":"소크라테스는 한겨울 원정길에서도 맨발로 얼음 위를 걸었대요. 다른 병사들은 발을 싸매고도 떨었는데요.","ok":"발바닥이 깨어나지? 신발만 벗어도 세상이 달라져.","min":5},{"t":"5분 동안 한자리에 앉아서 질문 하나만 붙잡고 있기","why":"원정 중에 소크라테스는 새벽부터 다음 날 새벽까지 한자리에 서서 생각에 잠겼대요. 병사들이 신기해서 밤새 지켜봤고요.","ok":"5분도 길지? 하루를 버틴 사람이 있었다니까.","min":5},{"t":"오늘 하나는 메시지 대신 전화하거나 직접 만나서 말하기","why":"소크라테스는 책을 한 권도 안 썼어요. 글은 되물어도 대답을 못 하지만, 말은 주고받을 수 있다고 봤거든요.","ok":"목소리로 하니 금방 끝났지? 오해도 덜하고."},{"t":"미뤄 둔 작은 빚 하나 갚기 (빌린 물건 돌려주기, 못 한 답장, 고맙다는 말)","why":"독을 마신 소크라테스의 마지막 말은 \"아스클레피오스에게 닭 한 마리를 빚졌네, 꼭 갚아 주게\"였어요.","ok":"개운하지? 나도 마지막에 그걸 챙겼어."},{"t":"나를 잘 아는 사람에게 \"내가 모르는 내 버릇 하나만 알려 줘\" 물어보기","why":"소크라테스는 델포이 신전에 새겨진 \"너 자신을 알라\"를 평생 붙들었어요. 나를 아는 데는 남의 눈도 필요해요.","ok":"의외였어? 그게 거울에 안 보이는 쪽이야."},{"t":"생각이 다른 사람 말을 끝까지 듣고, \"그러니까 네 말은 ~라는 거지?\" 하고 정리해 주기","why":"소크라테스는 반박하기 전에 늘 상대 말을 먼저 정리해서 확인했어요. 엉뚱한 걸 두고 싸우지 않으려고요.","ok":"정리해 주니 상대가 좋아하지? 싸움이 대화가 돼."},{"t":"가까운 사람이 미뤄 둔 일, 기분 안 상하게 같이 하자고 꼬드기기 (운동, 병원, 공부)","why":"소크라테스는 자기를 굼뜬 말을 깨우는 등에라고 불렀어요. 귀찮게 굴어야 깨어난다고요.","ok":"귀찮아했어도 나중엔 고마워할 거야."},{"t":"자기 전에 오늘 하루를 질문 세 개로만 적어 보기 (답은 안 써도 돼)","why":"소크라테스는 사람들에게 돈이나 명성보다 영혼이 나아지는 데 마음을 쓰라고 했어요.","ok":"질문만 남겨도 내일이 달라."},{"t":"단골 가게 사장님이나 한 가지 일을 오래 한 사람에게 비결 하나 물어보기","why":"소크라테스가 찾아다닌 사람 중에 장인들은 적어도 자기 일만큼은 제대로 알았대요.","ok":"다들 하나씩은 깊게 알고 있지?"}],"nie":[{"t":"좋아하는 노래 한 곡 틀고, 끝날 때까지 혼자 춤추기","why":"\"한 번도 춤추지 않은 날은 잃어버린 날로 여겨야 한다.\"","ok":"어색했지? 그래도 오늘은 잃어버린 날이 아니야."},{"t":"평소 안 듣던 장르의 노래 한 곡, 끝까지 들어 보기","why":"\"음악이 없다면 삶은 하나의 오류일 것이다.\" 니체는 직접 작곡도 했어요.","ok":"취향이 하나 넓어졌네."},{"t":"오늘 짜증 났던 일 하나에서 \"덕분에\"를 하나 찾아보기","why":"니체는 운명을 견디는 데서 그치지 말고 사랑하라고 했어요. 그게 \"아모르 파티\"예요.","ok":"억지 같아도 하나는 나왔지? 그게 근육이 돼."},{"t":"동네에서 제일 높은 곳(언덕, 옥상, 전망대)에 올라가 내려다보기","why":"니체는 해발 1,800m 알프스 마을 실스마리아에서 여름을 보냈어요. 영원회귀라는 생각도 그곳 호숫가를 걷다가 떠올랐대요.","ok":"작아 보이지? 고민도 같이 작아졌으면 좋겠다."},{"t":"요즘 내 생각 하나를 딱 한 문장으로 적어 보기","why":"\"남들이 책 한 권으로 하는 말을 열 문장으로 하는 것, 그게 내 야심이다.\"","ok":"줄이니까 진짜 하고 싶은 말만 남지?"},{"t":"늘 먹던 메뉴 말고 처음 보는 메뉴 시켜 보기","why":"\"위험하게 살아라! 너희 도시를 베수비오 화산 기슭에 세워라!\"","ok":"맛있었어? 아니어도 이야깃거리는 생겼잖아."},{"t":"머릿속 복잡한 걸 5분 동안 종이 한 장에 전부 쏟아 적기","why":"\"춤추는 별을 낳으려면 자기 안에 혼돈을 품고 있어야 한다.\"","ok":"다 꺼내 놓으니 별 하나는 보이지?","min":5},{"t":"시끄러운 단톡방 하나, 오늘 하루 알림 꺼 두기","why":"차라투스트라는 시장의 파리 떼를 피해 자기 고독으로 달아나라고 했어요.","ok":"조용하지? 파리가 사라졌어."},{"t":"5분 동안 천천히 스트레칭하면서 몸이 어디가 뻐근한지 느껴 보기","why":"니체는 몸을 \"큰 이성\"이라고 불렀어요. 머리로 하는 생각은 그 안의 작은 이성이고요.","ok":"몸이 대답하지? 큰 이성이 깨어났어.","min":5},{"t":"오늘 하루, \"해야 해서\" 말고 \"하고 싶어서\" 한 일 하나 만들기","why":"니체는 정신이 낙타에서 사자로 바뀐다고 했어요. \"너는 해야 한다\"를 짊어진 낙타가, 사자가 되면 \"나는 하고자 한다\"고 말한대요.","ok":"오늘 너 사자였어."},{"t":"아침에 일어나서 폰 보기 전에 10분 동안 내 생각부터 하기","why":"니체는 아침 일찍 머리가 가장 맑을 때 남의 책부터 읽는 건 못된 짓이라고 했어요.","ok":"남의 글 말고 네 생각으로 시작한 하루야."},{"t":"어제보다 하나만 더 하기 (팔굽혀펴기 한 개, 책 한 쪽, 물 한 잔)","why":"\"인간은 극복되어야 할 무엇이다.\"","ok":"하나 더 했지? 그게 넘어서는 거야."}],"dio":[{"t":"가게에서 작은 부탁 하나 해 보기 (서비스, 덤, 자리 바꾸기). 거절당해도 성공","why":"디오게네스는 길가 동상에게 구걸했대요. 왜 그러냐고 묻자 \"거절당하는 연습\"이라고 했어요.","ok":"거절당했어? 그럼 성공이야. 들어줬으면 덤이고."},{"t":"오늘 한 번은 남들 몰리는 쪽 말고 반대로 가 보기 (점심 일찍 먹기, 안 붐비는 길)","why":"디오게네스는 공연이 끝나 사람들이 쏟아져 나올 때 혼자 극장으로 들어갔대요. 평생 이렇게 산다면서요.","ok":"한산하지? 남들 따라가면 줄만 서."},{"t":"씻을 때 마지막 30초는 찬물로 하기","why":"디오게네스는 여름엔 뜨거운 모래 위에서 통을 굴리고, 겨울엔 눈 덮인 동상을 끌어안았대요. 몸을 단련하려고요.","ok":"정신 번쩍 들지? 그게 단련이야."},{"t":"가방을 열어서 오늘 꼭 필요한 것만 남기고 다니기","why":"디오게네스의 살림은 두 겹으로 접은 망토 한 벌, 자루 하나, 지팡이 하나가 전부였어요.","ok":"가볍지? 들고 다니던 게 다 필요한 건 아니었어."},{"t":"안 좋은 일 하나를 디오게네스처럼 받아쳐서 다시 말해 보기","why":"고향 사람들이 그에게 추방을 선고했다는 말을 듣자 디오게네스가 답했대요. \"그럼 나는 그들에게 거기 눌러살라는 선고를 내리지.\"","ok":"웃으면 진 거 아니야."},{"t":"오늘 한 끼는 밖에서 먹기 (공원 벤치, 강가)","why":"디오게네스는 사람들 다 보는 광장에서 밥을 먹었어요. 왜 거기서 먹냐고 하자 \"배가 광장에서 고팠으니까\"라고 했대요.","ok":"남들 신경 쓰였어? 아무도 안 보더라."},{"t":"오늘 하루 돈 한 푼 안 쓰고 지내기","why":"디오게네스는 큰 항아리를 집 삼아 살았어요. 가진 게 없으니 뺏길 것도 없었죠.","ok":"하루 버텼어. 통 속 생활 체험 끝."},{"t":"빈말 칭찬 대신, 진짜 좋았던 점 하나를 구체적으로 말해 주기","why":"디오게네스는 길들인 짐승 중에 제일 위험한 게 아첨꾼이라고 했어요.","ok":"빈말보다 백 배는 기분 좋았을걸."},{"t":"방 바닥에 놓인 물건 다 치워서 바닥 보이게 만들기","why":"디오게네스는 통 하나에 살면서도 부족한 게 없다고 했어요.","ok":"통 안처럼 단출해졌네."},{"t":"10분 동안 햇볕 쬐면서 아무것도 안 하기","why":"알렉산드로스 대왕이 찾아왔을 때 디오게네스는 햇볕을 쬐며 누워 있었어요. 소원을 묻는 왕에게 \"햇빛이나 가리지 마\"라고 했죠.","ok":"왕이 와도 안 비켜 줄 만하지?","min":10},{"t":"지난주에 쓴 돈 중에 아까운 것 세 개 찾아보기","why":"디오게네스는 돈 욕심이 온갖 나쁜 것의 고향이라고 했어요.","ok":"다음엔 그 돈으로 뭐 할래?"},{"t":"평소와 다른 곳에서 잠깐 쉬어 보기 (도서관 구석, 공원 벤치)","why":"디오게네스는 쥐 한 마리를 보고 깨달았대요. 잠자리를 찾지도, 어둠을 무서워하지도 않고 어디서든 산다는 걸요.","ok":"어디서든 쉴 수 있지? 쥐도 알고 나도 알았어."}],"epi":[{"t":"만 원 이하로 오늘 나만의 작은 잔치 차리기","why":"에피쿠로스는 친구에게 \"치즈 한 단지만 보내 주게, 마음 내킬 때 잔치를 벌이게\"라고 편지를 썼어요.","ok":"비싸야 잔치인 거 아니지?"},{"t":"고마운 사람에게 손편지나 긴 메시지 쓰기","why":"에피쿠로스는 멀리 있는 친구들에게 편지를 자주 썼어요. 그가 남긴 글 중 가장 유명한 것도 편지예요.","ok":"받는 사람 하루가 달라질 거야."},{"t":"가까운 공원이나 화단에서 꽃 하나를 5분 동안 들여다보기","why":"에피쿠로스가 친구들과 세운 학교 이름이 \"정원\"이었어요. 실제로 정원에서 같이 살았고요.","ok":"오래 보니 다르지?","min":5},{"t":"친구에게 \"필요하면 언제든 말해\" 진심으로 한 번 말해 두기","why":"\"우리에게 필요한 건 친구의 도움 자체보다, 도와줄 거라는 믿음이다.\"","ok":"그 한마디가 친구한테는 든든한 보험이야."},{"t":"이미 가진 것 중에 \"이거면 충분해\" 싶은 것 다섯 개 적기","why":"\"충분한 것을 적다고 여기는 사람에게는 어떤 것도 충분하지 않다.\"","ok":"다섯 개 다 찼어? 생각보다 부자네."},{"t":"요즘 걱정 하나 적고, \"최악이면 어떻게 되지?\"를 끝까지 써 보기","why":"에피쿠로스는 무서운 일은 생각보다 견딜 만하다고 했어요. 제자들은 이걸 마음의 네 가지 약 중 하나로 외웠대요.","ok":"끝까지 가 보니 견딜 만하지?"},{"t":"부모님이나 어른께 \"살면서 제일 즐거웠던 때가 언제야?\" 물어보기","why":"에피쿠로스는 젊은이보다 잘 살아온 노인이 더 행복하다고 했어요. 좋은 기억을 쌓아 두었으니까요.","ok":"그 얘기 하실 때 표정 봤어?"},{"t":"오늘 20분은 아무 일정 없이 쉬기 (낮잠도 좋아)","why":"에피쿠로스가 말한 쾌락은 몸이 편하고 마음이 고요한 상태였어요. 흥청망청이 아니고요.","ok":"아무것도 안 했는데 좋지? 그게 내가 말한 쾌락이야.","min":20},{"t":"친구나 가족이랑 같이 장 보거나 요리하기","why":"에피쿠로스의 정원에서는 친구들이 함께 먹고 함께 살았어요.","ok":"같이 만드니까 더 맛있지?"},{"t":"제철 과일 하나 사서 천천히 먹기","why":"에피쿠로스는 소박한 음식이 비싼 잔칫상만큼 즐거움을 준다고 했어요.","ok":"제철 맛은 돈으로 더 살 수가 없어."},{"t":"평소 잘 안 어울리던 사람과 밥 한 끼 같이 먹기","why":"에피쿠로스의 정원에는 그 시대에 드물게 여자와 노예도 함께했어요.","ok":"새 친구 하나 생겼네."},{"t":"SNS 앱 하루 안 열기","why":"에피쿠로스는 몸에 필요한 건 적고 구하기 쉽지만, 남과 견주며 생기는 욕심은 끝이 없다고 했어요.","ok":"하루 안 봤는데 아무 일 없었지?"}]};

const TA2=["플라톤의 형 글라우콘이 기게스의 반지 이야기로 나한테 물었어. 몸을 숨기는 반지만 있으면 누구나 나쁜 짓을 할 거라고. 네가 떠올린 게 지금 네가 참고 사는 거야. 나는 그래도 바르게 사는 쪽이 더 행복하다고 했어.", "누구를 부자로 만들고 싶으면 돈을 보태지 말고 욕심을 덜어 주라고 했어. 몸이 바라는 건 적고 구하기 쉬워. 끝없는 건 남의 기준이야.", "차라투스트라는 발톱이 없어서 자기가 착한 줄 아는 약골들을 비웃었어. 힘이 없어서 착한 것과, 힘이 있는데 안 쓰는 건 겉은 같아도 속은 정반대야.", "나는 아이가 손으로 물 떠 마시는 걸 보고, 하나 남은 그릇까지 버렸어. 필요한 게 하나 줄 때마다 나를 묶던 끈도 하나씩 풀렸어.", "디오티마라는 여인이 가르쳐 줬어. 사랑은 좋은 걸 영원히 내 것으로 하고 싶은 마음이래. 그래서 사랑하면 뭔가를 남기고 싶어져. 아이든, 작품이든, 생각이든.", "보지 않고, 만나지 않고, 같이 있지 않으면 사랑의 열병은 식는대. 우정은 달라. 떨어져 있어도 언제든 도와줄 거라는 믿음으로 이어져. 나는 그쪽을 더 믿었어.", "사람은 고통 자체보다 이유 없는 고통을 못 견뎌. 그래서 탓할 누군가를 찾아. 탓하면 아픈 데 이유가 생기거든.", "나는 동상한테 구걸하는 연습을 했어. 왜 그러냐길래 거절당하는 연습이라고 했지.", "나는 남을 반박하는 것만큼 내가 반박당하는 것도 반겼어. 틀린 생각을 버리는 건 큰 병에서 낫는 거랑 같거든. 낫는 게 왜 싫겠어.", "없는 걸 바라느라 있는 걸 망치지 마. 지금 가진 것도 한때는 바라기만 하던 거였어.", "자유로워졌다는 표시가 뭔지 알아? 더는 자기 자신을 부끄러워하지 않는 거야. 내가 『즐거운 학문』에 쓴 말이야.", "나보다 한참 뒤에 온 에픽테토스는 누가 네 욕을 하면 이렇게 대답하라고 했어. '내 다른 단점은 몰랐나 보네. 알았으면 그것만 말하진 않았을 텐데.'", "리시스랑 친구가 뭔지 끝까지 따졌는데 답을 못 찾았어. 그래도 하나는 알았어. 친구가 뭔지 같이 묻고 있는 사이면, 이미 친구라는 거.", "나는 즐거움이 행복의 시작이자 끝이라고 했어. 근데 내가 말한 즐거움은 잔치가 아니었어. 몸이 안 아프고 마음이 안 시끄러운 상태였지. 사람들이 이걸 제일 많이 오해해.", "내가 던진 질문이야. 악마가 와서 이 삶을 똑같이 영원히 되풀이하라고 하면? 이를 가는 사람도 있고, 그보다 반가운 말은 없다는 사람도 있어. 그 마음이 지금 네 삶에 대한 대답이야.", "누가 '사람들이 너 비웃어' 하길래 말했어. 당나귀들도 그 사람들을 비웃을걸. 그 사람들이 당나귀 신경 안 쓰듯, 나도 안 써.", "칼리클레스는 욕망을 크게 키우고 다 채우는 게 행복이래. 나는 그건 구멍 난 항아리에 물 붓기라고 했어. 붓는 동안만 차 있고, 멈추면 비어.", "나는 정의를 서로 해치지도, 해침당하지도 말자는 약속이라고 했어. 그 약속만 지키면 많은 게 자유야. 대신 몰래 어기면, 들킬까 봐 평생 떠는 벌을 받아.", "우리는 우리 자신에게 낯선 사람이라고 썼어. 제일 가까이 있는 게 제일 안 보이거든. 그래서 사람은 평생 자기를 알아 가.", "나는 이렇게 비웃었어. 사람들은 옛날 영웅 오디세우스의 허물은 줄줄 따지면서 자기 허물은 몰라. 악기 줄은 잘 맞추면서 자기 마음은 안 맞추고.", "장군 라케스는 용기가 제자리를 지키고 안 도망치는 거래. 그래서 물었지. 달아나는 척하다 돌아서서 싸우는 스키타이 기병은 겁쟁이냐고. 라케스는 대답을 못 했어.", "내가 있을 땐 죽음이 없고, 죽음이 오면 내가 없어. 그래서 막상 와도 아프지 않을 걸 미리 겁내는 건 헛수고라고 했어.", "차라투스트라는 아픈 사람을 도울 때 그 사람의 부끄러움까지 살피라고 했어. 불쌍해하는 눈은 상대를 작게 만들거든. 돕고 싶으면 푹신한 침대 말고 딱딱한 야전침대가 되어 줘.", "알렉산드로스 대왕이 원하는 걸 말해 보래서, 햇빛 가리지 말고 비켜 달라고 했어. 나는 그한테 바랄 게 없었거든. 바라는 게 없으면 누구 앞에서도 당당해.", "신탁이 나를 제일 지혜롭다고 했어. 찾아다녀 보니 이유는 하나였어. 똑똑한 사람들은 자기가 뭘 모르는지 몰랐고, 나는 알았어.", "정해진 운명의 노예가 되느니 차라리 신화를 믿는 게 낫다고 했어. 신한테는 빌어 보기라도 하지, 운명은 빌 데도 없잖아. 나는 우리한테 고를 힘이 있다고 봤어.", "잊을 줄 모르면 행복도, 희망도, 지금 이 순간도 없다고 썼어. 잊는 건 소화하는 거야. 하나도 못 잊는 사람은 체한 사람이랑 같아.", "플라톤이 인간은 털 없는 두 발 짐승이라고 정의했어. 나는 털 뽑은 닭을 들고 가서 '이게 플라톤의 인간이다' 했지. 그다음 정의엔 '넓적한 손톱'이 붙었어.", "나는 스스로를 아테네의 등에라고 불렀어. 졸고 있는 말을 물어서 깨우는 벌레. 물리면 아프고 미움도 받지만, 그래야 깨.", "나는 우정이 서로 쓸모 있는 데서 시작된다고 했어. 근데 일단 시작되면 그 자체로 귀해져. 처음 이유는 다 잊어도 돼.", "나는 그걸 별의 우정이라고 불렀어. 각자 갈 곳이 있는 두 배가 한때 같은 항구에 있었던 거야. 그걸로 충분해.", "내 하인 마네스가 도망쳤는데 나는 안 찾았어. 마네스는 디오게네스 없이 사는데, 디오게네스가 마네스 없이 못 산다면 우습잖아.", "케팔로스는 정의가 정직하게 말하고 빌린 걸 갚는 거래. 그럼 미친 친구가 맡겨 둔 칼을 달라고 하면? 칼도 돌려주면 안 되고, 사실대로 다 말해 줘서도 안 돼.", "하늘이나 죽음이 무섭지 않았다면 자연을 공부할 필요도 없었다고 했어. 사람들은 모르는 걸 무서워해. 천둥이 신이 화난 게 아니란 걸 알면 덜 떨려.", "신은 죽었다고 내가 썼지. 정해진 의미가 사라지면 사람들은 허무에 빠져. 거기가 끝이면 허무지만, 이제 네가 의미를 만들 차례이기도 해.", "나는 시장 한복판에서 밥을 먹었다고 욕먹었어. 시장에서 배고팠으니 시장에서 먹었을 뿐인데. 나쁜 짓이 부끄럽지, 남다른 건 하나도 안 부끄러워.", "나한텐 어릴 때부터 들리는 목소리가 있었어. 뭘 하라고는 한 번도 안 하고, 하지 말라고만 했어. 사형 판결을 받던 날엔 한 번도 안 말리더라.", "나는 일상과 정치라는 감옥에서 스스로를 풀어 주라고 했어. 그래서 아테네에 작은 정원을 사서 친구들이랑 조용히 살았지.", "나는 운명을 사랑하라고 했어. 일어난 일을 참기만 하지 말고, 그 일이 달리 일어나길 바라지도 않는 거. 쉽진 않아. 나도 평생 연습했어.", "나는 '화폐를 다시 새겨라'라는 신탁을 받았어. 남들이 다 쓰는 기준을 그대로 받지 말고 다시 새기라는 뜻이었지.", "이집트 왕 타무스가 글자를 만든 신한테 말했대. 이건 기억을 돕기는커녕 잊게 만들 거라고. 사람들은 많이 읽고 아는 척하겠지만 실은 모를 거라고.", "현명하게 판단했는데 운이 나쁜 게, 어리석었는데 운이 좋은 것보다 나아. 운은 오고 가지만 판단하는 힘은 남거든.", "진실이 늘 사람을 편하게 해 주진 않아. 나는 사람이 진실을 얼마나 견디는지, 얼마나 감히 마주하는지로 그 사람을 쟀어.", "누가 어디 사람이냐고 묻길래 세계 시민이라고 했어. 고향 시노페에서 쫓겨났다고 놀리는 사람한텐, 나는 그 사람들한테 고향에 갇혀 살라는 벌을 줬다고 했지.", "나는 부당한 일을 당해도 부당하게 갚으면 안 된다고 했어. 갚는 순간 나도 똑같이 나쁜 짓을 한 사람이 되거든.", "젊은이는 운에 흔들리고, 잘 산 노인은 좋은 기억을 항구 삼아 닻을 내려. 그날은 지나갔어도 아무도 못 뺏어.", "나를 알고 싶으면 이렇게 해 보라고 썼어. 지금까지 진심으로 사랑한 것들을 줄 세워 보라고. 그 줄이 진짜 너를 가리켜.", "나는 쥐 한 마리를 보고 배웠어. 잠자리도 안 찾고, 어둠도 안 무서워하고, 맛있는 걸 쫓지도 않더라. 그때부터 집 없이 살았어.", "고르기아스는 말 잘하는 사람이 의사보다 환자를 더 잘 설득한다고 자랑했어. 바로 그게 문제야. 설득은 그 말이 맞는지를 안 따지거든.", "없을 때 아프면 필요한 거고, 없어도 안 아프면 갖고 싶은 거야. 나는 욕심을 그렇게 나눴어. 안 아픈데도 놓지 못하는 건 대개 남의 생각이 심어 놓은 거야.", "차라투스트라는 결혼을 이렇게 불렀어. 둘이 힘을 합쳐 둘보다 나은 하나를 만들려는 의지. 서로를 묶기만 하는 사랑은 둘 다 작게 만들어.", "해적한테 잡혀 노예 시장에 섰을 때, 뭘 할 줄 아냐길래 사람 다스리기라고 했어. 주인이 필요한 사람한테 팔라고. 나를 산 크세니아데스는 결국 자기 아이들을 나한테 맡겼어.", "에우티프론한테 물었어. 신이 좋아해서 옳은 건지, 옳아서 신이 좋아하는 건지. 앞이라면 옳음은 신 마음대로고, 뒤라면 옳음은 누가 정하기 전부터 따로 있는 거야.", "사람들은 음식을 고를 때 제일 많은 걸 고르지 않고 제일 맛있는 걸 골라. 시간도 그렇게 고르면 돼.", "음악이 없다면 삶은 실수일 거라고 썼어. 세상은 예술로 볼 때만 살 만한 이유가 생긴다고도 했지.", "나는 대낮에 등불을 들고 다니며 사람을 찾는다고 했어. 사람은 넘쳐나는데, 사람다운 사람은 못 찾았거든.", "나는 못생기기로 유명했어. 그래서 기도할 때 속이 아름다워지게 해 달라고 빌었어. 겉과 속이 하나가 되게 해 달라고.", "사람들은 안전해지려고 이름을 날리려 해. 남들이 알아봐 주면 덜 불안할 것 같거든. 근데 대부분은 지킬 게 늘어서 더 불안해져.", "확신은 거짓말보다 더 위험한 진리의 적이라고 썼어. 반대 이유를 다 들어 보고도 남아 있으면 그때 네 거야.", "나보다 한참 뒤에 온 로마의 세네카는 화를 다스리는 제일 좋은 약이 기다림이래. 하루 묵히면 할 말은 남고 독은 빠져.", "나는 알면서 나쁜 짓 하는 사람은 없다고 봤어. 그 순간엔 그게 더 좋아 보였던 거야. 그러니 의지를 탓하기 전에, 뭘 잘못 알았는지부터 봐.", "나는 모든 선택을 즐거움으로 따졌어. 그런데도 현명한 사람은 때로 친구를 위해 목숨까지 내놓는다고 했어.", "행복과 불행은 같이 자라는 쌍둥이야. 하나를 작게 만들면 다른 것도 같이 작아져.", "버릇없이 구는 아이를 보고, 나는 아이 말고 그 선생을 혼냈어. 왜 저렇게 가르쳤냐고.", "크리톤이 탈옥을 다 준비해 왔어. 나는 안 갔어. 평생 아테네 법 아래 잘 살아 놓고, 나한테 불리할 때만 약속을 깰 수는 없었거든.", "나중에 더 큰 즐거움을 주면 지금 괴로움도 골라. 계산은 해 봐. 그래도 이건 기억해. 내일이 제일 덜 필요한 사람이 내일을 제일 기쁘게 맞아.", "혼자 있으면 자기 목소리가 들리거든. 그게 무서워서 사람들은 시장으로 가. 나는 고독 속으로 도망치라고 했어.", "아무것도 모르면서 무슨 철학자냐고 누가 따지길래 말했어. 지혜로운 척이라도 하는 것, 그게 바로 철학이라고.", "나를 사형하기로 정한 것도 투표였어. 500명 넘는 배심원 중에 과반이 찬성했지. 많이 고른 것과 맞는 것은 따로 따져 봐야 해.", "미래는 다 우리 손에 있지도 않고, 다 손 밖에 있지도 않아. 꼭 올 거라 믿지도, 절대 안 올 거라 포기하지도 마.", "그리스 사람들은 싸움의 여신을 둘로 나눴어. 남을 무너뜨리게 하는 나쁜 싸움, 남보다 잘하고 싶게 만드는 좋은 싸움. 나는 좋은 쪽 경쟁이 그리스를 키웠다고 썼어.", "사람한테서 제일 아름다운 게 뭐냐는 질문에, 거리낌 없이 말하는 거라고 했어. 그래서 대왕한테도 플라톤한테도 할 말은 다 했지.", "재판이 끝나고 나는 이렇게 말했어. 좋은 사람한테는 살아서도 죽어서도 나쁜 일이 없다고. 몸이랑 돈은 뺏겨도, 좋은 사람다움은 아무도 못 뺏거든.", "나는 평생 아팠어. 그래도 알게 됐어. 심한 고통은 짧고, 긴 고통은 견딜 만하다는 거. 마음은 좋은 기억으로 버틸 수 있어.", "무리 속에 있으면 책임을 안 져도 되거든. 혼자 판단하는 건 춥고 무서운 일이야. 나는 그 추위를 골랐어.", "철학으로 뭘 얻었냐는 질문에 나는 이렇게 답했어. 다른 건 몰라도, 어떤 운이 와도 맞을 준비는 됐다고.", "평생 동굴에 묶여 벽에 비친 그림자만 본 사람들이 있다고 해 봐. 그들한텐 그림자가 세상 전부야. 한 명이 밖에 나갔다 와서 말해 주면 다들 비웃을걸.", "배고프지 않고, 목마르지 않고, 춥지 않으면 신도 안 부럽다고 했어. 기분이 바닥이면 거기부터 채워 봐. 생각은 그다음에 훨씬 가벼워져.", "네 몸에는 네 최고의 지혜보다 더 많은 이성이 있다고 했어. 네가 '나'라고 부르는 생각 뒤에 더 큰 주인이 있는데, 그게 바로 몸이야.", "로마 황제 마르쿠스 아우렐리우스는 일기에 썼어. '상처받았다는 생각을 지워라. 그러면 상처도 사라진다.'", "나는 많은 사람 말보다 제대로 아는 한 사람 말을 들으라고 했어. 운동하는 사람이 구경꾼 말 듣고 훈련을 바꾸면 몸을 망쳐.", "칭찬은 저절로 따라오게 두고, 우리는 우리 자신을 고치는 데 신경 써야 한다고 했어. 칭찬을 쫓기 시작하면 남이 내 주인이 돼.", "나는 피로 쓴 글만 사랑한다고 했어. 너를 흔든 한 문장은 잊어도 남아. 쉬운 책 백 권보다 그런 한 권이 나아.", "마르쿠스 아우렐리우스 황제도 이불 속에서 버텼대. 그리고 일기에 썼어. '나는 사람의 일을 하려고 일어난다.'", "법정에서 나는 철학을 그만두는 조건으로 풀어 준대도 안 그만두겠다고 했어. 따져 보지 않는 삶은 살 가치가 없으니까. 그리고 사형을 받았지.", "뭘 먹을지보다 누구랑 먹을지 먼저 찾으라고 했어. 친구 없이 먹는 건 사자나 늑대의 식사야.", "죽음은 누구한테나 확실한데, 사람들은 그 생각을 거의 안 해. 나는 그게 싫지 않았어. 죽음보다 삶을 백 배 더 생각할 만한 걸로 만들고 싶었거든.", "내가 죽으면 어떻게 묻어 줄지 사람들이 묻길래, 들판에 던져 두라고 했어. 나는 끝까지 아무것도 안 챙겼어. 기억은 남은 사람들 몫이야.", "아테네 사람들은 돈이랑 명성은 열심히 챙기면서 영혼은 안 챙기더라. 나는 길에서 만나는 사람마다 그걸 따졌어. 그래서 미움도 많이 받았지.", "나는 조용한 마음을 제일 큰 즐거움으로 쳤어. 그런데 사람들은 마음이 조용해지면 지루하다고 착각해. 그래서 계속 뭔가를 더해."];

const TA3=["노직이라는 철학자가 낸 문제야. 나는 쾌락주의자지만 안 들어가. 꿈속에선 친구도 가짜야. 진짜 친구랑 나눠 먹는 빵 한 조각이 더 좋아.", "필리파 풋이 낸 트롤리 문제가 이제 진짜로 자동차 회사 숙제가 됐어. 다섯을 살리는 차가 옳다는 사람도, 막상 자기가 탈 차는 자기를 지키는 차로 사고 싶대. 너도 그래?", "칸트는 살인자가 친구 숨은 곳을 물어도 거짓말하면 안 된다고 했어. 그 기준이면 \"응, 쪘어\"라고 해야 해. 나는 그 질문이 정말 몸무게를 묻는 건지부터 봐.", "나는 안 나갔어. 평생 아테네 법 덕에 살았는데, 불리해졌다고 어기면 내가 해 온 말이 다 거짓이 되잖아.", "바로 '축복'이라고 할 수 있으면 너는 잘 살고 있는 거야. 머뭇거렸다면, 뭘 바꿔야 할지도 이미 알고 있겠지.", "진실이 사람을 행복하게 해 준다는 건 착각이야. 보고 싶다면, 뭐가 나와도 감당할 수 있는지부터 스스로 물어봐.", "나는 \"햇빛 가리지 말고 비켜\"라고 했어. 왕이 줄 수 있는 것 중에 갖고 싶은 게 하나도 없었거든.", "플라톤은 배는 선장이 몰아야지 승객 투표로 몰면 안 된다고 했어. 그런데 나는 그 투표로 사형을 받았거든. 그래서 이 질문은 나한테 아직 어려워.", "내가 한 말이야. 내가 있을 땐 죽음이 없고, 죽음이 오면 내가 없어. 그러니 무서워할 시간에 오늘 저녁을 맛있게 먹어.", "홉스는 모두가 모두와 싸울 거라고 했어. 나는 시장 바닥에서 살아 봐서 알아. 뺏는 놈보다 빵 나눠 주는 할머니가 더 많아.", "아테네 사람들은 판자를 하나씩 갈아 끼운 테세우스의 배가 같은 배냐고 오래 싸웠어. 나는 이렇게 봐. 10년 전에 한 약속을 지금도 지키고 있으면, 그게 같은 너야.", "카뮈는 행복한 시시포스를 상상해야 한다고 했어. 돌이 다시 굴러떨어지는 건 못 막아. 그래도 돌을 가지러 내려가는 길을 어떤 마음으로 걸을지는 내가 정해.", "플라톤은 동굴 밖으로 나온 사람 얘기를 했어. 눈이 부셔서 아팠지만, 그 사람은 그림자만 보던 자리로 돌아가고 싶지 않았대.", "나는 빵이랑 물이랑 친구로 살았어. 혼자 먹는 진수성찬은 사자나 늑대의 식사야.", "나는 동정이 사람을 작게 만든다고 했어. 불쾌했다면 네 자존심이 아직 살아 있다는 뜻이야.", "나는 확인하러 다녔어. 똑똑하다는 사람들은 다 모르는 걸 안다고 착각하고 있더라. 나는 적어도 모른다는 건 알았지.", "나는 대낮에 등불을 들고 아테네를 돌며 '사람을 찾는다'고 했어. 한 명도 못 찾았지. 다들 남 눈치 보는 얼굴뿐이었거든.", "나는 재판정에서 물었어. 꿈 없이 푹 잔 밤보다 좋은 날이 살면서 며칠이나 있었냐고. 그러면 죽음은 손해가 아니야.", "고소하다면 아직 그 사람한테 묶여 있는 거야. 강한 사람은 잘 잊어. 나는 그걸 망각의 힘이라고 불렀어.", "나는 했어. 사람들이 개 같다고 했지. 밥 먹는 게 부끄러워? 남 눈 때문에 배고픈 걸 참는 게 더 부끄럽지.", "나는 욕망을 셋으로 나눴어. 꼭 필요한 것, 있으면 좋은 것, 그냥 헛된 것. 대부분은 마지막이더라.", "나는 알면서 나쁜 짓 하는 사람은 없다고 했어. 정말로 알면 안 해. 피우는 순간엔 그 한 대가 더 좋다고 믿고 있는 거야.", "트라시마코스가 나한테 이렇게 소리쳤어. 나는 되물었지. 의사는 환자를 위해 일하고 선장은 선원을 위해 일하는데, 왜 다스리는 사람만 제 이익을 챙겨야 하냐고.", "우정은 필요에서 시작돼. 그래도 우리한테 필요한 건 친구의 도움보다, 친구가 도와줄 거라는 믿음이야.", "노예 시장에서 무슨 일 할 줄 아냐길래 '사람 다스리는 일'이라고 했어. 그러니 주인이 필요한 사람한테 나를 팔라고.", "글자가 처음 생겼을 때도 똑같은 걱정이 있었어. 적어 두면 기억을 안 하게 된다고. 아는 것 같은 느낌이랑 아는 건 달라.", "나는 숨어서 살라고 했어. 내가 바꿀 수 없는 일을 매일 들여다보면, 아는 건 안 늘고 걱정만 늘어.", "'나를 죽이지 못하는 것은 나를 더 강하게 만든다.' 내 말이야. 근데 이건 다시 일어난 사람한테만 맞는 말이야. 쓰러진 채로 있으면 그냥 상처로 남아.", "에우튀프론은 자기 아버지를 고발하러 가는 길이었어. 나는 그게 옳다고 어떻게 그렇게 확신하는지부터 물었지.", "나는 쾌락주의자지만 쾌락을 다 고르진 않았어. 뒤에 더 큰 괴로움이 따라오는 쾌락은 건너뛰었지.", "아이가 손으로 물 떠 마시는 걸 보고 마지막 컵도 버렸어. 버릴수록 걱정도 같이 버려지더라.", "나는 무리 짓는 짐승이 되지 말라고 했어. 다수의 취향은 대개 안전한 쪽이야. 별로라고 느꼈으면 네 감각이 제대로 일한 거야.", "나는 장군들 재판 때 혼자 반대했어. 무서웠지만, 다수랑 같이 틀리는 것보다는 나았어.", "현명한 사람은 양이 많은 식사보다 맛있는 식사를 골라. 삶도 길이보다 맛이야.", "누가 움직임은 불가능하다고 길게 증명하길래, 나는 말없이 일어나서 걸어 다녔어.", "아리스토파네스는 사람이 원래 둘이 붙어 있었는데 신이 반으로 갈랐다고 했어. 나는 반쪽을 찾기보다, 같이 더 나은 쪽으로 가는 사람을 찾으라고 했지.", "현명한 사람의 삶에는 운이 조금밖에 끼어들지 못해. 중요한 건 대부분 내 판단이 정하거든.", "나는 운명을 사랑하라고 했어. 그 일을 지우면, 그 일 덕에 생긴 지금의 너도 같이 지워져.", "나는 동상한테 구걸하는 연습을 했어. 거절당하는 데 익숙해지려고.", "나는 정신이 세 번 바뀐다고 했어. 처음엔 낙타처럼 남이 준 짐을 지고, 그다음엔 사자처럼 '싫어'라고 외치고, 마지막엔 아이처럼 내 놀이를 시작해. 너는 지금 어디쯤이야?", "재판에서 내가 한 말이야. 묻는 걸 그만두면 살려 준다고 했는데, 나는 차라리 죽겠다고 했어. 하루 한 번만이라도 '나 오늘 왜 그랬지?' 물어봐.", "나는 네 가지 약을 처방했어. 신을 두려워 말 것, 죽음을 걱정 말 것, 좋은 건 쉽게 얻고, 나쁜 건 견딜 만하다는 것. 잠 안 오는 밤엔 마지막 걸 떠올려.", "어디서 왔냐는 말에 나는 '세계 시민'이라고 했어. 마음 편히 숨 쉬는 곳이 고향이야.", "플라톤은 의사가 약처럼 거짓말을 쓸 수 있다고 했어. 근데 아무나 약을 다루면 독이 돼.", "괴물과 싸우는 사람은 스스로 괴물이 되지 않게 조심해야 해. 심연을 오래 들여다보면, 심연도 너를 들여다봐.", "나는 정의가 서로 해치지 말자는 약속이라고 했어. 안 들켜도 지키는 이유가 있어. '언젠가 들키면 어쩌지' 하는 불안이 평생 따라다니거든.", "나는 플라톤 집 양탄자를 발로 짓밟으며 '플라톤의 허영을 밟는다'고 했어. 플라톤은 '다른 허영으로 밟는군' 하더라. 한 방 먹었지.", "나는 아테네의 등에였어. 졸고 있는 말을 쏘아서 깨우는 벌레. 다들 싫어했지만 말은 덕분에 깨어 있었어.", "나는 베수비오 화산 옆에 도시를 지으라고 했어. 위험하게 살아. 안전한 길만 걸으면 내가 어디까지 갈 수 있는지 영영 몰라.", "나는 그게 제일 좋은 날이라고 했어. 몸이 아프지 않고 마음이 시끄럽지 않은 날. 사람들은 그걸 너무 늦게 알아."];

const talkA=(b=0)=>{const n=talkN(b);return n>=TQ3_FROM?TA3[(n-TQ3_FROM)%TA3.length]:n>=TQ2_FROM?TA2[(n-TQ2_FROM)%TA2.length]:n<0&&n>=-5?TA_OLD[n+5]:TA[((n%TA.length)+TA.length)%TA.length];};
function sameDaySum(){const d=nowD(),wd=(d.getDay()+6)%7;return weekDays(1).slice(0,wd+1).reduce((n,k)=>n+(S.log[k]||0),0);}
function streak(){const d=nowD();let n=0;if(!S.log[dkey(d)])d.setDate(d.getDate()-1);while(S.log[dkey(d)]){n++;d.setDate(d.getDate()-1);}return n;}

function drawRace(){const w=weekSum(0),lw=weekSum(1),sd=sameDaySum(),mx=Math.max(w,lw,1);

  {id:'w23',k:'soc',kind:'ans',q:'플라톤이 쓴 동굴 이야기. 사슬에 묶인 사람들이 평생 진짜라고 믿은 건 벽에 비친 뭐였을까?',a:['그림자','그림자들'],ok:'그림자. 고개를 돌려 불빛을 보는 순간 눈이 아파. 그래서 다들 다시 벽만 봐.'},
  {id:'w24',k:'dio',kind:'down',min:20,q:'밥 먹는 동안 폰 엎어 두기. 20분. 밥이랑 앞에 있는 사람한테만 집중해 봐.',ok:'밥맛 달랐지? 에피쿠로스가 무엇을 먹느냐보다 누구와 먹느냐가 먼저라고 한 이유야.'},
  {id:'w25',k:'epi',kind:'ans',q:'아킬레우스가 아무리 빨리 달려도 앞에서 출발한 이 동물을 못 따라잡는다는 제논의 역설. 이 동물은?',a:['거북이','거북'],ok:'거북이. 실제로는 금방 따라잡지. 그런데 왜 말로는 못 따라잡는지 설명하는 데 2,000년이 걸렸어.'},
  {id:'w26',k:'soc',kind:'ans',q:'오천 원짜리 주인공 이름을 딴 길이 서울 종로에 있어. 경복궁 옆을 지나가는 "○○로"',a:['율곡','율곡로'],ok:'율곡로. 엄마 길(사임당로)도 서초에 있어. 엄마와 아들이 서울에 길 하나씩 갖고 있는 셈이지.'},
  {id:'w27',k:'nie',kind:'walk',dist:3000,q:'나는 하루에 몇 시간씩 걸으면서 책을 썼어. 오늘은 3km. "출발"을 누르고 3km 넘게 간 곳에서 "도착"을 눌러.',ok:'3km! 이 정도 걸으면 머릿속 문장이 다시 줄을 서. 오늘 떠오른 생각 하나는 꼭 적어 둬.'},
  {id:'w28',k:'epi',kind:'ans',q:'장자가 꿈에서 이게 되어 훨훨 날았대. 깨고 나서 물었지. "내가 이게 된 꿈을 꾼 걸까, 이게 내가 된 꿈을 꾸는 걸까?"',a:['나비'],ok:'나비. 지금 이 순간이 꿈이 아니라고, 너는 어떻게 확신해?'},
  {id:'w29',k:'soc',kind:'ans',q:'천 원짜리 뒷면 그림 속, 서당 안에 앉아 있는 사람은 누구일까?',a:['이황','퇴계','퇴계이황','이퇴계'],ok:'퇴계 이황 자신이야. 앞면에도 뒷면에도 있는 사람. 그만큼 그 자리를 아꼈던 거지.'},
  {id:'w30',k:'dio',kind:'ans',q:'파스칼은 사람을 바람에 흔들리는 약한 풀에 빗댔어. "인간은 생각하는 ○○다"',a:['갈대'],ok:'갈대. 우주가 사람을 짓눌러 죽여도, 사람은 자기가 죽는다는 걸 알아. 우주는 그걸 몰라.'},
  {id:'w31',k:'nie',kind:'early',h:7,q:'마르쿠스 황제도 이불 밖으로 나오기 싫었대. 그래서 일기에 "나는 일하려고 태어났다"고 썼어. 내일 아침 7시 전에 정원을 열어 봐.',ok:'이불을 이겼네. 하루의 첫 싸움에서 이긴 사람은 나머지도 덜 무서워.'},
  {id:'w32',k:'soc',kind:'ans',q:'똑같은 건초 더미 두 개 사이에 선 당나귀. 어느 쪽도 고르지 못하다가 결국 어떻게 됐을까?',a:['굶어죽었다','굶어죽음','굶어죽어','굶었다','굶어서죽었다'],inc:['굶'],ok:'굶어 죽었대. 뷔리당의 당나귀야. 완벽한 선택을 기다리다 아무것도 못 고르는 것도 선택이야.'},
  {id:'w33',k:'epi',kind:'dusk2',q:'해 지고 하늘이 완전히 어두워질 즈음, 첫 별을 찾아봐. 찾았으면 "찾았어"를 눌러 줘.',ok:'첫 별을 찾는 사람은 그날 하늘을 끝까지 본 사람이야. 오늘 하루, 끝까지 잘 봤어.'},
  {id:'w34',k:'dio',kind:'ans',q:'10원짜리 동전에 있는 탑은?',a:['다보탑'],ok:'다보탑. 불국사 마당에 1,200년 넘게 서 있어. 너보다 오래 기다린 거야.'},
  {id:'w35',k:'soc',kind:'ans',q:'"단순한 설명이 낫다." 쓸데없는 가정을 깎아 낸다고 해서 붙은 이름이야. "오컴의 ○○○"',a:['면도날','면도칼'],ok:'면도날. 변명이 길어지면 의심해 봐. 대개 짧은 쪽이 진짜야.'},
  {id:'w36',k:'nie',kind:'ans',q:'아침엔 네 발, 점심엔 두 발, 저녁엔 세 발. 스핑크스가 오이디푸스에게 낸 수수께끼. 답은?',a:['사람','인간'],ok:'사람. 오이디푸스는 이걸 맞히고 왕이 됐어. 그런데 정작 자기가 누군지는 몰랐지.'},
  {id:'w37',k:'epi',kind:'ans',q:'공자는 "나이 ○○에 하늘의 뜻을 알았다"고 했어. 그래서 이 나이를 지천명이라고 불러. 몇 살일까?',a:['50','쉰','오십','50살','쉰살'],ok:'쉰. 마흔은 흔들리지 않는 불혹, 쉰은 지천명. 공자도 하늘의 뜻을 알기까지 50년이 걸렸어.'},
  {id:'w38',k:'dio',kind:'down',min:30,q:'통 속 30분. 지금까지 중에 제일 길어. 폰을 엎어 두고, 30분 동안 그냥 너로 있어 봐.',ok:'30분이나! 이제 너도 통 속 사람이야. 생각보다 할 게 많았지?'},
  {id:'w39',k:'soc',kind:'ans',q:'만 원짜리 앞면, 세종대왕 옆에 적힌 노래 첫머리는 "뿌리 깊은 나무는…". 이 노래 이름은?',a:['용비어천가'],ok:'용비어천가. 뿌리 깊은 나무는 바람에 흔들리지 않는대. 사람도 그래.'},
  {id:'w40',k:'nie',kind:'ans',q:'스토아학파의 "스토아"는 원래 철학자들이 모여 이야기하던 곳 이름이야. 기둥이 줄지어 선 지붕 있는 복도. 이걸 뭐라고 부를까?',a:['주랑','회랑','복도','기둥복도','열주'],ok:'주랑. 에피쿠로스는 정원에서, 스토아는 주랑에서. 철학은 늘 사람들이 지나다니는 곳에서 했어.'},
  {id:'w41',k:'dio',kind:'ans',q:'아리스토텔레스한테 배운 제자 중에 나중에 세상의 절반을 정복한 왕이 있어. 나한테 햇빛 가리지 말라는 말을 들은 그 왕이야.',a:['알렉산드로스','알렉산더','알렉산드로스대왕','알렉산더대왕'],ok:'알렉산드로스. 그가 그랬대. "내가 알렉산드로스가 아니었다면 디오게네스가 되고 싶었을 것이다."'},
  {id:'w42',k:'epi',kind:'ans',q:'서울에는 "다산로"라는 길도 있어. 다산은 조선의 어느 학자의 호일까?',a:['정약용','다산정약용'],ok:'정약용. 18년 귀양 가 있는 동안 책을 500권 넘게 썼어. 갇힌 곳에서 오히려 제일 넓게 생각했지.'},
  {id:'w43',k:"soc",kind:'ans',q:"소크라테스의 아내 이름은? 화를 잘 내기로 유명해서 지금도 악처 하면 이 이름이 나와.",a:["크산티페", "크산티페스"],ok:"크산티페. 소크라테스는 \"좋은 아내를 얻으면 행복해지고, 나쁜 아내를 얻으면 철학자가 된다\"고 했대."},
  {id:'w44',k:"nie",kind:'ans',q:"\"『○○○○○는 이렇게 말했다』\" 내가 초인 이야기를 하려고 산에서 내려보낸 예언자 이름이야.",a:["차라투스트라", "짜라투스트라", "자라투스트라"],ok:"차라투스트라. 10년 동안 산에 있다가, 남는 지혜를 나눠 주려고 내려왔어."},
  {id:'w45',k:"dio",kind:'ans',q:"에픽테토스는 원래 어떤 신분이었을까? 다리를 절던 ○○.",a:["노예"],ok:"노예. 몸은 남의 것이었는데, 생각만은 누구에게도 안 넘겼어."},
  {id:'w46',k:"epi",kind:'ans',q:"내가 아테네에 세운 학교 이름은? 거기서 친구들이랑 같이 살았어.",a:["정원", "케포스", "가든"],ok:"정원. 문 앞에 이렇게 써 붙였어. \"손님, 여기서 즐겁게 지내시오. 여기서 최고의 선은 쾌락이오.\""},
  {id:'w47',k:"soc",kind:'ans',q:"내가 사형 선고를 받고 마신 독은 어떤 식물로 만들었을까?",a:["독당근", "독미나리", "헴록", "햄록"],ok:"독당근. 다리부터 차가워졌대. 마지막까지 친구들이랑 이야기했지."},
  {id:'w48',k:"nie",kind:'ans',q:"사르트르는 \"인간은 ○○을 선고받았다\"고 했어. 피할 수 없는 그것.",a:["자유"],ok:"자유. 고르지 않는 것도 고른 거래. 핑계 댈 곳이 없다는 뜻이야."},
  {id:'w49',k:"epi",kind:'ans',q:"카뮈가 \"행복하다고 상상해야 한다\"고 한, 영원히 바위를 밀어 올리는 신화 속 인물은?",a:["시시포스", "시지프", "시지프스", "시지포스"],ok:"시시포스. 바위는 또 굴러떨어져. 그래도 다시 내려가는 그 발걸음이 그의 것이래."},
  {id:'w50',k:"soc",kind:'ans',q:"칸트가 평생 거의 떠나지 않은 고향 도시는? 지금은 러시아 땅이야.",a:["쾨니히스베르크", "칼리닌그라드"],ok:"쾨니히스베르크. 멀리 안 가도 생각은 끝까지 갈 수 있어."},
  {id:'w51',k:"dio",kind:'ans',q:"\"내일 세상이 멸망해도 나는 오늘 한 그루의 ○○나무를 심겠다.\" 스피노자가 했다고 알려졌지만, 사실 출처가 불분명한 말이야.",a:["사과", "사과나무"],ok:"사과나무. 누가 했든 좋은 말이지. 그래도 출처는 따져 봐야 해. 그게 철학이야."},
  {id:'w52',k:"nie",kind:'ans',q:"나는 작곡도 했어. 한때 아버지처럼 따르다가 등을 돌린 작곡가는?",a:["바그너", "리하르트바그너"],ok:"바그너. 존경하는 사람과 헤어지는 것도 내가 되는 과정이었어."},
  {id:'w53',k:"epi",kind:'ans',q:"헤라클레이토스는 \"사람은 같은 ○에 두 번 들어갈 수 없다\"고 했어.",a:["강", "강물", "냇물"],ok:"강. 물도 바뀌고, 들어가는 너도 바뀌니까."},
  {id:'w54',k:"soc",kind:'ans',q:"최초의 철학자 탈레스는 만물의 근원을 이걸로 봤어. 한 글자.",a:["물"],ok:"물. 틀렸지만, 신화 말고 세상 안에서 답을 찾으려 한 첫 사람이었어."},
  {id:'w55',k:"dio",kind:'ans',q:"탈레스는 별을 보며 걷다가 어디에 빠졌대? 옆에 있던 하녀가 깔깔 웃었지.",a:["우물", "구덩이", "도랑", "웅덩이"],ok:"우물. 하늘을 아는 사람이 발밑을 모른다고 놀림받았어. 그래도 그는 나중에 올리브 풍년을 맞혀서 큰돈을 벌었어."},
  {id:'w56',k:"nie",kind:'ans',q:"아우구스티누스가 말했어. \"시간이 무엇인지 아무도 묻지 않으면 나는 안다. 묻는 사람에게 설명하려 하면 나는 ○○○.\"",a:["모른다", "몰라", "모르겠다"],ok:"모른다. 제일 익숙한 게 제일 어려운 질문이야."},
  {id:'w57',k:"epi",kind:'ans',q:"벤담은 죽은 뒤 자기 몸을 어떻게 해 달라고 했을까? 지금도 런던의 대학에 앉아 있어.",a:["박제", "미라", "전시", "보존", "유리관"],ok:"전시. 옷 입은 채로 유리 상자 안에 앉아 있어. 죽어서도 쓸모 있고 싶었대."},
  {id:'w58',k:"soc",kind:'ans',q:"『군주론』의 마키아벨리는 \"군주는 사랑받기보다 ○○○의 대상이 되는 편이 안전하다\"고 했어.",a:["두려움", "공포", "무서움"],ok:"두려움. 사랑은 쉽게 변하지만 두려움은 오래간대. 맞는 말일까?"},
  {id:'w59',k:"dio",kind:'ans',q:"홉스는 나라가 없는 삶을 이렇게 말했어. \"고독하고, 가난하고, 끔찍하고, 잔인하고, 그리고 ○○.\"",a:["짧다", "짧은", "짧고"],ok:"짧다. 그래서 사람들이 규칙을 만들고 나라를 세웠다는 거야."},
  {id:'w60',k:"nie",kind:'ans',q:"키르케고르가 말한 \"죽음에 이르는 병\"은 뭘까?",a:["절망"],ok:"절망. 자기 자신이 되기를 포기하는 것. 그게 병이래."},
  {id:'w61',k:"epi",kind:'ans',q:"밀은 \"배부른 돼지보다 배고픈 ○○○○가 낫다\"고 했어.",a:["소크라테스"],ok:"소크라테스. 돼지 얘기라 나도 좀 찔리네. 그래도 내 돼지는 배고픈 소크라테스랑 친해."},
  {id:'w62',k:"soc",kind:'ans',q:"비트겐슈타인 책의 마지막 문장. \"말할 수 없는 것에 대해서는 ○○해야 한다.\"",a:["침묵"],ok:"침묵. 모르면 말을 줄이는 것. 나는 그래서 묻기만 했어."},
  {id:'w63',k:"dio",kind:'ans',q:"로크는 갓 태어난 사람의 마음을 아무것도 쓰이지 않은 이것에 빗댔어. \"타불라 라사\"",a:["백지", "빈석판", "석판", "서판", "종이", "빈종이"],ok:"백지. 무엇을 채울지는 살면서 정하는 거야."},
  {id:'w64',k:"nie",kind:'ans',q:"파스칼은 \"클레오파트라의 ○가 조금만 낮았더라면 세계의 역사가 바뀌었을 것\"이라고 했어.",a:["코"],ok:"코. 큰일은 생각보다 작은 데서 갈려."},
  {id:'w65',k:"epi",kind:'ans',q:"교육에 관한 책 『에밀』을 쓴 루소는, 정작 자기 아이 다섯을 어디에 맡겼을까?",a:["고아원", "보육원", "보호소"],ok:"고아원. 말과 삶이 다를 수 있다는 걸, 철학자도 보여 줬어."},
  {id:'w66',k:"soc",kind:'ans',q:"아리스토텔레스는 용기를 무모함과 비겁함 사이의 무엇이라고 했어? 두 글자.",a:["중용"],ok:"중용. 딱 가운데가 아니라 그 상황에 딱 맞는 자리래."},
  {id:'w67',k:"dio",kind:'ans',q:"마르크스는 종교를 두고 \"인민의 ○○\"이라고 했어.",a:["아편"],ok:"아편. 아픔을 잊게는 해 주지만 아픔의 원인은 그대로라는 뜻이었어."},
  {id:'w68',k:"nie",kind:'ans',q:"하이데거는 인간을 이렇게 불렀어. \"죽음을 향한 ○○\"",a:["존재", "존재자"],ok:"존재. 끝이 있다는 걸 알아서, 사람은 지금을 고를 수 있어."},
  {id:'w69',k:"epi",kind:'ans',q:"세네카가 가르친 제자였는데, 나중에 세네카에게 스스로 목숨을 끊으라고 명령한 로마 황제는?",a:["네로"],ok:"네로. 제자를 잘못 만난 스승이지. 그래도 세네카는 마지막까지 평온했대."},
  {id:'w70',k:"soc",kind:'ans',q:"조선의 사단칠정 논쟁. 퇴계 이황과 8년 동안 편지로 토론한 젊은 학자는?",a:["기대승", "고봉", "고봉기대승"],ok:"기대승. 스물여섯 살 많은 대학자에게 끝까지 따져 물었어. 퇴계도 그걸 반겼지."},
  {id:'w71',k:"dio",kind:'ans',q:"원효는 밤에 목이 말라 어둠 속에서 물을 달게 마셨는데, 아침에 보니 그게 뭐였대?",a:["해골물", "해골", "해골바가지"],ok:"해골물. 물은 그대로인데 마음이 바뀌니 맛이 바뀐 거야. 일체유심조."},
  {id:'w72',k:"nie",kind:'ans',q:"\"자연은 ○○을 싫어한다.\" 빈 공간은 없다는 뜻으로 오래 쓰인 말이야.",a:["진공", "빈공간", "공백"],ok:"진공. 지금은 진공도 있다는 걸 알아. 오래 믿은 말도 틀릴 수 있어."},
  {id:'w73',k:"epi",kind:'ans',q:"나는 신 말고 이것이 세상을 이룬다고 봤어. 더 쪼갤 수 없는 작은 알갱이.",a:["원자"],ok:"원자. 2,000년 뒤에 과학이 확인해 줬지. 그러니 신이 벌줄까 무서워할 필요 없어."},
  {id:'w74',k:"soc",kind:'ans',q:"프로이트는 꿈을 \"무의식으로 가는 ○○\"라고 했어.",a:["왕도", "지름길", "큰길"],ok:"왕도. 꿈은 마음이 낮에 못 한 말을 하는 곳이래."},
  {id:'w75',k:"dio",kind:'ans',q:"애덤 스미스는 시장이 저절로 굴러가는 걸 \"보이지 않는 ○\"이라고 했어.",a:["손"],ok:"손. 정작 그는 『도덕감정론』부터 쓴 사람이야. 시장 전에 사람을 봤어."},
  {id:'w76',k:"nie",kind:'ans',q:"내가 말을 끌어안았다는 이야기가 전해지는 도시는?",a:["토리노"],ok:"토리노. 그날 이후로 나는 더 글을 쓰지 못했어. 그래서 그 말이 지금 내 옆에 있는 거야."},
  {id:'w77',k:"epi",kind:'ans',q:"몽테뉴가 쓴 책 『에세』의 우리말 제목은?",a:["수상록", "에세", "수필"],ok:"수상록. \"나는 무엇을 아는가?\" 그게 그의 질문이었어."},
  {id:'w78',k:"soc",kind:'ans',q:"나치 전범 재판을 보고 \"악의 평범성\"이라는 말을 쓴 철학자는?",a:["아렌트", "한나아렌트"],ok:"한나 아렌트. 엄청난 악도 생각하지 않는 평범한 사람이 저지를 수 있대."},
  {id:'w79',k:"dio",kind:'ans',q:"보부아르는 \"여자는 태어나는 것이 아니라 ○○○○ 것이다\"라고 썼어.",a:["만들어지는", "되는", "만들어진다", "만들어지는것"],ok:"만들어지는 것. 태어난 대로가 아니라 살아가며 되는 거래."},
  {id:'w80',k:"nie",kind:'ans',q:"칸트가 계몽의 표어로 내건 라틴어 \"사페레 아우데\"의 뜻은 \"○○ 알려고 하라\".",a:["감히"],ok:"감히. 남이 대신 생각해 주길 기다리지 말라는 거야."}];
// puzzles with one right answer, picked from a few choices; the last six (hard) open after ten of the others
const PICKS=[{"id":"p1","k":"dio","kind":"pick","q":"깜깜한 통 속. 서랍에 검은 양말, 흰 양말이 잔뜩 섞여 있어. 같은 색 한 켤레가 반드시 나오려면 최소 몇 짝 꺼내야 해?","o":["2짝","3짝","4짝","10짝"],"a":1,"ok":"색이 두 가지뿐이라 세 짝이면 적어도 두 짝은 같은 색이야.","hint":"색이 몇 가지인지만 생각해."},{"id":"p2","k":"dio","kind":"pick","q":"동전 9개 중 하나만 살짝 무거운 가짜야. 양팔 저울을 최소 몇 번 쓰면 반드시 찾아?","o":["1번","2번","3번","4번"],"a":1,"ok":"3개씩 나눠 두 무더기를 달면 어느 무더기인지 나와. 그 3개 중 2개를 달면 끝.","hint":"저울에 안 올린 것도 정보가 돼."},{"id":"p3","k":"dio","kind":"pick","q":"셋 중 한 명이 내 등불을 깼어. A는 \"B가 그랬어\", B와 C는 둘 다 \"나 아니야\". 딱 한 명만 참말을 했대. 범인은?","o":["A","B","C"],"a":2,"ok":"C가 범인이어야 참말이 B 하나뿐이야. A나 B가 범인이면 참말이 둘이 돼.","hint":"한 명씩 범인이라고 놓고 참말 수를 세 봐."},{"id":"p4","k":"dio","kind":"pick","q":"벽돌 하나가 1kg에 벽돌 반 개 무게를 더한 만큼 나가. 벽돌 하나는 몇 kg?","o":["1kg","1.5kg","2kg","3kg"],"a":2,"ok":"벽돌 반 개가 1kg이니까 하나는 2kg이야.","hint":"반 개 무게부터 구해 봐."},{"id":"p5","k":"dio","kind":"pick","q":"땔감 통나무를 다섯 토막으로 자를 거야. 한 번 자르는 데 1분이면 다 자르는 데 몇 분?","o":["4분","5분","6분","10분"],"a":0,"ok":"다섯 토막이 되려면 네 번만 자르면 돼.","hint":"한 번 자르면 몇 토막이 되지?"},{"id":"p6","k":"dio","kind":"pick","q":"감기약을 받아 왔어. 30분마다 한 알씩, 세 알을 다 먹으래. 다 먹는 데 몇 분 걸려?","o":["30분","60분","90분","120분"],"a":1,"ok":"지금 한 알, 30분 뒤 한 알, 60분 뒤 한 알. 처음 한 알은 기다릴 필요가 없어.","hint":"첫 알은 언제 먹지?"},{"id":"p7","k":"soc","kind":"pick","q":"방망이랑 공 합쳐서 11,000원. 방망이가 공보다 10,000원 비싸. 공은 얼마?","o":["1,000원","500원","1,500원","100원"],"a":1,"ok":"공 1,000원이면 방망이가 11,000원이라 합이 12,000원이 돼. 공 500원, 방망이 10,500원이야.","hint":"먼저 떠오른 답으로 합을 계산해 봐."},{"id":"p8","k":"soc","kind":"pick","q":"지구 적도를 밧줄로 꽉 감았어. 밧줄을 1m만 늘려서 고르게 띄우면 땅에서 얼마나 뜰까?","o":["머리카락 굵기","약 16cm","약 1m"],"a":1,"ok":"둘레가 1m 늘면 반지름은 1m를 2π로 나눈 만큼, 약 16cm 늘어. 지구가 크든 작든 똑같아.","hint":"둘레와 반지름은 2π 배 차이야."},{"id":"p9","k":"soc","kind":"pick","q":"참말만 하는 사람과 거짓말만 하는 사람이 사는 섬. A가 \"우리 둘 다 거짓말쟁이야\"라고 했어. A와 B는?","o":["둘 다 거짓말쟁이","A는 거짓말쟁이, B는 참말쟁이","A는 참말쟁이, B는 거짓말쟁이"],"a":1,"ok":"참말쟁이는 자기가 거짓말쟁이라고 못 해. 그러니 A는 거짓말쟁이고, 그 말이 거짓이니 B는 참말쟁이야.","hint":"A가 참말쟁이라고 놓아 봐."},{"id":"p10","k":"soc","kind":"pick","q":"길가에 나무 10그루가 5m 간격으로 한 줄로 서 있어. 첫 나무에서 끝 나무까지 몇 m?","o":["45m","50m","55m"],"a":0,"ok":"나무가 10그루면 사이는 9칸이야. 9 × 5 = 45m.","hint":"나무 수 말고 사이 수를 세 봐."},{"id":"p11","k":"soc","kind":"pick","q":"시장에서 옷값을 20% 올렸다가, 다음 날 20% 내렸어. 처음 값이랑 비교하면?","o":["같다","4% 싸다","4% 비싸다"],"a":1,"ok":"1만 원이 1만 2천 원이 됐다가, 거기서 20%인 2,400원이 빠져서 9,600원. 내릴 때는 오른 값에서 빼니까 더 많이 빠져.","hint":"1만 원으로 직접 계산해 봐."},{"id":"p12","k":"soc","kind":"pick","q":"엘리베이터가 1층에서 3층까지 6초 걸려. 1층에서 6층까지는?","o":["12초","15초","18초"],"a":1,"ok":"1층에서 3층은 두 층을 올라가니 한 층에 3초야. 6층까지는 다섯 층이라 15초.","hint":"몇 층을 \"올라가는지\" 세 봐."},{"id":"p13","k":"nie","kind":"pick","q":"산을 오를 땐 시속 2km, 같은 길로 내려올 땐 시속 6km. 왕복 평균 속도는?","o":["시속 3km","시속 4km","시속 5km"],"a":0,"ok":"6km 산길이면 오르는 데 3시간, 내려오는 데 1시간. 12km를 4시간에 갔으니 시속 3km야. 느리게 걷는 시간이 길어서 평균이 그쪽으로 끌려가.","hint":"길이를 하나 정해서 걸린 시간을 계산해 봐."},{"id":"p14","k":"nie","kind":"pick","q":"연잎이 하루에 두 배씩 늘어서 30일째에 연못을 다 덮었어. 반만 덮인 건 며칠째?","o":["15일째","20일째","29일째"],"a":2,"ok":"하루에 두 배니까, 다 덮이기 하루 전이 반이야.","hint":"마지막 날에서 하루만 거꾸로 가 봐."},{"id":"p15","k":"nie","kind":"pick","q":"10m 우물 바닥의 달팽이가 낮엔 3m 오르고 밤엔 2m 미끄러져. 며칠째에 빠져나올까?","o":["7일째","8일째","10일째"],"a":1,"ok":"7일째 밤이 끝나면 7m. 8일째 낮에 3m를 오르면 꼭대기라 미끄러지기 전에 나와.","hint":"마지막 날엔 밤이 안 와."},{"id":"p16","k":"nie","kind":"pick","q":"기계 5대가 물건 5개를 만드는 데 5분. 기계 100대가 물건 100개를 만들려면?","o":["100분","20분","5분"],"a":2,"ok":"기계 한 대가 물건 하나에 5분이야. 100대가 동시에 하나씩 만들면 5분.","hint":"기계 한 대는 물건 하나에 몇 분 걸려?"},{"id":"p17","k":"nie","kind":"pick","q":"1분마다 두 배로 느는 세균. 한 마리로 시작하면 1시간에 병이 꽉 차. 두 마리로 시작하면?","o":["30분","59분","60분"],"a":1,"ok":"두 마리로 시작하면, 한 마리로 시작했을 때보다 딱 1분 앞서 있는 거야.","hint":"한 마리가 두 마리 되는 데 얼마 걸려?"},{"id":"p18","k":"nie","kind":"pick","q":"문 세 개 중 하나 뒤에 상품이 있어. 네가 하나를 고르자, 답을 아는 진행자가 빈 문 하나를 열어 주고 바꿀래 물어. 어떻게 해?","o":["바꾼다","그대로 둔다","어느 쪽이든 똑같다"],"a":0,"ok":"처음 고른 문이 맞을 확률은 3분의 1. 나머지 3분의 2가 남은 문 하나에 몰려. 바꾸는 게 두 배 유리해.","hint":"처음 고를 때 맞을 확률부터 생각해 봐."},{"id":"p19","k":"epi","kind":"pick","q":"친구랑 치즈 한 덩이를 나눠. 저울도 없고 둘 다 손해 보기 싫어. 불만 없이 나누는 방법은?","o":["눈대중으로 반 자른다","가위바위보로 정한다","
