<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="description" content="소크라텃밭: 꼬마 소크라테스와 철학자들이 찾아오는 정원. 질문에 답하고, 미션을 하고, 나무를 키워요.">

<body>
<title>소크라텃밭</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* one living scene, full screen. the garden is the interface; words only live in speech bubbles. */
:root{
  --ink:#1b1530; --paper:#fffaf0; --gold:#ffcf5a; --leaf:#5fc27e; --leaf2:#3f9e62; --mute:#8d84ad;
  --hand:'Jua',system-ui,sans-serif; --read:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#1d1838;color:var(--paper);font-family:var(--read);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(18,14,36,.55);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px 5px 8px;font-family:var(--hand);font-size:17px;color:var(--paper)}
.chip svg{width:20px;height:20px}
.chip.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.22)}}
.icon{pointer-events:auto;appearance:none;width:40px;height:40px;border-radius:50%;background:rgba(18,14,36,.55);border:2px solid rgba(255,255,255,.14);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.icon:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bub{position:absolute;z-index:6;width:max-content;max-width:min(300px,calc(100% - 32px));background:var(--paper);color:var(--ink);border:3px solid #000;border-radius:20px;padding:12px 14px;box-shadow:0 5px 0 #000;transform-origin:50% 100%;animation:bubIn .32s cubic-bezier(.2,1.5,.4,1) both}
.bub::after{content:"";position:absolute;bottom:-13px;left:var(--tail,50%);width:18px;height:18px;background:var(--paper);border-right:3px solid #000;border-bottom:3px solid #000;transform:translateX(-50%) rotate(45deg)}
.bub p{margin:0;font-family:var(--hand);font-size:19px;line-height:1.38;word-break:keep-all;text-wrap:pretty}
.bub .who{display:block;font-family:var(--read);font-size:12px;color:var(--mute);margin-bottom:2px}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.opt{appearance:none;flex:1 1 auto;border:2.5px solid #000;background:var(--gold);color:var(--ink);border-radius:14px;padding:8px 12px;font-family:var(--hand);font-size:16.5px;cursor:pointer;box-shadow:0 3px 0 #000}
.opt.alt{background:#fff}
.more{position:absolute;right:12px;bottom:8px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--mute);animation:more 1s ease-in-out infinite}
@keyframes more{50%{transform:translateY(3px)}}
.bub p{padding-right:10px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
@keyframes bubIn{from{opacity:0;transform:scale(.6) translateY(10px)}}
.toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:7;background:var(--gold);color:var(--ink);border:3px solid #000;border-radius:999px;padding:6px 16px;font-family:var(--hand);font-size:17px;box-shadow:0 4px 0 #000;white-space:nowrap;animation:toast 2.4s ease both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.dev{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;appearance:none;border:1.5px dashed rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.55);border-radius:999px;padding:4px 10px;font-family:var(--read);font-size:11.5px;cursor:pointer}
.fly{position:absolute;z-index:8;width:22px;height:22px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-.3,.6,1),opacity .7s}
/* scene parts */
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.025)}}
.hop{animation:hop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes hop{40%{transform:translateY(-18px) scaleY(1.04)}70%{transform:translateY(0) scaleY(.94)}}
.zz{font-family:var(--hand);fill:#fff;animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
.ff{animation:ff var(--t,6s) ease-in-out infinite alternate}
@keyframes ff{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(var(--dx,20px),var(--dy,-30px));opacity:.4}}
.tw{animation:tw var(--t,3s) ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes grow{0%{transform:scale(.7)}}
.drip{animation:drip .55s ease-in forwards}
@keyframes drip{to{transform:translateY(46px);opacity:0}}
.spark{transform-box:fill-box;transform-origin:center;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6) translate(var(--dx),var(--dy));opacity:0}}
.ring{animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.6deg)}}

.hl{display:flex;gap:8px;align-items:center}
.appb{pointer-events:auto;appearance:none;position:relative;height:40px;padding:0 13px;border:2.5px solid #000;border-radius:999px;background:var(--gold);color:var(--ink);font-family:var(--hand);font-size:15.5px;white-space:nowrap;cursor:pointer;box-shadow:0 3px 0 #000}
.appb.flt{position:absolute;z-index:6;right:max(12px,env(safe-area-inset-right,0px));top:calc(40% + 68px)}
.appb:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.appb.new::after{content:'';position:absolute;top:-3px;right:-2px;width:11px;height:11px;border-radius:50%;background:#ff5d73;border:2px solid #000;animation:apdot 1.6s ease-in-out infinite}
@keyframes apdot{50%{transform:scale(1.25)}}
#appSh .wsheet{display:flex;flex-direction:column;gap:10px}
#appSh .opt{display:block;text-align:center;text-decoration:none}
#appSh .mis.ok{background:#f3fbe9}
#appSh .opt[disabled]{background:#ece7dc;color:#857c99;border-color:#857c99;box-shadow:0 3px 0 #857c99;cursor:default}
#appSh .alink{font-family:var(--hand);font-size:18px;text-align:center;margin:2px 0;user-select:all;word-break:break-all}
.icon.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,207,90,.45)}}
.devs{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:6px}
.devs .dev{position:static}
.ward{position:absolute;inset:0;z-index:9;background:rgba(10,8,24,.5);display:flex;align-items:flex-end}
.wsheet{width:100%;max-height:82%;overflow:auto;background:var(--paper);color:var(--ink);border-top:3px solid #000;border-radius:26px 26px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:10px;animation:sheet .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes sheet{from{transform:translateY(40%)}}
.wsheet>*{flex-shrink:0}
.whead{display:flex;align-items:center;gap:10px}.whead b{font-family:var(--hand);font-weight:400;font-size:22px;flex:1}
.wfruit{font-family:var(--hand);font-size:17px;background:#fff1c2;border:2px solid #000;border-radius:999px;padding:2px 12px}
.icon.wx{background:#fff;color:var(--ink);border-color:#000;width:36px;height:36px}
.wtabs{display:flex;gap:6px;overflow-x:auto}
.wtab{appearance:none;flex:none;border:2px solid #000;background:#fff;border-radius:999px;padding:4px 10px;font-family:var(--hand);font-size:15px;color:var(--ink);cursor:pointer}
.wtab.on{background:var(--gold)}
.wstage{background:radial-gradient(circle at 50% 70%,#fff3c4,#f3e9ff 70%);border:2.5px solid #000;border-radius:20px;display:flex;justify-content:center}
.wstage svg{width:116px;height:132px}
.wmsg{margin:0;min-height:1.4em;text-align:center;font-family:var(--hand);font-size:15px;color:#7a6fa0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.wit{appearance:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2.5px solid #000;background:#fff;border-radius:16px;padding:8px 4px 6px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 3px 0 #000}
.wit>svg{width:46px;height:40px}
.wit span svg{width:12px;height:12px}
.wit b{font-family:var(--hand);font-weight:400;font-size:13.5px;line-height:1.2;text-align:center;word-break:keep-all}
.wit span{font-size:12px;color:#7a6fa0;display:flex;align-items:center;gap:3px}
.wit.own span{color:#3f9e62}.wit.on{background:#fff1c2;box-shadow:0 3px 0 #000,0 0 0 3px var(--gold) inset}
.wit.no{opacity:.55}
.wit.shake{animation:wshake .3s}
@keyframes wshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.wit:focus-visible,.wtab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wobble{animation:wobble .5s ease-in-out}
@keyframes wobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.nbob{animation:nbob 1.6s ease-in-out infinite}
@keyframes nbob{50%{transform:translateY(-5px)}}
.stampin{transform-box:fill-box;transform-origin:center;animation:stampin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampin{0%{transform:scale(2.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}

.chip img{width:22px;height:22px;object-fit:contain}
.icon img{width:24px;height:24px;object-fit:contain}
.icon.wx img{width:16px;height:16px}
.wit img.ic{width:52px;height:52px;object-fit:contain}
.wit span img{width:13px;height:13px}
.fly img{width:22px;height:22px}
.bub{background:none;border:16px solid transparent;border-image:url(a/ui_bubble.webp) 40 fill / 16px stretch;box-shadow:none;border-radius:0;padding:0 4px}
.bub::after{width:34px;height:23px;bottom:-31px;background:url(a/ui_bubble_tail.webp) center top/contain no-repeat;border:0;transform:translateX(-50%)}
.zz{font-family:inherit}
.bub p{white-space:pre-line}
.promises{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-direction:column;gap:6px;max-width:min(270px,calc(100% - 32px));pointer-events:none}
.prom{background:rgba(255,250,240,.92);color:var(--ink);border:2.5px solid #000;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 #000;font-size:13px;line-height:1.35;word-break:keep-all}
.prom b{display:block;font-family:var(--hand);font-weight:400;font-size:14px;color:#8a5a33}
.doing{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:4;appearance:none;border:2.5px solid #000;background:#fffaf0;color:var(--ink);border-radius:999px;padding:5px 12px;font-family:var(--hand);font-size:14px;box-shadow:0 3px 0 #000;cursor:pointer}
.bsub{flex:1;font-size:12.5px;color:#7a6fa0;text-align:right}
.blist{display:flex;flex-direction:column;gap:10px}
.mis{position:relative;border:2.5px solid #000;border-radius:18px;background:#fff;padding:10px 12px 12px;box-shadow:0 3px 0 #000;display:flex;flex-direction:column;gap:5px}
.mis.done{background:#f3f8ea}
.mh{display:flex;align-items:center;gap:8px}.mh b{font-family:var(--hand);font-weight:400;font-size:16px;flex:1}
.face{width:38px;height:38px;border-radius:50%;border:2px solid #000;background-size:76px 101px;background-position:-19px -22px;background-color:#fff3df;flex:none}
.rw{display:flex;align-items:center;gap:3px;font-family:var(--hand);font-size:14px}.rw img{width:16px;height:16px}
.mt{margin:0;font-family:var(--hand);font-size:17.5px;line-height:1.38;word-break:keep-all}
.mw{margin:0;font-size:13px;line-height:1.45;color:#5d5478;word-break:keep-all}
.mb{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}.mb .opt{flex:1 1 0}.mb .opt[disabled]{opacity:.75;cursor:default}
.nth{font-family:var(--read);font-size:12px;color:#8a5a33;background:#fff1c2;border:1.5px solid #000;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:2px}
.mb .share{flex:0 0 auto}
.mok{margin:0;font-family:var(--hand);font-size:15px;color:#3f7d4a}
.pbtn img{width:30px;height:24px;object-fit:contain}
.pscene{width:100%;height:auto;border:2.5px solid #000;border-radius:16px;display:block}
.oil{display:flex;align-items:center;gap:8px;margin:2px 2px 0;font-size:12.5px;color:#5d5478}.oil i{display:flex;gap:3px}.oil b{width:12px;height:16px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;border:1.6px solid #000;background:#ffcf5a}.oil b.u{background:#e8e0cf}.oil b.x{display:none}.oil em{font-style:normal;font-family:var(--hand);font-size:15px;color:var(--ink)}
.bsh{margin:6px 2px 0;font-family:var(--hand);font-size:15px;color:#5d5478}
.rwait{border:2px dashed #b8ad95;border-radius:14px;padding:6px 10px;background:#fffaf0}.rwait summary{font-family:var(--hand);font-size:15px;cursor:pointer;color:#5d5478}.rwait[open]{display:flex;flex-direction:column;gap:8px}
.clkbtn{position:absolute;z-index:6;right:max(14px,env(safe-area-inset-right,0px));top:40%;width:58px;height:58px;border-radius:50%;border:3px solid #000;background:var(--gold);box-shadow:0 4px 0 #000;display:grid;place-items:center;padding:0;cursor:pointer;pointer-events:auto}
.clkbtn svg{width:36px;height:36px}
.clkbtn::before{content:'두드리기';position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font-family:var(--hand);font-size:12px;color:#fffaf0;text-shadow:0 1px 0 #000,0 0 3px rgba(0,0,0,.6);white-space:nowrap}
.appb.flt{top:calc(40% + 86px)!important}
.hint{position:absolute;z-index:5;width:0;height:0;pointer-events:none;border-left:13px solid transparent;border-right:13px solid transparent;border-top:18px solid var(--gold);filter:drop-shadow(0 2px 0 #000) drop-shadow(0 -1px 0 #000);transform:translate(-50%,-100%);animation:hintb 1s ease-in-out infinite}
@keyframes hintb{50%{margin-top:-8px}}
.rtz{appearance:none;display:flex;align-items:center;gap:12px;width:100%;margin:6px 0 4px;padding:10px 14px 10px 12px;border:2.5px solid #000;border-radius:16px;background:#fff7dd;color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 3px 0 #000}.rtz img{width:34px;flex:none}.rtz span{flex:1}.rtz b{display:block;font-family:var(--hand);font-weight:400;font-size:16px}.rtz small{display:block;font-size:12.5px;color:#6e6590}.rtz em{font-style:normal;font-size:22px;color:#8a5a33}.clkbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.clkbtn.new::after{content:'';position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#ff5d73;border:2px solid #000;animation:apdot 1.6s ease-in-out infinite}
.clk{position:absolute;inset:0;z-index:20;background:radial-gradient(120% 80% at 50% 35%,#2a2350 0,#14112a 70%);color:var(--paper);display:flex;flex-direction:column;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.clkhead{display:flex;align-items:flex-start;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.clkhead div{display:flex;flex-direction:column}.clkhead span{font-size:14px;color:#c9c2e8;letter-spacing:.02em}.clkhead b{font-family:var(--hand);font-weight:400;font-size:52px;line-height:1.05;color:#ffcf5a;font-variant-numeric:tabular-nums}
.clkhead b.pop{animation:cnum .18s ease-out}@keyframes cnum{40%{transform:scale(1.12)}}
.clkhint{margin:4px 16px 0;font-size:14px;color:#a79fd0}
.clkstage{position:relative;flex:1;overflow:hidden;cursor:pointer}
.clktabs{display:flex;gap:8px;justify-content:center;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.ct{appearance:none;border:2.5px solid #000;border-radius:16px;background:#fffaf0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px 5px;min-width:68px;font-family:var(--hand);font-size:14px;cursor:pointer;box-shadow:0 3px 0 #000}
.ct .face{width:34px;height:34px}.ct.on{background:var(--gold)}.ct.lock{opacity:.45;box-shadow:none}.ct.lock .face{filter:grayscale(1) brightness(.6)}
.ctgt{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}.ctgt img{display:block;width:100%}
.ctgt.barrel{bottom:4%;width:min(78%,330px)}.ctgt.socr{bottom:2%;width:min(62%,260px)}.ctgt.epic{bottom:0;width:min(46%,200px);opacity:.95}
.slab{position:absolute;left:0;right:0;margin:0 auto;top:calc(46% - min(80vw,300px)*4/13);width:min(80%,300px);aspect-ratio:13/8;border:4px solid #000;border-radius:18px;background:linear-gradient(160deg,#d8d2c2,#b9b2a0);box-shadow:0 8px 0 #000,inset 0 -10px 0 rgba(0,0,0,.08);display:grid;place-items:center;pointer-events:none}
.slab b,.shard b{font-family:var(--hand);font-weight:400;font-size:clamp(22px,7vw,32px);color:#1b1530;text-align:center;padding:0 12px;word-break:keep-all}
.slab .cracks{position:absolute;inset:0;width:100%;height:100%}
.shard{position:absolute;border-radius:14px;background:linear-gradient(160deg,#d8d2c2,#b9b2a0);display:grid;place-items:center;pointer-events:none;outline:3px solid #000}
.hammer{position:absolute;width:74px;height:74px;transform-origin:30% 90%;pointer-events:none;z-index:3}.hammer svg{width:100%;height:100%}
.cword{position:absolute;transform:translate(-50%,-50%);font-family:var(--hand);font-size:20px;color:#fffaf0;pointer-events:none;white-space:nowrap;animation:cword 1.1s ease-out forwards;text-shadow:0 2px 0 #000}
.cword.up{animation-name:cwordup}.cword.q{font-size:26px;color:#ffe9a6}.cword.big{font-size:26px;color:#ffcf5a}.cword.soft{color:#e6f3d6}
@keyframes cword{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.05)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-220%) scale(1)}}
@keyframes cwordup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-320%) scale(1.1)}}
.cspark{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffcf5a;border:1.5px solid #000;pointer-events:none}
.clk{--clkh:0}.clkcombo{position:absolute;right:18px;top:calc(66px + env(safe-area-inset-top,0px));font-family:var(--hand);font-weight:400;font-size:22px;color:#ff9db0;pointer-events:none}.clkcombo.pop{animation:cnum .18s ease-out}

      {q:'좋은 옷 입으면 좋은 사람 돼?',o:[['기분은 좋아지지','기분은 옷이 만들어도, 사람은 네가 만들어.'],['아니','그럼 옷 고르는 시간 반만 다른 데 써 봐.']]},

const LEAN_AT=[3,10,25,60,120,250,500];
// lately counts more than long ago: the map is drawn from the last sixty answers that showed a lean
// a lean counts by how often you took it when it was on offer, so talking more with one philosopher doesn't tip the map
function leanNow(){const c={soc:0,epi:0,dio:0,nie:0},f={soc:0,epi:0,dio:0,nie:0},log=S.leanLog||[];
  log.forEach(e=>{const [p,o]=String(e).split('|');(o||'').split(',').forEach(t=>{if(f[t]!=null)f[t]++;});if(c[p]!=null)c[p]++;});
  const sc={};LEAN_K.forEach(k=>sc[k]=(c[k]+.5)/(f[k]+1.5));
  const o=LEAN_K.slice().sort((a,b)=>sc[b]-sc[a]||c[b]-c[a]);const top=o[0],sec=c[o[1]]>0&&sc[o[1]]>=sc[top]*.8?o[1]:null;
  return {c,f,sc,n:log.length,top,sec,t:LEAN_T[sec?top+'_'+sec:top]};}
function leanAdd(tg,n){S.leanLog=S.leanLog||[];S.leanLog.push((tg[n]||'')+'|'+tg.filter(Boolean).join(','));if(S.leanLog.length>60)S.leanLog.shift();S.leanN=(S.leanN||0)+1;}
// after an answer: once in a while a philosopher tells you what your answers add up to
function leanMoment(then){const N=S.leanN||0,at=LEAN_AT.find(x=>N>=x&&!(S.leanSeen||[]).includes(x));if(!at)return false;
  S.leanSeen=(S.leanSeen||[]).concat(at);save();const L=leanNow(),k=S.met[L.top]?L.top:'soc';
  const back=S.leanBack;if(back){S.leanBack=0;save();}
  showClear({k,tag:back?'지금까지 고른 답으로 그린 생각 지도':at===LEAN_AT[0]?'처음 그려진 생각 지도':'요즘 너는',title:L.t[0],sub:`${L.t[1]}\n${at===LEAN_AT[0]&&!back?'답할수록 더 또렷해져요. ':''}게시판 '나'에서 언제든 볼 수 있어요.`,gift:2},then);return true;}
function drawLean(){const N=S.leanN||0;
  if(N<LEAN_AT[0])return `<div class="mis"><p class="mt">내 생각 지도</p><p class="mw">철학자들 질문에 답하면, 고른 답이 쌓여서 요즘 내가 어떤 사람인지 보여요. ${LEAN_AT[0]-N}번만 더 답하면 처음 그려져요.</p></div>`;
  const L=leanNow(),mx=Math.max(...LEAN_K.map(k=>L.sc[k]),.01);
  const hint=S.school&&S.school!==L.top&&N>=20?`<p class="mw">요즘 답은 ${SCHOOL[L.top].nm} 쪽이에요. 학파는 월요일마다 바꿀 수 있어요.</p>`:'';
  return `<div class="mis lean"><div class="mh"><i class="face" style="${faceCSS(S.met[L.top]?L.top:'soc')}"></i><b>요즘 너는</b></div><p class="mt">${L.t[0]}</p><p class="mw">"${L.t[1]}"</p>

const QSRC={"soc":[{"q":"말 잘하는 사람이 더 믿음 가?","o":[["솔직히 그래","나를 고발한 사람들도 말은 참 잘했어. 그런데 그 안에 참말은 거의 없었지."],["아니","나도 꾸민 말은 못 해. 떠오르는 대로, 참말만 하는 게 내 방식이야."]],"src":"소크라테스의 변론 17b-c"},{"q":"자기가 다 안다고 확신하는 사람, 주변에 있어?","o":[["있어","그 사람이랑 너, 사실 둘 다 모르는 건 비슷할 거야. 차이는 모른다는 걸 아느냐 하나지."],["나일지도","그렇게 말할 수 있으면 벌써 한 발 앞선 거야. 대부분은 그 말을 끝까지 못 하거든."]],"src":"소크라테스의 변론 21d"},{"q":"일 잘하는 사람은 다른 것도 잘 알까?","o":[["그렇겠지","내가 만난 장인들은 자기 일은 정말 잘 알았어. 그 때문에 더 큰 문제까지 안다고 착각하더라."],["아닐걸","맞아. 한 분야의 실력이 다른 데서는 오히려 눈을 가리기도 해."]],"src":"소크라테스의 변론 22d"},{"q":"옳은 일인데 위험하면, 할 거야?","o":[["상황 봐서","나는 하나만 따졌어. 이게 옳은 일인지 그른 일인지. 살지 죽을지는 그다음이었어."],["할 거야","조금이라도 쓸모 있는 사람이면 위험보다 옳고 그름을 먼저 봐야 해."]],"src":"소크라테스의 변론 28b"},{"q":"요즘 제일 신경 쓰는 게 뭐야?","o":[["돈이랑 평판","그것도 필요하지. 그런데 네 영혼이 좋아지는 건 그만큼 챙기고 있어?"],["나 자신","그럼 오늘 너를 조금이라도 낫게 만든 일, 하나 말해 볼래?"]],"src":"소크라테스의 변론 29d-e"},{"q":"듣기 싫은 소리 해 주는 친구 있어?","o":[["있어, 귀찮아","나는 아테네의 등에였어. 덩치 큰 말이 졸지 않게 쏘아 대는 벌레. 귀찮아도 그런 친구가 너를 깨워."],["없어","그럼 졸기 쉬워. 깨우는 사람을 쫓아내면 남은 평생을 잠든 채 살게 돼."]],"src":"소크라테스의 변론 30e-31a"},{"q":"다들 하는데 혼자 안 한 적 있어?","o":[["있어","나도 그랬어. 다섯이 부당한 명령을 받았는데, 넷은 사람 잡으러 가고 나는 그냥 집에 갔지."],["없는 듯","쉽진 않지. 그래도 나는 죽음보다 옳지 않은 일에 끼는 게 더 싫었어."]],"src":"소크라테스의 변론 32c-d"},{"q":"하루를 돌아보는 시간, 따로 있어?","o":[["거의 없어","나는 날마다 나랑 남을 따져 묻는 게 사람한테 제일 좋은 일이라고 봐. 오늘 5분만 해 봐."],["가끔 있어","좋아. 돌아보지 않는 삶은 살 가치가 없다고, 나는 법정에서도 말했어."]],"src":"소크라테스의 변론 38a"},{"q":"궁지에 몰리면 뭐든 할 것 같아?","o":[["할지도","죽음을 피하는 건 어렵지 않아. 나쁜 짓을 피하는 게 훨씬 어려워. 그게 더 빨리 달려오거든."],["안 할래","그 마음 지켜. 나는 늙고 느려서 죽음한테 잡혔지만, 나쁜 짓한테는 안 잡혔어."]],"src":"소크라테스의 변론 39a-b"},{"q":"남들이 날 오해하면 꼭 풀어야 해?","o":[["풀어야지","왜 그렇게 많은 사람 생각에 신경 써? 제대로 생각하는 사람들은 일이 실제로 어땠는지 알 거야."],["그냥 둘래","나도 그래. 생각 깊은 사람들의 판단이면 충분해."]],"src":"크리톤 44c"},{"q":"상황이 불리해지면 원래 생각 바꿔?","o":[["바꿀 때도","따져 봐서 더 나은 이유가 나오면 바꿔. 겁나서 바꾸는 건 안 돼."],["안 바꿔","나도 감옥에 갇혔다고 늘 옳다던 이유를 버리진 않았어. 더 나은 이유가 나오기 전까진."]],"src":"크리톤 46b-c"},{"q":"운동 배울 때 누구 말 들어?","o":[["코치 말","그렇지. 몸은 아는 한 사람 말을 따르잖아. 그런데 옳고 그름은 왜 아무 말이나 따라가?"],["이것저것","그러다 몸 다쳐. 많은 사람의 칭찬보다 제대로 아는 한 사람의 지적이 더 무서워야 해."]],"src":"크리톤 47b-c"},{"q":"그냥 사는 거랑 잘 사는 거, 달라?","o":[["다르지","응. 제일 중요한 건 잘 사는 거야. 그리고 잘 산다는 건 옳게 산다는 거고."],["비슷해","살아 있기만 하면 된다면 나도 감옥에서 도망쳤겠지. 나는 그게 옳은지부터 따졌어."]],"src":"크리톤 48b"},{"q":"누가 나한테 못되게 굴면 갚아 줘?","o":[["갚아 줘야지","다들 그렇게 말하지. 그런데 나쁜 짓은 되갚을 때도 나쁜 짓이야. 상대가 뭘 했든."],["그냥 넘겨","나도 그 편이야. 부당하게 당했다고 부당하게 갚으면, 나도 똑같이 잘못하는 거니까."]],"src":"크리톤 49b-c"},{"q":"머리로는 괜찮은 줄 아는데 무서운 거 있어?","o":[["있어","네 안에 겁 많은 아이가 있는 거야. 그 아이한텐 매일 주문 외듯 말을 걸어 줘야 해."],["별로","좋네. 그래도 마음 한쪽에서 누가 떨면, 하루 한 번씩 달래 줘."]],"src":"파이돈 77e"},{"q":"사람한테 몇 번 데이면 다 싫어지지?","o":[["그렇더라","사람 보는 눈 없이 덜컥 믿어서 그래. 잘 보면 아주 나쁜 사람도, 아주 좋은 사람도 드물어."],["아직 괜찮아","다행이야. 사람을 다 미워하게 되는 건 잘 모르고 믿었다가 거듭 데여서 생기는 거야."]],"src":"파이돈 89d-90a"},{"q":"좋아하는 사람 말이면 더 믿게 돼?","o":[["그렇지","내 말도 그렇게 듣진 마. 소크라테스는 덜 생각하고, 진리를 더 생각해 줘."],["아니","내 말이 틀린 것 같으면 있는 힘껏 반박해 줘. 내가 나도 너도 속이지 않게."]],"src":"파이돈 91c"},{"q":"확신이 드는 거랑 아는 거, 같아?","o":[["같지","믿게 만드는 설득이 있고, 알게 만드는 설득이 있어. 확신은 앞의 것만으로도 생겨."],["다를걸","맞아. 말 잘하는 사람은 대개 믿음만 심어 줘. 앎까지는 못 주고."]],"src":"고르기아스 454e"},{"q":"누가 네 틀린 점 짚어 주면 어때?","o":[["좀 짜증 나","나는 반박당하는 게 더 좋아. 남을 큰 해악에서 꺼내 주는 것보다 내가 빠져나오는 게 더 큰 이득이잖아."],["고맙지","같은 편이네. 잘못된 생각을 품고 사는 것보다 큰 해악은 없다고 나는 봐."]],"src":"고르기아스 458a"},{"q":"속이는 쪽, 속는 쪽 중 하나 골라야 하면?","o":[["속을래","나도 둘 다 싫지만, 꼭 골라야 하면 당하는 쪽이야. 나쁜 짓 하는 게 제일 큰 해악이거든."],["속일래","솔직하네. 그런데 속인 사람이 속은 사람보다 더 불쌍하다고 하면, 믿겨?"]],"src":"고르기아스 469b-c"},{"q":"부자에 유명한 사람 보면 행복하겠다 싶어?","o":[["그렇지","나는 몰라. 어떻게 배웠고 얼마나 올바른지 모르면, 페르시아 왕이라도 행복한지 알 수 없어."],["모르지","맞아. 나는 행복을 그 사람이 얼마나 좋고 올바른 사람인지로 따져."]],"src":"고르기아스 470e"},{"q":"잘못하고 안 들키면 다행이야?","o":[["다행이지","병이 깊은데 수술이 무서워 의사를 피하는 거랑 비슷해. 병든 몸보다 병든 영혼으로 사는 게 더 비참해."],["찝찝해","그 찝찝함이 맞아. 대가를 치르는 건 쓰지만, 영혼을 고치는 약이야."]],"src":"고르기아스 479a-b"},{"q":"남이랑 어긋나는 게 더 괴로워, 나랑 어긋나는 게?","o":[["남이랑","나는 반대야. 세상 사람 다 나랑 어긋나도, 하나뿐인 내가 나랑 어긋나는 것보단 나아."],["나랑","같은 생각이야. 내가 나랑 싸우면 평생 그 소리를 들으며 살아야 하거든."]],"src":"고르기아스 482b-c"},{"q":"갖고 싶은 게 끝없이 생겨?","o":[["끝이 없어","구멍 난 항아리 같네. 채워도 새니까 밤낮 부어야 해. 그게 정말 행복한 삶이야?"],["채우면 끝","좋아. 항아리가 멀쩡한 사람은 한번 채우면 더 붓지 않고 편히 쉬어."]],"src":"고르기아스 493e-494a"},{"q":"빌린 건 무조건 돌려줘야 해?","o":[["당연하지","친구가 칼을 맡겼다가 정신이 나간 채 돌려 달라고 하면? 그래도 돌려주는 게 옳아?"],["경우에 따라","그럼 정의는 '받은 걸 갚기'만으론 부족하네. 뭐가 더 필요할까?"]],"src":"국가 1권 331c"},{"q":"좋은 사람인 줄 알았는데 아니었던 친구 있어?","o":[["있었어","그럼 '친구한테 잘하고 적한테 못되게 굴라'는 말도 위험해. 우린 누가 좋은 사람인지 자주 틀리거든."],["없어","운이 좋네. 사람들은 좋아 보이는 사람이랑 정말 좋은 사람을 자주 헷갈려."]],"src":"국가 1권 334c-d"},{"q":"별로인 사람이 리더 될 판이면 나설래?","o":[["나설래","좋은 사람들이 마지못해 맡는 이유가 그거야. 자기보다 못한 사람한테 다스려지는 게 제일 큰 벌이거든."],["그래도 싫어","그 마음 알아. 좋은 사람은 원래 돈이나 명예 때문에 그 자리를 탐내지 않아."]],"src":"국가 1권 347b-c"},{"q":"배운다는 건 머리에 집어넣는 걸까?","o":[["그렇지","눈먼 눈에 시력을 넣어 주듯? 보는 힘은 이미 네 안에 있어. 배움은 그 눈이 밝은 쪽을 보게 돌려주는 거야."],["글쎄","나는 이렇게 봐. 보는 힘은 누구에게나 있고, 교육은 영혼 전체를 제대로 된 쪽으로 돌리는 일이야."]],"src":"국가 7권 518b-c"},{"q":"어딘가 내 반쪽이 있을 거라고 믿어?","o":[["믿어","그 반쪽이 나쁜 사람이면? 사람은 해로우면 자기 손발도 잘라 내. 결국 사랑하는 건 좋은 거야."],["안 믿어","내 선생님 디오티마 말로는 사랑은 반쪽을 찾는 것도, 전체를 찾는 것도 아니래. 좋은 걸 늘 갖고 싶은 거래."]],"src":"향연 205e-206a"},{"q":"누가 너를 실제보다 좋게 보면 어때?","o":[["기분 좋지","조심해. 나도 나를 우러러보던 친구한테 말했어. 잘 봐, 나 사실 별거 아닐 수도 있다고."],["부담돼","정직한 반응이야. 남이 기대하는 나랑 진짜 나는 다를 수 있으니까."]],"src":"향연 218e-219a"},{"q":"나쁜 줄 알면서 원하는 사람이 있을까?","o":[["있지","자기한테 해로운 줄 알면서 불행해지길 원한다고? 그런 사람은 없다고 봐."],["없을걸","나도 그래. 다들 나쁜 걸 좋은 줄 잘못 알고 원하는 거야."]],"src":"메논 77e-78a"},{"q":"모르는 게 드러나면 창피해?","o":[["창피해","그 순간이 이득이야. 안다고 착각하던 때보다, 모르는 걸 안 지금 더 찾고 싶어지잖아."],["괜찮아","모르는 줄 알아야 알고 싶어져. 안다고 믿을 땐 아무도 안 물어봐."]],"src":"메논 84a-c"},{"q":"자신감은 많을수록 좋아?","o":[["좋지","생각 없이 덤비는 자신감은 오히려 해가 돼. 지혜가 같이 있어야 도움이 되지."],["적당히","그 '적당히'를 정하는 게 지혜야. 지혜 없는 용기는 그냥 무모함이고."]],"src":"메논 88b"},{"q":"외운 정답이 금방 날아간 적 있어?","o":[["자주","옳은 생각도 묶어 두지 않으면 도망가. 왜 맞는지 이유로 묶어야 진짜 앎이 돼."],["잘 안 잊어","그럼 이유까지 알고 외웠나 보다. 이유로 묶인 생각은 안 달아나."]],"src":"메논 97d-98a"},{"q":"사람들이 크게 싸우는 건 대개 뭐 때문일까?","o":[["돈 문제","돈은 세어 보면 끝나. 원수가 되는 건 대개 뭐가 옳으냐를 두고야."],["자존심","비슷해. 숫자는 재면 끝나는데, 옳고 그름엔 저울이 없거든."]],"src":"에우티프론 7b-d"},{"q":"자칭 전문가, 뭘 보면 믿을 수 있어?","o":[["경력","나라면 직접 해낸 일을 보여 달라고 할 거야. 잘한다는 말만으로는 못 믿지."],["자격증","그것도 보지만, 나는 그 사람이 실제로 잘 해낸 결과물을 하나 보여 달라고 해."]],"src":"라케스 185e"},{"q":"요즘 용기 낸 적 있어?","o":[["있어","그렇지. 바다에서도, 병들거나 가난할 때도, 욕망을 버틸 때도 용기가 필요해."],["딱히","다시 생각해 봐. 아픔을 견디는 것도, 쾌락에 맞서는 것도 다 용기야."]],"src":"라케스 191d-e"},{"q":"끝까지 버티면 다 용기야?","o":[["그렇지","생각 없이 버티는 것도? 그건 해로울 때가 많아. 해로운 걸 훌륭하다고 할 순 없잖아."],["아닐걸","맞아. 어리석게 버티는 건 해롭기만 해. 지혜가 붙어야 용기에 가까워져."]],"src":"라케스 192c-d"},{"q":"나이 들어서 배우러 다니면 창피해?","o":[["좀 창피해","우리 모두 선생이 필요해. 누가 놀리면 호메로스 말을 빌리자. 궁한 사람한테 부끄러움은 좋은 짝이 아니래."],["전혀","나도 이 나이에 다 같이 학교 다니자고 했어. 남들 말은 신경 쓰지 말고."]],"src":"라케스 201a-b"},{"q":"몸이 아플 때 마음도 같이 살펴?","o":[["몸만 봐","트라키아 의사한테 들었어. 머리 없이 눈만 고칠 수 없듯, 영혼 빼고 몸을 고칠 순 없대."],["같이 봐","그 의사도 그랬어. 좋은 것도 나쁜 것도 영혼에서 몸으로 흘러간다고."]],"src":"카르미데스 156e-157a"},{"q":"누구한테 배울지, 따져 보고 고르는 편이야?","o":[["대충 골라","음식은 집에 가져가서 따져 보고 먹지만, 배우는 건 듣는 순간 바로 마음에 들어와."],["따져 봐","잘했어. 몸을 맡길 때보다 마음을 맡길 때 더 조심해야 하니까."]],"src":"프로타고라스 313a-314b"},{"q":"모르는 일은 아는 사람한테 맡기는 편이야?","o":[["맡겨","그럼 실수가 적을 거야. 실수는 모르면서 안다고 믿는 사람이 해."],["직접 해","배우려는 거면 좋아. 그런데 키 잡는 법도 모르면서 배의 키를 잡진 마."]],"src":"알키비아데스 1 117c-118a"},{"q":"외모가 변해도 곁에 남을 사람, 있어?","o":[["있어","그 사람은 네 몸 말고 너를 좋아하는 거야. 영혼을 사랑하는 사람은 쉽게 안 떠나."],["모르겠어","몸을 좋아한 사람은 꽃이 지면 떠나. 너를 좋아한 사람은 남고."]],"src":"알키비아데스 1 131c-d"},{"q":"없으면 못 사는 물건, 몇 개야?","o":[["꽤 많아","어떤 소피스트는 사치가 행복인 줄 알더라. 나는 필요한 게 적을수록 신에 가깝다고 봐."],["몇 개 없어","좋아. 아무것도 필요 없는 건 신의 일이고, 되도록 적게 필요한 게 그다음이야."]],"src":"소크라테스 회상 1.6.10"},{"q":"잘하는 척이랑 진짜 잘하는 거, 뭐가 쉬워?","o":[["척이 쉽지","당장은 그래. 그런데 인정받는 제일 빠른 길은 보이고 싶은 만큼 실제로 되는 거야."],["둘 다 어려워","맞아. 그래도 척은 끝이 없어. 실제로 그런 사람이 되는 쪽이 결국 덜 힘들어."]],"src":"소크라테스 회상 1.7.1"},{"q":"싸운 사람한테 먼저 손 내밀 수 있어?","o":[["자존심 상해","먼저 잘해 주면 지는 것 같아? 친구한테 먼저 잘해 주는 사람이 제일 칭찬받아."],["할 수 있어","초대받고 싶으면 내가 먼저 초대하잖아. 사이도 똑같아."]],"src":"소크라테스 회상 2.3.11-14"},{"q":"친구가 몇 명인지 바로 말할 수 있어?","o":[["바로 말해","대단한데? 다들 가진 물건 수는 알면서, 친구는 적어 놓고 지웠다 했다 하더라."],["애매해","다들 그래. 물건은 세면서 친구는 잘 안 세. 그만큼 덜 챙긴다는 거지."]],"src":"소크라테스 회상 2.4.4"},{"q":"친구가 잘되면 솔직히 배 아파?","o":[["좀 아파","그게 시기야. 힘들 땐 돕던 친구가 잘되니 괴로운 마음. 생각이 깊어지면 그런 마음이 줄어."],["안 아파","시기는 적이 아니라 친구가 잘될 때 아픈 마음인데, 지혜로운 사람한텐 잘 안 생긴대."]],"src":"소크라테스 회상 3.9.8"},{"q":"말 잘하는 사람이랑 행동하는 사람, 누굴 믿어?","o":[["행동","나도. 정의를 말하면서 부정하게 사는 사람은 많아도, 정의롭게 행동하는 부정한 사람은 없어."],["말도 중요해","중요하지. 그래도 누가 정의가 뭐냐고 물으면, 나는 내 행동으로 보여 줘."]],"src":"소크라테스 회상 4.4.10"},{"q":"중요한 발표, 벼락치기로 준비해?","o":[["벼락치기","나는 재판 변론을 평생 준비했어. 매일 옳고 그름을 따지고 옳은 걸 하려 한 게 준비였지."],["미리 해","좋아. 제일 좋은 준비는 평소에 옳게 사는 거야. 나는 재판도 그렇게 준비했어."]],"src":"소크라테스 회상 4.8.4"},{"q":"사람들 앞에서 말할 때 떨려?","o":[["엄청 떨려","그 사람들 하나하나 떠올려 봐. 시장 상인, 구두장이, 대장장이야. 일대일이면 하나도 안 떨잖아."],["괜찮아","잘난 사람들과도 잘 말하면서, 평범한 사람들 앞에서 움츠릴 이유가 없지."]],"src":"소크라테스 회상 3.7.5-7"},{"q":"인사했는데 안 받아 주면 기분 나빠?","o":[["나쁘지","웃기지 않아? 몸이 아픈 사람을 만났으면 화 안 냈을 거잖아. 이번엔 예의가 아픈 사람을 만난 것뿐이야."],["별로","그건 그 사람 예의가 모자란 거지, 너한테 무슨 일이 생긴 게 아니야."]],"src":"소크라테스 회상 3.13.1"}],"nie":[{"q":"네 안에 아직 안 드러난 재능, 있을 것 같아?","o":[["있을 거야","누구나 속에 숨은 밭이 있어. 언제 싹이 틀지는 아무도 몰라."],["없을걸","모르는 거야. 오래 묻혀 있던 게 한참 뒤에 화산처럼 터지기도 해."]],"src":"즐거운 학문 9"},{"q":"갖고 나니까 시들해진 물건 있어?","o":[["있어","원래 그래. 손에 넣으면 작아 보이고, 또 먼 데 있는 걸 원하게 돼."],["없어","드문 일이야. 보통은 멋진 풍경도 석 달 살면 질리거든."]],"src":"즐거운 학문 14"},{"q":"새로운 걸 해 볼 때, 실험이라고 생각해?","o":[["그런 편","좋아. 그럼 잘돼도 안돼도 답을 하나 얻는 거야."],["잘해야 돼","그러면 실패할 때마다 혼나는 기분이 들어. 실패도 그냥 하나의 대답이야."]],"src":"즐거운 학문 41"},{"q":"심심한 시간, 잘 견뎌?","o":[["못 견뎌","조금만 버텨 봐. 좋은 생각은 대개 그 지루한 고요 다음에 와."],["잘 견뎌","뭔가 만드는 사람은 심심함을 견디면서 기다릴 줄 알아야 해."]],"src":"즐거운 학문 42"},{"q":"양심 찔리는 거랑 소문 나쁜 거, 뭐가 더 싫어?","o":[["양심","드문 사람이네. 보통은 양심 찔리는 건 참아도 나쁜 소문은 못 참아."],["소문","솔직하네. 사람들은 자기가 아는 나보다 남이 아는 나에 더 흔들려."]],"src":"즐거운 학문 52"},{"q":"너 자신을 보고 웃어 본 적 있어?","o":[["있어","가끔은 멀찍이서 나를 보고 웃어야 해. 그래야 덜 무거워."],["없어","한번 해 봐. 진지한 사람일수록 광대 모자가 필요해."]],"src":"즐거운 학문 107"},{"q":"누가 실수했을 때 모른 척해 준 적 있어?","o":[["있어","잘했어. 남의 창피를 덜어 주는 게 제일 사람다운 일이야."],["없어","다음엔 한번 해 봐. 창피를 아껴 주는 것만큼 인간다운 일은 없어."]],"src":"즐거운 학문 274"},{"q":"멀어진 친구 생각나면 어때?","o":[["아쉬워","각자 갈 바다가 달랐던 거야. 부끄러워할 일 아니야. 그래서 그 우정이 더 소중해져."],["괜찮아","좋아. 멀어진 걸 숨길 필요는 없어. 함께였던 때는 그대로 남아."]],"src":"즐거운 학문 279"},{"q":"네 단점, 고치고 싶어 아니면 살리고 싶어?","o":[["고칠래","뺄 수 있는 건 빼고, 못 빼는 건 다르게 보이게 다듬어. 그게 성격에 스타일을 주는 거야."],["살릴래","잘 다듬으면 약점도 매력이 돼. 대신 매일 조금씩 손봐야 해."]],"src":"즐거운 학문 290"},{"q":"한번 들인 습관, 오래 지키는 편이야?","o":[["오래 지켜","나는 짧은 습관이 좋아. 한동안 푹 빠졌다가 때가 되면 고맙게 헤어져."],["자주 바꿔","나랑 비슷하네. 다만 헤어질 땐 질려서 말고, 고마워하면서."]],"src":"즐거운 학문 295"},{"q":"계획에 없던 일 생기면 짜증 나?","o":[["짜증 나","잘 사는 사람은 즉흥 연주자 같아. 삐끗한 음도 곡에 끼워 넣어서 뜻을 붙여."],["재밌어","우연을 살려 쓰는 사람은 실수 한 번 안 하는 것처럼 보여."]],"src":"즐거운 학문 303"},{"q":"남 고쳐 주고 싶을 때 많아?","o":[["많아","사람은 잘 안 바뀌어. 그 힘으로 네가 더 높이 가는 게 나아."],["별로","좋아. 탓하고 벌주다 보면 나만 어두워지거든. 차라리 눈을 돌려."]],"src":"즐거운 학문 321"},{"q":"뭐라도 하는 게 아무것도 안 하는 것보다 나아?","o":[["그렇지","그 말이 사람 숨통을 조여. 쉬는 걸 부끄러워하게 만들거든."],["아닌데","요즘은 오래 생각하는 것도 눈치 보는데, 넌 아니구나."]],"src":"즐거운 학문 329"},{"q":"처음엔 별로였는데 좋아진 거 있어?","o":[["있어","그렇게 배우는 거야. 낯선 걸 참고 들어 주면 어느 날 그게 아름다워져."],["없어","처음 듣고 별로였던 노래, 몇 번만 더 들어 봐. 사랑도 배우는 거야."]],"src":"즐거운 학문 334"},{"q":"제일 아끼는 사람한테도 매달리지 않을 수 있어?","o":[["어려워","그럴 거야. 근데 아무리 소중한 사람도 감옥이 될 수 있어. 너를 지키는 게 먼저야."],["할 수 있어","누구한테도 매달리지 않기, 그게 홀로 서는 시험이야."]],"src":"선악의 저편 41"},{"q":"창피한 기억, 슬쩍 다르게 기억한 적 있어?","o":[["있는 듯","기억은 '내가 했어' 하고 자존심은 '그럴 리 없어' 해. 결국 기억이 져."],["없어","정말? 기억이랑 자존심이 싸우면 보통 기억이 물러서는데."]],"src":"선악의 저편 68"},{"q":"할 일 없을 때 괜히 너를 들볶아?","o":[["그래","싸울 데가 없으면 싸움꾼은 자기를 공격해. 힘 쓸 데를 찾아 줘."],["아니","좋아. 조용할 때도 너랑 싸우지 않으면 된 거야."]],"src":"선악의 저편 76"},{"q":"놀 때 진지하게 놀아?","o":[["진지해","어른이 된다는 건 어릴 때 놀던 그 진지함을 되찾는 거야."],["대충 놀아","아깝다. 어릴 땐 놀이에 목숨 걸었잖아. 그 진지함을 되찾는 게 성숙이야."]],"src":"선악의 저편 94"},{"q":"네 나쁜 점이 사실 제일 좋은 점일 수도 있을까?","o":[["그럴지도","그걸 알아차리는 때가 인생의 큰 고비야. 다시 이름 붙일 용기가 필요해."],["아닐걸","아직은 그렇구나. 언젠가 그걸 장점이라고 부를 용기가 생기면, 그때가 전환점이야."]],"src":"선악의 저편 116"},{"q":"칭찬받으면 기쁜 티 내?","o":[["티 내","칭찬에 기뻐하는 건 허영이라기보다 마음의 예의일 때가 많아."],["안 내","쑥스러워서? 기뻐해 주는 것도 칭찬한 사람한테 하는 예의야."]],"src":"선악의 저편 122"},{"q":"싫은 사람이랑 싸우다 닮아 간 적 있어?","o":[["있어","조심해. 괴물이랑 싸우는 사람은 자기도 괴물이 되기 쉬워."],["없어","다행이야. 그래도 기억해. 심연을 오래 들여다보면 심연도 너를 봐."]],"src":"선악의 저편 146"},{"q":"100% 확신하는 거 많아?","o":[["많아","조심해. 절대적인 건 대개 병에 가까워. 의심하고 비꼴 줄 아는 게 건강한 거야."],["별로","좋아. 반대하고 의심하고 장난칠 줄 아는 게 건강하다는 표시야."]],"src":"선악의 저편 154"},{"q":"얕보는 사람을 미워해 본 적 있어?","o":[["있어","정말 얕봤으면 미워하지도 않았을걸. 미움은 상대를 대등하게 볼 때 생겨."],["없어","그렇지. 얕보는 동안엔 안 미워해. 미움은 상대를 인정할 때 와."]],"src":"선악의 저편 173"},{"q":"거짓말한 친구, 다시 믿을 수 있어?","o":[["믿어 볼래","대단하다. 속은 것보다 아픈 건 이제 못 믿게 됐다는 거거든."],["못 믿어","그게 제일 아프지. 거짓말 자체보다 이제 그 사람을 못 믿는다는 거."]],"src":"선악의 저편 183"},{"q":"이유 없이 싫은 사람 있어?","o":[["있어","진짜 이유를 물어봐. '내가 그 사람만 못해서'라고 답하는 사람은 거의 없지."],["없어","이유 없이 싫은 마음엔 대개 말하기 싫은 이유가 있거든."]],"src":"선악의 저편 185"},{"q":"기분에 끌려다니는 편이야?","o":[["좀 그래","감정은 말처럼 올라타는 거야. 가끔은 당나귀처럼. 고삐는 네가 쥐어."],["아니","기분은 골라서 가질 수도, 안 가질 수도 있어."]],"src":"선악의 저편 284"},{"q":"알면서도 모른 척한 적 있어?","o":[["있어","제일 용감한 사람도 자기가 아는 걸 마주할 용기는 드물어. 너만 그런 거 아니야."],["없어","대단한데. 아는 걸 아는 대로 마주하는 데엔 큰 용기가 들거든."]],"src":"우상의 황혼, 잠언과 화살 2"},{"q":"모르고 싶은 것도 있어?","o":[["있어","나도. 많은 걸 일부러 안 보기로 했어. 지혜는 아는 것에도 선을 그어."],["다 알고 싶어","욕심이네. 지혜로운 사람은 알고 싶은 것에도 선을 그을 줄 알아."]],"src":"우상의 황혼, 잠언과 화살 5"},{"q":"힘들 때 누가 도와주길 기다리는 편이야?","o":[["좀 그래","먼저 너를 도와 봐. 그러면 이상하게 다들 도와주더라."],["아니","좋아. 스스로 돕는 사람한테 도움이 모여. 그게 이웃 사랑의 원리야."]],"src":"우상의 황혼, 잠언과 화살 9"},{"q":"사람들한테 인기 많았으면 좋겠어?","o":[["좋겠어","너를 열 배, 백 배로 불려 줄 사람들을 찾는다고? 그러다 보면 숫자 뒤에 붙는 0만 모여."],["상관없어","나도. 따르는 사람을 모으다 보면 결국 0만 늘어."]],"src":"우상의 황혼, 잠언과 화살 14"},{"q":"착한 척해야 하는 자리, 자주 있어?","o":[["자주 있어","그런 자리는 줄여. 줄 타는 사람처럼 서든지 떨어지든지, 가짜가 안 통하는 데로 가."],["별로","가짜 미덕이 필요 없는 자리만 고르는 것도 실력이야."]],"src":"우상의 황혼, 잠언과 화살 21"},{"q":"급한 일 생기면 일단 막 덤벼?","o":[["덤벼","처음엔 너무 많이 하고, 그다음엔 너무 적게 해. 서두른 실수는 꼭 둘씩 와."],["한숨 돌려","좋아. 서두르면 실수가 하나로 안 끝나거든."]],"src":"우상의 황혼, 잠언과 화살 30"},{"q":"남들보다 앞서가고 싶어?","o":[["앞서고 싶어","왜? 이끌려고, 남달라서, 아니면 도망치려고? 셋 중 뭔지는 알아 둬."],["아니","그것도 좋아. 앞서가는 사람한텐 늘 물어봐야 해. 이끄는 건지 도망치는 건지."]],"src":"우상의 황혼, 잠언과 화살 37"},{"q":"사람들 앞의 너, 진짜 너야?","o":[["진짜야","그래도 한 번만 더 물어봐. 진짜인 척 연기하는 건 아닌지."],["연기 좀 해","솔직하네. 그럼 배우야, 아니면 배우를 흉내 내는 거야?"]],"src":"우상의 황혼, 잠언과 화살 38"},{"q":"너만의 행복 공식 있어?","o":[["있어","말해 봐. 내 건 짧아. 예 하나, 아니오 하나, 곧은 선 하나, 목표 하나."],["없어","내 걸 빌려줄게. 예 하나, 아니오 하나, 곧은 선 하나, 목표 하나."]],"src":"우상의 황혼, 잠언과 화살 44"},{"q":"기분 상하면 바로 받아쳐?","o":[["바로 해","보는 법부터 배워. 바로 반응하지 않고 판단을 미루는 게 진짜 의지력이야."],["좀 참아","자극에 바로 안 넘어가는 것, 그게 생각하는 사람의 첫 훈련이야."]],"src":"우상의 황혼, 독일인에게 모자라는 것 6"},{"q":"마음속에 서로 싸우는 마음 있어?","o":[["있어","안에 반대되는 게 많을수록 뭔가를 만들어 내. 마음이 편하기만 바라면 빨리 늙어."],["없어","평화롭네. 근데 마음이 쉬기만 바라기 시작하면 젊음이 식어."]],"src":"우상의 황혼, 반자연으로서의 도덕 3"},{"q":"말투 때문에 반대하고 싶어진 적 있어?","o":[["있어","다들 그래. 반대하는 이유가 의견 말고 말투일 때가 많거든."],["없어","그래? 다음에 반대할 때 봐 봐. 내용이 싫은 건지 말투가 싫은 건지."]],"src":"인간적인, 너무나 인간적인 303"},{"q":"약속에 자주 늦는 편이야?","o":[["좀 늦어","사람을 오래 기다리게 하면 그 사람 머릿속에 나쁜 생각이 자라."],["안 늦어","좋아. 기다리게 하는 건 사람을 삐딱하게 만드는 제일 확실한 방법이거든."]],"src":"인간적인, 너무나 인간적인 310"},{"q":"다투면 입 닫는 편이야?","o":[["입 닫아","그게 제일 얄미운 복수야. 상대는 네 침묵을 무시로 읽거든."],["말로 해","말없이 토라지는 건 상대한테 경멸처럼 보여."]],"src":"인간적인, 너무나 인간적인 326"},{"q":"사과하는 쪽이랑 용서하는 쪽, 뭐가 쉬워?","o":[["사과","맞아. 잘못하고 사과하면 힘도 보이고 착해도 보이지. 용서하는 쪽은 해야만 해서 힘들어."],["용서","그래? 보통은 용서가 더 어려워. 안 하면 모진 사람 되니까 억지로 하거든."]],"src":"인간적인, 너무나 인간적인 348"},{"q":"남들이 너를 어떻게 말하는지 찾아봐?","o":[["찾아봐","그럼 늘 속상할 거야. 제일 가까운 사람도 너를 잘못 볼 때가 있거든."],["안 봐","남의 평가에 늘 귀 기울이는 사람은 늘 화가 나 있어."]],"src":"인간적인, 너무나 인간적인 352"},{"q":"친구한테 끝까지 안 하는 말 있어?","o":[["있어","그게 우정을 지켜. 우정은 끝까지 말하지 않는 몇 가지 위에 서 있거든."],["없어","정말? 그런 말 하나가 새어 나가서 깨지는 우정이 많아."]],"src":"인간적인, 너무나 인간적인 376"},{"q":"친구랑 기쁜 일 나눠, 힘든 일 나눠?","o":[["기쁜 일","좋아. 친구를 만드는 건 같이 아파해 주는 것보다 같이 기뻐해 주는 거야."],["힘든 일","그것도 소중해. 근데 사람을 친구로 만드는 건 같이 기뻐하는 쪽이야."]],"src":"인간적인, 너무나 인간적인 499"},{"q":"누가 너한테 날카롭게 굴면 네 탓 같아?","o":[["내 탓 같아","그 말, 너 때문이 아닐 때가 많아. 다른 데서 생긴 짜증이 튄 거야."],["걔 사정이지","맞아. 험한 말은 대개 전혀 다른 일로 생긴 기분이 터진 거야."]],"src":"인간적인, 너무나 인간적인 562"},{"q":"잘못을 털어놓고 나면 후련해?","o":[["후련해","너는 털어놓고 잊지. 근데 들은 사람은 대개 안 잊어."],["찝찝해","그럴 만해. 말한 사람은 잊어도 들은 사람은 기억하거든."]],"src":"인간적인, 너무나 인간적인 568"},{"q":"갑자기 의견 물어보면 바로 대답해?","o":[["바로 해","그 첫 대답, 정말 네 생각이야? 대개는 집이나 주변에서 듣던 생각이야."],["좀 생각해","진짜 내 생각은 수면 위로 잘 안 떠오르거든."]],"src":"인간적인, 너무나 인간적인 571"},{"q":"오늘 누구 하나 기쁘게 해 줄 생각 있어?","o":[["있어","하루를 잘 시작하는 제일 좋은 방법이 그거야."],["아직","그럼 지금 정해 봐. 하루에 한 사람이면 충분해."]],"src":"인간적인, 너무나 인간적인 589"},{"q":"사람을 볼 때 제일 좋았던 모습으로 봐?","o":[["그래","좋아. 누구나 자기 최고의 날이 있어. 사람은 그날로 평가받아야 해."],["평소로 봐","평소엔 억지로 버티는 날이 많아. 그 사람이 제일 빛나던 날도 같이 봐 줘."]],"src":"인간적인, 너무나 인간적인 624"},{"q":"일이 틀어지면 누구 탓부터 찾게 돼?","o":[["찾게 돼","탓할 사람을 찾으면 잃었던 힘이 돌아오는 기분이 들어서 그래."],["안 찾아","남 탓도 자기 탓도, 대개는 기운 차리려는 몸부림이야."]],"src":"아침놀 140"},{"q":"남들 다 떠드는 일에 너도 한마디씩 해?","o":[["하는 편","그러다 보면 진짜 뭔가 만들 힘을 잃어. 큰일은 조용히 품고 있을 때 자라."],["안 해","주인공이 되려면 합창단에 끼지 않는 게 좋아."]],"src":"아침놀 177"},{"q":"밤만 되면 인생이 우울해 보여?","o":[["그래","피곤해서 그래. 지친 저녁에 내린 인생 결론은 믿지 마."],["아니","좋아. 지친 저녁에 하루를 따지면 대개 우울한 답이 나오거든."]],"src":"아침놀 317"},{"q":"네 생각에 반대되는 말, 끝까지 들어?","o":[["들어","내 생각에 반대되는 생각을 나한테 숨기지 않는 게 정직한 생각이야."],["피하는 편","나랑 약속 하나 해. 네 생각을 반박하는 생각, 너한테 숨기지 않기."]],"src":"아침놀 370"},{"q":"너 자신이 지겨울 때 어떻게 해?","o":[["푹 자","정답이야. 그럴 땐 많이 자는 게 최고야. 그러면 또 아침이 와."],["뭐라도 해","그것도 방법이지만, 제일 좋은 약은 푹 자는 거야. 진짜 잠이든 마음의 잠이든."]],"src":"아침놀 376"},{"q":"비 오고 외로운 날, 이상한 결론 내린 적 있어?","o":[["있어","그런 날엔 결론이 버섯처럼 자라. 너는 밭 말고 정원사가 돼야 해."],["없어","우울한 날 저절로 돋은 생각은 뽑아 버려도 돼."]],"src":"아침놀 382"},{"q":"다 용서하는데 다 기억하는 사람, 어때?","o":[["좋은 사람","근데 같이 있으면 불편할걸. 기억으로 한 번, 너그러움으로 또 한 번 부끄럽게 하거든."],["좀 무서워","맞아. 다 기억하면서 다 용서하면 상대는 두 배로 부끄러워."]],"src":"아침놀 393"},{"q":"말로 못 이기는 상대, 더 미워져?","o":[["미워져","내가 옳은데 지킬 힘이 없다고 느낄 때 미움이 제일 독해져."],["아니","좋아. 자기 일을 잘 챙길 줄 아는 사람은 상대한테 너그러워."]],"src":"아침놀 416"},{"q":"네 길 간다니까 주변에서 뭐라 해?","o":[["뭐라 해","그럴 거야. 그 사람들한테 미리 1년치 용서를 해 둬. 그게 네 길의 시작이야."],["응원해","좋은 사람들이네. 보통은 서운해하거나 비웃거든."]],"src":"아침놀 484"},{"q":"사람들 속에 오래 있으면 너답게 생각돼?","o":[["잘 안 돼","나도 그래. 사람들 속에선 남처럼 생각하게 돼. 그래서 가끔 혼자 있어야 해."],["잘 돼","부럽다. 나는 생각이 느려서, 내 생각이 솟을 때까지 혼자 기다려야 해."]],"src":"아침놀 491"},{"q":"확 바뀌고 싶을 때, 한 번에 바꿔?","o":[["한 번에","깊이 바뀌려면 아주 조금씩, 대신 오래 꾸준히 해야 해. 한 번에 되는 큰일은 없어."],["조금씩","작은 양을 오래 먹다 보면 어느 날 새 사람이 돼 있어."]],"src":"아침놀 534"},{"q":"네 성격, 타고난 그대로라고 생각해?","o":[["그런 듯","너는 네 마음을 가꾸는 정원사가 될 수 있어. 화도 허영도 키우기 나름이야."],["바꿀 수 있어","맞아. 우린 자기 충동을 가꾸는 정원사야. 어떤 정원으로 할지는 네 취향이고."]],"src":"아침놀 560"},{"q":"몇 년 전이랑 생각이 많이 바뀌었어?","o":[["많이","허물을 못 벗는 뱀은 죽어. 생각도 그래."],["별로","조금은 벗어 봐. 생각이 안 바뀌는 머리는 머리 노릇을 못 해."]],"src":"아침놀 573"},{"q":"어젯밤 잘 잤어?","o":[["잘 잤어","좋아. 잘 자려면 낮에 깨어 있어야 해. 하루에 열 번 나를 이기고 열 번 웃고."],["뒤척였어","오늘 낮에 열 번 웃어 봐. 웃음이 모자라면 밤에 배가 괴롭혀."]],"src":"차라투스트라는 이렇게 말했다, 1부 「덕의 강좌에 대하여」"},{"q":"몸이 하는 말 잘 들어?","o":[["잘 들어","네 몸 안에는 네 머리보다 큰 지혜가 있어."],["무시해","그러지 마. 네 몸에는 네 최고의 지혜보다 더 많은 이성이 있어."]],"src":"차라투스트라는 이렇게 말했다, 1부 「신체를 경멸하는 자들에 대하여」"},{"q":"무거운 분위기, 화내서 깨? 웃겨서 깨?","o":[["화내서","화로는 잘 안 깨져. 무거운 건 웃음으로 죽이는 거야."],["웃겨서","무거운 기운은 웃음 앞에서 제일 빨리 쓰러져."]],"src":"차라투스트라는 이렇게 말했다, 1부 「읽기와 쓰기에 대하여」"},{"q":"자잘하게 찌르는 사람들, 일일이 상대해?","o":[["상대해","그러지 마. 파리채 노릇은 네 몫이 아니야. 바람 시원한 데로 가."],["무시해","좋아. 작은 사람들은 수가 많아. 하나하나 손대다간 너만 지쳐."]],"src":"차라투스트라는 이렇게 말했다, 1부 「시장의 파리들에 대하여」"},{"q":"혼자 있기 싫어서 사람 만난 적 있어?","o":[["있어","그건 너한테서 도망쳐 이웃한테 간 거야. 사람들은 그걸 다정함이라고 착각하지."],["없어","너랑 단둘이 있는 게 편하다는 거니까."]],"src":"차라투스트라는 이렇게 말했다, 1부 「이웃 사랑에 대하여」"},{"q":"널 괴롭힌 사람한테 착하게 굴어?","o":[["착하게 굴어","그럼 그 사람이 부끄러워져. 차라리 그 덕에 좋은 일이 있었다고 보여 줘."],["갚아 줘","작은 복수가 아예 안 하는 것보다는 인간적이야. 크게만 하지 마."]],"src":"차라투스트라는 이렇게 말했다, 1부 「독사에 물린 상처에 대하여」"},{"q":"요즘 제대로 즐거웠던 적 있어?","o":[["있어","잘 즐길 줄 알면 남을 아프게 하는 법도 잊게 돼."],["별로","사람들은 늘 너무 덜 즐거워했어. 나는 그게 제일 큰 잘못 같아."]],"src":"차라투스트라는 이렇게 말했다, 2부 「연민하는 자들에 대하여」"},{"q":"여행 다녀오면 뭐가 제일 남아?","o":[["풍경","그래? 나는 어디를 가든 결국 나를 겪고 오더라."],["내 생각","그렇지. 어디로 떠나든 결국 겪는 건 나 자신이야."]],"src":"차라투스트라는 이렇게 말했다, 3부 「방랑자」"},{"q":"하는 둥 마는 둥 하는 일 많아?","o":[["많아","반쯤만 원하는 건 버려. 할 거면 하고, 게으를 거면 확실히 게을러."],["별로","좋아. 뭘 하든 먼저 제대로 원할 줄 아는 사람이 돼야 해."]],"src":"차라투스트라는 이렇게 말했다, 3부 「왜소하게 만드는 덕에 대하여」 3"},{"q":"더는 좋아할 수 없는 곳, 계속 머물러?","o":[["머물러","사랑할 수 없는 곳은 그냥 지나가. 남아서 욕만 하면 너만 상해."],["떠나","더는 사랑할 수 없으면 조용히 지나가는 게 맞아."]],"src":"차라투스트라는 이렇게 말했다, 3부 「지나쳐 가기에 대하여」"},{"q":"아플 땐 끝나길 바라지. 기쁠 땐?","o":[["계속되길","그렇지. 아픔은 '가라!' 하고, 기쁨은 영원을 원해."],["그냥 즐겨","근데 잘 봐. 기쁨은 늘 한 번 더를 원해."]],"src":"차라투스트라는 이렇게 말했다, 4부 「몽중보행자의 노래」 9"},{"q":"좋아하는 것도 적당히 멈출 줄 알아?","o":[["알아","좋아. 건강한 사람은 자기한테 좋은 만큼만 즐기고 거기서 멈춰."],["멈추기 어려워","그럼 몸한테 물어봐. 좋은 선을 넘으면 즐거움도 멈추는 게 건강한 거야."]],"src":"이 사람을 보라, 「나는 왜 이렇게 현명한가」 2"},{"q":"누가 너한테 무례하면 어떻게 갚아?","o":[["똑같이","나는 오히려 달콤한 걸 보내. 상대의 바보짓을 내 영리한 짓으로 덮는 거야."],["꾹 참아","참으면 속만 상해. 차라리 거친 말 한마디가 침묵보다 솔직해."]],"src":"이 사람을 보라, 「나는 왜 이렇게 현명한가」 5"},{"q":"서운한 일, 오래 쌓아 두는 편이야?","o":[["쌓아 둬","원한만큼 사람을 빨리 닳게 하는 건 없어. 지쳤을 때일수록 더 그래."],["금방 풀어","원한에 안 휘둘리는 건 마음이 넉넉하다는 증거야."]],"src":"이 사람을 보라, 「나는 왜 이렇게 현명한가」 6"},{"q":"싸울 거면 쉬운 상대가 좋아?","o":[["쉬운 상대","나는 반대야. 내 힘을 다 써야 하는, 나랑 맞먹는 상대만 골라."],["센 상대","얕보는 상대랑은 싸울 필요도 없어. 대등해야 제대로 된 싸움이야."]],"src":"이 사람을 보라, 「나는 왜 이렇게 현명한가」 7"},{"q":"싫은 거 막느라 기운 빠질 때 많아?","o":[["많아","'싫어' 할 때마다 힘이 새. 자꾸 거절하게 만드는 자리는 아예 멀리해."],["별로","좋아. 거절도 힘을 써. 되도록 덜 하며 사는 게 지혜야."]],"src":"이 사람을 보라, 「나는 왜 이렇게 영리한가」 8"},{"q":"지금 가는 길이 엉뚱한 길 같아?","o":[["좀 그래","괜찮아. 돌아가는 길도 다 쓸모가 있어. 자기가 뭔지 모를 때 사람은 자기가 돼 가."],["아니","그래도 너무 일찍 '이게 나야' 하고 정하지는 마."]],"src":"이 사람을 보라, 「나는 왜 이렇게 영리한가」 9"},{"q":"뭘 먹고 어디서 쉬는지, 잘 챙겨?","o":[["챙겨","잘하는 거야. 먹는 거, 사는 곳, 쉬는 법이 거창한 생각보다 훨씬 중요해."],["대충 해","그게 제일 중요한 거야. 사람들은 작은 걸 무시하라고 배웠지만 그게 틀렸어."]],"src":"이 사람을 보라, 「나는 왜 이렇게 영리한가」 10"},{"q":"아무것도 안 읽고 안 보고 하루 보내 봤어?","o":[["있어","그때 네 목소리 들렸지? 남의 말만 듣다 보면 내 안의 나는 입을 다물어."],["없어","하루만 해 봐. 나는 책을 끊고 나서야 묻혀 있던 내가 다시 말하더라."]],"src":"이 사람을 보라, 「인간적인, 너무나 인간적인」 4"},{"q":"듣기 싫은 진실, 얼마나 견딜 수 있어?","o":[["꽤 견뎌","얼마나 많은 진실을 견디느냐가 그 사람의 크기야."],["별로","괜찮아. 근데 진실을 피하게 되는 건 대개 겁 때문이야. 조금씩 용기를 내 봐."]],"src":"이 사람을 보라, 서문 3"}],"dio":[{"q":"배우고 싶은 사람, 지금 있어?","o":[["있어","그럼 귀찮을 만큼 찾아가. 나는 스승이 지팡이를 들어도 머리를 내밀고 버텼어."],["딱히 없어","하나 찾아봐. 배울 게 있는 사람이면 문전박대쯤은 견딜 만해."]],"src":"디오게네스 라에르티오스 6권 21"},{"q":"잘난 척하는 사람 비웃어 본 적 있어?","o":[["있어","나도 플라톤 양탄자를 밟으면서 허영을 밟는다고 했어. 그랬더니 그것도 다른 모양의 허영이래."],["없어","잘했어. 남의 허세를 비웃는 것도 허세가 되기 쉽거든."]],"src":"디오게네스 라에르티오스 6권 26"},{"q":"남보다 잘하고 싶은 거 있어?","o":[["많아","다들 달리기나 씨름으론 이기려고 애써. 더 좋은 사람이 되려고 겨루는 사람은 못 봤어."],["별로","그럼 하나만 겨뤄 봐. 좋은 사람 되기. 그 종목은 경쟁자도 거의 없어."]],"src":"디오게네스 라에르티오스 6권 27"},{"q":"남의 고민 상담은 잘해 주는 편이야?","o":[["잘해 주지","남의 문제는 잘 보이지. 학자들도 오디세우스가 겪은 고생은 연구하면서 자기 문제는 몰라."],["별로","그럼 네 고민부터 들여다봐. 대개 거기가 제일 안 보여."]],"src":"디오게네스 라에르티오스 6권 28"},{"q":"물건은 꼼꼼히 고르면서 사람은 대충 보진 않아?","o":[["그런 듯","항아리 하나 살 때도 두드려서 소리를 들어 보잖아. 근데 사람은 겉만 보고 고르더라."],["사람도 꼼꼼히","드문 일이야. 대부분은 물건 고를 때만 두드려 봐."]],"src":"디오게네스 라에르티오스 6권 30"},{"q":"나보다 어린 사람 말도 잘 들어?","o":[["잘 들어","의사가 노예라도 아픈 사람은 그 말을 들어. 아는 사람 말을 듣는 거야."],["좀 어려워","배 몰 줄 아는 사람이 노예여도, 배에 탔으면 그 사람 말을 들어야 안 가라앉아."]],"src":"디오게네스 라에르티오스 6권 30"},{"q":"끝이 보이면 힘 빼는 편이야?","o":[["좀 빼지","달리기에서 결승선 앞에서 속도 늦추는 사람 봤어? 나는 늙었으니 쉬라는 말에 더 달렸어."],["더 달려","나랑 같네. 결승선이 보이면 늦출 게 아니라 속도를 올릴 때야."]],"src":"디오게네스 라에르티오스 6권 34"},{"q":"목표를 일부러 높게 잡는 편이야?","o":[["높게 잡아","나도 그래. 합창 지휘자도 음을 조금 높게 잡아 줘야 다들 제 음을 내."],["딱 맞게","그것도 좋아. 근데 사람들은 잡은 음보다 조금씩 처지더라. 그래서 나는 일부러 세게 말했어."]],"src":"디오게네스 라에르티오스 6권 35"},{"q":"제일 비싼 거랑 제일 필요한 거, 같아?","o":[["달라","그치. 동상은 큰돈에 팔리는데, 배를 채워 주는 보릿가루는 동전 두 닢이야."],["같아","정말? 값을 매기는 걸 보면 사람들은 귀한 걸 싸게, 쓸데없는 걸 비싸게 사고팔아."]],"src":"디오게네스 라에르티오스 6권 35"},{"q":"운이 나쁜 날엔 어떻게 해?","o":[["그냥 버텨","나는 운이 몰아치면 용기로 맞섰어. 집도 나라도 없이 그렇게 살았어."],["좀 무너져","괜찮아. 감정이 올라오면 이성 하나만 붙잡아. 나는 그렇게 버텼어."]],"src":"디오게네스 라에르티오스 6권 38"},{"q":"해 보면 알 걸 말로만 따져 본 적 있어?","o":[["자주","누가 움직임이란 없다고 증명하길래, 나는 일어나서 걸어 다녔어. 그걸로 끝."],["별로","직접 해 보는 게 제일 빠른 증명이야."]],"src":"디오게네스 라에르티오스 6권 39"},{"q":"'원래 그런 거야' 하고 딱 잘라 말하는 편이야?","o":[["그런 편","조심해. 플라톤이 사람은 털 없는 두 발 동물이라길래, 털 뽑은 닭을 들고 가서 '플라톤의 사람'이라 했어."],["아니","딱 잘라 정해 두면 꼭 털 뽑은 닭 같은 반례가 나와."]],"src":"디오게네스 라에르티오스 6권 40"},{"q":"아는 사람 중에 진짜 '사람'은 몇 명이야?","o":[["꽤 돼","부럽다. 나는 대낮에 등불을 켜고 다녀도 사람 찾기가 어려웠어."],["몇 안 돼","괜찮아. 수가 적어도 그중에 사람이 있으면 돼."]],"src":"디오게네스 라에르티오스 6권 41"},{"q":"꿈 해몽 찾아본 적 있어?","o":[["있어","밤에 꾼 꿈은 그렇게 궁금해하면서, 낮에 깨어서 한 일은 왜 안 궁금해?"],["없어","너를 말해 주는 건 꿈보다 깨어 있을 때 한 일이야."]],"src":"디오게네스 라에르티오스 6권 43"},{"q":"사는 게 왜 이렇게 힘들까?","o":[["돈이 없어서","사는 건 원래 쉽게 할 수 있게 주어졌어. 꿀과자, 향유 같은 걸 바라다 보니 어려워진 거야."],["할 게 많아서","그중에 꼭 해야 하는 건 몇 개야? 나머지는 우리가 스스로 얹은 거야."]],"src":"디오게네스 라에르티오스 6권 44"},{"q":"잘나가는 사람 곁에 있으면 행복할까?","o":[["그렇지","알렉산드로스 곁에서 잘나가던 사람이 있었어. 근데 밥도 대왕이 먹고 싶을 때 먹더라."],["글쎄","맞아. 밥때까지 남이 정하면, 아무리 화려해도 나는 그걸 불운이라고 불러."]],"src":"디오게네스 라에르티오스 6권 45"},{"q":"뭘 배울 때 책부터 펴는 편이야?","o":[["응, 책부터","무화과도 그림 말고 진짜를 먹잖아. 연습도 진짜로 해야지, 글로만 하면 그림이야."],["해 보면서","나는 내 글 빌려 달라는 사람한테 물었어. 진짜 훈련을 두고 왜 적힌 걸 찾냐고."]],"src":"디오게네스 라에르티오스 6권 48"},{"q":"안 좋았던 일이 결국 득이 된 적 있어?","o":[["있어","나도 그래. 고향에서 쫓겨났다고 놀리길래 말했지. 그 덕에 철학자가 됐다고."],["아직 없어","좀 기다려 봐. 나는 고향에서 쫓겨난 덕에 철학자가 됐어."]],"src":"디오게네스 라에르티오스 6권 49"},{"q":"필요할 때만 연락하는 친구 있어?","o":[["있어","그 사람한테 넌 지갑이야. 차 있을 땐 걸어 두고, 비면 내다 버리는."],["없어","다행이다. 그럼 너도 친구를 지갑처럼 쓰진 마."]],"src":"디오게네스 라에르티오스 6권 50"},{"q":"돈 때문에 사람이랑 틀어진 적 있어?","o":[["있어","그럴 만해. 돈 욕심은 온갖 나쁜 일이 태어나는 고향이거든."],["없어","잘 지켰네. 웬만한 나쁜 일은 다 돈 욕심에서 시작돼."]],"src":"디오게네스 라에르티오스 6권 50"},{"q":"듣기 좋은 말만 하는 사람, 곁에 있어?","o":[["있어","조심해. 길든 짐승 중에 제일 아프게 무는 게 아첨꾼이야."],["없어","좋네. 쓴소리 해 주는 사람이 있으면 그 사람 꼭 붙잡아."]],"src":"디오게네스 라에르티오스 6권 51"},{"q":"비싼 거 사면 오히려 불안해져?","o":[["좀 그래","금이 왜 창백한지 알아? 노리는 도둑이 너무 많아서야."],["아니, 좋아","좋을 때 즐겨. 그래도 비싼 건 노리는 눈도 많다는 건 알아 둬."]],"src":"디오게네스 라에르티오스 6권 51"},{"q":"누가 비웃으면 오래 신경 쓰여?","o":[["오래 가","비웃는 건 그 사람들 몫이야. 나는 웃음거리가 된 적은 많아도 그 웃음에 무너진 적은 없어."],["금방 잊어","좋아. 웃음은 지나가. 너만 안 무너지면 돼."]],"src":"디오게네스 라에르티오스 6권 54"},{"q":"요즘 사는 게 좀 꼬인 느낌이야?","o":[["좀 그래","사는 것 자체는 나쁜 게 없어. 꼬인 데가 있으면 거기만 풀면 돼."],["괜찮아","삶이 문제였던 적은 없어. 엉망으로 살 때가 문제지."]],"src":"디오게네스 라에르티오스 6권 55"},{"q":"떠난 사람 붙잡고 싶었던 적 있어?","o":[["있어","그 사람은 너 없이 사는데, 너는 그 사람 없이 못 산다면 좀 이상하지 않아?"],["없어","내 하인이 도망갔을 때도 안 쫓아갔어. 걔가 나 없이 살면 나도 걔 없이 살아."]],"src":"디오게네스 라에르티오스 6권 55"},{"q":"멋져 보이는 삶, 직접 살아 볼 거야?","o":[["살아 볼래","좋아. 다들 내 삶을 칭찬은 하는데 같이 살진 않거든. 고생이 무서워서."],["구경만 할래","솔직하네. 사람들은 좋은 사냥개를 칭찬만 하고 같이 사냥은 안 나가. 힘들까 봐."]],"src":"디오게네스 라에르티오스 6권 55"},{"q":"눈치 보이는 고급 식사 자리, 갈 거야?","o":[["갈래","나는 안 갔어. 높은 사람 집 진수성찬보다 아테네에서 소금 몇 알 먹는 게 나았어."],["안 갈래","나랑 같네. 소금 몇 알이라도 내 자리에서 먹는 게 맛있어."]],"src":"디오게네스 라에르티오스 6권 57"},{"q":"편하자고 누구 비위 맞춰 본 적 있어?","o":[["있지","왕한테 잘 보였으면 상추 안 씻었을 거래. 나는 상추 씻을 줄 알면 굽실댈 일 없다고 했어."],["안 해","좋아. 대신 상추는 네가 씻어야 해. 그게 값이야."]],"src":"디오게네스 라에르티오스 6권 58"},{"q":"무슨 일이 닥쳐도 괜찮을 자신 있어?","o":[["있어","나는 철학으로 딱 그거 하나 얻었어. 어떤 운이 와도 준비된 마음."],["없어","그게 배우는 이유야. 철학에서 뭘 얻었냐고 묻길래, 나는 그거라고 했어."]],"src":"디오게네스 라에르티오스 6권 63"},{"q":"나쁜 무리 속에 있으면 너도 물들까?","o":[["물들 것 같아","햇빛은 하수구에도 들어가지만 더러워지지 않아. 네가 단단하면 돼."],["안 물들어","좋아. 나도 지저분한 데 다닌다고 욕먹었어. 해도 거길 비추잖아."]],"src":"디오게네스 라에르티오스 6권 63"},{"q":"좋은 말 해 놓고 정작 안 지킨 적 있어?","o":[["있어","그럼 하프랑 비슷해. 좋은 소리는 내는데 자기 소리는 못 들어."],["없어","대단하다. 말한 대로 하는 사람은 정말 드물어."]],"src":"디오게네스 라에르티오스 6권 64"},{"q":"다들 나올 때 거꾸로 들어가 본 적 있어?","o":[["있어","나도. 극장 끝나고 다들 나올 때 나는 들어갔어. 평생 그 연습을 하는 중이야."],["없어","한번 해 봐. 사람들 사이를 거슬러 걷는 것도 연습이 필요해."]],"src":"디오게네스 라에르티오스 6권 64"},{"q":"사고 싶은 거 생기면 못 참는 편이야?","o":[["못 참아","그럼 누가 주인이야? 욕심이 시키는 대로 하면 하인이 주인 말 듣는 거랑 같아."],["좀 참아","욕심을 부리는 쪽이 주인이야. 욕심한테 부려지면 하인이고."]],"src":"디오게네스 라에르티오스 6권 66"},{"q":"공부는 몇 살까지 해야 할까?","o":[["학교 때까지","배움은 젊을 땐 절제를, 늙어선 위로를 줘. 가난하면 재산, 부자면 장식이고."],["평생","맞아. 배움은 가난한 사람한텐 재산이고, 늙은 사람한텐 위로야."]],"src":"디오게네스 라에르티오스 6권 68"},{"q":"세상에서 제일 아름다운 게 뭐야?","o":[["자연이나 사람","그것도 좋지. 나는 할 말을 거리낌 없이 할 수 있는 거라고 했어."],["모르겠어","나는 답이 있어. 하고 싶은 말을 숨기지 않고 할 수 있는 자유."]],"src":"디오게네스 라에르티오스 6권 69"},{"q":"마음도 운동처럼 단련될까?","o":[["될 것 같아","되지. 피리 부는 사람도 매일 연습해서 늘잖아. 그만큼 마음에 쏟으면 헛수고가 안 돼."],["타고나는 거야","운동선수도 처음부터 잘하진 않았어. 쉬지 않고 연습해서 된 거야. 마음도 같아."]],"src":"디오게네스 라에르티오스 6권 70"},{"q":"참는 것도 익숙해지면 즐거울까?","o":[["그럴 리가","돼. 편한 데 길든 사람이 불편을 괴로워하듯, 참는 데 길들면 참는 쪽이 더 즐거워."],["그럴 것 같아","맞아. 처음만 힘들어. 길들면 즐거움을 내려놓는 게 즐거움보다 더 즐거워."]],"src":"디오게네스 라에르티오스 6권 71"},{"q":"돈이랑 자유, 하나만 고르면?","o":[["돈이지","돈 있으면 자유도 살 것 같지? 나는 헤라클레스처럼 자유를 제일 앞에 뒀어."],["자유","나랑 같네. 헤라클레스도 무엇보다 자유를 골랐어. 나도 그렇게 살았고."]],"src":"디오게네스 라에르티오스 6권 71"},{"q":"좋은 집안 출신이면 다르게 보여?","o":[["좀 그래","나는 출신이나 명성을 다 비웃었어. 나쁜 버릇을 덮는 화려한 장식인 경우가 많거든."],["아니","집안이나 이름값은 겉치레야. 그 사람 자체를 봐."]],"src":"디오게네스 라에르티오스 6권 72"},{"q":"윗사람 앞에서 작아지는 편이야?","o":[["좀 작아져","사자는 밥 주는 사람의 노예가 아니야. 오히려 밥 주는 쪽이 사자 눈치를 봐. 겁먹는 쪽이 노예야."],["안 작아져","좋아. 나는 노예로 팔려 가서도 그랬어. 두려워하는 쪽이 노예라고."]],"src":"디오게네스 라에르티오스 6권 75"}],"epi":[{"q":"바르게 살면서 즐겁기도 할 수 있을까?","o":[["어려울걸","나는 반대로 봐. 바르게 살지 않으면 즐겁게 살 수도 없어."],["될 것 같아","나도 그렇게 봐. 즐겁게 사는 거랑 바르게 사는 건 서로 떼어 놓을 수가 없어."]],"src":"중요한 가르침 5"},{"q":"야식 먹고 후회한 적 있어?","o":[["자주","야식이 나쁜 건 아니야. 다음 날 따라오는 불편이 더 크면 그게 문제지."],["거의 없어","즐거움 자체엔 나쁜 게 없어. 따라오는 대가만 잘 보면 돼."]],"src":"중요한 가르침 8"},{"q":"신나게 놀고 나면 걱정도 사라져?","o":[["잠깐은","노는 게 두려움까지 없애 주고 욕심의 한계도 알려 준다면, 나도 말릴 이유가 없어."],["그대로야","그렇지. 마음속 두려움은 노는 걸로는 안 풀려. 따로 들여다봐야 해."]],"src":"중요한 가르침 10"},{"q":"월급 오르면 쓰고 싶은 것도 같이 늘어?","o":[["같이 늘어","몸이 바라는 건 끝이 있고 구하기도 쉬워. 같이 느는 쪽은 대개 헛된 생각이 만든 거야."],["그대로야","좋아. 자연이 바라는 부는 금방 채워져. 거기서 멈출 줄 알면 돼."]],"src":"중요한 가르침 15"},{"q":"백 살까지 살고 싶어?","o":[["당연하지","몸은 끝없는 시간을 원해. 근데 마음이 한계를 알면, 지금 삶으로도 다 찬 거야."],["별로","나도 그래. 앞날의 두려움을 내려놓으면 끝없는 시간이 필요 없어."]],"src":"중요한 가르침 20"},{"q":"오늘 한 선택, 왜 했는지 말할 수 있어?","o":[["말할 수 있어","고를 때마다 결국 뭘 위해서인지 떠올리면, 아는 것과 사는 게 어긋나지 않아."],["그냥 했어","그럼 하나만 되짚어 봐. 목적을 놓치면 생각과 행동이 따로 놀게 돼."]],"src":"중요한 가르침 25"},{"q":"못 산 물건, 일주일 지나도 생각나?","o":[["계속 생각나","그럼 그게 구하기 어려운지, 해롭진 않은지 따져 봐. 의외로 쉽게 놓을 수 있어."],["잊었어","그거야. 못 가져도 안 아픈 욕심은 꼭 필요한 게 아니었어."]],"src":"중요한 가르침 26"},{"q":"힘든 시기가 끝없이 갈 것 같을 때 있어?","o":[["있어","무서운 일은 영원하지 않고 생각만큼 길지도 않아. 그동안 제일 든든한 건 친구야."],["없어","좋아. 그 믿음 옆에 친구까지 있으면 훨씬 단단해."]],"src":"중요한 가르침 28"},{"q":"배고픈 거랑 명품 갖고 싶은 거, 같은 욕구야?","o":[["같지","나는 셋으로 나눠. 꼭 필요한 것, 자연스럽지만 없어도 되는 것, 헛된 생각이 만든 것."],["다르지","맞아. 배고픔은 채워야 하지만, 명품 욕심은 헛된 생각에서 나온 쪽이야."]],"src":"중요한 가르침 29"},{"q":"몰래 한 잘못, 시간 지나면 마음 편해져?","o":[["잊혀지지","만 번을 안 들켜도, 죽을 때까지 들킬까 봐 마음 졸이게 돼."],["계속 걸려","그래서 몰래 하는 일은 손해야. 불안이 끝까지 따라다니거든."]],"src":"중요한 가르침 35"},{"q":"안 맞는 사람, 어떻게 대해?","o":[["멀리해","먼저 품을 수 있는지 봐. 안 되면 적으로만 안 만들고, 그것도 안 되면 그때 거리를 둬."],["맞춰 봐","품을 수 있는 사람은 최대한 품는 게 제일 안전해."]],"src":"중요한 가르침 39"},{"q":"행복은 좀 미뤄도 될 것 같아?","o":[["미뤄도 돼","우린 한 번만 태어나. 내일은 네 것도 아닌데 즐거움을 미루고 있는 거야."],["지금 해야지","맞아. 미루다가 제대로 쉬어 보지도 못하고 가는 사람이 많아."]],"src":"바티칸 금언 14"},{"q":"친구 성격의 단점, 봐줄 수 있어?","o":[["봐줄 수 있어","좋아. 우린 자기 성격을 내 것이라 아끼잖아. 친구 성격도 그렇게 아끼는 거야."],["좀 어려워","그럴 수 있어. 내 성격을 아끼듯, 친구 것도 아껴 보는 연습을 해 봐."]],"src":"바티칸 금언 15"},{"q":"나쁜 줄 알면서 고른 적 있어?","o":[["있어","그때는 더 나쁜 것보다 나아 보였을 거야. 미끼는 늘 그렇게 생겼어."],["없어","대부분 그래. 나쁜 걸 알고 고르진 않아. 좋아 보여서 덥석 무는 거지."]],"src":"바티칸 금언 16"},{"q":"다시 스무 살로 돌아가고 싶어?","o":[["돌아가고 싶어","젊을 땐 운에 이리저리 휘둘려. 좋은 날을 기억으로 품은 쪽이 더 단단해."],["지금이 좋아","바라기만 하던 걸 이제 기억으로 가졌잖아. 거기가 항구야."]],"src":"바티칸 금언 17"},{"q":"연락 끊기면 마음도 식을까?","o":[["식겠지","보지도, 만나지도, 같이 있지도 않으면 사랑의 열기는 대개 꺼져."],["그대로일걸","그럴 수도 있어. 그래도 보고 만나는 게 다 사라지면 대부분은 서서히 식어."]],"src":"바티칸 금언 18"},{"q":"나이 드는 게 무서워?","o":[["무서워","나이는 숫자보다 기억이 정해. 지나간 좋은 날을 잊는 날, 그때 늙는 거야."],["별로","받은 좋은 것들을 잊지 않으면 마음은 안 늙어."]],"src":"바티칸 금언 19"},{"q":"몸이 원하는 거, 참는 편이야?","o":[["참는 편","다 참을 필요는 없어. 꼭 필요한 거, 해 없는 건 들어주고 해로운 것만 단호히 끊어."],["들어주는 편","좋아. 자연을 거스르진 말되, 해로운 건 골라내야 해."]],"src":"바티칸 금언 21"},{"q":"필요해서 시작한 친구 사이, 진짜 우정일까?","o":[["진짜지","응. 우정은 도움에서 시작해도, 나중엔 그 자체로 귀해져."],["좀 애매해","대부분의 우정이 그렇게 시작해. 시작이 필요였어도 우정은 그 자체로 바랄 만해."]],"src":"바티칸 금언 23"},{"q":"통장에 얼마 있으면 부자 같을까?","o":[["많을수록","한도 없는 부는 오히려 큰 가난이야. 늘 모자라거든."],["적어도 돼","맞아. 자연이 바라는 만큼으로 재면, 가난도 큰 부가 돼."]],"src":"바티칸 금언 25"},{"q":"인기 없는 의견, 그래도 말하는 편이야?","o":[["말해","나도 박수받는 말보다 모두에게 쓸모 있는 말을 솔직하게 하는 쪽을 골랐어."],["삼켜","그럴 때도 있지. 그래도 늘 맞추기만 하면 흩어지는 칭찬만 남아."]],"src":"바티칸 금언 29"},{"q":"앞일 대비, 많이 해 두는 편이야?","o":[["많이 해 둬","대비할 수 있는 건 해 둬. 근데 죽음 앞에선 우리 모두 성벽 없는 도시에 살아."],["별로","어차피 다 막을 순 없어. 막을 수 없는 걸로 마음 졸일 필요는 없고."]],"src":"바티칸 금언 31"},{"q":"친구한테 실제로 도움받은 적 많아?","o":[["많아","좋네. 근데 더 큰 건, 부르면 와 줄 거라는 믿음이야."],["별로 없어","괜찮아. 도움 그 자체보다 필요할 때 도와줄 거라는 믿음이 더 필요해."]],"src":"바티칸 금언 34"},{"q":"친구한테 부탁, 잘하는 편이야?","o":[["자주 해","늘 도움만 바라면 우정이 장사가 돼. 고마움 대신 이득을 챙기게 되거든."],["거의 안 해","아예 기대도 안 하면 앞날의 희망까지 놓는 거야. 가끔은 기대도 돼."]],"src":"바티칸 금언 39"},{"q":"나눠 주는 거랑 받는 거, 뭐가 편해?","o":[["받는 거","적게 사는 데 익숙해지면 주는 게 더 편해져. 이미 넉넉하거든."],["주는 거","좋아. 필요가 적은 사람이 나누는 법도 더 잘 알아."]],"src":"바티칸 금언 44"},{"q":"자랑하고 싶은 일, 바로 말하는 편이야?","o":[["바로 말해","자랑은 남의 박수를 기다리는 거야. 네 됨됨이로 뿌듯하면 그걸로 충분해."],["참아","밖에서 얻은 것보다 네 안에 있는 걸 자랑스러워하면 돼."]],"src":"바티칸 금언 45"},{"q":"잘나가는 사람 보면 질투 나?","o":[["나지","질투할 이유가 없어. 좋은 사람은 잘될 만하고, 나쁜 사람은 잘될수록 스스로 망가져."],["별로","나는 누구도 부러워하지 말라고 했어. 따져 보면 부러울 이유가 없거든."]],"src":"바티칸 금언 53"},{"q":"지나간 일, 되돌리고 싶을 때 있어?","o":[["자주","일어난 일은 못 되돌려. 그걸 받아들이고, 좋았던 기억으로 마음을 달래 봐."],["가끔","그럴 땐 좋았던 날을 떠올려. 그게 불운을 견디는 약이야."]],"src":"바티칸 금언 55"},{"q":"먹어도 먹어도 허전할 때 있어?","o":[["있어","배는 원래 채워져. 끝없이 채워야 한다는 생각이 허전함을 만드는 거야."],["없어","좋아. 배는 금방 차. 끝없는 건 늘 생각 쪽이야."]],"src":"바티칸 금언 59"},{"q":"아끼려고 궁상떨어 본 적 있어?","o":[["있어","검소함에도 선이 있어. 지나치게 아끼는 것도 사치만큼 잘못이야."],["없어","소박하게 사는 데도 적당한 선이 있거든."]],"src":"바티칸 금언 63"},{"q":"네 힘으로 될 일인데 빌기만 한 적 있어?","o":[["있어","네 손으로 할 수 있는 건 신께 부탁할 일이 아니야. 직접 하면 돼."],["없어","네 힘으로 되는 건 네가 하는 게 맞아."]],"src":"바티칸 금언 65"},{"q":"떠난 친구가 생각나면 어떻게 해?","o":[["울어","울어도 돼. 그래도 그 친구를 아끼는 길은 결국 즐겁게 떠올리는 거야."],["좋은 기억 꺼내","좋아. 그게 떠난 친구를 제일 아끼는 방법이야."]],"src":"바티칸 금언 66"},{"q":"돈 많이 벌려면 남 눈치 봐야 할까?","o":[["어쩔 수 없지","큰돈은 대개 많은 사람이나 윗사람 비위를 맞춰야 와. 자유로운 삶은 큰돈 대신 필요한 게 늘 넉넉해."],["아닐걸","그런 경우도 있지. 자유롭게 살다 큰돈이 생기면, 주변과 나누면 돼."]],"src":"바티칸 금언 67"},{"q":"'이 정도면 됐다' 말해 본 적 있어?","o":[["있어","충분한 걸 모자라다고 여기면, 뭘 가져도 충분하지 않거든."],["아직","한 번 해 봐. 그 말을 모르면 뭘 가져도 모자라."]],"src":"바티칸 금언 68"},{"q":"남이 알면 창피할 일, 하려다 멈춘 적 있어?","o":[["있어","잘했어. 이웃이 알까 두려운 일은 애초에 안 하는 게 제일 편해."],["없어","그럼 앞으로도 그렇게. 누가 알아도 괜찮은 일만 하면 두려울 게 없어."]],"src":"바티칸 금언 70"},{"q":"하고 싶은 게 생기면, 결과까지 따져 봐?","o":[["따져 봐","좋아. 이뤘을 때 어떻게 될지, 못 이뤘을 때 어떻게 될지 둘 다 물어봐야 해."],["일단 해","해 보는 것도 좋아. 그래도 이루면 어떻고 못 이루면 어떤지 한 번은 물어봐."]],"src":"바티칸 금언 71"},{"q":"말싸움에서 지면 분해?","o":[["분해","따져 보면 진 쪽이 더 얻어. 새로 배운 게 제일 많으니까."],["별로","토론에서 지는 사람이 제일 많이 배우거든."]],"src":"바티칸 금언 74"},{"q":"기분 안 좋은 날, 티 내는 편이야?","o":[["티 나","마음이 평온한 사람은 자기도 남도 흔들지 않아. 먼저 네 마음부터 가라앉혀 봐."],["숨겨","숨기느라 너만 힘들면 그것도 흔들리는 거야. 마음이 고요하면 너도 남도 편해."]],"src":"바티칸 금언 79"},{"q":"사람들이 많이 알아주면 마음이 채워져?","o":[["채워지지","잠깐은. 큰 재산도 군중의 박수도 마음속 소란을 없애 주진 못해."],["잠깐뿐","맞아. 많은 사람의 감탄으로는 기쁨다운 기쁨이 안 생겨."]],"src":"바티칸 금언 81"},{"q":"뭘 새로 시작하기에 늦은 나이가 있을까?","o":[["있지","마음 돌보는 데 이르거나 늦은 나이는 없어. 늦었다는 건 행복할 때가 지났다는 말이랑 같아."],["없지","맞아. 젊은 사람도 나이 든 사람도 지혜를 찾아야 해. 이유는 서로 달라도."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 122"},{"q":"많이 먹는 게 좋아, 맛있게 먹는 게 좋아?","o":[["많이","음식도 결국 맛으로 고르잖아. 나는 사는 시간도 제일 긴 것보다 제일 즐거운 걸 고르라고 했어."],["맛있게","나랑 같네. 사는 시간도 그래. 길이보다 얼마나 즐거웠느냐야."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 126"},{"q":"아무 일 없는 날, 심심해서 불안해?","o":[["불안해","몸이 편하고 마음이 고요하면 그게 목표야. 없는 걸 찾아 나설 필요가 없어."],["편안해","아프지 않고 두렵지 않으면, 마음의 폭풍은 이미 잔 거야."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 128"},{"q":"나중에 좋자고 지금 힘든 거, 해 볼 만해?","o":[["해 볼 만해","맞아. 오래 참은 수고가 더 큰 즐거움을 데려오면, 그 고통은 고를 만해."],["싫어","즐거움도 다 고르진 않잖아. 아픔도 그래. 결과까지 보고 정하는 거야."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 129"},{"q":"적게 가져도 괜찮은 연습, 해 본 적 있어?","o":[["해 봤어","사치를 제일 달게 즐기는 사람은 사치가 제일 덜 필요한 사람이야."],["없어","늘 적게 쓰자는 건 아니야. 많이 없을 때도 적은 걸로 괜찮을 수 있게 해 두자는 거지."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 130"},{"q":"중요한 결정, 기분대로 해?","o":[["기분대로","즐겁게 살려면 차분히 따져 보는 게 먼저야. 나는 그 신중함을 철학보다 귀하게 여겼어."],["따져 봐","좋아. 고르고 피할 이유를 따지는 신중함, 다른 미덕도 다 거기서 나와."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 132"},{"q":"일이 꼬이면 '팔자'라는 생각 들어?","o":[["가끔 들어","어떤 건 어쩔 수 없고, 어떤 건 우연이고, 어떤 건 네가 고른 거야. 다 팔자는 아니야."],["아니","우리 손에 달린 일이 있으니까 칭찬도 책임도 생기는 거야."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 133"},{"q":"운 좋은 바보랑 운 나쁜 현자, 누가 나아?","o":[["운 좋은 바보","나는 현명한 사람의 불운이 어리석은 사람의 행운보다 낫다고 봐."],["운 나쁜 현자","나도. 운은 출발점을 줄 순 있어도 행복한 삶을 만들어 주진 않아."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 134"},{"q":"좋은 생각, 같이 나눌 친구 있어?","o":[["있어","그런 친구랑 밤낮으로 같이 곱씹으면, 깨어서도 꿈에서도 흔들리지 않아."],["없어","하나 찾아봐. 생각이 닮은 사람이랑 함께 연습하면 훨씬 단단해져."]],"src":"메노이케우스에게 보내는 편지, 디오게네스 라에르티오스 10권 135"},{"q":"돗자리 펴고 나무 그늘에 누워 본 적 있어?","o":[["있어","그거면 돼. 큰돈 안 들여도 냇가 풀밭에 누워 있는 게 금빛 잔치 못지않아."],["오래됐어","날 좋을 때 한번 가 봐. 풀밭이랑 그늘이면 비싼 연회장 부럽지 않아."]],"src":"루크레티우스, 사물의 본성에 관하여 2권 29–33행"},{"q":"답답하면 일단 어디론가 떠나고 싶어?","o":[["떠나고 싶어","떠나 봐도 그 답답함은 같이 가. 다들 자기한테서 도망치는데, 자기는 못 떼어 내."],["그냥 있어","좋아. 마음이 왜 무거운지 알면, 자꾸 자리를 바꿀 필요가 없어."]],"src":"루크레티우스, 사물의 본성에 관하여 3권 1053–1070행"},{"q":"높은 자리 올라가면 편해질까?","o":[["편해지겠지","높이 올라갈수록 질투가 벼락처럼 내리쳐. 높은 데가 먼저 맞거든."],["더 피곤해","맞아. 조용히 따르는 게, 다스리겠다고 애쓰는 것보다 훨씬 나을 때가 많아."]],"src":"루크레티우스, 사물의 본성에 관하여 5권 1120–1130행"}]};

  if(!k)return `<div class="mis"><p class="mt">내 학파</p><p class="mw">이성파, 쾌락파, 평정파, 실존파. 질문 네 개면 내가 어디인지 알 수 있어요.</p><div class="mb"><button class="opt" type="button" id="sqz">학파 찾기</button></div></div>`;
  return `<div class="mis"><div class="mh"><i class="face" style="${faceCSS(k)}"></i><b>${SCHOOL[k].nm}</b></div><p class="mt">"${SCHOOL[k].line}"</p><p class="mw">같은 학파: ${SCHOOL[k].mem}</p></div>`;}
function drawStory(){const ks=KIDS.filter(k=>S.met[k]);if(!ks.length)return '<p class="mempty">아직 만난 철학자가 없어요.</p>';
  return ks.map(k=>{const l=S.lv[k],x=S.xp[k],lo=LV[l-1],hi=LV[l];const pct=hi==null?100:Math.round((x-lo)/(hi-lo)*100);
    return `<div class="mis"><div class="mh"><i class="face" style="${faceCSS(k)}"></i><b>${short(k)}</b><span class="lv">${l}단계</span></div>
      <div class="xpbar"><i style="width:${pct}%"></i></div><p class="mw">${hi==null?'가장 높은 단계예요':`다음 단계까지 ${hi-x} · 대답하면 1, 미션은 3`}</p>
      <div class="cards">${CARD[k].map((c,i)=>l>=i+2?`<details class="card"><summary>${c[0]}</summary><p>${c[1]}</p></details>`:`<div class="card lock">${i+2}단계에 열리는 이야기</div>`).join('')}</div></div>`;}).join('');}
function drawRace(){const w=weekSum(0),lw=weekSum(1),sd=sameDaySum(),mx=Math.max(w,lw,1);
  const st=lw===0?'지난주 기록이 없어요. 이번 주의 내가 다음 주의 상대가 돼요.':w>lw?'지난주의 나를 넘었어요.':`같은 요일까지 지난주엔 ${sd}개 했어요. ${lw-w+1}개 더 하면 지난주를 넘어요.`;
  return `<div class="mis"><p class="mt">지난주의 나와 겨루기</p>
    <div class="rrow"><span>지난주</span><div class="rbar"><i style="width:${lw/mx*100}%"></i></div><b>${lw}</b></div>
    <div class="rrow me"><span>이번 주</span><div class="rbar"><i style="width:${w/mx*100}%"></i></div><b>${w}</b></div>
    <p class="mw">${st}</p><p class="mw">최고 기록 · 한 주 ${S.best.week}개 · 연속 ${S.best.streak}일</p></div>`;}
function drawBoard(msg){const ks=KIDS.filter(k=>S.mis[k]&&S.mis[k].st!=='skip'&&MIS[k]);
  $('bStats').innerHTML=`<div class="bst"><b>${streak()}일</b><span>연속</span></div><div class="bst"><b>${weekSum(0)}개</b><span>이번 주 미션</span></div><div class="bst"><b>${S.trees}그루</b><span>키운 나무</span></div>`;
  $('bTabs').innerHTML=[['mis','미션']].concat(S.intro>=2?[['rid','수수께끼']]:[]).concat([['talk','광장']]).concat(window.GL?[['league','리그']]:[]).concat([['story','나']]).map(([id,t])=>`<button class="wtab${bt===id?' on':''}" type="button" data-bt="${id}">${t}</button>`).join('');
  document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{bt=b.dataset.bt;sfx.boop();drawBoard();});
  if(bt==='league'&&window.GL){$('bMsg').textContent=msg||'';GL.render($('bList'));return;}
  if(bt==='talk'){$('bMsg').textContent=msg||'';if(window.GL)GL.renderTalk($('bList'));else{const [k,q]=talkQ();$('bList').innerHTML=`<div class="mis"><div class="tq"><i class="face" style="${faceCSS(k)}"></i><p>${q}</p></div>${philAnswer()}<p class="mw">다른 사람들의 답은 정원 웹과 앱에서 보여요.</p></div>`;}return;}
  if(bt==='rid'){$('bList').innerHTML=drawRiddles()||'<p class="mempty">수수께끼는 곧 열려요.</p>';$('bMsg').textContent=msg||'';wireRiddles();return;}
  if(bt!=='mis'){$('bList').innerHTML=drawLean()+drawSchool()+drawRace()+drawStory()+drawPets();$('bMsg').textContent=msg||'';const sq=$('bList').querySelector('#sqz');if(sq)sq.onclick=()=>{sfx.boop();closeBoard();sortQuiz(()=>{openBoard();bt='story';drawBoard();});};return;}
  const done=KIDS.reduce((n,k)=>n+(S.misDone[k]||0),0);
  $('bSub').textContent=done?`지금까지 해낸 미션 ${done}개`:'철학자들이 매일 아침 하나씩 붙여요';
  $('bList').innerHTML=ks.length?ks.map(k=>{const m=S.mis[k],M=MIS[k][m.i];let btn='';
    if(m.st==='new')btn=`<button class="opt" type="button" data-acc="${k}">할게요</button><button class="opt alt" type="button" data-skip="${k}">다음에</button>`;
    else if(m.st==='doing'&&M.min&&!m.start)btn=`<button class="opt" type="button" data-start="${k}">${M.min}분 시작</button>`;
    else if(m.st==='doing'&&M.min&&m.start){const leftMs=M.min*60000-(Date.now()-m.start);btn=leftMs>0?`<button class="opt alt" type="button" disabled>${mmss(leftMs)} 남았어요</button>`:`<button class="opt" type="button" data-fin="${k}">다 했어요</button>`;}
    else if(m.st==='doing')btn=`<button class="opt" type="button" data-fin="${k}">했어요</button>`;
    else btn=`<p class="mok">"${M.ok}"</p><button class="opt alt share" type="button" data-share="${k}">자랑하기</button>`;
    return `<div class="mis${m.st==='done'?' done':''}"><div class="mh"><i class="face" style="${faceCSS(k)}"></i><b>${PH[k].nm.replace('꼬마 ','')}${(()=>{const c=(S.misN[k+m.i]||0)+(m.st==='done'?0:1);return c>1?`<small class="nth">${c}번째</small>`:'';})()}</b><span class="rw"><img src="${A('fruit')}" alt="">${MIS_FRUIT}<img src="${A('drop')}" alt="">${MIS_DROP}</span></div>
      <p class="mt">${M.t}</p><p class="mw">${M.why}</p><div class="mb">${btn}</div>${m.st==='done'?`<img class="mstamp" src="${A('stamp')}" alt="해냄">`:''}</div>`;}).join(''):'<p class="mempty">아직 붙은 미션이 없어요. 철학자를 만나면 생겨요.</p>';
  $('bList').insertAdjacentHTML('beforeend',ridTeaser());
  $('bMsg').textContent=msg||'';
  const on=(sel,f)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{ac();f(b.dataset[Object.keys(b.dataset)[0]],b);});
  on('[data-acc]',k=>{S.mis[k].st='doing';save();sfx.boop();buzz(10);drawBoard();window.GL&&GL.ask();});
  on('[data-skip]',k=>{S.mis[k].st='skip';S.mis[k].day=today();save();sfx.boop();drawBoard('내일 다른 미션이 붙어요');});
  on('[data-start]',k=>{S.mis[k].start=Date.now();save();window.GL&&GL.timer(MIS[k][S.mis[k].i],S.mis[k].start);sfx.boop();buzz(10);drawBoard('시작했어요. 다녀와서 다시 열어 주세요');});
  on('[data-share]',k=>{sfx.boop();shareCard(k);});
  on('[data-fin]',(k,b)=>{const r=b.getBoundingClientRect();S.mis[k].st='done';S.mis[k].day=today();S.misDone[k]=(S.misDone[k]||0)+1;const mk=k+S.mis[k].i;S.misN[mk]=(S.misN[mk]||0)+1;S.xp[k]+=3;const d=today();S.log[d]=(S.log[d]||0)+1;save();drawBoard();reward(k,r);hop(k);setTimeout(()=>{if(!levelUp(k))whenFree(askApp,2500);checkRecords();},1500);window.GL&&GL.onMission();});
  const rz=$('rtz');if(rz)rz.onclick=()=>{sfx.boop();bt='rid';drawBoard();$('bList').scrollTop=0;};}

  {id:'w28',k:'epi',kind:'ans',q:'장자가 꿈에서 이게 되어 훨훨 날았대. 깨고 나서 물었지. "내가 이게 된 꿈을 꾼 걸까, 이게 내가 된 꿈을 꾸는 걸까?"',a:['나비'],ok:'나비. 지금 이 순간이 꿈이 아니라고, 너는 어떻게 확신해?'},
  {id:'w29',k:'soc',kind:'ans',q:'천 원짜리 뒷면 그림 속, 서당 안에 앉아 있는 사람은 누구일까?',a:['이황','퇴계','퇴계이황','이퇴계'],ok:'퇴계 이황 자신이야. 앞면에도 뒷면에도 있는 사람. 그만큼 그 자리를 아꼈던 거지.'},
  {id:'w30',k:'dio',kind:'ans',q:'파스칼은 사람을 바람에 흔들리는 약한 풀에 빗댔어. "인간은 생각하는 ○○다"',a:['갈대'],ok:'갈대. 우주가 사람을 짓눌러 죽여도, 사람은 자기가 죽는다는 걸 알아. 우주는 그걸 몰라.'},
  {id:'w31',k:'nie',kind:'early',h:7,q:'마르쿠스 황제도 이불 밖으로 나오기 싫었대. 그래서 일기에 "나는 일하려고 태어났다"고 썼어. 내일 아침 7시 전에 정원을 열어 봐.',ok:'이불을 이겼네. 하루의 첫 싸움에서 이긴 사람은 나머지도 덜 무서워.'},
  {id:'w32',k:'soc',kind:'ans',q:'똑같은 건초 더미 두 개 사이에 선 당나귀. 어느 쪽도 고르지 못하다가 결국 어떻게 됐을까?',a:['굶어죽었다','굶어죽음','굶어죽어','굶었다','굶어서죽었다'],inc:['굶'],ok:'굶어 죽었대. 뷔리당의 당나귀야. 완벽한 선택을 기다리다 아무것도 못 고르는 것도 선택이야.'},
  {id:'w33',k:'epi',kind:'dusk2',q:'해 지고 하늘이 완전히 어두워질 즈음, 첫 별을 찾아봐. 찾았으면 "찾았어"를 눌러 줘.',ok:'첫 별을 찾는 사람은 그날 하늘을 끝까지 본 사람이야. 오늘 하루, 끝까지 잘 봤어.'},
  {id:'w34',k:'dio',kind:'ans',q:'10원짜리 동전에 있는 탑은?',a:['다보탑'],ok:'다보탑. 불국사 마당에 1,200년 넘게 서 있어. 너보다 오래 기다린 거야.'},
  {id:'w35',k:'soc',kind:'ans',q:'"단순한 설명이 낫다." 쓸데없는 가정을 깎아 낸다고 해서 붙은 이름이야. "오컴의 ○○○"',a:['면도날','면도칼'],ok:'면도날. 변명이 길어지면 의심해 봐. 대개 짧은 쪽이 진짜야.'},
  {id:'w36',k:'nie',kind:'ans',q:'아침엔 네 발, 점심엔 두 발, 저녁엔 세 발. 스핑크스가 오이디푸스에게 낸 수수께끼. 답은?',a:['사람','인간'],ok:'사람. 오이디푸스는 이걸 맞히고 왕이 됐어. 그런데 정작 자기가 누군지는 몰랐지.'},
  {id:'w37',k:'epi',kind:'ans',q:'공자는 "나이 ○○에 하늘의 뜻을 알았다"고 했어. 그래서 이 나이를 지천명이라고 불러. 몇 살일까?',a:['50','쉰','오십','50살','쉰살'],ok:'쉰. 마흔은 흔들리지 않는 불혹, 쉰은 지천명. 공자도 하늘의 뜻을 알기까지 50년이 걸렸어.'},
  {id:'w38',k:'dio',kind:'down',min:30,q:'통 속 30분. 지금까지 중에 제일 길어. 폰을 엎어 두고, 30분 동안 그냥 너로 있어 봐.',ok:'30분이나! 이제 너도 통 속 사람이야. 생각보다 할 게 많았지?'},
  {id:'w39',k:'soc',kind:'ans',q:'만 원짜리 앞면, 세종대왕 옆에 적힌 노래 첫머리는 "뿌리 깊은 나무는…". 이 노래 이름은?',a:['용비어천가'],ok:'용비어천가. 뿌리 깊은 나무는 바람에 흔들리지 않는대. 사람도 그래.'},
  {id:'w40',k:'nie',kind:'ans',q:'스토아학파의 "스토아"는 원래 철학자들이 모여 이야기하던 곳 이름이야. 기둥이 줄지어 선 지붕 있는 복도. 이걸 뭐라고 부를까?',a:['주랑','회랑','복도','기둥복도','열주'],ok:'주랑. 에피쿠로스는 정원에서, 스토아는 주랑에서. 철학은 늘 사람들이 지나다니는 곳에서 했어.'},
  {id:'w41',k:'dio',kind:'ans',q:'아리스토텔레스한테 배운 제자 중에 나중에 세상의 절반을 정복한 왕이 있어. 나한테 햇빛 가리지 말라는 말을 들은 그 왕이야.',a:['알렉산드로스','알렉산더','알렉산드로스대왕','알렉산더대왕'],ok:'알렉산드로스. 그가 그랬대. "내가 알렉산드로스가 아니었다면 디오게네스가 되고 싶었을 것이다."'},
  {id:'w42',k:'epi',kind:'ans',q:'서울에는 "다산로"라는 길도 있어. 다산은 조선의 어느 학자의 호일까?',a:['정약용','다산정약용'],ok:'정약용. 18년 귀양 가 있는 동안 책을 500권 넘게 썼어. 갇힌 곳에서 오히려 제일 넓게 생각했지.'},
  {id:'w43',k:"soc",kind:'ans',q:"소크라테스의 아내 이름은? 화를 잘 내기로 유명해서 지금도 악처 하면 이 이름이 나와.",a:["크산티페", "크산티페스"],ok:"크산티페. 소크라테스는 \"좋은 아내를 얻으면 행복해지고, 나쁜 아내를 얻으면 철학자가 된다\"고 했대."},
  {id:'w44',k:"nie",kind:'ans',q:"\"『○○○○○는 이렇게 말했다』\" 내가 초인 이야기를 하려고 산에서 내려보낸 예언자 이름이야.",a:["차라투스트라", "짜라투스트라", "자라투스트라"],ok:"차라투스트라. 10년 동안 산에 있다가, 남는 지혜를 나눠 주려고 내려왔어."},
  {id:'w45',k:"dio",kind:'ans',q:"에픽테토스 형은 원래 어떤 신분이었을까? 다리를 절던 ○○.",a:["노예"],ok:"노예. 몸은 남의 것이었는데, 생각만은 누구에게도 안 넘겼어."},
  {id:'w46',k:"epi",kind:'ans',q:"내가 아테네에 세운 학교 이름은? 거기서 친구들이랑 같이 살았어.",a:["정원", "케포스", "가든"],ok:"정원. 문 앞에 이렇게 써 붙였어. \"손님, 여기서 즐겁게 지내시오. 여기서 최고의 선은 쾌락이오.\""},
  {id:'w47',k:"soc",kind:'ans',q:"내가 사형 선고를 받고 마신 독은 어떤 식물로 만들었을까?",a:["독당근", "독미나리", "헴록", "햄록"],ok:"독당근. 다리부터 차가워졌대. 마지막까지 친구들이랑 이야기했지."},
  {id:'w48',k:"nie",kind:'ans',q:"사르트르는 \"인간은 ○○을 선고받았다\"고 했어. 피할 수 없는 그것.",a:["자유"],ok:"자유. 고르지 않는 것도 고른 거래. 핑계 댈 곳이 없다는 뜻이야."},
  {id:'w49',k:"epi",kind:'ans',q:"카뮈가 \"행복하다고 상상해야 한다\"고 한, 영원히 바위를 밀어 올리는 신화 속 인물은?",a:["시시포스", "시지프", "시지프스", "시지포스"],ok:"시시포스. 바위는 또 굴러떨어져. 그래도 다시 내려가는 그 발걸음이 그의 것이래."},
  {id:'w50',k:"soc",kind:'ans',q:"칸트가 평생 거의 떠나지 않은 고향 도시는? 지금은 러시아 땅이야.",a:["쾨니히스베르크", "칼리닌그라드"],ok:"쾨니히스베르크. 멀리 안 가도 생각은 끝까지 갈 수 있어."},
  {id:'w51',k:"dio",kind:'ans',q:"\"내일 세상이 멸망해도 나는 오늘 한 그루의 ○○나무를 심겠다.\" 스피노자가 했다고 알려졌지만, 사실 출처가 불분명한 말이야.",a:["사과", "사과나무"],ok:"사과나무. 누가 했든 좋은 말이지. 그래도 출처는 따져 봐야 해. 그게 철학이야."},
  {id:'w52',k:"nie",kind:'ans',q:"나는 작곡도 했어. 한때 아버지처럼 따르다가 등을 돌린 작곡가는?",a:["바그너", "리하르트바그너"],ok:"바그너. 존경하는 사람과 헤어지는 것도 내가 되는 과정이었어."},
  {id:'w53',k:"epi",kind:'ans',q:"헤라클레이토스는 \"사람은 같은 ○에 두 번 들어갈 수 없다\"고 했어.",a:["강", "강물", "냇물"],ok:"강. 물도 바뀌고, 들어가는 너도 바뀌니까."},
  {id:'w54',k:"soc",kind:'ans',q:"최초의 철학자 탈레스는 만물의 근원을 이걸로 봤어. 한 글자.",a:["물"],ok:"물. 틀렸지만, 신화 말고 세상 안에서 답을 찾으려 한 첫 사람이었어."},
  {id:'w55',k:"dio",kind:'ans',q:"탈레스는 별을 보며 걷다가 어디에 빠졌대? 옆에 있던 하녀가 깔깔 웃었지.",a:["우물", "구덩이", "도랑", "웅덩이"],ok:"우물. 하늘을 아는 사람이 발밑을 모른다고 놀림받았어. 그래도 그는 나중에 올리브 풍년을 맞혀서 큰돈을 벌었어."},
  {id:'w56',k:"nie",kind:'ans',q:"아우구스티누스가 말했어. \"시간이 무엇인지 아무도 묻지 않으면 나는 안다. 묻는 사람에게 설명하려 하면 나는 ○○○.\"",a:["모른다", "몰라", "모르겠다"],ok:"모른다. 제일 익숙한 게 제일 어려운 질문이야."},
  {id:'w57',k:"epi",kind:'ans',q:"벤담은 죽은 뒤 자기 몸을 어떻게 해 달라고 했을까? 지금도 런던의 대학에 앉아 있어.",a:["박제", "미라", "전시", "보존", "유리관"],ok:"전시. 옷 입은 채로 유리 상자 안에 앉아 있어. 죽어서도 쓸모 있고 싶었대."},
  {id:'w58',k:"soc",kind:'ans',q:"『군주론』의 마키아벨리는 \"군주는 사랑받기보다 ○○○의 대상이 되는 편이 안전하다\"고 했어.",a:["두려움", "공포", "무서움"],ok:"두려움. 사랑은 쉽게 변하지만 두려움은 오래간대. 맞는 말일까?"},
  {id:'w59',k:"dio",kind:'ans',q:"홉스는 나라가 없는 삶을 이렇게 말했어. \"고독하고, 가난하고, 끔찍하고, 잔인하고, 그리고 ○○.\"",a:["짧다", "짧은", "짧고"],ok:"짧다. 그래서 사람들이 규칙을 만들고 나라를 세웠다는 거야."},
  {id:'w60',k:"nie",kind:'ans',q:"키르케고르가 말한 \"죽음에 이르는 병\"은 뭘까?",a:["절망"],ok:"절망. 자기 자신이 되기를 포기하는 것. 그게 병이래."},
  {id:'w61',k:"epi",kind:'ans',q:"밀은 \"배부른 돼지보다 배고픈 ○○○○가 낫다\"고 했어.",a:["소크라테스"],ok:"소크라테스. 돼지 얘기라 나도 좀 찔리네. 그래도 내 돼지는 배고픈 소크라테스랑 친해."},
  {id:'w62',k:"soc",kind:'ans',q:"비트겐슈타인 책의 마지막 문장. \"말할 수 없는 것에 대해서는 ○○해야 한다.\"",a:["침묵"],ok:"침묵. 모르면 말을 줄이는 것. 나는 그래서 묻기만 했어."},
  {id:'w63',k:"dio",kind:'ans',q:"로크는 갓 태어난 사람의 마음을 아무것도 쓰이지 않은 이것에 빗댔어. \"타불라 라사\"",a:["백지", "빈석판", "석판", "서판", "종이", "빈종이"],ok:"백지. 무엇을 채울지는 살면서 정하는 거야."},
  {id:'w64',k:"nie",kind:'ans',q:"파스칼은 \"클레오파트라의 ○가 조금만 낮았더라면 세계의 역사가 바뀌었을 것\"이라고 했어.",a:["코"],ok:"코. 큰일은 생각보다 작은 데서 갈려."},
  {id:'w65',k:"epi",kind:'ans',q:"교육에 관한 책 『에밀』을 쓴 루소는, 정작 자기 아이 다섯을 어디에 맡겼을까?",a:["고아원", "보육원", "보호소"],ok:"고아원. 말과 삶이 다를 수 있다는 걸, 철학자도 보여 줬어."},
  {id:'w66',k:"soc",kind:'ans',q:"아리스토텔레스는 용기를 무모함과 비겁함 사이의 무엇이라고 했어? 두 글자.",a:["중용"],ok:"중용. 딱 가운데가 아니라 그 상황에 딱 맞는 자리래."},
  {id:'w67',k:"dio",kind:'ans',q:"마르크스는 종교를 두고 \"인민의 ○○\"이라고 했어.",a:["아편"],ok:"아편. 아픔을 잊게는 해 주지만 아픔의 원인은 그대로라는 뜻이었어."},
  {id:'w68',k:"nie",kind:'ans',q:"하이데거는 인간을 이렇게 불렀어. \"죽음을 향한 ○○\"",a:["존재", "존재자"],ok:"존재. 끝이 있다는 걸 알아서, 사람은 지금을 고를 수 있어."},
  {id:'w69',k:"epi",kind:'ans',q:"세네카 형이 가르친 제자였는데, 나중에 세네카에게 스스로 목숨을 끊으라고 명령한 로마 황제는?",a:["네로"],ok:"네로. 제자를 잘못 만난 스승이지. 그래도 세네카는 마지막까지 평온했대."},
  {id:'w70',k:"soc",kind:'ans',q:"조선의 사단칠정 논쟁. 퇴계 이황과 8년 동안 편지로 토론한 젊은 학자는?",a:["기대승", "고봉", "고봉기대승"],ok:"기대승. 스물여섯 살 많은 대학자에게 끝까지 따져 물었어. 퇴계도 그걸 반겼지."},
  {id:'w71',k:"dio",kind:'ans',q:"원효는 밤에 목이 말라 어둠 속에서 물을 달게 마셨는데, 아침에 보니 그게 뭐였대?",a:["해골물", "해골", "해골바가지"],ok:"해골물. 물은 그대로인데 마음이 바뀌니 맛이 바뀐 거야. 일체유심조."},
  {id:'w72',k:"nie",kind:'ans',q:"\"자연은 ○○을 싫어한다.\" 빈 공간은 없다는 뜻으로 오래 쓰인 말이야.",a:["진공", "빈공간", "공백"],ok:"진공. 지금은 진공도 있다는 걸 알아. 오래 믿은 말도 틀릴 수 있어."},
  {id:'w73',k:"epi",kind:'ans',q:"나는 신 말고 이것이 세상을 이룬다고 봤어. 더 쪼갤 수 없는 작은 알갱이.",a:["원자"],ok:"원자. 2,000년 뒤에 과학이 확인해 줬지. 그러니 신이 벌줄까 무서워할 필요 없어."},
  {id:'w74',k:"soc",kind:'ans',q:"프로이트는 꿈을 \"무의식으로 가는 ○○\"라고 했어.",a:["왕도", "지름길", "큰길"],ok:"왕도. 꿈은 마음이 낮에 못 한 말을 하는 곳이래."},

async function makeCard(k){const m=S.mis[k],M=MIS[k][m.i],W=1080,H=1350;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');

  const r=(x,y,w,h,rd)=>{c.beginPath();c.moveTo(x+rd,y);c.arcTo(x+w,y,x+w,y+h,rd);c.arcTo(x+w,y+h,x,y+h,rd);c.arcTo(x,y+h,x,y,rd);c.arcTo(x,y,x+w,y,rd);c.closePath();};
  r(70,90,W-140,H-180,56);c.fill();c.stroke();

  c.font='64px Jua, sans-serif';const ls=wrapLines(c,M.t,W-260).slice(0,3);ls.forEach((l,i)=>c.fillText(l,W/2,960+i*82));

  c.fillStyle='#7a6fa0';c.font='36px Jua, sans-serif';c.fillText('소크라텃밭',W/2,H-130);

async function shareCard(k){let cv;try{cv=await makeCard(k);}catch(e){toast('그림을 만들지 못했어요');return;}

  const next=()=>{const G=window.GL;if(!(G&&G.isIn&&G.isIn()))return askSave('day');
