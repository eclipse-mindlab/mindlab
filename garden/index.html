const NOW=()=>Date.now()+S.off*864e5;
function sunTimes(ms){const r=Math.PI/180,lat=37.5665,lw=-126.978,J=ms/864e5+2440587.5,n=Math.round(J-2451545.0009-lw/360),Js=2451545.0009+lw/360+n;
  const M=(357.5291+0.98560028*(Js-2451545))%360,C=1.9148*Math.sin(M*r)+0.02*Math.sin(2*M*r)+0.0003*Math.sin(3*M*r),L=(M+C+180+102.9372)%360;
  const Jt=Js+0.0053*Math.sin(M*r)-0.0069*Math.sin(2*L*r),d=Math.asin(Math.sin(L*r)*Math.sin(23.44*r));
  const w=Math.acos((Math.sin(-0.833*r)-Math.sin(lat*r)*Math.sin(d))/(Math.cos(lat*r)*Math.cos(d)))/r;
  const ms_=j=>(j-2440587.5)*864e5;return {rise:ms_(Jt-w/360),set:ms_(Jt+w/360),noon:ms_(Jt)};}
function sunToday(){const d=new Date(NOW());d.setHours(12,0,0,0);return sunTimes(d.getTime());}
const hm=ms=>{const d=new Date(ms);return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;};
const moonAge=()=>{const SYN=29.530588853,ref=Date.UTC(2000,0,6,18,14);return (((NOW()-ref)/864e5)%SYN+SYN)%SYN;};

function moonSVG(f){const r=13,rx=Math.abs(1-2*f)*r;return `<svg viewBox="-16 -16 32 32" width="34" height="34" aria-hidden="true"><circle r="${r}" fill="#2b2550"/>${f>=.99?`<circle r="${r}" fill="#ffe9a6"/>`:`<path d="M0,-${r} A${r},${r} 0 0 1 0,${r} A${rx},${r} 0 0 ${f>.5?1:0} 0,-${r}Z" fill="#ffe9a6"/>`}<circle r="${r}" fill="none" stroke="#000" stroke-width="1.5"/></svg>`;}
function moonState(){const a=moonAge(),h=new Date(NOW()).getHours(),dark=NOW()>sunToday().set-10*60000;
  if(a<2.5||a>16.6){const wait=a<2.5?2.5-a:29.53-a+2.5;return {can:false,msg:`요즘은 달이 밤늦게 떠요. ${Math.ceil(wait)}일쯤 뒤 저녁에 다시 와 줘.`};}

  try { if (!auth.currentUser) await F.signInAnonymously(auth); } catch (e) {}
  // one read of the 40 most recently played gardens, reused for ten minutes
  if (!pubList || Date.now() - pubList.t > 6e5) {
    const got = [];
    try { (await F.getDocs(F.query(F.collection(db, 'gardenPub'), F.orderBy('at', 'desc'), F.limit(40)))).forEach(d => got.push(d.id)); } catch (e) { toast('잠시 뒤에 다시 해 주세요'); return; }
    pubList = {t: Date.now(), got};
  }
  const got = pubList.got;
  const seen = VS ? VS.seen : new Set(), mine = me ? me.uid : '';
  let pool = got.filter(u => u !== mine && !seen.has(u));
  if (!pool.length) { seen.clear(); pool = got.filter(u => u !== mine && (!VS || u !== VS.uid)); }
  if (!pool.length) { toast('아직 놀러 갈 정원이 없어요'); return; }
  visit(pool[Math.floor(Math.random() * pool.length)], seen);
}

// the 나 tab: my sign, and the gardens I follow

  if (mode === 'vnb') {
    const L = S.nb || [];
    el.innerHTML = `<div class="mtop"><button class="lnk" type="button" id="mBack">‹ 나</button></div>` + (L.length ? L.map(x => `<div class="ta vnbr"><div class="who"><b>${esc(x.name || '정원사')}</b></div><div class="act"><span class="sp"></span><button class="like" type="button" data-go="${esc(x.u)}">놀러 가기</button></div></div>`).join('') : '<p class="mempty">아직 이웃이 없어요. 놀러 간 정원에서 \'이웃 +\'를 누르면 여기 모여요.</p>') + '<div class="mb"><button class="opt" type="button" id="vInv">친구 부르기</button></div>';
  } else {
    const picks = [];
    for (const key in (S.picks || {})) { const m = key.match(/^([a-z]+)(\d+)$/); if (!m || !PH[m[1]]) continue; const Q = PH[m[1]].Q[+m[2]]; if (!Q || !Q.o[S.picks[key]]) continue; picks.push({q: Q.q, a: Q.o[S.picks[key]][0], k: m[1], d: (S.pkd || {})[key]}); }

      `<div class="vsw"><span><b>내 정원에 손님 받기</b><small>끄면 아무도 놀러 올 수 없어요</small></span><button type="button" class="tgl${S.pubOff ? '' : ' on'}" id="vPub" aria-pressed="${!S.pubOff}" aria-label="내 정원에 손님 받기"><i></i></button></div>` +
      (all.length ? all.map((x, i) => `<button type="button" class="ta vpick${on(x) ? ' on' : ''}" data-pick="${i}"><span class="who">${esc(cut(x.q, 60))}</span><span class="vpa">${esc(cut(x.a, 150))}</span><i class="vdot" aria-hidden="true"></i></button>`).join('') : '<p class="mempty">아직 고른 답이 없어요. 철학자 질문이나 광장 질문에 먼저 답해 보세요.</p>');
    el.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      const x = all[+b.dataset.pick]; S.sign = S.sign || []; const i = S.sign.findIndex(y => y.q === x.q && y.a === x.a);
      if (i >= 0) S.sign.splice(i, 1); else { if (S.sign.length >= 3) { sfx.no && sfx.no(); toast('팻말에는 세 개까지 걸 수 있어요'); return; } S.sign.push({q: cut(x.q, 60), a: cut(x.a, 150), k: x.k}); }
      sfx.boop(); save(); b.classList.toggle('on', i < 0); $('sgN').textContent = `팻말에 건 답 ${S.sign.length} / 3`; pubSoon();
    });
    const pb = el.querySelector('#vPub'); pb.onclick = () => { sfx.boop(); S.pubOff = S.pubOff ? 0 : 1; save(); pubSoon(); pb.classList.toggle('on', !S.pubOff); pb.setAttribute('aria-pressed', String(!S.pubOff)); toast(S.pubOff ? '이제 아무도 놀러 올 수 없어요' : '이제 손님이 놀러 올 수 있어요'); };
  }
  el.querySelector('#mBack').onclick = () => { sfx.boop(); bt = 'story'; drawBoard(); };
  const iv = el.querySelector('#vInv'); if (iv) iv.onclick = () => { sfx.boop(); invite(); };

}

// ---- garden codes: six letters a person can read out or type (no 0/O, no 1/I) ----
// gardenCode/{code} = {u: uid}; a taken code can't be overwritten, so a clash just means trying another
const CODE_ABC = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ', CODE_RE = /^[2-9A-HJ-NP-Z]{6}$/;
const myCode = () => me && S.vcode && S.vcode.u === me.uid ? S.vcode.c : '';
let codeP = null, codeFail = 0;
function ensureCode() {
  if (!ready || !me) return Promise.resolve('');
  if (myCode()) return Promise.resolve(myCode());
  if (codeP) return codeP;
  if (Date.now() - codeFail < 6e4) return Promise.resolve('');
  codeP = (async () => {
    for (let i = 0; i < 6; i++) {
      let c = ''; const r = crypto.getRandomValues(new Uint8Array(6)); r.forEach(x => { c += CODE_ABC[x & 31]; });
      try { await F.setDoc(F.doc(db, 'gardenCode', c), {u: me.uid}); S.vcode = {c, u: me.uid}; save(); return c; } catch (e) {}
    }
    codeFail = Date.now(); return '';
  })().finally(() => { codeP = null; });
  return codeP;
}
function copyCode() {
  const c = myCode(); if (!c) { toast('로그인하면 내 정원 코드가 생겨요'); return; }
  const ok = () => toast(`코드 ${c}를 복사했어요`);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(c).then(ok, () => toast(`내 정원 코드는 ${c}예요`)); else toast(`내 정원 코드는 ${c}예요`);
}
// type a friend's code to visit
function codeVisit() {
  const w = document.createElement('div'); w.className = 'ward';
  w.innerHTML = `<div class="wsheet" role="dialog" aria-label="코드로 놀러 가기"><div class="whead"><b>코드로 놀러 가기</b><button class="icon wx" type="button" aria-label="닫기"><img src="${A('ui_close')}" alt=""></button></div><p class="mw">친구한테 받은 정원 코드 여섯 글자를 넣어 주세요.</p><input class="vcin" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7MQ2P" aria-label="정원 코드"><p class="mw vcmsg" aria-live="polite"></p><div class="mb"><button class="opt" type="button" id="vcGo">놀러 가기</button></div></div>`;
  $('app').appendChild(w);
  const inp = w.querySelector('input'), msg = w.querySelector('.vcmsg'), close = () => w.remove();
  w.querySelector('.wx').onclick = () => { sfx.boop(); close(); }; w.addEventListener('click', e => { if (e.target === w) close(); });
  inp.oninput = () => { const v = inp.value.toUpperCase().replace(/[^0-9A-Z]/g, ''); if (v !== inp.value) inp.value = v; msg.textContent = ''; };
  const go = async () => {
    const c = inp.value;
    if (!CODE_RE.test(c)) { sfx.no && sfx.no(); msg.textContent = /[01OI]/.test(c) ? '코드에는 0, O, 1, I가 들어가지 않아요. 다시 확인해 주세요' : '코드는 여섯 글자예요'; return; }
    sfx.boop(); msg.textContent = '찾는 중이에요';
    if (failed || !ready) { msg.textContent = '인터넷이 될 때 찾을 수 있어요'; return; }
    try { if (!auth.currentUser) await F.signInAnonymously(auth); } catch (e) {}
    const uid = await findGarden(c);
    if (!w.isConnected) return;
    if (!uid) { sfx.no && sfx.no(); msg.textContent = '그런 정원이 없어요. 코드를 한 번 더 확인해 주세요'; return; }
    if (me && uid === me.uid) { msg.textContent = '내 정원 코드예요'; return; }
    close(); visit(uid);
  };
  w.querySelector('#vcGo').onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  setTimeout(() => inp.focus(), 60);
}
// ---- inviting friends: a short link that opens my garden ----
// the code is the first 8 letters of my id; the garden is found again by looking up ids that start with it
const inviteUrl = () => HOME + '?g=' + (myCode() || me.uid.slice(0, 8));
function invite() {
  if (failed || !ready) { toast('인터넷이 될 때 보낼 수 있어요'); return; }
  if (!me) { toast('친구가 내 정원에 들어오려면 먼저 로그인해야 해요'); signIn(); return; }
  if (S.pubOff) { S.pubOff = 0; save(); toast('손님 받기를 켰어요'); }
  publishGarden();
  const url = inviteUrl(), c = myCode(), text = `${cut(S.lname || '정원사', 10)}님의 소크라텃밭에 놀러 와. 나무에 물 한 방울만 주고 가 줘` + (c ? `\n정원 코드 ${c}` : '');
  S.invN = (S.invN || 0) + 1; save();
  // the share sheet has to open straight from the tap, so nothing is awaited before it
  const SH = NATIVE && plug('Share');
  const done = e => { if (e && (e.name === 'AbortError' || /cancel/i.test(String(e.message || e)))) return; linkSheet(text, url); };
  if (SH) { SH.share({title: '소크라텃밭', text, url, dialogTitle: '친구 부르기'}).catch(done); return; }
  if (navigator.share && !(KAKAO && OS === 'android')) { navigator.share({title: '소크라텃밭', text, url}).catch(done); return; }
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text + '\n' + url).then(() => toast('링크를 복사했어요. 카톡에 붙여 넣어 보내 주세요'), () => linkSheet(text, url)); return; }
  linkSheet(text, url);
}
// when no share sheet or clipboard works: the message in a box to copy by hand
function linkSheet(text, url) {
  const host = VS ? vEl() : $('app'); const w = document.createElement('div'); w.className = 'ward';
  w.innerHTML = `<div class="wsheet" role="dialog" aria-label="친구 부르기"><div class="whead"><b>친구 부르기</b><button class="icon wx" type="button" aria-label="닫기"><img src="${A('ui_close')}" alt=""></button></div><p class="mw">아래 글을 길게 눌러 복사한 다음 카톡에 붙여 넣어 보내 주세요.</p><textarea class="vlink" readonly rows="4"></textarea><div class="mb"><button class="opt" type="button" id="lkCp">복사하기</button></div></div>`;
  host.appendChild(w); const ta = w.querySelector('textarea'); ta.value = text + '\n' + url;
  const close = () => w.remove(); w.querySelector('.wx').onclick = close; w.addEventListener('click', e => { if (e.target === w) close(); });
  w.querySelector('#lkCp').onclick = () => { ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} toast(ok ? '복사했어요' : '글을 길게 눌러 복사해 주세요'); };
}
async function findGarden(code) {
  if (CODE_RE.test(code)) { try { const d = await F.getDoc(F.doc(db, 'gardenCode', code)); return d.exists() ? d.data().u || '' : ''; } catch (e) { return ''; } }
  if (code.length >= 20) return code;
  try {
    const r = await F.getDocs(F.query(F.collection(db, 'gardenPub'), F.where(F.documentId(), '>=', code), F.where(F.documentId(), '<', code + ''), F.limit(1)));
    let id = ''; r.forEach(d => { if (d.id.startsWith(code)) id = d.id; }); return id;
  } catch (e) { return ''; }
}
// arriving from a friend's link: open that garden as soon as the cloud is ready
async function landVisit() {
  let code = window.VISIT_AT || (typeof VISIT_AT === 'string' ? VISIT_AT : '');
  try { const p = JSON.parse(sessionStorage.getItem(VISIT_KEY) || 'null'); sessionStorage.removeItem(VISIT_KEY); if (!code && p && Date.now() - p.t < 6e5) code = p.c; } catch (e) {}
  if (!code) return;
  try { const q = new URLSearchParams(location.search); q.delete('g'); const h = location.hash.slice(1).split('&').filter(x => x && !/^g=/.test(x)).join('&');
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + (h ? '#' + h : '')); } catch (e) {}
  await loading;
  for (let i = 0; i < 20 && !authKnown; i++) await new Promise(r => setTimeout(r, 150));
  if (failed || !ready) { toast('인터넷이 될 때 친구 정원이 열려요'); return; }
  try { if (!auth.currentUser) await F.signInAnonymously(auth); } catch (e) {}
  const uid = await findGarden(code);
  if (!uid) { toast('지금은 손님을 받지 않는 정원이에요'); return; }
  if (me && uid === me.uid) return;
  visit(uid);
}

window.GL = {reschedule: () => reminders(), render, renderTalk, renderMine, renderVis, visit, visitRandom, visitMenu, invite, codeVisit, copyCode, myCode, ensureCode, pubSoon, closeVisit, visitOpen: () => !!VS, updateInfo, doUpdate, ask, notifState, timer, onMission: () => { postScore(); push(); reminders(); },
  ready: () => ready, isIn: () => !!me, native: NATIVE,

  // who won last week's school match (highest average points)
  lastWeek: async () => { await loading; for (let i = 0; i < 20 && !authKnown; i++) await new Promise(r => setTimeout(r, 150)); if (!me) return null;
    const col = F.collection(db, 'gardenLeague', weekDays(1)[0], 'p'); let best = null;
    for (const k of Object.keys(SCHOOL)) { try { const a = (await F.getAggregateFromServer(F.query(col, F.where('sc', '==', k)), {c: F.count(), t: F.sum('n')})).data(); const avg = a.c ? a.t / a.c : 0; if (a.c && (!best || avg > best.avg)) best = {k, avg}; } catch (e) {} }
    return best ? {win: best.k} : null; }, wantsBeta: () => !NATIVE && OS === 'android' && !S.beta,
  appSheet, offerApp: !NATIVE && OS === 'android', openStore, tester: async () => { const t = await isTester(); if (t && !S.betaTester) { S.betaTester = 1; save(); } return t; }, newReplies, talkView: v => { tView = v; talkCache = null; }, openAsk, inapp: INAPP, out: (why, cancel) => outToBrowser(why, '', cancel), wantsApp: () => !NATIVE && OS === 'android' && !S.beta && !S.appGot};
const loading = load();
askLanding(); setTimeout(askCheck, 4000);
if (/[#&]app\b/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} setTimeout(() => { if (S.intro >= 2) appSheet(); }, 1800); }
