<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d1838">
<meta name="description" content="소크라텃밭: 꼬마 소크라테스와 철학자들이 찾아오는 정원. 질문에 답하고, 미션을 하고, 나무를 키워요.">

<body>
<title>소크라텃밭</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* one living scene, full screen. the garden is the interface; words only live in speech bubbles. */
:root{
  --ink:#1b1530; --paper:#fffaf0; --gold:#ffcf5a; --leaf:#5fc27e; --leaf2:#3f9e62; --mute:#8d84ad;
  --hand:'Jua',system-ui,sans-serif; --read:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#1d1838;color:var(--paper);font-family:var(--read);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(18,14,36,.55);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px 5px 8px;font-family:var(--hand);font-size:17px;color:var(--paper)}
.chip svg{width:20px;height:20px}
.chip.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.22)}}
.icon{pointer-events:auto;appearance:none;width:40px;height:40px;border-radius:50%;background:rgba(18,14,36,.55);border:2px solid rgba(255,255,255,.14);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.icon:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bub{position:absolute;z-index:6;width:max-content;max-width:min(300px,calc(100% - 32px));background:var(--paper);color:var(--ink);border:3px solid #000;border-radius:20px;padding:12px 14px;box-shadow:0 5px 0 #000;transform-origin:50% 100%;animation:bubIn .32s cubic-bezier(.2,1.5,.4,1) both}
.bub::after{content:"";position:absolute;bottom:-13px;left:var(--tail,50%);width:18px;height:18px;background:var(--paper);border-right:3px solid #000;border-bottom:3px solid #000;transform:translateX(-50%) rotate(45deg)}
.bub p{margin:0;font-family:var(--hand);font-size:19px;line-height:1.38;word-break:keep-all;text-wrap:pretty}
.bub .who{display:block;font-family:var(--read);font-size:12px;color:var(--mute);margin-bottom:2px}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.opt{appearance:none;flex:1 1 auto;border:2.5px solid #000;background:var(--gold);color:var(--ink);border-radius:14px;padding:8px 12px;font-family:var(--hand);font-size:16.5px;cursor:pointer;box-shadow:0 3px 0 #000}
.opt.alt{background:#fff}
.more{position:absolute;right:12px;bottom:8px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--mute);animation:more 1s ease-in-out infinite}
@keyframes more{50%{transform:translateY(3px)}}
.bub p{padding-right:10px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
@keyframes bubIn{from{opacity:0;transform:scale(.6) translateY(10px)}}
.toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:7;background:var(--gold);color:var(--ink);border:3px solid #000;border-radius:999px;padding:6px 16px;font-family:var(--hand);font-size:17px;box-shadow:0 4px 0 #000;white-space:nowrap;animation:toast 2.4s ease both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.dev{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;appearance:none;border:1.5px dashed rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.55);border-radius:999px;padding:4px 10px;font-family:var(--read);font-size:11.5px;cursor:pointer}
.fly{position:absolute;z-index:8;width:22px;height:22px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-.3,.6,1),opacity .7s}
/* scene parts */
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.025)}}
.hop{animation:hop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes hop{40%{transform:translateY(-18px) scaleY(1.04)}70%{transform:translateY(0) scaleY(.94)}}
.zz{font-family:var(--hand);fill:#fff;animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
.ff{animation:ff var(--t,6s) ease-in-out infinite alternate}
@keyframes ff{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(var(--dx,20px),var(--dy,-30px));opacity:.4}}
.tw{animation:tw var(--t,3s) ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes grow{0%{transform:scale(.7)}}
.drip{animation:drip .55s ease-in forwards}
@keyframes drip{to{transform:translateY(46px);opacity:0}}
.spark{transform-box:fill-box;transform-origin:center;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6) translate(var(--dx),var(--dy));opacity:0}}
.ring{animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.6deg)}}

.hl{display:flex;gap:8px;align-items:center}
.appb{pointer-events:auto;appearance:none;position:relative;height:40px;padding:0 13px;border:2.5px solid #000;border-radius:999px;background:var(--gold);color:var(--ink);font-family:var(--hand);font-size:15.5px;white-space:nowrap;cursor:pointer;box-shadow:0 3px 0 #000}
.appb:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.appb.new::after{content:'';position:absolute;top:-3px;right:-2px;width:11px;height:11px;border-radius:50%;background:#ff5d73;border:2px solid #000;animation:apdot 1.6s ease-in-out infinite}
@keyframes apdot{50%{transform:scale(1.25)}}
#appSh .wsheet{display:flex;flex-direction:column;gap:10px}
#appSh .opt{display:block;text-align:center;text-decoration:none}
#appSh .mis.ok{background:#f3fbe9}
#appSh .opt[disabled]{background:#ece7dc;color:#857c99;border-color:#857c99;box-shadow:0 3px 0 #857c99;cursor:default}
#appSh .alink{font-family:var(--hand);font-size:18px;text-align:center;margin:2px 0;user-select:all;word-break:break-all}
.icon.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,207,90,.45)}}
.devs{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:6px}
.devs .dev{position:static}
.ward{position:absolute;inset:0;z-index:9;background:rgba(10,8,24,.5);display:flex;align-items:flex-end}
.wsheet{width:100%;max-height:82%;overflow:auto;background:var(--paper);color:var(--ink);border-top:3px solid #000;border-radius:26px 26px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:10px;animation:sheet .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes sheet{from{transform:translateY(40%)}}
.wsheet>*{flex-shrink:0}
.whead{display:flex;align-items:center;gap:10px}.whead b{font-family:var(--hand);font-weight:400;font-size:22px;flex:1}
.wfruit{font-family:var(--hand);font-size:17px;background:#fff1c2;border:2px solid #000;border-radius:999px;padding:2px 12px}
.icon.wx{background:#fff;color:var(--ink);border-color:#000;width:36px;height:36px}
.wtabs{display:flex;gap:6px;overflow-x:auto}
.wtab{appearance:none;flex:none;border:2px solid #000;background:#fff;border-radius:999px;padding:4px 12px;font-family:var(--hand);font-size:15px;color:var(--ink);cursor:pointer}
.wtab.on{background:var(--gold)}
.wstage{background:radial-gradient(circle at 50% 70%,#fff3c4,#f3e9ff 70%);border:2.5px solid #000;border-radius:20px;display:flex;justify-content:center}
.wstage svg{width:116px;height:132px}
.wmsg{margin:0;min-height:1.4em;text-align:center;font-family:var(--hand);font-size:15px;color:#7a6fa0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.wit{appearance:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2.5px solid #000;background:#fff;border-radius:16px;padding:8px 4px 6px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 3px 0 #000}
.wit>svg{width:46px;height:40px}
.wit span svg{width:12px;height:12px}
.wit b{font-family:var(--hand);font-weight:400;font-size:13.5px;line-height:1.2;text-align:center;word-break:keep-all}
.wit span{font-size:12px;color:#7a6fa0;display:flex;align-items:center;gap:3px}
.wit.own span{color:#3f9e62}.wit.on{background:#fff1c2;box-shadow:0 3px 0 #000,0 0 0 3px var(--gold) inset}
.wit.no{opacity:.55}
.wit.shake{animation:wshake .3s}
@keyframes wshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.wit:focus-visible,.wtab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wobble{animation:wobble .5s ease-in-out}
@keyframes wobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.nbob{animation:nbob 1.6s ease-in-out infinite}
@keyframes nbob{50%{transform:translateY(-5px)}}
.stampin{transform-box:fill-box;transform-origin:center;animation:stampin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampin{0%{transform:scale(2.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}

.chip img{width:22px;height:22px;object-fit:contain}
.icon img{width:24px;height:24px;object-fit:contain}
.icon.wx img{width:16px;height:16px}
.wit img.ic{width:52px;height:52px;object-fit:contain}
.wit span img{width:13px;height:13px}
.fly img{width:22px;height:22px}
.bub{background:none;border:16px solid transparent;border-image:url(a/ui_bubble.webp) 40 fill / 16px stretch;box-shadow:none;border-radius:0;padding:0 4px}
.bub::after{width:34px;height:23px;bottom:-31px;background:url(a/ui_bubble_tail.webp) center top/contain no-repeat;border:0;transform:translateX(-50%)}
.zz{font-family:inherit}
.bub p{white-space:pre-line}
.promises{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-direction:column;gap:6px;max-width:min(270px,calc(100% - 32px));pointer-events:none}
.prom{background:rgba(255,250,240,.92);color:var(--ink);border:2.5px solid #000;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 #000;font-size:13px;line-height:1.35;word-break:keep-all}
.prom b{display:block;font-family:var(--hand);font-weight:400;font-size:14px;color:#8a5a33}
.doing{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:4;appearance:none;border:2.5px solid #000;background:#fffaf0;color:var(--ink);border-radius:999px;padding:5px 12px;font-family:var(--hand);font-size:14px;box-shadow:0 3px 0 #000;cursor:pointer}
.bsub{flex:1;font-size:12.5px;color:#7a6fa0;text-align:right}
.blist{display:flex;flex-direction:column;gap:10px}
.mis{position:relative;border:2.5px solid #000;border-radius:18px;background:#fff;padding:10px 12px 12px;box-shadow:0 3px 0 #000;display:flex;flex-direction:column;gap:5px}
.mis.done{background:#f3f8ea}
.mh{display:flex;align-items:center;gap:8px}.mh b{font-family:var(--hand);font-weight:400;font-size:16px;flex:1}
.face{width:38px;height:38px;border-radius:50%;border:2px solid #000;background-size:76px 101px;background-position:-19px -22px;background-color:#fff3df;flex:none}
.rw{display:flex;align-items:center;gap:3px;font-family:var(--hand);font-size:14px}.rw img{width:16px;height:16px}
.mt{margin:0;font-family:var(--hand);font-size:17.5px;line-height:1.38;word-break:keep-all}
.mw{margin:0;font-size:13px;line-height:1.45;color:#5d5478;word-break:keep-all}
.mb{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}.mb .opt{flex:1 1 0}.mb .opt[disabled]{opacity:.75;cursor:default}
.nth{font-family:var(--read);font-size:12px;color:#8a5a33;background:#fff1c2;border:1.5px solid #000;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:2px}
.mb .share{flex:0 0 auto}
.mok{margin:0;font-family:var(--hand);font-size:15px;color:#3f7d4a}
.pbtn img{width:30px;height:24px;object-fit:contain}
.pscene{width:100%;height:auto;border:2.5px solid #000;border-radius:16px;display:block}
.oil{display:flex;align-items:center;gap:8px;margin:2px 2px 0;font-size:12.5px;color:#5d5478}.oil i{display:flex;gap:3px}.oil b{width:12px;height:16px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;border:1.6px solid #000;background:#ffcf5a}.oil b.u{background:#e8e0cf}.oil b.x{display:none}.oil em{font-style:normal;font-family:var(--hand);font-size:15px;color:var(--ink)}
.bsh{margin:6px 2px 0;font-family:var(--hand);font-size:15px;color:#5d5478}
.rwait{border:2px dashed #b8ad95;border-radius:14px;padding:6px 10px;background:#fffaf0}.rwait summary{font-family:var(--hand);font-size:15px;cursor:pointer;color:#5d5478}.rwait[open]{display:flex;flex-direction:column;gap:8px}
.bhi{width:26px;height:26px;align-self:center;margin-right:-2px}
.heart{position:absolute;z-index:8;width:18px;height:16px;margin:-8px 0 0 -9px;pointer-events:none;animation:heart .9s ease-out forwards;background:radial-gradient(circle at 30% 35%,#ff7a90 0 38%,transparent 40%),radial-gradient(circle at 70% 35%,#ff7a90 0 38%,transparent 40%),conic-gradient(from 225deg at 50% 92%,#ff7a90 0 90deg,transparent 0);}
@keyframes heart{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-34px) scale(1.1);opacity:0}}
.bh{margin:8px 2px 0;font-family:var(--hand);font-weight:400;font-size:18px;display:flex;align-items:baseline;gap:8px}.bh small{font-family:var(--read);font-size:12.5px;color:#7a6fa0}
.mis.rid .mb .opt[disabled]{opacity:.55}
.moons{display:flex;gap:6px;flex-wrap:wrap}.moon{appearance:none;border:2px solid #000;border-radius:12px;background:#fff;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--hand);font-size:13px;color:var(--ink);cursor:pointer;flex:1 1 0;min-width:62px}
.mis.book{gap:8px}.bkh{appearance:none;border:0;background:none;padding:0;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;color:var(--ink)}.bkh img{width:38px;height:54px;object-fit:cover;border:1.5px solid #000;border-radius:4px}.bkh span{flex:1;display:flex;flex-direction:column}.bkh b{font-family:var(--hand);font-weight:400;font-size:16.5px}.bkh small{font-size:12.5px;color:#7a6fa0}.bkh i{font-style:normal;font-family:var(--hand);font-size:14px;color:#5b3fd0}
.mis.book .mis{box-shadow:none;border-width:2px}.bkl{text-align:right}
.mis.pet.lock{opacity:.6}.mis.pet.lock .face{filter:grayscale(1) brightness(.5)}
.shake{animation:shake .35s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.dwn{position:absolute;inset:0;z-index:30;background:#0e0b1f;color:var(--paper);display:grid;place-items:center;text-align:center}.dwn b{font-family:var(--hand);font-weight:400;font-size:64px;display:block}.dwn p{margin:6px 0 22px;font-size:16px;color:#c9c2e8}
.mstamp{position:absolute;right:10px;bottom:8px;width:52px;height:52px;transform:rotate(-10deg);animation:stampin .45s cubic-bezier(.3,1.6,.5,1) both}
.mempty{text-align:center;color:#7a6fa0;margin:10px 0}
#boardInner{transform-box:fill-box;transform-origin:50% 100%}
#cast image,#castBack image,#plantG image{pointer-events:none}
.clr{position:absolute;inset:0;z-index:12;background:rgba(10,8,24,.62);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;animation:fadein .25s}
.clr.out{opacity:0;transition:opacity .3s}
.ccard{width:min(330px,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:var(--paper);color:var(--ink);border:3px solid #000;border-radius:26px;box-shadow:0 5px 0 #000;padding:16px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;animation:cpop .5s cubic-bezier(.2,1.5,.4,1)}
.ctag{font-family:var(--hand);font-size:15px;background:var(--gold);border:2px solid #000;border-radius:999px;padding:2px 14px}
.cpic{position:relative;width:160px;height:150px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 50% 62%,#fff3c4,rgba(255,243,196,0) 66%)}
.csp{height:150px;width:auto;animation:chop .8s ease-in-out .3s 2}
.csp.tree{height:140px}
.cst{position:absolute;right:-22px;top:0;width:72px;height:72px;transform:rotate(-8deg);animation:stampin .45s cubic-bezier(.3,1.6,.5,1) .4s both}
.ctit{font-family:var(--hand);font-weight:400;font-size:22px;line-height:1.3;word-break:keep-all}

@keyframes cpop{from{transform:scale(.6);opacity:0}}
@keyframes chop{50%{transform:translateY(-10px)}}
@keyframes fadein{from{opacity:0}}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bst{border:2.5px solid #000;border-radius:14px;background:#fff;padding:5px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 2px 0 #000}
.bst b{font-family:var(--hand);font-weight:400;font-size:18px}.bst span{font-size:11.5px;color:#7a6fa0}
.lv{font-family:var(--hand);font-size:14px;background:#fff1c2;border:2px solid #000;border-radius:999px;padding:1px 9px}
.xpbar{height:10px;border:2px solid #000;border-radius:999px;background:#f1ecf9;overflow:hidden}.xpbar i{display:block;height:100%;background:var(--gold)}
.cards{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.card{border:2px solid #000;border-radius:12px;background:#fffaf0;padding:7px 10px;font-size:13.5px}
.card summary{font-family:var(--hand);font-size:15px;cursor:pointer}

.card.lock{background:#eee9f5;color:#8b82a8;border-style:dashed}

.rrow b{font-family:var(--hand);font-weight:400;font-size:17px;text-align:right}
.rbar{height:16px;border:2px solid #000;border-radius:999px;background:#f1ecf9;overflow:hidden}.rbar i{display:block;height:100%;background:#b9b0d6;transition:width .5s}

<script>
// ---------- who comes, and what they ask ----------
// Socrates answers a question with a question. Nietzsche pushes. Diogenes is blunt. Epicurus keeps it simple.
const PH={
  soc:{nm:'꼬마 소크라테스',robe:'#fbf6ea',trim:'#c9b994',
    hi:'여기 앉아도 돼?',who:'나? 묻는 걸 좋아하는 애야. 아테네에서 왔어.',
    Q:[
      {q:'너 행복해지고 싶지?',o:[['당연하지','그럼 행복이 뭔지는 알아? 모르는 걸 어떻게 찾아가?'],['잘 모르겠어','좋아. 모른다는 걸 아는 데서 시작하는 거야. 나도 그거 하나는 알아.']]},
      {q:'오늘 한 일 중에 네가 고른 건 몇 개야?',o:[['거의 다','정말? 고른 거랑 그냥 흘러간 거, 구분할 수 있어?'],['몇 개 안 돼','그럼 나머지는 누가 고른 걸까?']]},
      {q:'용기 있는 사람은 겁이 없는 사람일까?',o:[['응','겁이 없으면 낭떠러지로도 뛰어들겠네. 그것도 용기야?'],['아닐걸','그럼 무서운데도 하는 거? 무서운 건 아무거나 하면 다 용기야?']]},
      {q:'남들이 다 맞다고 하면 맞는 걸까?',o:[['대체로 그렇지','아테네 사람들은 다 나보고 틀렸대. 그럼 내가 틀린 거야?'],['아니','그럼 넌 뭘 보고 맞다고 해?']]},
      {q:'돈이 많으면 잘 사는 걸까?',o:[['거의 그렇지','돈을 어디에 써야 할지 모르는 부자도 잘 사는 거야?'],['아니','그럼 다들 왜 그렇게 돈을 원할까?']]},
      {q:'모르는 걸 아는 척한 적 있어?',o:[['있지','모른다고 하면 뭐가 그렇게 무서웠어?'],['거의 없어','정말? 오늘 들은 말 중에 진짜 아는 건 몇 개야?']]},
      {q:'요즘 이건 꼭 맞다고 믿는 거 하나 있어?',o:[['있어','누가 반대하면, 왜 맞는지 세 가지 댈 수 있어?'],['딱히 없어','그럼 넌 뭘 기준으로 고르며 살아?']]},
      {q:'착하게 살면 손해 본다고 생각해?',o:[['좀 그렇지','돈을 잃는 거랑 내가 나쁜 사람이 되는 거, 뭐가 더 큰 손해야?'],['아니','왜? 남들 말 말고 네 이유로.']]},
      {q:'죽는 게 무서워?',o:[['응','죽음이 나쁜 건지 아는 사람, 본 적 있어? 모르는 걸 무서워하는 거네.'],['별로','다들 무서워하는데, 넌 왜 안 무서워?']]},
      {q:'공부는 왜 하는 걸까?',o:[['시험 때문에','시험이 끝나면? 그다음에도 알고 싶은 게 남아 있어?'],['알고 싶어서','좋아. 그 마음이 철학이야. 철학은 원래 지혜를 사랑한다는 뜻이거든.']]},
      {q:'칭찬이랑 아첨은 뭐가 달라?',o:[['진심이냐 아니냐','그 진심을 어떻게 알아? 듣기 좋은 말은 다 진심 같거든.'],['모르겠어','나는 이렇게 봐. 듣는 사람을 더 좋게 만들면 칭찬, 기분만 좋게 하면 아첨.']]},
      {q:'오늘 들은 말 중에 진짜 맞는지 확인한 거 있어?',o:[['있어','멋지다. 어떻게 확인했어? 그 방법이 너의 무기야.'],['없어','그럼 하나만 골라서 왜 맞는지 물어봐. 그게 내가 매일 한 일이야.']]},
      {q:'넌 누구한테 배우고 싶어?',o:[['잘 아는 사람','잘 아는지 어떻게 알아? 말 잘하는 거랑 아는 건 달라.'],['아무한테나','좋아. 나는 구두 고치는 사람한테도 물어보고 배웠어.']]},
      {q:'정의가 뭐라고 생각해?',o:[['공평한 거','똑같이 나누면 늘 공평해? 아기랑 어른한테 밥을 똑같이 줘?'],['착하게 사는 거','그럼 착한 건 또 뭔데? 거봐, 질문이 끝이 없지.']]},
      {q:'말싸움에서 이기는 게 중요해, 맞는 게 중요해?',o:[['이기는 거','이겼는데 틀렸으면, 넌 뭘 얻은 거야?'],['맞는 거','그럼 지는 걸 겁내지 마. 지면서 맞는 걸 배우기도 하니까.']]},
      {q:'친구가 나쁜 짓을 하면 어떻게 해?',o:[['모른 척해','그 친구가 망가지는 걸 보고만 있는 게 친구야?'],['말해 줘','어떻게 말할 거야? 혼내는 것보다 물어보는 게 덜 아파.']]},
      {q:'너를 화나게 하는 건 상대야, 너야?',o:[['상대지','같은 말에도 안 화나는 날이 있지? 그날은 뭐가 달랐어?'],['나일지도','알아챘네. 그럼 고칠 수 있는 것도 너야.']]},
      {q:"하루에 '왜?'라고 몇 번 물어?",o:[['거의 안 해','어릴 땐 하루에 백 번은 물었을걸. 그 질문들, 어디서 잃어버렸을까?'],['자주 해',"좋아. 그럼 그 '왜' 하나 나한테도 던져 봐."]]},
      {q:'거짓말이 필요한 순간도 있을까?',o:[['있지','그게 정말 상대를 위한 건지, 내가 편하려는 건지 따져 봤어?'],['없어','살인자가 친구 어디 있냐고 물어도? 우리 학파 칸트 형은 그래도 안 된다고 했어.']]},
      {q:'겸손한 사람이랑 자신 없는 사람은 같을까?',o:[['비슷하지','자신 없는 사람은 묻지도 않아. 겸손한 사람은 모르니까 계속 묻지.'],['다르지','어떻게 달라? 네 말로 한번 말해 봐.']]},
      {q:'부모님 말씀은 늘 옳을까?',o:[['대체로','대체로면, 아닐 때도 있다는 거네. 그건 어떻게 알아봐?'],['아닐 때도 있어','그럼 사랑하면서도 반대할 수 있어? 그게 어른이야.']]},
      {q:'좋은 사람 되는 거, 배워서 될까?',o:[['응','그럼 누가 가르쳐? 나는 그런 선생을 평생 찾았는데.'],['타고나는 거야','그럼 나쁜 사람은 영영 못 고치겠네. 정말 그럴까?']]},
      {q:'나쁜 짓 하고도 행복한 사람이 있을까?',o:[['있을걸','겉으로는 그렇겠지. 밤에 혼자 있을 때도 행복할까?'],['없을걸','나도 그렇게 봐. 나쁜 짓은 남보다 먼저 자기 영혼을 망쳐.']]},
      {q:'넌 뭘 할 때 시간 가는 줄 몰라?',o:[['놀 때','좋아. 그 놀이가 너를 더 좋은 사람으로 만들어?'],['뭔가 만들 때','좋다. 그게 네가 제일 잘하는 쪽일지도 몰라.']]},
      {q:'무서운 걸 피하는 게 똑똑한 거야?',o:[['응','다 피하면 지켜야 할 건 누가 지켜? 나는 전쟁터에서도 도망 안 치고 걸어서 물러났어.'],['아니','그럼 피할 무서움이랑 맞설 무서움, 어떻게 구분해?']]},
      {q:'아무도 모르게 나쁜 짓 할 기회가 생기면?',o:[['할지도','솔직하네. 그럼 넌 남이 볼 때만 착한 거야?'],['안 해','왜? 들킬 일도 없는데. 그 이유가 진짜 너야.']]},
      {q:'네가 제일 아끼는 건 뭐야?',o:[['사람','그 사람한테 그걸 말해 본 적 있어?'],['물건','그게 없어지면 너도 없어져?']]},
      {q:'질문을 많이 하면 사람들이 싫어할까?',o:[['싫어하더라','맞아. 그래서 나는 사형까지 받았어. 그래도 멈추진 않았지.'],['좋아하더라','운이 좋네. 그런 친구는 꼭 붙잡아.']]},

      {q:'갖고 싶은 게 생기면 바로 사?',o:[['응','사고 사흘 뒤에도 기쁠까? 그걸 기준으로 해 봐.'],['좀 참아','좋아. 원하는 걸 하나 줄이면 그만큼 부자가 돼.']]},

      {q:'좋아하는 사람이랑 매일 밥 먹을 수 있다면?',o:[['좋지','그럼 넌 거의 다 가진 거야. 나는 우정을 제일 큰 행복으로 꼽았어.'],['부담스러워','매일은 아니어도 돼. 자주면 돼.']]},

const MIS={
  soc:[{t:'고민 중인 결정 하나에 "왜?"를 세 번 연달아 물어보기',why:'소크라테스는 묻고 또 물어서, 처음 댄 이유 밑에 있는 진짜 이유를 찾게 했어요. 진짜 이유를 알면 결정이 쉬워져요.',ok:'진짜 이유가 나왔어? 그럼 고르기가 한결 쉬울 거야.'},
       {t:'회의나 수업에서 모르는 걸 넘기지 말고 한 번 물어보기',why:'델포이 신탁이 그를 가장 지혜롭다고 하자, 소크라테스는 "나는 모른다는 걸 알 뿐"이라고 답했어요. 모른다고 인정해야 배울 수 있어요.',ok:'물어보니 별거 아니었지? 다른 사람도 궁금했을 거야.'},

       {t:'누가 한 말에 반박하기 전에, "그게 무슨 뜻이야?" 먼저 물어보기',why:'소크라테스는 늘 "용기가 뭐야?", "정의가 뭐야?"부터 물었어요. 뜻부터 맞추면 엉뚱한 걸로 싸우지 않아요.',ok:'뜻을 물어보니 생각보다 같은 얘기였지?'},
       {t:'내가 확신하는 생각 하나에, 반대편 이유 세 개 대 보기',why:'소크라테스는 자기 생각도 반박에 내놓고 버티는지 봤어요. 반박을 견딘 생각만 진짜 내 생각이 돼요.',ok:'세 개 다 댔는데도 남았으면, 그 생각은 단단한 거야.'},
       {t:'자기 전에 오늘 내가 틀렸던 것 하나 떠올리기',why:'소크라테스는 자기가 남보다 나은 점은 모른다는 걸 안다는 것 하나뿐이라고 했어요. 틀린 걸 알아채는 게 그 시작이에요.',ok:'틀린 걸 찾은 사람이 오늘 제일 많이 배운 사람이야.'}],
  nie:[{t:'이어폰 없이 20분 걷기',why:'"정말 위대한 생각은 모두 걷는 중에 떠오른다." 니체는 매일 몇 시간씩 걸으며 책을 썼어요.',min:20,ok:'봐. 다리가 움직이면 생각도 움직여.'},
       {t:'제일 미뤄 둔 일, 딱 10분만 하기',why:'"왜 사는지 아는 사람은 거의 어떤 어려움도 견딘다." 니체의 말이에요. 왜 하는지 떠올리면 10분은 버틸 수 있어요.',min:10,ok:'10분이면 시작한 거야. 시작한 일은 미룬 일이 아니야.'},

       {t:'자기 전에 "오늘을 똑같이 무한히 반복해도 좋을까?" 물어보기',why:'니체의 영원회귀예요. 지금 삶이 영원히 그대로 되풀이된다면 기꺼이 받아들이겠냐고 물었어요.',ok:'아니라면 내일 하나만 바꿔 보자. 그게 시작이야.'},
       {t:'엘리베이터 대신 계단으로 가기',why:'"나를 죽이지 못하는 것은 나를 더 강하게 만든다." 니체는 버거운 걸 피하지 말고 힘으로 바꾸라고 했어요.',ok:'숨차지? 그게 힘이 붙는 소리야.'},

  dio:[{t:'안 쓰는 물건 하나 버리거나 나눠 주기',why:'디오게네스는 아이가 손으로 물을 떠 마시는 걸 보고, 하나 남은 컵마저 버렸어요.',ok:'가벼워졌지? 나도 그랬어.'},
       {t:'오늘 사고 싶은 것 하나, 사지 않기',why:'알렉산드로스 대왕이 소원을 묻자 디오게네스는 "햇빛이나 가리지 마"라고만 했어요.',ok:'없어도 살 만하지?'},
       {t:'눈치 보느라 못 한 말, 하나만 정중하게 하기',why:'디오게네스는 사람에게 가장 아름다운 것으로 거침없이 말하는 용기, 파레시아를 꼽았어요.',ok:'하늘 안 무너졌지?'},
       {t:'오늘 하루 배달 앱 열지 않기',why:'"신은 아무것도 필요 없고, 신에 가까운 사람은 필요한 게 적다." 디오게네스의 말이에요. 없이 지내 보면 정말 필요한 게 보여요.',ok:'하루 버텼네. 생각보다 할 만하지?'},

function say(k,text,opts,cb){closeBub();const a=actors[k];talking=k;const el=document.createElement('div');el.className='bub';el.setAttribute('role','dialog');
  el.innerHTML=`<span class="who">${nameOf(k)}</span><p></p>${opts?`<div class="opts">${opts.map((o,i)=>`<button class="opt${i?' alt':''}" type="button" data-i="${i}">${o}</button>`).join('')}</div>`:'<i class="more" aria-hidden="true"></i>'}`;
  $('app').appendChild(el);
  // type the line out a little, so it feels spoken
  const p=el.querySelector('p');p.textContent=text;el.style.width=(el.offsetWidth+1)+'px';posBub(el,a);let i=0,tm=null;if(a){a.talk=1;clearTimeout(a.ht);a.held=0;}
  const done=()=>{if(a){a.talk=0;setFrame(k,'basic');}};
  const tick=()=>{p.textContent=text.slice(0,i);if(i%3===0)sfx.talk(k);if(a&&i%4===0)setFrame(k,(i/4)%2?'basic':'talk');if(i<text.length){i+=1;tm=setTimeout(tick,22);}else done();};tick();
  const finish=()=>{if(i<text.length){clearTimeout(tm);i=text.length;p.textContent=text;done();return false;}return true;};
  const me={opts:!!opts,hasCb:!!cb,advance:()=>{if(!finish())return false;closeBub();cb&&cb(-1);return true;}};pend=me;
  el.addEventListener('click',ev=>{ev.stopPropagation();const b=ev.target.closest('.opt');
    if(b){finish();ac();sfx.boop();buzz(10);const n=+b.dataset.i;closeBub();cb&&cb(n);return;}
    if(!opts)me.advance();else finish();});
  posBub(el,a);requestAnimationFrame(()=>posBub(el,a));
  if(!opts){el.style.cursor='pointer';}}
function posBub(el,a){const r=a.g.getBoundingClientRect(),W=$('app').clientWidth,bw=el.offsetWidth,bh=el.offsetHeight;const cx=r.left+r.width/2;
  let left=Math.max(16,Math.min(W-16-bw,cx-bw/2));el.style.left=left+'px';el.style.top=Math.max(70,r.top-bh-18)+'px';el.style.setProperty('--tail',Math.max(22,Math.min(bw-22,cx-left))+'px');}
function closeBub(){document.querySelectorAll('.bub').forEach(b=>b.remove());const a=talking&&actors[talking];if(a&&a.talk){a.talk=0;setFrame(talking,'basic');}talking=null;pend=null;}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('app').appendChild(el);setTimeout(()=>el.remove(),2500);}
function fly(fromRect,chipId,then){const c=$(chipId).getBoundingClientRect(),d=document.createElement('div');d.className='fly';d.innerHTML=$(chipId).querySelector('img').outerHTML;
  const x=fromRect.left+fromRect.width/2-11,y=fromRect.top+10;d.style.left=x+'px';d.style.top=y+'px';$('app').appendChild(d);
  requestAnimationFrame(()=>{d.style.transform=`translate(${c.left+8-x}px,${c.top+4-y}px) scale(.9)`;});setTimeout(()=>{d.remove();then&&then();},720);}

// ---------- the loop ----------
function present(){return KIDS.filter(k=>S.met[k]&&actors[k]&&actors[k].mode!=='barrel');}
function left(k){return PER_DAY-S.cnt[k];}
function nextQ(k){const P=PH[k],done=S.asked[k];const pool=P.Q.map((q,i)=>i).filter(i=>!done.includes(i));if(!pool.length){S.asked[k]=[];S.round=S.round||{};S.round[k]=(S.round[k]||0)+1;save();return 0;}return pool[0];}
function tapKid(k){if(busy)return;ac();rollDay();const a=actors[k];if(!a)return;if(a.walking){if(!a.idle)return;a.cancel=1;}hop(k);sfx.boop();buzz(12);
  if(pend){if(pend.opts)return;const mine=talking===k,had=pend.hasCb;if(!pend.advance()||had||!mine)return;}
  if(k==='owl')return tapOwl();
  if(k==='ecl')return tapEcl();
  if(a.mode==='barrel')return tapBarrel();
  if(a.mode==='shadow'){say(k,['(그림자가 콧수염을 만지작거린다)','…나무가 조금만 더 자라면.'][(S.given)%2]);return;}
  if(S.intro<2){if(k==='soc'&&S.intro===1)introAsk();return;}
  if(left(k)<=0){const m=S.mis[k],M=misOf(k);
    if(m&&m.st==='new'){say(k,'게시판에 오늘 미션 붙여 놨어.',null,()=>wiggleBoard());return;}
    if(m&&m.st==='doing'){say(k,`"${M.t}" 하고 있지?`);return;}
    if(window.GL&&!S.talkSeen){S.talkSeen=1;save();say(k,'오늘 내 질문은 끝. 대신 광장에 가 봐. 다른 사람들 대답이 재밌어.',['광장 가기','나중에'],n=>{if(n===0){openBoard();bt='talk';drawBoard();}});return;}
    const I=PH[k].idle;say(k,I[(Date.now()/1000|0)%I.length]);return;}
  const qi=nextQ(k),Q=PH[k].Q[qi],pk=(S.picks||{})[k+qi],again=(S.round||{})[k];
  const lead=again?(pk!=null&&Q.o[pk]?`저번엔 "${Q.o[pk][0]}"라고 했어. 지금은?\n`:'전에도 물었던 건데, 지금은 어때?\n'):'';
  say(k,lead+Q.q,Q.o.map(o=>o[0]),n=>{S.picks=S.picks||{};S.picks[k+qi]=n;S.asked[k].push(qi);S.cnt[k]++;S.xp[k]++;S.qlog=S.qlog||{};S.qlog[today()]=1;save();
    setTimeout(()=>say(k,Q.o[n][1],null,()=>{giveDrop(k);
      const rest=()=>{if(left(k)<=0){if(newMis(k)){refreshNote(k);setTimeout(()=>{if(!pend&&!clrOn())say(k,'질문은 오늘 여기까지. 대신 게시판에 미션 하나 붙여 놨어.',null,()=>wiggleBoard());},1300);}else setTimeout(()=>sleepIfDone(k),900);}};
      if(!levelUp(k,rest))rest();}),180);});}
function giveDrop(k){sfx.drop();buzz([10,30,10]);fly(actors[k].g.getBoundingClientRect(),'dropChip',()=>{S.drops++;save();hud();bump('dropChip');paintPlant(false);
  if(S.drops===1&&S.given===0)setTimeout(()=>say('soc','그 물방울, 화분에 줘 봐.'),400);});}
function sleepIfDone(k){const a=actors[k];if(left(k)<=0&&!talking)place(k,'sleep',a.x,a.y);}
let busy=false;
function water(){if(busy||S.intro<2)return;if(pend&&pend.opts)return;if(pend)closeBub();ac();
  if(S.drops<=0){const ks=present();say(ks[(Date.now()/1000|0)%ks.length]||'soc','물방울은 질문에 답하면 생겨. 나를 눌러 봐.');return;}
  busy=true;const before=stageOf(S.given);S.drops--;S.given++;save();hud();sfx.water();buzz([15,40,15]);
  const fx=$('fx');// the can stands left of the pot and pours onto the rim, under the leaves (spout sits 41 right, 7 down of its centre)
  fx.innerHTML=`<g transform="translate(${POT.x-62} ${POT.y-60}) rotate(24)"><image href="${A('can')}" x="-40" y="-30" width="80" height="60"/></g><g transform="translate(${POT.x-21} ${POT.y-53})"><image class="drip" href="${A('fx_water')}" x="-14" y="0" width="28" height="44"/></g>`;
  setTimeout(()=>{fx.innerHTML='';const after=stageOf(S.given);paintPlant(true);
    // every watering drops one golden fruit
    const pr=$('plantG').getBoundingClientRect();fly({left:pr.left,width:pr.width,top:pr.top+pr.height*.35},'fruitChip',()=>{sfx.fruit();S.fruit++;save();hud();bump('fruitChip');
      if(S.fruit===1&&!S.wardSeen)setTimeout(()=>{if(!pend)say('soc','열매다. 그걸로 나 좀 꾸며 줄래? 위에 옷걸이.');},500);});
    if(after>before){sfx.stage();buzz([30,40,30,40,90]);burst();toast(STAGE_NM[after]);checkVisitors();}
    busy=false;if(S.given>=HARVEST)setTimeout(harvest,900);else if(after===5&&before===5)toast(`다 익기까지 물 ${HARVEST-S.given}번`);},700);}
function burst(){const fx=$('fx');let s='';for(let i=0;i<14;i++){const a=i/14*Math.PI*2;s+=`<image class="spark" href="${A('fx_spark')}" x="${POT.x-7}" y="${POT.y-97}" width="14" height="14" style="--dx:${Math.cos(a)*60}px;--dy:${Math.sin(a)*60}px"/>`;}fx.innerHTML=s;setTimeout(()=>{fx.innerHTML='';},950);}

function reward(k,fromRect){sfx.stamp();buzz([40,30,60]);
  for(let i=0;i<MIS_FRUIT;i++)setTimeout(()=>fly(fromRect,'fruitChip',()=>{sfx.fruit();S.fruit++;save();hud();bump('fruitChip');}),300+i*170);
  for(let i=0;i<MIS_DROP;i++)setTimeout(()=>fly(fromRect,'dropChip',()=>{S.drops++;save();hud();bump('dropChip');paintPlant(false);}),900+i*170);}
function paintFence(){}
// ---------- the mission board ----------
// each morning every philosopher you've met pins one mission; it stays until it's done or passed
function postMissions(){let n=0;KIDS.forEach(k=>{if(!S.met[k]||!MIS[k])return;const m=S.mis[k];
  if(!m||((m.st==='done'||m.st==='skip')&&m.day!==today())){S.mis[k]={i:S.misI[k]%MIS[k].length,st:'new',day:today()};S.misI[k]++;n++;}});
  if(n)save();paintBoard();present().forEach(refreshNote);}
const boardCount=()=>KIDS.filter(k=>S.mis[k]&&S.mis[k].st==='new').length;
const doingCount=()=>KIDS.filter(k=>S.mis[k]&&S.mis[k].st==='doing').length;
function paintBoard(){const g=$('boardG');if(!g)return;const n=boardCount(),notes=KIDS.filter(k=>S.mis[k]&&S.mis[k].st!=='skip'&&!(S.mis[k].st==='done'&&S.mis[k].day!==today()));
  let p='';notes.slice(0,4).forEach((k,i)=>{const done=S.mis[k].st==='done';p+=`<g transform="translate(${8+i*12} ${474+(i%2)*5}) rotate(${i%2?5:-6})"><rect x="0" y="0" width="12" height="15" fill="${done?'#e8f3d8':'#fffaf0'}" stroke="#000" stroke-width="1.6"/><path d="M3 5 h6 M3 9 h5" stroke="#9a8a6a" stroke-width="1.2"/><circle cx="6" cy="1" r="1.8" fill="#d6334a" stroke="#000" stroke-width="1"/></g>`;});
  g.innerHTML=`<g transform="translate(116 -22)"><rect x="-8" y="456" width="72" height="84" fill="transparent"/><g id="boardInner"><path d="M6 486 v46 M52 486 v46" stroke="#000" stroke-width="7" stroke-linecap="round"/><path d="M6 486 v46 M52 486 v46" stroke="#7a5236" stroke-width="3.6" stroke-linecap="round"/>
    <rect x="-2" y="466" width="62" height="36" rx="3" fill="#a8743f" stroke="#000" stroke-width="2.6"/>${p}
    ${n?`<circle cx="58" cy="466" r="9" fill="#d6334a" stroke="#000" stroke-width="2"/><text x="58" y="471" text-anchor="middle" font-family="Jua" font-size="13" fill="#fff">${n}</text>`:''}</g></g>`;
  const pill=$('doingPill');if(pill){const d=doingCount();pill.hidden=!d;pill.textContent=`진행 중인 미션 ${d}`;}}
function wiggleBoard(){const b=$('boardInner');if(!b)return;b.classList.remove('wobble');void b.getBoundingClientRect();b.classList.add('wobble');}
const faceCSS=k=>`background-image:url(${A(k+'_basic')})`;
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
let boardTick=null;
function openBoard(){if(S.intro<2)return;closeBub();ac();sfx.boop();postMissions();bt='mis';$('board').hidden=false;drawBoard();clearInterval(boardTick);boardTick=setInterval(()=>{if(!$('board').hidden&&KIDS.some(k=>S.mis[k]&&S.mis[k].st==='doing'&&S.mis[k].start))drawBoard();},1000);}
function closeBoard(){$('board').hidden=true;clearInterval(boardTick);sfx.boop();paintBoard();present().forEach(refreshNote);}
let bt='mis';
function drawSchool(){const k=S.school;
  if(!k)return `<div class="mis"><p class="mt">내 학파</p><p class="mw">이성파, 쾌락파, 평정파, 실존파. 질문 네 개면 내가 어디인지 알 수 있어요.</p><div class="mb"><button class="opt" type="button" id="sqz">학파 찾기</button></div></div>`;
  return `<div class="mis"><div class="mh"><i class="face" style="${faceCSS(k)}"></i><b>${SCHOOL[k].nm}</b></div><p class="mt">"${SCHOOL[k].line}"</p><p class="mw">같은 학파: ${SCHOOL[k].mem}</p></div>`;}
function drawStory(){const ks=KIDS.filter(k=>S.met[k]);if(!ks.length)return '<p class="mempty">아직 만난 철학자가 없어요.</p>';
  return ks.map(k=>{const l=S.lv[k],x=S.xp[k],lo=LV[l-1],hi=LV[l];const pct=hi==null?100:Math.round((x-lo)/(hi-lo)*100);
    return `<div class="mis"><div class="mh"><i class="face" style="${faceCSS(k)}"></i><b>${short(k)}</b><span class="lv">${l}단계</span></div>
      <div class="xpbar"><i style="width:${pct}%"></i></div><p class="mw">${hi==null?'가장 높은 단계예요':`다음 단계까지 ${hi-x} · 대답하면 1, 미션은 3`}</p>
      <div class="cards">${CARD[k].map((c,i)=>l>=i+2?`<details class="card"><summary>${c[0]}</summary><p>${c[1]}</p></details>`:`<div class="card lock">${i+2}단계에 열리는 이야기</div>`).join('')}</div></div>`;}).join('');}
function drawRace(){const w=weekSum(0),lw=weekSum(1),sd=sameDaySum(),mx=Math.max(w,lw,1);
  const st=lw===0?'지난주 기록이 없어요. 이번 주의 내가 다음 주의 상대가 돼요.':w>lw?'지난주의 나를 넘었어요.':`같은 요일까지 지난주엔 ${sd}개 했어요. ${lw-w+1}개 더 하면 지난주를 넘어요.`;
  return `<div class="mis"><p class="mt">지난주의 나와 겨루기</p>
    <div class="rrow"><span>지난주</span><div class="rbar"><i style="width:${lw/mx*100}%"></i></div><b>${lw}</b></div>
    <div class="rrow me"><span>이번 주</span><div class="rbar"><i style="width:${w/mx*100}%"></i></div><b>${w}</b></div>
    <p class="mw">${st}</p><p class="mw">최고 기록 · 한 주 ${S.best.week}개 · 연속 ${S.best.streak}일</p></div>`;}
function drawBoard(msg){const ks=KIDS.filter(k=>S.mis[k]&&S.mis[k].st!=='skip'&&MIS[k]);
  $('bStats').innerHTML=`<div class="bst"><b>${streak()}일</b><span>연속</span></div><div class="bst"><b>${weekSum(0)}개</b><span>이번 주 미션</span></div><div class="bst"><b>${S.trees}그루</b><span>키운 나무</span></div>`;
  $('bTabs').innerHTML=[['mis','미션'],['talk','광장']].concat(window.GL?[['league','리그']]:[]).concat([['story','기록']]).map(([id,t])=>`<button class="wtab${bt===id?' on':''}" type="button" data-bt="${id}">${t}</button>`).join('');
  document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{bt=b.dataset.bt;sfx.boop();drawBoard();});
  if(bt==='league'&&window.GL){$('bMsg').textContent=msg||'';GL.render($('bList'));return;}
  if(bt==='talk'){$('bMsg').textContent=msg||'';if(window.GL)GL.renderTalk($('bList'));else{const [k,q]=talkQ();$('bList').innerHTML=`<div class="mis"><div class="tq"><i class="face" style="${faceCSS(k)}"></i><p>${q}</p></div>${philAnswer()}<p class="mw">다른 사람들의 답은 정원 웹과 앱에서 보여요.</p></div>`;}return;}
  if(bt!=='mis'){$('bList').innerHTML=drawSchool()+drawRace()+drawStory()+drawPets();$('bMsg').textContent=msg||'';const sq=$('bList').querySelector('#sqz');if(sq)sq.onclick=()=>{sfx.boop();closeBoard();sortQuiz(()=>{openBoard();bt='story';drawBoard();});};return;}
  const done=KIDS.reduce((n,k)=>n+(S.misDone[k]||0),0);
  $('bSub').textContent=done?`지금까지 해낸 미션 ${done}개`:'철학자들이 매일 아침 하나씩 붙여요';
  $('bList').innerHTML=ks.length?ks.map(k=>{const m=S.mis[k],M=MIS[k][m.i];let btn='';
    if(m.st==='new')btn=`<button class="opt" type="button" data-acc="${k}">할게요</button><button class="opt alt" type="button" data-skip="${k}">다음에</button>`;
    else if(m.st==='doing'&&M.min&&!m.start)btn=`<button class="opt" type="button" data-start="${k}">${M.min}분 시작</button>`;
    else if(m.st==='doing'&&M.min&&m.start){const leftMs=M.min*60000-(Date.now()-m.start);btn=leftMs>0?`<button class="opt alt" type="button" disabled>${mmss(leftMs)} 남았어요</button>`:`<button class="opt" type="button" data-fin="${k}">다 했어요</button>`;}
    else if(m.st==='doing')btn=`<button class="opt" type="button" data-fin="${k}">했어요</button>`;
    else btn=`<p class="mok">"${M.ok}"</p><button class="opt alt share" type="button" data-share="${k}">자랑하기</button>`;
    return `<div class="mis${m.st==='done'?' done':''}"><div class="mh"><i class="face" style="${faceCSS(k)}"></i><b>${PH[k].nm.replace('꼬마 ','')}${(()=>{const c=(S.misN[k+m.i]||0)+(m.st==='done'?0:1);return c>1?`<small class="nth">${c}번째</small>`:'';})()}</b><span class="rw"><img src="${A('fruit')}" alt="">${MIS_FRUIT}<img src="${A('drop')}" alt="">${MIS_DROP}</span></div>
      <p class="mt">${M.t}</p><p class="mw">${M.why}</p><div class="mb">${btn}</div>${m.st==='done'?`<img class="mstamp" src="${A('stamp')}" alt="해냄">`:''}</div>`;}).join(''):'<p class="mempty">아직 붙은 미션이 없어요. 철학자를 만나면 생겨요.</p>';
  $('bList').insertAdjacentHTML('beforeend',drawRiddles());
  $('bMsg').textContent=msg||'';
  const on=(sel,f)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{ac();f(b.dataset[Object.keys(b.dataset)[0]],b);});
  on('[data-acc]',k=>{S.mis[k].st='doing';save();sfx.boop();buzz(10);drawBoard();window.GL&&GL.ask();});
  on('[data-skip]',k=>{S.mis[k].st='skip';S.mis[k].day=today();save();sfx.boop();drawBoard('내일 다른 미션이 붙어요');});
  on('[data-start]',k=>{S.mis[k].start=Date.now();save();window.GL&&GL.timer(MIS[k][S.mis[k].i],S.mis[k].start);sfx.boop();buzz(10);drawBoard('시작했어요. 다녀와서 다시 열어 주세요');});
  on('[data-share]',k=>{sfx.boop();shareCard(k);});
  on('[data-fin]',(k,b)=>{const r=b.getBoundingClientRect();S.mis[k].st='done';S.mis[k].day=today();S.misDone[k]=(S.misDone[k]||0)+1;const mk=k+S.mis[k].i;S.misN[mk]=(S.misN[mk]||0)+1;S.xp[k]+=3;const d=today();S.log[d]=(S.log[d]||0)+1;save();drawBoard();reward(k,r);hop(k);setTimeout(()=>{if(!levelUp(k))whenFree(askApp,2500);checkRecords();},1500);window.GL&&GL.onMission();});
  wireRiddles();}

// ---------- riddles: things you can only answer by looking at the real world, or inside a book ----------
// world riddles open one a day from the second day; the answer is checked, or the phone checks the deed
const RID=[
  {id:'w1',k:'dio',kind:'ans',q:'지갑 좀 열어 봐. 천 원짜리 앞면에 있는 사람은 누구게?',a:['이황','퇴계','퇴계이황','이퇴계'],ok:'퇴계 이황. 조선의 철학자야. 너는 매일 철학자를 들고 다닌 거야.'},
  {id:'w2',k:'epi',kind:'sunset',q:'오늘은 해 지는 하늘을 보고 와. 해가 지고 나서 30분 안에 여기서 "봤어"를 눌러 줘.',ok:'잘했어. 하늘 한 번 보는 데는 돈이 안 들어. 그런데 그게 하루에서 제일 좋은 장면일 때가 많아.'},
  {id:'w3',k:'nie',kind:'ans',q:'100원짜리 동전에 있는 장군은 누구게?',a:['이순신','충무공','충무공이순신','이순신장군'],ok:'이순신. 배 열두 척으로 싸우기 전날 밤, "죽고자 하면 살고, 살고자 하면 죽는다"고 했어.'},
  {id:'w4',k:'dio',kind:'down',q:'폰을 엎어 두고 5분만 통 속에 들어가 있어 봐. 화면은 켜 둔 채로. 엎어져 있는 동안만 시간이 가.',ok:'나와 봐. 5분 동안 아무것도 안 봤는데 세상은 그대로지? 통 속이 생각보다 넓어.'},
  {id:'w5',k:'soc',kind:'ans',q:'오천 원짜리 앞면에 있는 사람은?',a:['이이','율곡','율곡이이','이율곡'],ok:'율곡 이이. 과거 시험에서 아홉 번이나 1등을 했대. 그래도 평생 공부했어.'},
  {id:'w6',k:'epi',kind:'moon',q:'창밖 하늘 좀 봐. 오늘 달은 어떤 모양이야?',ok:'맞아. 오늘 달을 본 사람, 생각보다 많지 않을걸.'},
  {id:'w7',k:'epi',kind:'ans',q:'오만 원짜리 속 사람은 오천 원짜리 속 사람과 무슨 사이일까?',a:['엄마','어머니','모자','모자지간'],inc:['엄마','어머니','모자'],ok:'신사임당은 율곡의 어머니야. 네 지갑 속에 엄마랑 아들이 같이 살고 있었어.'},
  {id:'w8',k:'nie',kind:'walk',q:'산책 가자. 여기서 "출발"을 누르고 300m 넘게 걸어간 다음, 거기서 "도착"을 눌러. 위치는 이 폰에만 남아.',ok:'봐, 걸으니까 머리가 달라졌지? 나는 걸으면서 떠오른 생각만 믿었어.'},
  {id:'w9',k:'dio',kind:'ans',q:'500원짜리 동전에 있는 새는?',a:['학','두루미','학두루미'],ok:'학. 플라톤이 사람을 "깃털 없이 두 발로 걷는 동물"이라고 하길래, 나는 털 뽑은 닭을 들고 가서 "여기 사람 있다" 했어.'},
  {id:'w10',k:'soc',kind:'sunrise',q:'내일 해 뜨는 걸 보러 갈래? 해가 뜨고 한 시간 안에 여기서 "봤어"를 눌러 줘.',ok:'아침 공기 좋지? 나는 마지막 말로 수탉 이야기를 했어. 아침을 알리는 그 새 말이야.'},
  {id:'w11',k:'soc',kind:'ans',q:'만 원짜리 뒷면 가운데, 고리 여러 개가 겹친 둥근 천문 기구 이름은?',a:['혼천의','혼의','선기옥형'],ok:'혼천의. 하늘이 어떻게 도는지 알고 싶어서 만든 기구야. 묻는 걸 멈추지 않은 사람들이 만들었지.'},
  {id:'w12',k:'epi',kind:'ans',q:'오천 원짜리 뒷면에 그려진 과일은?',a:['수박'],ok:'수박. 신사임당이 그린 그림이야. 엄마 그림이 아들 지폐 뒤에 들어가 있는 거지.'},
  {id:'w13',k:'soc',kind:'clock',h:15,m:30,q:'칸트는 매일 같은 시각에 산책해서, 동네 사람들이 그걸 보고 시계를 맞췄대. 오늘 오후 3시 30분에 여기 와서 "왔어"를 눌러 줘. 앞뒤 5분까지 봐줄게.',ok:'딱 맞췄네. 같은 시각에 같은 일을 하면, 그게 너를 붙잡아 주는 기둥이 돼.'},
  {id:'w14',k:'dio',kind:'ans',q:'오만 원짜리 뒷면, 달 아래 핀 꽃나무는?',a:['매화','매화나무','매화꽃'],ok:'매화. 추위가 끝나기도 전에 먼저 피는 꽃이야. 남들 다 필 때 기다리지 않는 거지.'},
  {id:'w15',k:'nie',kind:'walk',dist:1000,q:'아리스토텔레스는 걸으면서 가르쳐서 그 학파 이름이 "소요학파"래. 오늘은 1km. "출발"을 누르고 1km 넘게 간 곳에서 "도착"을 눌러.',ok:'1km! 걷는 동안 무슨 생각 했어? 그게 오늘 너한테 제일 중요한 생각일 거야.'},
  {id:'w16',k:'epi',kind:'ans',q:'50원짜리 동전에 있는 곡식은?',a:['벼','쌀','벼이삭','이삭'],ok:'벼. 밥 한 그릇이면 행복의 반은 채운 거야.'},
  {id:'w17',k:'dio',kind:'down',min:15,q:'폰도 책도 없는 빈방에 15분 앉아 있느니, 차라리 전기 충격 버튼을 누른 사람들이 있었대. 너는 버틸 수 있어? 폰을 엎어 두고 15분.',ok:'15분 버텼네. 버튼 누른 사람들보다 네가 세다.'},
  {id:'w18',k:'soc',kind:'ans',q:'만 원짜리 앞면, 세종대왕 뒤 그림에는 해와 달 말고 산봉우리가 몇 개 있을까?',a:['5','다섯','5개','다섯개','오'],ok:'다섯. 일월오봉도라는 그림이야. 해, 달, 다섯 봉우리. 왕이 앉는 자리 뒤에 늘 있던 그림이지.'},
  {id:'w19',k:'soc',kind:'ans',q:'"나는 생각한다, 그러므로 존재한다." 데카르트가 모든 걸 의심하다가 끝내 의심할 수 없던 건 뭐였을까? "나는 ○○한다"',a:['생각','생각한다'],ok:'생각. 의심하고 있다는 것 자체가 생각하고 있다는 증거니까. 의심이 바닥에서 발판이 된 거야.'},
  {id:'w20',k:'epi',kind:'noon',q:'해가 하늘에서 가장 높이 뜨는 순간이 있어. 그때 그림자가 제일 짧아져. 그 순간에 여기 와서 "봤어"를 눌러 줘.',ok:'에라토스테네스는 바로 이 순간 우물 속에 비친 해와 막대기 그림자로 지구 둘레를 쟀어. 2,000년도 더 전에.'},
  {id:'w21',k:'nie',kind:'ans',q:'"신은 ○○다." 내가 한 말 중에 제일 유명한 말이야. 빈칸은?',a:['죽었다','죽었어','죽었다고','죽음'],inc:['죽었'],ok:'죽었다. 이제 남이 정해 준 의미 말고, 네가 의미를 만들어야 한다는 뜻이었어.'},
  {id:'w22',k:'dio',kind:'ans',q:'서울 남산 아래, 천 원짜리 그 철학자의 호를 딴 길이 있어. "○○로"',a:['퇴계','퇴계로'],ok:'퇴계로. 너는 철학자 이름 위를 걸어 다니고 있었어.'},
  {id:'w23',k:'soc',kind:'ans',q:'플라톤이 쓴 동굴 이야기. 사슬에 묶인 사람들이 평생 진짜라고 믿은 건 벽에 비친 뭐였을까?',a:['그림자','그림자들'],ok:'그림자. 고개를 돌려 불빛을 보는 순간 눈이 아파. 그래서 다들 다시 벽만 봐.'},
  {id:'w24',k:'dio',kind:'down',min:20,q:'밥 먹는 동안 폰 엎어 두기. 20분. 밥이랑 앞에 있는 사람한테만 집중해 봐.',ok:'밥맛 달랐지? 에피쿠로스가 무엇을 먹느냐보다 누구와 먹느냐가 먼저라고 한 이유야.'},
  {id:'w25',k:'epi',kind:'ans',q:'아킬레우스가 아무리 빨리 달려도 앞에서 출발한 이 동물을 못 따라잡는다는 제논의 역설. 이 동물은?',a:['거북이','거북'],ok:'거북이. 실제로는 금방 따라잡지. 그런데 왜 말로는 못 따라잡는지 설명하는 데 2,000년이 걸렸어.'},
  {id:'w26',k:'soc',kind:'ans',q:'오천 원짜리 주인공 이름을 딴 길이 서울 종로에 있어. 경복궁 옆을 지나가는 "○○로"',a:['율곡','율곡로'],ok:'율곡로. 엄마 길(사임당로)도 서초에 있어. 엄마와 아들이 서울에 길 하나씩 갖고 있는 셈이지.'},
  {id:'w27',k:'nie',kind:'walk',dist:3000,q:'나는 하루에 몇 시간씩 걸으면서 책을 썼어. 오늘은 3km. "출발"을 누르고 3km 넘게 간 곳에서 "도착"을 눌러.',ok:'3km! 이 정도 걸으면 머릿속 문장이 다시 줄을 서. 오늘 떠오른 생각 하나는 꼭 적어 둬.'},
  {id:'w28',k:'epi',kind:'ans',q:'장자가 꿈에서 이게 되어 훨훨 날았대. 깨고 나서 물었지. "내가 이게 된 꿈을 꾼 걸까, 이게 내가 된 꿈을 꾸는 걸까?"',a:['나비'],ok:'나비. 지금 이 순간이 꿈이 아니라고, 너는 어떻게 확신해?'},
  {id:'w29',k:'soc',kind:'ans',q:'천 원짜리 뒷면 그림 속, 서당 안에 앉아 있는 사람은 누구일까?',a:['이황','퇴계','퇴계이황','이퇴계'],ok:'퇴계 이황 자신이야. 앞면에도 뒷면에도 있는 사람. 그만큼 그 자리를 아꼈던 거지.'},
  {id:'w30',k:'dio',kind:'ans',q:'파스칼은 사람을 바람에 흔들리는 약한 풀에 빗댔어. "인간은 생각하는 ○○다"',a:['갈대'],ok:'갈대. 우주가 사람을 짓눌러 죽여도, 사람은 자기가 죽는다는 걸 알아. 우주는 그걸 몰라.'},
  {id:'w31',k:'nie',kind:'early',h:7,q:'마르쿠스 황제도 이불 밖으로 나오기 싫었대. 그래서 일기에 "나는 일하려고 태어났다"고 썼어. 내일 아침 7시 전에 정원을 열어 봐.',ok:'이불을 이겼네. 하루의 첫 싸움에서 이긴 사람은 나머지도 덜 무서워.'},
  {id:'w32',k:'soc',kind:'ans',q:'똑같은 건초 더미 두 개 사이에 선 당나귀. 어느 쪽도 고르지 못하다가 결국 어떻게 됐을까?',a:['굶어죽었다','굶어죽음','굶어죽어','굶었다','굶어서죽었다'],inc:['굶'],ok:'굶어 죽었대. 뷔리당의 당나귀야. 완벽한 선택을 기다리다 아무것도 못 고르는 것도 선택이야.'},
  {id:'w33',k:'epi',kind:'dusk2',q:'해 지고 하늘이 완전히 어두워질 즈음, 첫 별을 찾아봐. 찾았으면 "찾았어"를 눌러 줘.',ok:'첫 별을 찾는 사람은 그날 하늘을 끝까지 본 사람이야. 오늘 하루, 끝까지 잘 봤어.'},
  {id:'w34',k:'dio',kind:'ans',q:'10원짜리 동전에 있는 탑은?',a:['다보탑'],ok:'다보탑. 불국사 마당에 1,200년 넘게 서 있어. 너보다 오래 기다린 거야.'},
  {id:'w35',k:'soc',kind:'ans',q:'"단순한 설명이 낫다." 쓸데없는 가정을 깎아 낸다고 해서 붙은 이름이야. "오컴의 ○○○"',a:['면도날','면도칼'],ok:'면도날. 변명이 길어지면 의심해 봐. 대개 짧은 쪽이 진짜야.'},
  {id:'w36',k:'nie',kind:'ans',q:'아침엔 네 발, 점심엔 두 발, 저녁엔 세 발. 스핑크스가 오이디푸스에게 낸 수수께끼. 답은?',a:['사람','인간'],ok:'사람. 오이디푸스는 이걸 맞히고 왕이 됐어. 그런데 정작 자기가 누군지는 몰랐지.'},
  {id:'w37',k:'epi',kind:'ans',q:'공자는 "나이 ○○에 하늘의 뜻을 알았다"고 했어. 그래서 이 나이를 지천명이라고 불러. 몇 살일까?',a:['50','쉰','오십','50살','쉰살'],ok:'쉰. 마흔은 흔들리지 않는 불혹, 쉰은 지천명. 공자도 하늘의 뜻을 알기까지 50년이 걸렸어.'},
  {id:'w38',k:'dio',kind:'down',min:30,q:'통 속 30분. 지금까지 중에 제일 길어. 폰을 엎어 두고, 30분 동안 그냥 너로 있어 봐.',ok:'30분이나! 이제 너도 통 속 사람이야. 생각보다 할 게 많았지?'},
  {id:'w39',k:'soc',kind:'ans',q:'만 원짜리 앞면, 세종대왕 옆에 적힌 노래 첫머리는 "뿌리 깊은 나무는…". 이 노래 이름은?',a:['용비어천가'],ok:'용비어천가. 뿌리 깊은 나무는 바람에 흔들리지 않는대. 사람도 그래.'},
  {id:'w40',k:'nie',kind:'ans',q:'스토아학파의 "스토아"는 원래 철학자들이 모여 이야기하던 곳 이름이야. 기둥이 줄지어 선 지붕 있는 복도. 이걸 뭐라고 부를까?',a:['주랑','회랑','복도','기둥복도','열주'],ok:'주랑. 에피쿠로스는 정원에서, 스토아는 주랑에서. 철학은 늘 사람들이 지나다니는 곳에서 했어.'},
  {id:'w41',k:'dio',kind:'ans',q:'아리스토텔레스한테 배운 제자 중에 나중에 세상의 절반을 정복한 왕이 있어. 나한테 햇빛 가리지 말라는 말을 들은 그 왕이야.',a:['알렉산드로스','알렉산더','알렉산드로스대왕','알렉산더대왕'],ok:'알렉산드로스. 그가 그랬대. "내가 알렉산드로스가 아니었다면 디오게네스가 되고 싶었을 것이다."'},
  {id:'w42',k:'epi',kind:'ans',q:'서울에는 "다산로"라는 길도 있어. 다산은 조선의 어느 학자의 호일까?',a:['정약용','다산정약용'],ok:'정약용. 18년 귀양 가 있는 동안 책을 500권 넘게 썼어. 갇힌 곳에서 오히려 제일 넓게 생각했지.'},
  {id:'w43',k:"soc",kind:'ans',q:"소크라테스의 아내 이름은? 화를 잘 내기로 유명해서 지금도 악처 하면 이 이름이 나와.",a:["크산티페", "크산티페스"],ok:"크산티페. 소크라테스는 \"좋은 아내를 얻으면 행복해지고, 나쁜 아내를 얻으면 철학자가 된다\"고 했대."},
  {id:'w44',k:"nie",kind:'ans',q:"\"『○○○○○는 이렇게 말했다』\" 내가 초인 이야기를 하려고 산에서 내려보낸 예언자 이름이야.",a:["차라투스트라", "짜라투스트라", "자라투스트라"],ok:"차라투스트라. 10년 동안 산에 있다가, 남는 지혜를 나눠 주려고 내려왔어."},
  {id:'w45',k:"dio",kind:'ans',q:"에픽테토스 형은 원래 어떤 신분이었을까? 다리를 절던 ○○.",a:["노예"],ok:"노예. 몸은 남의 것이었는데, 생각만은 누구에게도 안 넘겼어."},
  {id:'w46',k:"epi",kind:'ans',q:"내가 아테네에 세운 학교 이름은? 거기서 친구들이랑 같이 살았어.",a:["정원", "케포스", "가든"],ok:"정원. 문 앞에 이렇게 써 붙였어. \"손님, 여기서 즐겁게 지내시오. 여기서 최고의 선은 쾌락이오.\""},
  {id:'w47',k:"soc",kind:'ans',q:"내가 사형 선고를 받고 마신 독은 어떤 식물로 만들었을까?",a:["독당근", "독미나리", "헴록", "햄록"],ok:"독당근. 다리부터 차가워졌대. 마지막까지 친구들이랑 이야기했지."},
  {id:'w48',k:"nie",kind:'ans',q:"사르트르는 \"인간은 ○○을 선고받았다\"고 했어. 피할 수 없는 그것.",a:["자유"],ok:"자유. 고르지 않는 것도 고른 거래. 핑계 댈 곳이 없다는 뜻이야."},

<script type="module">
// ---------- platform: Google sign-in, cloud save, weekly league, reminders ----------
// The game runs fully offline from localStorage. Everything here is an extra that lights up when it can.
const CAP = window.Capacitor;
const NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const plug = n => (CAP && CAP.Plugins && CAP.Plugins[n]) || null;
const CFG = {apiKey:'AIzaSyDZ-NATGNFjQ90gswfebIV-0xqhps68qJM',authDomain:'eclipse-mindlab.firebaseapp.com',projectId:'eclipse-mindlab',
  storageBucket:'eclipse-mindlab.firebasestorage.app',messagingSenderId:'181450990304',appId:'1:181450990304:web:3043d3857815249f53e685'};
const V = '10.8.0', BASE = `https://www.gstatic.com/firebasejs/${V}/`;
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const progress = s => !s ? -1 : (s.trees||0)*100 + (s.given||0) + Object.values(s.xp||{}).reduce((a,b)=>a+b,0) + Object.values(s.misDone||{}).reduce((a,b)=>a+b,0)*3;

let F = null, auth = null, db = null, me = null, ready = false, failed = false, authKnown = false;
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);

async function load() {
  try {
    const [app, au, fs] = await withTimeout(Promise.all([import(BASE+'firebase-app.js'), import(BASE+'firebase-auth.js'), import(BASE+'firebase-firestore.js')]), 12000);
    F = {...au, ...fs};
    const a = app.initializeApp(CFG);
    auth = NATIVE ? au.initializeAuth(a, {persistence: au.indexedDBLocalPersistence}) : au.getAuth(a);
    db = fs.getFirestore(a);
    au.onAuthStateChanged(auth, u => { authKnown = true; me = u && !u.isAnonymous ? u : null; if (me) pull(); repaint(); });
    if (!NATIVE) au.getRedirectResult(auth).catch(() => {});
    ready = true;
  } catch (e) { failed = true; }
  repaint();
}

// ---- sign in ----
async function signIn() {
  if (!ready) return;
  if (INAPP) { outToBrowser('이 창에서는 구글이 로그인을 막아 둬서 저장이 안 돼.', ''); return; }
  try {
    if (NATIVE) {
      const FA = plug('FirebaseAuthentication');
      if (!FA) throw new Error('no plugin');
      const r = await FA.signInWithGoogle();
      const tok = r && r.credential && r.credential.idToken;
      if (!tok) throw new Error('no token');
      await F.signInWithCredential(auth, F.GoogleAuthProvider.credential(tok));
    } else {
      const p = new F.GoogleAuthProvider();
      try { await F.signInWithPopup(auth, p); }
      catch (e) { if (e && /popup/.test(e.code||'')) await F.signInWithRedirect(auth, p); else throw e; }
    }
  } catch (e) { if (!/cancel/i.test(String(e && (e.code||e.message)))) toast('로그인하지 못했어요'); }
}
async function signOut() { try { if (NATIVE && plug('FirebaseAuthentication')) await plug('FirebaseAuthentication').signOut(); await F.signOut(auth); } catch (e) {} repaint(); }

// ---- cloud save: the garden with more growth wins, nothing is ever thrown away ----
let pushT = null, pulled = false;
async function pull() {
  try {
    const ref = F.doc(db, 'garden', me.uid), d = await F.getDoc(ref);
    const c = d.exists() ? JSON.parse(d.data().s || 'null') : null;
    pulled = true;
    if (c && progress(c) > progress(S)) {
      try { localStorage.setItem('eclipse_kid_garden_backup', JSON.stringify(S)); } catch (e) {}
      Object.keys(S).forEach(k => delete S[k]); Object.assign(S, c);
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      location.reload(); return;
    }
    push();
  } catch (e) {}
}
async function push() {
  clearTimeout(pushT); pushT = null;
  if (!me || !pulled) return;
  try { await F.setDoc(F.doc(db, 'garden', me.uid), {s: JSON.stringify(S), p: progress(S), upd: F.serverTimestamp()}); } catch (e) {}
}
window.onGardenSave = () => { if (me && pulled && !pushT) pushT = setTimeout(push, 60000); reminders(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && pushT) push(); });

    return `<div class="mis"><p class="mt">학파를 골라 주세요</p><p class="mw">학파 대항전에서 같은 편이 돼요. 학파 점수는 그 학파 사람들 점수의 평균이에요.</p>

  const tabs = `<div class="tday"><button type="button" class="${b ? '' : 'on'}" data-tv="0">오늘 질문</button><button type="button" class="${b ? 'on' : ''}" data-tv="1">어제 질문</button></div>`;
  const head = tabs + `<div class="mis"><div class="tq">${face(ak)}<p>${esc(q)}</p></div>${philAnswer(b)}`;
  const wire = () => el.querySelectorAll('[data-tv]').forEach(x => x.onclick = () => { const v = +x.dataset.tv; if (v === tView) return; sfx.boop(); tView = v; talkCache = null; talkBusy = false; renderTalk(el); });
  if (failed) { el.innerHTML = head + '<p class="mw">다른 사람들 답은 인터넷이 될 때 보여요.</p></div>'; wire(); return; }
  if (!ready) { el.innerHTML = head + '<p class="mw">불러오는 중이에요</p></div>'; wire(); return; }
  if (talkBusy) return; talkBusy = true;
  try {
    // reading needs any sign-in: people who haven't logged in read as a guest
    if (!auth.currentUser) { try { await F.signInAnonymously(auth); } catch (e) {} }
    const col = F.collection(db, 'gardenTalk', day, 'a'), uid = me ? me.uid : '';
    if (!talkCache || talkCache.day !== day || talkCache.uid !== uid || Date.now() - talkCache.t > 120000) {
      const got = []; (await F.getDocs(F.query(col, F.orderBy('likes', 'desc'), F.limit(40)))).forEach(d => got.push({id: d.id, ...d.data()}));
      let mine = uid ? got.find(x => x.id === uid) || null : null;
      if (uid && !mine) { const d = await F.getDoc(F.doc(db, 'gardenTalk', day, 'a', uid)); if (d.exists()) mine = {id: d.id, ...d.data()}; }
      talkCache = {day, uid, t: Date.now(), list: got.filter(x => x.id !== uid && (x.rep || 0) < 3), mine};
    }
    const liked = (S.liked && S.liked[day]) || [], seen = (S.rcSeen || {})[day] || 0;
    const thread = x => {
      if (!thOpen.has(day + '/' + x.id)) return '';
      const L = thCache[day + '/' + x.id];
      if (!L) return '<div class="th"><p class="mw">불러오는 중이에요</p></div>';
      const canDel = r => me && (r.uid === me.uid || x.id === me.uid);
      return `<div class="th">${L.map(r => `<div class="rp"><div class="who"><b>${esc(r.name || '')}</b>${r.sc && SCHOOL[r.sc] ? `<span class="hb ${r.sc}">${SCHOOL[r.sc].nm}</span>` : ''}${canDel(r) ? `<button class="lnk" type="button" data-rdel="${x.id}|${r.id}">지우기</button>` : me ? `<button class="lnk" type="button" data-rrep="${x.id}|${r.id}">신고</button>` : ''}</div><p>${esc(r.t)}</p></div>`).join('')}
        ${me ? `<div class="rin"><input type="text" maxlength="60" placeholder="${esc(x.name || '')}에게 답글" data-rtx="${x.id}"><button class="opt" type="button" data-rgo="${x.id}">보내기</button></div>` : '<p class="mw">구글로 로그인하면 답글을 달 수 있어요.</p>'}</div>`;
    };
    const row = (x, isMine) => { const rc = Math.max(x.rc || 0, (thCache[day + '/' + x.id] || []).length), fresh = isMine && rc > seen;
      return `<div class="ta${isMine ? ' mine' : ''}"><div class="who"><b>${esc(x.name || '')}</b>${x.sc && SCHOOL[x.sc] ? `<span class="hb ${x.sc}">${SCHOOL[x.sc].nm}</span>` : ''}</div><p>${esc(x.t)}</p>
      <div class="act"><button class="rbt${thOpen.has(day + '/' + x.id) ? ' on' : ''}" type="button" data-th="${x.id}">답글 ${rc}${fresh ? `<i class="new">새 답글 ${rc - seen}</i>` : ''}</button><span class="sp"></span>${isMine ? `<span class="mw">공감 ${x.likes || 0}</span>` : me ? `<button class="lnk" type="button" data-rep="${x.id}">신고</button><button class="like${liked.includes(x.id) ? ' on' : ''}" type="button" data-like="${x.id}">공감 ${x.likes || 0}</button>` : `<span class="mw">공감 ${x.likes || 0}</span>`}</div>${thread(x)}</div>`; };
    const m = talkCache.mine, n = talkCache.list.length + (m ? 1 : 0);
    const box = b ? `<p class="mw">어제 질문이에요. 답은 하루에 한 줄이고, 답글은 계속 달 수 있어요.</p>`
      : !me ? `<p class="mw">${n ? `${n}명이 답했어요. ` : ''}구글로 로그인하면 한 줄로 답하고, 답글로 이야기할 수 있어요.</p><div class="mb"><button class="opt" type="button" id="tIn">구글로 로그인하고 답하기</button></div>${LEGAL}`
      : m ? '<p class="mw">오늘 답을 남겼어요. 다른 사람 답에 답글로 이야기해 보세요.</p>'
      : `<div class="tin"><textarea id="tTx" maxlength="60" placeholder="한 줄로 답해 주세요"></textarea><small id="tCt">0/60</small><div class="mb"><button class="opt" type="button" id="tGo">남기기</button></div></div>`;
    el.innerHTML = head + box + '</div>' + (m ? row(m, true) : '') + (talkCache.list.length ? talkCache.list.map(x => row(x, false)).join('') : (m ? '' : `<p class="mempty">${b ? '어제는 아무도 답하지 않았어요.' : '아직 아무도 답하지 않았어요. 첫 답을 남겨 보세요.'}</p>`));
    wire();
    const tin = el.querySelector('#tIn'); if (tin) tin.onclick = () => { sfx.boop(); signIn().then(() => { talkCache = null; setTimeout(() => renderTalk(el), 700); }); };
    const tx = el.querySelector('#tTx');
    if (tx) { tx.oninput = () => { el.querySelector('#tCt').textContent = `${tx.value.length}/60`; };
      el.querySelector('#tGo').onclick = async () => { const t = await cleanText(tx.value); if (!t) return;
        try { await F.setDoc(F.doc(db, 'gardenTalk', day, 'a', me.uid), {t, sc: S.school || '', name: S.lname, likes: 0, rep: 0, at: F.serverTimestamp()});
          S.qlog = S.qlog || {}; S.qlog[day] = 1; S.talkPost = day; save(); sfx.stamp(); buzz([20, 30, 40]);
          talkCache.mine = {id: me.uid, t, sc: S.school || '', name: S.lname, likes: 0}; talkBusy = false; renderTalk(el); postScore(); }
        catch (e) { toast('남기지 못했어요. 잠시 뒤에 다시 해 주세요'); } }; }
    el.querySelectorAll('[data-th]').forEach(x => x.onclick = async () => { const id = x.dataset.th; sfx.boop();
      if (thOpen.has(day + '/' + id)) { thOpen.delete(day + '/' + id); talkBusy = false; return renderTalk(el); }
      thOpen.add(day + '/' + id); talkBusy = false; renderTalk(el);
      try { await loadThread(day, id); } catch (e) { thCache[day + '/' + id] = []; }
      if (m && id === m.id) { S.rcSeen = {[day]: Math.max(m.rc || 0, thCache[day + '/' + id].length)}; save(); }
      talkBusy = false; renderTalk(el); });
    el.querySelectorAll('[data-rgo]').forEach(x => x.onclick = async () => { const aid = x.dataset.rgo, inp = el.querySelector(`[data-rtx="${aid}"]`);
      const t = await cleanText(inp.value); if (!t) return; x.disabled = true;
      const rid = me.uid + '_' + Date.now(), r = {t, sc: S.school || '', name: S.lname, uid: me.uid, rep: 0, at: F.serverTimestamp()};
      try { await F.setDoc(F.doc(db, 'gardenTalk', day, 'a', aid, 'r', rid), r);
        try { await F.updateDoc(F.doc(db, 'gardenTalk', day, 'a', aid), {rc: F.increment(1)}); } catch (e) {}
        (thCache[day + '/' + aid] = thCache[day + '/' + aid] || []).push({id: rid, ...r, at: Date.now()});
        const a = aid === uid ? talkCache.mine : talkCache.list.find(z => z.id === aid); if (a) a.rc = (a.rc || 0) + 1;
        if (aid === uid) { S.rcSeen = {[day]: a.rc}; save(); }
        sfx.boop(); buzz(10); }
      catch (e) { toast('보내지 못했어요. 잠시 뒤에 다시 해 주세요'); }
      talkBusy = false; renderTalk(el); });
    el.querySelectorAll('[data-rdel]').forEach(x => x.onclick = async () => { const [aid, rid] = x.dataset.rdel.split('|'); if (!confirmRep('d' + rid, '한 번 더 누르면 지워져요')) return;
      try { await F.deleteDoc(F.doc(db, 'gardenTalk', day, 'a', aid, 'r', rid)); thCache[day + '/' + aid] = (thCache[day + '/' + aid] || []).filter(r => r.id !== rid); toast('지웠어요'); }
      catch (e) { toast('지우지 못했어요'); } talkBusy = false; renderTalk(el); });
    el.querySelectorAll('[data-rrep]').forEach(x => x.onclick = async () => { const [aid, rid] = x.dataset.rrep.split('|'); if (!confirmRep('r' + rid)) return;
      thCache[day + '/' + aid] = (thCache[day + '/' + aid] || []).filter(r => r.id !== rid); talkBusy = false; renderTalk(el); toast('신고했어요. 이 답글은 숨겼어요');
      try { await F.updateDoc(F.doc(db, 'gardenTalk', day, 'a', aid, 'r', rid), {rep: F.increment(1)}); } catch (e) {} });
    el.querySelectorAll('[data-like]').forEach(x => x.onclick = async () => { const id = x.dataset.like; S.liked = S.liked || {}; const L = S.liked[day] = S.liked[day] || []; if (L.includes(id)) return;
      L.push(id); Object.keys(S.liked).forEach(k => { if (k !== today() && k !== yesterKey()) delete S.liked[k]; }); save(); sfx.boop(); buzz(8);
      const a = talkCache.list.find(r => r.id === id); if (a) a.likes = (a.likes || 0) + 1; x.classList.add('on'); x.textContent = `공감 ${a ? a.likes : ''}`;
      try { await F.updateDoc(F.doc(db, 'gardenTalk', day, 'a', id), {likes: F.increment(1)}); } catch (e) {} });
    el.querySelectorAll('[data-rep]').forEach(x => x.onclick = async () => { const id = x.dataset.rep; if (!confirmRep(id)) return;
      talkCache.list = talkCache.list.filter(r => r.id !== id); talkBusy = false; renderTalk(el); toast('신고했어요. 이 답은 숨겼어요');
      try { await F.updateDoc(F.doc(db, 'gardenTalk', day, 'a', id), {rep: F.increment(1)}); } catch (e) {} });
  } catch (e) { el.innerHTML = head + '<p class="mw">다른 사람들 답을 불러오지 못했어요. 잠시 뒤에 다시 열어 주세요.</p></div>'; wire(); }
  talkBusy = false;
}
// how many replies came in on yesterday's answer since I last looked
async function newReplies() {
  await loading; for (let i = 0; i < 20 && !authKnown; i++) await new Promise(r => setTimeout(r, 150)); if (!me) return 0;
  const day = yesterKey();
  try { const d = await F.getDoc(F.doc(db, 'gardenTalk', day, 'a', me.uid)); if (!d.exists()) return 0;
    const rc = d.data().rc || 0, seen = (S.rcSeen || {})[day] || 0; return rc > seen ? rc - seen : 0; } catch (e) { return 0; }
}
let repArm = '';
function confirmRep(id, msg) { if (repArm === id) return true; repArm = id; toast(msg || '한 번 더 누르면 신고돼요'); return false; }

// ---- reminders on the phone: morning missions, a timer ending, a streak about to break ----
const LN = () => NATIVE ? plug('LocalNotifications') : null;
let asked = false;
async function ask() { const L = LN(); if (!L || asked) return; asked = true; try { await L.requestPermissions(); reminders(); } catch (e) {} }
async function timer(M, start) {
  const L = LN(); if (!L || !M.min) return;
  try { await L.schedule({notifications: [{id: 7, title: '소크라텃밭', body: `"${M.t}" 시간이 다 됐어요.`, schedule: {at: new Date(start + M.min * 60000)}}]}); } catch (e) {}
}
let remT = null;
function reminders() { clearTimeout(remT); remT = setTimeout(schedule, 1500); }
async function schedule() {
  const L = LN(); if (!L) return;
  try {
    const p = await L.checkPermissions(); if (p.display !== 'granted') return;
    await L.cancel({notifications: [{id: 1}, {id: 2}]});
    const n = [{id: 1, title: '소크라텃밭', body: '오늘 미션이 게시판에 붙었어요.', schedule: {on: {hour: 8, minute: 40}, allowWhileIdle: true}}];
    const d = nowD(), st = streak(), doneToday = !!S.log[dkey(d)];
    const at = new Date(); at.setHours(21, 10, 0, 0);
    if (st > 0 && !doneToday && at > new Date()) n.push({id: 2, title: '소크라텃밭', body: `연속 ${st}일이 오늘 끊겨요. 미션 하나만 해 볼까요?`, schedule: {at}});
    await L.schedule({notifications: n});
  } catch (e) {}
}

// ---- Android back button closes what's open, then leaves ----
if (NATIVE && plug('App')) plug('App').addListener('backButton', () => {
  if (document.querySelector('.clr')) return;
  if (!$('board').hidden) return closeBoard();
  if (!$('ward').hidden) return closeWard();
  if (document.querySelector('.bub')) return closeBub();
  plug('App').minimizeApp();
});
if (NATIVE && plug('StatusBar')) { try { plug('StatusBar').setOverlaysWebView({overlay: false}); plug('StatusBar').setBackgroundColor({color: '#1d1838'}); } catch (e) {} }

// ---- share pictures from inside the app ----
window.gardenShare = async (dataUrl, name) => {
  const FS = plug('Filesystem'), SH = plug('Share');
  if (!NATIVE || !FS || !SH) return false;
  try { const w = await FS.writeFile({path: name, data: dataUrl.split(',')[1], directory: 'CACHE'}); await SH.share({files: [w.uri], dialogTitle: '자랑하기'}); } catch (e) {}
  return true;
};

window.GL = {render, renderTalk, ask, timer, onMission: () => { postScore(); push(); reminders(); },
  ready: () => ready, isIn: () => !!me, native: NATIVE,
  login: async () => { if (INAPP) { await signIn(); return false; } await signIn(); for (let i = 0; i < 30 && !me; i++) await new Promise(r => setTimeout(r, 150)); return !!me; },
  beta: () => betaJoin(null),
  // who won last week's school match (highest average points)
  lastWeek: async () => { await loading; for (let i = 0; i < 20 && !authKnown; i++) await new Promise(r => setTimeout(r, 150)); if (!me) return null;
    const col = F.collection(db, 'gardenLeague', weekDays(1)[0], 'p'); let best = null;
    for (const k of Object.keys(SCHOOL)) { try { const a = (await F.getAggregateFromServer(F.query(col, F.where('sc', '==', k)), {c: F.count(), t: F.sum('n')})).data(); const avg = a.c ? a.t / a.c : 0; if (a.c && (!best || avg > best.avg)) best = {k, avg}; } catch (e) {} }
    return best ? {win: best.k} : null; }, wantsBeta: () => !NATIVE && OS === 'android' && !S.beta,
  appSheet, offerApp: false, openStore, tester: async () => { const t = await isTester(); if (t && !S.betaTester) { S.betaTester = 1; save(); } return t; }, newReplies, talkView: v => { tView = v; talkCache = null; }, inapp: INAPP, out: (why, cancel) => outToBrowser(why, '', cancel), wantsApp: () => false};
const loading = load();
if (/[#&]app\b/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} setTimeout(() => { if (S.intro >= 2) appSheet(); }, 1800); }
if (window.hud) hud();
reminders();
</script>
