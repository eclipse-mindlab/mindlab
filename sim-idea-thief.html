<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이디어 도둑 동료 - 이클립스의 딜렘</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6d5dbc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b;
      color: #fff;
      min-height: 100vh;
      padding: 24px;
      line-height: 1.6;
    }
    
    .container {
      max-width: 540px;
      margin: 0 auto;
    }
    
    .header {
      margin-bottom: 32px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8b8b92;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .back-btn:hover {
      color: #9580ff;
    }

    .header-content {
      text-align: center;
    }

    .header-category {
      font-size: 12px;
      color: #9580ff;
      margin-bottom: 8px;
    }
    
    .header h1 {
      font-size: 22px;
      color: #fff;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 14px;
      color: #8b8b92;
    }
    
    .progress {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    
    .progress-bar {
      height: 4px;
      flex: 1;
      border-radius: 4px;
      background: #232326;
      transition: background 0.3s;
    }
    
    .progress-bar.completed { background: #9580ff; }
    .progress-bar.current { background: rgba(167, 139, 250, 0.5); }
    
    .scenario-card {
      background: #141417;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .stage-label {
      font-size: 11px;
      color: #8b8b92;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .context {
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 12px;
      padding: 12px;
      background: #1a1a1e;
      border-radius: 8px;
    }
    
    .situation {
      font-size: 17px;
      line-height: 1.8;
    }
    
    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .choice-btn {
      width: 100%;
      text-align: left;
      padding: 16px;
      background: #141417;
      border: 1px solid #232326;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.6;
    }
    
    .choice-btn:hover {
      background: #232326;
      border-color: #35353a;
    }
    
    .result-section {
      display: none;
    }
    
    .result-section.show {
      display: block;
    }
    
    .selected-choice {
      padding: 16px;
      background: #141417;
      border: 2px solid #35353a;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    
    .selected-header {
      font-size: 13px;
      color: #8b8b92;
      margin-bottom: 8px;
    }
    
    .selected-text {
      color: #d4d4d8;
      line-height: 1.6;
    }
    
    .outcome-card {
      padding: 16px;
      background: rgba(24, 24, 27, 0.5);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    
    .outcome-label {
      font-size: 13px;
      color: #8b8b92;
      margin-bottom: 8px;
    }
    
    .outcome-text {
      color: #d4d4d8;
      line-height: 1.8;
    }
    
    .principle-card {
      padding: 20px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15), #141417);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    
    .principle-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .principle-icon {
      font-size: 20px;
    }

    .principle-label {
      font-size: 11px;
      color: #9580ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .principle-name {
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
    }
    
    .principle-explanation {
      color: #a1a1aa;
      line-height: 1.8;
      font-size: 14px;
    }

    .evaluation-card {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .evaluation-card.positive {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .evaluation-card.neutral {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .evaluation-card.negative {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .evaluation-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .evaluation-text {
      font-size: 14px;
      line-height: 1.7;
    }

    .evaluation-card.positive .evaluation-text { color: #4ade80; }
    .evaluation-card.neutral .evaluation-text { color: #fbbf24; }
    .evaluation-card.negative .evaluation-text { color: #f87171; }

    .other-choices-section {
      margin-bottom: 16px;
    }

    .other-choices-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px;
      background: transparent;
      border: 1px solid #232326;
      border-radius: 10px;
      color: #8b8b92;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .other-choices-toggle:hover {
      border-color: #35353a;
      color: #a1a1aa;
    }

    .other-choices-toggle.open {
      border-color: #35353a;
      background: #141417;
    }

    .other-choices-toggle.open svg {
      transform: rotate(180deg);
    }

    .other-choices-content {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .other-choices-content.hidden {
      display: none;
    }

    .other-choice-card {
      background: #131316;
      border: 1px solid #1a1a1e;
      border-radius: 12px;
      padding: 14px;
    }

    .other-choice-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .eval-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .eval-badge.positive {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
    }

    .eval-badge.neutral {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
    }

    .eval-badge.negative {
      background: rgba(248, 113, 113, 0.2);
      color: #f87171;
    }

    .other-choice-text {
      font-size: 14px;
      color: #a1a1aa;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .other-choice-outcome {
      font-size: 13px;
      color: #8b8b92;
      margin-bottom: 10px;
      padding: 10px;
      background: #141417;
      border-radius: 8px;
      line-height: 1.6;
    }

    .other-choice-eval {
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: rgba(39, 39, 42, 0.5);
      border-radius: 6px;
      line-height: 1.6;
    }

    .other-choice-principle {
      font-size: 12px;
      color: #8b8b92;
    }

    .other-choice-principle strong {
      color: #9580ff;
    }

    .next-btn {
      width: 100%;
      padding: 16px;
      background: #6d5dbc;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .next-btn:hover {
      background: #6d28d9;
    }
    
    /* Final Result Screen */
    .final-screen {
      display: none;
      padding: 20px 0;
    }
    
    .final-screen.show {
      display: block;
    }

    .clear-card {
      background: linear-gradient(135deg, #1a1a1e, #141417);
      border: 1px solid #232326;
      border-radius: 20px;
      padding: 32px 24px;
      margin-bottom: 24px;
      text-align: center;
    }

    .clear-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }

    .clear-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .clear-subtitle {
      font-size: 14px;
      color: #8b8b92;
      margin-bottom: 20px;
    }

    .clear-exp {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(167, 139, 250, 0.2);
      border-radius: 20px;
      color: #9580ff;
      font-weight: 600;
    }

    .principles-collected {
      background: #141417;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .principles-title {
      font-size: 14px;
      color: #8b8b92;
      margin-bottom: 16px;
    }

    .principle-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: #1a1a1e;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .principle-item:last-child {
      margin-bottom: 0;
    }

    .principle-item-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .principle-item-content {
      flex: 1;
    }

    .principle-item-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .principle-item-desc {
      font-size: 12px;
      color: #8b8b92;
      line-height: 1.5;
    }

    .share-section {
      margin-bottom: 24px;
    }
    
    .share-label {
      font-size: 14px;
      color: #8b8b92;
      margin-bottom: 12px;
      text-align: center;
    }
    
    .share-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .share-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px;
      background: #232326;
      border: 1px solid #35353a;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .share-btn:hover {
      background: #35353a;
    }

    .share-btn.success {
      background: #166534;
      border-color: #22c55e;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .home-btn {
      width: 100%;
      padding: 16px;
      background: #6d5dbc;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .home-btn:hover {
      background: #6d28d9;
    }

    .restart-btn {
      width: 100%;
      padding: 16px;
      background: transparent;
      border: 1px solid #35353a;
      border-radius: 12px;
      color: #a1a1aa;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .restart-btn:hover {
      background: #232326;
      color: #fff;
    }

    .install-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: linear-gradient(135deg, #6d5dbc, #5b21b6);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .install-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
    }

    .install-btn.hidden { display: none; }

    .promo-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #232326;
    }

    /* 이클립스 더 알아보기 */
    .eclipse-section {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .eclipse-section-title {
      font-size: 14px;
      color: #8b8b92;
      margin-bottom: 16px;
    }
    
    .youtube-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 32px;
      background: #232326;
      border: 1px solid #35353a;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }
    
    .youtube-btn:hover {
      background: #35353a;
      transform: translateY(-2px);
    }
    
    .youtube-btn svg {
      fill: #ff0000;
    }
    
    /* 책 섹션 */
    .books-section {
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid #232326;
    }
    
    .books-section-title {
      font-size: 14px;
      color: #8b8b92;
      margin-bottom: 20px;
    }
    
    .books-grid {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    
    .book-item {
      flex: 1;
      max-width: 140px;
      text-decoration: none;
      color: #fff;
      transition: all 0.2s;
    }
    
    .book-item:hover {
      transform: translateY(-4px);
    }
    
    .book-item img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 10px;
    }
    
    .book-item-title {
      font-size: 13px;
      color: #a1a1aa;
    }

    .book-promo {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: linear-gradient(135deg, #1a1520 0%, #141417 100%);
      border: 1px solid #2d2438;
      border-radius: 12px;
      text-decoration: none;
      color: #fff;
      transition: all 0.2s;
    }

    .book-promo:hover {
      border-color: #9580ff;
      transform: translateY(-2px);
    }

    .book-promo-images {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .book-promo-img {
      width: 48px;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .book-promo-text { flex: 1; }
    .book-promo-series { font-size: 11px; color: #9580ff; margin-bottom: 2px; }
    .book-promo-title { font-size: 14px; font-weight: 500; }

    .hidden {
      display: none !important;
    }

    .exp-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #6d5dbc;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      animation: fadeInOut 2s ease-in-out;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        돌아가기
      </a>
      <div class="header-content">
        <div class="header-category">심리 · 직장</div>
        <h1>아이디어 도둑 동료</h1>
        <p>네 아이디어를 가로챈 동료, 어떻게 대응할까?</p>
      </div>
    </div>
    
    <div class="progress" id="progress"></div>
    
    <div id="game-screen">
      <div class="scenario-card">
        <div class="stage-label" id="stage-label">Stage 1</div>
        <div class="context" id="context"></div>
        <div class="situation" id="situation"></div>
      </div>
      
      <div class="choices" id="choices"></div>
      
      <div class="result-section" id="result-section">
        <div class="selected-choice">
          <div class="selected-header">선택한 답변</div>
          <div class="selected-text" id="selected-text"></div>
        </div>
        
        <div class="outcome-card">
          <div class="outcome-label">상대방의 반응</div>
          <div class="outcome-text" id="outcome-text"></div>
        </div>
        
        <div class="principle-card">
          <div class="principle-header">
            <span class="principle-icon">💡</span>
            <span class="principle-label">발견한 원칙</span>
          </div>
          <div class="principle-name" id="principle-name"></div>
          <div class="principle-explanation" id="principle-explanation"></div>
        </div>

        <div class="evaluation-card" id="evaluation-card">
          <div class="evaluation-icon" id="evaluation-icon">⚠️</div>
          <div class="evaluation-text" id="evaluation-text"></div>
        </div>

        <div class="other-choices-section">
          <button class="other-choices-toggle" id="other-toggle">
            <span>다른 선택은?</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="other-choices-content hidden" id="other-choices-content"></div>
        </div>
        
        <button class="next-btn" id="next-btn">다음 상황</button>
      </div>
    </div>
    
    <div class="final-screen" id="final-screen">
      <div class="clear-card">
        <div class="clear-icon">🎯</div>
        <div class="clear-title">시뮬레이션 완료!</div>
        <div class="clear-subtitle">아이디어 도둑 동료 상황을 클리어했습니다</div>
        <div class="clear-exp">+30 EXP 획득!</div>
      </div>

      <div class="principles-collected">
        <div class="principles-title">🔓 발견한 원칙들</div>
        <div id="principles-list"></div>
      </div>

      <div class="share-section">
        <div class="share-label">친구에게 공유하기</div>
        <div class="share-buttons">
          <button class="share-btn" id="native-share-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
              <polyline points="16 6 12 2 8 6"/>
              <line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
            공유하기
          </button>
          <button class="share-btn" id="copy-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            링크 복사
          </button>
        </div>
      </div>

      <div class="action-buttons">
        <a href="index.html" class="home-btn">홈으로 돌아가기</a>
        <button class="restart-btn" id="restart-btn">다시 해보기</button>
        <button class="install-btn hidden" id="installBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          앱으로 설치하고 계속 탐험하기
        </button>
      </div>

      <div class="promo-section">
        <div class="books-section">
          
          <div class="books-grid">
            <a href="https://litt.ly/eclipse.thinker" target="_blank" class="book-item">
              <img src="book-philosophy.png" alt="훔친 철학 편">
              <div class="book-item-title">훔친 철학 편</div>
            </a>
            <a href="https://litt.ly/eclipse.thinker" target="_blank" class="book-item">
              <img src="book-psychology.png" alt="훔친 심리학 편">
              <div class="book-item-title">훔친 심리학 편</div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">

          {

            principleDesc: "실패에서 배우는 건 좋지만, 대가가 크면 손해다. 미리 배우는 게 낫다.",
            evaluation: "neutral",
            evalText: "교훈은 얻었다. 하지만 이 아이디어로 얻었을 기회는 영영 돌아오지 않는다.",

    let currentStageId = 1;
    let collectedPrinciples = [];
    let stageHistory = [];

    function getStageById(id) {
      return stages.find(s => s.id === id);
    }

    function init() {
      renderProgress();
      renderStage();
      
      document.getElementById('next-btn').addEventListener('click', nextStage);
      document.getElementById('restart-btn').addEventListener('click', restart);
      document.getElementById('native-share-btn').addEventListener('click', nativeShare);
      document.getElementById('copy-btn').addEventListener('click', copyLink);
      document.getElementById('other-toggle').addEventListener('click', toggleOtherChoices);
    }

    function toggleOtherChoices() {
      const content = document.getElementById('other-choices-content');
      const toggle = document.getElementById('other-toggle');
      content.classList.toggle('hidden');
      toggle.classList.toggle('open');
    }

    function renderProgress() {
      const totalStages = 3;
      const currentCount = stageHistory.length;
      
      const progressEl = document.getElementById('progress');
      progressEl.innerHTML = Array(totalStages).fill(0).map((_, idx) => {
        let className = 'progress-bar';
        if (idx < currentCount) className += ' completed';
        else if (idx === currentCount) className += ' current';
        return `<div class="${className}"></div>`;
      }).join('');
    }

    function renderStage() {
      const stage = getStageById(currentStageId);
      if (!stage) return;
      
      document.getElementById('stage-label').textContent = `Stage ${stageHistory.length + 1}`;
      document.getElementById('context').textContent = stage.context;
      document.getElementById('situation').textContent = stage.situation;
      
      const choicesEl = document.getElementById('choices');
      choicesEl.innerHTML = stage.choices.map((choice, idx) => `
        <button class="choice-btn" data-index="${idx}">${choice.text}</button>
      `).join('');
      
      choicesEl.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => handleChoice(parseInt(btn.dataset.index)));
      });
      
      document.getElementById('choices').classList.remove('hidden');
      document.getElementById('result-section').classList.remove('show');
    }

    function handleChoice(index) {
      const stage = getStageById(currentStageId);
      const choice = stage.choices[index];
      
      stageHistory.push({
        stageId: currentStageId,
        choiceIndex: index,
        principle: choice.principle
      });
      
      if (!collectedPrinciples.find(p => p.name === choice.principle)) {
        collectedPrinciples.push({
          name: choice.principle,
          desc: choice.principleDesc
        });
      }
      
      document.getElementById('choices').classList.add('hidden');
      document.getElementById('result-section').classList.add('show');
      
      document.getElementById('selected-text').textContent = choice.text;
      document.getElementById('outcome-text').textContent = choice.outcome;
      document.getElementById('principle-name').textContent = choice.principle;
      document.getElementById('principle-explanation').textContent = choice.principleDesc;
      
      const evalCard = document.getElementById('evaluation-card');
      const evalIcon = document.getElementById('evaluation-icon');
      const evalText = document.getElementById('evaluation-text');
      
      evalCard.className = 'evaluation-card ' + choice.evaluation;
      evalText.textContent = choice.evalText;
      
      if (choice.evaluation === 'positive') evalIcon.textContent = '✓';
      else if (choice.evaluation === 'neutral') evalIcon.textContent = '⚠️';
      else evalIcon.textContent = '✗';
      
      // 다른 선택지
      const otherChoices = stage.choices.filter((_, i) => i !== index);
      const otherContent = document.getElementById('other-choices-content');
      otherContent.innerHTML = otherChoices.map(c => {
        let evalBadge = '';
        if (c.evaluation === 'positive') evalBadge = '<span class="eval-badge positive">✓ 효과적</span>';
        else if (c.evaluation === 'neutral') evalBadge = '<span class="eval-badge neutral">⚠️ 상황에 따라</span>';
        else evalBadge = '<span class="eval-badge negative">✗ 리스크</span>';
        
        return `
          <div class="other-choice-card">
            <div class="other-choice-header">
              ${evalBadge}
            </div>
            <div class="other-choice-text">${c.text}</div>
            <div class="other-choice-outcome">${c.outcome}</div>
            <div class="other-choice-eval">${c.evalText}</div>
            <div class="other-choice-principle"><strong>${c.principle}</strong>: ${c.principleDesc}</div>
          </div>
        `;
      }).join('');
      
      document.getElementById('other-choices-content').classList.add('hidden');
      document.getElementById('other-toggle').classList.remove('open');
      
      // 다음 스테이지 결정
      const nextBtn = document.getElementById('next-btn');
      if (choice.nextStage === 'end') {
        nextBtn.textContent = '결과 보기';
      } else {
        nextBtn.textContent = '다음 상황';
      }
      
      currentStageId = choice.nextStage;
      renderProgress();
    }

    function nextStage() {
      if (currentStageId === 'end') {
        showFinalScreen();
      } else {
        renderStage();
      }
    }

    function showFinalScreen() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('final-screen').classList.add('show');
      
      // 발견한 원칙 목록
      const principlesList = document.getElementById('principles-list');
      principlesList.innerHTML = collectedPrinciples.map(p => `
        <div class="principle-item">
          <div class="principle-item-icon">💡</div>
          <div class="principle-item-content">
            <div class="principle-item-name">${p.name}</div>
            <div class="principle-item-desc">${p.desc}</div>
          </div>
        </div>
      `).join('');
      
      // 프로필 저장
      saveProgress();
      
      // 설치 버튼 표시
      showInstallButton();
    }

    function saveProgress() {
      let saved = localStorage.getItem(STORAGE_KEY);
      let profile;
      
      if (saved) {
        profile = JSON.parse(saved);
      } else {
        profile = { name: '익명 탐험가', level: 1, exp: 0, completedSims: [], principles: [] };
      }
      
      if (!profile.completedSims) profile.completedSims = [];
      if (!profile.principles) profile.principles = [];
      
      const isFirstTime = !profile.completedSims.includes(SIM_ID);
      
      if (isFirstTime) {
        profile.completedSims.push(SIM_ID);
        profile.exp = (profile.exp || 0) + 30;
        
        const expNeeded = (profile.level || 1) * 100;
        while (profile.exp >= expNeeded) {
          profile.exp -= expNeeded;
          profile.level = (profile.level || 1) + 1;
        }
      }
      
      // 원칙 추가
      collectedPrinciples.forEach(p => {
        if (!profile.principles.find(existing => existing.name === p.name)) {
          profile.principles.push(p);
        }
      });
      
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
      
      // Firebase에도 저장
      const user = auth.currentUser;
      if (user) {
        const docRef = doc(db, 'users', user.uid);
        setDoc(docRef, { ...profile, updatedAt: new Date().toISOString() }, { merge: true })
          .then(() => console.log('클라우드 저장 완료'))
          .catch(console.error);
      }
    }

    function getShareText() {
      return `🌙 이클립스의 딜렘

[아이디어 도둑 동료] 클리어!

발견한 원칙 ${collectedPrinciples.length}개:
${collectedPrinciples.map(p => '• ' + p.name).join('\n')}

당신은 어떻게 대응할 건가요?`;
    }

    function nativeShare() {
      if (navigator.share) {
        navigator.share({
          title: '아이디어 도둑 동료 - 이클립스의 딜렘',
          text: getShareText(),
          url: SITE_URL
        }).catch(() => {});
      } else {
        copyLink();
      }
    }

    function copyLink() {
      const text = getShareText() + '\n' + SITE_URL;
      const btn = document.getElementById('copy-btn');
      
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('success');
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 복사 완료!`;
        setTimeout(() => {
          btn.classList.remove('success');
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 링크 복사`;
        }, 2000);
      });
    }

    function restart() {
      currentStageId = 1;
      collectedPrinciples = [];
      stageHistory = [];
      
      document.getElementById('final-screen').classList.remove('show');
      document.getElementById('game-screen').classList.remove('hidden');
      
      renderProgress();
      renderStage();
    }

    init();

    // PWA 설치 프롬프트
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // 클리어 화면에서 설치 버튼 표시
    function showInstallButton() {
      if (deferredPrompt && installBtn) {
        installBtn.classList.remove('hidden');
      }
    }

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      
      if (outcome === 'accepted') {
        installBtn.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.classList.add('hidden');
      deferredPrompt = null;
    });
  </script>
