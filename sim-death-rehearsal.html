const TYPE={"cause1": "isolation", "skip1": "distraction", "clip1": "face", "stop2": "isolation", "listen2": "face", "trip2": "anchoring", "drink3": "distraction", "video3": "distraction", "call3": "anchoring", "search4": "isolation", "work4": "anchoring", "quiet4": "isolation", "phone5": "distraction", "through5": "face", "later5": "isolation"};
const RES={"isolation": {"label": "가장 많이 쓴 장치", "title": "격리", "desc": "다섯 장면 중 가장 자주 고른 건 격리였습니다.\n\n괴로운 생각을 의식 밖으로 밀어내는 방법입니다. 사페는 이것을 인간이 미치지 않고 사는 첫 번째 방법으로 꼽았습니다. 의대에서 환자를 깊이 걱정하되 그 고통에 휩쓸리지 않는 법, 이른바 초연한 관심을 가르치는 것도 같은 이유입니다.\n\n다만 문밖에 둔 생각은 없어지지 않습니다. 엄마가 다시 꺼내지 않은 그 얘기처럼, 그 자리에 남아 있습니다."}, "distraction": {"label": "가장 많이 쓴 장치", "title": "기분전환", "desc": "다섯 장면 중 가장 자주 고른 건 기분전환이었습니다.\n\n틈이 생기면 바로 채웠습니다. 술자리, 추천 영상, 쇼츠. 약점만은 아닙니다. 끔찍한 사고 영상을 본 사람들에게 곧바로 테트리스를 하게 했더니, 그 뒤 일주일 동안 사고 장면이 불쑥 떠오르는 일이 눈에 띄게 줄었습니다.\n\n다만 사페의 비유대로 비행기는 엔진이 멈추면 떨어집니다. 새벽 2시에 화면을 끄면 돌아오는 생각이 그 증거입니다."}, "anchoring": {"label": "가장 많이 쓴 장치", "title": "정박", "desc": "다섯 장면 중 가장 자주 고른 건 정박이었습니다.\n\n내년 여행, 가족의 목소리, 밀린 일. 붙잡을 것이 있으면 왜 사는지 따로 묻지 않아도 하루가 채워집니다. 대부분의 사람이 이렇게 삽니다.\n\n다만 닻은 끊길 수 있습니다. 공장이 문을 닫자 마을 사람들의 하루가 통째로 무너진 마리엔탈처럼요. 내 닻이 하나뿐인지 여러 개인지는 알아 둘 만합니다."}, "face": {"label": "가장 많이 쓴 장치", "title": "직면", "desc": "다섯 장면 중 가장 자주 고른 건 직면이었습니다. 네 가지 중 가장 드문 선택입니다.\n\n고인을 다시 찾아봤고, 엄마의 말을 끝까지 들었고, 진료실 앞에서 최악을 끝까지 생각했습니다. 사페는 고통을 정면으로 보고 다른 것으로 바꾸는 방식을 승화라고 불렀습니다. 힘들었던 일을 나흘 동안 글로 쓴 대학생들은 그 뒤 몇 달 동안 학교 보건소를 덜 찾았습니다.\n\n사페도 이렇게 살았습니다. 인류가 왜 괴로운지에 대한 글을 썼고, 노르웨이의 봉우리들을 처음으로 올랐고, 아흔 살까지 살았습니다. 그는 등산을 두고 이렇게 말했다고 합니다. 등산은 삶만큼이나 무의미하다. 하지만 훌륭한 기분전환이다."}};
const ORDER=["face", "anchoring", "distraction", "isolation"];
const NAME={"isolation": "격리", "distraction": "기분전환", "anchoring": "정박", "face": "직면"};
const CONFIG={id:'death-rehearsal',title:'죽음 리허설',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-death-rehearsal.html',version:5,
stages:[{"badge": "첫 번째", "title": "속보", "desc": "출근길 지하철. 포털에 속보가 떴다.\n\n\"배우 ○○○ 별세. 향년 44세.\"\n\n어릴 때 보던 드라마의 주인공이다. 지난달까지 예능에도 나왔다.", "highlight": "속보를 본 다음, 무엇을 하겠는가?", "choices": [{"id": "cause1", "text": "사인부터 확인한다.", "subtext": "왜 그렇게 일찍 갔는지 궁금하다.", "meaning": "기사를 열었다. 지병이 있었다고 한다. 나도 모르게 안도했다. 다음 역에 도착할 무렵엔 다른 기사를 읽고 있었다.\n\n안도한 이유는 하나다. 나에게는 그 지병이 없다.", "principle": {"name": "필연을 우연으로", "desc": "프로이트는 1915년에 쓴 글에서, 사람들이 죽음을 늘 사고나 병, 노환 같은 우연한 원인으로 설명하려 한다고 썼다. 원인을 찾는 순간 누구에게나 오는 죽음이 그 사람에게만 일어난 일로 바뀌고, 나는 슬쩍 그 바깥으로 빠져나온다. 대학생들에게 심장마비 같은 불행이 같은 학교 또래보다 자기에게 일어날 가능성을 물으면, 평균적으로 더 낮다고 답한다. 모두가 평균보다 안전할 수는 없다.", "icon": ""}}, {"id": "skip1", "text": "다른 기사로 넘긴다.", "subtext": "출근길에 생각할 일은 아니다.", "meaning": "점심시간에 누가 그 얘기를 꺼냈다. \"마흔넷이래.\" 잠깐 조용하다가 메뉴 얘기로 넘어갔다.\n\n아무도 이상하게 여기지 않았다. 다들 같은 방법을 쓰고 있었다.", "principle": {"name": "격리", "desc": "노르웨이 철학자 페테르 베셀 사페는 괴로운 생각을 의식 밖으로 밀어내는 것을 격리라고 불렀다. 그는 이것을 인간이 미치지 않고 살아가는 첫 번째 방법으로 꼽았다. 가까운 사람을 잃고도 며칠 뒤 다시 출근할 수 있는 것도 이 덕분이다.", "icon": ""}}, {"id": "clip1", "text": "그 배우가 나온 장면을 찾아본다.", "subtext": "기억해 두고 싶다.", "meaning": "20년 전 드라마 클립을 찾았다. 댓글에는 같은 장면을 찾아온 사람이 많다. \"이 장면 보고 연기 시작했어요.\"\n\n영상을 끄고 나서도 마음이 생각만큼 무겁지 않았다. 슬픔을 피하지 않았는데, 덜 무거웠다.", "principle": {"name": "이어지는 유대", "desc": "오랫동안 애도는 고인을 떠나보내는 과정이라고 여겨졌다. 1996년 심리학자 데니스 클래스 등은 여기에 반론을 냈다. 사람들은 고인을 잊는 대신 기억과 이야기 속에서 관계를 이어 가며 상실을 견딘다는 것이다. 고인을 다시 찾아보는 일은 슬픔을 피하지 않고 다루는 방식이다.", "icon": ""}}]}, {"badge": "두 번째", "title": "명절", "desc": "추석. 설거지를 하는데 엄마가 말한다.\n\n\"엄마 혹시 무슨 일 생기면, 통장이랑 보험 서류는 안방 서랍 맨 아래 칸에 있다.\"", "highlight": "엄마에게 뭐라고 하겠는가?", "choices": [{"id": "stop2", "text": "\"갑자기 무슨 그런 소리를 해.\"", "subtext": "듣고 싶지 않다.", "meaning": "\"그냥 알아두라고.\" 엄마는 웃으며 넘겼다. 그 뒤로 엄마는 그 얘기를 다시 꺼내지 않았다. 다음 명절에도, 그다음에도.\n\n그 말을 막은 이유는 내가 듣기 싫어서였다.", "principle": {"name": "침묵의 벽", "desc": "정신과 의사 엘리자베스 퀴블러로스는 1960년대에 죽음을 앞둔 환자 수백 명을 인터뷰했다. 많은 환자가 죽음에 대해 이야기하고 싶어 했지만, 가족과 의료진이 화제를 돌리는 바람에 그 마음을 혼자 감당해야 했다. 퀴블러로스는 환자를 가장 외롭게 만드는 것이 주변의 침묵이라고 봤다.", "icon": ""}}, {"id": "listen2", "text": "하던 걸 멈추고 끝까지 듣는다.", "subtext": "지금 들어야 한다.", "meaning": "보험 증서, 연락할 사람, 장례는 작게 하라는 말까지. 엄마는 생각보다 많은 걸 정리해 두었다. 다 말하고 나서 엄마가 말했다. \"이제 속이 시원하네.\"\n\n그 얘기를 혼자 들고 있던 사람은 엄마였다.", "principle": {"name": "미리 하는 대화", "desc": "2010년 호주 연구팀은 고령 환자들을 두 집단으로 나누고, 한쪽만 생의 마지막에 원하는 것을 가족과 미리 의논하게 했다. 환자가 세상을 떠난 뒤, 미리 대화한 쪽 가족은 스트레스와 불안, 우울이 더 적었다. 미리 꺼낸 죽음 이야기는 남는 사람의 짐을 덜어 준다.", "icon": ""}}, {"id": "trip2", "text": "\"그보다 엄마, 내년엔 어디 여행 갈까?\"", "subtext": "분위기를 바꾸고 싶다.", "meaning": "엄마가 반색했다. \"제주도? 일본 온천도 좋다던데.\" 둘이서 한참 숙소와 날짜를 정했다. 서랍 얘기는 다시 나오지 않았다.\n\n내년 계획을 세우는 동안에는 내년이 당연히 오는 것 같았다.", "principle": {"name": "정박", "desc": "사페는 생각이 아무 데로나 떠내려가지 않도록 무언가에 묶어 두는 것을 정박이라고 불렀다. 그가 꼽은 닻은 신, 국가, 도덕, 운명, 그리고 미래였다. 다음 계획이 있는 한, 지금 끝을 생각하지 않아도 된다.", "icon": ""}}]}, {"badge": "세 번째", "title": "조문 다녀온 밤", "desc": "대학 동기의 아버님이 돌아가셨다.\n\n동기는 생각보다 담담했다. \"갑자기 쓰러지셨어. 예순둘이셨는데.\"\n\n조문을 마치고 나오니 밤 11시다. 같이 간 동기가 셋이다.", "highlight": "장례식장을 나선 밤, 어디로 가겠는가?", "choices": [{"id": "drink3", "text": "동기들과 근처 술집으로 간다.", "subtext": "이대로 집에 가긴 그렇다.", "meaning": "소주 두 병째쯤 대화는 이직, 주식, 집값으로 넘어갔다. 다들 많이 웃었다. 고인 얘기를 꺼낸 사람은 없었다. 헤어지면서 서로 말했다. \"오랜만에 좋았다.\"\n\n정말 좋았다. 장례식장에서 본 것을 집까지 들고 간 사람은 없었다.", "principle": {"name": "파스칼의 토끼", "desc": "17세기 철학자 파스칼은 하루 종일 토끼를 쫓는 사냥꾼에게 토끼 한 마리를 그냥 건네면 반가워하지 않을 거라고 썼다. 그가 원한 것은 쫓는 동안 다른 생각을 하지 않아도 되는 시간이었다. 사페는 이렇게 빈틈을 채우는 일을 기분전환이라고 불렀다.", "icon": ""}}, {"id": "video3", "text": "집에 가서 유튜브를 틀어 놓고 잔다.", "subtext": "오늘은 아무 생각도 하기 싫다.", "meaning": "누워서 추천 영상을 하나 보고 또 하나 봤다. 새벽 2시에 화면을 끄자 장례식장 생각이 났다. 예순둘. 아빠는 올해 예순이다.\n\n다시 휴대폰을 집었다.", "principle": {"name": "빈 방의 15분", "desc": "2014년 버지니아대 연구팀은 참가자를 빈 방에 혼자 두고 15분 동안 생각만 하게 했다. 방에는 누르면 전기충격이 오는 버튼이 있었다. 미리 맞아 보고 돈을 내서라도 피하고 싶다고 한 충격이었는데도, 남자 셋 중 둘이 버튼을 눌렀다. 한 명은 190번을 눌렀다.", "icon": ""}}, {"id": "call3", "text": "집에 가는 길에 아빠한테 전화한다.", "subtext": "목소리를 듣고 싶다.", "meaning": "\"이 시간에 웬일이냐. 무슨 일 있냐?\" \"아니, 그냥.\" 아빠는 날씨 얘기, 차 얘기를 하다 끊었다. 3분짜리 통화였다.\n\n아빠한테 먼저 전화한 건 몇 달 만이었다. 장례식장에 다녀오고 나서야 걸었다.", "principle": {"name": "관계라는 방패", "desc": "죽음을 떠올린 사람들은 가까운 사람과의 관계를 더 원하게 된다. 공포관리 이론을 연구하는 학자들이 여러 실험으로 확인한 결과다. 이스라엘 심리학자 마리오 미쿨린서는 가까운 관계가 죽음의 불안을 막아 주는 방패 역할을 한다고 봤다.", "icon": ""}}]}, {"badge": "네 번째", "title": "재검 문자", "desc": "건강검진 결과 문자가 왔다.\n\n\"갑상선 초음파 결과 추가 검사가 필요합니다. 결과 상담 예약일 10월 21일.\"\n\n일주일 뒤다. 인터넷에는 별것 아니라는 글도, 그렇지 않다는 글도 있다.", "highlight": "결과까지 일주일. 어떻게 보내겠는가?", "choices": [{"id": "search4", "text": "밤마다 증상과 후기를 검색한다.", "subtext": "알아야 덜 불안하다.", "meaning": "카페 후기를 수백 개 읽었다. \"저도 재검 나왔는데 아무것도 아니었어요.\" 안심했다가 다음 글에서 다시 불안해졌다. 새벽 3시쯤에는 검색어가 처음보다 훨씬 무서워져 있었다.\n\n알수록 덜 불안할 줄 알았는데, 일주일 내내 잠을 설쳤다.", "principle": {"name": "사이버콘드리아", "desc": "2009년 마이크로소프트 연구팀은 사람들의 실제 검색 기록을 분석했다. 두통처럼 흔한 증상을 검색하던 사람들이 뇌종양 같은 드문 병으로 검색을 키워 가는 일이 많았다. 검색 결과에 무서운 병이 실제보다 훨씬 자주 나오기 때문이다. 연구팀은 이 현상을 사이버콘드리아라고 불렀다.", "icon": ""}}, {"id": "work4", "text": "일을 더 몰아서 한다.", "subtext": "바쁘면 생각할 틈이 없다.", "meaning": "야근을 자청했고 주말에도 출근했다. 그 주 성과는 입사 후 최고였다. 팀장이 요즘 왜 이렇게 열심이냐고 물었다. 그런데 퇴근길 지하철에 앉는 순간마다 그 생각이 돌아왔다.\n\n일은 생각을 퇴근 시간까지만 막아 줬다.", "principle": {"name": "일이라는 닻", "desc": "1930년대 오스트리아 마을 마리엔탈에서 주민 대부분이 다니던 공장이 문을 닫았다. 연구자들은 시간이 남은 사람들이 책을 더 읽기는커녕, 도서관이 대출료를 없앴는데도 빌려 가는 책이 줄어드는 것을 기록했다. 걸음은 느려졌고, 하루를 적어 보라고 하면 무엇을 했는지 설명하지 못했다. 일은 돈과 함께 하루의 모양을 주고 있었다.", "icon": ""}}, {"id": "quiet4", "text": "아무에게도 말하지 않고 평소처럼 지낸다.", "subtext": "결과도 안 나왔는데 유난 떨 필요 없다.", "meaning": "가족에게도, 애인에게도 말하지 않았다. 평소처럼 출근하고 평소처럼 지냈다. 그런데 그 주에 적금을 하나 더 들었고, 지웠던 주식 앱을 다시 깔았다.\n\n말하지 않은 불안이 돈 걱정으로 바뀌어 있었다.", "principle": {"name": "불안이 부르는 욕심", "desc": "2000년 미국 심리학자 팀 캐서와 케넌 셸던은 대학생 절반에게는 자기 죽음에 대해, 나머지에게는 음악에 대해 짧은 글을 쓰게 했다. 죽음에 대해 쓴 학생들은 15년 뒤 자기가 벌 돈을 더 높게 예상했고, 숲의 나무를 나눠 베는 게임에서도 더 많이 베겠다고 했다. 불안해지자 더 많이 가지려 한 것이다.", "icon": ""}}]}, {"badge": "다섯 번째", "title": "진료실 앞", "desc": "결과 상담 날. 대기실 전광판에 내 번호가 다음 순서로 떴다.\n\n이름이 불리기까지 3분쯤 남았다.", "highlight": "이름이 불리기 전 3분. 무엇을 하겠는가?", "choices": [{"id": "phone5", "text": "휴대폰을 보며 기다린다.", "subtext": "생각해 봐야 달라질 건 없다.", "meaning": "쇼츠 세 개를 보는 사이 이름이 불렸다. \"양성 결절입니다. 1년 뒤에 다시 보죠.\" 병원을 나서고 나서야 안심이 됐다. 그날 저녁엔 치킨을 시켰다.\n\n일주일 동안 했던 생각은 사흘 만에 다 사라졌다. 남은 건 1년 뒤 예약 하나였다.", "principle": {"name": "멈추지 않는 비행기", "desc": "사페는 기분전환을 비행기에 빗댔다. 무거운 쇳덩이가 하늘에 떠 있으려면 쉬지 않고 날아야 하고, 엔진이 멈추면 떨어진다. 자극이 끊기는 순간 막아 두었던 생각들이 돌아오기 때문에, 우리는 틈이 생기기 무섭게 무언가로 그 틈을 채운다.", "icon": ""}}, {"id": "through5", "text": "결과가 나쁘다고 가정하고 끝까지 생각해 본다.", "subtext": "그렇다면 나는 무엇을 후회할까.", "meaning": "엄마에게 뭐라고 할지, 회사에 뭐라고 할지부터 생각했다. 끝까지 가 보니 걸리는 건 승진이나 잔고보다 다른 것들이었다. 3년째 연락 못 한 친구, 미뤄 둔 여행, 부모님과 보낸 시간.\n\n결과는 양성이었다. 그날 밤 그 친구에게 문자를 보냈다.", "principle": {"name": "끝까지 떠올리기", "desc": "2004년 미국 연구팀은 사람들에게 두 가지 방식으로 죽음을 떠올리게 했다. 한쪽은 자기 죽음에 대한 질문 두 개에 짧게 답했다. 다른 쪽은 불타는 고층 건물에 갇혀 죽어 가는 장면을 끝까지 상상한 뒤, 삶에서 정말 중요했던 것을 적었다. 평소 돈과 지위를 중시하던 사람들 가운데 짧게 답한 쪽은 여전히 욕심을 냈고, 끝까지 상상한 쪽은 욕심이 눈에 띄게 줄었다.", "icon": ""}}, {"id": "later5", "text": "결과를 듣고 나서 생각하기로 한다.", "subtext": "미리 걱정할 필요는 없다.", "meaning": "아무 생각도 하지 않으려 했다. 그럴수록 생각이 더 또렷해졌다. 3분이 아주 길었다. 이름이 불렸을 때는 오히려 지쳐 있었다.\n\n생각하지 않으려고 쓴 힘이 생각하는 데 드는 힘보다 컸다.", "principle": {"name": "흰곰 효과", "desc": "1987년 하버드 심리학자 대니얼 웨그너는 참가자들에게 5분 동안 흰곰을 생각하지 말라고 했다. 생각이 날 때마다 종을 치게 했더니, 참가자들은 평균 1분에 한 번 넘게 종을 쳤다. 억누르려던 생각은 억누르는 동안 오히려 더 자주 떠올랐다.", "icon": ""}}]}],
calculateResult(choices,principles){
  const cnt={isolation:0,distraction:0,anchoring:0,face:0};
  choices.forEach(c=>{const t=TYPE[c.choiceId];if(t)cnt[t]++;});
  let top=ORDER[0];ORDER.forEach(k=>{if(cnt[k]>cnt[top])top=k;});
  const r=RES[top];
  return {icon:'',label:r.label,title:r.title,desc:r.desc,stats:ORDER.filter(k=>cnt[k]).map(k=>({value:cnt[k]+'번',label:NAME[k]}))};
},
getShareText(t){return '죽음 리허설\n\n내가 가장 많이 쓴 장치: '+t+'\n\n사람은 죽음을 어떻게 피하며 사는가\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-death-rehearsal.html';}
};
