const RES={"E": {"title": "불똥이 엉뚱한 데로 튀는 사람", "body": "괴로우면 그 감정을 밖으로 내보냅니다. 당장 무너지지는 않지만, 불똥은 대개 가장 가까운 사람에게 튑니다.", "level": "베일런트의 분류로는 미숙한 쪽입니다.", "next": "목표로 삼을 방어기제는 승화입니다. 같은 화를 사람 대신 운동이나 일에 쏟는 것입니다.", "how": ["화가 나면 먼저 묻기. 이건 누구에게 난 화인가.", "진짜 상대에게 짧게 말하기. \"그 말에 나는 서운했어.\""]}, "I": {"title": "일단 서랍에 넣어 두는 사람", "body": "감당하기 힘든 일은 일단 안 봅니다. 충격은 줄지만, 서랍 속에서도 일은 그대로 자랍니다.", "level": "베일런트의 분류로는 미숙한 쪽입니다.", "next": "목표로 삼을 방어기제는 예견입니다. 피하던 일을 미리 들여다보고 대비하는 것입니다.", "how": ["피하고 싶은 사실을 한 문장으로 적기. \"나는 붙고 싶었고, 떨어졌다.\"", "확인하면 끝나는 일부터 확인하기."]}, "H": {"title": "멀쩡해 보이는 게 특기인 사람", "body": "올라온 감정을 분석으로, 친절로, 선물로 바꿔 감춥니다. 겉은 멀쩡하지만, 감정은 처리되지 않은 채 남습니다.", "level": "베일런트의 분류로는 미숙과 성숙의 중간입니다.", "next": "목표로 삼을 방어기제는 억제입니다. 감정을 감추지 않고, 알고서 꺼낼 때를 고르는 것입니다.", "how": ["감정에 이름 붙이기. \"지금 나 질투 나.\" 이름만 붙여도 감정이 누그러집니다.", "친절이나 미움이 유난히 크면, 반대 감정이 숨어 있는지 묻기."]}, "M": {"title": "아픔을 쓸 줄 아는 사람", "body": "괴로움을 피하지도, 남에게 돌리지도 않고 쓸 데로 돌립니다. 다만 힘든 티를 잘 안 내서, 주변이 모를 때가 많습니다.", "level": "베일런트의 분류로는 가장 성숙한 쪽입니다.", "next": "이런 방어기제를 쓴 사람들이 노년을 더 건강하고 만족스럽게 보냈습니다.", "how": ["미뤄 둔 감정엔 꺼낼 날을 정하기.", "농담으로 넘긴 일 중 아팠던 건, 한 사람에게라도 말하기."]}};

멀어지지 않는다.", "principle": {"name": "자기 관찰", "desc": "지금 내가 무엇을 느끼는지 알아차리고, 그 감정을 부정하지도 부풀리지도 않는 것이다. 정신의학의 방어기제 분류에서 가장 성숙한 단계에 들어간다.", "icon": ""}}, {"id": "sublim3", "text": "그 분함을 연료 삼아, 다음 준비를 바로 시작한다.", "meaning": "속 쓰린 밤마다 책을 편다. 질투를 없애지 않고 쓸 데로 돌렸다.\n\n다만 목표가 내가 원하는 것인지, 그 친구를 이기는 것인지는 가끔 확인해 볼 만하다.", "principle": {"name": "승화", "desc": "그대로 드러내면 문제가 될 충동이나 좌절을 쓸모 있는 일로 바꾸는 것이다. 분노를 운동으로, 질투를 공부로 돌리는 게 대표적이다. 베일런트는 이를 성숙한 방어기제로 꼽았다.", "icon": ""}}]}, {"badge": "불안", "title": "만져지는 멍울", "desc": "며칠 전부터 목에 작은 멍울이 만져진다. 아프지는 않다.", "highlight": "그다음 나는?", "choices": [{"id": "project4", "text": "내 얘기는 꺼내지 않고, 가족에게 \"건강 좀 챙기라\"고 잔소리한다.", "meaning": "가족의 야식과 담배가 오늘따라 유난히 눈에 걸린다.\n\n정작 병원에 안 가는 건 나다. 내 걱정을 남의 몫으로 옮겨 놓았다.", "principle": {"name": "투사", "desc": "내 안의 받아들이기 싫은 면을 남에게서 찾아내는 것이다. 내 결점이면 나를 탓해야 하지만, 남의 결점이면 그 사람을 탓하면 된다.", "icon": ""}}, {"id": "deny4", "text": "\"별거 아니겠지.\" 병원 가는 걸 자꾸 미룬다.", "meaning": "아프지도 않고, 바쁜 일만 끝나면 가면 된다. 그렇게 한 달이 지난다.\n\n충격은 피했지만, 인정하지 않는 동안엔 대처도 시작되지 않는다.", "principle": {"name": "부정", "desc": "감당할 수 없는 사실을 없는 일로 만드는 것이다. 정신과 의사 퀴블러로스가 만난 불치병 환자 대부분은 처음에 \"나일 리 없어\"라고 말했다. 충격은 줄지만 현실은 그대로다.", "icon": ""}}, {"id": "repress4", "text": "한번 만져 보고 만다. 며칠 지나니 그런 게 있었는지도 가물가물하다.", "meaning": "애써 피한 것도 아닌데 이상하게 생각이 안 난다.\n\n잊은 동안에도 불안은 남아, 괜한 뒤척임이나 예민함으로 새어 나온다.", "principle": {"name": "억압", "desc": "괴로운 생각을 자기도 모르게 의식 밖으로 밀어내는 것이다. 본인은 밀어낸 줄도 모른다. 프로이트는 밀어낸 것이 불안이나 꿈, 말실수로 새어 나온다고 봤다.", "icon": ""}}, {"id": "search4", "text": "밤새 증상과 확률을 검색하며 최악의 경우까지 따져 본다.", "meaning": "새벽 세 시, 아는 건 많아졌는데 잠은 더 안 온다.\n\n두려움을 정보로 바꿔 다루는 중이다. 정작 해야 할 일은 병원 예약 하나다.", "principle": {"name": "지성화", "desc": "감당하기 힘든 감정을 분석의 문제로 바꿔 머리로만 다루는 것이다. 사실은 다 받아들이면서 감정만 쏙 빼놓는다.", "icon": ""}}, {"id": "antici4", "text": "일단 병원부터 예약한다. 혹시 모를 경우도 찾아봤다.", "meaning": "검사 전날엔 여전히 불안하다. 그래도 무엇을 하면 되는지 아니까 덜 시끄럽다.\n\n다만 대비가 지나치면, 오지 않은 일을 미리 겪느라 오늘을 놓친다.", "principle": {"name": "예견", "desc": "닥칠 괴로움을 현실적으로 내다보고 미리 대비하는 것이다. 걱정만 하면 불안이 커지지만, 예견은 준비로 이어진다. 베일런트는 이를 성숙한 방어기제로 꼽았다.", "icon": ""}}]}, {"badge": "상처", "title": "그 말투", "desc": "명절, 아버지가 또 그 말투로 잔소리를 시작한다. 어릴 때 그렇게 듣기 싫던 바로 그 말투다.", "highlight": "그날 나는?", "choices": [{"id": "identify5", "text": "그 자리에선 참는다. 그런데 저녁에 동생에게 아버지와 똑같은 말투로 한소리 한다.", "meaning": "말을 뱉고서야 깨닫는다. 방금 그 말투, 어디서 많이 들었다.\n\n당하는 쪽은 무력하지만, 같은 말투를 쓰면 힘을 쥔 쪽에 선다. 그렇게 말투는 대물림된다.", "principle": {"name": "공격자와의 동일시", "desc": "나를 괴롭힌 사람의 태도를 닮아 가는 것이다. 시집살이를 겪은 며느리가 시어머니가 되어 똑같이 하는 게 대표적이다. 당하는 두려움을, 가하는 쪽에 서서 누른다.", "icon": ""}}, {"id": "actout5", "text": "참지 않고 그 자리에서 맞받아친다. 결국 언성이 높아진다.", "meaning": "하고 싶던 말은 했다. 그런데 명절 분위기는 얼어붙고, 아버지와는 또 몇 달 말이 없다.\n\n쌓인 감정이 말 대신 터지는 방식으로 나왔다.", "principle": {"name": "행동화", "desc": "참기 힘든 감정을 생각하거나 말로 풀기 전에, 충동적인 행동으로 바로 터뜨리는 것이다. 순간은 시원하지만 수습할 일이 남는다.", "icon": ""}}, {"id": "regress5", "text": "말없이 방에 들어가 문을 닫고 휴대폰만 본다. 열다섯 살 때처럼.", "meaning": "밖에선 멀쩡한데, 이 집에만 오면 사춘기로 돌아간다.\n\n익숙한 방식으로 버티는 동안, 아버지와의 대화도 그 나이에 멈춰 있다.", "principle": {"name": "퇴행", "desc": "힘들 때 어린 시절의 행동으로 돌아가는 것이다. 동생이 태어나자 다시 젖병을 찾는 첫째가 대표적이다.", "icon": ""}}, {"id": "altru5", "text": "아버지 말은 흘려듣고, 설거지하던 어머니 옆에서 \"신경 쓰지 마\" 하고 같이 그릇을 닦는다.", "meaning": "어머니가 피식 웃는다. 그 말을 하고 나니 내 속도 풀린다.\n\n내 상처를 남을 챙기는 쪽으로 돌렸다. 다만 아버지와의 일은 그대로 남아 있다.", "principle": {"name": "이타주의", "desc": "내가 겪은 고통을 남을 돕는 일로 바꾸는 것이다. 음주 운전으로 자식을 잃은 부모가 반대 운동에 나서는 게 대표적이다. 베일런트는 이를 성숙한 방어기제로 꼽았다.", "icon": ""}}]}],
calculateResult(choices,principles){
  const c={E:0,I:0,H:0,M:0};choices.forEach(x=>{const k=SIDE[x.choiceId];if(k)c[k]++;});
  const m=Math.max(c.E,c.I,c.H,c.M);const k=['E','I','H','M'].find(t=>c[t]===m);const r=RES[k];
  const used=[...new Set(choices.filter(x=>SIDE[x.choiceId]===k).map(x=>NAME[x.choiceId]))];
  const desc='나의 방어기제: '+used.join(' · ')+'\n\n'+r.body+'\n\n'+r.level+' '+r.next+'\n\n이렇게 해 보세요\n· '+r.how.join('\n· ')+'\n\n'+CLOSE;
  return {icon:'',label:'당신은',title:r.title,desc:desc,stats:[{value:c.E+'번',label:'밖으로'},{value:c.I+'번',label:'외면'},{value:c.H+'번',label:'감춤'},{value:c.M+'번',label:'다룸'}]};
},
getShareText(t){return '방어기제 시뮬레이터\n\n나는 '+t+'\n\n괴로울 때 나는 무엇으로 나를 지킬까?\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-defense.html';}
};
SimTemplate.init(CONFIG);
