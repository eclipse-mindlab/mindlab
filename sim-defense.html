const SIDE={"displace1": "E", "fantasy1": "I", "intellect1": "H", "suppress1": "M", "passive2": "E", "somatic2": "I", "undo2": "H", "humor2": "M", "split3": "E", "ration3": "I", "reaction3": "H", "sublim3": "M", "project4": "E", "deny4": "I", "repress4": "H", "antici4": "M", "identify5": "E", "regress5": "I", "altru5": "M"};
const NAME={"displace1": "전위", "fantasy1": "공상", "intellect1": "지성화", "suppress1": "억제", "passive2": "수동 공격", "somatic2": "신체화", "undo2": "취소", "humor2": "유머", "split3": "분열", "ration3": "합리화", "reaction3": "반동 형성", "sublim3": "승화", "project4": "투사", "deny4": "부정", "repress4": "억압", "antici4": "예견", "identify5": "공격자와의 동일시", "regress5": "퇴행", "altru5": "이타주의"};
const CLOSE='방어기제는 타고난 성격보다 습관에 가깝습니다. 베일런트가 수십 년 지켜본 사람들은 나이가 들수록 성숙한 방어기제를 더 많이 썼습니다.';
const RES={"E": {"title": "불똥이 엉뚱한 데로 튀는 사람", "level": "베일런트의 분류로는 미숙한 쪽에 가까운 방어기제입니다.", "body": "당장 무너지지 않는 법은 압니다. 괴로운 순간, 그 감정을 밖으로 내보내기 때문입니다. 화는 만만한 사람에게, 내 걱정은 남의 문제로, 싫다는 마음은 돌려 말하는 행동으로 나갑니다. 문제는 그 불똥이 대개 가장 가까운 사람에게 튄다는 것입니다.", "how": ["화가 나면 먼저 묻기. 이건 누구에게 난 화인가.", "진짜 상대에게 나를 주어로 짧게 말하기. \"그 말에 나는 서운했어.\" 상대를 탓하지 않고 내 감정을 전하는 '나 전달법'입니다.", "남의 단점이 유난히 거슬리는 날엔, 나에게도 그 면이 있는지 살피기."], "next": "목표로 삼을 성숙한 방어기제는 승화입니다. 같은 화를 사람 대신 운동이나 일에 쏟는 것입니다."}, "I": {"title": "일단 서랍에 넣어 두는 사람", "level": "베일런트의 분류로는 대부분 미숙한 방어기제입니다.", "body": "충격을 줄이는 데는 선수입니다. 감당하기 힘든 일 앞에서 그 일을 보지 않기 때문입니다. 별일 아니라고 믿거나, 그럴듯한 이유를 대거나, 상상 속으로 피하거나, 몸이 먼저 아파집니다. 문제는 서랍 속에서도 일은 그대로 자란다는 것입니다.", "how": ["피하고 싶은 사실을 한 문장으로 적기. \"나는 승진하고 싶었고, 못 했다.\"", "확인하면 끝나는 일부터 확인하기. 재검사 예약, 카드값 조회처럼.", "이유가 너무 쉽게 떠오르면 의심하기. 사람은 자기 선택의 진짜 이유를 모를 때도 그럴듯한 이유를 지어내고 그대로 믿습니다."], "next": "목표로 삼을 성숙한 방어기제는 예견입니다. 피하던 일을 미리 들여다보고, 대비를 시작하는 것입니다."}, "H": {"title": "멀쩡해 보이는 게 특기인 사람", "level": "베일런트의 분류로는 미숙과 성숙 사이, 중간 단계의 방어기제입니다.", "body": "겉으로는 가장 멀쩡해 보입니다. 올라온 감정을 다른 모양으로 바꾸기 때문입니다. 분석으로, 정반대의 친절로, 선물로, 망각으로. 문제는 감정이 처리되지 않은 채 그대로 남아 있다는 것입니다.", "how": ["감정에 이름 붙이기. \"지금 나는 질투가 난다.\" 이름만 붙여도 감정이 누그러진다는 연구가 있습니다.", "친절이나 미움이 유난히 크다 싶으면, 반대 감정이 숨어 있는지 묻기.", "하루에 한 번, 생각은 빼고 그날 느낀 감정만 적기."], "next": "목표로 삼을 성숙한 방어기제는 억제입니다. 감정을 다른 모양으로 바꾸지 않고, 알고서 꺼낼 때를 고르는 것입니다."}, "M": {"title": "아픔을 쓸 줄 아는 사람", "level": "베일런트의 분류로는 가장 성숙한 방어기제입니다. 그가 수십 년 추적한 사람들 가운데 이런 방어기제를 쓴 이들은 노년에 더 건강하고 만족스럽게 살았습니다.", "body": "괴로움을 모른 척하지도, 남에게 돌리지도 않고 쓸 데로 돌립니다. 때를 골라 감정을 꺼내고, 웃음으로 거리를 두고, 분함을 연료로 쓰고, 닥칠 일을 준비합니다. 다만 잘 다루는 사람일수록 힘든 티를 안 내서, 주변이 힘든 줄 모를 때가 많습니다.", "how": ["미뤄 둔 감정에는 기한 정하기. 언제 꺼낼지 정하지 않으면 쌓이기만 합니다.", "농담으로 넘긴 일 중 사실 아팠던 것은, 한 사람에게라도 털어놓기.", "남을 돕느라 내 슬픔을 건너뛰지 않았는지 살피기."], "next": "지금 자리를 지키면 됩니다. 성숙한 방어기제도 힘들 때는 미숙한 쪽으로 미끄러지곤 합니다."}};
const CONFIG={id:'defense',title:'방어기제 시뮬레이터',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-defense.html',version:5,
stages:[{"badge": "창피", "title": "모두 앞에서 깨진 기획안", "desc": "팀장이 회의에서 내 기획안을 모두 앞에서 조목조목 깼다. 틀린 말이 아니라서 더 분하다.", "highlight": "그날 나는?", "choices": [{"id": "displace1", "text": "집에 와서 괜히 말수가 줄고, 누가 말 걸면 퉁명스럽게 받는다.", "meaning": "팀장에게는 대들 수 없으니, 만만한 가족에게 날이 선다. 가족은 영문도 모른 채 눈치를 본다.\n\n화가 난 진짜 상대는 그대로고, 그날 저녁 식탁만 조용해졌다.", "principle": {"name": "전위", "desc": "감정을 진짜 상대 대신 만만한 상대에게 쏟는 것이다. 상사에게 혼나고 집에 와서 가족에게 소리 지르는 게 대표적이다. 진짜 상대에게 화를 내면 잃을 게 크니, 안전한 곳으로 감정을 옮긴다.", "icon": ""}}, {"id": "fantasy1", "text": "샤워하면서 그 팀장을 말로 꺾는 장면을 몇 번이고 돌려 본다.", "meaning": "머릿속에서는 완벽한 반박이 술술 나오고, 팀장은 할 말을 잃는다. 몇 번을 돌려 봐도 통쾌하다.\n\n다음 회의에서도 현실의 나는 아무 말도 못 한다.", "principle": {"name": "공상", "desc": "현실에서 이루지 못한 일을 머릿속에서 대신 이루는 것이다. 상상 속 승리는 잠깐 마음을 달래 주지만, 현실은 그대로 남는다.", "icon": ""}}, {"id": "intellect1", "text": "기분은 접어 두고, 지적받은 항목을 표로 깔끔하게 정리한다.", "meaning": "다음 날 수정안은 흠잡을 데가 없다. 다들 일 처리가 깔끔하다고 한다.\n\n그런데 그날의 창피함과 분함은 표 어디에도 없다. 감정은 정리되지 않고 잠시 치워 둔 것뿐이라, 비슷한 순간이 오면 다시 고개를 든다.", "principle": {"name": "지성화", "desc": "감당하기 힘든 감정을 생각과 분석의 문제로 바꿔 머리로만 다루는 것이다. 큰 병을 진단받고 감정은 제쳐 둔 채 통계와 논문만 파고드는 게 대표적이다. 사실은 다 받아들이면서 감정만 쏙 빼놓는다.", "icon": ""}}, {"id": "suppress1", "text": "회의 중엔 담담하게 듣고, 퇴근길에 친구한테 실컷 털어놓는다.", "meaning": "회의실에서는 버텼고, 퇴근길 통화에서 친구가 같이 욕해 준다. 집에 도착할 즈음엔 꽤 가벼워진다.\n\n화난 걸 알면서도 털어놓을 때와 상대를 골랐다. 다만 털어놓을 사람이 없는 날이 이어지면, 미뤄 둔 감정은 쌓이기만 한다.", "principle": {"name": "억제", "desc": "괴로운 감정을 알면서도, 해야 할 일을 마칠 때까지 일부러 미뤄 두는 것이다. 장례식장의 상주가 손님을 다 치르고 집에 와서야 우는 게 대표적이다. 억압은 자기도 모르게 밀어내지만, 억제는 다 알고서 때를 고른다. 정신과 의사 조지 베일런트는 이를 성숙한 방어기제로 꼽았다.", "icon": ""}}]}, {"badge": "부담", "title": "거절하기 애매한 부탁", "desc": "친한 친구가 주말에 이사를 도와 달라고 한다. 그 주말만큼은 정말 쉬고 싶었다. 그런데 친구라 거절하기도 애매하다.", "highlight": "그래서 나는?", "choices": [{"id": "passive2", "text": "알겠다고 해 놓고, 당일 늦게 가서 대충 돕다 온다.", "meaning": "약속은 지켰으니 할 말은 없다. 그런데 친구는 어딘가 서운하고, 나는 하루 종일 떨떠름한 얼굴이었다.\n\n싫다는 말을 행동으로 대신한 것이다. 다만 이 방식은 상대가 왜 서운한지도 모르게 만들고, 관계에 금만 남긴다.", "principle": {"name": "수동 공격", "desc": "싫다는 마음을 말로 하지 못하고 미루기, 깜빡하기, 대충 하기로 돌려서 드러내는 것이다. 겉으로는 시키는 대로 했으니 누구도 대놓고 탓하기 어렵다.", "icon": ""}}, {"id": "somatic2", "text": "가겠다고 해 놓고, 그 주 내내 몸이 찌뿌드드하더니 토요일 아침 진짜로 몸살이 난다.", "meaning": "꾀병이 아니다. 실제로 열이 난다. 그리고 아프니까 못 간다고 말할 명분이 생긴다.\n\n하기 싫은 일 앞에서마다 몸이 먼저 아프다면, 몸보다 마음을 먼저 살필 때다.", "principle": {"name": "신체화", "desc": "마음의 괴로움이 두통이나 복통 같은 몸의 증상으로 나타나는 것이다. 시험 날 아침마다 배가 아픈 게 대표적이다. 꾀병과 달리 실제로 아프고, 아프면 쉬어도 된다는 명분이 덤으로 따라온다.", "icon": ""}}, {"id": "undo2", "text": "결국 거절한다. 그리고 미안한 마음에 다음 날 비싼 커피 기프티콘을 보낸다.", "meaning": "거절한 건 잘한 일이다. 그런데 마음이 편치 않아, 기프티콘을 보내고서야 숨이 쉬어진다.\n\n거절을 선물로 지우려는 것이다. 다만 친구가 바란 건 커피가 아니었고, 나는 앞으로도 거절할 때마다 값을 치르게 된다.", "principle": {"name": "취소", "desc": "이미 한 행동이나 생각을 반대 행동으로 지우려는 것이다. 아이에게 화를 낸 뒤 괜히 선물을 사 주거나, 불길한 말을 하고 나서 퉤퉤 침 뱉는 시늉을 하는 게 대표적이다.", "icon": ""}}, {"id": "humor2", "text": "\"대신 짜장면은 네가 쏜다\" 하고 웃으며 간다.", "meaning": "쉬고 싶던 주말은 날아갔지만, 투덜거림을 농담으로 바꾸니 친구도 나도 웃으며 짐을 나른다.\n\n아쉽다는 말을 농담에 실어서 했다. 다만 늘 농담으로 넘기면, 정말 힘든 날에도 아무도 내가 힘든 줄 모른다.", "principle": {"name": "유머", "desc": "괴로운 현실을 인정하면서도 웃음으로 한 발 물러서는 것이다. 월요일 아침 교수대로 끌려가는 사형수가 \"이번 주는 시작이 좋군\" 하고 말하는 농담이 대표적이다. 현실을 모른 척하지 않으면서도 거기에 휘둘리지 않는다. 베일런트는 이를 성숙한 방어기제로 꼽았다.", "icon": ""}}]}, {"badge": "질투", "title": "먼저 승진한 동기", "desc": "같이 입사해 같이 고생한 동기가 먼저 승진했다. 축하할 일인 건 안다. 그런데 속이 쓰리다.", "highlight": "그 뒤로 나는?", "choices": [{"id": "split3", "text": "동기가 다르게 보인다. 같이 상사 욕하던 것까지 다 연기였던 것 같다.", "meaning": "어제까지 둘도 없던 동기가, 오늘은 처음부터 속을 감춘 사람으로 보인다. 지난 기억까지 그쪽으로 다시 쓰인다.\n\n좋은 동기라는 사실과 나를 앞지른 사람이라는 사실을 함께 품기 힘드니, 한쪽으로 정해 버렸다. 그렇게 좋은 동료 하나를 잃는다.", "principle": {"name": "분열", "desc": "사람을 완전히 좋은 사람과 완전히 나쁜 사람으로 나눠 보는 것이다. 한 사람에게 좋은 면과 나쁜 면이 함께 있다는 걸 견디기 힘드니, 둘 중 하나로 정해 버린다. 어제의 좋은 사람이 하루아침에 나쁜 사람이 되는 것도 그래서다.", "icon": ""}}, {"id": "ration3", "text": "\"승진하면 일만 많아지지. 난 오히려 다행이다.\"", "meaning": "그렇게 생각하니 속이 좀 편하다. 실제로 승진한 동기는 야근이 늘었다.\n\n다만 정말 다행이었다면 애초에 속이 쓰리지 않았을 것이다. 원하던 걸 못 얻었다고 인정하지 않는 동안에는, 왜 못 얻었는지도 따져 볼 수 없다.", "principle": {"name": "합리화", "desc": "원하던 걸 얻지 못했을 때 그럴듯한 이유를 붙여 마음을 편하게 만드는 것이다. 포도를 못 딴 여우가 \"어차피 시어서 못 먹어\"라고 하는 게 대표적이다. 거짓말과 다른 점은, 본인도 그 이유를 진심으로 믿는다는 것이다.", "icon": ""}}, {"id": "reaction3", "text": "괜히 내가 먼저 회식 날짜를 잡고, 누구보다 크게 박수를 친다. 집에 오는 길엔 기분이 묘하다.", "meaning": "동기는 고마워하고, 주변에서는 역시 쿨하다고 한다.\n\n축하가 유난히 컸다면, 그만큼 덮어야 할 감정도 컸을 수 있다. 회식이 끝나고 혼자 남으면 쓰린 속은 그대로다.", "principle": {"name": "반동 형성", "desc": "받아들이기 힘든 감정을 정반대 감정으로 덮는 것이다. 좋아하는 여자아이를 괴롭히는 남자아이가 대표적이다. 반대 감정을 부풀려야 원래 감정이 가려지니, 대개 지나친 모습으로 나타난다. 지나친 친절이나 지나친 미움 뒤에는 그 반대 감정이 숨어 있을 수 있다.", "icon": ""}}, {"id": "sublim3", "text": "그 분함을 연료 삼아, 미뤄 둔 자격증 공부를 시작한다.", "meaning": "속 쓰린 밤마다 책을 편다. 몇 달 뒤엔 내 이력에도 한 줄이 생긴다.\n\n질투를 없애려 하지 않고 쓸 데로 돌렸다. 다만 이 연료는 누군가를 이기고 싶은 마음에서 나왔다. 목표가 정말 내가 원하는 것인지, 그 동기를 이기는 것인지는 가끔 확인해 볼 만하다.", "principle": {"name": "승화", "desc": "그대로 드러내면 문제가 될 충동이나 좌절을 사회가 반기는 일로 바꾸는 것이다. 분노를 운동으로, 질투를 공부로 돌리는 게 대표적이다. 베일런트는 이를 성숙한 방어기제로 꼽았다.", "icon": ""}}]}, {"badge": "불안", "title": "재검사 통보", "desc": "건강검진 결과가 나왔다. 한 항목에 '재검사 필요'라고 적혀 있다.", "highlight": "그다음 나는?", "choices": [{"id": "project4", "text": "내 결과지 얘기는 꺼내지 않고, 아버지 담배만 붙잡고 \"그러다 큰일 난다\"고 몰아붙인다.", "meaning": "아버지 담배가 오늘따라 유난히 눈에 걸린다. 잔소리가 길어진다.\n\n정작 건강을 안 챙긴 건 나였다. 내 걱정을 아버지 몫으로 옮겨 놓으니, 나는 걱정하는 쪽에 설 수 있다.", "principle": {"name": "투사", "desc": "내 안의 받아들이기 싫은 면을 남에게서 찾아내는 것이다. 내 결점을 인정하면 나를 탓해야 하지만, 남의 결점으로 보면 그 사람을 탓하면 된다. 실제로 자기 결점을 떠올리지 않으려 애쓴 사람일수록 남에게서 그 결점을 더 많이 찾아냈다.", "icon": ""}}, {"id": "deny4", "text": "\"별일 아니겠지.\" 재검사 날짜를 자꾸 미룬다.", "meaning": "예전에도 비슷한 수치가 나왔지만 괜찮았다. 바쁜 일만 끝나면 가겠다고 생각한다. 그렇게 석 달이 지난다.\n\n충격을 줄이는 데는 효과가 있다. 다만 인정하지 않는 동안에는 대처도 시작할 수 없다. 별일이 아니었다면 하루면 확인하고 끝났을 일이다.", "principle": {"name": "부정", "desc": "감당할 수 없는 사실을 없는 일로 만드는 것이다. 정신과 의사 퀴블러로스가 만난 불치병 환자 대부분이 가장 먼저 꺼낸 말은 \"아니야, 나일 리 없어\"였다. 충격은 줄여 주지만, 인정하지 않는 동안에는 대처도 시작할 수 없다.", "icon": ""}}, {"id": "repress4", "text": "결과지를 서랍에 넣는다. 며칠 지나니 그런 게 있었는지도 가물가물하다.", "meaning": "애써 피한 것도 아닌데 이상하게 생각이 나지 않는다. 몇 달 뒤 서랍을 정리하다 결과지를 보고 깜짝 놀란다.\n\n잊은 동안에도 불안은 사라지지 않았다. 이유 모를 뒤척임이나 괜한 예민함으로 새어 나왔을 수 있다.", "principle": {"name": "억압", "desc": "떠올리기 괴로운 기억이나 생각을 자기도 모르게 의식 밖으로 밀어내는 것이다. 본인은 밀어냈다는 사실조차 모른다. 프로이트는 밀어낸 것이 사라지지 않고 이유 모를 불안이나 꿈, 말실수로 새어 나온다고 봤다.", "icon": ""}}, {"id": "antici4", "text": "일단 재검사 예약부터 해 둔다. 결과가 나쁘면 어떻게 할지도 찾아봤다.", "meaning": "검사 전날 밤에도 불안하긴 하다. 그래도 어떤 치료를 받는지, 회사에는 어떻게 말할지 알아 두니 머릿속이 덜 시끄럽다.\n\n걱정을 준비로 바꿨다. 다만 대비가 지나치면, 오지 않은 일을 미리 겪느라 오늘을 놓친다.", "principle": {"name": "예견", "desc": "앞으로 닥칠 괴로움을 현실적으로 내다보고 미리 대비하는 것이다. 큰 수술을 앞두고 수술 뒤에 얼마나 아플지 알아보며 마음의 준비를 해 두는 게 대표적이다. 걱정에 빠져 있기만 하면 불안만 커지지만, 예견은 준비로 이어진다. 베일런트는 이를 성숙한 방어기제로 꼽았다.", "icon": ""}}]}, {"badge": "상처", "title": "그 말투", "desc": "명절, 본가. 아버지가 또 그 말투로 잔소리를 시작한다. 어릴 때 그렇게 듣기 싫던 바로 그 말투다.", "highlight": "그날 나는?", "choices": [{"id": "identify5", "text": "그 자리에선 참는다. 그런데 저녁에 깐족대는 동생에게 아버지와 똑같은 말투로 한소리 한다.", "meaning": "말을 뱉고 나서야 깨닫는다. 방금 그 말투, 어디서 많이 들었다.\n\n당하는 쪽에 있으면 무력하지만, 같은 말투를 쓰면 힘을 쥔 쪽에 서게 된다. 다만 그렇게 대물림된 말투는 다음 사람에게 같은 상처를 남긴다.", "principle": {"name": "공격자와의 동일시", "desc": "나를 괴롭힌 사람의 태도를 닮아 가는 것이다. 혹독한 시집살이를 한 며느리가 시어머니가 되어 똑같이 하고, 괴롭힘당하던 후임이 선임이 되어 똑같이 괴롭힌다. 당하는 쪽에 있으면 두렵지만, 가하는 쪽이 되면 그 두려움을 내가 쥐게 된다.", "icon": ""}}, {"id": "regress5", "text": "말없이 방에 들어가 문을 닫고 휴대폰만 본다. 열다섯 살 때처럼.", "meaning": "밖에서는 멀쩡한 어른인데, 이 집에만 오면 사춘기로 돌아간다. 밥 먹으라고 부를 때까지 나오지 않는다.\n\n익숙한 방식으로 버티는 동안, 아버지와 나의 대화도 열다섯 살에 멈춰 있다.", "principle": {"name": "퇴행", "desc": "힘든 일이 닥쳤을 때 어린 시절의 행동으로 돌아가는 것이다. 동생이 태어나면 대소변을 가리던 첫째가 다시 이불에 실수하거나 젖병을 찾는 일이 흔하다. 어른도 지치면 어릴 적 방식으로 버틴다.", "icon": ""}}, {"id": "altru5", "text": "아버지 말은 흘려듣고, 설거지하던 어머니 옆에 가서 \"아까 그 말 신경 쓰지 마\" 하고 같이 그릇을 닦는다.", "meaning": "어머니가 피식 웃는다. 그 말을 하고 나니 내 속도 조금 풀린다.\n\n그 말투에 다친 건 나만이 아니었다. 내 상처를 다른 사람을 챙기는 쪽으로 돌렸다. 다만 아버지와의 일은 여전히 그 자리에 있다.", "principle": {"name": "이타주의", "desc": "내가 겪은 고통을 남을 돕는 일로 바꾸는 것이다. 음주 운전 사고로 자식을 잃은 부모가 음주 운전 반대 운동에 나서는 게 대표적이다. 베일런트는 이를 성숙한 방어기제로 꼽았다.", "icon": ""}}]}],
calculateResult(choices,principles){
  const c={E:0,I:0,H:0,M:0};choices.forEach(x=>{const k=SIDE[x.choiceId];if(k)c[k]++;});
  const m=Math.max(c.E,c.I,c.H,c.M);const k=['E','I','H','M'].find(t=>c[t]===m);const r=RES[k];
  const used=choices.filter(x=>SIDE[x.choiceId]===k).map(x=>NAME[x.choiceId]);
  const desc='나의 방어기제: '+used.join(' · ')+'\n\n'+r.body+'\n\n'+r.level+' '+r.next+'\n\n이렇게 해 보세요\n· '+r.how.join('\n· ')+'\n\n'+CLOSE;
  return {icon:'',label:'당신은',title:r.title,desc:desc,stats:[{value:c.E+'번',label:'밖으로'},{value:c.I+'번',label:'외면'},{value:c.H+'번',label:'감춤'},{value:c.M+'번',label:'다룸'}]};
},
getShareText(t){return '방어기제 시뮬레이터\n\n나는 '+t+'\n\n괴로울 때 나는 무엇으로 나를 지킬까?\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-defense.html';}
};
SimTemplate.init(CONFIG);
document.getElementById('saveImageBtn').addEventListener('click',()=>{const c=document.getElementById('shareCanvas'),x=c.getContext('2d');c.width=800;c.height=420;x.fillStyle='#140a20';x.fillRect(0,0,800,420);x.textAlign='center';x.font='16px sans-serif';x.fillStyle='#b4a5c8';x.fillText('방어기제 시뮬레이터',400,130);x.font='bold 52px serif';x.fillStyle='#f6eef4';x.fillText(document.getElementById('resultTitle').textContent,400,210);x.font='14px sans-serif';x.fillStyle='#7c6b93';x.fillText('eclipse-mindlab.github.io/mindlab',400,380);EclipseSaveImage(c,'방어기제_결과.png');});
  </script>
