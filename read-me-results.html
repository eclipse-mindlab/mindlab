<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도전 현황 - 나를 읽어봐</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6f5fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0d14" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="eclipse.css">
  <style>
    /* 도전 현황: the creator reads how well friends read them. */
    body { word-break: keep-all; overflow-wrap: anywhere; }
    .container { max-width: var(--col); margin: 0 auto; padding: 0 20px 64px; }

    /* top bar */
    .header { display: flex; align-items: center; gap: 10px; height: 64px; }
    .back-btn {
      width: 36px; height: 36px; margin-left: -8px; border-radius: 50%;
      display: grid; place-items: center; color: var(--mist); flex: none;
    }
    .back-btn:hover { color: var(--moon); }
    .back-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .top-logo { width: 26px; height: 26px; border-radius: 50%; flex: none; }
    .header-title { font-family: var(--serif); font-size: 19px; letter-spacing: -.01em; font-weight: 700;}
    .top-aside { margin-left: auto; font-size: 13px; color: var(--mist); }
    .top-aside:hover { color: var(--moon); }

    /* toast */
    .toast {
      position: fixed; left: 50%; bottom: 96px; z-index: 100;
      transform: translateX(-50%);
      background: var(--night-3); color: var(--moon);
      padding: 10px 18px; border-radius: 999px; font-size: 14px; white-space: nowrap;
      box-shadow: inset 0 0 0 1px var(--line);
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* loading */
    .loading-spinner {
      width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
      border: 1.5px solid var(--line); border-top-color: var(--mist);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--dim); font-size: 14px; }

    .ecl-btn.wide { width: 100%; height: 52px; font-size: 16px; }
    .ecl-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .ecl-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .kicker { font-size: 13px; color: var(--mist); }
    .serif-title { font-family: var(--serif); font-weight: 700; letter-spacing: -.02em; line-height: 1.3; }
    .loading-screen { text-align: center; padding: 120px 0; }

    .error-screen { display: none; padding: 56px 0 0; }
    .error-title { font-size: 28px; }
    .error-desc { margin: 10px 0 28px; color: var(--mist); font-size: 14.5px; }
    .share-link-btn { width: 100%; height: 50px; }

    .main-content { display: none; }

    /* summary: the average as the one big number */
    .summary-card { padding: 22px 0 8px; }
    .summary-title { font-size: 28px; overflow-wrap: anywhere; }
    .summary-subtitle { margin-top: 4px; font-size: 14.5px; color: var(--mist); }
    .summary-stats { display: flex; flex-wrap: wrap; align-items: baseline; margin-top: 26px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .summary-stat { display: flex; align-items: baseline; gap: 6px; }
    .summary-stat-value { font-family: var(--serif); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; font-size: 22px; }
    .summary-stat-label { font-size: 13px; color: var(--dim); }
    .summary-stat + .summary-stat { margin-left: 18px; padding-left: 18px; border-left: 1px solid var(--line); }
    .summary-stat.lead { width: 100%; flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 18px; }
    .summary-stat.lead .summary-stat-value { font-size: 96px; letter-spacing: -.04em; }
    .summary-stat.lead .summary-stat-label { font-size: 13.5px; color: var(--mist); }
    .summary-stat.lead + .summary-stat { margin-left: 0; padding-left: 0; border-left: 0; }

    /* ranking rows */
    .ranking-section { margin-top: 40px; }
    .ranking-header { font-family: var(--serif); font-size: 21px; padding-bottom: 8px; font-weight: 700;}
    .ranking-list { border-top: 1px solid var(--line); }
    .ranking-item { display: flex; align-items: center; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .ranking-position { width: 22px; flex: none; font-family: var(--serif); font-size: 19px; color: var(--dim); font-variant-numeric: tabular-nums; font-weight: 700;}
    .ranking-position.gold { color: var(--moon); }
    .ranking-info { flex: 1; min-width: 0; }
    .ranking-name { font-size: 15.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ranking-time { font-size: 12.5px; color: var(--dim); }
    .ranking-score { font-family: var(--serif); font-size: 24px; font-variant-numeric: tabular-nums; font-weight: 700;}
    .ranking-score.perfect { color: var(--ok); }

    .empty-state { padding: 36px 0 28px; }
    .empty-icon { display: none; }
    .empty-title { font-family: var(--serif); font-size: 21px; font-weight: 700;}
    .empty-desc { margin-top: 4px; font-size: 14px; color: var(--mist); }

    .action-section { margin-top: 28px; }
    .action-btn { width: 100%; height: 52px; font-size: 16px; }
    .action-btn.success { box-shadow: inset 0 0 0 1px var(--ok); color: var(--ok); background: transparent; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
      <img src="logo.png" alt="" class="top-logo">
      <div class="header-title">도전 현황</div>
    </div>

    <!-- 로딩 -->
    <div class="loading-screen" id="loadingScreen">
      <div class="loading-spinner"></div>
      <div class="loading-text">불러오는 중...</div>
    </div>

    <!-- 에러 -->
    <div class="error-screen" id="errorScreen">
      <h1 class="error-title serif-title">도전장을 찾을 수 없어요</h1>
      <p class="error-desc">링크가 잘못됐거나 사라진 도전장이에요.</p>
      <a href="read-me.html" class="share-link-btn ecl-btn">새 도전장 만들기</a>
    </div>

    <!-- 메인 -->
    <div class="main-content" id="mainContent">
      <div class="summary-card">
        <h1 class="summary-title serif-title" id="summaryTitle">???의 도전장</h1>
        <div class="summary-subtitle">누가 나를 가장 잘 알까?</div>
        <div class="summary-stats">
          <div class="summary-stat lead">
            <div class="summary-stat-value" id="avgScore">0%</div>
            <div class="summary-stat-label">친구들 평균 점수</div>
          </div>
          <div class="summary-stat">
            <div class="summary-stat-value" id="totalAttempts">0</div>
            <div class="summary-stat-label">명 도전</div>
          </div>
          <div class="summary-stat">
            <div class="summary-stat-value" id="perfectCount">0</div>
            <div class="summary-stat-label">명 만점</div>
          </div>
        </div>
      </div>

      <div class="ranking-section">
        <div class="ranking-header">도전한 친구들</div>
        <div class="ranking-list" id="rankingList">
          <!-- 동적 생성 -->
        </div>
      </div>

      <div class="action-section">
        <button class="action-btn ecl-btn" id="shareLinkBtn">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          도전 링크 다시 공유하기
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">복사했어요</div>


  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDZ-NATGNFjQ90gswfebIV-0xqhps68qJM",
      authDomain: "eclipse-mindlab.firebaseapp.com",
      projectId: "eclipse-mindlab",
      storageBucket: "eclipse-mindlab.firebasestorage.app",
      messagingSenderId: "181450990304",
      appId: "1:181450990304:web:3043d3857815249f53e685"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    const urlParams = new URLSearchParams(window.location.search);
    const challengeId = urlParams.get('id');

    async function init() {
      if (!challengeId) {
        showError();
        return;
      }

      try {
        const docRef = doc(db, 'challenges', challengeId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          showError();
          return;
        }

        const data = docSnap.data();
        showResults(data);
      } catch (error) {
        console.error('Error:', error);
        showError();
      }
    }

    function showError() {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('errorScreen').style.display = 'block';
    }

    function showResults(data) {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';

      const creatorName = data.creatorName || '???';
      const results = data.results || [];

      // 요약
      document.getElementById('summaryTitle').textContent = `${creatorName}의 도전장`;
      document.getElementById('totalAttempts').textContent = results.length;

      if (results.length > 0) {
        const avgScore = Math.round(results.reduce((sum, r) => sum + r.score, 0) / results.length);
        const perfectCount = results.filter(r => r.score === 100).length;
        
        document.getElementById('avgScore').textContent = `${avgScore}%`;
        document.getElementById('perfectCount').textContent = perfectCount;

        // 랭킹 (점수 높은 순, 같으면 먼저 한 사람)
        const sorted = [...results].sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          return new Date(a.timestamp) - new Date(b.timestamp);
        });

        const rankingHtml = sorted.map((r, idx) => {
          let positionClass = '';
          let positionText = idx + 1;
          
          if (idx === 0) {
            positionClass = 'gold';
            positionText = 1;
          } else if (idx === 1) {
            positionClass = 'silver';
            positionText = 2;
          } else if (idx === 2) {
            positionClass = 'bronze';
            positionText = 3;
          }

          const timeAgo = getTimeAgo(r.timestamp);
          const scoreClass = r.score === 100 ? 'perfect' : '';

          return `
            <div class="ranking-item">
              <div class="ranking-position ${positionClass}">${positionText}</div>
              <div class="ranking-info">
                <div class="ranking-name">${r.name}</div>
                <div class="ranking-time">${timeAgo}</div>
              </div>
              <div class="ranking-score ${scoreClass}">${r.score}%</div>
            </div>
          `;
        }).join('');

        document.getElementById('rankingList').innerHTML = rankingHtml;
      } else {
        // 아직 도전자 없음
        document.getElementById('rankingList').innerHTML = `
          <div class="empty-state">
            <div class="empty-title">아직 도전자가 없어요</div>
            <div class="empty-desc">아래 버튼으로 링크를 복사해 친구에게 보내 보세요.</div>
          </div>
        `;
      }

      // 공유 버튼
      document.getElementById('shareLinkBtn').addEventListener('click', () => {
        const url = `https://eclipse-mindlab.github.io/mindlab/read-me-challenge.html?id=${challengeId}`;
        const text = `날 안다고 생각해?\n맞춰봐 👀\n\n🔮 도전하기\n${url}`;
        
        navigator.clipboard.writeText(text).then(() => {
          showToast('링크를 복사했어요');
          const btn = document.getElementById('shareLinkBtn');
          btn.classList.add('success');
          btn.innerHTML = '복사했어요';
          setTimeout(() => {
            btn.classList.remove('success');
            btn.innerHTML = `
              <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
              도전 링크 다시 공유하기
            `;
          }, 2000);
        });
      });
    }

    function getTimeAgo(timestamp) {
      const now = new Date();
      const then = new Date(timestamp);
      const diff = Math.floor((now - then) / 1000);

      if (diff < 60) return '방금 전';
      if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
      if (diff < 604800) return `${Math.floor(diff / 86400)}일 전`;
      
      return then.toLocaleDateString('ko-KR');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    init();
  </script>
</body>
</html>
