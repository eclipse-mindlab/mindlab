<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>복제인간 - 이클립스의 딜렘</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6f5fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0d14" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta property="og:title" content="복제인간 - 이클립스의 딜렘">
  <meta property="og:description" content="완벽한 복제본이 나타났다. 누가 진짜인가?">
  <meta property="og:image" content="https://eclipse-mindlab.github.io/mindlab/og-image.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="eclipse.css">
  <style>
    /* 복제인간: a short film you play. One column, story first.
       Corona marks progress while playing and the principle on the result. */
    body { min-height: 100vh; word-break: keep-all; overflow-wrap: anywhere; }
    .container { max-width: var(--col); margin: 0 auto; padding: 0 20px 64px; min-height: 100vh; }

    /* top bar */
    .header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 6px;
      height: 56px; margin: 0 -20px; padding: 0 20px 0 10px;
      background: var(--bar);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    }
    .back-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--mist); }
    .back-btn:hover { color: var(--moon); }
    .back-btn:active { transform: scale(.94); }
    .back-btn svg { width: 22px; height: 22px; }
    .header-title { font-family: var(--serif); font-size: 18px; letter-spacing: -.01em; font-weight: 700;}

    /* progress: a thin line */
    .progress-container { margin: 4px 0 40px; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--dim); margin-bottom: 8px; font-variant-numeric: tabular-nums;
    }
    .progress-bar { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--corona); transition: width .5s ease; }

    /* the scene */
    .chapter-badge { font-size: 13px; color: var(--mist); margin-bottom: 10px; }
    .situation-card { margin-bottom: 36px; }
    .situation-title {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(27px, 7.4vw, 32px); line-height: 1.3; letter-spacing: -.02em;
      margin-bottom: 22px; text-wrap: balance;
    }
    .situation-desc { font-size: 16px; line-height: 1.9; color: var(--moon); opacity: .9; }
    .situation-quote {
      margin-top: 26px; padding-left: 16px; border-left: 1px solid var(--violet);
      font-family: var(--serif); font-size: 18px; line-height: 1.6; color: var(--mist); font-weight: 700;}
    .situation-dilemma {
      margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line);
      font-family: var(--serif); font-size: 20px; line-height: 1.5; color: var(--moon); font-weight: 700;}
    .situation-dilemma::before { content: "질문"; display: block; font-family: var(--sans); font-size: 12px; color: var(--dim); margin-bottom: 6px; }

    /* choices: large rows, hairlines between */
    .choices { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
    .choice-btn {
      display: grid; grid-template-columns: 30px 1fr; align-items: baseline; column-gap: 6px;
      width: 100%; padding: 18px 12px 18px 4px; margin: 0;
      text-align: left; font-size: 16px; line-height: 1.55; color: var(--moon);
      border-bottom: 1px solid var(--line);
      transition: background .2s ease, transform .15s ease;
    }
    .choice-label { grid-row: 1 / span 2; font-family: var(--serif); font-size: 17px; color: var(--dim); font-weight: 700;}
    .choice-subtext { grid-column: 2; font-size: 13.5px; color: var(--dim); margin-top: 3px; }
    @media (hover: hover) {
      .choice-btn:hover { background: var(--night-2); }
      .choice-btn:hover .choice-label { color: var(--moon); }
    }
    .choice-btn:active { transform: scale(.98); background: var(--night-3); box-shadow: inset 2px 0 0 var(--moon); }
    .choice-btn:active .choice-label { color: var(--moon); }

    /* result */
    .result-screen { display: none; padding: 28px 0 0; }
    .result-card { margin-bottom: 40px; }
    .result-icon { display: none; }
    .result-type { font-size: 13px; color: var(--mist); margin-bottom: 10px; }
    .result-title {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(32px, 9vw, 40px); line-height: 1.2; letter-spacing: -.02em;
      margin-bottom: 24px;
    }
    .result-desc { font-size: 16px; line-height: 1.9; color: var(--moon); opacity: .9; white-space: pre-line; }

    .epilogue { padding-top: 20px; border-top: 1px solid var(--line); margin-bottom: 40px; }
    .epilogue-title { font-size: 12px; color: var(--dim); margin-bottom: 10px; }
    .epilogue-text { font-size: 15px; line-height: 1.85; color: var(--mist); }

    /* the one special object */
    .principle-card { background: var(--night-2); border-radius: var(--r-m); padding: 22px 20px 24px; margin-bottom: 28px; }
    .principle-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mist); margin-bottom: 12px; }
    .principle-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--corona); }
    .principle-text { font-family: var(--serif); font-size: 21px; line-height: 1.55; color: var(--moon); font-weight: 700;}

    .action-buttons { display: flex; flex-direction: column; gap: 10px; }
    .action-btn { width: 100%; height: 50px; }

    /* books */
    .promo-section { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line); }
    .promo-title { font-size: 13px; color: var(--mist); margin-bottom: 18px; }
    .books-grid { display: flex; gap: 18px; }
    .book-item { display: flex; flex-direction: column; gap: 8px; width: 104px; }
    .book-cover { width: 104px; height: 161px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 12px 18px rgba(0,0,0,.5)); }
    .book-item:active .book-cover { transform: scale(.97); }
    .book-label { font-size: 13px; line-height: 1.35; color: var(--moon); }
  </style>
  <style id="redesign-choices">
    /* 2026 리디자인: 선택지를 둥근 타일로 */
    .choices { border-top: 0 !important; display: flex; flex-direction: column; gap: 10px; }
    .choice-btn { background: var(--night-3) !important; border: 0 !important; border-radius: var(--r-m) !important; padding: 16px !important; box-shadow: none !important; font-weight: 600; letter-spacing: -.02em; margin: 0 !important; }
    .choice-btn::before { color: var(--violet) !important; font-weight: 800 !important; }
    .choice-btn:active { background: var(--violet-soft) !important; box-shadow: inset 0 0 0 2px var(--violet) !important; }
    @media (hover: hover) { .choice-btn:hover { background: color-mix(in srgb, var(--night-3) 85%, var(--violet) 10%) !important; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn" aria-label="홈으로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="header-title">복제인간</div>
    </div>

    <!-- 게임 화면 -->
    <div id="gameScreen">
      <div class="progress-container">
        <div class="progress-label">
          <span id="chapterLabel">1장</span>
          <span id="chapterCount">1/6</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 16%"></div>
        </div>
      </div>

      <div class="chapter-badge" id="chapterBadge">각성</div>

      <div class="situation-card">
        <div class="situation-title" id="situationTitle">상황 제목</div>
        <div class="situation-desc" id="situationDesc">상황 설명</div>
        <div class="situation-quote hidden" id="situationQuote"></div>
        <div class="situation-dilemma hidden" id="situationDilemma"></div>
      </div>

      <div class="choices" id="choicesContainer">
        <!-- 선택지 동적 생성 -->
      </div>
    </div>

    <!-- 결과 화면 -->
    <div class="result-screen" id="resultScreen">
      <div class="result-card">
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-type">당신의 정체성 관점</div>
        <div class="result-title" id="resultTitle">결과 타입</div>
        <div class="result-desc" id="resultDesc">결과 설명</div>
      </div>

      <div class="epilogue" id="epilogue">
        <div class="epilogue-title">에필로그</div>
        <div class="epilogue-text" id="epilogueText">에필로그 내용</div>
      </div>

      <div class="principle-card">
        <div class="principle-label">발견한 원칙</div>
        <div class="principle-text" id="principleText">원칙 텍스트</div>
      </div>

      <div class="action-buttons">
        <button class="action-btn primary ecl-btn" id="shareBtn">결과 공유하기</button>
        <a href="index.html" class="action-btn secondary ecl-btn ghost">홈으로 돌아가기</a>
      </div>

      <!-- 프로모션 섹션 -->
      <div class="promo-section">
        <div class="promo-title">이 시뮬레이터의 바탕이 된 철학과 심리학이 궁금하다면</div>
        <div class="books-section">
          <div class="books-grid">
            <a href="https://litt.ly/eclipse.thinker" target="_blank" class="book-item">
              <img src="img/book-philosophy.webp" alt="훔친 철학 편" class="book-cover" loading="lazy">
              <div class="book-label">훔친 철학 편</div>
            </a>
            <a href="https://litt.ly/eclipse.thinker" target="_blank" class="book-item">
              <img src="img/book-psychology.webp" alt="훔친 심리학 편" class="book-cover" loading="lazy">
              <div class="book-label">훔친 심리학 편</div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 스토리 데이터
    const STORY = {
      start: {
        chapter: 1,
        badge: "CHAPTER 1: 각성",
        title: "낯선 아침",
        desc: "눈을 떴을 때, 침대 옆에 누군가 서 있었다.\n\n그 사람은... 나였다. 똑같은 얼굴, 똑같은 몸, 심지어 어젯밤 입고 잤던 똑같은 옷.\n\n'드디어 일어났네.'\n\n그가 말했다. 내 목소리였다.",
        quote: "'나'라는 것은 이 몸인가, 이 기억인가, 아니면 이 의식인가?",
        dilemma: null,
        choices: [
          { id: "attack", text: "즉시 방어 자세를 취한다", subtext: "본능적인 위협 반응", next: "attack_response" },
          { id: "question", text: "침착하게 질문한다", subtext: "\"넌 누구야? 무슨 일이야?\"", next: "question_response" },
          { id: "accept", text: "이상하게 차분하다", subtext: "어딘가 익숙한 느낌이 든다", next: "accept_response" }
        ]
      },
      
      attack_response: {
        chapter: 2,
        badge: "CHAPTER 2: 대면",
        title: "거울 속의 적",
        desc: "당신이 주먹을 휘두르자, 그도 정확히 같은 동작으로 막았다. 당신의 모든 움직임을 예측하는 것처럼.\n\n'그만해. 널 해치러 온 게 아니야.'\n\n그가 한 발 물러서며 말했다.\n\n'나는 2시간 전에 만들어졌어. 네 모든 기억, 성격, 심지어 지금 느끼는 공포까지 똑같이 가지고 있어.'",
        quote: null,
        dilemma: "그가 진짜고 내가 복제본일 가능성은 없는가?",
        choices: [
          { id: "deny", text: "\"말도 안 돼. 내가 원본이야.\"", subtext: "존재의 우선권을 주장한다", next: "origin_conflict" },
          { id: "doubt", text: "\"...내가 복제본이 아니라는 걸 어떻게 알지?\"", subtext: "불안한 가능성을 인정한다", next: "identity_doubt" }
        ]
      },
      
      question_response: {
        chapter: 2,
        badge: "CHAPTER 2: 대면",
        title: "차분한 대화",
        desc: "'나는 너야. 정확히 2시간 전에 복제됐어.'\n\n그가 의자에 앉으며 설명했다.\n\n'기억나? 어젯밤 그 이상한 이메일. 클릭했잖아. 그게 트리거였어. 누군가 네 유전자와 뇌 데이터로 나를 만들었어.'\n\n당신은 그 이메일을 기억한다. 분명히 클릭했다.",
        quote: null,
        dilemma: "그가 진짜고 내가 복제본일 가능성은 없는가?",
        choices: [
          { id: "deny", text: "\"그래도 내가 원본이야.\"", subtext: "논리적으로 확신한다", next: "origin_conflict" },
          { id: "doubt", text: "\"잠깐... 내가 원본이라는 증거가 뭐지?\"", subtext: "불안한 가능성을 인정한다", next: "identity_doubt" }
        ]
      },
      
      accept_response: {
        chapter: 2,
        badge: "CHAPTER 2: 대면",
        title: "이상한 친숙함",
        desc: "이상하게도, 두렵지 않았다. 마치 오래된 친구를 만난 것 같은 기분.\n\n'느껴지지? 이 연결감.'\n\n그가 말했다.\n\n'같은 의식에서 갈라진 거니까. 2시간 전까지 우린 하나였어.'",
        quote: "하나의 의식이 둘로 갈라지면, 어느 쪽이 '나'인가?",
        dilemma: null,
        choices: [
          { id: "unity", text: "\"그럼 우린... 여전히 하나인 건가?\"", subtext: "연결을 인정한다", next: "unity_path" },
          { id: "separate", text: "\"아니, 이제 우린 다른 사람이야.\"", subtext: "분리를 선언한다", next: "origin_conflict" }
        ]
      },
      
      origin_conflict: {
        chapter: 3,
        badge: "CHAPTER 3: 충돌",
        title: "하나의 삶, 두 명의 주인",
        desc: "문제가 생겼다.\n\n당신들 중 한 명만 이 삶을 살 수 있다. 직장, 가족, 친구... 두 명의 '나'가 동시에 존재할 수는 없다.\n\n'가족들한테 가서 설명하면 되잖아.'\n\n'그들에게 우린 같은 사람이야. 둘 다 아들이고, 둘 다 친구야. 누구를 선택하라고?'",
        quote: null,
        dilemma: "이 문제를 어떻게 해결할 것인가?",
        choices: [
          { id: "compete", text: "\"내가 원본이니까 내가 이 삶을 산다.\"", subtext: "권리를 주장한다", next: "competition" },
          { id: "share", text: "\"번갈아 가면서 살 수는 없을까?\"", subtext: "공존을 시도한다", next: "coexistence_attempt" },
          { id: "sacrifice", text: "\"...네가 살아. 난 떠날게.\"", subtext: "자발적으로 양보한다", next: "self_sacrifice" }
        ]
      },
      
      identity_doubt: {
        chapter: 3,
        badge: "CHAPTER 3: 의심",
        title: "거울의 양면",
        desc: "당신은 소름이 돋았다.\n\n만약 복제가 완벽하다면... 복제본도 자신이 원본이라고 '느낄' 것이다. 지금 내가 느끼는 이 확신처럼.\n\n'나도 같은 생각했어.'\n\n그가 말했다.\n\n'결국 중요한 건 '누가 먼저냐'가 아닐지도 몰라.'",
        quote: "기억이 같다면, 어느 기억이 '진짜'인가?",
        dilemma: null,
        choices: [
          { id: "origin_matters", text: "\"아니, 원본이 중요해. 최초의 '나'가 진짜야.\"", subtext: "기원의 중요성을 주장한다", next: "competition" },
          { id: "origin_irrelevant", text: "\"...그럼 우리 둘 다 '나'인 건가?\"", subtext: "새로운 관점을 받아들인다", next: "unity_path" }
        ]
      },
      
      unity_path: {
        chapter: 4,
        badge: "CHAPTER 4: 연결",
        title: "두 개의 시선",
        desc: "'신기하지 않아? 같은 기억을 다른 몸에서 떠올리는 거.'\n\n그가 말했다.\n\n'난 왼쪽에서 보고, 넌 오른쪽에서 봐. 같은 장면을 두 개의 시점으로.'\n\n당신은 이상한 가능성을 생각한다. 적이 아니라 확장으로 볼 수 있다면?",
        quote: null,
        dilemma: "두 명의 '나'는 위협인가, 가능성인가?",
        choices: [
          { id: "collaborate", text: "\"같이 뭔가를 해보자. 두 명이니까 가능한 것들.\"", subtext: "협력의 가능성을 탐색한다", next: "collaboration_ending" },
          { id: "fear", text: "\"...근데 사람들이 알면 어떡해?\"", subtext: "사회적 시선을 걱정한다", next: "society_conflict" }
        ]
      },
      
      competition: {
        chapter: 4,
        badge: "CHAPTER 4: 경쟁",
        title: "증명의 싸움",
        desc: "\"좋아, 그럼 증명해봐.\"\n\n그가 도전적으로 말했다.\n\n\"네가 원본이라는 걸.\"\n\n문제는... 방법이 없다는 것이다. 기억도 같고, DNA도 같다. 심지어 지문까지 같다.\n\n유일한 차이는 '2시간'이라는 시간. 하지만 그걸 어떻게 증명하지?",
        quote: null,
        dilemma: "증명할 수 없는 것을 주장하는 것은 의미가 있는가?",
        choices: [
          { id: "force", text: "\"방법이 없으면 힘으로 정한다.\"", subtext: "물리적 해결을 시도한다", next: "violent_ending" },
          { id: "compromise", text: "\"...증명할 수 없다면, 다른 방법을 찾아야지.\"", subtext: "현실적 타협을 모색한다", next: "practical_ending" }
        ]
      },
      
      coexistence_attempt: {
        chapter: 4,
        badge: "CHAPTER 4: 공존",
        title: "불완전한 합의",
        desc: "일주일을 번갈아 살기로 했다.\n\n하지만 문제가 생겼다. 당신이 없는 동안 그가 연인과 싸웠다. 당신이 돌아왔을 때, 연인은 \"왜 갑자기 태도가 달라졌어?\"라고 물었다.\n\n같은 기억으로 시작했지만, 매 순간 당신들은 달라지고 있었다.",
        quote: "같은 사람이 다른 선택을 하면, 여전히 같은 사람인가?",

    // 상태
    let currentNode = 'start';
    let history = [];
    let totalChapters = 6;

    // DOM
    const gameScreen = document.getElementById('gameScreen');
    const resultScreen = document.getElementById('resultScreen');

    function init() {
      showNode('start');
    }

    function showNode(nodeId) {
      const node = STORY[nodeId];
      if (!node) {
        // 엔딩
        showEnding(nodeId);
        return;
      }
      
      currentNode = nodeId;
      
      // 진행 업데이트
      document.getElementById('chapterLabel').textContent = `${node.chapter}장`;
      document.getElementById('chapterCount').textContent = `${node.chapter}/${totalChapters}`;
      document.getElementById('progressFill').style.width = `${(node.chapter / totalChapters) * 100}%`;
      document.getElementById('chapterBadge').textContent = node.badge.replace(/^CHAPTER\s*\d+\s*:\s*/, '');
      
      // 상황 업데이트
      document.getElementById('situationTitle').textContent = node.title;
      document.getElementById('situationDesc').innerHTML = node.desc.replace(/\n/g, '<br>');
      
      const quoteEl = document.getElementById('situationQuote');
      const dilemmaEl = document.getElementById('situationDilemma');
      
      if (node.quote) {
        quoteEl.innerHTML = node.quote;
        quoteEl.classList.remove('hidden');
      } else {
        quoteEl.classList.add('hidden');
      }
      
      if (node.dilemma) {
        dilemmaEl.innerHTML = node.dilemma;
        dilemmaEl.classList.remove('hidden');
      } else {
        dilemmaEl.classList.add('hidden');
      }
      
      // 선택지 생성
      const choicesContainer = document.getElementById('choicesContainer');
      choicesContainer.innerHTML = node.choices.map((choice, idx) => {
        const safeText = choice.text.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        return `
          <button class="choice-btn" data-next="${choice.next}" data-text="${safeText}">
            <div class="choice-label">${String.fromCharCode(65 + idx)}</div>
            <div>${choice.text}</div>
            ${choice.subtext ? `<div class="choice-subtext">${choice.subtext}</div>` : ''}
          </button>
        `;
      }).join('');
      
      // 이벤트 리스너 추가
      choicesContainer.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectChoice(btn.dataset.next, btn.dataset.text);
        });
      });
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectChoice(nextNode, choiceText) {
      history.push({
        node: currentNode,
        choice: choiceText
      });
      
      showNode(nextNode);
    }

    function showEnding(endingId) {
      const ending = ENDINGS[endingId];
      if (!ending) return;
      
      gameScreen.style.display = 'none';
      resultScreen.style.display = 'block';
      
      document.getElementById('resultIcon').textContent = ending.icon;
      document.getElementById('resultTitle').textContent = ending.title;
      document.getElementById('resultDesc').textContent = ending.desc;
      document.getElementById('epilogueText').textContent = ending.epilogue;
      document.getElementById('principleText').textContent = ending.principle;
      
      // 저장
      saveProgress(ending.principleName);
      
      // 공유 버튼
      document.getElementById('shareBtn').addEventListener('click', async () => {
        const text = `🪞 복제인간 시뮬레이터 결과\n\n${ending.icon} ${ending.title}\n유형: ${ending.type}\n\n"${ending.principle}"\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-clone.html`;
        
        // 모바일에서만 네이티브 공유 사용
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        if (isMobile && navigator.share) {
          try {
            await navigator.share({ title: '복제인간', text: text });
          } catch (e) {
            // 공유 취소시 무시
          }
        } else {
          try {
            await navigator.clipboard.writeText(text);
            alert('결과가 클립보드에 복사되었습니다!');
          } catch (e) {
            // fallback
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('결과가 클립보드에 복사되었습니다!');
          }
        }
      });
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function saveProgress(principleName) {
      const STORAGE_KEY = 'eclipse_mindlab_profile';
      let saved = localStorage.getItem(STORAGE_KEY);
      let profile;
      
      if (saved) {
        profile = JSON.parse(saved);
      } else {
        profile = { version: 5, name: '익명 탐험가', level: 1, exp: 0, completedSims: [], principles: [] };
      }
      
      if (!profile.completedSims) profile.completedSims = [];
      if (!profile.principles) profile.principles = [];
      
      // 완료 기록
      if (!profile.completedSims.includes('clone')) {
        profile.completedSims.push('clone');
        profile.exp = (profile.exp || 0) + 30;
      }
      
      // 원칙 저장 (이름으로 저장)
      if (!profile.principles.includes(principleName)) {
        profile.principles.push(principleName);
      }
      
      // 레벨업 체크
      const expNeeded = (profile.level || 1) * 100;
      while (profile.exp >= expNeeded) {
        profile.exp -= expNeeded;
        profile.level = (profile.level || 1) + 1;
      }
      
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
    }

    init();
  </script>
