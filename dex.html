<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원칙 도감 - 이클립스의 딜렘</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6f5fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0d14" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="eclipse.css">
  <style>
    /* Dex: the index at the back of the book. Discovered names in moon-white serif,
       the rest as quiet placeholders. The only accent is the corona progress line. */
    body { min-height: 100vh; }
    .container { max-width: var(--col); margin: 0 auto; padding: 0 20px 120px; }

    .header { padding: 18px 0 0; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mist); }
    .back-btn:hover { color: var(--moon); }
    .back-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    .page-title {
      font-family: var(--serif); font-weight: 700;
      font-size: 32px; line-height: 1.25; letter-spacing: -.02em;
      margin-top: 28px;
    }
    .page-sub { margin-top: 8px; font-size: 14px; color: var(--mist); }

    /* count + progress line */
    .progress-card { margin-top: 30px; }
    .progress-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .progress-label { font-size: 13px; color: var(--dim); }
    .progress-count {
      font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1;
      letter-spacing: .01em; font-variant-numeric: tabular-nums;
    }
    .progress-bar { margin-top: 14px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--corona); border-radius: 2px; transition: width .4s ease; }

    /* filters: quiet text tabs */
    .filter-section { margin-top: 34px; border-bottom: 1px solid var(--line); }
    .filter-row { display: flex; align-items: center; }
    #categoryFilter { gap: 22px; }
    .filter-btn {
      position: relative; padding: 8px 0; font-size: 15px; color: var(--dim);
      transition: color .2s ease;
    }
    .filter-btn:hover { color: var(--mist); }
    .filter-btn.active { color: var(--moon); }
    #categoryFilter .filter-btn { padding-bottom: 12px; }
    #categoryFilter .filter-btn.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--moon);
    }
    #statusFilter { gap: 14px; padding: 14px 0 0; }
    #statusFilter .filter-btn { font-size: 13px; padding: 4px 0; }
    #statusFilter .filter-btn + .filter-btn::before {
      content: ""; position: absolute; left: -8px; top: 50%; width: 2px; height: 2px;
      border-radius: 50%; background: var(--dim); transform: translateY(-50%);
    }
    .filter-wrap { display: flex; justify-content: flex-end; }

    /* the index itself */
    .principles-list {
      display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px;
      margin-top: 10px;
    }
    .principle-item {
      display: flex; min-width: 0; padding: 14px 0 13px;
      border-bottom: 1px solid var(--line);
    }
    .principle-item.discovered { cursor: pointer; transition: transform .15s ease; }
    .principle-item.discovered:active { transform: scale(.97); }
    .principle-item.discovered:hover .principle-name { color: var(--moon); }
    .principle-icon, .principle-status { display: none; }
    .principle-info { flex: 1; min-width: 0; }
    .principle-name {
      font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1.35;
      color: var(--moon); letter-spacing: -.01em; word-break: keep-all;
    }
    .principle-source {
      margin-top: 4px; font-size: 12px; line-height: 1.5; color: var(--dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .principle-source .tag { color: var(--mist); }
    .principle-item.discovered .principle-source .tag::after { content: " · "; color: var(--dim); }

    /* undiscovered: name and source become placeholders */
    .principle-item.locked .principle-name {
      color: transparent; user-select: none;
      width: 5.2em; height: 9px; margin: 7px 0 8px;
      background: var(--night-3); border-radius: 4px; overflow: hidden;
    }
    .principle-item.locked:nth-child(3n+1) .principle-name { width: 4.2em; }
    .principle-item.locked:nth-child(5n+2) .principle-name { width: 6.4em; }
    .principle-item.locked .principle-source { font-size: 0; }
    .principle-item.locked .principle-source .tag { font-size: 12px; color: var(--dim); }

    .empty-state { grid-column: 1 / -1; padding: 56px 0; text-align: center; font-size: 14px; color: var(--dim); }
    .empty-state-icon { display: none; }

    /* modal: a page of the book */
    .modal {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background: rgba(10,5,16,.78);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility .2s;
    }
    .modal.show { opacity: 1; visibility: visible; }
    .modal-content {
      width: 100%; max-width: 380px;
      background: var(--night-2); border-radius: var(--r-m);
      padding: 34px 28px 24px;
    }
    .modal-icon { display: none; }
    .modal-name {
      font-family: var(--serif); font-weight: 700; font-size: 27px; line-height: 1.3;
      letter-spacing: -.02em; word-break: keep-all;
    }
    .modal-desc {
      margin-top: 16px; font-size: 15px; line-height: 1.85; color: var(--moon);
      word-break: keep-all;
    }
    .modal-source {
      margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
      font-size: 12.5px; color: var(--dim); line-height: 1.6;
    }
    .modal-source-label { margin-right: 6px; }
    #modalSource { color: var(--mist); }
    .modal-close { width: 100%; margin-top: 24px; }

    @media (max-width: 370px) {
      .principles-list { column-gap: 14px; }
      .principle-name { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        홈
      </a>
    </div>

    <h1 class="page-title">원칙 도감</h1>
    <p class="page-sub">시뮬레이터에서 고른 선택이 원칙으로 쌓여요.</p>

    <div class="progress-card">
      <div class="progress-header">
        <span class="progress-count" id="progressCount">0/0</span>
        <span class="progress-label">발견한 원칙</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-row" id="categoryFilter">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="심리">심리</button>
        <button class="filter-btn" data-filter="철학">철학</button>
        <button class="filter-btn" data-filter="스토리">스토리</button>
      </div>
    </div>
    <div class="filter-wrap">
      <div class="filter-row" id="statusFilter">
        <button class="filter-btn active" data-filter="all">모두</button>
        <button class="filter-btn" data-filter="discovered">발견</button>
        <button class="filter-btn" data-filter="locked">미발견</button>
      </div>
    </div>

    <div class="principles-list" id="principlesList"></div>
  </div>

  <!-- 모달 -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon"></div>
      <h2 class="modal-name" id="modalName">원칙 이름</h2>
      <p class="modal-desc" id="modalDesc">원칙 설명</p>
      <div class="modal-source">
        <span class="modal-source-label">출처</span><span id="modalSource">출처</span>
      </div>
      <button class="modal-close ecl-btn ghost" id="modalClose">닫기</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'eclipse_mindlab_profile';

    // 모든 원칙 목록
    const ALL_PRINCIPLES = [
      { name: '라플라스의 악마', desc: '수학자 피에르시몽 라플라스는 우주의 모든 원자가 어디에 있고 어떤 힘을 받는지 다 아는 존재를 상상했다. 그 존재는 앞으로 일어날 일을 모두 계산해 낼 수 있다. 모든 일이 앞선 원인들로 이미 정해져 있다는 결정론을 가장 선명하게 보여 주는 사고실험이다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '행위자 인과', desc: '당구공은 다른 공에 맞아서 굴러간다. 철학자 로더릭 치좀은 사람은 다르다고 봤다. 행동의 원인을 거슬러 올라가면 마지막에 나 자신이 있고, 나보다 앞선 원인은 없다는 것이다. 그는 이것을 흔히 신에게만 있다고 여겨 온 특권이라고 불렀다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '행위의 자유와 의지의 자유', desc: '쇼펜하우어는 자유를 둘로 나눴다. 원하는 대로 할 수 있는 행위의 자유, 그리고 무엇을 원할지 고르는 의지의 자유. 그는 사람에게 앞의 것은 있지만 뒤의 것은 없다고 봤다. 사람은 원하는 것을 할 수는 있지만, 무엇을 원할지는 원할 수 없다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '자유의지의 딜레마', desc: '선택에 원인이 있으면 원인이 정한 것이고, 원인이 없으면 우연이 정한 것이다. 어느 쪽이든 내가 정했다고 말하기 어렵다. 양자역학이 세상에 우연이 있다는 걸 보여 줘도 자유의지 문제가 풀리지 않는 이유다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '해석기', desc: '좌뇌와 우뇌를 잇는 신경 다발이 끊어진 환자의 우뇌에만 \'걸어라\'라는 글자를 보여 주면, 환자는 일어나 걷는다. 왜 걷느냐고 물으면 글자를 보지 못한 좌뇌가 망설임 없이 답한다. 콜라를 가져오려고요. 신경과학자 마이클 가자니가는 이렇게 이유를 지어내는 좌뇌의 역할을 해석기라고 불렀다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '스피노자의 돌', desc: '스피노자는 이렇게 썼다. 누군가 던진 돌이 날아가면서 생각할 수 있다면, 그 돌은 자기가 날고 싶어서 날고 있다고 믿을 것이다. 사람들이 자기가 자유롭다고 믿는 이유도 같다. 자기가 무엇을 원하는지는 알지만, 왜 그걸 원하게 됐는지는 모르기 때문이다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '양립가능론', desc: '모든 일에 원인이 있어도 자유의지는 있다고 보는 입장이다. 철학자 해리 프랭크퍼트는 책임을 물을 때 중요한 건 그 행동이 정말 그 사람 자신의 생각과 바람에서 나왔느냐라고 봤다. 그렇다면 결정론이 맞더라도 칭찬과 비난은 사라지지 않는다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '준비 전위', desc: '신경과학자 벤저민 리벳은 참가자들에게 손목을 까딱이고 싶을 때 까딱이게 하고, 마음먹은 순간을 기록하게 했다. 그런데 참가자가 마음먹었다고 느끼기 0.35초쯤 전에, 뇌는 이미 움직일 준비를 시작하고 있었다. 이 신호를 준비 전위라고 부른다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '거부권', desc: '리벳은 자기 실험이 자유의지를 없앤다고 보지 않았다. 뇌가 움직임을 준비한 뒤에도 실제로 손이 움직이기 전 0.2초쯤의 틈이 있고, 그 사이에 움직임을 취소할 수 있다고 봤다. 하고 싶은 마음은 고를 수 없어도, 그 마음을 막을 수는 있다는 것이다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '가질 만한 자유', desc: '철학자 대니얼 데닛은 우주가 정해진 대로 굴러간다 해도, 앞을 내다보고 따져 보고 하려던 일을 멈출 수 있는 존재는 그럴 수 없는 존재와 다르다고 봤다. 날아오는 공을 보고 고개를 숙이는 사람도 원자로 이루어져 있지만, 피하지 못하는 돌멩이와는 다르다. 데닛은 우리가 가질 만한 자유가 바로 이 능력이라고 했다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '응보주의', desc: '잘못한 사람은 그 잘못에 맞는 벌을 받아 마땅하다는 생각이다. 벌의 이유를 사회를 지키거나 사람을 고치는 데서 찾지 않고, 저지른 잘못 그 자체에서 찾는다. 칸트는 사회가 해체되는 날에도 감옥에 남은 마지막 살인자는 처형해야 한다고 썼을 만큼 이 원칙을 엄격하게 봤다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '브레이크 고장 난 자동차', desc: '신경생물학자 로버트 사폴스키는 누구도 벌받아 마땅하지 않다고 본다. 사람의 행동은 유전자, 호르몬, 자란 환경이 만든 결과이기 때문이다. 그는 브레이크가 고장 난 차를 예로 든다. 그런 차는 도로에서 치워야 하지만, 차를 미워하거나 차가 벌받아 마땅하다고 말하는 사람은 없다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '휘트먼의 종양', desc: '1966년 대학생 찰스 휘트먼은 대학 시계탑 꼭대기에서 총을 쏴 열 명이 넘는 사람을 죽였다. 부검 결과 두려움과 공격성을 다루는 편도체 근처에서 종양이 나왔다. 둘 다 원인이 있더라도, 종양이 멈추는 능력을 앗아 간 사람과 멀쩡한 뇌로 범죄를 계획한 사람에게 똑같은 책임을 물을 필요는 없다는 논의가 여기서 나왔다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '반응적 태도', desc: '철학자 피터 스트로슨은 자유의지 논쟁을 다른 쪽에서 봤다. 우리는 누군가 나를 해치면 분노하고, 도와주면 고마워한다. 스트로슨은 이런 반응이 사람을 사람으로 대하는 방식 그 자체이고, 형이상학 논쟁의 결과에 따라 내려놓을 수 있는 것이 아니라고 봤다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '자유의지 회의론', desc: '사람의 행동과 의지가 모두 뇌와 그 뇌를 만든 원인들로 설명된다면, 자유의지는 없다고 보는 입장이다. 중세 유럽은 뇌전증 발작을 악령에 씐 탓으로 여겼지만, 원인을 알게 된 지금은 아무도 환자를 탓하지 않는다. 회의론자들은 원인을 알게 될수록 비난도 사라진다고 본다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '르누비에의 정의', desc: '철학자 윌리엄 제임스는 몇 달째 우울에 빠져 아무 일도 못 하다가, 샤를 르누비에의 글에서 한 문장을 읽었다. 자유의지란 다른 생각도 할 수 있는데 이 생각을 계속 붙들고 있기로 마음먹는 것이다. 제임스는 일기에 이렇게 적었다. 자유의지로 하는 나의 첫 번째 행동은, 자유의지를 믿는 것이다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '인격 동일성', desc: '철학자 존 로크는 한 사람을 같은 사람으로 만드는 것을 기억의 이어짐에서 찾았다. 어제의 일을 기억하는 오늘의 나는 어제의 나와 같은 사람이다. 그렇다면 기억을 모두 잃은 사람은 어떻게 봐야 하는지가 이 이론의 오랜 숙제로 남았다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '메멘토 모리', desc: '죽음을 기억하라는 뜻의 라틴어 경구다. 스토아 철학자들은 죽음을 날마다 떠올리는 일을, 오늘을 미루지 않게 하는 훈련으로 여겼다. 세네카는 매일 저녁 하루를 마치 삶의 마지막 날처럼 정리하라고 권했다.', icon:'', source: '자유의지 시뮬레이터', category:'철학' },
      { name: '시계공 논증', desc: '들판의 돌멩이는 원래 거기 있었다고 생각해도 이상하지 않지만, 회중시계는 누군가 만들었다고 생각한다. 신학자 윌리엄 페일리는 시계보다 정교한 눈을 근거로, 생명에도 그것을 만든 이가 있어야 한다고 봤다. 정교함에서 설계자를 추론하는 논증이다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '눈먼 시계공', desc: '다윈은 정교한 것이 꼭 한 번에 만들어질 필요는 없다고 봤다. 조금 더 잘 보는 쪽이 살아남는 일이 수억 년 쌓이면 눈이 생긴다. 생물학자 리처드 도킨스는 그래서 자연선택을 눈먼 시계공이라고 불렀다. 앞을 내다보지 않고도 정교한 것을 만들어 내기 때문이다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '첫 번째 원인', desc: '토마스 아퀴나스는 원인을 끝없이 거슬러 올라갈 수는 없으니, 맨 처음에는 다른 원인 없이 스스로 있는 무언가가 있어야 한다고 봤다. 버트런드 러셀은 되물었다. 모든 것에 원인이 있다면 신에게도 원인이 있어야 하고, 신만은 원인 없이 있을 수 있다면 우주는 왜 그럴 수 없느냐고.', icon:'', source: '신의 증명', category:'철학' },
      { name: '미세 조정 논증', desc: '중력의 세기 같은 우주의 기본 설정값이 조금만 달랐어도 별도 생명도 생기지 못했을 거라는 계산이 있다. 철학자 존 레슬리는 이걸 총살대에 빗댔다. 쉰 발이 모두 빗나갔는데 살아 있으니 당연하다고 넘길 수는 없다는 것이다. 우주가 생명에 맞게 맞춰져 있다면, 맞춘 누군가를 떠올리는 게 자연스럽다는 논증이다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '웅덩이의 착각', desc: '작가 더글러스 애덤스는 이렇게 비유했다. 어느 아침 깨어난 웅덩이가, 내가 들어앉은 구덩이가 내 모양에 꼭 맞으니 나를 위해 만들어졌다고 생각한다. 하지만 물이 구덩이 모양대로 고였을 뿐이다. 생명이 생길 수 없는 우주였다면 이 질문을 던질 사람도 없었다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '악의 문제', desc: '신이 악을 막으려 하지만 막을 수 없다면 전능하지 않다. 막을 수 있지만 막으려 하지 않는다면 선하지 않다. 둘 다라면 악은 어디서 오는가. 에피쿠로스가 던졌다고 전해지는 이 질문은, 신을 둘러싼 논쟁에서 가장 오래되고 가장 아픈 질문이다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '도덕 논증', desc: '도덕이 사람마다, 사회마다 다른 취향일 뿐이라면, 학대가 나쁘다는 말도 결국 개인의 선호가 된다. 그런데 우리는 그것이 누가 뭐라 하든 나쁘다고 느낀다. 철학자 윌리엄 레인 크레이그는 여기서 사람의 취향보다 높은 기준이 있어야 하고, 그 기준이 신이라고 봤다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '도덕감의 진화', desc: '다윈은 『인간의 유래』에서 무리를 지어 사는 동물의 사회적 본능이 충분히 발달하면 도덕감이 생긴다고 봤다. 공감하고, 돕고, 배신을 미워하는 마음이 함께 살아남는 데 유리했기 때문이다. 도덕이 사람 바깥이 아니라 사람 안에서 자라났다는 관점이다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '에우티프론 딜레마', desc: '플라톤이 대화편 『에우티프론』에서 던진 질문이다. 경건한 것은 신들이 사랑해서 경건한가, 경건하기 때문에 신들이 사랑하는가. 2,400년이 지난 지금도 도덕과 신의 관계를 묻는 가장 유명한 딜레마로 쓰인다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '파스칼의 내기', desc: '수학자 블레즈 파스칼은 신이 있는지 이성으로는 판단할 수 없다고 먼저 인정한 뒤, 계산을 제안했다. 걸린 상이 무한하다면, 신이 있을 가능성이 아무리 작아도 믿는 쪽에 거는 게 합리적이라는 것이다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '많은 신 반론', desc: '철학자 드니 디드로는 파스칼의 내기를 한 줄로 받아쳤다. 이슬람의 이맘도 똑같이 말할 수 있다. 같은 계산으로 어떤 종교든 정당화할 수 있다면, 그 계산은 아무것도 고르지 못한 셈이다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '러셀의 찻주전자', desc: '버트런드 러셀은 지구와 화성 사이에서, 어떤 망원경으로도 보이지 않을 만큼 작은 찻주전자가 태양을 돌고 있다고 주장하는 사람을 상상했다. 아무도 아니라고 증명할 수 없다고 해서 믿어야 하는 건 아니다. 증명할 책임은 주장하는 쪽에 있다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '습관이 만드는 믿음', desc: '파스칼은 이성으로 믿음에 이르지 못하는 사람에게, 이미 믿게 된 사람들이 한 대로 성수를 찍고 미사를 드려 보라고 권했다. 행동이 먼저 바뀌면 생각이 따라온다는 것이다. 행동이 태도를 바꾼다는 오늘날 심리학의 발견과도 닮았다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '믿으려는 의지', desc: '철학자 윌리엄 제임스는 이렇게 봤다. 증거만으로는 답이 나지 않는데 어느 쪽이든 골라야만 하고, 그 선택이 삶을 크게 바꾸는 질문이라면, 사람에게는 믿기로 선택할 권리가 있다. 판단을 미루는 것도 결국 하나의 선택이기 때문이다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '에피쿠로스의 죽음관', desc: '에피쿠로스는 죽음이 우리에게 아무것도 아니라고 했다. 우리가 있을 때 죽음은 없고, 죽음이 왔을 때 우리는 이미 없다. 그러니 죽음을 미리 두려워할 이유가 없다는 것이다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '기분 전환', desc: '파스칼은 『팡세』에서 사람들이 사냥, 놀이, 일 같은 기분 전환에 몰두하는 이유를 이렇게 봤다. 혼자 조용히 앉아 자기 처지와 죽음을 생각하는 걸 견디지 못하기 때문이다. 그는 사람의 불행이 방 안에 조용히 머물 줄 모르는 데서 온다고 썼다.', icon:'', source: '신의 증명', category:'철학' },
      { name: '동기화된 추론', desc: '믿고 싶은 결론 앞에서는 \'믿어도 될까?\'를 묻고, 믿기 싫은 결론 앞에서는 \'꼭 믿어야 하나?\'를 묻는다. 앞의 질문은 근거 하나로 통과하고, 뒤의 질문은 근거가 아무리 쌓여도 통과하지 못한다. 결론이 먼저 정해지고, 추론은 그 결론을 변호하러 나선다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '몰입 상승', desc: '이미 많이 걸어 둔 결정일수록, 일이 틀어져도 오히려 더 건다. 물러서는 순간 지금까지 건 것이 전부 실수였다고 인정해야 하기 때문이다. 그래서 잘못된 결정은 작을 때보다 클 때 멈추기가 더 어렵다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '매몰 비용', desc: '이미 써 버려서 되돌릴 수 없는 돈과 시간을 매몰 비용이라고 한다. 합리적인 판단은 앞으로의 손익만 따진다. 하지만 사람은 \'여기까지 왔는데\'라는 아까움을 판단의 근거로 쓴다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '타조 효과', desc: '나쁜 소식이 예상되면 아예 확인하지 않으려는 경향이다. 주가가 떨어지는 날 계좌를 덜 열어 보는 게 대표적이다. 확인하지 않는 동안에는 손실도 없는 것처럼 느껴진다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '신 포도', desc: '이솝 우화의 여우는 닿지 않는 포도를 보며 어차피 시었을 거라고 말한다. 갖지 못한 것의 가치를 깎아내리면 실패의 아픔이 줄어든다. 니체는 이 마음이 커지면, 이긴 사람을 머릿속에서 끌어내려 이기는 르상티망이 된다고 봤다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '자기 위주 편향', desc: '잘되면 내 실력이고, 안되면 상황 탓이다. 성공과 실패의 원인을 나에게 유리한 쪽으로 나눠 갖는 경향을 자기 위주 편향이라고 한다. 자존감은 지켜지지만, 무엇을 고쳐야 하는지는 끝까지 보이지 않는다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '상향 비교', desc: '나보다 잘난 사람과 나를 견주는 것을 상향 비교라고 한다. 열등감을 부르기 쉽지만, 동시에 내가 어디까지 갈 수 있는지 보여 주는 가장 구체적인 본보기이기도 하다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '선택적 노출', desc: '내 생각과 맞는 정보는 찾아보고, 불편한 정보는 피하는 경향이다. 보고 싶은 것만 보면 마음은 편하지만, 내가 보는 세상은 점점 내가 믿고 싶은 모양으로 좁아진다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '벤저민 프랭클린 효과', desc: '벤저민 프랭클린은 자기를 싫어하던 의원에게 책을 빌려 달라고 부탁했고, 그 뒤로 둘은 친구가 됐다. 싫은 사람을 도운 나를 설명하는 가장 쉬운 방법은, 사실 그 사람이 그렇게 싫지 않다고 믿는 것이다. 마음이 행동을 이끄는 줄 알지만, 행동이 마음을 바꾸기도 한다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '불충분한 정당화', desc: '지루한 일을 재미있었다고 말해 달라는 부탁을 받고, 1달러를 받은 사람이 20달러를 받은 사람보다 그 일을 더 재미있었다고 기억했다. 20달러면 돈 때문에 거짓말했다고 설명할 수 있지만, 1달러로는 설명이 안 된다. 행동을 설명할 이유가 부족하면, 사람은 생각 쪽을 바꾼다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '확증 편향', desc: '한번 생긴 생각에 맞는 정보는 잘 보이고, 반대되는 정보는 잘 안 보인다. 그 사람이 싫다고 정하는 순간부터, 그 사람의 실수만 눈에 들어온다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '나쁜 믿음', desc: '사르트르는 손님 앞에서 지나치게 공손하게 움직이는 카페 종업원을 보고, 그가 종업원을 연기하고 있다고 봤다. 정해진 역할이나 성격 뒤에 숨으면, 다르게 행동할 수도 있었다는 사실을 외면할 수 있다. 사르트르는 이렇게 알면서도 모르는 척하는 자기기만을 나쁜 믿음이라고 불렀다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '기본적 귀인 오류', desc: '남이 실수하면 그 사람의 성격부터 보고, 그 사람이 처한 상황은 가볍게 넘긴다. 이것을 기본적 귀인 오류라고 한다. 내가 실수했을 때는 거꾸로 상황이 먼저 보인다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '좌뇌 해석기', desc: '좌뇌와 우뇌의 연결이 끊긴 환자는, 우뇌만 본 장면 때문에 한 행동에도 좌뇌가 곧바로 그럴듯한 이유를 지어낸다. 뇌에는 진짜 이유를 몰라도 이야기를 만들어 내는 해석기가 있다. 우리가 대는 이유 가운데 상당수도 행동이 끝난 뒤 이 해석기가 쓴 것일 수 있다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '인지부조화', desc: '믿음과 행동이 부딪힐 때 생기는 불편함이다. \'나는 괜찮은 사람\'이라는 믿음과 \'심한 말을 했다\'는 사실이 부딪히면, 사람은 대개 사실 쪽을 다르게 해석한다. 사과는 그 반대로, 믿음에 맞게 행동을 고치는 드문 방법이다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '카이우스의 삼단논법', desc: '톨스토이의 소설에서 이반 일리치는 \'카이우스는 사람이다, 사람은 죽는다, 그러므로 카이우스는 죽는다\'를 평생 옳다고 믿었다. 다만 그건 카이우스 이야기였지 자기 이야기는 아니었다. 죽음을 아는 것과 내 죽음으로 받아들이는 것 사이에는 큰 거리가 있다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '근접 방어', desc: '죽음이 떠오르면 사람은 먼저 그 생각을 치운다. 아직 젊다거나, 건강만 챙기면 된다는 생각으로 죽음을 먼 미래로 밀어낸다. 몸에는 좋은 결심이 되기도 하지만, 죽음에 대한 생각은 다시 미뤄진다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '상징적 불멸', desc: '몸은 사라져도 이름, 업적, 자식, 신념은 남는다는 믿음이다. 이 믿음은 죽음의 공포를 달래 준다. 그래서 사람은 자기 신념이 공격받을 때, 마치 목숨이 위협받은 것처럼 격하게 반응하기도 한다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '죽음을 향한 존재', desc: '하이데거는 사람들이 \'누구나 언젠가 죽는다\'는 말로 자기 죽음을 남의 일처럼 만든다고 봤다. 자기 죽음을 피하지 않고 마주할 때, 남들 사는 대로가 아닌 자기 삶을 고르게 된다고 했다.', icon:'', source: '자기기만 시뮬레이터', category:'심리' },
      { name: '힘에의 의지', desc: '니체는 『선악의 저편』에서 살아 있는 것은 무엇보다 자기 힘을 쓰려고 한다고 썼다. 살아남는 건 그 결과 가운데 하나일 뿐이라는 것이다. 그래서 니체에게 원하는 마음은 고쳐야 할 결함이 아니었다. 그건 살아 있다는 증거였다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '긍정적 공상', desc: '계획은 원래 도움이 된다. 심리학자 페터 골비처는 \'언제, 어디서, 무엇을 할지\'까지 정해 둔 사람이 실제로 해낼 확률이 높다는 걸 여러 실험으로 보여 줬다. 그런데 또 다른 심리학자 가브리엘레 외팅겐은 반대쪽을 봤다. 원하는 결과를 생생하게 상상할수록 사람들이 오히려 덜 움직였다. 머릿속에서 이미 조금 이룬 기분이 들기 때문이다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '최후의 인간', desc: '『차라투스트라는 이렇게 말했다』에 나오는 인간형이다. 더는 아무것도 간절히 원하지 않고, 적당히 일하고 적당히 즐기며 탈 없이 산다. 차라투스트라는 이들을 가장 경멸할 만한 인간이라고 불렀다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '의지의 우위', desc: '쇼펜하우어의 비유다. 원하는 마음은 앞을 못 보지만 힘이 센 사람이고, 이성은 눈은 밝은데 다리를 못 쓰는 사람이다. 이성은 그 어깨에 올라타 길을 알려 준다. 겉으로는 이성이 방향을 정하는 것 같지만, 실제로 걷는 건 아래쪽이다. 우리는 원하고 나서 이유를 찾는다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '맹목적 의지', desc: '쇼펜하우어는 행동 하나하나에는 목적이 있어도, 원하는 일 전체에는 목적이 없다고 했다. 의지는 어딘가에 도착하려고 원하지 않는다. 그냥 계속 원한다. \'왜\'를 끝까지 물으면 대답이 끊기는 이유가 여기 있다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '살아야 할 이유', desc: '니체가 『우상의 황혼』에 남긴 문장이다. 살아야 할 \'왜\'를 가진 사람은 거의 어떤 \'어떻게\'도 견딘다. 같은 고통도 이유가 붙으면 견딜 만해진다는 얘기다. 훗날 빅터 프랭클이 수용소 경험을 쓰면서 이 문장을 여러 번 인용했다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '이케아 효과', desc: '직접 조립한 이케아 가구를 사람들은 똑같은 완제품보다 더 비싸게 쳐준다. 심리학자들이 실험으로 확인한 이 현상을 이케아 효과라고 부른다. 들인 수고만큼 결과가 값져 보인다. 니체도 기쁨은 무언가를 손에 넣는 순간보다 막고 있던 걸 넘어서는 순간에 온다고 봤다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '힘의 감정', desc: '니체는 『안티크리스트』에서 행복을 이렇게 정의했다. 힘이 커지고 있다는 느낌, 저항을 이겨 냈다는 느낌. 니체는 이런 힘의 감정을 사람이 원하는 가장 근본적인 것으로 봤다. 쇼펜하우어가 행복을 고통이 잠깐 멈춘 상태로 본 것과 정반대다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '행복의 소극성', desc: '쇼펜하우어는 행복이 소극적이라고 했다. 행복은 그 자체로 느껴지는 무언가가 아니라 고통이 잠깐 멈춘 상태라는 것이다. 그래서 건강, 젊음, 자유 같은 것은 가지고 있을 때는 모르고 잃고 나서야 그 가치를 안다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '쾌락 적응', desc: '사람은 좋은 일에도 금방 익숙해진다. 심리학에서는 이것을 쾌락 적응이라고 부른다. 쇼펜하우어 식으로 말하면 욕구가 채워진 자리에 권태가 들어오는 것이다. 다만 방법이 없지는 않다. 가진 것을 일부러 고마워하는 습관이 익숙해지는 속도를 늦춘다는 연구들이 있다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '분주한 도피', desc: '니체는 『즐거운 학문』에서 손에 시계를 들고 생각하고, 주식 시세를 보며 점심을 먹는 사람들을 꼬집었다. 이들은 아무것도 하지 않느니 차라리 뭐라도 하려 든다. 니체가 말한 오르막은 이렇게 쉬지 않고 바쁜 것과는 다른 이야기였다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '고통과 권태의 시계추', desc: '쇼펜하우어의 가장 유명한 비유다. 원하는 걸 못 가지면 괴롭고, 가지면 금방 지루해진다. 그리고 지루함을 못 견뎌서 다시 뭔가를 원한다. 그는 삶이 고통과 권태 사이를 시계추처럼 오간다고 봤고, 이걸 삶에 원래 박혀 있는 구조라고 생각했다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '미적 관조', desc: '쇼펜하우어는 아름다운 것에 빠져드는 순간을 미적 관조라고 불렀다. 그 순간에는 원하는 나를 잊고 그저 바라보게 된다. 그는 이것을 그리스 신화에서 영원히 도는 익시온의 불타는 바퀴가 잠시 멈추는 순간에 빗댔다. 여러 예술 가운데 음악을 가장 높이 쳤다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '권태', desc: '쇼펜하우어는 삶이 고통 아니면 권태라고 했다. 원하는 게 채워지면 할 일이 없어지고, 사람은 그 빈 시간을 견디지 못한다. 그는 사람들이 모여 카드놀이를 하는 모습을 보고, 생각할 거리가 바닥난 사람들이 시간을 죽이고 있다고 꼬집었다. 지금은 카드 대신 휴대폰이다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '금욕주의적 이상', desc: '쇼펜하우어는 욕망 자체를 꺼 버리는 금욕을 마지막 출구로 봤다. 니체는 『도덕의 계보』에서 이 금욕주의적 이상을 정면으로 비판했다. 금욕하는 사람도 결국 무언가를 강하게 원하고 있다는 것이다. 인간은 아무것도 원하지 않느니 차라리 무(無)를 원한다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '디오니소스적 긍정', desc: '쇼펜하우어는 관객이 비극을 보며 삶이 붙잡을 가치가 없다는 걸 깨닫고 체념한다고 했다. 니체는 정반대로 봤다. 그리스인들은 삶이 얼마나 끔찍한지 알면서도 그 삶을 무대에 올려 축제로 만들었다. 가장 가혹한 삶까지 긍정하는 이 태도를 니체는 디오니소스적이라고 불렀다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '연민의 윤리', desc: '쇼펜하우어는 남의 고통을 내 고통처럼 느끼는 마음, 연민을 모든 도덕의 뿌리로 봤다. 니체는 바로 이 지점을 공격했다. 연민은 고통을 줄이지 못하고 옮겨서 퍼뜨린다는 것이다. 니체는 『도덕의 계보』 서문에서 연민의 가치를 두고 스승 쇼펜하우어와 갈라섰다고 직접 밝혔다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '동정 비판', desc: '니체는 『즐거운 학문』에서 동정하는 사람들을 이렇게 비판했다. 남의 고통을 보면 서둘러 치워 주려고만 하지, 그 고통이 그 사람 인생에서 어떤 자리에 있는지는 모른다. 니체는 어떤 고통은 그 사람이 자기 길을 가는 데 필요할 수도 있다고 봤다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '고통의 깊이', desc: '니체는 큰 고통이 사람을 더 낫게 만드는지는 모르겠지만, 더 깊게 만드는 건 확실하다고 했다. 다만 이건 고통을 지나온 사람이 뒤돌아보며 할 수 있는 말이다. 지금 아픈 사람에게 의미부터 묻는 건 그 사람이 지나야 할 시간을 건너뛰라는 말과 같다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '딱딱한 침대', desc: '『차라투스트라는 이렇게 말했다』에 이런 말이 있다. 고통받는 친구가 있다면 그의 고통이 쉴 곳이 되어 주라. 다만 딱딱한 침대, 야전 침대가 되어 주라. 곁은 내주되, 푹신하게 감싸서 그 고통을 대신 없애 주려 하지는 말라는 뜻이다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '공감적 기쁨', desc: '니체는 『인간적인, 너무나 인간적인』에 이렇게 썼다. 친구를 만드는 건 함께 괴로워하는 마음이 아니라 함께 기뻐하는 마음이다. 해 보면 안다. 남의 불행에 같이 우는 것보다 남의 성공에 진심으로 기뻐하는 쪽이 훨씬 어렵다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '질투의 본성', desc: '쇼펜하우어는 질투가 인간에게 자연스러운 감정이면서, 동시에 악덕이자 불행이라고 했다. 남이 잘되면 내 처지가 더 또렷하게 보이기 때문이다. 그래서 사람들은 무난한 축하 한마디로 그 마음을 덮는다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '르상티망', desc: '니체는 이루지 못한 사람이 이룬 사람에게 품는 원한을 르상티망이라고 불렀다. 처음엔 축하를 미루는 작은 망설임처럼 보이지만, 쌓이면 상대를 깎아내려야 마음이 편해진다. 니체는 『도덕의 계보』에서 이 감정을 가장 자세히 파헤쳤다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '기쁨과 고통의 사슬', desc: '『차라투스트라는 이렇게 말했다』 4부의 한 대목이다. 기쁨 하나에 \'그렇다\'고 말해 본 적이 있다면, 너는 모든 고통에도 \'그렇다\'고 말한 것이다. 모든 것은 사슬처럼 엮여 있기 때문이다. 니체는 좋은 것만 골라 사는 삶은 없다고 봤다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '염세주의', desc: '쇼펜하우어는 서양 철학에서 염세주의를 가장 정면으로 밀어붙인 철학자다. 그는 무덤을 하나씩 두드리며 죽은 사람들에게 다시 살아나고 싶으냐고 물으면, 다들 고개를 저을 거라고 했다. 그리고 삶을 차라리 없었던 편이 나았을 무언가라고까지 썼다.', icon:'', source: '욕망의 시계추', category:'철학' },
      { name: '가장 무거운 무게', desc: '이 악마 이야기는 『즐거운 학문』 341번에 나온다. 니체는 이 생각을 \'가장 무거운 무게\'라고 불렀다. 무엇을 하든 \'이것을 다시, 셀 수 없이 다시 원하는가?\'라는 질문이 행동 위에 얹히기 때문이다.', icon:'', source: '욕망의 시계추', category:'철학' },
      // 아이디어 도둑 동료 (심리)
      { name: '직접 대면', desc: '문제를 바로 짚는 것. 명확하지만, 상대가 방어 모드로 들어갈 수 있다.', icon: '👊', source: '아이디어 도둑 동료', category: '심리' },
      { name: '질문형 압박', desc: '단정 대신 질문으로 상대가 스스로 인정하게 만든다.', icon: '❓', source: '아이디어 도둑 동료', category: '심리' },
      { name: '관망', desc: '상황을 지켜보며 정보를 모은다. 타이밍을 놓치면 문제 제기가 어려워진다.', icon: '👀', source: '아이디어 도둑 동료', category: '심리' },
      { name: '사실 고정', desc: '구체적인 시점을 언급하면 부정하기 어려워진다.', icon: '📌', source: '아이디어 도둑 동료', category: '심리' },
      { name: '전략적 관용', desc: '당장의 승리 대신 장기적 영향력을 선택한다.', icon: '🎯', source: '아이디어 도둑 동료', category: '심리' },

      { name: '임계점 윤리', desc: '행위의 정당성에는 임계점이 있다. 충분히 많은 생명이 걸리면 개입이 정당화된다.', icon: '📊', source: '트롤리 딜레마', category: '철학' },
      { name: '절대적 의무', desc: '어떤 결과를 위해서도 무고한 사람을 죽이는 것은 허용되지 않는다. 숫자는 중요하지 않다.', icon: '📜', source: '트롤리 딜레마', category: '철학' },
      { name: '응보적 정의', desc: '생명의 가치는 그 사람의 행위에 따라 달라질 수 있다. 죄인과 무고한 자는 다르다.', icon: '⚖️', source: '트롤리 딜레마', category: '철학' },
      { name: '생명의 절대성', desc: '누구도 타인의 생명을 빼앗을 권리가 없다. 그가 어떤 사람이든.', icon: '🛡️', source: '트롤리 딜레마', category: '철학' },
      { name: '동의 기반 윤리', desc: '본인의 자발적 동의가 있다면 행위의 도덕성이 달라진다. 자율성은 존중받아야 한다.', icon: '🤝', source: '트롤리 딜레마', category: '철학' },
      { name: '행위자 중심 윤리', desc: '도덕적 판단의 핵심은 결과나 동의가 아니라, 행위자 자신의 행위다. 내가 죽이는 것은 내 행위다.', icon: '🪞', source: '트롤리 딜레마', category: '철학' },

      // 복제인간 (스토리)
      { name: '확장된 자아', desc: "정체성은 고정된 것이 아니라 확장될 수 있다. '나'는 하나일 필요가 없다.", icon: '🤝', source: '복제인간', category: '스토리' },
      { name: '갈등의 해결', desc: '존재의 정당성은 폭력으로 증명되지 않는다. 갈등은 파괴가 아닌 이해로 해결된다.', icon: '⚔️', source: '복제인간', category: '스토리' },
      { name: '실용적 정체성', desc: "정체성은 사회적 합의이기도 하다. '누구인가'보다 '어떻게 살 것인가'가 중요할 때가 있다.", icon: '📋', source: '복제인간', category: '스토리' },
      { name: '선택의 총합', desc: '정체성은 선택의 총합이다. 같은 시작도 다른 선택을 통해 완전히 다른 사람이 된다.', icon: '🔀', source: '복제인간', category: '스토리' },
      { name: '공유된 정체성', desc: "정체성은 공유될 수 있다. 완전한 소통이 가능하다면 '개인'의 경계는 흐려질 수 있다.", icon: '🔄', source: '복제인간', category: '스토리' },
      { name: '내면의 연속성', desc: "정체성은 외부 조건이 아닌 내면의 연속성이다. 모든 것을 잃어도 '나'는 남는다.", icon: '🌅', source: '복제인간', category: '스토리' },
      { name: '타인의 인정', desc: "정체성은 타인의 인정 위에 서 있다. 아무도 모르는 '나'는 존재할 수 있는가?", icon: '🚶', source: '복제인간', category: '스토리' },
      { name: '사회적 정체성', desc: '정체성은 법과 사회가 규정하는 것이기도 하다. 새로운 존재는 새로운 권리를 요구한다.', icon: '⚖️', source: '복제인간', category: '스토리' },
      { name: '숨겨진 자아', desc: '정체성은 때로 숨겨야 살아남는다. 진정한 자아와 사회적 자아는 다를 수 있다.', icon: '🌑', source: '복제인간', category: '스토리' },

      // 생존자의 선택 (심리)
      { name: '실용적 선택', desc: '가장 다양하게 활용할 수 있는 것을 선택한다.', icon: '🔪', source: '생존자의 선택', category: '심리' },
      { name: '본질 추구', desc: '가장 근본적인 것이 가장 중요하다.', icon: '🔥', source: '생존자의 선택', category: '심리' },
      { name: '연결의 힘', desc: '개별 요소를 연결하면 새로운 가치가 생긴다.', icon: '🪢', source: '생존자의 선택', category: '심리' },
      { name: '협력의 가치', desc: '단기적 손해를 감수해도 협력은 장기적으로 이득이다.', icon: '🤝', source: '생존자의 선택', category: '심리' },
      { name: '생존 우선', desc: '자신을 먼저 지켜야 남도 도울 수 있다.', icon: '🛡️', source: '생존자의 선택', category: '심리' },
      { name: '결단의 순간', desc: '때로는 모든 것을 걸어야 할 순간이 있다.', icon: '🎲', source: '생존자의 선택', category: '심리' },
      { name: '신중한 대기', desc: '불확실한 기회보다 확실한 현재가 나을 때가 있다.', icon: '⏳', source: '생존자의 선택', category: '심리' },

      // 뒷담화 현장 (심리)
      { name: '충동적 대면의 비용', desc: '감정이 앞서면 정보 없이 싸움터에 들어간다. 오히려 과민반응하는 사람으로 보일 수 있다.', icon: '🚪', source: '뒷담화 현장', category: '심리' },
      { name: '정보 비대칭', desc: '상대가 모르는 걸 내가 알 때 선택권이 생긴다. 대응할지, 무시할지, 정보가 있어야 판단할 수 있다.', icon: '👂', source: '뒷담화 현장', category: '심리' },
      { name: '전략적 무시', desc: '모든 갈등에 에너지를 쓸 필요는 없다. 한 번의 험담이 패턴인지, 일회성인지 모르면 반응하지 않는 게 낫다.', icon: '😐', source: '뒷담화 현장', category: '심리' },
      { name: '열린 질문의 함정', desc: '"무슨 얘기했어?"는 상대에게 도망칠 구멍을 준다. 거짓말할 여지가 있는 질문은 거짓말을 부른다.', icon: '❓', source: '뒷담화 현장', category: '심리' },
      { name: '모호함의 압박', desc: '상대가 "내가 뭘 아는지"를 모를 때, 그들은 스스로 불안해하고 행동을 조심하게 된다.', icon: '🤫', source: '뒷담화 현장', category: '심리' },
      { name: '직접 대면의 비용', desc: '사과를 받아도 관계는 회복되지 않는다. "걔 앞에서 조심해야 해"라는 새로운 낙인이 생긴다.', icon: '⚠️', source: '뒷담화 현장', category: '심리' },
      { name: '피드백으로서의 뒷담화', desc: '뒷담화는 불쾌하지만, 면전에서 듣기 어려운 솔직한 평가일 수 있다. 감정을 빼고 정보만 취하면 자기 인식의 도구가 된다.', icon: '🪞', source: '뒷담화 현장', category: '심리' },
      { name: '선택적 무시', desc: '모든 갈등에 반응하면 에너지가 고갈된다. 실질적 피해가 없으면 무시하는 것도 전략이다.', icon: '🙈', source: '뒷담화 현장', category: '심리' },
      { name: '조용한 거리두기', desc: '직접 대면하지 않고도 관계를 재조정할 수 있다. 싸우지 않고 멀어지면 상대도 눈치챈다.', icon: '🚶', source: '뒷담화 현장', category: '심리' },
      { name: '제3자 개입의 위험', desc: '둘 사이의 문제에 제3자를 끌어들이면 상황이 복잡해진다. 당신의 질문 자체가 새로운 얘깃거리가 된다.', icon: '👥', source: '뒷담화 현장', category: '심리' },
      { name: '관계 재편성', desc: '모든 사람과 잘 지낼 필요는 없다. 갈등 후 자연스럽게 거리가 생기는 건 정상이다.', icon: '🔄', source: '뒷담화 현장', category: '심리' },
      { name: '프로페셔널 거리', desc: '직장 관계는 친구 관계가 아니다. 업무적으로 문제없이 협력하면 충분하다.', icon: '💼', source: '뒷담화 현장', category: '심리' },
      { name: '보이지 않는 변화', desc: '대면하지 않고도 상황을 바꿀 수 있다. 내 행동이 바뀌면 상대의 반응도 바뀐다.', icon: '🦋', source: '뒷담화 현장', category: '심리' },
      { name: '인정 + 경계', desc: '내 잘못을 인정하면서도 상대의 잘못도 짚는다. 둘 다 맞을 수 있다.', icon: '⚖️', source: '뒷담화 현장', category: '심리' },
      { name: '손절의 지혜', desc: '한 번은 실수, 두 번은 패턴이다. 같은 행동이 반복되면 대면보다 거리두기가 효과적이다.', icon: '✂️', source: '뒷담화 현장', category: '심리' },
      { name: '불확실성의 효과', desc: '상대가 "내가 뭘 아는지" 모르면, 스스로 행동을 조심한다. 대면 없이도 억제력이 생긴다.', icon: '❔', source: '뒷담화 현장', category: '심리' },
      { name: '조용한 경계', desc: '말로 선을 긋지 않아도 행동으로 거리를 둘 수 있다. 대면의 비용 없이 관계를 재조정한다.', icon: '🚧', source: '뒷담화 현장', category: '심리' },
      { name: '손실 최소화', desc: '이미 잘못된 상황에서는 더 나빠지지 않게 하는 게 최선이다. 실수를 인정하고 빠르게 수습한다.', icon: '🛑', source: '뒷담화 현장', category: '심리' },

      // 죽음을 앞둔 선택 (철학)
      { name: '부정', desc: '죽음을 직면했을 때 나타나는 첫 번째 방어 기제. 퀴블러-로스가 정의한 애도의 5단계 중 첫 단계다.', icon: '🚫', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '스토아적 수용', desc: '우리가 통제할 수 있는 것과 없는 것을 구분하라. 통제 밖의 것에 흔들리지 않는 것이 지혜다.', icon: '🏛️', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '부조리에 대한 분노', desc: '세상은 공정하지 않다. 이유 없이 고통받는다는 사실 자체가 인간을 분노하게 만든다.', icon: '😤', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '죽음 앞의 자유', desc: '죽음을 확정적으로 마주하면, 역설적으로 삶의 속박에서 풀려난다. 하이데거가 말한 본래적 실존의 시작.', icon: '🕊️', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '냉소적 방어', desc: '의미를 부정함으로써 고통을 회피한다. 상처받지 않기 위해 먼저 모든 것을 무의미하게 만든다.', icon: '😏', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '카르페 디엠', desc: '오늘을 잡아라. 내일은 약속되지 않았다. 순간을 최대한 살아라.', icon: '📝', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '일상의 신성함', desc: '깨달음은 특별한 곳에 없다. 밥 먹고, 잠자고, 걷는 것. 평범한 일상이 곧 수행이다.', icon: '🍵', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '불멸 프로젝트', desc: '인간은 죽음을 알기에, 상징적 불멸을 추구한다. 업적, 자녀, 예술 - 모두 죽음을 부정하려는 시도다.', icon: '📚', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '관계의 본질', desc: '인간은 관계 속에서만 진정한 자기가 된다. "나"는 "너"를 통해서만 존재한다.', icon: '🤝', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '고독한 죽음', desc: '죽음은 결국 혼자 맞이하는 것이다. 누구도 대신 죽어줄 수 없다. 그래서 혼자 준비한다.', icon: '🚶', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '초월적 의탁', desc: '인간 이성으로 이해할 수 없는 것들이 있다. 그때 믿음이 시작된다. 신, 운명, 우주의 섭리.', icon: '🙏', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '유물론적 죽음관', desc: '죽음 이후에는 아무것도 없다. 그래서 두려워할 것도 없다. 에피쿠로스는 말했다 - 죽음은 우리와 무관하다고.', icon: '⚫', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '영혼 불멸', desc: '죽음은 끝이 아니라 이동이다. 플라톤은 영혼의 불멸을, 종교는 내세를 말한다.', icon: '✨', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '불가지론', desc: '알 수 없는 것에 대해 모른다고 인정하는 것. 이것이 소크라테스가 말한 진정한 지혜의 시작이다.', icon: '❓', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '유한성의 의미', desc: '한계가 있어서 선택이 의미를 갖는다. 무한한 시간에서는 아무것도 중요하지 않다.', icon: '⏳', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '죽음의 망각', desc: '대부분의 인간은 죽음을 외면하며 산다. 하이데거가 비판한 "세인"의 삶. 편하지만 진정성이 없다.', icon: '😶', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '죽음 공포', desc: '어니스트 베커에 따르면, 인간 행동의 상당 부분은 죽음 공포에서 비롯된다. 공포를 인정하는 것이 첫걸음이다.', icon: '😨', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '삶에의 의지', desc: '쇼펜하우어가 말한 맹목적 삶의 충동. 이성으로 제어할 수 없는 근원적 욕구. 살고 싶다는 것.', icon: '🔥', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '감사의 철학', desc: '삶 자체가 선물이다. 주어진 것에 감사하는 태도. 스토아 철학과 종교적 지혜가 공유하는 덕목.', icon: '🙏', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '허무', desc: '모든 의미는 인간이 만든 환상이다. 죽음 앞에서 그 환상이 벗겨진다. 니힐리즘의 직시.', icon: '🕳️', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '윤회적 희망', desc: '삶은 원환한다. 이번 생의 업은 다음 생으로 이어진다. 불교와 힌두교의 핵심 세계관.', icon: '🔄', source: '죽음을 앞둔 선택', category: '철학' },
      { name: '무심', desc: '마음을 비운다. 집착도, 미련도, 생각도 내려놓는다. 선불교가 추구하는 궁극의 경지.', icon: '🌊', source: '죽음을 앞둔 선택', category: '철학' },

      // 읽씹 시뮬레이터 (심리)
      { name: '불확실성 내성', desc: '모호한 상황을 견디는 심리적 능력. 불확실성 내성이 높을수록 불안에 덜 휘둘린다.', icon: '⏳', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '간헐적 강화', desc: '보상이 불규칙하게 주어질 때 행동이 가장 강하게 유지된다. 슬롯머신과 같은 원리.', icon: '🎰', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '회피적 대처', desc: '스트레스 상황을 피하거나 무시하는 대처 방식. 단기적으로 효과적이나 장기적으로는 문제가 될 수 있다.', icon: '🙈', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '자기 귀인 편향', desc: '상대의 행동 원인을 자신에게서 찾는 경향. 관계에서 불안형 애착의 특징이다.', icon: '🔍', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '좌절-공격 가설', desc: '목표 달성이 좌절되면 공격적 충동이 생긴다는 이론. 읽씹은 연결 욕구의 좌절이다.', icon: '😤', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '인지 부조화 해소', desc: '불편한 현실을 합리화하여 심리적 균형을 맞추려는 시도. 때로는 자기 보호, 때로는 자기기만.', icon: '🧠', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '불확실성 회피', desc: '애매한 상황을 빨리 끝내려는 심리. 답을 얻으려 하지만 역효과를 낳을 수 있다.', icon: '❓', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '사회적 지지 추구', desc: '스트레스 상황에서 타인의 조언이나 위로를 구하는 건강한 대처 방식.', icon: '👥', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '통제 욕구', desc: '불확실한 상황에서 정보를 수집해 통제감을 얻으려는 심리. 과도하면 집착이 된다.', icon: '🔎', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '선제적 자기 보호', desc: '거절당하기 전에 먼저 마음을 철회하는 방어 기제. 회피형 애착의 특징.', icon: '🛡️', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '관계 지향적 대처', desc: '갈등보다 조화를 우선시하는 대처 방식. 관계 유지에 도움되지만 자기 감정이 억압될 수 있다.', icon: '🤝', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '확인 추구', desc: '불확실한 상황에서 명확한 답을 얻으려는 욕구. 과하면 상대를 압박할 수 있다.', icon: '🧐', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '감정적 거리두기', desc: '상처받지 않기 위해 감정 표현을 억제하는 방어 기제. 회피형 애착의 특징.', icon: '😐', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '호혜성의 원칙', desc: '받은 대로 돌려주려는 심리. 긍정적으로는 감사, 부정적으로는 보복으로 나타난다.', icon: '⚖️', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '자기 표현', desc: '자신의 감정과 욕구를 솔직하게 전달하는 것. 건강한 관계의 기초이지만 용기가 필요하다.', icon: '💬', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '수용', desc: '바꿀 수 없는 것을 받아들이는 것. 스토아 철학의 핵심 가르침이자 심리적 유연성의 기초.', icon: '🙏', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '직접 소통', desc: '문제를 회피하지 않고 직접 다루는 것. 단기적 불편함이 있지만 장기적으로 관계를 개선한다.', icon: '🗣️', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '투자 조절', desc: '관계에 쏟는 에너지를 상대의 투자에 맞추는 것. 불균형한 관계에서 자신을 보호한다.', icon: '📉', source: '읽씹 시뮬레이터', category: '심리' },
      { name: '팃포탯', desc: '상대의 행동을 그대로 따라하는 전략. 게임이론에서는 효과적이나 관계에서는 악순환을 부를 수 있다.', icon: '🔄', source: '읽씹 시뮬레이터', category: '심리' },

      // 복수 시뮬레이터 (심리/철학)
      { name: '원한의 심리학', desc: '해결되지 않은 분노는 마음속에 남아 반복적으로 떠오른다. 이를 침투적 사고라 한다.', icon: '🔥', source: '복수 시뮬레이터', category: '심리' },
      { name: '감정의 자연 소멸', desc: '모든 감정은 시간이 지나면 강도가 약해진다. 하지만 해결되지 않으면 다른 형태로 나타날 수 있다.', icon: '⏳', source: '복수 시뮬레이터', category: '심리' },
      { name: '용서의 역설', desc: '용서는 상대를 위한 것 같지만, 실제로는 자신을 원한에서 해방시키는 행위다.', icon: '🕊️', source: '복수 시뮬레이터', category: '심리' },
      { name: '응보 욕구', desc: '잘못에는 대가가 따라야 한다는 인간의 본능적 정의감. 진화적으로 협력을 유지하기 위한 메커니즘이다.', icon: '⚖️', source: '복수 시뮬레이터', category: '심리' },
      { name: '즉각적 응보', desc: '잘못에 대해 즉시 보복하는 것. 감정적 해소는 되지만 예상치 못한 결과를 낳을 수 있다.', icon: '⚡', source: '복수 시뮬레이터', category: '심리' },
      { name: '전략적 보류', desc: '당장 사용하지 않고 최적의 타이밍을 기다리는 것. 마키아벨리가 말한 권력의 기술.', icon: '🃏', source: '복수 시뮬레이터', category: '심리' },
      { name: '경고의 기능', desc: '실제 보복 없이 위협만으로 상대의 행동을 억제하는 것. 협상의 도구가 될 수 있다.', icon: '⚠️', source: '복수 시뮬레이터', category: '심리' },
      { name: '무조건적 용서', desc: '상대의 변화나 사과 없이도 용서하는 것. 가장 어렵지만 가장 자유로운 선택.', icon: '💚', source: '복수 시뮬레이터', category: '심리' },
      { name: '가치 기반 결정', desc: '결과가 아닌 자신의 가치관에 따라 행동하는 것. 칸트의 의무론적 윤리학의 핵심.', icon: '🧭', source: '복수 시뮬레이터', category: '철학' },
      { name: '전략적 인내', desc: '감정에 휘둘리지 않고 최적의 순간을 기다리는 것. 체스에서 중요한 수를 아끼는 것과 같다.', icon: '⏰', source: '복수 시뮬레이터', category: '심리' },
      { name: '비용-편익 분석', desc: '행동의 결과를 계산하여 결정하는 것. 결과주의적 윤리학의 핵심.', icon: '🧮', source: '복수 시뮬레이터', category: '철학' },
      { name: '사회적 동조', desc: '집단의 기대나 압력에 따라 행동하는 것. 인간의 사회적 본성.', icon: '👥', source: '복수 시뮬레이터', category: '심리' },
      { name: '자율성', desc: '자신의 결정을 스스로 내리는 것. 자기 결정권은 인간 존엄의 핵심.', icon: '🦅', source: '복수 시뮬레이터', category: '철학' },
      { name: '응보적 정의', desc: '잘못에는 대가가 따라야 한다는 정의관. 눈에는 눈의 원칙.', icon: '⚔️', source: '복수 시뮬레이터', category: '철학' },
      { name: '힘의 절제', desc: '할 수 있지만 하지 않는 것. 진정한 힘은 사용하지 않을 때 드러난다.', icon: '🏛️', source: '복수 시뮬레이터', category: '철학' },
      { name: '회복적 접근', desc: '처벌보다 관계 회복을 추구하는 정의관. 상대에게 변화의 기회를 준다.', icon: '🤝', source: '복수 시뮬레이터', category: '철학' },
      { name: '협상 레버리지', desc: '정보나 권력을 협상의 도구로 사용하는 것. 마키아벨리적 현실주의.', icon: '💼', source: '복수 시뮬레이터', category: '심리' },
      { name: '관망의 전략', desc: '성급히 행동하지 않고 상황이 어떻게 전개되는지 지켜보는 것.', icon: '👀', source: '복수 시뮬레이터', category: '심리' },
      { name: '전략적 무관심', desc: '상대에게 관심을 주지 않는 것 자체가 하나의 대응 방식. 때로는 가장 효과적인 복수이기도 하다.', icon: '🙄', source: '복수 시뮬레이터', category: '심리' },

      // 마지막 인류 (철학)
      { name: '희망의 원리', desc: '에른스트 블로흐는 희망을 인간 존재의 근본 원리라 했다. 아직 아닌 것을 향해 나아가는 힘.', icon: '🔦', source: '마지막 인류', category: '철학' },
      { name: '실존적 절망', desc: '키르케고르가 말한 절망은 자기 자신과의 관계가 무너진 상태다. 존재의 근거가 흔들린다.', icon: '🌑', source: '마지막 인류', category: '철학' },
      { name: '생존 본능', desc: '쇼펜하우어의 삶에의 의지. 이성보다 앞서는, 존재 자체가 살려는 근원적 충동.', icon: '🔥', source: '마지막 인류', category: '철학' },
      { name: '부조리의 인식', desc: '카뮈가 말한 부조리. 의미를 찾는 인간과 침묵하는 세계 사이의 간극.', icon: '🎭', source: '마지막 인류', category: '철학' },
      { name: '절대적 자유', desc: '사르트르는 인간이 자유에 처해졌다고 말했다. 타인이 없으면 자유는 완전해진다. 하지만 그 무게도.', icon: '🦅', source: '마지막 인류', category: '철학' },
      { name: '습관의 힘', desc: '파스칼은 습관을 제2의 천성이라 했다. 이유 없이도 행동할 수 있게 해주는 것.', icon: '🔁', source: '마지막 인류', category: '철학' },
      { name: '욕망의 해방', desc: '들뢰즈와 가타리는 욕망을 긍정했다. 억압에서 풀려난 욕망은 창조가 된다.', icon: '✨', source: '마지막 인류', category: '철학' },
      { name: '증언의 의무', desc: '레비나스는 타자에 대한 책임을 말했다. 사라진 자들을 위해 기록하는 것도 책임이다.', icon: '📝', source: '마지막 인류', category: '철학' },
      { name: '허무주의', desc: '니체가 경고한 허무주의. 신이 죽고, 이제 인류도 사라졌다. 모든 가치가 무너졌다.', icon: '🕳️', source: '마지막 인류', category: '철학' },
      { name: '본질적 자아', desc: '데카르트의 나는 생각한다, 고로 존재한다. 타인의 인정 없이도 사유하는 나는 있다.', icon: '💭', source: '마지막 인류', category: '철학' },
      { name: '사회적 자아', desc: '미드는 자아가 사회적 상호작용에서 형성된다고 했다. 타인 없이 자아도 흔들린다.', icon: '👥', source: '마지막 인류', category: '철학' },
      { name: '무아', desc: '불교의 무아 사상. 고정된 자아는 환상이다. 집착에서 벗어나면 자유로워진다.', icon: '🌊', source: '마지막 인류', category: '철학' },
      { name: '인류의 대리자', desc: '한나 아렌트는 인간의 조건을 복수성이라 했다. 마지막 한 명은 역설적으로 모두를 대표한다.', icon: '🌍', source: '마지막 인류', category: '철학' },
      { name: '경계의 해체', desc: '장자는 물아일체를 말했다. 나와 세계의 구분이 사라질 때, 새로운 존재 방식이 열린다.', icon: '🌫️', source: '마지막 인류', category: '철학' },
      { name: '존재의 증거', desc: '파스칼은 인간을 생각하는 갈대라 했다. 우주가 침묵해도, 우리가 생각했다는 것은 사라지지 않는다.', icon: '📜', source: '마지막 인류', category: '철학' },
      { name: '무상', desc: '모든 것은 변한다. 영원한 것은 없다. 불교의 근본 가르침.', icon: '🍂', source: '마지막 인류', category: '철학' },
      { name: '삶의 긍정', desc: '니체의 영원회귀. 이 삶을 무한히 반복해도 좋다고 말할 수 있는가? 그것이 삶의 긍정이다.', icon: '♾️', source: '마지막 인류', category: '철학' },
      { name: '자기 결정권', desc: '스토아 철학자들은 죽음을 선택할 권리를 인정했다. 삶의 주인은 끝까지 나다.', icon: '🚪', source: '마지막 인류', category: '철학' },
      { name: '존재의 경이', desc: '하이데거는 왜 무가 아니라 존재가 있는가라고 물었다. 존재 자체가 기적이다.', icon: '🙏', source: '마지막 인류', category: '철학' },

      // 신이 된다면 (철학)
      { name: '신정론의 도전', desc: '전지전능하고 선한 신이 존재한다면 왜 악과 고통이 존재하는가? 라이프니츠가 제기한 철학적 난제.', icon: '❓', source: '신이 된다면', category: '철학' },
      { name: '의도하지 않은 결과', desc: '모든 행동은 예측하지 못한 결과를 낳는다. 복잡한 시스템에서 개입은 항상 부작용을 동반한다.', icon: '🔄', source: '신이 된다면', category: '철학' },
      { name: '지식의 저주', desc: '모든 것을 알면 행복할까? 카산드라처럼 미래를 알지만 바꿀 수 없다면 고통일 뿐이다.', icon: '📚', source: '신이 된다면', category: '철학' },
      { name: '합리적 이기주의', desc: '에고이즘은 반드시 악한가? 랜드는 자기 이익 추구가 도덕적으로 정당하다고 주장했다.', icon: '👤', source: '신이 된다면', category: '철학' },
      { name: '신의 침묵', desc: '신이 존재하지만 개입하지 않는다는 이신론. 시계공은 시계를 만들고 떠난다.', icon: '🤫', source: '신이 된다면', category: '철학' },
      { name: '결과주의적 신', desc: '결과만이 중요하다면, 고통 없는 세상이 자유로운 세상보다 낫다. 공리주의의 극단.', icon: '📊', source: '신이 된다면', category: '철학' },
      { name: '자유의지 방어', desc: '악은 자유의지의 부작용이다. 하지만 자유 없는 선은 선이 아니다. 알빈 플란팅가의 논증.', icon: '🗽', source: '신이 된다면', category: '철학' },
      { name: '세뇌의 역설', desc: '마음을 바꾸는 것이 행동을 막는 것보다 나은가? 자유의지를 조작하는 것은 더 큰 침해일 수 있다.', icon: '🧠', source: '신이 된다면', category: '철학' },
      { name: '한계의 인정', desc: '전지전능조차 완벽한 세상을 만들 수 없다면, 어쩌면 이 세상이 가능한 최선일지 모른다.', icon: '🔙', source: '신이 된다면', category: '철학' },
      { name: '국지적 선', desc: '전체를 바꿀 수 없다면 부분을 돕는다. 테레사 수녀의 방식.', icon: '🌱', source: '신이 된다면', category: '철학' },
      { name: '계시의 한계', desc: '신이 말해도 인간은 듣지 않는다. 모든 종교에 신의 말씀이 있지만 인간은 여전히 싸운다.', icon: '📜', source: '신이 된다면', category: '철학' },
      { name: '신적 관조', desc: '아리스토텔레스가 말한 테오리아. 가장 높은 행복은 순수한 관조에 있다.', icon: '👁️', source: '신이 된다면', category: '철학' },
      { name: '지혜의 보존', desc: '경험에서 지혜를 추출한다. 플라톤의 동굴에서 나온 자가 다시 돌아가 말하는 것.', icon: '💎', source: '신이 된다면', category: '철학' },
      { name: '유한성의 축복', desc: '한계가 있기에 선택이 의미있다. 모든 것이 가능하면 아무것도 특별하지 않다.', icon: '🙏', source: '신이 된다면', category: '철학' },
      { name: '행위자의 후회', desc: '무엇을 하든 더 할 수 있었다는 후회는 남는다. 버나드 윌리엄스가 말한 도덕적 잔여.', icon: '😔', source: '신이 된다면', category: '철학' },
      { name: '신적 사랑의 역설', desc: '진정한 사랑은 자유를 주는 것. 부모가 자녀를 놓아주듯, 신도 인간을 놓아준다.', icon: '💫', source: '신이 된다면', category: '철학' },
      { name: '경험적 무신론', desc: '악의 존재는 신의 부재를 증명한다. 신이 있었다면 개입했을 것이다.', icon: '❌', source: '신이 된다면', category: '철학' },
      { name: '신비의 수용', desc: '모든 것을 안다고 해서 모든 것을 이해하는 것은 아니다. 앎 너머의 영역.', icon: '🌌', source: '신이 된다면', category: '철학' },

      // 영생 (철학)
      { name: '죽음 공포', desc: '에피쿠로스는 죽음을 두려워할 이유가 없다고 했다. 하지만 대부분의 인간은 죽음을 두려워한다.', icon: '💀', source: '영생', category: '철학' },
      { name: '유한성의 가치', desc: '하이데거는 죽음을 향한 존재만이 진정으로 살 수 있다고 했다. 유한함이 삶의 의미를 만든다.', icon: '⏳', source: '영생', category: '철학' },
      { name: '비가역성의 두려움', desc: '돌이킬 수 없는 결정은 두렵다. 영생은 가장 돌이킬 수 없는 결정이다.', icon: '🔒', source: '영생', category: '철학' },
      { name: '결정의 회피', desc: '사르트르는 선택하지 않는 것도 선택이라 했다. 미루는 것은 거절하는 것과 같다.', icon: '⏸️', source: '영생', category: '철학' },
      { name: '공유된 영원', desc: '인간은 관계 속에서만 의미를 찾는다. 혼자의 영생은 고독한 감옥일 수 있다.', icon: '💑', source: '영생', category: '철학' },
      { name: '반복의 용기', desc: '카뮈의 시지프스. 무의미한 것을 알면서도 계속하는 것. 그것이 부조리에 대한 반항이다.', icon: '🪨', source: '영생', category: '철학' },
      { name: '회피적 애착', desc: '상실의 고통을 피하기 위해 애착을 회피한다. 하지만 고통 없는 삶은 삶이 아니다.', icon: '🛡️', source: '영생', category: '철학' },
      { name: '초월적 목적', desc: '빅터 프랭클은 의미를 찾으면 어떤 고통도 견딜 수 있다고 했다. 영생도 마찬가지.', icon: '🎯', source: '영생', category: '철학' },
      { name: '기억의 의무', desc: '잊히면 진짜로 죽는다. 영생자는 사라진 이들의 마지막 기억 장소가 된다.', icon: '📖', source: '영생', category: '철학' },
      { name: '영생의 역설', desc: '버나드 윌리엄스는 영생이 지루하고 무의미해질 것이라 주장했다. 죽음이 삶을 의미있게 만든다.', icon: '😢', source: '영생', category: '철학' },
      { name: '역사의 진보', desc: '헤겔은 역사가 자유를 향해 진보한다고 믿었다. 1000년의 관찰자는 이것을 확인할 수 있을까?', icon: '📈', source: '영생', category: '철학' },
      { name: '영원회귀', desc: '니체는 모든 것이 무한히 반복된다고 상상했다. 영생자에게 이것은 상상이 아니라 현실이다.', icon: '🔄', source: '영생', category: '철학' },
      { name: '부조리 수용', desc: '카뮈의 부조리 철학. 의미를 찾지 못해도 살아가는 것 자체가 반항이다.', icon: '🎭', source: '영생', category: '철학' },
      { name: '감정의 마모', desc: '시간은 모든 것을 닳게 한다. 무한한 시간은 무한한 무감각을 만들 수 있다.', icon: '😶', source: '영생', category: '철학' },
      { name: '철인왕', desc: '플라톤의 이상. 지혜로운 자가 통치해야 한다. 1000년을 산 자보다 지혜로운 자가 있을까?', icon: '👑', source: '영생', category: '철학' },
      { name: '적멸', desc: '불교에서 말하는 열반. 모든 욕망과 고통이 사라진 상태. 영원한 고요.', icon: '🕊️', source: '영생', category: '철학' },
      { name: '존재의 공포', desc: '키르케고르가 말한 절망. 자기 자신이기를 원하지 않지만 자기 자신일 수밖에 없는 상태.', icon: '😱', source: '영생', category: '철학' },
      { name: '창조의 의지', desc: '니체의 초인은 새로운 가치를 창조한다. 우주가 끝나면 새 우주를 만드는 것.', icon: '✨', source: '영생', category: '철학' },
      { name: '의식의 보류', desc: '존재와 의식은 다르다. 의식 없이 존재할 수 있다면, 영원도 견딜 수 있다.', icon: '💤', source: '영생', category: '철학' },
      { name: '무한한 가능성', desc: '무한한 시간 안에서 확률 0이 아닌 모든 것은 반드시 일어난다. 볼츠만 뇌 이론.', icon: '🌟', source: '영생', category: '철학' },

      // 내면의 그림자 (심리)
      { name: '그림자 투사', desc: '융의 핵심 개념. 자신이 인정하지 못하는 특성을 타인에게서 발견하고 혐오한다.', icon: '🪞', source: '내면의 그림자', category: '심리' },
      { name: '페르소나와 그림자', desc: '페르소나(가면)가 강할수록 그림자도 깊어진다. 강한 척 하는 만큼 내면의 연약함은 억압된다.', icon: '🎭', source: '내면의 그림자', category: '심리' },
      { name: '억압된 욕구', desc: '지나친 이타성은 자기 욕구의 억압일 수 있다. 균형 잡힌 자기 돌봄이 건강한 관계의 기초다.', icon: '⚖️', source: '내면의 그림자', category: '심리' },
      { name: '감정과 이성의 균형', desc: '융은 네 가지 기능(사고, 감정, 감각, 직관) 중 덜 발달한 것이 그림자가 된다고 했다.', icon: '🧠', source: '내면의 그림자', category: '심리' },
      { name: '페르소나의 필요성', desc: '사회적 가면(페르소나)은 나쁜 것이 아니다. 다만 그것이 진짜 자신이라고 착각하면 문제가 된다.', icon: '🎪', source: '내면의 그림자', category: '심리' },
      { name: '꿈의 보상 기능', desc: '꿈은 의식의 일방성을 보상한다. 낮에 억누른 것이 밤에 나타난다.', icon: '💢', source: '내면의 그림자', category: '심리' },
      { name: '억압된 자유', desc: '의무와 책임에 충실한 삶은 내면의 자유로운 영혼을 억누른다. 그것이 꿈에서 탈출로 나타난다.', icon: '🏃', source: '내면의 그림자', category: '심리' },
      { name: '열등감의 보상', desc: '아들러가 말한 열등감 보상. 현실의 무력감이 꿈에서 전능감으로 나타난다.', icon: '⚡', source: '내면의 그림자', category: '심리' },
      { name: '아니마/아니무스', desc: '융은 남성 내면의 여성성(아니마)과 여성 내면의 남성성(아니무스)이 꿈에서 나타난다고 했다.', icon: '💫', source: '내면의 그림자', category: '심리' },
      { name: '불안의 상징화', desc: '꿈은 추상적 감정을 구체적 이미지로 바꾼다. 떨어지는 꿈은 통제력 상실의 상징.', icon: '😰', source: '내면의 그림자', category: '심리' },
      { name: '그림자의 인정', desc: '그림자를 부정하면 더 강해진다. 인정하면 통합의 길이 열린다.', icon: '🔴', source: '내면의 그림자', category: '심리' },
      { name: '도덕적 그림자', desc: '지나친 선함도 그림자를 만든다. 억압된 어두움은 언젠가 폭발한다.', icon: '🔵', source: '내면의 그림자', category: '심리' },
      { name: '합리화', desc: '지성화는 감정을 회피하는 방어기제다. 머리로 이해하면 마음의 불편함을 피할 수 있다.', icon: '🤔', source: '내면의 그림자', category: '심리' },
      { name: '개성화', desc: '융 심리학의 궁극적 목표. 의식과 무의식, 페르소나와 그림자를 통합하여 온전한 자기가 되는 것.', icon: '🌓', source: '내면의 그림자', category: '심리' },
      { name: '억압의 역설', desc: '억압된 것은 사라지지 않고 더 강해진다. 프로이트가 발견한 억압의 회귀.', icon: '⚔️', source: '내면의 그림자', category: '심리' },
      { name: '통찰', desc: '무의식적 내용을 의식화하는 것. 인식하는 것만으로도 치유가 시작된다.', icon: '💡', source: '내면의 그림자', category: '심리' },
      { name: '그림자의 힘', desc: '인정하지 않은 그림자는 투사, 강박, 증상으로 나타난다. 피할수록 강해진다.', icon: '😨', source: '내면의 그림자', category: '심리' },
      { name: '능동적 상상', desc: '깨어있는 상태에서 무의식의 이미지와 대화하는 융의 기법. 그림자와 협상하는 방법.', icon: '💬', source: '내면의 그림자', category: '심리' },

      // 이별 시뮬레이터 (심리/철학)
      { name: '급진적 정직', desc: '관계에서 불편한 진실을 피하지 않는 것. 자기기만을 거부하고 현실을 직면한다.', icon: '🪞', source: '이별 시뮬레이터', category: '심리' },
      { name: '수동적 희망', desc: '행동 없이 상황이 나아지길 바라는 것. 때로는 지혜지만, 때로는 회피의 다른 이름이다.', icon: '⏳', source: '이별 시뮬레이터', category: '심리' },
      { name: '회피 기제', desc: '불편한 감정을 피하기 위해 다른 것에 몰두하는 것. 문제를 해결하지 않고 미룬다.', icon: '🏃', source: '이별 시뮬레이터', category: '심리' },
      { name: '감정 부정', desc: '자신의 감정을 믿지 않고 외부 기준으로 판단하는 것. 하지만 감정에 옳고 그름은 없다.', icon: '❓', source: '이별 시뮬레이터', category: '심리' },
      { name: '관계의 게임화', desc: '사랑을 시험과 테스트로 만드는 것. 불안에서 비롯되지만 관계를 더 불안하게 만든다.', icon: '🎮', source: '이별 시뮬레이터', category: '심리' },
      { name: '결단의 윤리', desc: '키르케고르의 실존주의. 결정을 미루는 것은 불안 속에 사는 것이다. 선택이 인간을 만든다.', icon: '⚔️', source: '이별 시뮬레이터', category: '철학' },
      { name: '매몰비용과 헌신', desc: '이미 투자한 시간이 미래 결정에 영향을 주는 것. 때로는 오류지만, 때로는 헌신의 표현이다.', icon: '💎', source: '이별 시뮬레이터', category: '심리' },
      { name: '책임의 회피', desc: '결정의 짐을 타인에게 미루는 것. 사르트르는 이것을 자기기만이라 불렀다.', icon: '🙈', source: '이별 시뮬레이터', category: '철학' },
      { name: '나-너 관계', desc: '마르틴 부버의 대화 철학. 상대를 대상이 아닌 주체로 대하는 것. 진정한 관계의 시작.', icon: '🤝', source: '이별 시뮬레이터', category: '철학' },
      { name: '정언명령', desc: '칸트의 도덕 원칙. 인간을 수단이 아닌 목적으로 대하라. 거짓은 상대의 존엄을 훼손한다.', icon: '📜', source: '이별 시뮬레이터', category: '철학' },
      { name: '선의의 거짓말', desc: '상대를 보호하려는 거짓. 좋은 의도지만, 상대의 알 권리를 박탈한다.', icon: '🎭', source: '이별 시뮬레이터', category: '심리' },
      { name: '고스팅', desc: '설명 없이 사라지는 것. 나는 편하지만 상대에게 미해결의 트라우마를 남긴다.', icon: '👻', source: '이별 시뮬레이터', category: '심리' },
      { name: '투사', desc: '자신의 책임을 타인에게 돌리는 방어기제. 진실을 외면하게 만든다.', icon: '👉', source: '이별 시뮬레이터', category: '심리' },
      { name: '품위 있는 이별', desc: '끝내면서도 상대를 존중하는 것. 관계는 끝나도 인간에 대한 존중은 남는다.', icon: '🌸', source: '이별 시뮬레이터', category: '심리' },
      { name: '무집착', desc: '불교의 핵심 가르침. 집착이 고통의 근원이다. 놓아야 자유로워진다.', icon: '✂️', source: '이별 시뮬레이터', category: '철학' },
      { name: '관계의 전환', desc: '연인에서 친구로. 가능하지만 충분한 거리와 시간이 필요하다.', icon: '🔄', source: '이별 시뮬레이터', category: '심리' },
      { name: '미완의 집착', desc: '완전히 끝내지 못한 관계. 새로운 시작을 방해한다.', icon: '👀', source: '이별 시뮬레이터', category: '심리' },
      { name: '반복 강박', desc: '해결되지 않은 문제로 같은 패턴을 반복하는 것. 변화 없이는 결과도 같다.', icon: '🔁', source: '이별 시뮬레이터', category: '심리' },
      { name: '기능으로서의 인간', desc: '택시 기사, 편의점 직원, 배달 기사. 하루에 수십 명을 만나지만 기능만 보면 한 명도 만나지 않은 것이다.', icon: '⚙️', source: '도구인가 사람인가', category: '철학' },
      { name: '투명한 존재', desc: '시스템이 효율적일수록 사람은 투명해진다. 별점은 있지만 이름은 없다.', icon: '👤', source: '도구인가 사람인가', category: '철학' },
      { name: '예의 바른 거절', desc: '적당히 반응하되 들어가지 않는 것. 가장 세련된 나-그것. 반만 열린 문은 닫힌 문보다 잔인하다.', icon: '🚪', source: '도구인가 사람인가', category: '심리' },
      { name: '질문이 사람을 꺼낸다', desc: '모든 사람에게 이야기가 있다. 아무도 물어보지 않으면 없는 것과 같다.', icon: '🔑', source: '도구인가 사람인가', category: '철학' },
      { name: '목적 없는 만남의 낯섦', desc: '그냥이라는 말을 의심하게 된 순간 관계는 전부 거래가 된 것이다.', icon: '❓', source: '도구인가 사람인가', category: '철학' },
      { name: '쓸모없는 만남의 힘', desc: '가장 의미 있는 관계는 가장 쓸모없는 순간에 만들어진다.', icon: '💫', source: '도구인가 사람인가', category: '철학' },
      { name: '기능으로의 전환', desc: '밥 한번 하자는 만남의 약속이 아니라 지금 만나지 않겠다는 선언이다.', icon: '📅', source: '도구인가 사람인가', category: '심리' },
      { name: '무응답의 메시지', desc: '답하지 않는 것은 침묵이 아니다. 가장 분명한 대답이다.', icon: '💨', source: '도구인가 사람인가', category: '심리' },
      { name: '듣는 척의 비용', desc: '듣는 척은 상대를 속이지 못한다. 비용은 관계의 깊이로 지불된다.', icon: '👂', source: '도구인가 사람인가', category: '심리' },
      { name: '효율적 단절', desc: '관심 없는 사람을 효율적으로 피하면 쓸모 있는 사람만 남는다. 관계가 기능으로 정렬된다.', icon: '✂️', source: '도구인가 사람인가', category: '심리' },
      { name: '5분의 선물', desc: '당신에게 5분이지만 상대에게는 오늘 누군가 내 말을 들어줬다가 된다.', icon: '🎁', source: '도구인가 사람인가', category: '철학' },
      { name: '위장된 관심', desc: '나도는 가장 흔한 대화 탈취다. 공감의 형태를 띠지만 무대를 뺏는 것이다.', icon: '🎤', source: '도구인가 사람인가', category: '심리' },
      { name: '호의의 장부', desc: '도와주고 기억해두면 거래다. 나-너에서 호의는 대가가 없다.', icon: '📒', source: '도구인가 사람인가', category: '철학' },
      { name: '잊혀지는 호의', desc: '진짜 호의는 준 사람이 먼저 잊는다. 오래 기억나는 호의는 미회수 투자일 수 있다.', icon: '🕊️', source: '도구인가 사람인가', category: '철학' },
      { name: '시간의 서열', desc: '시간을 누구에게 쓰느냐가 그 사람의 서열을 보여준다.', icon: '⏰', source: '도구인가 사람인가', category: '심리' },
      { name: '능력의 인정', desc: '대신 해주면 의존자가 되고 가르쳐주면 독립자가 된다. 상대를 어떤 존재로 보느냐의 차이.', icon: '🌱', source: '도구인가 사람인가', category: '철학' },
      { name: '효율적 관계', desc: '가장 가까운 사람에게 가장 효율적으로 대하는 역설. 가까울수록 지금은 아니다를 반복한다.', icon: '📱', source: '도구인가 사람인가', category: '심리' },
      { name: '존재 없는 응답', desc: '응이라고 대답했지만 듣지 않았다. 대화의 형식은 있었지만 내용은 없었다.', icon: '🔇', source: '도구인가 사람인가', category: '심리' },
      { name: '세계에 들어가기', desc: '나-너는 상대의 세계에 잠깐 들어가는 것이다. 사소해 보여도 그것이 그 사람의 전부다.', icon: '🌍', source: '도구인가 사람인가', category: '철학' },
      { name: '나중의 거짓말', desc: '나중에는 오지 않는다. 나중에를 세 번 반복하면 상대는 멈춘다.', icon: '⏳', source: '도구인가 사람인가', category: '심리' },
      { name: '아모르 파티', desc: '니체의 운명애. 고통까지 포함한 삶 전체를 긍정하는 것. 후회 없이 앞으로 나아간다.', icon: '🌱', source: '이별 시뮬레이터', category: '철학' },
      // 완벽한 대체자
