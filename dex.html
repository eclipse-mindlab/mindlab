      { name: '사회적 비교', desc: '타인과 자신을 비교하려는 본능적 충동. 상향 비교는 동기부여가 되지만, 자주 열등감을 낳는다.', icon: '📊', source: '완벽한 대체자', category: '심리' },
      { name: '지위 불안', desc: '자신의 위치가 위협받는다고 느끼는 불안. 알랭 드 보통이 현대 사회의 핵심 고통으로 지목한 감정.', icon: '⚠️', source: '완벽한 대체자', category: '심리' },
      { name: '정서적 거리두기', desc: '감정적 영향을 최소화하기 위해 심리적 거리를 두는 것. 보호 전략이지만 고립을 부를 수 있다.', icon: '🧊', source: '완벽한 대체자', category: '심리' },
      { name: '보상적 노력', desc: '열등감을 극복하기 위해 더 노력하는 것. 건강한 동기지만, 끝없는 레이스가 될 수 있다.', icon: '🏃', source: '완벽한 대체자', category: '심리' },
      { name: '비교 우위', desc: '경쟁에서 이기려면 모든 면에서 뛰어날 필요 없다. 나만의 영역에서 우위를 가지면 된다.', icon: '🎯', source: '완벽한 대체자', category: '심리' },
      { name: '현실 수용', desc: '있는 그대로의 현실을 직면하는 것. 가장 어렵지만 변화의 첫 걸음이 된다.', icon: '🪨', source: '완벽한 대체자', category: '철학' },
      { name: '상대적 박탈감', desc: '타인과 비교해 불공정하다고 느끼는 감정. 분노와 무력감을 동반한다.', icon: '😤', source: '완벽한 대체자', category: '심리' },
      { name: '비교 회피', desc: '불쾌한 비교 상황을 피하려는 행동. 자존감 보호 전략이지만 고립을 부른다.', icon: '🚪', source: '완벽한 대체자', category: '심리' },
      { name: '자기 옹호', desc: '자신의 가치와 권리를 주장하는 것. 목소리를 내지 않으면 아무도 들어주지 않는다.', icon: '📢', source: '완벽한 대체자', category: '심리' },
      { name: '자기 축소', desc: '갈등을 피하기 위해 자신의 가치를 줄이는 것. 평화를 사지만 자존감을 판다.', icon: '📉', source: '완벽한 대체자', category: '심리' },
      { name: '협력적 경쟁', desc: '제로섬을 넘어서는 해결책. 파이를 키우면 모두가 더 가질 수 있다.', icon: '🤜🤛', source: '완벽한 대체자', category: '심리' },
      { name: '자존적 이탈', desc: '모욕적인 상황을 피해 떠나는 것. 자존심을 지키지만 기회를 잃는다.', icon: '🚶', source: '완벽한 대체자', category: '심리' },
      { name: '실존적 위기', desc: '자기 존재의 의미에 대한 근본적 물음. 고통스럽지만 성장의 시작점이 될 수 있다.', icon: '🌑', source: '완벽한 대체자', category: '철학' },
      { name: '존재의 유일성', desc: '능력, 성과, 스펙이 아닌 존재 자체의 대체 불가능성. 당신의 경험, 관계, 역사는 오직 당신만의 것이다.', icon: '✨', source: '완벽한 대체자', category: '철학' },
      { name: '변환적 고통', desc: '고통을 회피하지 않고 성장의 재료로 삼는 것. 상처받은 곳이 가장 강해진다.', icon: '🔥', source: '완벽한 대체자', category: '철학' },
      { name: '관계적 정체성', desc: '나는 혼자 완성되지 않는다. 타인과의 관계 속에서 나의 의미가 만들어진다.', icon: '🕸️', source: '완벽한 대체자', category: '철학' },
      { name: '한계의 수용', desc: '완벽하지 않아도 괜찮다. 인간의 유한함을 받아들일 때 비로소 자유로워진다.', icon: '🌅', source: '완벽한 대체자', category: '철학' },
      { name: '비교 불가능성', desc: '사과와 오렌지를 비교할 수 없듯, 한 인간을 다른 인간과 비교할 수 없다.', icon: '🍎🍊', source: '완벽한 대체자', category: '철학' },
      // 벼랑 끝 협상
      { name: '기회비용', desc: '하나를 선택하면 다른 것을 포기해야 한다. 모든 선택에는 보이지 않는 대가가 있다.', icon: '🚪', source: '벼랑 끝 협상', category: '심리' },
      { name: '협상 레버리지', desc: '협상력은 대안(BATNA)에서 나온다. 떠날 수 있는 사람이 테이블에서 가장 강하다.', icon: '⚖️', source: '벼랑 끝 협상', category: '심리' },
      { name: '치킨 게임', desc: '두 차가 서로를 향해 달린다. 먼저 피하면 치킨(겁쟁이). 둘 다 안 피하면 충돌. 협상의 본질.', icon: '🐔', source: '벼랑 끝 협상', category: '심리' },
      { name: '신호 이론', desc: '직접 말하지 않고 행동이나 힌트로 의도를 전달하는 것. 말하지 않고 말하는 기술.', icon: '📡', source: '벼랑 끝 협상', category: '심리' },
      { name: '현상 유지 편향', desc: '변화보다 현재 상태를 유지하려는 심리. 익숙함은 편하지만 기회를 놓치게 한다.', icon: '⏳', source: '벼랑 끝 협상', category: '심리' },
      { name: '정보 비대칭', desc: '협상에서 양측이 가진 정보가 다르다. 새로운 정보만이 판을 바꾼다.', icon: '📊', source: '벼랑 끝 협상', category: '심리' },
      { name: '최후통첩 게임', desc: '한 쪽이 조건을 제시하고 다른 쪽은 수락 또는 거부만 가능한 상황. 중간이 없다.', icon: '🎴', source: '벼랑 끝 협상', category: '심리' },
      { name: '감정과 협상', desc: '감정은 양날의 검. 공감을 얻을 수도, 약점을 노출할 수도 있다.', icon: '💔', source: '벼랑 끝 협상', category: '심리' },
      { name: '침묵의 힘', desc: '협상에서 침묵은 무기다. 먼저 말하는 쪽이 정보를 노출한다.', icon: '🤐', source: '벼랑 끝 협상', category: '심리' },
      { name: '질문의 힘', desc: '좋은 협상가는 말하기보다 묻는다. 질문은 정보를 얻고 상대를 생각하게 만든다.', icon: '❓', source: '벼랑 끝 협상', category: '심리' },
      { name: '브링크맨십', desc: '벼랑 끝 전술. 상대가 양보할 때까지 위험을 높인다. 쿠바 미사일 위기가 대표적 사례.', icon: '🌋', source: '벼랑 끝 협상', category: '심리' },
      { name: '양보의 타이밍', desc: '너무 빨리 양보하면 약해 보인다. 너무 늦으면 협상이 깨진다. 타이밍이 전부다.', icon: '⏱️', source: '벼랑 끝 협상', category: '심리' },
      { name: '황금 다리', desc: '손자병법의 가르침. 적에게 퇴로를 주어라. 궁지에 몰린 상대는 예측 불가능해진다.', icon: '🌉', source: '벼랑 끝 협상', category: '철학' },
      { name: '시간 압박', desc: '데드라인은 협상력을 바꾼다. 급한 쪽이 불리하다. 시간은 항상 급한 쪽의 적이다.', icon: '⏰', source: '벼랑 끝 협상', category: '심리' },
      { name: '감정 폭발의 비용', desc: '분노는 순간의 해소감을 주지만, 관계와 협상력을 손상시킨다.', icon: '💥', source: '벼랑 끝 협상', category: '심리' },
      { name: '매몰비용 무시', desc: '이미 투자한 시간과 비용은 지났다. 미래의 결정에 과거가 영향을 주면 안 된다.', icon: '✈️', source: '벼랑 끝 협상', category: '심리' },
      { name: '불확실성 회피', desc: '인간은 불확실한 큰 이득보다 확실한 작은 이득을 선호한다. 안전 본능이다.', icon: '🏠', source: '벼랑 끝 협상', category: '심리' },
      { name: '반복 게임', desc: '일회성 협상과 반복 협상은 전략이 다르다. 계속 밀면 관계가 손상된다.', icon: '🔄', source: '벼랑 끝 협상', category: '심리' },
      { name: '경매 효과', desc: '여러 구매자를 경쟁시키면 가격이 올라간다. 하지만 판매자가 신뢰를 잃을 수 있다.', icon: '🎪', source: '벼랑 끝 협상', category: '심리' },
      { name: '진정성의 힘', desc: '때로는 전략을 버리고 진심을 보여주는 것이 가장 강력한 전략이 된다.', icon: '💎', source: '벼랑 끝 협상', category: '철학' },
      // 깨어남
      { name: '방법적 회의', desc: '모든 것을 의심하여 확실한 것만 남긴다. 데카르트가 진리에 도달한 방법.', icon: '🔍', source: '깨어남', category: '철학' },
      { name: '인지 부조화 회피', desc: '불편한 정보를 무시하여 심리적 안정을 유지하려는 본능.', icon: '🙈', source: '깨어남', category: '심리' },
      { name: '실재 불안', desc: '현실 자체가 흔들리는 느낌. 존재의 기반이 무너지는 공포.', icon: '😰', source: '깨어남', category: '심리' },
      { name: '경이의 태도', desc: '미지의 것 앞에서 두려움 대신 호기심을 선택하는 것.', icon: '✨', source: '깨어남', category: '철학' },
      { name: '증거 기반 수용', desc: '감정이 아닌 증거에 따라 믿음을 수정하는 합리적 태도.', icon: '📊', source: '깨어남', category: '철학' },
      { name: '심리적 방어', desc: '감당할 수 없는 현실을 부정하여 자아를 보호하는 것.', icon: '🛡️', source: '깨어남', category: '심리' },
      { name: '반복 검증', desc: '하나의 증거로 결론짓지 않고 반복적으로 확인하는 것. 과학적 방법의 핵심.', icon: '🔬', source: '깨어남', category: '철학' },
      { name: '현상학적 태도', desc: '실재의 본질보다 경험 자체에 집중하는 것. 후설의 철학.', icon: '🌊', source: '깨어남', category: '철학' },
      { name: '진정성 추구', desc: '행복하더라도 가짜라면 가치가 없다고 보는 관점.', icon: '🔴', source: '깨어남', category: '철학' },
      { name: '경험의 가치', desc: '기원이 아닌 경험 자체가 의미를 갖는다는 관점. 어차피 모든 경험은 뇌의 신호다.', icon: '🔵', source: '깨어남', category: '철학' },
      { name: '정보 요구', desc: '결정 전에 충분한 정보를 원하는 것. 하지만 모든 정보를 가질 수는 없다.', icon: '📋', source: '깨어남', category: '심리' },
      { name: '관계 우선', desc: '개인의 진실보다 함께하는 것이 더 중요하다는 가치관.', icon: '👨‍👩‍👧', source: '깨어남', category: '철학' },
      { name: '실재의 추구', desc: '경험의 질보다 존재의 진정성을 우선시하는 것. 동굴 밖으로 나가는 철학자.', icon: '💊', source: '깨어남', category: '철학' },
      { name: '무한 회귀', desc: '모든 현실이 또 다른 현실의 시뮬레이션일 수 있다는 의문.', icon: '🐢', source: '깨어남', category: '철학' },
      { name: '창조적 초월', desc: '주어진 현실을 받아들이는 것을 넘어 새로운 현실을 만들려는 의지.', icon: '🌅', source: '깨어남', category: '철학' },
      { name: '의식의 연속성', desc: '형태가 바뀌어도 의식은 연속된다는 믿음. 정체성의 확장.', icon: '♾️', source: '깨어남', category: '철학' },
      
      // 거짓말 없는 하루
      { name: '회피적 정직', desc: '진실을 직접 말하지 않으면서도 거짓말은 피하는 전략. 관계를 보호하지만, 때로는 불명확한 소통이 될 수 있다.', icon: '🌫️', source: '거짓말 없는 하루', category: '심리' },
      { name: '건설적 진실', desc: '진실을 말하되, 상대방이 받아들일 수 있는 방식으로 전달하는 것. 비판이 아닌 제안의 형태로.', icon: '🔧', source: '거짓말 없는 하루', category: '심리' },
      { name: '전략적 침묵', desc: '진실을 알면서도 말하지 않는 것. 자기 보호에는 효과적이지만, 집단에 해가 될 수 있다.', icon: '🤐', source: '거짓말 없는 하루', category: '심리' },
      { name: '점진적 진실', desc: '한 번에 모든 진실을 말하지 않고, 상대방이 받아들일 수 있는 만큼씩 전달하는 것.', icon: '📶', source: '거짓말 없는 하루', category: '심리' },
      { name: '보호적 진실', desc: '상대방을 지키기 위해 말하는 어려운 진실. 단기적으로 관계에 균열이 생길 수 있지만, 진정한 친구의 역할.', icon: '🛡️', source: '거짓말 없는 하루', category: '심리' },
      { name: '관계 보호', desc: '진실보다 관계의 안정을 우선시하는 선택. 단기적 평화를 가져오지만, 장기적 신뢰에 영향을 줄 수 있다.', icon: '🤝', source: '거짓말 없는 하루', category: '심리' },
      { name: '판단 유보', desc: '충분한 정보 없이 섣부른 판단을 피하는 것. 신중함의 표현이지만, 때로는 회피로 보일 수 있다.', icon: '⏸️', source: '거짓말 없는 하루', category: '심리' },
      { name: '균형 잡힌 진실', desc: '사실을 전하되, 상대방이 감당할 수 있는 맥락과 함께 전달하는 것. 정직함과 배려의 균형.', icon: '⚖️', source: '거짓말 없는 하루', category: '심리' },
      { name: '보호적 거짓말', desc: '사랑하는 사람을 걱정에서 지키기 위한 거짓말. 선의에서 비롯되지만, 진정한 소통의 기회를 막을 수 있다.', icon: '💝', source: '거짓말 없는 하루', category: '심리' },
      { name: '주제 전환', desc: '불편한 진실을 피하기 위해 대화의 흐름을 바꾸는 것. 즉각적인 충돌은 피하지만, 문제를 해결하지는 않는다.', icon: '↪️', source: '거짓말 없는 하루', category: '심리' },
      { name: '자기 정직', desc: '타인에게 하는 거짓말보다 자신에게 하는 거짓말이 더 해롭다. 자기 인식은 성장의 첫걸음이다.', icon: '🪞', source: '거짓말 없는 하루', category: '심리' },
      { name: '자기기만', desc: '불편한 현실을 직면하지 않기 위해 스스로를 속이는 것. 단기적 안정을 주지만, 장기적 성장을 방해한다.', icon: '🙈', source: '거짓말 없는 하루', category: '심리' },
      { name: '열린 자기 탐색', desc: '확실한 답보다 진솔한 질문이 더 가치 있을 때가 있다. 자기 이해는 평생의 여정이다.', icon: '🔍', source: '거짓말 없는 하루', category: '심리' },
      { name: '현실 부정', desc: '가스라이터의 가장 기본적인 전략. 실제로 일어난 일을 부정해서 상대의 기억과 판단력을 흔든다.', icon: '🚫', source: '가스라이팅', category: '심리' },
      { name: '자기 의심의 씨앗', desc: '가스라이팅 초기 단계. 작은 일에서 자신의 기억을 의심하기 시작하면, 점점 더 큰 일에서도 상대에게 의존하게 된다.', icon: '🌱', source: '가스라이팅', category: '심리' },
      { name: '증거 무력화', desc: '가스라이터는 증거를 찾으려는 시도 자체를 비정상적인 행동으로 몰아간다.', icon: '🔍', source: '가스라이팅', category: '심리' },
      { name: '조건부 허용', desc: '직접 금지하지 않으면서 심리적 불이익으로 행동을 통제하는 방식. 갈 때마다 감정적 비용을 치르게 만든다.', icon: '⛓️', source: '가스라이팅', category: '심리' },
      { name: '사회적 고립', desc: '주변 사람과의 연결을 끊으면 피해자는 가스라이터에게만 의존하게 된다. 비교 대상이 사라지면 비정상이 정상이 된다.', icon: '🏝️', source: '가스라이팅', category: '심리' },
      { name: '피해자 역할 전환', desc: '가스라이터가 자신을 피해자로 포지셔닝하는 전략. 프레임을 씌워 상대가 자신을 보호해야 하는 구도를 만든다.', icon: '🔄', source: '가스라이팅', category: '심리' },
      { name: '감정 전가', desc: '상대의 정당한 감정 표현을 공격으로 재해석하는 기술. 감정을 표현한 쪽이 가해자가 된다.', icon: '🎭', source: '가스라이팅', category: '심리' },
      { name: '감정 검열', desc: '반복적으로 감정 표현이 거부당하면 스스로 감정을 검열하기 시작한다. 감정은 사라진 게 아니라 묻힌 것이다.', icon: '🔇', source: '가스라이팅', category: '심리' },
      { name: '학습된 침묵', desc: '감정 표현이 반복적으로 역효과를 낳으면 침묵을 학습하게 된다. 이것은 평화가 아니라 포기다.', icon: '🤐', source: '가스라이팅', category: '심리' },
      { name: '외부 현실 검증', desc: '가스라이팅에서 벗어나는 가장 강력한 도구는 외부 관점이다. 고립되면 가스라이터의 현실이 유일한 현실이 된다.', icon: '🪟', source: '가스라이팅', category: '심리' },
      { name: '자아 침식', desc: '가스라이팅이 장기화되면 피해자는 가스라이터의 평가를 자기 정체성으로 내면화한다.', icon: '🌊', source: '가스라이팅', category: '심리' },
      { name: '인지적 안개', desc: '지속적인 현실 왜곡에 노출되면 판단력 자체가 흐려진다. 모르겠다가 입버릇이 되면 이미 깊이 작동하고 있는 것이다.', icon: '🌫️', source: '가스라이팅', category: '심리' },
      { name: '탈출의 결단', desc: '가스라이팅 관계를 끝내는 것은 단순한 이별이 아니다. 자신의 현실 인식을 되찾는 행위다.', icon: '🚪', source: '가스라이팅', category: '심리' },
      { name: '경계의 재설정', desc: '가스라이팅 관계에서 경계를 세우는 것은 가능하지만, 상대가 변화를 원해야 한다. 상대가 거부하면 그 자체가 답이다.', icon: '🛡️', source: '가스라이팅', category: '심리' },
      { name: '매몰 비용의 함정', desc: '이미 이만큼 투자했는데라는 생각이 떠나지 못하게 만든다. 과거의 시간은 미래를 결정할 이유가 되지 않는다.', icon: '⏳', source: '가스라이팅', category: '심리' },
      { name: '우정의 무게', desc: '돈을 빌리는 순간, 우정은 채무 관계가 된다. 10년의 우정이 3억의 빚이 된다.', icon: '⚖️', source: '부자의 조건', category: '심리' },
      { name: '빚의 시간', desc: '빚은 미래의 시간을 현재로 끌어오는 것이다. 돈을 빌리는 건 쉽다. 갚는 건 인생이다.', icon: '⏳', source: '부자의 조건', category: '철학' },
      { name: '시스템의 벽', desc: '개인의 절박함은 시스템 앞에서 무력하다. 돈이 없으면 목숨도 순번을 기다려야 하는 현실.', icon: '🏥', source: '부자의 조건', category: '심리' },
      { name: '양심의 무게', desc: '아무도 모르는 배신은 가장 무겁다. 양심은 법정보다 정확하다.', icon: '🪞', source: '부자의 조건', category: '철학' },
      { name: '원칙의 대가', desc: '원칙을 지키는 건 공짜가 아니다. 때로는 사랑하는 사람이 그 대가를 치른다.', icon: '💎', source: '부자의 조건', category: '철학' },
      { name: '미끄러운 비탈길', desc: '작은 양보가 큰 양보의 시작이 된다. 경계를 허무는 건 한순간이다.', icon: '⛷️', source: '부자의 조건', category: '심리' },
      { name: '대리 결정의 무게', desc: '누군가의 존엄을 대신 결정하는 것은 가능한가? 생명을 살리기 위해서라면 허용되는가?', icon: '🧎', source: '부자의 조건', category: '심리' },
      { name: '부재자의 의사', desc: '의식 없는 사람의 뜻을 대신 결정하는 건 가능한가?', icon: '🤷', source: '부자의 조건', category: '철학' },
      { name: '돈과 권력', desc: '돈을 빌려주는 행위 뒤에 권력 관계가 숨어 있다. 시혜는 늘 대가를 요구한다.', icon: '👑', source: '부자의 조건', category: '심리' },
      { name: '절박함의 경제학', desc: '급한 사람이 불리한 거래를 한다. 세상의 많은 거래는 한쪽의 절박함 위에 세워져 있다.', icon: '⏰', source: '부자의 조건', category: '심리' },
      { name: '자유의 가격', desc: '자유에는 가격이 있다. 안정을 위해 자유를 포기하든, 불안을 감수하고 자유를 지키든.', icon: '🕊️', source: '부자의 조건', category: '철학' },
      { name: '협상의 함정', desc: '조건을 깎는 순간, 팔겠다는 결정은 이미 끝난 것이다.', icon: '🎲', source: '부자의 조건', category: '심리' },
      { name: '결과의 무게', desc: '행위의 옳고 그름은 결과가 결정하는가? 결과가 좋다고 과정이 사라지는 건 아니다.', icon: '🎯', source: '부자의 조건', category: '철학' },
      { name: '보이지 않는 비용', desc: '모든 거래에는 보이는 비용과 보이지 않는 비용이 있다. 보이지 않는 비용이 인생을 바꾼다.', icon: '👤', source: '부자의 조건', category: '심리' },
      { name: '트레이드오프', desc: '무언가를 얻으면 무언가를 잃는다. 문제는 무엇을 포기할 것인가를 선택하는 것이다.', icon: '⚖️', source: '부자의 조건', category: '철학' },
      { name: '보호하는 거짓말', desc: '진실이 상대를 파괴할 때, 거짓말은 사랑이 될 수 있는가? 침묵은 배신인가, 보호인가?', icon: '🤐', source: '부자의 조건', category: '철학' },
      { name: '진실의 무게', desc: '진실은 때로 듣는 사람을 아프게 한다. 하지만 거짓 위에 세운 관계는 언젠가 무너진다.', icon: '💡', source: '부자의 조건', category: '철학' },
      { name: '타이밍의 지혜', desc: '모든 진실이 지금 당장 필요한 건 아니다. 때를 기다리는 건 회피가 아니라 판단이다.', icon: '⏰', source: '부자의 조건', category: '심리' },
      { name: '양심의 시장가격', desc: '모든 사람에게는 양심을 파는 가격이 있는가? 그 멈칫하는 지점이 당신의 양심의 시장가격이다.', icon: '🪞', source: '돈의 가격', category: '철학' },
      { name: '기회비용의 무게', desc: '거절은 공짜가 아니다. 양심을 지키는 데도 대가가 있다.', icon: '💎', source: '돈의 가격', category: '심리' },
      { name: '도덕적 면허 효과', desc: '한 번 경계를 넘으면 다음부터 넘는 게 쉬워진다. 처음이 가장 어렵다.', icon: '📉', source: '돈의 가격', category: '심리' },
      { name: '쳇바퀴 효과', desc: '더 벌면 더 쓰고, 더 쓰면 더 벌어야 한다. 쾌락의 쳇바퀴.', icon: '🐹', source: '돈의 가격', category: '심리' },
      { name: '돈으로 살 수 없는 것', desc: '시간, 청춘, 경험, 관계. 나중에 돈으로 살 수 없는 것들.', icon: '⏳', source: '돈의 가격', category: '철학' },
      { name: '가치의 수량화', desc: '모든 것을 숫자로 바꾸면 비교가 가능해진다. 비교가 가능해지면 더 높은 숫자를 쫓게 된다.', icon: '🔢', source: '돈의 가격', category: '심리' },
      { name: '호혜성의 함정', desc: '빚진 감정은 판단을 왜곡한다. 감정이지 논리가 아니다.', icon: '🔄', source: '돈의 가격', category: '심리' },
      { name: '감정과 판단의 분리', desc: '좋은 친구인 것과 좋은 투자인 것은 별개다.', icon: '🧠', source: '돈의 가격', category: '심리' },
      { name: '타협의 착각', desc: '타협은 양쪽 모두를 조금씩 불만족시키는 결정이다.', icon: '⚖️', source: '돈의 가격', category: '심리' },
      { name: '점진적 수용', desc: '인간은 거의 모든 것에 적응한다. 자존심도 적응 대상이다.', icon: '📉', source: '돈의 가격', category: '심리' },
      { name: '자존심의 유통기한', desc: '자존심을 지키는 건 그 순간은 통쾌하다. 3개월 뒤에도 통쾌한가?', icon: '🦁', source: '돈의 가격', category: '철학' },
      { name: '전략적 인내 vs 자기기만', desc: '"참는 거야"와 "적응한 거야"의 경계는 생각보다 가깝다.', icon: '🎭', source: '돈의 가격', category: '심리' },
      { name: '성찰의 시작', desc: '멈추지 않으면 방향을 확인할 수 없다. 모른다는 것을 아는 것이 시작이다.', icon: '🪞', source: '돈의 가격', category: '철학' },
      { name: '자기기만의 비용', desc: '자기 자신에게 하는 거짓말은 이자가 붙는다.', icon: '🎭', source: '돈의 가격', category: '심리' },
      { name: '시대의 속도', desc: '멈추면 뒤처지는 사회에서 왜 달리는가를 묻는 건 사치처럼 느껴진다.', icon: '🌊', source: '돈의 가격', category: '철학' },
      { name: '생물학적 시간', desc: '뇌는 새로운 자극을 처리할 때 시간을 길게 느낀다. 시간을 늘리는 방법은 낯선 경험으로 뇌를 깨우는 것이다.', icon: '🧠', source: '시간의 주인', category: '심리' },
      { name: '찰나의 각성', desc: '같은 하루도 깨어있으면 매 순간이 다르다. 시간이 빨리 가는 건 당신이 잠들어 있기 때문이다.', icon: '👁️', source: '시간의 주인', category: '철학' },
      { name: '순환적 시간', desc: '동양에서 시간은 직선이 아니라 원이다. 끝은 곧 시작이고, 겨울이 지나면 봄이 온다.', icon: '🔄', source: '시간의 주인', category: '철학' },
      { name: '직선적 시간의 함정', desc: '직선적 시간관은 진보를 약속하지만 영원한 조바심을 안긴다. 뒤처지면 안 된다는 공포.', icon: '➡️', source: '시간의 주인', category: '철학' },
      { name: '규율적 시간', desc: '1시간이라는 단위는 자연에 존재하지 않는다. 시간을 관리한다는 건 시스템의 규율 안에서 더 열심히 뛰겠다는 뜻이다.', icon: '⏰', source: '시간의 주인', category: '철학' },
      { name: '카이로스', desc: '크로노스는 시계의 시간. 카이로스는 살아있다고 느끼는 순간. 인생은 카이로스를 얼마나 태웠느냐로 결정된다.', icon: '✨', source: '시간의 주인', category: '철학' },
      { name: '사회적 가속', desc: '기술이 절약하는 속도보다 해야 할 일이 늘어나는 속도가 빠르다. 만성적 시간 부족은 시스템의 문제다.', icon: '🏃', source: '시간의 주인', category: '심리' },
      { name: '시간과 기억', desc: '시간은 기억이다. 기억이 사라지면 시간도 사라진다. 시간의 무게는 기억이 결정한다.', icon: '🧠', source: '시간의 주인', category: '철학' },
      { name: '서사로서의 시간', desc: '시간이라는 환상 덕분에 우리는 서사를 가진다. 환상에 쫓기는 노예가 될 것인가, 환상을 이용하는 감독이 될 것인가.', icon: '📖', source: '시간의 주인', category: '철학' },
      { name: '양자적 시간', desc: '양자중력 방정식에는 시간 변수가 없다. 시간은 뇌가 만들어낸 유용한 환상이다.', icon: '⚛️', source: '시간의 주인', category: '철학' },
      { name: '현재주의', desc: '과거와 미래는 실재하지 않는다. 오직 지금만 존재한다. 후회란 존재하지 않는 장소를 그리워하는 것이다.', icon: '📍', source: '시간의 주인', category: '철학' },
      { name: '에로스의 불꽃', desc: '강렬하고 즉각적인 사랑. 온몸으로 느끼는 열정. 하지만 연료가 떨어지면 불꽃도 꺼진다.', icon: '🔥', source: '사랑의 온도', category: '심리' },
      { name: '스토르게의 뿌리', desc: '우정에서 자라는 사랑. 천천히 깊이 뿌리 내린다. 화려하지 않지만 흔들리지 않는다.', icon: '🌱', source: '사랑의 온도', category: '심리' },
      { name: '루두스의 전략', desc: '유희적 사랑. 밀당, 주도권, 긴장감. 관계를 가볍게 유지하고 싶어한다.', icon: '🎭', source: '사랑의 온도', category: '심리' },
      { name: '불안형 애착', desc: '상대의 침묵을 사랑이 식은 신호로 해석한다. 사랑이 아니라 불안이 관계를 움직일 수 있다.', icon: '😰', source: '사랑의 온도', category: '심리' },
      { name: '안정형 애착', desc: '상대를 신뢰할 수 있는 상태. 연락이 없어도 관계가 흔들리지 않는다는 확신.', icon: '🌿', source: '사랑의 온도', category: '심리' },
      { name: '관계의 권력 게임', desc: '사랑에서 권력은 덜 사랑하는 쪽에게 있다. 이기려는 순간 사랑은 끝난다.', icon: '♟️', source: '사랑의 온도', category: '심리' },
      { name: '아가페의 빛', desc: '조건 없는 사랑. 대가를 바라지 않고 주는 사랑. 숭고하지만 자기 소멸의 위험이 있다.', icon: '✨', source: '사랑의 온도', category: '철학' },
      { name: '에로스의 합일', desc: '하나가 되고 싶은 욕구. 아름답지만 상대를 숨 막히게 할 수 있다.', icon: '🔥', source: '사랑의 온도', category: '철학' },
      { name: '프라그마의 계산', desc: '현실적 사랑. 감정보다 조건, 열정보다 지속 가능성. 계산이 전부가 되면 사랑은 계약이 된다.', icon: '📊', source: '사랑의 온도', category: '심리' },
      { name: '독점의 욕구', desc: '사랑에서 독점욕은 자연스럽지만, 강해지면 소유가 된다. 사랑과 소유의 경계.', icon: '🔒', source: '사랑의 온도', category: '심리' },
      { name: '회피형 애착', desc: '불편한 감정을 회피하는 패턴. 감정은 회피한다고 사라지지 않는다. 쌓인다.', icon: '🙈', source: '사랑의 온도', category: '심리' },
      { name: '필리아의 대화', desc: '동반자적 사랑. 상대를 소유하지 않고 존중한다. 성숙하지만 차갑게 느껴질 수 있다.', icon: '🤝', source: '사랑의 온도', category: '철학' },
      { name: '아가페의 잔상', desc: '관계가 끝난 뒤에도 남는 관심. 미련이 아니라 사랑의 잔상일 수 있다.', icon: '✨', source: '사랑의 온도', category: '심리' },
      { name: '사랑의 철회', desc: '떠나는 것도 사랑일 수 있다. 상대의 성장을 위해 물러나는 가장 어려운 사랑.', icon: '🚶', source: '사랑의 온도', category: '철학' },
      { name: '반응의 층', desc: '자극에 대한 즉각적 감정 반응. 인간의 가장 원초적인 사고. 시작이지 결론이 아니다.', icon: '⚡', source: '사고의 층', category: '심리' },
      { name: '분석의 층', desc: '왜를 묻고 원인을 파악한다. 주어진 문제를 잘 푸는 사고. 하지만 프레임 자체는 의심하지 않는다.', icon: '🔍', source: '사고의 층', category: '심리' },
      { name: '전략의 층', desc: '상대의 의도와 구조를 읽는다. 같은 정보로 더 나은 결과를 만든다.', icon: '♟️', source: '사고의 층', category: '심리' },
      { name: '철학의 층', desc: '자기 자신의 사고 과정을 관찰한다. 메타인지. 가장 느리지만 가장 깊다.', icon: '🔮', source: '사고의 층', category: '철학' },
      { name: '감정적 즉각 반응', desc: '편도체가 전두엽보다 빠르다. 감정적 반응은 솔직하지만 최적은 아니다.', icon: '💥', source: '사고의 층', category: '심리' },
      { name: '사실 확인의 사고', desc: '감정이 아니라 사실부터 확인한다. 정확하지만 감정을 해결하지는 못한다.', icon: '📋', source: '사고의 층', category: '심리' },
      { name: '관계 역학 파악', desc: '인간관계의 보이지 않는 구조를 읽는다. 효과적이지만 진심을 잃을 수 있다.', icon: '🕸️', source: '사고의 층', category: '심리' },
      { name: '전제에 대한 의심', desc: '자신의 전제를 의심하는 것. 불편하지만 가장 정확한 사고에 도달하는 길.', icon: '🪞', source: '사고의 층', category: '철학' },
      { name: '감정에 머무는 사고', desc: '감정에 빠지면 원인을 묻지 못한다. 하루 좌절은 건강하고 한 달 좌절은 우울이다.', icon: '😞', source: '사고의 층', category: '심리' },
      { name: '개선 중심 사고', desc: '실패를 데이터로 본다. 더 잘하는 법은 알려주지만 왜 하는지는 알려주지 않는다.', icon: '📊', source: '사고의 층', category: '심리' },
      { name: '의도 파악의 사고', desc: '문제를 낸 사람의 의도를 읽는다. 같은 지식으로 더 높은 성과를 내는 비결.', icon: '🎯', source: '사고의 층', category: '심리' },
      { name: '목적에 대한 메타 사고', desc: '왜를 끝까지 파고든다. 대부분은 두 번째 왜에서 멈춘다.', icon: '🔮', source: '사고의 층', category: '철학' },
      { name: '정의로운 분노의 한계', desc: '부당함에 분노하는 건 도덕적으로 옳지만 분노만으로 부당함은 바뀌지 않는다.', icon: '🔥', source: '사고의 층', category: '철학' },
      { name: '리스크 분석', desc: '감정이 아니라 구조를 본다. 누가 이득을 보고 누가 리스크를 지는가.', icon: '📉', source: '사고의 층', category: '심리' },
      { name: '구조 너머의 의도', desc: '보이는 지시 뒤에 숨겨진 목적을 읽으면 더 나은 경로가 보인다.', icon: '🔭', source: '사고의 층', category: '심리' },
      { name: '정체성 기반 의사결정', desc: '무엇을 할 것인가 대신 어떤 사람이 될 것인가를 묻는다.', icon: '🪞', source: '사고의 층', category: '철학' },
      { name: '감정 회피', desc: '불편한 감정을 다른 것으로 덮는다. 덮인 감정은 사라지지 않고 곪는다.', icon: '🙈', source: '사고의 층', category: '심리' },
      { name: '현실 제약 분석', desc: '조건을 보는 것. 실용적이지만 왜라는 질문은 다루지 않는다.', icon: '📊', source: '사고의 층', category: '심리' },
      { name: '경로 설계', desc: '현재와 목표 사이의 경로를 설계한다. 목적지가 맞는지는 별개의 질문이다.', icon: '🗺️', source: '사고의 층', category: '심리' },
      { name: '위장된 평정', desc: '아무렇지 않게 행동하는 것과 아무렇지 않은 것은 다르다.', icon: '📖', source: '르상티망의 지도', category: '심리' },
      { name: '거리 측정', desc: '타인의 성공을 검색하는 건 정보 수집이 아니라 나와의 거리를 재는 것이다.', icon: '📏', source: '르상티망의 지도', category: '심리' },
      { name: '감정의 외주', desc: '혼자 처리 못하는 감정을 남의 소식을 전하는 형태로 나누는 것.', icon: '📱', source: '르상티망의 지도', category: '심리' },
      { name: '감정 이전의 감각', desc: '이름 붙기 전의 모호한 감정. 인식하면 다룰 수 있고, 이름 붙고 나면 굳어진다.', icon: '🌫️', source: '르상티망의 지도', category: '심리' },
      { name: '사회적 의례', desc: '좋아요는 가장 적은 비용의 축하이자 가장 정확한 회피다.', icon: '👍', source: '르상티망의 지도', category: '심리' },
      { name: '시야 관리', desc: '불편한 것을 안 보는 것. 문제를 해결하는 게 아니라 다룰 수 없게 만드는 것.', icon: '🙈', source: '르상티망의 지도', category: '심리' },
      { name: '비교의 소용돌이', desc: '볼수록 비교가 깊어지고 비교가 깊어질수록 더 보게 된다.', icon: '🌀', source: '르상티망의 지도', category: '심리' },
      { name: '방어적 전시', desc: '타인의 과시에 대한 반응으로 자기를 과시하는 것. 보여주기 위한 삶.', icon: '📸', source: '르상티망의 지도', category: '심리' },
      { name: '편집된 근황', desc: '사실이지만 전부가 아닌 것. 편집의 정도가 자존감의 온도를 보여준다.', icon: '✂️', source: '르상티망의 지도', category: '심리' },
      { name: '전략적 회피', desc: '불편한 질문을 피하는 가장 세련된 방법. 피할수록 질문은 커진다.', icon: '🔀', source: '르상티망의 지도', category: '심리' },
      { name: '솔직함의 해제력', desc: '비교는 가면 사이에서 일어난다. 가면을 벗으면 비교가 멈춘다.', icon: '💎', source: '르상티망의 지도', category: '심리' },
      { name: '물리적 도피', desc: '장소는 바꿀 수 있지만 감정은 휴대된다. 자리를 뜨는 건 대처가 아니라 연기다.', icon: '🚶', source: '르상티망의 지도', category: '심리' },
      { name: '욕망의 출처', desc: '아무도 보지 않을 때도 같은 것을 원하는가. 그렇다면 당신의 욕망이다.', icon: '🔍', source: '르상티망의 지도', category: '철학' },
      { name: '나침반의 부재', desc: '자기 방향이 없으면 남의 방향이 기준이 된다. 르상티망의 뿌리.', icon: '🧭', source: '르상티망의 지도', category: '철학' },
      { name: '가능성의 감옥', desc: '시작하지 않으면 실패도 없다. 안전장치가 5년째 작동 중이면 감금이다.', icon: '🫧', source: '르상티망의 지도', category: '심리' },
      { name: '관계의 우선', desc: '상대가 사람으로 보이는 순간 비교가 뒤로 간다.', icon: '🤝', source: '르상티망의 지도', category: '철학' },
      { name: '0.5초의 진실', desc: '타인의 불행 앞에서 스치는 안도감. 감정은 통제할 수 없지만 행동은 통제할 수 있다.', icon: '⚡', source: '르상티망의 지도', category: '심리' },
      { name: '감정의 복잡성', desc: '깨끗한 감정은 없다. 복잡함을 인정하는 것이 정직의 시작이다.', icon: '🌊', source: '르상티망의 지도', category: '심리' },
      { name: '순환의 인식', desc: '비교는 스냅샷이다. 인생은 영화다. 한 장면으로 판단하지 마라.', icon: '🔄', source: '르상티망의 지도', category: '철학' },
      { name: '유머의 갑옷', desc: '웃음으로 불편한 감정을 덮는다. 분위기는 살리지만 진짜 감정은 죽인다.', icon: '😂', source: '성격 갑옷', category: '심리' },
      { name: '방어의 자동화', desc: '비판에 반사적으로 방패를 든다. 반복되면 피드백을 받을 수 없는 사람이 된다.', icon: '🛡️', source: '성격 갑옷', category: '심리' },
      { name: '동결 반응', desc: '위협이 오면 몸이 멈춘다. 갑옷이 아니라 투명 망토.', icon: '🧊', source: '성격 갑옷', category: '심리' },
      { name: '프로의 가면', desc: '침착하게 처리하는 것과 괜찮은 것은 다르다. 낮의 침착함이 밤의 불면으로 돌아온다.', icon: '😐', source: '성격 갑옷', category: '심리' },
      { name: '학습된 침묵', desc: '한 번의 거절이 평생의 침묵이 된다. 입을 닫으면 거절도 없지만 기회도 없다.', icon: '🤐', source: '성격 갑옷', category: '심리' },
      { name: '완벽의 방패', desc: '완벽주의는 높은 기준이 아니라 거절에 대한 공포다.', icon: '💎', source: '성격 갑옷', category: '심리' },
      { name: '무감의 갑옷', desc: '중요하지 않은 척하면 상처도 없다. 가장 가벼운 갑옷이 가장 많은 것을 포기하게 한다.', icon: '🤷', source: '성격 갑옷', category: '심리' },
      { name: '갑옷 없는 질문', desc: '거절당한 뒤 다시 찾아가는 것. 방어도 공격도 회피도 아닌, 있는 그대로 서는 것.', icon: '💧', source: '성격 갑옷', category: '심리' },
      { name: '자동화된 괜찮음', desc: '괜찮다는 말을 반복하면 상대가 물러나고, 혼자가 되고, 고립을 원망하게 된다.', icon: '🏔️', source: '성격 갑옷', category: '심리' },
      { name: '감정 없는 보고', desc: '감정을 빼고 말하면 감정을 담은 대답은 돌아오지 않는다.', icon: '📋', source: '성격 갑옷', category: '심리' },
      { name: '갑옷 벗는 순간', desc: '약함을 보여주는 것이 진짜 용기다. 모든 깊은 관계는 여기서 시작된다.', icon: '💧', source: '성격 갑옷', category: '심리' },
      { name: '화제 전환의 기술', desc: '불편한 대화를 가장 자연스럽게 피하는 법. 피할수록 아무도 묻지 않는 미래가 온다.', icon: '📺', source: '성격 갑옷', category: '심리' },
      { name: '과잉 활동의 갑옷', desc: '바쁘면 아프지 않다. 가장 생산적으로 보이는 갑옷.', icon: '🏃', source: '성격 갑옷', category: '심리' },
      { name: '감정 차단', desc: '감정을 느끼지 않는 것이 최고의 방어. 고통도 기쁨도 함께 꺼진다.', icon: '🧊', source: '성격 갑옷', category: '심리' },
      { name: '감정 통과', desc: '감정은 파도와 같다. 통과하면 지나간다. 울면 끝나는 것이 참으면 쌓인다.', icon: '🌊', source: '성격 갑옷', category: '심리' },
      { name: '자기 공격', desc: '분노를 안으로 돌리는 방어. 가장 착해 보이는 갑옷이 가장 위험하다.', icon: '🗡️', source: '성격 갑옷', category: '심리' },
      { name: '갑옷의 인식', desc: '벗는 첫 단계는 입고 있다는 걸 아는 것이다.', icon: '👁️', source: '성격 갑옷', category: '심리' },
      { name: '한 겹씩', desc: '안전한 관계에서 벗어도 괜찮다는 경험이 쌓이면 갑옷이 느슨해진다.', icon: '🧅', source: '성격 갑옷', category: '심리' },
      { name: '갑옷 아래의 자아', desc: '진짜 자아는 갑옷 아래에 있다. 만나려면 벗어야 한다.', icon: '🫥', source: '성격 갑옷', category: '심리' },
      { name: '프레임에 대한 질문', desc: '문제 자체를 의심한다. 질문을 바꾸면 답이 바뀌고 삶이 바뀐다.', icon: '🔮', source: '사고의 층', category: '철학' },
      { name: '거리의 지혜', desc: '쇼펜하우어의 고슴도치 딜레마. 너무 가까우면 상처받고 너무 멀면 외롭다.', icon: '🦔', source: '사랑의 온도', category: '철학' },
      { name: '영원한 현재', desc: '모든 시간관을 관통하는 진실. 지금 이 순간만큼은 당신 앞에 있다. 시간의 주인은 지금에 깨어있는 사람이다.', icon: '🌟', source: '시간의 주인', category: '철학' }
    ];

    let profile = { principles: [] };
    let currentCategoryFilter = 'all';
    let currentStatusFilter = 'all';
    
    // 삭제된 원칙 목록 (더 이상 획득 불가)
    // 같은 이름의 원칙은 하나로 합친다 (출처는 함께 표시)
    (function dedupePrinciples() {
      const seen = new Map();
      for (let i = 0; i < ALL_PRINCIPLES.length; i++) {
        const p = ALL_PRINCIPLES[i];
        const first = seen.get(p.name);
        if (first) {
          if (p.source && first.source && !first.source.includes(p.source)) first.source += ' · ' + p.source;
          ALL_PRINCIPLES.splice(i, 1); i--;
        } else seen.set(p.name, p);
      }
    })();

    const DEPRECATED_PRINCIPLES = [
      '현재의 확실성',
      '가치의 계산', 
      '확률적 판단',
      '신중한 불개입',
      '도덕적 상대주의'
    ];

    function loadProfile() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        profile = JSON.parse(saved);
        if (!profile.principles) profile.principles = [];
        
        // 삭제된 원칙 제거
        const beforeCount = profile.principles.length;
        profile.principles = profile.principles.filter(p => {
          const name = typeof p === 'string' ? p : p.name;
          return !DEPRECATED_PRINCIPLES.includes(name);
        });
        
        // 변경사항이 있으면 저장
        if (profile.principles.length !== beforeCount) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
        }
      }
    }

    function getDiscoveredNames() {
      // 문자열 배열과 객체 배열 모두 지원
      return profile.principles.map(p => {
        if (typeof p === 'string') return p;
        if (p && p.name) return p.name;
        return null;
      }).filter(name => name !== null);
    }

    function updateProgress() {
      const discovered = getDiscoveredNames();
      const total = ALL_PRINCIPLES.length;
      const allPrincipleNames = ALL_PRINCIPLES.map(p => p.name);
      const count = new Set(discovered.filter(name => allPrincipleNames.includes(name))).size;
      
      document.getElementById('progressCount').textContent = `${count}/${total}`;
      document.getElementById('progressFill').style.width = `${(count/total)*100}%`;
    }

    function renderList() {
      const discovered = getDiscoveredNames();
      const list = document.getElementById('principlesList');
      
      let filtered = ALL_PRINCIPLES;
      
      // 카테고리 필터
      if (currentCategoryFilter !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategoryFilter);
      }
      
      // 상태 필터
      if (currentStatusFilter === 'discovered') {
        filtered = filtered.filter(p => discovered.includes(p.name));
      } else if (currentStatusFilter === 'locked') {
        filtered = filtered.filter(p => !discovered.includes(p.name));
      }
      
      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"></div>
            <div>조건에 맞는 원칙이 없어요</div>
          </div>
        `;
        return;
      }
      
      list.innerHTML = filtered.map(p => {
        const isDiscovered = discovered.includes(p.name);
        return `
          <div class="principle-item ${isDiscovered ? 'discovered' : 'locked'}" 
               data-name="${p.name}" 
               data-discovered="${isDiscovered}">
            <div class="principle-icon">${isDiscovered ? p.icon : ''}</div>
            <div class="principle-info">
              <div class="principle-name">${isDiscovered ? p.name : '???'}</div>
              <div class="principle-source">
                <span class="tag">${p.category}</span>
                ${isDiscovered ? p.source : '???'}
              </div>
            </div>
            <div class="principle-status">${isDiscovered ? '발견' : ''}</div>
          </div>
        `;
      }).join('');
      
      // 클릭 이벤트
      list.querySelectorAll('.principle-item.discovered').forEach(item => {
        item.addEventListener('click', () => showModal(item.dataset.name));
      });
    }

    function showModal(name) {
      const p = ALL_PRINCIPLES.find(x => x.name === name);
      if (!p) return;
      
      document.getElementById('modalIcon').textContent = p.icon;
      document.getElementById('modalName').textContent = p.name;
      document.getElementById('modalDesc').textContent = p.desc;
      document.getElementById('modalSource').textContent = p.source;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    // 필터 이벤트
    document.getElementById('categoryFilter').addEventListener('click', e => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('#categoryFilter .filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCategoryFilter = e.target.dataset.filter;
        renderList();
      }
    });

    document.getElementById('statusFilter').addEventListener('click', e => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('#statusFilter .filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentStatusFilter = e.target.dataset.filter;
        renderList();
      }
    });

    // 모달 닫기
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    // 초기화
    loadProfile();
    updateProgress();
    renderList();
  </script>
