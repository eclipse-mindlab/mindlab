<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뒷담화 현장 - 이클립스의 딜렘</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6f5fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0d14" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- SEO -->
  <meta name="description" content="동료들이 내 뒷담화를 하고 있다. 어떻게 대응할까?">
  <meta property="og:title" content="뒷담화 현장 - 이클립스의 딜렘">
  <meta property="og:description" content="동료들이 내 뒷담화를 하고 있다. 어떻게 대응할까?">
  <meta property="og:image" content="https://eclipse-mindlab.github.io/mindlab/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="eclipse.css">
  
  <style>
    /* 뒷담화 현장: a short film you play, three scenes.
       Corona marks progress only; the principle card is the one raised object. */
    body { min-height: 100vh; word-break: keep-all; overflow-wrap: anywhere; }
    .container { max-width: var(--col); margin: 0 auto; padding: 0 20px 64px; }

    /* top bar */
    .header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 6px;
      height: 56px; margin: 0 -20px; padding: 0 20px 0 10px;
      background: var(--bar);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    }
    .back-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; color: var(--mist); }
    .back-btn:hover { color: var(--moon); }
    .back-btn:active { transform: scale(.94); }
    .back-btn svg { width: 22px; height: 22px; }
    .header-content { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .header h1 { font-family: var(--serif); font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
    .header-category { font-size: 12px; color: var(--dim); white-space: nowrap; }

    /* progress: three thin segments */
    .progress { display: flex; gap: 6px; margin: 4px 0 40px; }
    .progress-bar { height: 2px; flex: 1; border-radius: 2px; background: var(--line); transition: background .3s; }
    .progress-bar.completed { background: var(--corona); }
    .progress-bar.current { background: var(--moon); }

    /* the scene */
    .scenario-card { margin-bottom: 32px; }
    .stage-label { font-size: 13px; color: var(--mist); margin-bottom: 14px; }
    .context { font-size: 15px; line-height: 1.85; color: var(--mist); margin-bottom: 20px; }
    .situation {
      font-family: var(--serif); font-size: clamp(22px, 6vw, 25px); line-height: 1.55;
      letter-spacing: -.01em; color: var(--moon); font-weight: 700;}

    /* choices: large rows, hairlines between */
    .choices { display: flex; flex-direction: column; border-top: 1px solid var(--line); margin-bottom: 24px; counter-reset: pick; }
    .choice-btn {
      display: grid; grid-template-columns: 30px 1fr; align-items: baseline; column-gap: 6px;
      width: 100%; padding: 18px 12px 18px 4px;
      text-align: left; font-size: 16px; line-height: 1.55; color: var(--moon);
      border-bottom: 1px solid var(--line);
      transition: background .2s ease, transform .15s ease;
    }
    .choice-btn::before { counter-increment: pick; content: counter(pick, upper-alpha); font-family: var(--serif); font-size: 17px; color: var(--dim); font-weight: 700;}
    @media (hover: hover) {
      .choice-btn:hover { background: var(--night-2); }
      .choice-btn:hover::before { color: var(--moon); }
    }
    .choice-btn:active { transform: scale(.98); background: var(--night-3); box-shadow: inset 2px 0 0 var(--moon); }

    /* after choosing */
    .result-section { display: none; }
    .result-section.show { display: block; }

    .selected-choice {     /* the picked row, held in place */
      padding: 16px 16px 18px; margin-bottom: 28px;
      background: var(--night-3); border-radius: var(--r-s); box-shadow: inset 2px 0 0 var(--moon);
    }
    .selected-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .selected-label { font-size: 12px; color: var(--dim); }
    .selected-badge, .eval-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--mist); white-space: nowrap;
    }
    .selected-badge::before, .eval-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
    .selected-badge.optimal, .eval-badge.positive { color: var(--ok); }
    .selected-badge.optimal::before, .eval-badge.positive::before { background: currentColor; }
    .selected-badge.neutral, .eval-badge.neutral { color: var(--mist); }
    .selected-badge.neutral::before, .eval-badge.neutral::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
    .selected-badge.bad, .eval-badge.negative { color: var(--dim); }
    .selected-text { font-size: 16px; line-height: 1.6; color: var(--moon); }

    .outcome-card { margin-bottom: 28px; }
    .outcome-label { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
    .outcome-text { font-size: 16px; line-height: 1.9; color: var(--moon); opacity: .9; }

    /* the one special object */
    .principle-card { background: var(--night-2); border-radius: var(--r-m); padding: 22px 20px 24px; margin-bottom: 20px; }
    .principle-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .principle-icon { width: 6px; height: 6px; border-radius: 50%; background: var(--violet); font-size: 0; }
    .principle-label { font-size: 12px; color: var(--mist); }
    .principle-name { font-family: var(--serif); font-size: 23px; line-height: 1.35; color: var(--moon); margin-bottom: 10px; font-weight: 700;}
    .principle-explanation { font-size: 15px; line-height: 1.8; color: var(--mist); }

    .evaluation-card {
      display: flex; gap: 12px; align-items: baseline;
      padding: 4px 0 20px; margin-bottom: 4px;
    }
    .evaluation-icon { flex: none; width: 7px; height: 7px; border-radius: 50%; font-size: 0; transform: translateY(-2px); box-shadow: inset 0 0 0 1.5px currentColor; }
    .evaluation-text { font-size: 14.5px; line-height: 1.7; color: var(--mist); }
    .evaluation-card.positive .evaluation-icon { color: var(--ok); background: currentColor; }
    .evaluation-card.neutral .evaluation-icon { color: var(--mist); background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
    .evaluation-card.negative .evaluation-icon { color: var(--dim); }

    .other-choices-section { margin-bottom: 28px; border-top: 1px solid var(--line); }
    .other-choices-toggle {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 14px 4px; font-size: 14px; color: var(--mist);
    }
    .other-choices-toggle:hover { color: var(--moon); }
    .other-choices-toggle svg { transition: transform .2s ease; }
    .other-choices-toggle.open svg { transform: rotate(180deg); }
    .other-choices-content { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
    .other-choices-content.hidden { display: none; }
    .other-choice-card { padding: 14px 4px; border-bottom: 1px solid var(--line); }
    .other-choice-header { margin-bottom: 4px; }
    .other-choice-text { font-size: 15px; line-height: 1.6; color: var(--moon); margin-bottom: 4px; }
    .other-choice-principle { font-family: var(--serif); font-size: 15px; color: var(--mist); font-weight: 700;}

    .next-btn { width: 100%; height: 50px; }

    /* final */
    .final-screen { display: none; padding: 20px 0 0; }
    .final-screen.show { display: block; }

    .score-card { margin-bottom: 44px; }
    .score-label { font-size: 13px; color: var(--mist); margin-bottom: 6px; }
    .score-display { order: -1; line-height: 1; margin: 0 0 18px; font-variant-numeric: tabular-nums; }
    .score-card { display: flex; flex-direction: column; }
    .score-label { order: -2; }
    .score-number { font-family: var(--serif); font-size: 76px; letter-spacing: -.03em; color: var(--moon); font-weight: 700;}
    .score-total { font-family: var(--serif); font-size: 30px; color: var(--dim); margin-left: 4px; font-weight: 700;}
    .score-message { font-size: 16px; line-height: 1.85; color: var(--moon); opacity: .9; margin-bottom: 14px; }
    .score-exp { font-size: 13px; color: var(--mist); font-variant-numeric: tabular-nums; }

    .principles-collected { margin-bottom: 40px; }
    .principles-title { font-family: var(--serif); font-size: 23px; margin-bottom: 8px; font-weight: 700;}
    .principle-item { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .principle-item:last-child { border-bottom: 0; }
    .principle-item-icon { width: 7px; height: 7px; margin-top: 9px; border-radius: 50%; font-size: 0; color: var(--dim); box-shadow: inset 0 0 0 1.5px currentColor; }
    .principle-item.positive .principle-item-icon { color: var(--ok); background: currentColor; }
    .principle-item.neutral .principle-item-icon { color: var(--mist); background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
    .principle-item-content { min-width: 0; }
    .principle-item-name { font-family: var(--serif); font-size: 18px; line-height: 1.4; margin-bottom: 4px; font-weight: 700;}
    .principle-item-desc { font-size: 14px; line-height: 1.7; color: var(--mist); }

    .share-section { margin-bottom: 12px; }
    .share-label { display: none; }
    .share-buttons { display: flex; gap: 10px; }
    .share-btn { flex: 1; height: 46px; font-weight: 500; font-size: 14px; }
    .share-btn svg { width: 16px; height: 16px; }

    .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
    .home-btn, .restart-btn { width: 100%; height: 50px; }

    /* books */
    .promo-section { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); }
    .books-section-title { font-size: 13px; color: var(--mist); margin-bottom: 18px; }
    .books-grid { display: flex; gap: 18px; }
    .book-item { display: flex; flex-direction: column; gap: 8px; width: 104px; }
    .book-item img { width: 104px; height: 161px; object-fit: contain; object-position: left bottom; filter: drop-shadow(0 12px 18px rgba(0,0,0,.5)); }
    .book-item:active img { transform: scale(.97); }
    .book-item-title { font-size: 13px; line-height: 1.35; color: var(--moon); }
  </style>
  <style id="redesign-choices">
    /* 2026 리디자인: 선택지를 둥근 타일로 */
    .choices { border-top: 0 !important; display: flex; flex-direction: column; gap: 10px; }
    .choice-btn { background: var(--night-3) !important; border: 0 !important; border-radius: var(--r-m) !important; padding: 16px !important; box-shadow: none !important; font-weight: 600; letter-spacing: -.02em; margin: 0 !important; }
    .choice-btn::before { color: var(--violet) !important; font-weight: 800 !important; }
    .choice-btn:active { background: var(--violet-soft) !important; box-shadow: inset 0 0 0 2px var(--violet) !important; }
    @media (hover: hover) { .choice-btn:hover { background: color-mix(in srgb, var(--night-3) 85%, var(--violet) 10%) !important; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn" aria-label="홈으로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="header-content">
        <h1>뒷담화 현장</h1>
        <div class="header-category">심리 · 관계</div>
      </div>
    </div>
    
    <div class="progress" id="progress"></div>
    
    <div id="game-screen">
      <div class="scenario-card">
        <div class="stage-label" id="stage-label">상황 1</div>
        <div class="context" id="context"></div>
        <div class="situation" id="situation"></div>
      </div>
      
      <div class="choices" id="choices"></div>
      
      <div class="result-section" id="result-section">
        <div class="selected-choice">
          <div class="selected-header">
            <span class="selected-label">내 선택</span>
            <span class="selected-badge" id="selected-badge">최적의 수</span>
          </div>
          <div class="selected-text" id="selected-text"></div>
        </div>
        
        <div class="outcome-card">
          <div class="outcome-label">그 다음</div>
          <div class="outcome-text" id="outcome-text"></div>
        </div>
        
        <div class="principle-card">
          <div class="principle-header">
            <span class="principle-icon"></span>
            <span class="principle-label">발견한 원칙</span>
          </div>
          <div class="principle-name" id="principle-name"></div>
          <div class="principle-explanation" id="principle-explanation"></div>
        </div>

        <div class="evaluation-card" id="evaluation-card">
          <div class="evaluation-icon" id="evaluation-icon"></div>
          <div class="evaluation-text" id="evaluation-text"></div>
        </div>

        <div class="other-choices-section">
          <button class="other-choices-toggle" id="other-toggle">
            <span>다른 선택지는 어땠을까요</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="other-choices-content hidden" id="other-choices-content"></div>
        </div>
        
        <button class="next-btn ecl-btn" id="next-btn">다음 상황</button>
      </div>
    </div>
    
    <div class="final-screen" id="final-screen">
      <div class="score-card">
        <div class="score-display">
          <span class="score-number" id="score-number">0</span><span class="score-total">/6</span>
        </div>
        <div class="score-label">당신의 심리전 점수</div>
        <div class="score-message" id="score-message">메시지</div>
        <div class="score-exp">경험치 +30</div>
      </div>

      <div class="principles-collected">
        <div class="principles-title">발견한 원칙</div>
        <div id="principles-list"></div>
      </div>

      <div class="share-section">
        <div class="share-label">친구에게 공유하기</div>
        <div class="share-buttons">
          <button class="share-btn ecl-btn ghost" id="native-share-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
              <polyline points="16 6 12 2 8 6"/>
              <line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
            공유하기
          </button>
          <button class="share-btn ecl-btn ghost" id="copy-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            링크 복사
          </button>
        </div>
      </div>

      <div class="action-buttons">
        <a href="index.html" class="home-btn ecl-btn">홈으로 돌아가기</a>
        <button class="restart-btn ecl-btn ghost" id="restart-btn">다시 해보기</button>
      </div>

      <div class="promo-section">
        <div class="books-section">
          <div class="books-section-title">이 시뮬레이터의 바탕이 된 철학과 심리학이 궁금하다면</div>
          <div class="books-grid">
            <a href="https://litt.ly/eclipse.thinker" target="_blank" class="book-item">
              <img src="img/book-philosophy.webp" alt="훔친 철학 편" loading="lazy">
              <div class="book-item-title">훔친 철학 편</div>
            </a>
            <a href="https://litt.ly/eclipse.thinker" target="_blank" class="book-item">
              <img src="img/book-psychology.webp" alt="훔친 심리학 편" loading="lazy">
              <div class="book-item-title">훔친 심리학 편</div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 시나리오 데이터
    const scenarios = [
      // Stage 1: 발견
      {
        id: "start",
        context: "퇴근 준비 중. 화장실 가려고 복도를 지나가는데 휴게실에서 웃음소리가 들린다.",
        situation: "\"걔 진짜... 솔직히 좀 그렇지 않아?\"\n\n내 이름이 들렸다. 분명히 나를 얘기하고 있다.",
        choices: [
          {
            text: "문을 열고 들어간다",
            outcome: "문이 열리자 웃음소리가 뚝 끊긴다. 세 명이 당신을 본다. 어색한 침묵. 이제 당신은 '예민한 사람'이 됐다.",
            principle: "충동적 대면의 비용",
            principleDesc: "감정이 앞서면 정보 없이 싸움터에 들어가게 된다. 상대는 '그냥 얘기했을 뿐인데'라고 생각하고, 오히려 당신이 과민반응하는 사람으로 보일 수 있다.",
            evaluation: "negative",
            evalText: "성급했다. 뭘 들었는지도 모른 채 대면하면, 오히려 내가 불리해진다.",
            score: 0,
            nextStage: "confronted"
          },
          {
            text: "문 앞에서 조용히 듣는다",
            outcome: "숨을 죽이고 듣는다. \"진짜 요즘 왜 저러는지 모르겠어.\" \"그니까, 나만 불편한 줄 알았는데.\" 누가 주도하는지, 뭘 불편해하는지 파악된다.",
            principle: "정보 비대칭",
            principleDesc: "상대가 모르는 걸 내가 알 때 선택권이 생긴다. 대응할지, 무시할지, 거리를 둘지 — 정보가 있어야 판단할 수 있다.",
            evaluation: "positive",
            evalText: "최적의 선택. '누가, 무엇을, 왜' — 알아야 대응 여부를 결정할 수 있다.",
            score: 2,
            nextStage: "listened"
          },
          {
            text: "못 들은 척 지나간다",
            outcome: "화장실로 향한다. 마음이 좀 불편하지만, 직장에서 모든 말에 반응할 필요는 없다. 내일이면 잊을 수도 있다.",
            principle: "전략적 무시",
            principleDesc: "모든 갈등에 에너지를 쓸 필요는 없다. 한 번의 험담이 패턴인지, 일회성인지 모르는 상황에서 반응하면 오히려 손해다.",
            evaluation: "neutral",
            evalText: "현실적인 선택. 다만 반복되면 다른 전략이 필요하다.",
            score: 1,
            nextStage: "avoided"
          }
        ]
      },
      
      // Stage 2A: 직접 대면 후
      {
        id: "confronted",
        context: "세 명이 당황한 표정이다. 그 중 민지가 먼저 말한다. \"어, 언제 왔어?\"",
        situation: "이미 들어왔다. 이 상황을 어떻게 수습할까?",
        choices: [
          {
            text: "\"무슨 얘기 하고 있었어?\"",
            outcome: "\"아... 그냥 회사 얘기.\" 민지가 시선을 피한다. 예상대로 진실은 안 나온다. 분위기만 어색해졌다.",
            principle: "열린 질문의 함정",
            principleDesc: "\"무슨 얘기했어?\"는 상대에게 도망칠 구멍을 준다. 거짓말할 여지가 있는 질문은 거짓말을 부른다.",
            evaluation: "negative",
            evalText: "진실도 못 얻고, 관계만 어색해졌다. 최악의 결과.",
            score: 0,
            nextStage: "asked_directly"
          },
          {
            text: "\"아 나 물 마시러 왔어.\" (자연스럽게)",

            evalText: "성숙한 선택. 감정보다 상황을 우선했다.",
            score: 2,
            nextStage: "end"
          },
          {
            text: "다른 테이블로 간다",
            outcome: "대놓고 피하는 모습이 팀 전체에 보인다. \"쟤네 무슨 일 있어?\" 새로운 소문의 주인공이 됐다.",
            principle: "공개적 회피의 비용",
            principleDesc: "피하는 모습이 보이면, 그 자체가 새로운 이야깃거리가 된다. 차라리 평소처럼 행동하는 게 관심을 덜 받는다.",
            evaluation: "negative",
            evalText: "오히려 주목받았다. 피하려다 더 눈에 띄었다.",
            score: 0,
            nextStage: "end"
          },
          {
            text: "일찍 간다고 하고 나간다",
            outcome: "자연스럽게 빠진다. 아무도 신경 쓰지 않는다. 억지로 버틸 필요 없다.",
            principle: "전략적 퇴장",
            principleDesc: "모든 자리에 끝까지 있을 필요 없다. 불편한 상황을 피하는 것도 에너지 관리다. 단, 습관이 되면 고립된다.",
            evaluation: "neutral",
            evalText: "무난한 선택. 하지만 매번 이러면 안 된다.",
            score: 1,
            nextStage: "end"
          }
        ]
      },

      // Stage 3F: 직접 질문 후
      {
        id: "asked_directly",
        context: "\"무슨 얘기 하고 있었어?\"라고 물었지만, \"그냥 회사 얘기\"라는 답만 돌아왔다.",
        situation: "진실도 못 얻고 분위기만 어색해졌다. 어떻게 수습할까?",
        choices: [
          {
            text: "\"아 그래?\" 하고 자연스럽게 넘긴다",
            outcome: "더 파고들지 않고 넘어간다. 어색함이 약간 풀린다. 최선은 아니지만, 최악은 면했다.",
            principle: "손실 최소화",
            principleDesc: "이미 잘못된 상황에서는 더 나빠지지 않게 하는 게 최선이다. 실수를 인정하고 빠르게 수습한다.",
            evaluation: "positive",
            evalText: "손절을 잘했다. 더 파면 더 어색해졌을 것.",
            score: 2,
            nextStage: "end"
          },
          {
            text: "\"진짜? 내 얘기 아니었어?\"라고 다시 묻는다",
            outcome: "\"아니야, 왜 그래?\" 민지가 의아해한다. 이제 당신이 피해망상 있는 사람처럼 보인다.",
            principle: "과잉 추궁의 역효과",
            principleDesc: "증거 없이 계속 의심하면, 상대가 아니라 당신이 문제가 된다. '걔 왜 저래?'의 주인공이 된다.",
            evaluation: "negative",
            evalText: "최악의 선택. 이제 당신이 이상한 사람이 됐다.",
            score: 0,
            nextStage: "end"
          },
          {
            text: "그냥 나온다. 머리 식히러",
            outcome: "일단 그 자리를 벗어난다. 냉정해지니 굳이 대응할 필요 없었다는 생각이 든다.",
            principle: "감정적 거리두기",
            principleDesc: "화가 날 때 바로 행동하면 후회한다. 일단 물리적으로 떨어지면 생각이 정리된다.",
            evaluation: "neutral",
            evalText: "나쁘지 않은 선택. 쿨다운이 필요했다.",
            score: 1,
            nextStage: "end"
          }
        ]
      }
    ];

    // 게임 상태
    let currentStageIndex = 0;
    let currentScenario = scenarios[0];
    let score = 0;
    let totalStages = 0;
    let collectedPrinciples = [];
    let stageHistory = ['start'];

    // DOM 요소
    const gameScreen = document.getElementById('game-screen');
    const finalScreen = document.getElementById('final-screen');
    const progressBar = document.getElementById('progress');
    const stageLabel = document.getElementById('stage-label');
    const contextEl = document.getElementById('context');
    const situationEl = document.getElementById('situation');
    const choicesEl = document.getElementById('choices');
    const resultSection = document.getElementById('result-section');
    const selectedBadge = document.getElementById('selected-badge');
    const selectedText = document.getElementById('selected-text');
    const outcomeText = document.getElementById('outcome-text');
    const principleName = document.getElementById('principle-name');
    const principleExplanation = document.getElementById('principle-explanation');
    const evaluationCard = document.getElementById('evaluation-card');
    const evaluationIcon = document.getElementById('evaluation-icon');
    const evaluationText = document.getElementById('evaluation-text');
    const otherToggle = document.getElementById('other-toggle');
    const otherContent = document.getElementById('other-choices-content');
    const nextBtn = document.getElementById('next-btn');

    // 초기화
    function init() {
      currentStageIndex = 0;
      currentScenario = scenarios[0];
      score = 0;
      totalStages = 0;
      collectedPrinciples = [];
      stageHistory = ['start'];
      
      gameScreen.classList.remove('hidden');
      finalScreen.classList.remove('show');
      
      renderStage();
    }

    // 스테이지 렌더링
    function renderStage() {
      const scenario = currentScenario;
      totalStages++;
      
      // 진행바 업데이트
      updateProgress();
      
      stageLabel.textContent = `상황 ${totalStages}`;
      contextEl.textContent = scenario.context;
      situationEl.innerHTML = scenario.situation.replace(/\n/g, '<br>');
      
      // 선택지 렌더링
      choicesEl.innerHTML = '';
      scenario.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        btn.addEventListener('click', () => handleChoice(index));
        choicesEl.appendChild(btn);
      });
      
      // 결과 섹션 숨기기
      resultSection.classList.remove('show');
      choicesEl.classList.remove('hidden');
    }

    // 진행바 업데이트
    function updateProgress() {
      const maxStages = 3;
      progressBar.innerHTML = '';
      for (let i = 0; i < maxStages; i++) {
        const bar = document.createElement('div');
        bar.className = 'progress-bar';
        if (i < totalStages - 1) bar.classList.add('completed');
        else if (i === totalStages - 1) bar.classList.add('current');
        progressBar.appendChild(bar);
      }
    }

    // 선택 처리
    function handleChoice(index) {
      const choice = currentScenario.choices[index];
      
      // 점수 추가
      score += choice.score;
      
      // 원칙 수집
      collectedPrinciples.push({
        name: choice.principle,
        desc: choice.principleDesc,
        evaluation: choice.evaluation
      });
      
      // 선택지 숨기기
      choicesEl.classList.add('hidden');
      
      // 결과 표시
      selectedText.textContent = choice.text;
      
      // 뱃지 설정
      if (choice.score === 2) {
        selectedBadge.textContent = '최적의 수';
        selectedBadge.className = 'selected-badge optimal';
      } else if (choice.score === 1) {
        selectedBadge.textContent = '중립';
        selectedBadge.className = 'selected-badge neutral';
      } else {
        selectedBadge.textContent = '최악의 수';
        selectedBadge.className = 'selected-badge bad';
      }
      
      outcomeText.textContent = choice.outcome;
      principleName.textContent = choice.principle;
      principleExplanation.textContent = choice.principleDesc;
      
      // 평가 카드
      evaluationCard.className = 'evaluation-card ' + choice.evaluation;
      if (choice.evaluation === 'positive') {
        evaluationIcon.textContent = '';
      } else if (choice.evaluation === 'neutral') {
        evaluationIcon.textContent = '';
      } else {
        evaluationIcon.textContent = '';
      }
      evaluationText.textContent = choice.evalText;
      
      // 다른 선택지 표시
      renderOtherChoices(index);
      
      // 다음 버튼
      if (choice.nextStage === 'end') {
        nextBtn.textContent = '결과 보기';
      } else {
        nextBtn.textContent = '다음 상황';
      }
      
      // 결과 섹션 표시
      resultSection.classList.add('show');
      
      // 다음 스테이지 저장
      stageHistory.push(choice.nextStage);
    }

    // 다른 선택지 렌더링
    function renderOtherChoices(selectedIndex) {
      otherContent.innerHTML = '';
      otherContent.classList.add('hidden');
      otherToggle.classList.remove('open');
      
      currentScenario.choices.forEach((choice, index) => {
        if (index === selectedIndex) return;
        
        const card = document.createElement('div');
        card.className = 'other-choice-card';
        
        let badgeText, badgeClass;
        if (choice.score === 2) {
          badgeText = '최적의 수';
          badgeClass = 'positive';
        } else if (choice.score === 1) {
          badgeText = '중립';
          badgeClass = 'neutral';
        } else {
          badgeText = '최악의 수';
          badgeClass = 'negative';
        }
        
        card.innerHTML = `
          <div class="other-choice-header">
            <span class="eval-badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="other-choice-text">${choice.text}</div>
          <div class="other-choice-principle">${choice.principle}</div>
        `;
        
        otherContent.appendChild(card);
      });
    }

    // 다른 선택지 토글
    otherToggle.addEventListener('click', () => {
      otherToggle.classList.toggle('open');
      otherContent.classList.toggle('hidden');
    });

    // 다음 버튼
    nextBtn.addEventListener('click', () => {
      const nextStageId = stageHistory[stageHistory.length - 1];
      
      if (nextStageId === 'end') {
        showFinalResult();
      } else {
        currentScenario = scenarios.find(s => s.id === nextStageId);
        if (currentScenario) {
          renderStage();
        } else {
          showFinalResult();
        }
      }
    });

    // 최종 결과
    function showFinalResult() {
      gameScreen.classList.add('hidden');
      finalScreen.classList.add('show');
      
      const maxScore = totalStages * 2;
      document.getElementById('score-number').textContent = score;
      document.querySelector('.score-total').textContent = '/' + maxScore;
      
      // 메시지
      const percentage = score / maxScore;
      let message;
      if (percentage >= 0.8) {
        message = "뛰어난 심리전 감각입니다! 상황을 정확히 읽고 최적의 수를 찾았네요. 관계를 다루는 데 탁월한 능력을 가지고 있습니다.";
      } else if (percentage >= 0.5) {
        message = "괜찮은 감각이에요! 몇 가지 상황에서 더 전략적인 선택이 가능했지만, 기본적인 심리 원칙은 이해하고 있네요.";
      } else {
        message = "아직 감이 덜 잡혔어요. 하지만 걱정 마세요 — 심리전은 타고나는 게 아니라 배우는 겁니다. 다시 해보면서 패턴을 익혀보세요.";
      }
      document.getElementById('score-message').textContent = message;
      
      // 원칙 목록
      const principlesList = document.getElementById('principles-list');
      principlesList.innerHTML = '';
      collectedPrinciples.forEach(p => {
        let icon;
        if (p.evaluation === 'positive') icon = '';
        else if (p.evaluation === 'neutral') icon = '';
        else icon = '';
        
        const item = document.createElement('div');
        item.className = 'principle-item ' + p.evaluation;
        item.innerHTML = `
          <div class="principle-item-icon">${icon}</div>
          <div class="principle-item-content">
            <div class="principle-item-name">${p.name}</div>
            <div class="principle-item-desc">${p.desc}</div>
          </div>
        `;
        principlesList.appendChild(item);
      });
      
      // 프로필 저장
      saveProgress();
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 프로필 저장
    function saveProgress() {
      const STORAGE_KEY = 'eclipse_mindlab_profile';
      let saved = localStorage.getItem(STORAGE_KEY);
      let profile;
      
      if (saved) {
        profile = JSON.parse(saved);
      } else {
        profile = { version: 5, name: '익명 탐험가', level: 1, exp: 0, completedSims: [], principles: [] };
      }
      
      if (!profile.completedSims) profile.completedSims = [];
      if (!profile.principles) profile.principles = [];
      
      // 완료 기록
      if (!profile.completedSims.includes('gossip')) {
        profile.completedSims.push('gossip');
        profile.exp = (profile.exp || 0) + 30;
      }
      
      // 원칙 추가
      collectedPrinciples.forEach(p => {
        const principleStr = p.name;
        if (!profile.principles.includes(principleStr) && 
            !profile.principles.find(existing => (typeof existing === 'object' ? existing.name : existing) === principleStr)) {
          profile.principles.push(principleStr);
        }
      });
      
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
    }

    // 공유
    document.getElementById('native-share-btn').addEventListener('click', async () => {
      const maxScore = totalStages * 2;
      const text = `심리전 시뮬레이터 - 🎯 나의 심리전 점수: ${score}/${maxScore}점\n당신의 심리전 감각을 테스트해보세요!\nhttps://eclipse-mindlab.github.io/mindlab/sim-gossip.html`;
      
      if (navigator.share) {
        try {
          await navigator.share({ title: '심리전 시뮬레이터', text: text });
        } catch (e) {}
      } else {
        try {
          await navigator.clipboard.writeText(text);
          alert('결과가 클립보드에 복사되었습니다!');
        } catch (e) {
          alert('공유 기능을 사용할 수 없습니다.');
        }
      }
    });

    document.getElementById('copy-btn').addEventListener('click', async () => {
      const maxScore = totalStages * 2;
      const text = `심리전 시뮬레이터 - 🎯 나의 심리전 점수: ${score}/${maxScore}점\n당신의 심리전 감각을 테스트해보세요!\nhttps://eclipse-mindlab.github.io/mindlab/sim-gossip.html`;
      try {
        await navigator.clipboard.writeText(text);
        alert('링크가 클립보드에 복사되었습니다!');
      } catch (e) {
        alert('복사 기능을 사용할 수 없습니다.');
      }
    });

    // 다시하기
    document.getElementById('restart-btn').addEventListener('click', () => {
      init();
    });

    // 시작
    init();
  </script>
</body>
</html>
