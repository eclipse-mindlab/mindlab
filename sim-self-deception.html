  <script>
const SIDE={"hold1": "R", "buy1": "R", "recheck1": "F", "app1": "D", "grape2": "G", "luck2": "G", "ask2": "F", "mute2": "D", "help3": "R", "deal3": "F", "no3": "G", "bad4": "R", "sens4": "G", "reason4": "R", "sorry4": "F", "phone5": "D", "health5": "D", "legacy5": "R", "call5": "F"};
const RES={"R": {"title": "그럴듯한 해설자", "body": "불리한 일이 생기면 그럴듯한 이유를 먼저 찾는 쪽입니다. 결론이 먼저 있고, 이유는 그 뒤에 따라옵니다.\n\n뇌는 진짜 이유를 몰라도 설명은 막힘없이 지어냅니다. 이 능력은 자존감을 지켜 줍니다. 하지만 이유가 그럴듯할수록 의심하기 어렵고, 판단을 고칠 기회도 그만큼 줄어듭니다."}, "G": {"title": "신 포도의 여우", "body": "남의 성공은 운으로, 내 실패는 상황 탓으로 돌리는 쪽입니다. 상대를 깎아내리면 나는 지지 않은 사람이 됩니다.\n\n이솝의 여우처럼 닿지 않는 포도를 시다고 부르면 마음은 바로 편해집니다. 다만 포도가 시다고 믿는 순간, 다시 뛰어오를 이유도 사라집니다."}, "D": {"title": "모래 속의 타조", "body": "불편한 사실이 보이면 일단 눈을 돌리는 쪽입니다. 보지 않으면 불안도 없다는 게 이 방식의 논리입니다.\n\n실제로 당장은 효과가 있습니다. 하지만 정보를 피한다고 사실이 바뀌지는 않습니다. 판단을 내려야 할 시점만 늦어지고, 그사이 선택지는 줄어듭니다."}, "F": {"title": "눈을 뜬 사람", "body": "불편해도 사실을 똑바로 보려는 쪽입니다. 손해를 인정하고, 틀린 걸 사과하고, 나보다 나은 사람에게 묻습니다.\n\n다만 자기를 정확히 보는 사람이 꼭 더 행복한 건 아닙니다. 자기를 조금 좋게 보는 착각이 사람을 버티게 한다는 연구도 많습니다. 자기기만을 모두 걷어 내는 게 정답은 아닐지도 모릅니다."}};
const CONFIG={id:'self-deception',title:'자기기만 시뮬레이터',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-self-deception.html',version:5,
stages:[{"badge": "믿음", "title": "떨어지는 주식", "desc": "몇 달을 공부하고 고른 주식을 샀다. 그런데 산 날부터 계속 떨어지더니, 지금은 30% 손실이다.\n\n그 회사에 대한 나쁜 기사도 하나둘 나오기 시작했다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "hold1", "text": "\"회사는 좋은데 시장이 이상한 거야.\" 기다린다.", "meaning": "좋은 회사가 시장 분위기 때문에 저평가되는 일은 실제로 있다. 버티는 게 정답일 때도 있다.\n\n문제는 근거를 다루는 방식이다. 오를 때는 내 판단이 맞았다는 근거 하나로 충분했는데, 떨어질 때는 나쁜 기사가 아무리 쌓여도 시장 탓으로 돌린다. 결론에 따라 증거의 기준이 바뀌고 있다.", "principle": {"name": "동기화된 추론", "desc": "믿고 싶은 결론 앞에서는 '믿어도 될까?'를 묻고, 믿기 싫은 결론 앞에서는 '꼭 믿어야 하나?'를 묻는다. 앞의 질문은 근거 하나로 통과하고, 뒤의 질문은 근거가 아무리 쌓여도 통과하지 못한다. 결론이 먼저 정해지고, 추론은 그 결론을 변호하러 나선다.", "icon": ""}}, {"id": "buy1", "text": "더 사서 평균 단가를 낮춘다.", "meaning": "가격이 내려갔을 때 더 사는 건 흔한 전략이고, 반등하면 손실을 빨리 만회할 수 있다.\n\n다만 이 결정이 새 정보 때문인지, 이미 넣은 돈을 지키고 싶어서인지는 따져 봐야 한다. 처음 판단이 틀렸다고 인정하는 대신 더 크게 걸면, 물러서기는 그만큼 더 어려워진다.", "principle": {"name": "몰입 상승", "desc": "이미 많이 걸어 둔 결정일수록, 일이 틀어져도 오히려 더 건다. 물러서는 순간 지금까지 건 것이 전부 실수였다고 인정해야 하기 때문이다. 그래서 잘못된 결정은 작을 때보다 클 때 멈추기가 더 어렵다.", "icon": ""}}, {"id": "recheck1", "text": "처음 이 주식을 산 이유가 아직 유효한지 다시 따져 본다.", "meaning": "가장 정직한 방법이다. 이 주식을 오늘 처음 봤다면 이 가격에 사겠는지를 묻는 것이다.\n\n다만 쉽지 않다. 그 이유가 이미 틀렸다는 결론이 나오면 손실을 확정하고, 내 판단이 틀렸다는 것도 인정해야 한다. 그래서 대부분은 이 질문 앞에서 머뭇거린다.", "principle": {"name": "매몰 비용", "desc": "이미 써 버려서 되돌릴 수 없는 돈과 시간을 매몰 비용이라고 한다. 합리적인 판단은 앞으로의 손익만 따진다. 하지만 사람은 '여기까지 왔는데'라는 아까움을 판단의 근거로 쓴다.", "icon": ""}}, {"id": "app1", "text": "증권 앱을 지우고 당분간 안 본다.", "meaning": "매일 계좌를 들여다보면 판단보다 감정이 앞서기 쉽다. 잠시 거리를 두는 건 마음을 지키는 방법이 될 수 있다.\n\n하지만 보지 않는다고 손실이 사라지지는 않는다. 정보를 피하는 동안 판단을 내릴 기회도 같이 지나간다.", "principle": {"name": "타조 효과", "desc": "나쁜 소식이 예상되면 아예 확인하지 않으려는 경향이다. 주가가 떨어지는 날 계좌를 덜 열어 보는 게 대표적이다. 확인하지 않는 동안에는 손실도 없는 것처럼 느껴진다.", "icon": ""}}]}, {"badge": "비교", "title": "먼저 승진한 동기", "desc": "같이 입사한 동기가 먼저 승진했다. 이번엔 나도 될 줄 알았다.\n\n단체 대화방에 축하 메시지가 이어진다.", "highlight": "어떻게 반응하겠는가?", "choices": [{"id": "grape2", "text": "\"저렇게까지 윗사람 비위 맞추며 살고 싶진 않아.\" 하고 넘긴다.", "meaning": "이렇게 생각하면 마음이 한결 편해진다. 승진을 못 한 내가 오히려 지킬 걸 지킨 사람이 된다.\n\n다만 그 기준이 승진 발표 전에도 있었는지 돌아볼 필요가 있다. 승진하고 싶던 마음은 그대로인데 평가만 뒤집혔다면, 다음 기회를 잡을 이유도 같이 사라진다.", "principle": {"name": "신 포도", "desc": "이솝 우화의 여우는 닿지 않는 포도를 보며 어차피 시었을 거라고 말한다. 갖지 못한 것의 가치를 깎아내리면 실패의 아픔이 줄어든다. 니체는 이 마음이 커지면, 이긴 사람을 머릿속에서 끌어내려 이기는 르상티망이 된다고 봤다.", "icon": ""}}, {"id": "luck2", "text": "\"운이 좋았지. 마침 맡은 프로젝트가 잘 풀렸으니까.\" 하고 넘긴다.", "meaning": "실제로 운이 작용했을 수도 있다. 승진에는 실력 말고도 시기와 운이 섞인다.\n\n문제는 내 일에도 같은 잣대를 쓰느냐다. 내가 잘되면 실력이고 남이 잘되면 운이라고 보는 한, 그 동기에게서 배울 것은 아무것도 남지 않는다.", "principle": {"name": "자기 위주 편향", "desc": "잘되면 내 실력이고, 안되면 상황 탓이다. 성공과 실패의 원인을 나에게 유리한 쪽으로 나눠 갖는 경향을 자기 위주 편향이라고 한다. 자존감은 지켜지지만, 무엇을 고쳐야 하는지는 끝까지 보이지 않는다.", "icon": ""}}, {"id": "ask2", "text": "축하하고, 무엇을 다르게 했는지 직접 물어본다.", "meaning": "가장 많이 배울 수 있는 선택이다. 동기가 어떻게 일했는지 들으면, 내가 놓친 게 무엇인지 구체적으로 보인다.\n\n대신 자존심이 상한다. 비교를 피하지 않고 정면으로 마주하는 일이라, 듣는 내내 마음이 편하지는 않다.", "principle": {"name": "상향 비교", "desc": "나보다 잘난 사람과 나를 견주는 것을 상향 비교라고 한다. 열등감을 부르기 쉽지만, 동시에 내가 어디까지 갈 수 있는지 보여 주는 가장 구체적인 본보기이기도 하다.", "icon": ""}}, {"id": "mute2", "text": "축하 이모티콘 하나만 남기고 대화방 알림을 끈다.", "meaning": "지금 내 마음을 지키는 현실적인 방법이다. 굳이 상처받을 소식을 계속 들을 이유는 없다.\n\n다만 불편한 정보를 피하는 습관은 쉽게 굳는다. 보고 싶은 것만 보면 마음은 편하지만, 내 위치를 정확히 알기는 어려워진다.", "principle": {"name": "선택적 노출", "desc": "내 생각과 맞는 정보는 찾아보고, 불편한 정보는 피하는 경향이다. 보고 싶은 것만 보면 마음은 편하지만, 내가 보는 세상은 점점 내가 믿고 싶은 모양으로 좁아진다.", "icon": ""}}]}, {"badge": "호감", "title": "싫은 사람의 부탁", "desc": "같은 팀에 영 마음에 안 드는 사람이 있다. 그 사람이 오늘, 급한 자료 하나만 같이 봐 줄 수 있느냐고 부탁했다.\n\n퇴근까지 30분 남았다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "help3", "text": "그냥 도와준다.", "meaning": "도와주고 나면 이상하게 그 사람이 덜 싫어지기도 한다. 다음에 마주쳤을 때 먼저 인사가 나오기도 한다.\n\n그런데 그 사람은 달라진 게 없다. 달라진 건 내 행동이다. 싫은 사람을 도운 나를 설명하려면, 그 사람이 생각만큼 싫지 않다고 믿는 게 가장 쉽다.", "principle": {"name": "벤저민 프랭클린 효과", "desc": "벤저민 프랭클린은 자기를 싫어하던 의원에게 책을 빌려 달라고 부탁했고, 그 뒤로 둘은 친구가 됐다. 싫은 사람을 도운 나를 설명하는 가장 쉬운 방법은, 사실 그 사람이 그렇게 싫지 않다고 믿는 것이다. 마음이 행동을 이끄는 줄 알지만, 행동이 마음을 바꾸기도 한다.", "icon": ""}}, {"id": "deal3", "text": "도와주되, 다음에 꼭 갚으라고 못 박는다.", "meaning": "거래로 만들면 깔끔하다. 손해 볼 것도 없고, 그 사람에 대한 생각을 바꿀 필요도 없다.\n\n대신 관계도 그대로다. 대가가 분명하면 왜 도왔는지 따로 설명할 필요가 없으니, 그 사람에 대한 마음도 움직이지 않는다.", "principle": {"name": "불충분한 정당화", "desc": "지루한 일을 재미있었다고 말해 달라는 부탁을 받고, 1달러를 받은 사람이 20달러를 받은 사람보다 그 일을 더 재미있었다고 기억했다. 20달러면 돈 때문에 거짓말했다고 설명할 수 있지만, 1달러로는 설명이 안 된다. 행동을 설명할 이유가 부족하면, 사람은 생각 쪽을 바꾼다.", "icon": ""}}, {"id": "no3", "text": "선약이 있다고 하고 거절한다.", "meaning": "내 시간을 지키는 건 정당한 일이다. 싫은 사람의 부탁까지 다 들어줄 의무는 없다.\n\n다만 거절하고 나면 그 사람이 왜 싫은지가 더 잘 보이기 시작한다. 거절한 나를 설명하려면, 그 사람이 역시 별로라는 근거가 필요하기 때문이다.", "principle": {"name": "확증 편향", "desc": "한번 생긴 생각에 맞는 정보는 잘 보이고, 반대되는 정보는 잘 안 보인다. 그 사람이 싫다고 정하는 순간부터, 그 사람의 실수만 눈에 들어온다.", "icon": ""}}]}, {"badge": "변명", "title": "세게 한 말", "desc": "회의에서 후배의 실수를 짚다가 말이 세게 나갔다. 후배 얼굴이 굳었다.\n\n회의가 끝나고 동료가 조용히 말한다. \"아까 좀 심했어.\"", "highlight": "뭐라고 답하겠는가?", "choices": [{"id": "bad4", "text": "\"내가 원래 돌려서 말을 못 하잖아.\"", "meaning": "솔직한 성격은 장점이 될 수 있다. 돌려 말하다가 핵심이 흐려지는 것보다 나을 때도 많다.\n\n문제는 그 성격을 방패로 쓸 때다. '원래 그런 사람'이라고 말하는 순간, 그때 다르게 말할 수도 있었다는 사실이 지워진다.", "principle": {"name": "나쁜 믿음", "desc": "사르트르는 손님 앞에서 지나치게 공손하게 움직이는 카페 종업원을 보고, 그가 종업원을 연기하고 있다고 봤다. 정해진 역할이나 성격 뒤에 숨으면, 다르게 행동할 수도 있었다는 사실을 외면할 수 있다. 사르트르는 이렇게 알면서도 모르는 척하는 자기기만을 나쁜 믿음이라고 불렀다.", "icon": ""}}, {"id": "sens4", "text": "\"그 친구가 좀 예민한 편이야.\"", "meaning": "사람마다 받아들이는 정도가 다른 건 사실이다. 같은 말도 누군가에게는 더 아프게 들린다.\n\n다만 남의 반응은 성격 탓으로, 내 말은 상황 탓으로 돌리고 있다면 한쪽으로 기운 판단이다. 내가 같은 말을 들었다면, 나도 예민하다는 소리를 들었을까.", "principle": {"name": "기본적 귀인 오류", "desc": "남이 실수하면 그 사람의 성격부터 보고, 그 사람이 처한 상황은 가볍게 넘긴다. 이것을 기본적 귀인 오류라고 한다. 내가 실수했을 때는 거꾸로 상황이 먼저 보인다.", "icon": ""}}, {"id": "reason4", "text": "\"그 실수가 반복되면 안 되니까 그랬지.\"", "meaning": "그럴듯한 이유다. 실제로 그 실수는 짚어야 했다.\n\n다만 이유가 그럴듯하다고 해서 그게 그 순간의 진짜 이유라는 보장은 없다. 짜증이 났던 건지, 후배가 미웠던 건지, 정말 실수 때문이었는지는 나도 정확히 알기 어렵다. 그래도 사람은 이유를 대는 데는 막힘이 없다.", "principle": {"name": "좌뇌 해석기", "desc": "좌뇌와 우뇌의 연결이 끊긴 환자는, 우뇌만 본 장면 때문에 한 행동에도 좌뇌가 곧바로 그럴듯한 이유를 지어낸다. 뇌에는 진짜 이유를 몰라도 이야기를 만들어 내는 해석기가 있다. 우리가 대는 이유 가운데 상당수도 행동이 끝난 뒤 이 해석기가 쓴 것일 수 있다.", "icon": ""}}, {"id": "sorry4", "text": "\"그러네. 이따 따로 사과할게.\"", "meaning": "가장 어려운 선택이다. 내가 틀렸다는 걸 인정하면 잠깐은 체면이 깎인다.\n\n대신 불편한 마음을 핑계로 덮지 않고 행동으로 정리하게 된다. 후배와의 관계도 회복될 가능성이 크다.", "principle": {"name": "인지부조화", "desc": "믿음과 행동이 부딪힐 때 생기는 불편함이다. '나는 괜찮은 사람'이라는 믿음과 '심한 말을 했다'는 사실이 부딪히면, 사람은 대개 사실 쪽을 다르게 해석한다. 사과는 그 반대로, 믿음에 맞게 행동을 고치는 드문 방법이다.", "icon": ""}}]}, {"badge": "죽음", "title": "장례식장에서 돌아오는 길", "desc": "아는 사람의 장례식에 다녀왔다. 나보다 겨우 몇 살 많았다.\n\n돌아오는 지하철에서 문득 생각한다. 나도 언젠가 죽는다. 그런데 그 생각이 영 실감 나지 않는다.", "highlight": "집에 와서 무엇을 하겠는가?", "choices": [{"id": "phone5", "text": "\"다들 언젠가 죽는 거지.\" 하고 휴대폰을 연다.", "meaning": "틀린 말은 하나도 없다. 그 생각을 붙잡고 있어 봐야 당장 할 수 있는 것도 별로 없어 보인다.\n\n다만 '다들 죽는다'와 '내가 죽는다'는 같은 무게로 와닿지 않는다. 앞의 문장은 사실로 알고, 뒤의 문장은 남의 일처럼 미뤄 둔다.", "principle": {"name": "카이우스의 삼단논법", "desc": "톨스토이의 소설에서 이반 일리치는 '카이우스는 사람이다, 사람은 죽는다, 그러므로 카이우스는 죽는다'를 평생 옳다고 믿었다. 다만 그건 카이우스 이야기였지 자기 이야기는 아니었다. 죽음을 아는 것과 내 죽음으로 받아들이는 것 사이에는 큰 거리가 있다.", "icon": ""}}, {"id": "health5", "text": "건강검진을 예약하고, 다음 주부터 운동하기로 한다.", "meaning": "몸을 챙기는 건 실제로 수명을 늘린다. 장례식이 좋은 계기가 된 셈이다.\n\n다만 이 결심이 죽음을 똑바로 본 결과인지, 죽음에 대한 생각을 빨리 치우는 방법인지는 구분해 볼 만하다. 할 일을 정하고 나면, 죽음은 다시 먼 훗날의 일이 된다.", "principle": {"name": "근접 방어", "desc": "죽음이 떠오르면 사람은 먼저 그 생각을 치운다. 아직 젊다거나, 건강만 챙기면 된다는 생각으로 죽음을 먼 미래로 밀어낸다. 몸에는 좋은 결심이 되기도 하지만, 죽음에 대한 생각은 다시 미뤄진다.", "icon": ""}}, {"id": "legacy5", "text": "\"그래도 내가 남긴 건 남겠지.\" 하고 생각한다.", "meaning": "일이든 자식이든 작품이든, 내가 떠난 뒤에도 남을 무언가를 생각하면 죽음이 덜 두렵다. 실제로 많은 사람이 이 생각으로 버틴다.\n\n다만 그것에 기대는 만큼, 그것을 지키려는 마음도 커진다. 내 일이나 내 신념이 부정당할 때 유난히 화가 나는 것도 여기서 나온다.", "principle": {"name": "상징적 불멸", "desc": "몸은 사라져도 이름, 업적, 자식, 신념은 남는다는 믿음이다. 이 믿음은 죽음의 공포를 달래 준다. 그래서 사람은 자기 신념이 공격받을 때, 마치 목숨이 위협받은 것처럼 격하게 반응하기도 한다.", "icon": ""}}, {"id": "call5", "text": "미뤄 둔 연락을 하나 한다.", "meaning": "죽음을 떠올린 덕분에 지금 중요한 게 무엇인지 선명해졌다. 언젠가 하려던 연락을 오늘 했다.\n\n다만 이런 선명함은 오래가지 않는다. 며칠만 지나도 다시 언젠가로 미루게 된다. 하이데거가 말한 것도 연락 한 통 같은 결심이 아니었다. 자기 죽음을 피하지 않을 때, 삶 전체를 대하는 태도가 달라진다는 것이었다.", "principle": {"name": "죽음을 향한 존재", "desc": "하이데거는 사람들이 '누구나 언젠가 죽는다'는 말로 자기 죽음을 남의 일처럼 만든다고 봤다. 자기 죽음을 피하지 않고 마주할 때, 남들 사는 대로가 아닌 자기 삶을 고르게 된다고 했다.", "icon": ""}}]}],
calculateResult(choices,principles){
  const c={R:0,G:0,D:0,F:0};choices.forEach(x=>{const k=SIDE[x.choiceId];if(k)c[k]++;});
  const m=Math.max(c.R,c.G,c.D,c.F);const k=['R','G','D','F'].find(t=>c[t]===m);const r=RES[k];
  return {icon:'',label:'당신은',title:r.title,desc:r.body,stats:[{value:c.R+'번',label:'해설'},{value:c.G+'번',label:'깎아내리기'},{value:c.D+'번',label:'외면'},{value:c.F+'번',label:'직면'}]};
},
getShareText(t){return '자기기만 시뮬레이터\n\n나는 '+t+'\n\n나는 나를 얼마나 속이고 있을까?\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-self-deception.html';}
};
