const SIDE={"hold1": "R", "buy1": "R", "recheck1": "F", "app1": "D", "grape2": "G", "luck2": "G", "ask2": "F", "mute2": "D", "help3": "R", "deal3": "F", "no3": "G", "bad4": "R", "sens4": "G", "reason4": "R", "sorry4": "F", "phone5": "D", "health5": "D", "legacy5": "R", "call5": "F"};
const RES={"R": {"title": "그럴듯한 해설자", "body": "무슨 일이 생기면 금세 이유를 찾아내는 사람입니다. 그 이유는 대체로 그럴듯하고, 덕분에 마음이 크게 흔들리지 않습니다.\n\n다만 그 이유가 행동보다 먼저 있었는지는 한 번쯤 의심해 볼 만합니다. 가자니가의 실험에서도 사람들은 진짜 이유를 몰라도 설명만은 막힘없이 했습니다.\n\n어느 쪽이든 가장 오래된 자기기만은 같습니다. 사람은 누구나 죽는다는 걸 알지만, 그게 내 이야기라고는 좀처럼 믿지 않습니다. 노르웨이 극작가 입센은 희곡 『들오리』에서 의사의 입을 빌려 이렇게 썼습니다. 평범한 사람에게서 삶의 거짓말을 빼앗으면, 그 순간 행복도 함께 빼앗는 것이다."}, "G": {"title": "신 포도의 여우", "body": "닿지 않는 것을 깎아내려 마음을 지키는 사람입니다. 덕분에 실패해도 오래 무너지지 않습니다.\n\n다만 포도가 시다고 믿는 순간, 다시 뛰어오를 이유도 사라집니다. 지금 낮춰 보는 것 가운데 사실은 간절히 원하던 게 있는지 돌아볼 만합니다.\n\n어느 쪽이든 가장 오래된 자기기만은 같습니다. 사람은 누구나 죽는다는 걸 알지만, 그게 내 이야기라고는 좀처럼 믿지 않습니다. 노르웨이 극작가 입센은 희곡 『들오리』에서 의사의 입을 빌려 이렇게 썼습니다. 평범한 사람에게서 삶의 거짓말을 빼앗으면, 그 순간 행복도 함께 빼앗는 것이다."}, "D": {"title": "모래 속의 타조", "body": "불편한 사실 앞에서 일단 눈을 돌리는 사람입니다. 덕분에 당장의 불안에 휘둘리지 않습니다.\n\n다만 보지 않는다고 사라지는 것은 없습니다. 미뤄 둔 사실은 대개 더 큰 모습으로 돌아옵니다.\n\n어느 쪽이든 가장 오래된 자기기만은 같습니다. 사람은 누구나 죽는다는 걸 알지만, 그게 내 이야기라고는 좀처럼 믿지 않습니다. 노르웨이 극작가 입센은 희곡 『들오리』에서 의사의 입을 빌려 이렇게 썼습니다. 평범한 사람에게서 삶의 거짓말을 빼앗으면, 그 순간 행복도 함께 빼앗는 것이다."}, "F": {"title": "눈을 뜬 사람", "body": "불편해도 사실을 똑바로 보려는 사람입니다. 쉽지 않은 선택을 여러 번 했습니다.\n\n그런데 불편한 연구가 하나 있습니다. 버튼과 상관없이 켜지는 불을 얼마나 조종했느냐는 질문에, 거의 조종하지 못했다고 정확히 답한 사람들은 우울감에 빠져 있던 사람들이었습니다. 자기를 속이지 않는 데에도 대가가 있습니다.\n\n어느 쪽이든 가장 오래된 자기기만은 같습니다. 사람은 누구나 죽는다는 걸 알지만, 그게 내 이야기라고는 좀처럼 믿지 않습니다. 노르웨이 극작가 입센은 희곡 『들오리』에서 의사의 입을 빌려 이렇게 썼습니다. 평범한 사람에게서 삶의 거짓말을 빼앗으면, 그 순간 행복도 함께 빼앗는 것이다."}};
const CONFIG={id:'self-deception',title:'속이는 나, 속는 나',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-self-deception.html',version:5,
stages:[{"badge": "믿음", "title": "떨어지는 주식", "desc": "몇 달을 공부하고 고른 주식을 샀다. 그런데 산 날부터 계속 떨어지더니, 지금은 30% 손실이다.\n\n그 회사에 대한 나쁜 기사도 하나둘 나오기 시작했다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "hold1", "text": "\"회사는 좋은데 시장이 이상한 거야.\" 기다린다.", "meaning": "좋은 회사가 시장 분위기 때문에 저평가되는 일은 실제로 있다. 버티는 게 정답일 때도 있다.\n\n문제는 근거를 다루는 방식이다. 오를 때는 내 판단이 맞았다는 근거 하나로 충분했는데, 떨어질 때는 나쁜 기사가 아무리 쌓여도 시장 탓으로 돌린다. 결론에 따라 증거의 기준이 바뀌고 있다.", "principle": {"name": "동기화된 추론", "desc": "심리학자 토머스 길로비치는 사람이 믿고 싶은 결론 앞에서는 '이걸 믿어도 될까?'를 묻고, 믿기 싫은 결론 앞에서는 '이걸 꼭 믿어야 하나?'를 묻는다고 했다. 앞의 질문에는 근거 하나면 충분하고, 뒤의 질문에는 근거가 아무리 쌓여도 부족하다. 결론이 먼저 정해지고 추론이 그 뒤를 따르는 것을 동기화된 추론이라고 한다.", "icon": ""}}, {"id": "buy1", "text": "더 사서 평균 단가를 낮춘다.", "meaning": "가격이 내려갔을 때 더 사는 건 흔한 전략이고, 반등하면 손실을 빨리 만회할 수 있다.\n\n다만 이 결정이 새 정보 때문인지, 이미 넣은 돈을 지키고 싶어서인지는 따져 봐야 한다. 처음 판단이 틀렸다고 인정하는 대신 더 크게 걸면, 물러서기는 그만큼 더 어려워진다.", "principle": {"name": "몰입 상승", "desc": "이미 많은 걸 걸어 둔 결정일수록 결과가 나빠도 더 깊이 빠져드는 경향을 몰입 상승이라고 한다. 처음 결정이 틀렸다고 인정하면 그동안 들인 것이 모두 헛것이 되기 때문이다. 페스팅거가 지켜본 종말론 신도들이 예언이 빗나간 뒤 믿음을 오히려 키운 것도 같은 원리다.", "icon": ""}}, {"id": "recheck1", "text": "처음 이 주식을 산 이유가 아직 유효한지 다시 따져 본다.", "meaning": "가장 정직한 방법이다. 이 주식을 오늘 처음 봤다면 이 가격에 사겠는지를 묻는 것이다.\n\n다만 쉽지 않다. 그 이유가 이미 틀렸다는 결론이 나오면 손실을 확정하고, 내 판단이 틀렸다는 것도 인정해야 한다. 그래서 대부분은 이 질문 앞에서 머뭇거린다.", "principle": {"name": "매몰 비용", "desc": "이미 써서 되돌릴 수 없는 비용을 매몰 비용이라고 한다. 경제학은 앞으로의 결정에 매몰 비용을 반영하지 말라고 가르친다. 하지만 사람은 이미 쓴 돈과 시간이 아까워서 쉽게 놓지 못한다. 다시 따져 본다는 건 그 아까움을 잠시 내려놓는다는 뜻이다.", "icon": ""}}, {"id": "app1", "text": "증권 앱을 지우고 당분간 안 본다.", "meaning": "매일 계좌를 들여다보면 판단보다 감정이 앞서기 쉽다. 잠시 거리를 두는 건 마음을 지키는 방법이 될 수 있다.\n\n하지만 보지 않는다고 손실이 사라지지는 않는다. 정보를 피하는 동안 판단을 내릴 기회도 같이 지나간다.", "principle": {"name": "타조 효과", "desc": "나쁜 소식이 예상될 때 정보를 아예 보지 않으려는 경향을 타조 효과라고 한다. 시장이 떨어질 때 투자자들이 자기 계좌에 접속하는 횟수가 줄어든다는 연구가 있다. 머리를 모래에 묻는다고 위험이 사라지지는 않는다.", "icon": ""}}]}, {"badge": "비교", "title": "먼저 승진한 동기", "desc": "같이 입사한 동기가 먼저 승진했다. 이번엔 나도 될 줄 알았다.\n\n단체 대화방에 축하 메시지가 이어진다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "grape2", "text": "\"저렇게까지 윗사람 비위 맞추며 살고 싶진 않아.\"", "meaning": "이렇게 생각하면 마음이 한결 편해진다. 승진을 못 한 내가 오히려 지킬 걸 지킨 사람이 된다.\n\n다만 그 기준이 승진 발표 전에도 있었는지 돌아볼 필요가 있다. 승진하고 싶던 마음은 그대로인데 평가만 뒤집혔다면, 다음 기회를 잡을 이유도 같이 사라진다.", "principle": {"name": "신 포도", "desc": "이솝 우화의 여우는 포도를 따지 못하자, 저 포도는 어차피 시었을 거라고 말한다. 니체는 이와 닮은 마음을 르상티망이라고 불렀다. 현실에서 이길 수 없는 상대를, 머릿속에서 좋고 나쁨의 기준을 뒤집어 이기는 상상 속의 복수다. 마음은 편해지지만, 다시 뛰어오를 이유도 잃는다.", "icon": ""}}, {"id": "luck2", "text": "\"운이 좋았지. 마침 맡은 프로젝트가 잘 풀렸으니까.\"", "meaning": "실제로 운이 작용했을 수도 있다. 승진에는 실력 말고도 시기와 운이 섞인다.\n\n문제는 내 일에도 같은 잣대를 쓰느냐다. 내가 잘되면 실력이고 남이 잘되면 운이라고 보는 한, 그 동기에게서 배울 것은 아무것도 남지 않는다.", "principle": {"name": "자기 위주 편향", "desc": "사람은 자기의 성공은 실력 덕으로, 실패는 상황 탓으로 돌리는 경향이 있다. 이것을 자기 위주 편향이라고 한다. 남을 볼 때는 거꾸로, 남의 성공을 운으로 보기 쉽다. 자존감은 지켜지지만 무엇을 고쳐야 하는지는 보이지 않게 된다.", "icon": ""}}, {"id": "ask2", "text": "축하하고, 무엇을 다르게 했는지 직접 물어본다.", "meaning": "가장 많이 배울 수 있는 선택이다. 동기가 어떻게 일했는지 들으면, 내가 놓친 게 무엇인지 구체적으로 보인다.\n\n대신 자존심이 상한다. 비교를 피하지 않고 정면으로 마주하는 일이라, 듣는 내내 마음이 편하지는 않다.", "principle": {"name": "상향 비교", "desc": "인지부조화를 처음 말한 페스팅거는 사회 비교 이론도 만들었다. 사람은 남과 비교하며 자기를 평가한다는 것이다. 나보다 나은 사람과 견주는 상향 비교는 열등감을 부르기도 하지만, 무엇을 해야 하는지 알려 주는 가장 좋은 자료가 되기도 한다.", "icon": ""}}, {"id": "mute2", "text": "축하 이모티콘 하나만 남기고 대화방 알림을 끈다.", "meaning": "지금 내 마음을 지키는 현실적인 방법이다. 굳이 상처받을 소식을 계속 들을 이유는 없다.\n\n다만 불편한 정보를 피하는 습관은 쉽게 굳는다. 보고 싶은 것만 보면 마음은 편하지만, 내 위치를 정확히 알기는 어려워진다.", "principle": {"name": "선택적 노출", "desc": "사람은 자기 생각과 맞는 정보는 찾아보고, 불편한 정보는 피하는 경향이 있다. 이것을 선택적 노출이라고 한다. 페스팅거는 이런 회피를 인지부조화를 줄이는 대표적인 방법 가운데 하나로 꼽았다.", "icon": ""}}]}, {"badge": "호감", "title": "싫은 사람의 부탁", "desc": "같은 팀에 영 마음에 안 드는 사람이 있다. 그 사람이 오늘, 급한 자료 하나만 같이 봐 줄 수 있느냐고 부탁했다.\n\n퇴근까지 30분 남았다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "help3", "text": "그냥 도와준다.", "meaning": "도와주고 나면 이상하게 그 사람이 덜 싫어진다. 다음에 마주쳤을 때 먼저 인사가 나오기도 한다.\n\n그런데 그 사람은 달라진 게 없다. 달라진 건 내 행동이다. 싫은 사람을 도운 나를 설명하려면, 그 사람이 생각만큼 싫지 않다고 믿는 게 가장 쉽다.", "principle": {"name": "벤저민 프랭클린 효과", "desc": "벤저민 프랭클린은 자기를 싫어하던 의원에게 귀한 책을 빌려 달라고 부탁했다. 책을 빌려준 그 의원은 그 뒤로 프랭클린에게 먼저 말을 걸었고, 평생 친구로 지냈다. 사람은 누군가를 도운 뒤, 그 사람을 좋아해서 도왔다고 스스로를 설명하게 된다.", "icon": ""}}, {"id": "deal3", "text": "도와주되, 다음에 꼭 갚으라고 못 박는다.", "meaning": "거래로 만들면 깔끔하다. 손해 볼 것도 없고, 그 사람에 대한 생각을 바꿀 필요도 없다.\n\n대신 관계도 그대로다. 대가가 분명하면 왜 도왔는지 따로 설명할 필요가 없으니, 그 사람에 대한 마음도 움직이지 않는다.", "principle": {"name": "불충분한 정당화", "desc": "페스팅거는 학생들에게 지루한 일을 시킨 뒤, 다음 사람에게 재미있었다고 말해 달라고 부탁했다. 그 대가로 1달러를 받은 학생들이 20달러를 받은 학생들보다 그 일이 더 재미있었다고 답했다. 20달러는 거짓말할 이유가 됐지만, 1달러로는 설명이 안 됐기 때문이다. 이유가 부족할 때 사람은 자기 생각을 바꾼다.", "icon": ""}}, {"id": "no3", "text": "선약이 있다고 하고 거절한다.", "meaning": "내 시간을 지키는 건 정당한 일이다. 싫은 사람의 부탁까지 다 들어줄 의무는 없다.\n\n다만 거절하고 나면 그 사람이 왜 싫은지가 더 잘 보이기 시작한다. 거절한 나를 설명하려면, 그 사람이 역시 별로라는 근거가 필요하기 때문이다.", "principle": {"name": "확증 편향", "desc": "한번 생긴 생각을 뒷받침하는 정보는 잘 보이고, 반대되는 정보는 잘 안 보이는 경향을 확증 편향이라고 한다. 그 사람이 싫다는 생각이 굳을수록, 그 생각에 맞는 장면만 기억에 남는다.", "icon": ""}}]}, {"badge": "변명", "title": "세게 한 말", "desc": "회의에서 후배의 실수를 짚다가 말이 세게 나갔다. 후배 얼굴이 굳었다.\n\n회의가 끝나고 동료가 조용히 말한다. \"아까 좀 심했어.\"", "highlight": "뭐라고 답하겠는가?", "choices": [{"id": "bad4", "text": "\"내가 원래 돌려서 말을 못 하잖아.\"", "meaning": "솔직한 성격은 장점이 될 수 있다. 돌려 말하다가 핵심이 흐려지는 것보다 나을 때도 많다.\n\n문제는 그 성격을 방패로 쓸 때다. '원래 그런 사람'이라고 말하는 순간, 그때 다르게 말할 수도 있었다는 사실이 지워진다.", "principle": {"name": "나쁜 믿음", "desc": "사르트르는 파리의 한 카페 종업원이 손님 앞에서 몸을 조금 지나치게 숙이고, 조금 지나치게 빠르게 움직이는 걸 보고 그가 종업원인 척하고 있다고 봤다. 정해진 역할 뒤에 숨으면 스스로 선택해야 하는 부담이 줄어든다. 사르트르는 이렇게 어렴풋이 알면서도 눈을 돌리는 자기기만을 나쁜 믿음이라고 불렀다.", "icon": ""}}, {"id": "sens4", "text": "\"그 친구가 좀 예민한 편이야.\"", "meaning": "사람마다 받아들이는 정도가 다른 건 사실이다. 같은 말도 누군가에게는 더 아프게 들린다.\n\n다만 남의 반응은 성격 탓으로, 내 말은 상황 탓으로 돌리고 있다면 한쪽으로 기운 판단이다. 내가 같은 말을 들었다면, 나도 예민하다는 소리를 들었을까.", "principle": {"name": "기본적 귀인 오류", "desc": "남의 행동을 볼 때 그 사람의 성격 탓으로 돌리고, 그 사람이 처한 상황은 가볍게 보는 경향을 기본적 귀인 오류라고 한다. 반대로 내 행동은 상황 탓으로 설명하기 쉽다.", "icon": ""}}, {"id": "reason4", "text": "\"그 실수가 반복되면 안 되니까 그랬지.\"", "meaning": "그럴듯한 이유다. 실제로 그 실수는 짚어야 했다.\n\n그런데 그 이유는 동료가 물은 다음에 떠올랐다. 말이 세게 나간 그 순간에도 정말 그 이유 때문이었는지는 알 수 없다. 사람은 행동의 진짜 이유를 몰라도, 이유를 대는 데는 막힘이 없다.", "principle": {"name": "해석기", "desc": "신경과학자 마이클 가자니가는 좌뇌와 우뇌를 잇는 신경을 끊은 환자들을 연구했다. 환자는 우뇌만 본 장면 때문에 한 행동을 두고도, 좌뇌가 그럴듯한 이유를 곧바로 지어내 설명했다. 가자니가는 좌뇌에 이야기를 지어내는 해석기가 있다고 봤다. 수술을 받지 않은 우리에게도 같은 해석기가 있다.", "icon": ""}}, {"id": "sorry4", "text": "\"그러네. 이따 따로 사과할게.\"", "meaning": "가장 어려운 선택이다. 내가 틀렸다는 걸 인정하면 잠깐은 체면이 깎인다.\n\n대신 불편한 마음을 핑계로 덮지 않고 행동으로 정리하게 된다. 후배와의 관계도 회복될 가능성이 크다.", "principle": {"name": "인지부조화", "desc": "레온 페스팅거는 믿음과 현실이 부딪힐 때 생기는 불편함을 인지부조화라고 불렀다. 나는 괜찮은 선배라는 믿음과 심한 말을 한 현실이 부딪히면, 대부분은 현실 쪽을 다르게 해석한다. 하지만 행동을 바꾸는 것도 부조화를 줄이는 방법이다. 사과는 그 드문 쪽을 고르는 일이다.", "icon": ""}}]}, {"badge": "죽음", "title": "장례식장에서 돌아오는 길", "desc": "아는 사람의 장례식에 다녀왔다. 나보다 겨우 몇 살 많았다.\n\n돌아오는 지하철에서 문득 생각한다. 나도 언젠가 죽는다. 그런데 그 생각이 영 실감 나지 않는다.", "highlight": "집에 와서 무엇을 하겠는가?", "choices": [{"id": "phone5", "text": "\"다들 언젠가 죽는 거지.\" 하고 휴대폰을 연다.", "meaning": "틀린 말은 하나도 없다. 그 생각을 붙잡고 있어 봐야 당장 할 수 있는 것도 별로 없어 보인다.\n\n다만 '다들 죽는다'와 '내가 죽는다'는 같은 무게로 와닿지 않는다. 앞의 문장은 사실로 알고, 뒤의 문장은 남의 일처럼 미뤄 둔다.", "principle": {"name": "카이우스의 삼단논법", "desc": "톨스토이의 소설 『이반 일리치의 죽음』의 주인공은 학교에서 '카이우스는 사람이다. 사람은 죽는다. 그러므로 카이우스는 죽는다'는 삼단논법을 배웠다. 평생 옳은 말이라고 생각했지만, 그건 카이우스 이야기였지 자기 이야기는 아니라고 여겼다. 병상에 눕고 나서야 그 문장이 자기 이야기라는 걸 깨닫는다.", "icon": ""}}, {"id": "health5", "text": "건강검진을 예약하고, 다음 주부터 운동하기로 한다.", "meaning": "몸을 챙기는 건 실제로 수명을 늘린다. 장례식이 좋은 계기가 된 셈이다.\n\n다만 이 결심이 죽음을 똑바로 본 결과인지, 죽음에 대한 생각을 빨리 치우는 방법인지는 구분해 볼 만하다. 할 일을 정하고 나면, 죽음은 다시 먼 훗날의 일이 된다.", "principle": {"name": "근접 방어", "desc": "공포 관리 이론을 만든 심리학자들은 죽음이 떠올랐을 때 사람이 가장 먼저 쓰는 방어를 근접 방어라고 불렀다. 그 생각을 의식 밖으로 밀어내거나, 운동이나 건강검진 같은 계획으로 죽음을 아직 먼 일로 만드는 것이다. 몸에는 좋은 일이지만, 생각은 다시 미뤄진다.", "icon": ""}}, {"id": "legacy5", "text": "\"그래도 내가 남긴 건 남겠지.\" 하고 생각한다.", "meaning": "일이든 자식이든 작품이든, 내가 떠난 뒤에도 남을 무언가를 생각하면 죽음이 덜 두렵다. 실제로 많은 사람이 이 생각으로 버틴다.\n\n다만 그것에 기대는 만큼, 그것을 지키려는 마음도 커진다. 내 일이나 내 신념이 부정당할 때 유난히 화가 나는 것도 여기서 나온다.", "principle": {"name": "상징적 불멸", "desc": "문화인류학자 어니스트 베커는 『죽음의 부정』에서, 인간은 죽는다는 사실을 견디려고 자기보다 오래 남을 무언가에 매달린다고 봤다. 이름, 업적, 자식, 신념 같은 것이다. 그의 생각을 이어받은 공포 관리 이론에서는 이것을 상징적 불멸이라고 부른다.", "icon": ""}}, {"id": "call5", "text": "미뤄 둔 연락을 하나 한다.", "meaning": "죽음을 떠올린 덕분에 지금 중요한 게 무엇인지 선명해졌다. 언젠가 하려던 연락을 오늘 했다.\n\n다만 이런 선명함은 오래가지 않는다. 며칠만 지나도 다시 언젠가로 미루게 된다. 그래서 어떤 철학자들은 죽음을 일부러 자주 떠올리라고 했다.", "principle": {"name": "죽음을 향한 존재", "desc": "하이데거는 사람들이 '누구나 언젠가는 죽는다'는 말 뒤에 숨어, 자기 죽음을 남의 일처럼 대한다고 봤다. 자기가 죽는다는 걸 피하지 않고 받아들일 때, 비로소 남들 사는 대로가 아닌 자기 방식으로 삶을 고르게 된다고 했다. 그는 인간을 죽음을 향한 존재라고 불렀다.", "icon": ""}}]}],
calculateResult(choices,principles){
  const c={R:0,G:0,D:0,F:0};choices.forEach(x=>{const k=SIDE[x.choiceId];if(k)c[k]++;});
  const m=Math.max(c.R,c.G,c.D,c.F);const k=['R','G','D','F'].find(t=>c[t]===m);const r=RES[k];
  return {icon:'',label:'당신은',title:r.title,desc:r.body,stats:[{value:c.R+'번',label:'해설'},{value:c.G+'번',label:'깎아내리기'},{value:c.D+'번',label:'외면'},{value:c.F+'번',label:'직면'}]};
},
getShareText(t){return '속이는 나, 속는 나\n\n나는 '+t+'\n\n나는 나를 얼마나 속이고 있을까?\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-self-deception.html';}
