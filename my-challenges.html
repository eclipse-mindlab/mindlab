<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 도전장 - 이클립스의 딜렘</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#140a20">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="eclipse.css">
  <style>
    /* 내 도전장: every challenge I sent, newest first. */
    body { word-break: keep-all; overflow-wrap: anywhere; }
    .container { max-width: var(--col); margin: 0 auto; padding: 0 20px 64px; }

    /* top bar */
    .header { display: flex; align-items: center; gap: 10px; height: 64px; }
    .back-btn {
      width: 36px; height: 36px; margin-left: -8px; border-radius: 50%;
      display: grid; place-items: center; color: var(--mist); flex: none;
    }
    .back-btn:hover { color: var(--moon); }
    .back-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .top-logo { width: 26px; height: 26px; border-radius: 50%; flex: none; }
    .header-title { font-family: var(--serif); font-size: 19px; letter-spacing: -.01em; }
    .top-aside { margin-left: auto; font-size: 13px; color: var(--mist); }
    .top-aside:hover { color: var(--moon); }

    /* toast */
    .toast {
      position: fixed; left: 50%; bottom: 96px; z-index: 100;
      transform: translateX(-50%);
      background: var(--night-3); color: var(--moon);
      padding: 10px 18px; border-radius: 999px; font-size: 14px; white-space: nowrap;
      box-shadow: inset 0 0 0 1px var(--line);
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* loading */
    .loading-spinner {
      width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
      border: 1.5px solid var(--line); border-top-color: var(--mist);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--dim); font-size: 14px; }

    .ecl-btn.wide { width: 100%; height: 52px; font-size: 16px; }
    .ecl-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .ecl-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .kicker { font-size: 13px; color: var(--mist); }
    .serif-title { font-family: var(--serif); font-weight: 400; letter-spacing: -.02em; line-height: 1.3; }
    .page-title { font-size: 30px; margin-top: 20px; }
    .page-desc { margin-top: 4px; color: var(--mist); font-size: 14.5px; }

    .loading-state { text-align: center; padding: 80px 0; }

    .empty-state { padding: 40px 0 0; }
    .empty-icon { display: none; }
    .empty-title { font-family: var(--serif); font-size: 23px; }
    .empty-desc { margin: 6px 0 24px; font-size: 14.5px; color: var(--mist); }
    .create-btn { width: 100%; height: 50px; }

    /* list: rows separated by hairlines */
    .challenge-list { display: flex; flex-direction: column; margin-top: 26px; border-top: 1px solid var(--line); }
    .challenge-list.hidden { display: none; }
    .challenge-card { display: block; padding: 18px 0 16px; border-bottom: 1px solid var(--line); }
    .challenge-card:active { opacity: .75; }
    .challenge-card-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .challenge-card-title { font-family: var(--serif); font-size: 20px; line-height: 1.3; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .challenge-card-date { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
    .challenge-stats { display: flex; gap: 18px; margin-top: 8px; }
    .challenge-stat { display: flex; align-items: baseline; gap: 5px; }
    .challenge-stat-icon { display: none; }
    .challenge-stat-value { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .challenge-stat-label { font-size: 12.5px; color: var(--dim); }
    .challenge-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .challenge-link-btn {
      display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px;
      border-radius: 999px; font-size: 13px; color: var(--moon); box-shadow: inset 0 0 0 1px var(--line);
    }
    .challenge-link-btn:hover { box-shadow: inset 0 0 0 1px var(--mist); }
    .challenge-link-btn:active { transform: scale(.97); }
    .challenge-view-btn { font-size: 13px; color: var(--mist); }
    .challenge-card:hover .challenge-view-btn { color: var(--moon); }

    .bottom-action { margin-top: 28px; }
    .bottom-action.hidden { display: none; }
    .new-challenge-btn { width: 100%; height: 50px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
      <img src="logo.png" alt="" class="top-logo">
      <div class="header-title">나를 읽어봐</div>
    </div>

    <h1 class="page-title serif-title">내가 보낸 도전장</h1>
    <p class="page-desc">눌러서 친구들 점수를 확인해요.</p>

    <!-- 로딩 -->
    <div class="loading-state" id="loadingState">
      <div class="loading-spinner"></div>
      <div class="loading-text">도전장 불러오는 중...</div>
    </div>

    <!-- 빈 상태 -->
    <div class="empty-state hidden" id="emptyState">
      <div class="empty-title">아직 만든 도전장이 없어요</div>
      <div class="empty-desc">질문 5개에 답하면 친구에게 보낼 링크가 생겨요.</div>
      <a href="read-me.html" class="create-btn ecl-btn">도전장 만들기</a>
    </div>

    <!-- 도전장 목록 -->
    <div class="challenge-list hidden" id="challengeList">
      <!-- 동적 생성 -->
    </div>

    <div class="bottom-action hidden" id="bottomAction">
      <a href="read-me.html" class="new-challenge-btn ecl-btn ghost">새 도전장 만들기</a>
    </div>
  </div>

  <div class="toast" id="toast">복사했어요</div>


  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDZ-NATGNFjQ90gswfebIV-0xqhps68qJM",
      authDomain: "eclipse-mindlab.firebaseapp.com",
      projectId: "eclipse-mindlab",
      storageBucket: "eclipse-mindlab.firebasestorage.app",
      messagingSenderId: "181450990304",
      appId: "1:181450990304:web:3043d3857815249f53e685"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    async function init() {
      const myChallenges = JSON.parse(localStorage.getItem('mindlab_my_challenges') || '[]');

      if (myChallenges.length === 0) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
        return;
      }

      // 각 도전장 데이터 로드
      const challengeDataList = [];
      
      for (const challengeId of myChallenges) {
        try {
          const docRef = doc(db, 'challenges', challengeId);
          const docSnap = await getDoc(docRef);
          
          if (docSnap.exists()) {
            challengeDataList.push({
              id: challengeId,
              ...docSnap.data()
            });
          }
        } catch (error) {
          console.error('도전장 로드 실패:', challengeId, error);
        }
      }

      document.getElementById('loadingState').classList.add('hidden');

      if (challengeDataList.length === 0) {
        document.getElementById('emptyState').classList.remove('hidden');
        return;
      }

      // 목록 렌더링
      const listHtml = challengeDataList.map(challenge => {
        const results = challenge.results || [];
        const attemptCount = results.length;
        const avgScore = attemptCount > 0 
          ? Math.round(results.reduce((sum, r) => sum + r.score, 0) / attemptCount)
          : 0;
        const perfectCount = results.filter(r => r.score === 100).length;
        
        const createdDate = new Date(challenge.createdAt);
        const dateStr = `${createdDate.getMonth() + 1}/${createdDate.getDate()}`;

        return `
          <a href="read-me-results.html?id=${challenge.id}" class="challenge-card">
            <div class="challenge-card-header">
              <div class="challenge-card-title">
                ${challenge.creatorName || '???'}의 도전장
              </div>
              <div class="challenge-card-date">${dateStr}</div>
            </div>
            <div class="challenge-stats">
              <div class="challenge-stat">
                <span class="challenge-stat-value">${attemptCount}</span>
                <span class="challenge-stat-label">도전</span>
              </div>
              <div class="challenge-stat">
                <span class="challenge-stat-value">${avgScore}%</span>
                <span class="challenge-stat-label">평균</span>
              </div>
              <div class="challenge-stat">
                <span class="challenge-stat-value">${perfectCount}</span>
                <span class="challenge-stat-label">만점</span>
              </div>
            </div>
            <div class="challenge-card-footer">
              <button class="challenge-link-btn" onclick="event.preventDefault(); copyLink('${challenge.id}');">
                링크 복사
              </button>
              <span class="challenge-view-btn">점수 보기 →</span>
            </div>
          </a>
        `;
      }).join('');

      document.getElementById('challengeList').innerHTML = listHtml;
      document.getElementById('challengeList').classList.remove('hidden');
      document.getElementById('bottomAction').classList.remove('hidden');
    }

    // 전역 함수로 노출
    window.copyLink = function(challengeId) {
      const url = `https://eclipse-mindlab.github.io/mindlab/read-me-challenge.html?id=${challengeId}`;
      const text = `날 안다고 생각해?\n맞춰봐 👀\n\n🔮 도전하기\n${url}`;
      
      navigator.clipboard.writeText(text).then(() => {
        showToast('링크를 복사했어요');
      });
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    init();
  </script>
</body>
</html>
