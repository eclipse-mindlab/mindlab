  <script>
const SIDE={"start1": "N", "plan1": "L", "later1": "L", "doubt1": "S", "dunno2": "S", "mean2": "N", "easy2": "L", "alive2": "N", "empty3": "S", "enough3": "", "next3": "N", "why3": "S", "cry4": "S", "comfort4": "L", "learn4": "N", "sit4": "", "yes5": "N", "skip5": "L", "no5": "S", "dunno5": ""};
const RES={"N": {"title": "산을 오르는 사람", "body": "고통을 피하기보다 연료로 쓰는 사람입니다. 시계추가 흔들린다는 걸 알면서도, 그 흔들림까지 삶으로 받아들입니다.\n\n고통까지 긍정하라는 니체의 말은 편한 자리에서 나오지 않았습니다. 평생 두통에 시달렸고, 서른넷에 병 때문에 교수 자리를 내려놓았고, 값싼 하숙방을 옮겨 다니며 책을 썼습니다. 마흔넷에 토리노에서 쓰러진 뒤로는 정신이 돌아오지 않았고, 11년 뒤 쉰다섯에 세상을 떠났습니다."}, "S": {"title": "시계추 위의 사람", "body": "고통과 권태 사이를 오가는 사람입니다. 시계추가 흔들린다는 건 알아차렸지만, 그 반복에서 어떻게 벗어날지는 아직 모릅니다. 솔직히 대부분의 사람이 여기 있습니다.\n\n이 시계추를 누구보다 집요하게 그린 쇼펜하우어는 정작 아버지가 남긴 재산 덕분에 평생 돈 걱정 없이 살았습니다. 1860년 9월의 어느 아침, 일흔둘의 그는 소파에 앉은 채 숨진 모습으로 발견됐습니다."}, "L": {"title": "최후의 인간", "body": "고통은 피하고 권태는 그럭저럭 견디는 사람입니다. 적당히 편하고 크게 다칠 일도 없습니다. 나쁜 삶은 아닙니다. 다만 니체라면 이렇게 물었을 겁니다. \"그게 사는 건가?\"\n\n니체는 최후의 인간을 그리면서 이런 말을 덧붙였습니다. 이들이 가장 오래 산다고."}};
const CONFIG={id:'pendulum',title:'시계추',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-pendulum.html',version:5,
stages:[{"badge": "갈망", "title": "그것만 있으면", "desc": "간절하게 원하는 것이 생겼다. 무엇인지 구체적으로 떠오른다.\n\n그것만 있으면 행복할 것 같다.\n\n밤에 눈을 감으면 그게 떠오르고, 아침에 눈을 뜨면 그것부터 생각난다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "start1", "text": "바로 시작한다.", "meaning": "일단 시작했다. 생각만 할 때보다 훨씬 힘이 났다. 걸음마를 막 뗀 아이가 평지에 만족하지 않고 계단부터 오르려 하듯, 원하는 마음이 사람을 움직인다.\n\n다만 '그것만 있으면 행복할 것 같다'는 말을 뒤집어 보면, 지금은 행복하지 않다는 뜻이기도 하다.", "principle": {"name": "힘에의 의지", "desc": "니체는 『선악의 저편』에서 살아 있는 것은 무엇보다 자기 힘을 쓰려고 한다고 썼다. 살아남는 건 그 결과 가운데 하나일 뿐이라는 것이다. 그래서 니체에게 원하는 마음은 고쳐야 할 결함이 아니었다. 그건 살아 있다는 증거였다.", "icon": ""}}, {"id": "plan1", "text": "단계별로 계획부터 세운다.", "meaning": "노트를 펴고 1단계, 2단계, 3단계를 나눴다. 일정표까지 만들고 나니 뭔가 해낸 기분이 들었다. 문제는 그 기분 때문에 시작이 하루씩 밀렸다는 거다.\n\n계획은 점점 그럴듯해지는데, 실제로 한 건 아직 하나도 없다.", "principle": {"name": "행동을 대신하는 계획", "desc": "계획은 원래 도움이 된다. 심리학자 페터 골비처는 '언제, 어디서, 무엇을 할지'까지 정해 둔 사람이 실제로 해낼 확률이 높다는 걸 여러 실험으로 보여 줬다. 그런데 또 다른 심리학자 가브리엘레 외팅겐은 반대쪽을 봤다. 원하는 결과를 생생하게 상상할수록 사람들이 오히려 덜 움직였다. 머릿속에서 이미 조금 이룬 기분이 들기 때문이다.", "icon": ""}}, {"id": "later1", "text": "원하는 건 맞는데, 내일부터 한다.", "meaning": "내일은 모레가 되고, 모레는 다음 주가 됐다. 그사이 그렇게 간절하던 마음이 슬슬 식었다. 솔직히 그게 편했다.\n\n니체라면 이 편안함을 그냥 넘기지 않았을 것이다. 그가 가장 경멸한 인간이 딱 이렇게 산다. 그들은 눈을 깜빡이며 말한다. \"우리는 행복을 발명했다.\"", "principle": {"name": "최후의 인간", "desc": "『차라투스트라는 이렇게 말했다』에 나오는 인간형이다. 더는 아무것도 간절히 원하지 않고, 적당히 일하고 적당히 즐기며 탈 없이 산다. 차라투스트라는 이들을 가장 경멸할 만한 인간이라고 불렀다.", "icon": ""}}, {"id": "doubt1", "text": "정말 원하는 건지 의심해 본다.", "meaning": "잠깐 멈추고 물었다. 이거 정말 내가 원하는 거 맞나? 종이에 이유를 적어 보니 금방 다섯 개가 나왔다. 그런데 다시 읽어 보니 전부 원하게 된 다음에 갖다 붙인 이유였다.\n\n이렇게 따지는 게 습관이 되면, 나중엔 뭘 원해도 그 마음을 믿지 못하게 된다.", "principle": {"name": "장님과 길잡이", "desc": "쇼펜하우어의 비유다. 원하는 마음은 앞을 못 보지만 힘이 센 사람이고, 이성은 눈은 밝은데 다리를 못 쓰는 사람이다. 이성은 그 어깨에 올라타 길을 알려 준다. 겉으로는 이성이 방향을 정하는 것 같지만, 실제로 걷는 건 아래쪽이다. 우리는 원하고 나서 이유를 찾는다.", "icon": ""}}]}, {"badge": "오르막", "title": "왜 그런 힘든 걸 해?", "desc": "시작했다. 생각보다 어렵다.\n\n원하던 것에 가까워지는 느낌은 없고 힘든 것만 있다. 주변 사람들은 다들 편하게 사는 것 같다.\n\n누군가 묻는다. \"왜 그런 힘든 걸 해?\"", "highlight": "뭐라고 답하겠는가?", "choices": [{"id": "dunno2", "text": "\"…나도 모르겠어.\"", "meaning": "솔직히 모르겠다. 이걸 왜 하는지, 이 고생 끝에 뭐가 있는지. 이유를 파고들어도 결국 '그냥 원해서'로 돌아온다. 그렇다고 그만두지도 못한다.\n\n그거 얻으면 뭐가 좋은데? 그다음엔? 이 질문은 계속하면 끝이 없다.", "principle": {"name": "목표 없는 의지", "desc": "쇼펜하우어는 행동 하나하나에는 목적이 있어도, 원하는 일 전체에는 목적이 없다고 했다. 의지는 어딘가에 도착하려고 원하지 않는다. 그냥 계속 원한다. '왜'를 끝까지 물으면 대답이 끊기는 이유가 여기 있다.", "icon": ""}}, {"id": "mean2", "text": "\"힘들어도 의미가 있으니까.\"", "meaning": "의미가 있다고 믿으니 버틸 만했다. 힘든 날에도 '그래도 이건 의미 있는 일'이라는 생각이 붙잡아 줬다.\n\n다만 그 의미가 진짜였는지는 지금은 모른다. 다 오르고 나서 돌아봐야 안다.", "principle": {"name": "견디게 하는 이유", "desc": "니체가 『우상의 황혼』에 남긴 문장이다. 살아야 할 '왜'를 가진 사람은 거의 어떤 '어떻게'도 견딘다. 같은 고통도 이유가 붙으면 견딜 만해진다는 얘기다. 훗날 빅터 프랭클이 수용소 경험을 쓰면서 이 문장을 여러 번 인용했다.", "icon": ""}}, {"id": "easy2", "text": "\"더 쉬운 방법이 있나 찾아보는 중이야.\"", "meaning": "더 빠른 길을 찾았고, 실제로 꽤 편해졌다. 영리한 선택이었다.\n\n그런데 막상 정상에 서니 기분이 생각보다 밋밋했다. 걸어 올라온 사람과 케이블카를 탄 사람은 같은 풍경을 보고도 같은 걸 느끼지 못한다.", "principle": {"name": "오르막의 기쁨", "desc": "니체에게 기쁨은 뭔가를 손에 넣는 순간보다 막고 있던 걸 넘어서는 순간에 왔다. 심리학에도 비슷한 실험이 있다. 사람들은 자기가 직접 조립한 이케아 가구를 똑같은 완제품보다 더 비싸게 쳐줬다. 이른바 이케아 효과다. 들인 수고만큼 결과가 값져 보인다.", "icon": ""}}, {"id": "alive2", "text": "\"힘든데, 이상하게 살아 있는 느낌이 들어.\"", "meaning": "여전히 힘들다. 그런데 어제는 못 하던 걸 오늘은 한다. 이 느낌을 뭐라고 불러야 할지 모르겠다.\n\n니체는 이 느낌을 행복이라고 불렀다. 힘든 일이 끝나서 찾아오는 안도감과는 다른 종류의 행복이다.", "principle": {"name": "힘이 커지는 느낌", "desc": "니체는 『안티크리스트』에서 행복을 이렇게 정의했다. 힘이 커지고 있다는 느낌, 저항을 이겨 냈다는 느낌. 쇼펜하우어는 행복을 고통이 잠깐 멈춘 상태로 봤으니, 두 사람의 행복은 정반대 자리에 있는 셈이다.", "icon": ""}}]}, {"badge": "정상", "title": "이게 전부인가", "desc": "해냈다. 원하던 것을 얻었다.\n\n첫 주는 기뻤다. 둘째 주도 기뻤다. 그리고 한 달이 지났다.\n\n이상하게 기쁨이 줄어든다. 이가 아픈 날에는 하루 종일 그 이만 생각나지만, 이가 안 아프다고 행복해하는 사람은 없다.", "highlight": "어떤 생각이 드는가?", "choices": [{"id": "empty3", "text": "\"이게 전부인가?\"", "meaning": "그것만 있으면 행복할 줄 알았다. 이제 가졌다. 그런데 행복하지 않다.\n\n얻기 전에는 그게 전부였는데, 막상 가지고 나니 원래 있던 것처럼 당연해졌다.", "principle": {"name": "잃고 나서야 아는 것", "desc": "쇼펜하우어는 건강, 젊음, 자유 같은 것은 가지고 있을 때는 모르고 잃고 나서야 그 가치를 안다고 했다. 아프지 않은 상태는 잘 느껴지지 않는다. 그래서 그는 행복을 고통이 잠깐 멈춘 상태라고 봤다.", "icon": ""}}, {"id": "enough3", "text": "\"이걸로 충분해. 감사하며 누리자.\"", "meaning": "이걸로 충분하다고 생각하기로 했다. 쉬운 일은 아니지만, 실제로 마음이 꽤 편해졌다.\n\n다만 한 달 뒤에도 같은 말을 할 수 있을지는 잘 모르겠다. 익숙해지면 고마운 마음도 같이 옅어지기 쉽다.", "principle": {"name": "서서히 오는 권태", "desc": "쇼펜하우어에 따르면 욕구가 채워진 자리에는 권태가 들어온다. 권태는 고통처럼 아프지 않아서 오는 줄도 모르는 사이에 하루를 채운다. 그래도 방법이 없는 건 아니다. 가진 것을 일부러 고마워하는 습관이 무언가에 익숙해지는 속도를 늦춘다는 연구들이 있다.", "icon": ""}}, {"id": "next3", "text": "\"멈추면 안 돼. 다음 목표를 세우자.\"", "meaning": "허무해지기 전에 바로 다음 목표를 잡았다. 원하고, 얻고, 지루해지고, 또 원한다.\n\n그런데 스스로도 헷갈린다. 더 높은 산이 보여서 오르는 건지, 멈추면 허무해질까 봐 오르는 건지.", "principle": {"name": "멈추지 못하는 사람", "desc": "니체는 『즐거운 학문』에서 손에 시계를 들고 생각하고, 주식 시세를 보며 점심을 먹는 사람들을 꼬집었다. 이들은 아무것도 하지 않느니 차라리 뭐라도 하려 든다. 니체가 말한 오르막은 이렇게 쉬지 않고 바쁜 것과는 다른 이야기였다.", "icon": ""}}, {"id": "why3", "text": "\"왜 기쁨이 줄어들지?\"", "meaning": "원하던 걸 얻었는데 왜 기쁨이 줄어드는지 모르겠다. 나만 그런 건 아니다.\n\n복권 당첨자들을 조사한 유명한 연구가 있다. 당첨되고 1년 안팎이 지난 사람들은 당첨되지 않은 사람들보다 딱히 더 행복하지 않았다. 사람은 좋은 일에도 금방 익숙해진다.", "principle": {"name": "고통과 권태의 시계추", "desc": "쇼펜하우어의 가장 유명한 비유다. 원하는 걸 못 가지면 괴롭고, 가지면 금방 지루해진다. 그리고 지루함을 못 견뎌서 다시 뭔가를 원한다. 그는 삶이 고통과 권태 사이를 시계추처럼 오간다고 봤고, 이걸 삶에 원래 박혀 있는 구조라고 생각했다.", "icon": ""}}]}, {"badge": "타인", "title": "밤에 걸려 온 전화", "desc": "나와 같은 목표를 준비하던 친구가 있다. 그 친구가 오래 준비한 일이 크게 무너졌다.\n\n밤늦게 전화가 왔다. 친구가 울고 있다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "cry4", "text": "같이 운다. 그 마음을 안다.", "meaning": "수화기 너머로 같이 울었다. 친구는 적어도 혼자는 아니라고 느꼈을 거다.\n\n그런데 이렇게 볼 수도 있다. 우는 사람이 하나에서 둘이 됐다. 세상의 고통은 줄어든 걸까, 늘어난 걸까.", "principle": {"name": "연민의 윤리", "desc": "쇼펜하우어는 남의 고통을 내 고통처럼 느끼는 마음, 연민을 모든 도덕의 뿌리로 봤다. 니체는 바로 이 지점을 공격했다. 연민은 고통을 줄이지 못하고 옮겨서 퍼뜨린다는 것이다. 니체는 『도덕의 계보』 서문에서 연민의 가치를 두고 스승 쇼펜하우어와 갈라섰다고 직접 밝혔다.", "icon": ""}, "quote": "한 달 뒤, 그 친구가 다시 도전해서 크게 해냈다. 이번엔 진심으로 기뻐할 수 있을까? 니체는 『인간적인, 너무나 인간적인』에 이렇게 썼다. 친구를 만드는 건 함께 괴로워하는 마음이 아니라 함께 기뻐하는 마음이다. 해 보면 안다. 같이 우는 것보다 같이 기뻐하는 게 훨씬 어렵다."}, {"id": "comfort4", "text": "\"괜찮아, 다음엔 될 거야.\" 빨리 달래 준다.", "meaning": "\"괜찮아, 다음엔 될 거야.\" 친구는 금방 진정했고, 통화도 생각보다 빨리 끝났다.\n\n끊고 나서야 생각났다. 이번 일이 친구한테 어떤 의미였는지는 한마디도 묻지 않았다. 그 '괜찮아'가 누구를 위한 말이었는지 잘 모르겠다.", "principle": {"name": "서두르는 위로", "desc": "니체는 『즐거운 학문』에서 동정하는 사람들을 이렇게 비판했다. 남의 고통을 보면 서둘러 치워 주려고만 하지, 그 고통이 그 사람 인생에서 어떤 자리에 있는지는 모른다. 니체는 어떤 고통은 그 사람이 자기 길을 가는 데 필요할 수도 있다고 봤다.", "icon": ""}, "quote": "한 달 뒤, 그 친구가 다시 도전해서 크게 해냈다. 이번엔 진심으로 기뻐할 수 있을까? 니체는 『인간적인, 너무나 인간적인』에 이렇게 썼다. 친구를 만드는 건 함께 괴로워하는 마음이 아니라 함께 기뻐하는 마음이다. 해 보면 안다. 같이 우는 것보다 같이 기뻐하는 게 훨씬 어렵다."}, {"id": "learn4", "text": "\"이번에 뭘 배웠어?\" 하고 묻는다.", "meaning": "물어볼 만한 질문이었다. 다만 타이밍이 나빴다. 피 흘리는 사람한테 다음엔 칼 조심하라고 한 셈이다. 친구는 한동안 아무 말도 하지 않았다.\n\n배움은 보통 고통이 지나간 다음에 온다. 한창 아플 때는 뭘 배울 여유가 없다.", "principle": {"name": "때 이른 질문", "desc": "니체는 큰 고통이 사람을 더 낫게 만드는지는 모르겠지만, 더 깊게 만드는 건 확실하다고 했다. 다만 이건 고통을 지나온 사람이 뒤돌아보며 할 수 있는 말이다. 지금 아픈 사람에게 의미부터 묻는 건 그 사람이 지나야 할 시간을 건너뛰라는 말과 같다.", "icon": ""}, "quote": "한 달 뒤, 그 친구가 다시 도전해서 크게 해냈다. 이번엔 진심으로 기뻐할 수 있을까? 니체는 『인간적인, 너무나 인간적인』에 이렇게 썼다. 친구를 만드는 건 함께 괴로워하는 마음이 아니라 함께 기뻐하는 마음이다. 해 보면 안다. 같이 우는 것보다 같이 기뻐하는 게 훨씬 어렵다."}, {"id": "sit4", "text": "바로 찾아가서, 아무 말 없이 옆에 있는다.", "meaning": "전화를 끊고 바로 찾아갔다. 아무 말 없이 옆에 앉아 있었다. 울음이 그치고 한참 조용했는데, 이상하게 그 침묵이 불편하지 않았다.\n\n위로의 말은 하나도 안 했다. 그래도 그날 밤이 덜 외로웠다는 말을 나중에 들었다.", "principle": {"name": "딱딱한 침대", "desc": "『차라투스트라는 이렇게 말했다』에 이런 말이 있다. 고통받는 친구가 있다면 그의 고통이 쉴 곳이 되어 주라. 다만 딱딱한 침대, 야전 침대가 되어 주라. 곁은 내주되, 푹신하게 감싸서 그 고통을 대신 없애 주려 하지는 말라는 뜻이다.", "icon": ""}, "quote": "한 달 뒤, 그 친구가 다시 도전해서 크게 해냈다. 이번엔 진심으로 기뻐할 수 있을까? 니체는 『인간적인, 너무나 인간적인』에 이렇게 썼다. 친구를 만드는 건 함께 괴로워하는 마음이 아니라 함께 기뻐하는 마음이다. 해 보면 안다. 같이 우는 것보다 같이 기뻐하는 게 훨씬 어렵다."}]}, {"badge": "악마", "title": "셀 수 없이 다시", "desc": "어느 낮이나 밤, 가장 외로운 순간에 악마가 슬그머니 다가와 속삭인다.\n\n\"네가 지금 사는 이 삶을, 너는 다시 한 번, 그리고 셀 수 없이 다시 살아야 한다. 모든 고통과 모든 기쁨, 모든 한숨이 똑같은 순서로 돌아올 것이다.\"", "highlight": "이 삶을 다시 살겠는가?", "choices": [{"id": "yes5", "text": "그렇다. 이대로.", "meaning": "고통도, 허무했던 날도 전부 다시 살겠다고 답했다.\n\n니체는 서른일곱 살이던 1882년 새해를 맞으며 이런 다짐을 적었다. \"나는 사물 속의 필연적인 것을 아름답게 보는 법을 더 배우고 싶다. 운명을 사랑하라. 이것이 앞으로 나의 사랑이 되기를.\"", "principle": {"name": "운명을 사랑하기", "desc": "니체는 『이 사람을 보라』에서 이것을 인간의 위대함을 나타내는 자신의 공식이라고 했다. 앞으로도, 뒤로도, 영원히 아무것도 달라지기를 바라지 않는 것. 필연적인 일을 견디거나 감추는 데서 그치지 않고 사랑하는 것. 라틴어로 아모르 파티다.", "icon": ""}}, {"id": "skip5", "text": "다시 살겠다. 고통만 빼고.", "meaning": "고통만 쏙 빼고 싶다. 그런데 막상 빼려고 보면 잘 안 빠진다. 오래 기다린 끝에 온 기쁨에서 기다림을 빼면, 그 기쁨도 같이 사라진다.\n\n힘든 시기를 지나며 배운 것들도 같이 사라진다.", "principle": {"name": "엮인 순간들", "desc": "『차라투스트라는 이렇게 말했다』 4부의 한 대목이다. 기쁨 하나에 '그렇다'고 말해 본 적이 있다면, 너는 모든 고통에도 '그렇다'고 말한 것이다. 모든 것은 사슬처럼 엮여 있기 때문이다. 니체는 좋은 것만 골라 사는 삶은 없다고 봤다.", "icon": ""}}, {"id": "no5", "text": "다시 살지 않는다.", "meaning": "한 번이면 충분하다. 다시 산다는 건 같은 고통을 같은 순서로 다시 겪는다는 뜻이다.\n\n이렇게 답하는 사람이 제일 많다. 쇼펜하우어도 이쪽이었다.", "principle": {"name": "태어나지 않는 편", "desc": "쇼펜하우어는 무덤을 하나씩 두드리며 죽은 사람들에게 다시 살아나고 싶으냐고 물으면, 다들 고개를 저을 거라고 했다. 그는 삶을 차라리 없었던 편이 나았을 무언가라고까지 썼다.", "icon": ""}}, {"id": "dunno5", "text": "모르겠다. 대답할 수 없다.", "meaning": "솔직히 모르겠다. 이 질문에 바로 '그렇다'고 할 수 있는 사람은 많지 않다.\n\n그래도 이 질문을 한 번 받아 본 사람은 전과 조금 다르게 산다. 오늘 하는 일이 셀 수 없이 반복된다면, 그래도 이걸 하겠느냐고 스스로 묻게 되기 때문이다.", "principle": {"name": "가장 무거운 무게", "desc": "이 악마 이야기는 『즐거운 학문』 341번에 나온다. 니체는 이 생각을 '가장 무거운 무게'라고 불렀다. 무엇을 하든 '이것을 다시, 셀 수 없이 다시 원하는가?'라는 질문이 행동 위에 얹히기 때문이다.", "icon": ""}}]}],
calculateResult(choices,principles){
  const c={N:0,S:0,L:0};choices.forEach(x=>{const k=SIDE[x.choiceId];if(k)c[k]++;});
  const k=(c.N>c.S&&c.N>=c.L)?'N':(c.L>c.S&&c.L>c.N)?'L':'S';const r=RES[k];
  return {icon:'',label:'당신은',title:r.title,desc:r.body,stats:[{value:c.N+'번',label:'오르는 쪽'},{value:c.S+'번',label:'흔들리는 쪽'},{value:c.L+'번',label:'편한 쪽'}]};
},
getShareText(t){return '시계추\n\n나는 '+t+'\n\n원하고, 얻고, 지루해지고, 다시 원한다.\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-pendulum.html';}
};
