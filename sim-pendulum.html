  <script>
const SIDE={"start1": "N", "plan1": "L", "later1": "L", "doubt1": "S", "dunno2": "S", "mean2": "N", "easy2": "L", "alive2": "N", "empty3": "S", "enough3": "", "next3": "N", "why3": "S", "cry4": "S", "comfort4": "L", "learn4": "N", "sit4": "", "yes5": "N", "skip5": "L", "no5": "S", "dunno5": ""};
const RES={"N": {"title": "산을 오르는 사람", "body": "고통을 연료로 쓰는 사람입니다. 시계추가 흔들린다는 걸 알지만, 그 흔들림까지 삶으로 받아들입니다.\n\n니체는 이 답을 가장 아픈 자리에서 썼습니다. 평생 지독한 두통에 시달렸고, 서른넷에 병 때문에 교수 자리를 내려놓았고, 값싼 하숙방을 떠돌며 책을 썼습니다. 마흔넷에 토리노에서 쓰러진 뒤로는 정신이 돌아오지 않았고, 11년 뒤 쉰다섯에 세상을 떠났습니다."}, "S": {"title": "시계추 위의 사람", "body": "고통과 권태 사이를 오가는 사람입니다. 시계추가 흔들린다는 건 알아차렸지만, 아직 그 밖으로 나가는 법은 찾지 못했습니다. 대부분의 사람이 여기 있습니다.\n\n이 구조를 누구보다 집요하게 그린 쇼펜하우어는 정작 아버지의 유산으로 평생 돈 걱정 없이 살았습니다. 그는 일흔둘이던 1860년 9월의 어느 아침, 소파에 앉은 채 숨진 채로 발견됐습니다."}, "L": {"title": "최후의 인간", "body": "고통을 피하고 권태를 견디는 사람입니다. 적당히 편하고, 크게 다칠 일도 없습니다. 니체라면 이렇게 물었을 겁니다. \"그것이 삶인가?\"\n\n니체는 최후의 인간을 가장 경멸할 만한 인간이라고 불렀습니다. 그러면서 덧붙였습니다. 그들이 가장 오래 산다고."}};
const CONFIG={id:'pendulum',title:'시계추',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-pendulum.html',version:5,
stages:[{"badge": "갈망", "title": "그것만 있으면", "desc": "간절하게 원하는 것이 생겼다. 무엇인지 구체적으로 떠오른다.\n\n그것만 있으면 행복할 것 같다.\n\n밤에 눈을 감으면 그게 떠오르고, 아침에 눈을 뜨면 그것부터 생각난다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "start1", "text": "바로 시작한다.", "meaning": "바로 시작했다. 힘이 넘친다. 갓 걸음마를 뗀 아이가 평지를 걷는 데 만족하지 않고 계단을 오르려 하듯, 원하는 마음이 몸을 먼저 움직였다.\n\n다만 '그것만 있으면'이라는 말은, 지금은 행복하지 않다는 고백이기도 하다.", "principle": {"name": "힘에의 의지", "desc": "니체는 살아 있는 것이 무엇보다 자기 힘을 쓰고 키우려 한다고 봤다. 그에게 원하는 마음은 따져 보고 고쳐야 할 오류가 아니었다. 살아 있다는 증거였다.", "icon": ""}}, {"id": "plan1", "text": "단계별로 계획부터 세운다.", "meaning": "1단계, 2단계, 3단계까지 깔끔하게 정리했다. 그런데 계획을 세우는 동안 처음의 열기가 조금씩 빠져나갔다. 계획이 완벽해질수록 시작은 멀어졌다.\n\n이 계획이 행동을 준비하는지, 행동을 대신하고 있는지 점점 구분하기 어려워진다.", "principle": {"name": "행동을 대신하는 계획", "desc": "계획 자체는 실행을 돕는다. '언제, 어디서, 무엇을'까지 정한 계획은 실제로 해낼 확률을 높인다는 연구가 많다. 문제는 계획을 다듬는 일이 시작을 대신할 때다. 원하는 결과를 생생하게 상상할수록 오히려 노력이 줄어든다는 연구도 있다.", "icon": ""}}, {"id": "later1", "text": "원하는 건 맞는데, 내일부터 한다.", "meaning": "내일이 모레가 되고, 모레가 다음 주가 됐다. 그사이 욕망이 식었다. 욕망이 식으니 편했다. 적당히 일하고 적당히 즐기며 탈 없이 지낸다.\n\n니체가 경멸한 '최후의 인간'이 이렇게 산다. 그들은 눈을 깜빡이며 말한다. \"우리는 행복을 발명했다.\"", "principle": {"name": "최후의 인간", "desc": "니체는 더는 아무것도 간절히 원하지 않고, 적당히 일하고 적당히 즐기며 탈 없이 사는 사람들을 최후의 인간이라고 불렀다. 그들은 모든 것을 작게 만들고, 가장 오래 산다.", "icon": ""}}, {"id": "doubt1", "text": "정말 원하는 건지 의심해 본다.", "meaning": "멈추고 물었다. \"이거 정말 내가 원하는 건가?\" 좋은 질문이다. 이유를 적어 보니 금방 몇 개가 나왔다. 그런데 하나같이 원하게 된 다음에 찾은 이유였다.\n\n의심이 습관이 되면 결국 아무것도 원하지 않게 될 수도 있다.", "principle": {"name": "장님과 길잡이", "desc": "쇼펜하우어는 원하는 마음을 앞을 못 보는 힘센 사람에, 이성을 그 어깨에 올라탄 앞 못 걷는 사람에 빗댔다. 위에 탄 사람이 길을 알려 주지만, 실제로 움직이는 건 아래의 힘이다. 원하는 마음이 먼저 생기고, 이성은 그 뒤에 이유를 붙인다.", "icon": ""}}]}, {"badge": "오르막", "title": "왜 그런 힘든 걸 해?", "desc": "시작했다. 생각보다 어렵다.\n\n원하던 것에 가까워지는 느낌은 없고 힘든 것만 있다. 주변 사람들은 다들 편하게 사는 것 같다.\n\n누군가 묻는다. \"왜 그런 힘든 걸 해?\"", "highlight": "뭐라고 답하겠는가?", "choices": [{"id": "dunno2", "text": "\"…나도 모르겠어.\"", "meaning": "정말 모르겠다. 왜 하고 있는지, 이 고생이 어디로 가는지. 이유를 찾아봐도 '그냥 원해서'라는 답밖에 없다. 그렇다고 그만두지도 못한다.\n\n이 질문은 파고들수록 다음 질문이 나온다. 그걸 얻으면 뭐가 좋은데? 그다음엔?", "principle": {"name": "목표 없는 의지", "desc": "쇼펜하우어는 하나하나의 행동에는 목적이 있지만, 원하는 일 전체에는 목적이 없다고 했다. 의지는 끝없이 애쓸 뿐 도착할 곳이 없다. 그래서 '왜'를 계속 물으면 결국 대답이 끊긴다.", "icon": ""}}, {"id": "mean2", "text": "\"힘들어도 의미가 있으니까.\"", "meaning": "의미가 있다고 믿으니 버틸 만했다. 왜 하는지 아는 사람은 어떻게든 견딘다.\n\n다만 그 의미가 진짜였는지는 다 오른 뒤에 돌아봐야 알 수 있다.", "principle": {"name": "견디게 하는 이유", "desc": "니체는 『우상의 황혼』에 이렇게 썼다. 살아야 할 '왜'를 가진 사람은 거의 어떤 '어떻게'도 견딘다. 고통을 견디게 하는 건 고통의 크기보다 그 고통에 붙은 이유다.", "icon": ""}}, {"id": "easy2", "text": "\"더 쉬운 방법이 있나 찾아보는 중이야.\"", "meaning": "같은 결과를 더 적은 고생으로 얻는 방법을 찾았다. 합리적인 선택이다.\n\n그런데 정상에 선 사람이 기쁜 건 거기까지 걸어 올라왔기 때문이다. 케이블카로 올라온 사람은 같은 풍경을 보고도 같은 기쁨을 느끼지 못한다.", "principle": {"name": "오르막의 기쁨", "desc": "니체에게 기쁨은 가로막던 것을 넘어서는 데서 나왔다. 심리학의 이케아 효과도 비슷한 걸 보여 준다. 사람들은 직접 조립한 가구를 같은 완제품보다 더 높게 평가한다. 들인 수고가 결과의 값을 올린다.", "icon": ""}}, {"id": "alive2", "text": "\"힘든데, 이상하게 살아 있는 느낌이 들어.\"", "meaning": "여전히 힘들다. 그래도 어제보다 할 수 있는 게 늘었다. 이 느낌이 뭔지는 잘 모르겠다.\n\n니체는 이 느낌을 행복이라고 불렀다. 고통을 지나가는 중에 드는 느낌이다.", "principle": {"name": "힘이 커지는 느낌", "desc": "니체는 『안티크리스트』에서 행복을 이렇게 정의했다. 힘이 커지고 있다는 느낌, 저항을 이겨 냈다는 느낌. 쇼펜하우어에게 행복은 고통이 멈춘 상태였고, 니체에게는 고통을 넘어서는 순간이었다.", "icon": ""}}]}, {"badge": "정상", "title": "이게 전부인가", "desc": "해냈다. 원하던 것을 얻었다.\n\n첫 주는 기뻤다. 둘째 주도 기뻤다. 그리고 한 달이 지났다.\n\n이상하게 기쁨이 줄어든다. 이가 아픈 날에는 하루 종일 그 이만 생각나지만, 이가 안 아프다고 행복해하는 사람은 없다.", "highlight": "어떤 생각이 드는가?", "choices": [{"id": "empty3", "text": "\"이게 전부인가?\"", "meaning": "이게 전부다. 그것만 있으면 행복할 줄 알았다. 이제 가졌는데 행복하지 않다.\n\n얻기 전에는 전부였던 것이, 얻고 나니 공기처럼 당연해졌다.", "principle": {"name": "잃고 나서야 아는 것", "desc": "쇼펜하우어는 건강도, 젊음도, 자유도 가진 동안에는 그 가치를 모르다가 잃고 나서야 안다고 했다. 고통이 없는 상태는 있을 때 느껴지지 않는다. 그래서 그는 행복을 고통이 잠시 멈춘 상태라고 봤다.", "icon": ""}}, {"id": "enough3", "text": "\"이걸로 충분해. 감사하며 누리자.\"", "meaning": "충분하다고 느낀다. 이렇게 말할 수 있는 사람은 드물다.\n\n다만 한 달 뒤에도 같은 말을 할 수 있을지는 모르겠다. 권태는 서서히 온다.", "principle": {"name": "서서히 오는 권태", "desc": "쇼펜하우어는 욕구가 채워진 자리에 권태가 들어온다고 했다. 권태는 고통처럼 날카롭지 않아서 오는 줄도 모르게 하루를 채운다. 다만 심리학 연구는 다른 가능성도 보여 준다. 가진 것을 의식적으로 고마워하는 습관은 익숙해지는 속도를 늦춘다.", "icon": ""}}, {"id": "next3", "text": "\"멈추면 안 돼. 다음 목표를 세우자.\"", "meaning": "허무해지기 전에 다음 목표를 세우고 바로 시작했다. 원하고, 얻고, 지루해지고, 다시 원한다.\n\n더 높은 산이 보여서 오르는 건지, 멈추면 허무해질까 봐 오르는 건지는 아직 모르겠다.", "principle": {"name": "멈추지 못하는 사람", "desc": "니체는 『즐거운 학문』에서 시계를 손에 들고 생각하듯 숨 가쁘게 사는 사람들을 비판했다. 그들은 아무것도 하지 않느니 무엇이든 하려 한다. 니체에게 오르막은 쉬지 않고 움직이는 것과 같은 말이 아니었다.", "icon": ""}}, {"id": "why3", "text": "\"왜 기쁨이 줄어들지?\"", "meaning": "원하던 것을 얻었는데 왜 행복하지 않은지 모르겠다. 이상한 일이 아니다. 거의 모든 사람이 같은 자리에서 같은 질문을 한다.\n\n복권에 당첨된 사람도 시간이 지나면 행복감이 원래 수준 가까이로 돌아간다는 연구가 있다. 사람은 좋은 일에도 빠르게 익숙해진다.", "principle": {"name": "고통과 권태의 시계추", "desc": "쇼펜하우어는 삶이 시계추처럼 고통과 권태 사이를 오간다고 했다. 원하는 걸 못 가지면 괴롭고, 가지면 금방 지루해진다. 지루함을 못 견뎌 다시 무언가를 원한다. 그는 이것을 삶에 처음부터 박혀 있는 구조로 봤다.", "icon": ""}}]}, {"badge": "타인", "title": "밤에 걸려 온 전화", "desc": "같은 길을 걷던 사람이 있다. 오래 준비하던 일이 크게 무너졌다.\n\n밤에 전화가 왔다. 울고 있다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "cry4", "text": "같이 운다. 그 마음을 안다.", "meaning": "같이 울었다. 상대는 혼자가 아니라는 걸 느꼈다.\n\n그런데 우는 사람이 둘이 되면, 세상의 고통은 줄어든 걸까 늘어난 걸까.", "principle": {"name": "연민의 윤리", "desc": "쇼펜하우어는 남의 고통을 자기 고통처럼 느끼는 연민을 모든 도덕의 바탕으로 삼았다. 니체는 반대로 봤다. 연민은 고통을 줄이지 못하고, 고통을 옮겨서 늘린다고 했다.", "icon": ""}, "quote": "한 달 뒤, 그 사람이 다시 도전해서 크게 해냈다. 진심으로 기뻐할 수 있을까? 니체는 함께 아파하는 것이 아니라 함께 기뻐하는 것이 친구를 만든다고 썼다. 남의 불행에 같이 우는 것보다 남의 성공에 진심으로 기뻐하는 쪽이 훨씬 어렵기 때문이다."}, {"id": "comfort4", "text": "\"괜찮아, 다음엔 될 거야.\" 빨리 달래 준다.", "meaning": "서둘러 달랬고, 상대는 금방 진정했다. 하지만 이 실패가 그 사람에게 어떤 의미인지, 이 고통을 지나 어디로 가야 하는지는 묻지 않았다.\n\n그 '괜찮아'는 상대를 위한 말이었을까, 이 불편한 통화를 끝내기 위한 말이었을까.", "principle": {"name": "서두르는 위로", "desc": "니체는 『즐거운 학문』에서 동정하는 사람들이 남의 고통을 서둘러 치워 버리려 할 뿐, 그 고통이 그 사람에게 어떤 의미인지는 모른다고 비판했다. 그는 그 고통이 그 사람의 길에 필요한 것일 수도 있다고 봤다.", "icon": ""}, "quote": "한 달 뒤, 그 사람이 다시 도전해서 크게 해냈다. 진심으로 기뻐할 수 있을까? 니체는 함께 아파하는 것이 아니라 함께 기뻐하는 것이 친구를 만든다고 썼다. 남의 불행에 같이 우는 것보다 남의 성공에 진심으로 기뻐하는 쪽이 훨씬 어렵기 때문이다."}, {"id": "learn4", "text": "\"이번에 뭘 배웠어?\" 하고 묻는다.", "meaning": "맞는 질문이었지만 때가 아니었다. 피 흘리는 사람에게 다음엔 칼을 조심하라고 말한 셈이다. 상대는 대답하지 않았다.\n\n배움은 대개 고통이 지나간 뒤에 온다. 고통 한가운데서는 배울 여유가 없다.", "principle": {"name": "때 이른 질문", "desc": "니체는 큰 고통이 사람을 깊게 만든다고 했다. 그런데 그건 고통을 지나온 사람이 돌아보며 하는 말이다. 지금 아픈 사람에게 고통의 의미를 묻는 건 그 사람의 시간을 건너뛰는 일이다.", "icon": ""}, "quote": "한 달 뒤, 그 사람이 다시 도전해서 크게 해냈다. 진심으로 기뻐할 수 있을까? 니체는 함께 아파하는 것이 아니라 함께 기뻐하는 것이 친구를 만든다고 썼다. 남의 불행에 같이 우는 것보다 남의 성공에 진심으로 기뻐하는 쪽이 훨씬 어렵기 때문이다."}, {"id": "sit4", "text": "바로 찾아가서, 아무 말 없이 옆에 있는다.", "meaning": "그 집 앞으로 찾아갔다. 아무 말 하지 않고 옆에 앉아 있었다. 울음이 그치고 침묵이 왔다. 시간이 지나자 그 침묵이 괜찮아졌다.\n\n연민도 조언도 아니었다. 옆에 있는 것만으로 위로가 됐다.", "principle": {"name": "딱딱한 침대", "desc": "니체는 『차라투스트라는 이렇게 말했다』에서, 고통받는 친구가 있다면 그의 고통이 쉴 곳이 되어 주되 딱딱한 침대, 야전 침대가 되어 주라고 했다. 곁을 내주되, 그 고통을 대신 짊어지거나 덮어 주지는 않는 것이다.", "icon": ""}, "quote": "한 달 뒤, 그 사람이 다시 도전해서 크게 해냈다. 진심으로 기뻐할 수 있을까? 니체는 함께 아파하는 것이 아니라 함께 기뻐하는 것이 친구를 만든다고 썼다. 남의 불행에 같이 우는 것보다 남의 성공에 진심으로 기뻐하는 쪽이 훨씬 어렵기 때문이다."}]}, {"badge": "악마", "title": "셀 수 없이 다시", "desc": "어느 낮이나 밤, 가장 외로운 순간에 악마가 슬그머니 다가와 속삭인다.\n\n\"네가 지금 사는 이 삶을, 너는 다시 한 번, 그리고 셀 수 없이 다시 살아야 한다. 모든 고통과 모든 기쁨, 모든 한숨이 똑같은 순서로 돌아올 것이다.\"", "highlight": "이 삶을 다시 살겠는가?", "choices": [{"id": "yes5", "text": "그렇다. 이대로.", "meaning": "고통도, 허무도 전부 다시 살겠다고 답했다.\n\n니체는 서른일곱 살 새해에 이렇게 적었다. \"나는 사물 속의 필연적인 것을 아름답게 보는 법을 더 배우고 싶다. 운명을 사랑하라. 이것이 앞으로 나의 사랑이 되기를.\"", "principle": {"name": "운명을 사랑하기", "desc": "니체는 『이 사람을 보라』에서 이것을 인간의 위대함을 재는 공식이라고 했다. 앞으로도 뒤로도 영원히 아무것도 달라지기를 바라지 않는 것. 필연적인 것을 견디거나 감추지 않고 사랑하는 것. 그는 이것을 아모르 파티, 운명애라고 불렀다.", "icon": ""}}, {"id": "skip5", "text": "다시 살겠다. 고통만 빼고.", "meaning": "고통은 빼고 싶다. 하지만 기쁨과 고통은 사슬처럼 엮여 있다. 오래 기다린 끝에 온 기쁨에서 기다림을 빼면 그 기쁨도 사라진다.\n\n고통을 빼면 그 고통이 만든 나도 빠진다.", "principle": {"name": "엮인 순간들", "desc": "니체는 기쁜 순간 하나에 '그렇다'고 말한 사람은 그 순간과 엮인 모든 고통에도 '그렇다'고 말한 셈이라고 했다. 모든 것이 사슬처럼 엮여 있어서 좋은 것만 골라낼 수 없다.", "icon": ""}}, {"id": "no5", "text": "다시 살지 않는다.", "meaning": "한 번이면 충분하다. 다시 산다면 같은 고통을 같은 순서로 다시 겪어야 한다.\n\n대부분의 사람이 이렇게 답한다.", "principle": {"name": "태어나지 않는 편", "desc": "쇼펜하우어는 무덤을 두드려 죽은 사람들에게 다시 살아나고 싶으냐고 물으면 모두 고개를 저을 거라고 했다. 그는 인간이 차라리 태어나지 않는 편이 나았다고 봤다.", "icon": ""}}, {"id": "dunno5", "text": "모르겠다. 대답할 수 없다.", "meaning": "가장 솔직한 답이다. 이 질문에 망설임 없이 '그렇다'고 답할 수 있는 사람은 드물다.\n\n중요한 건 답을 내는 것보다 이 질문을 안고 사는 것이다. 한 번이라도 이 질문을 받아 본 사람은 같은 시계추 위에서도 흔들리는 방식이 달라진다.", "principle": {"name": "가장 무거운 무게", "desc": "니체는 이 악마의 질문을 『즐거운 학문』에 썼고, 이것을 가장 무거운 무게라고 불렀다. 모든 선택 앞에서 '이것을 셀 수 없이 다시 원하는가?'를 묻게 만들기 때문이다.", "icon": ""}}]}],
calculateResult(choices,principles){

},
