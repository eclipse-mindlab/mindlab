const SIDE={"start1": "N", "plan1": "L", "later1": "L", "doubt1": "S", "dunno2": "S", "mean2": "N", "easy2": "L", "alive2": "N", "empty3": "S", "enough3": "", "next3": "", "why3": "S", "cry4": "S", "comfort4": "L", "learn4": "N", "sit4": "", "yes5": "N", "skip5": "L", "no5": "S", "dunno5": "", "call6": "N", "msg6": "L", "later6": "S", "art7": "S", "scroll7": "L", "cut7": "S", "tragedy7": "N"};
const RES={"N": {"title": "산을 오르는 사람", "body": "고통을 피하기보다 연료로 쓰는 사람입니다. 시계추가 흔들린다는 걸 알면서도, 그 흔들림까지 삶으로 받아들입니다.\n\n고통까지 긍정하라는 니체의 말은 편한 자리에서 나오지 않았습니다. 평생 두통에 시달렸고, 서른넷에 병 때문에 교수 자리를 내려놓았고, 값싼 하숙방을 옮겨 다니며 책을 썼습니다. 마흔넷에 토리노에서 쓰러진 뒤로는 정신이 돌아오지 않았고, 11년 뒤 쉰다섯에 세상을 떠났습니다.\n\n두 사람은 한 번도 만난 적이 없습니다. 니체는 쇼펜하우어가 죽고 5년 뒤, 스물한 살 때 라이프치히의 헌책방에서 그의 책을 집어 들었습니다. 그리고 2주 동안 새벽 2시에 자고 6시에 일어나며 그 책을 읽었습니다. 그 뒤 십 년 넘게 쇼펜하우어를 스승으로 삼았고, 그다음에야 스승의 답을 하나씩 뒤집었습니다."}, "S": {"title": "시계추 위의 사람", "body": "고통과 권태 사이를 오가는 사람입니다. 시계추가 흔들린다는 건 알아차렸지만, 그 반복에서 어떻게 벗어날지는 아직 모릅니다. 솔직히 대부분의 사람이 여기 있습니다.\n\n이 시계추를 누구보다 집요하게 그린 쇼펜하우어는 정작 아버지가 남긴 재산 덕분에 평생 돈 걱정 없이 살았습니다. 1860년 9월의 어느 아침, 일흔둘의 그는 소파에 앉은 채 숨진 모습으로 발견됐습니다.\n\n두 사람은 한 번도 만난 적이 없습니다. 니체는 쇼펜하우어가 죽고 5년 뒤, 스물한 살 때 라이프치히의 헌책방에서 그의 책을 집어 들었습니다. 그리고 2주 동안 새벽 2시에 자고 6시에 일어나며 그 책을 읽었습니다. 그 뒤 십 년 넘게 쇼펜하우어를 스승으로 삼았고, 그다음에야 스승의 답을 하나씩 뒤집었습니다."}, "L": {"title": "최후의 인간", "body": "고통은 피하고 권태는 그럭저럭 견디는 사람입니다. 적당히 편하고 크게 다칠 일도 없습니다. 나쁜 삶은 아닙니다. 다만 니체라면 이렇게 물었을 겁니다. \"그게 사는 건가?\"\n\n니체는 최후의 인간을 그리면서 이런 말을 덧붙였습니다. 이들이 가장 오래 산다고.\n\n두 사람은 한 번도 만난 적이 없습니다. 니체는 쇼펜하우어가 죽고 5년 뒤, 스물한 살 때 라이프치히의 헌책방에서 그의 책을 집어 들었습니다. 그리고 2주 동안 새벽 2시에 자고 6시에 일어나며 그 책을 읽었습니다. 그 뒤 십 년 넘게 쇼펜하우어를 스승으로 삼았고, 그다음에야 스승의 답을 하나씩 뒤집었습니다."}};
const CONFIG={id:'pendulum',title:'욕망의 시계추',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-pendulum.html',version:5,
stages:[{"badge": "갈망", "title": "그것만 있으면", "desc": "지금 가장 갖고 싶은 것 하나를 적어 보자. 합격이든, 연봉이든, 사람이든, 물건이든 상관없다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "start1", "text": "바로 시작한다.", "meaning": "원하는 게 생기면 사람은 움직인다. 바로 시작하는 쪽은 그 힘을 미루지 않고 쓰는 선택이다. 고민하는 동안 식어 버릴 열기를 곧바로 행동으로 바꾼다.\n\n다만 '그것만 있으면 행복할 것 같다'는 생각을 뒤집으면, 지금은 행복하지 않다는 뜻이 된다. 원하는 동안 사람은 무언가 모자란 상태로 산다.", "principle": {"name": "힘에의 의지", "desc": "니체는 『선악의 저편』에서 살아 있는 것은 무엇보다 자기 힘을 쓰려고 한다고 썼다. 살아남는 건 그 결과 가운데 하나일 뿐이라는 것이다. 그래서 니체에게 원하는 마음은 고쳐야 할 결함이 아니었다. 그건 살아 있다는 증거였다.", "icon": ""}}, {"id": "plan1", "text": "단계별로 계획부터 세운다.", "meaning": "계획은 막연한 바람을 실행할 수 있는 단계로 바꿔 준다. 무엇부터 해야 할지 보이면 시작하기가 쉬워진다.\n\n문제는 계획을 세우는 일 자체가 성취감을 준다는 점이다. 계획이 정교해질수록 이미 무언가 한 것 같은 기분이 들고, 그 기분이 실제 시작을 늦출 수 있다.", "principle": {"name": "긍정적 공상", "desc": "계획은 원래 도움이 된다. 심리학자 페터 골비처는 '언제, 어디서, 무엇을 할지'까지 정해 둔 사람이 실제로 해낼 확률이 높다는 걸 여러 실험으로 보여 줬다. 그런데 또 다른 심리학자 가브리엘레 외팅겐은 반대쪽을 봤다. 원하는 결과를 생생하게 상상할수록 사람들이 오히려 덜 움직였다. 머릿속에서 이미 조금 이룬 기분이 들기 때문이다.", "icon": ""}}, {"id": "later1", "text": "원하긴 하는데, 지금은 바쁘니까 나중으로 미룬다.", "meaning": "미루면 당장은 편하다. 원하는 마음이 주던 압박도 시간이 지나면서 줄어든다.\n\n하지만 욕망이 식었다고 문제가 해결된 건 아니다. 원하던 것은 그대로인데 원하는 힘만 약해졌다. 니체는 이렇게 무엇도 간절히 원하지 않게 된 상태를 가장 경계했다.", "principle": {"name": "최후의 인간", "desc": "『차라투스트라는 이렇게 말했다』에 나오는 인간형이다. 더는 아무것도 간절히 원하지 않고, 적당히 일하고 적당히 즐기며 탈 없이 산다. 차라투스트라는 이들을 가장 경멸할 만한 인간이라고 불렀다.", "icon": ""}}, {"id": "doubt1", "text": "정말 원하는 건지 의심해 본다.", "meaning": "정말 원하는 건지 따져 보는 건 충동에 휩쓸리지 않는 좋은 방법이다. 그런데 막상 이유를 찾아보면, 대부분 원하게 된 다음에 떠올린 이유라는 걸 알게 된다. 원하는 마음이 먼저고, 이유는 뒤따라온다.\n\n그래서 의심이 습관이 되면 끝이 없다. 어떤 욕망도 충분한 이유를 갖추지 못하니, 결국 무엇도 확신하지 못하게 된다.", "principle": {"name": "의지의 우위", "desc": "쇼펜하우어의 비유다. 원하는 마음은 앞을 못 보지만 힘이 센 사람이고, 이성은 눈은 밝은데 다리를 못 쓰는 사람이다. 이성은 그 어깨에 올라타 길을 알려 준다. 겉으로는 이성이 방향을 정하는 것 같지만, 실제로 걷는 건 아래쪽이다. 우리는 원하고 나서 이유를 찾는다.", "icon": ""}}], "rest": "그것만 있으면 행복할 것 같다. 자기 전에도 떠오르고, 아침에 눈을 뜨면 그것부터 생각난다."}, {"badge": "오르막", "title": "왜 그런 힘든 걸 해?", "desc": "어쨌든 시작했다. 생각보다 어렵다.\n\n원하던 것에 가까워지는 느낌은 없고 힘들기만 하다. 주변 사람들은 다들 편하게 사는 것 같다.\n\n누군가 묻는다. \"왜 그런 힘든 걸 해?\"", "highlight": "뭐라고 답하겠는가?", "choices": [{"id": "dunno2", "text": "\"…나도 모르겠어.\"", "meaning": "왜 하는지 모르겠다는 대답은 솔직하다. 이유를 계속 파고들면 결국 '그냥 원해서'라는 데서 멈춘다. 그걸 얻으면 뭐가 좋은지, 그다음엔 뭐가 좋은지 묻다 보면 끝이 없다.\n\n그런데도 그만두지 못한다. 사람을 움직이는 게 이유보다 원하는 마음 쪽이라는 걸 보여 주는 대목이다.", "principle": {"name": "맹목적 의지", "desc": "쇼펜하우어는 행동 하나하나에는 목적이 있어도, 원하는 일 전체에는 목적이 없다고 했다. 의지는 어딘가에 도착하려고 원하지 않는다. 그냥 계속 원한다. '왜'를 끝까지 물으면 대답이 끊기는 이유가 여기 있다.", "icon": ""}}, {"id": "mean2", "text": "\"힘들어도 의미가 있으니까.\"", "meaning": "의미를 붙잡으면 같은 고통도 견딜 만해진다. 이 일이 어디로 이어지는지 안다고 믿는 사람은 중간의 힘든 시간을 버틴다.\n\n다만 그 의미는 아직 믿음이다. 실제로 의미가 있었는지는 끝까지 가 본 뒤에야 확인할 수 있다.", "principle": {"name": "살아야 할 이유", "desc": "니체가 『우상의 황혼』에 남긴 문장이다. 살아야 할 '왜'를 가진 사람은 거의 어떤 '어떻게'도 견딘다. 같은 고통도 이유가 붙으면 견딜 만해진다는 얘기다. 훗날 빅터 프랭클이 수용소 경험을 쓰면서 이 문장을 여러 번 인용했다.", "icon": ""}}, {"id": "easy2", "text": "\"더 쉬운 방법이 있나 찾아보는 중이야.\"", "meaning": "더 쉬운 방법을 찾는 건 합리적이다. 같은 결과를 적은 비용으로 얻을 수 있다면 마다할 이유가 없다.\n\n다만 결과가 같다고 경험까지 같지는 않다. 걸어서 오른 사람과 케이블카를 탄 사람이 정상에서 느끼는 기쁨은 다르다. 기쁨의 상당 부분은 무언가를 넘어선 과정에서 나오기 때문이다.", "principle": {"name": "이케아 효과", "desc": "직접 조립한 이케아 가구를 사람들은 똑같은 완제품보다 더 비싸게 쳐준다. 심리학자들이 실험으로 확인한 이 현상을 이케아 효과라고 부른다. 들인 수고만큼 결과가 값져 보인다. 니체도 기쁨은 무언가를 손에 넣는 순간보다 막고 있던 걸 넘어서는 순간에 온다고 봤다.", "icon": ""}}, {"id": "alive2", "text": "\"힘든데, 이상하게 살아 있는 느낌이 들어.\"", "meaning": "힘든데 살아 있는 느낌이 든다는 건, 고통 속에서도 할 수 있는 게 늘고 있다는 신호다. 어제 못 하던 걸 오늘 하게 되는 감각이다.\n\n니체는 이 감각을 행복이라고 불렀다. 다만 이 행복은 대가를 요구한다. 계속 몸과 시간을 써야 하고, 그만큼 다른 것을 포기해야 한다.", "principle": {"name": "힘의 감정", "desc": "니체는 『안티크리스트』에서 행복을 이렇게 정의했다. 힘이 커지고 있다는 느낌, 저항을 이겨 냈다는 느낌. 니체는 이런 힘의 감정을 사람이 원하는 가장 근본적인 것으로 봤다. 쇼펜하우어가 행복을 고통이 잠깐 멈춘 상태로 본 것과 정반대다.", "icon": ""}}]}, {"badge": "정상", "title": "이게 전부인가", "desc": "해냈다. 원하던 것을 얻었다.\n\n첫 주는 기뻤다. 둘째 주도 기뻤다. 그리고 한 달이 지났다.\n\n이상하게 기쁨이 줄어든다. 이가 아픈 날에는 하루 종일 그 이만 생각나지만, 이가 안 아프다고 행복해하는 사람은 없다.", "highlight": "어떤 생각이 드는가?", "choices": [{"id": "empty3", "text": "\"이게 전부인가?\"", "meaning": "원하던 걸 얻었는데 허무하다면, 이상한 일이 아니다. 얻기 전에는 그게 전부처럼 보였지만, 가지고 나면 당연한 것이 된다.\n\n원하는 동안에는 모자람이 고통이었고, 얻고 나면 그 자리를 권태가 채운다. 시계추가 반대편 끝에 도착한 것이다.", "principle": {"name": "행복의 소극성", "desc": "쇼펜하우어는 행복이 소극적이라고 했다. 행복은 그 자체로 느껴지는 무언가가 아니라 고통이 잠깐 멈춘 상태라는 것이다. 그래서 건강, 젊음, 자유 같은 것은 가지고 있을 때는 모르고 잃고 나서야 그 가치를 안다.", "icon": ""}}, {"id": "enough3", "text": "\"이걸로 충분해. 감사하며 누리자.\"", "meaning": "가진 것에 만족하는 태도는 시계추를 멈추는 가장 현실적인 방법처럼 보인다. 실제로 마음이 편해지는 효과도 있다.\n\n다만 만족은 한 번 정하면 끝나는 게 아니다. 시간이 지나면 고마운 마음도 옅어지기 때문에, 계속 다시 붙잡아야 한다.", "principle": {"name": "쾌락 적응", "desc": "사람은 좋은 일에도 금방 익숙해진다. 심리학에서는 이것을 쾌락 적응이라고 부른다. 쇼펜하우어 식으로 말하면 욕구가 채워진 자리에 권태가 들어오는 것이다. 다만 방법이 없지는 않다. 가진 것을 일부러 고마워하는 습관이 익숙해지는 속도를 늦춘다는 연구들이 있다.", "icon": ""}}, {"id": "next3", "text": "\"멈추면 안 돼. 다음 목표를 세우자.\"", "meaning": "다음 목표를 세우면 허무해질 틈이 없다. 계속 원하고 있으니 권태가 들어올 자리가 없다.\n\n문제는 동기다. 더 높은 산이 보여서 오르는 것과 멈추면 허무해질까 봐 오르는 것은 겉으로는 같아 보여도 전혀 다르다. 앞의 것은 성장이고, 뒤의 것은 시계추에서 도망치는 방식이다.", "principle": {"name": "분주한 도피", "desc": "니체는 『즐거운 학문』에서 손에 시계를 들고 생각하고, 주식 시세를 보며 점심을 먹는 사람들을 꼬집었다. 이들은 아무것도 하지 않느니 차라리 뭐라도 하려 든다. 니체가 말한 오르막은 이렇게 쉬지 않고 바쁜 것과는 다른 이야기였다.", "icon": ""}}, {"id": "why3", "text": "\"왜 기쁨이 줄어들지?\"", "meaning": "기쁨이 줄어드는 건 사람의 마음이 원래 그렇게 생겼기 때문이다. 사람은 좋은 일에도 금방 익숙해진다. 복권 당첨자를 조사한 연구에서도, 당첨되고 1년 안팎이 지난 사람들은 당첨되지 않은 사람들보다 딱히 더 행복하지 않았다.\n\n그러니 원하던 걸 얻고도 기쁨이 줄어든다고 해서 잘못 원한 건 아니다. 무엇을 얻든 같은 일이 일어난다.", "principle": {"name": "고통과 권태의 시계추", "desc": "쇼펜하우어의 가장 유명한 비유다. 원하는 걸 못 가지면 괴롭고, 가지면 금방 지루해진다. 그리고 지루함을 못 견뎌서 다시 뭔가를 원한다. 그는 삶이 고통과 권태 사이를 시계추처럼 오간다고 봤고, 이걸 삶에 원래 박혀 있는 구조라고 생각했다.", "icon": ""}}]}, {"badge": "출구", "title": "허무를 견디는 법", "desc": "원하던 걸 얻은 뒤로, 허무가 불쑥불쑥 찾아온다. 하루하루가 비슷하게 흘러간다.\n\n오늘도 퇴근하고 집에 오니 아무것도 하기 싫다.", "highlight": "오늘 밤 무엇을 하겠는가?", "choices": [{"id": "art7", "text": "좋아하는 음악을 처음부터 끝까지 듣는다.", "meaning": "음악에 빠져 있는 동안에는 아무것도 원하지 않는다. 원하는 게 없으니 괴로울 것도 없다. 쉬지 않고 돌아가던 마음이 잠시 멈춘다.\n\n다만 음악이 끝나면 원래대로 돌아온다. 예술은 고통을 멈춰 주지만, 잠깐뿐이다.", "principle": {"name": "미적 관조", "desc": "쇼펜하우어는 아름다운 것에 빠져드는 순간을 미적 관조라고 불렀다. 그 순간에는 원하는 나를 잊고 그저 바라보게 된다. 그는 이것을 그리스 신화에서 영원히 도는 익시온의 불타는 바퀴가 잠시 멈추는 순간에 빗댔다. 여러 예술 가운데 음악을 가장 높이 쳤다.", "icon": ""}}, {"id": "scroll7", "text": "아무 생각 없이 휴대폰을 넘긴다.", "meaning": "아무 생각 없이 시간을 보내는 건 가장 손쉬운 방법이다. 적어도 그동안은 허무를 느낄 틈이 없다.\n\n다만 끝나고 나면 남는 게 없다. 허무를 견뎌 낸 게 아니라 잠깐 잊었을 뿐이라, 다음 날 같은 자리로 돌아온다.", "principle": {"name": "권태", "desc": "쇼펜하우어는 삶이 고통 아니면 권태라고 했다. 원하는 게 채워지면 할 일이 없어지고, 사람은 그 빈 시간을 견디지 못한다. 그는 사람들이 모여 카드놀이를 하는 모습을 보고, 생각할 거리가 바닥난 사람들이 시간을 죽이고 있다고 꼬집었다. 지금은 카드 대신 휴대폰이다.", "icon": ""}}, {"id": "cut7", "text": "욕심을 줄인다. 사고 싶은 것도, 하고 싶은 것도 내려놓는다.", "meaning": "원하는 게 줄면 괴로울 일도 준다. 쇼펜하우어가 내놓은 가장 확실한 출구가 이것이었다.\n\n그런데 욕심을 끊는 데 성공할수록 그 성공이 뿌듯해진다. 참는 것 자체가 새로운 목표가 된다. 원하지 않으려는 마음도 결국 원하는 마음의 한 형태다.", "principle": {"name": "금욕주의적 이상", "desc": "쇼펜하우어는 욕망 자체를 꺼 버리는 금욕을 마지막 출구로 봤다. 니체는 『도덕의 계보』에서 이 금욕주의적 이상을 정면으로 비판했다. 금욕하는 사람도 결국 무언가를 강하게 원하고 있다는 것이다. 인간은 아무것도 원하지 않느니 차라리 무(無)를 원한다.", "icon": ""}}, {"id": "tragedy7", "text": "일부러 슬픈 영화를 찾아본다.", "meaning": "슬픈 이야기를 보고 나면 이상하게 힘이 날 때가 있다. 삶이 얼마나 가혹할 수 있는지 똑바로 보고 나면, 내 허무도 감당할 만한 크기로 보이기 때문이다.\n\n다만 같은 비극을 보고도 반대로 느낄 수 있다. 삶은 원래 이렇게 허무하다는 확인으로 끝날 수도 있다.", "principle": {"name": "디오니소스적 긍정", "desc": "쇼펜하우어는 관객이 비극을 보며 삶이 붙잡을 가치가 없다는 걸 깨닫고 체념한다고 했다. 니체는 정반대로 봤다. 그리스인들은 삶이 얼마나 끔찍한지 알면서도 그 삶을 무대에 올려 축제로 만들었다. 가장 가혹한 삶까지 긍정하는 이 태도를 니체는 디오니소스적이라고 불렀다.", "icon": ""}}]}, {"badge": "타인", "title": "밤에 걸려 온 전화", "desc": "오래 알고 지낸 친구가 있다. 그 친구가 몇 년 동안 준비한 일이 무너졌다.\n\n밤늦게 전화가 왔다. 친구가 울고 있다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "cry4", "text": "같이 운다. 그 마음을 안다.", "meaning": "같이 울어 주면 상대는 혼자가 아니라고 느낀다. 고통을 나누면 덜 외롭다.\n\n하지만 다르게 볼 수도 있다. 고통을 나눈다고 고통의 양이 줄어들지는 않는다. 우는 사람이 한 명에서 두 명이 됐을 뿐이다. 이 지점에서 쇼펜하우어와 니체는 정반대로 갈린다.", "principle": {"name": "연민의 윤리", "desc": "쇼펜하우어는 남의 고통을 내 고통처럼 느끼는 마음, 연민을 모든 도덕의 뿌리로 봤다. 니체는 바로 이 지점을 공격했다. 연민은 고통을 줄이지 못하고 옮겨서 퍼뜨린다는 것이다. 니체는 『도덕의 계보』 서문에서 연민의 가치를 두고 스승 쇼펜하우어와 갈라섰다고 직접 밝혔다.", "icon": ""}}, {"id": "comfort4", "text": "\"괜찮아, 다음엔 될 거야.\" 빨리 달래 준다.", "meaning": "\"괜찮아, 다음엔 될 거야\"는 가장 흔한 위로다. 상대를 빨리 진정시키는 데는 효과가 있다.\n\n문제는 이 말이 상대의 고통을 서둘러 끝내려 한다는 점이다. 이번 실패가 그 사람에게 어떤 의미인지는 묻지 않는다. 그 '괜찮아'가 상대를 위한 말인지, 불편한 상황을 끝내고 싶은 내 마음을 위한 말인지 구분하기 어렵다.", "principle": {"name": "동정 비판", "desc": "니체는 『즐거운 학문』에서 동정하는 사람들을 이렇게 비판했다. 남의 고통을 보면 서둘러 치워 주려고만 하지, 그 고통이 그 사람 인생에서 어떤 자리에 있는지는 모른다. 니체는 어떤 고통은 그 사람이 자기 길을 가는 데 필요할 수도 있다고 봤다.", "icon": ""}}, {"id": "learn4", "text": "\"이번에 뭘 배웠어?\" 하고 묻는다.", "meaning": "실패에서 무엇을 배웠는지 묻는 건 맞는 질문이다. 고통을 의미로 바꿀 수 있는 사람이 결국 더 깊어진다.\n\n다만 타이밍이 문제다. 한창 아픈 사람에게는 배울 여유가 없다. 피 흘리는 사람에게 다음엔 칼을 조심하라고 하는 것과 같다. 같은 질문도 고통이 조금 지나간 뒤라면 힘이 될 수 있다.", "principle": {"name": "고통의 깊이", "desc": "니체는 큰 고통이 사람을 더 낫게 만드는지는 모르겠지만, 더 깊게 만드는 건 확실하다고 했다. 다만 이건 고통을 지나온 사람이 뒤돌아보며 할 수 있는 말이다. 지금 아픈 사람에게 의미부터 묻는 건 그 사람이 지나야 할 시간을 건너뛰라는 말과 같다.", "icon": ""}}, {"id": "sit4", "text": "바로 찾아가서 아무 말 없이 옆에 앉아 있는다.", "meaning": "아무 말 없이 곁에 있는 건, 위로의 말이 오히려 부담이 될 때 쓸 수 있는 방법이다. 고통을 해석하지도, 서둘러 덮지도 않는다.\n\n다만 곁에 있는 것만으로는 다음으로 나아가지 못할 수 있다. 그날 밤을 견디게는 해 주지만, 앞으로 어떻게 할지는 여전히 그 사람의 몫으로 남는다.", "principle": {"name": "딱딱한 침대", "desc": "『차라투스트라는 이렇게 말했다』에 이런 말이 있다. 고통받는 친구가 있다면 그의 고통이 쉴 곳이 되어 주라. 다만 딱딱한 침대, 야전 침대가 되어 주라. 곁은 내주되, 푹신하게 감싸서 그 고통을 대신 없애 주려 하지는 말라는 뜻이다.", "icon": ""}}]}, {"badge": "기쁨", "title": "한 달 뒤", "desc": "그 친구가 다시 도전해서 크게 해냈다. 내가 얻은 것보다 훨씬 큰 일이다.\n\n단체 대화방에 소식이 올라왔다. 다들 축하한다는 말을 남기고 있다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "call6", "text": "바로 전화해서 축하한다.", "meaning": "남의 성공을 진심으로 축하하는 건 생각보다 어렵다. 그 성공이 내가 얻은 것보다 클 때는 더 그렇다. 바로 전화했다는 건 그 불편함을 넘어섰다는 뜻이다.\n\n그래도 축하하고 난 뒤 내 성취가 작아 보이는 마음까지 사라지지는 않는다. 진심으로 기뻐하는 것과 질투를 전혀 느끼지 않는 것은 다른 일이다.", "principle": {"name": "공감적 기쁨", "desc": "니체는 『인간적인, 너무나 인간적인』에 이렇게 썼다. 친구를 만드는 건 함께 괴로워하는 마음이 아니라 함께 기뻐하는 마음이다. 해 보면 안다. 남의 불행에 같이 우는 것보다 남의 성공에 진심으로 기뻐하는 쪽이 훨씬 어렵다.", "icon": ""}}, {"id": "msg6", "text": "단체 대화방에 \"축하해!\"라고 남긴다.", "meaning": "단체 대화방에 축하 한마디를 남기는 건 무난하고 예의 바른 선택이다. 할 도리는 다 했다.\n\n다만 따로 연락하지 않은 이유를 스스로 물어보면 대답이 애매해진다. 무난한 축하는 질투를 드러내지 않으면서 진심을 다하지 않아도 되는 가장 편한 방법이기도 하다.", "principle": {"name": "질투의 본성", "desc": "쇼펜하우어는 질투가 인간에게 자연스러운 감정이면서, 동시에 악덕이자 불행이라고 했다. 남이 잘되면 내 처지가 더 또렷하게 보이기 때문이다. 그래서 사람들은 무난한 축하 한마디로 그 마음을 덮는다.", "icon": ""}}, {"id": "later6", "text": "지금은 축하할 여유가 없다. 나중에 연락한다.", "meaning": "지금은 축하할 여유가 없다는 건 솔직한 마음이다. 당장은 내 일에 집중하는 게 더 중요할 수도 있다.\n\n문제는 미룰수록 연락이 더 어려워진다는 점이다. 그리고 축하하지 못한 마음은 그대로 사라지지 않는다. 쌓이면 상대의 성공에서 흠을 찾고 싶어지는 마음으로 바뀌기 쉽다.", "principle": {"name": "르상티망", "desc": "니체는 이루지 못한 사람이 이룬 사람에게 품는 원한을 르상티망이라고 불렀다. 처음엔 축하를 미루는 작은 망설임처럼 보이지만, 쌓이면 상대를 깎아내려야 마음이 편해진다. 니체는 『도덕의 계보』에서 이 감정을 가장 자세히 파헤쳤다.", "icon": ""}}]}, {"badge": "악마", "title": "셀 수 없이 다시", "desc": "원하고, 얻고, 지루해지고, 또 원했다. 그사이 친구는 무너졌다가 다시 일어섰다. 이렇게 살다 보면 언젠가 이 삶도 끝난다.\n\n그런데 어느 날 밤, 가장 외로운 순간에 악마가 슬그머니 다가와 속삭인다.\n\n\"네가 지금 사는 이 삶을, 너는 다시 한 번, 그리고 셀 수 없이 다시 살아야 한다. 모든 고통과 모든 기쁨, 모든 한숨이 똑같은 순서로 돌아올 것이다.\"", "highlight": "이 삶을 다시 살겠는가?", "choices": [{"id": "yes5", "text": "그렇다. 이대로.", "meaning": "고통까지 포함해서 이 삶을 그대로 다시 살겠다는 대답이다. 니체가 도달하고 싶어 한 자리다.\n\n니체 자신도 이 대답을 쉽게 하지 못했다. 서른일곱 살이던 1882년 새해를 맞으며 그는 다짐처럼 적었다. \"나는 사물 속의 필연적인 것을 아름답게 보는 법을 더 배우고 싶다. 운명을 사랑하라. 이것이 앞으로 나의 사랑이 되기를.\"", "principle": {"name": "아모르 파티", "desc": "니체는 『이 사람을 보라』에서 이것을 인간의 위대함을 나타내는 자신의 공식이라고 했다. 앞으로도, 뒤로도, 영원히 아무것도 달라지기를 바라지 않는 것. 필연적인 일을 견디거나 감추는 데서 그치지 않고 사랑하는 것. 라틴어로 아모르 파티다.", "icon": ""}}, {"id": "skip5", "text": "다시 살겠다. 고통만 빼고.", "meaning": "고통만 빼고 다시 살고 싶은 건 자연스러운 바람이다. 하지만 고통과 기쁨은 따로 떼어 낼 수 없는 경우가 많다. 오래 기다린 끝에 온 기쁨에서 기다림을 빼면, 그 기쁨도 같이 사라진다.\n\n힘든 시기를 지나며 배운 것들도 마찬가지다. 고통을 빼면 그 고통이 만든 것들도 함께 빠진다.", "principle": {"name": "기쁨과 고통의 사슬", "desc": "『차라투스트라는 이렇게 말했다』 4부의 한 대목이다. 기쁨 하나에 '그렇다'고 말해 본 적이 있다면, 너는 모든 고통에도 '그렇다'고 말한 것이다. 모든 것은 사슬처럼 엮여 있기 때문이다. 니체는 좋은 것만 골라 사는 삶은 없다고 봤다.", "icon": ""}}, {"id": "no5", "text": "다시 살지 않는다.", "meaning": "같은 고통을 같은 순서로 다시 겪어야 한다면, 한 번이면 충분하다는 대답은 정직하다. 많은 사람이 이렇게 답한다.\n\n쇼펜하우어라면 이 대답에 동의했을 것이다. 그는 삶을 '비용을 메우지 못하는 사업'에 빗댔다.", "principle": {"name": "염세주의", "desc": "쇼펜하우어는 서양 철학에서 염세주의를 가장 정면으로 밀어붙인 철학자다. 그는 무덤을 하나씩 두드리며 죽은 사람들에게 다시 살아나고 싶으냐고 물으면, 다들 고개를 저을 거라고 했다. 그리고 삶을 차라리 없었던 편이 나았을 무언가라고까지 썼다.", "icon": ""}}, {"id": "dunno5", "text": "모르겠다. 대답할 수 없다.", "meaning": "이 질문에 바로 답하기 어려운 건 자연스럽다. 망설임 없이 '그렇다'고 할 수 있는 사람은 드물다.\n\n그래도 이 질문은 한 번 들으면 쉽게 잊히지 않는다. 지금 하는 일을 셀 수 없이 반복해야 한다면 그래도 하겠는지, 선택할 때마다 묻게 된다. 니체가 이 생각을 던진 이유도 거기 있다.", "principle": {"name": "가장 무거운 무게", "desc": "이 악마 이야기는 『즐거운 학문』 341번에 나온다. 니체는 이 생각을 '가장 무거운 무게'라고 불렀다. 무엇을 하든 '이것을 다시, 셀 수 없이 다시 원하는가?'라는 질문이 행동 위에 얹히기 때문이다.", "icon": ""}}]}],
calculateResult(choices,principles){
  const c={N:0,S:0,L:0};choices.forEach(x=>{const k=SIDE[x.choiceId];if(k)c[k]++;});
  const k=(c.N>c.S&&c.N>=c.L)?'N':(c.L>c.S&&c.L>c.N)?'L':'S';const r=RES[k];
  return {icon:'',label:'당신은',title:r.title,desc:r.body,stats:[{value:c.N+'번',label:'오르는 쪽'},{value:c.S+'번',label:'흔들리는 쪽'},{value:c.L+'번',label:'편한 쪽'}]};
},
getShareText(t){return '욕망의 시계추\n\n나는 '+t+'\n\n원하던 걸 얻으면 행복해질까? 쇼펜하우어 vs 니체\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-pendulum.html';}
};

(function(){

    if(SimTemplate.currentStage===0) document.getElementById('situationTitle').textContent=sub('그것만 있으면',raw);
  }
  const box=document.createElement('div');box.className='want';
  box.innerHTML='<input id="wantInput" maxlength="15" autocomplete="off" placeholder="예: 합격, 연봉, 그 사람, 새 차" aria-label="지금 가장 갖고 싶은 것">';
  const rest=document.createElement('div');rest.className='sim-situation-desc want-rest';
  const desc=document.getElementById('situationDesc');
  desc.after(box);box.after(rest);
  const input=box.querySelector('input');
  input.addEventListener('input',()=>{raw=input.value.trim();apply();});
  const orig=SimTemplate.renderStage.bind(SimTemplate);
  SimTemplate.renderStage=function(i){orig(i);box.hidden=rest.hidden=i!==0;};
  apply();box.hidden=rest.hidden=SimTemplate.currentStage!==0;
})();
document.getElementById('saveImageBtn').addEventListener('click',()=>{const c=document.getElementById('shareCanvas'),x=c.getContext('2d');c.width=800;c.height=420;x.fillStyle='#140a20';x.fillRect(0,0,800,420);x.textAlign='center';x.font='16px sans-serif';x.fillStyle='#b4a5c8';x.fillText('욕망의 시계추',400,130);x.font='bold 52px serif';x.fillStyle='#f6eef4';x.fillText(document.getElementById('resultTitle').textContent,400,210);x.font='18px sans-serif';x.fillStyle='#d847f3';x.fillText(document.getElementById('resultLabel')?document.getElementById('resultLabel').textContent:'',400,270);x.font='14px sans-serif';x.fillStyle='#7c6b93';x.fillText('eclipse-mindlab.github.io/mindlab',400,380);const l=document.createElement('a');l.download='욕망의시계추_결과.png';l.href=c.toDataURL();l.click();});
