<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#140a20">
  <title>궤변 사냥 - 이클립스의 딜렘</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="description" content="회의, 기사, 투자 리포트 속 그럴듯한 주장에서 논리의 구멍을 찾는 게임. 매일 다섯 판.">
  <meta property="og:title" content="궤변 사냥 - 이클립스의 딜렘">
  <meta property="og:description" content="그럴듯한 주장에서 논리의 구멍을 찾는 게임. 매일 다섯 판.">
  <meta property="og:image" content="https://eclipse-mindlab.github.io/mindlab/og-image.png?v=3">
  <meta property="og:url" content="https://eclipse-mindlab.github.io/mindlab/hunt.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="eclipse.css">
  <style>
    body { min-height: 100vh; min-height: 100dvh; }
    .wrap { max-width: var(--col); margin: 0 auto; padding: 0 20px; }
    .num { font-variant-numeric: tabular-nums; }
    .screen[hidden] { display: none !important; }

    .rail { display: flex; align-items: center; justify-content: space-between; height: 52px; }
    .rail a, .rail button { display: inline-flex; align-items: center; gap: 6px; color: var(--mist); font-size: 14px; height: 40px; }
    .rail svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    /* lobby */
    .lobby-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 16px; margin: 20px 0 10px; }
    .lobby-head h1 { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1.1; letter-spacing: -.02em; }
    .lobby-head .ecl-mark { width: 54px; margin: 0 8px 10px 0; }
    .lede { color: var(--mist); font-size: 15px; }
    .rank { margin: 22px 0 6px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .rank b { font-family: var(--serif); font-weight: 400; font-size: 19px; }
    .rank span { font-size: 13px; color: var(--dim); }
    .modes { margin-top: 18px; border-top: 1px solid var(--line); }
    .mode { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .mode h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; display: flex; align-items: center; gap: 8px; }
    .mode p { font-size: 13px; color: var(--mist); margin-top: 2px; }
    .mode .side { font-size: 13px; color: var(--mist); text-align: right; }
    .mode .ecl-btn { height: 38px; padding: 0 18px; font-size: 14px; }
    .fresh[hidden] { display: none; }
    .fresh { width: 7px; height: 7px; border-radius: 50%; background: var(--corona); display: inline-block; }
    .chev { width: 18px; height: 18px; stroke: var(--dim); fill: none; stroke-width: 1.8; }
    .how { margin: 34px 0 40px; }
    .how h3 { font-size: 13px; color: var(--dim); font-weight: 500; margin-bottom: 10px; }
    .how ol { counter-reset: how; }
    .how li { list-style: none; counter-increment: how; display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 14px; color: var(--mist); padding: 6px 0; }
    .how li::before { content: counter(how); font-family: var(--serif); color: var(--moon); }

    /* game */
    #game { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--night); z-index: 10; }
    .hud { flex: none; max-width: var(--col); width: 100%; margin: 0 auto; padding: 10px 20px 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
    .hud .l { font-size: 13px; color: var(--mist); display: flex; align-items: center; gap: 10px; }
    .hud .l button { color: var(--dim); display: inline-flex; padding: 4px; margin-left: -4px; }
    .hud .l svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    #hudLeft { display: inline-flex; align-items: center; gap: 10px; }
    .hud .c { font-size: 12px; color: var(--mist); min-height: 16px; }
    .hud .r { text-align: right; font-family: var(--serif); font-size: 24px; line-height: 1; }
    .lives { display: inline-flex; gap: 6px; }
    .life { width: 13px; height: 13px; border-radius: 50%; background: var(--moon); }
    .life.out { background: transparent; box-shadow: inset 0 0 0 1px var(--dim); }
    .timer { flex: none; height: 2px; background: var(--line); max-width: var(--col); width: calc(100% - 40px); margin: 0 auto; }
    .timer i { display: block; height: 100%; background: var(--moon); transform-origin: left; }
    .timer.low i { background: var(--mist); }
    .stage { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .stage-in { max-width: var(--col); margin: 0 auto; padding: 18px 20px 40px; }

    .src { font-size: 12px; color: var(--dim); margin-bottom: 10px; }
    .claim { border-left: 1px solid var(--line); padding-left: 16px; display: flex; flex-direction: column; gap: 10px; }
    .ln { display: block; width: 100%; text-align: left; font-size: 16px; line-height: 1.65; color: var(--moon); word-break: keep-all; overflow-wrap: anywhere; border-radius: 6px; transition: background .15s, opacity .2s, box-shadow .2s; }
    .where .ln { padding: 6px 10px; margin: -6px -10px; cursor: pointer; }
    .where .ln:hover { background: var(--night-2); }
    .where .ln:active { transform: scale(.99); }
    .ln.wrong { opacity: .4; text-decoration: line-through; text-decoration-color: var(--dim); }
    .ln.hit { box-shadow: inset 0 0 0 1.5px var(--corona); }
    .ln.reveal { box-shadow: inset 0 0 0 1px var(--mist); }
    .q { font-family: var(--serif); font-size: 21px; line-height: 1.45; margin: 26px 0 14px; text-wrap: balance; }
    .hint { font-size: 13px; color: var(--mist); }
    .opts { border-top: 1px solid var(--line); }
    .opt { display: grid; grid-template-columns: 22px 1fr; gap: 8px; width: 100%; text-align: left; padding: 15px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.55; color: var(--moon); }
    .opt i { font-style: normal; font-family: var(--serif); color: var(--dim); }
    .opt:active { background: var(--night-2); }
    .opt.right { color: var(--moon); }
    .opt.right i { color: var(--corona); }
    .opt.wrongpick { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--dim); }
    .opt.dim { color: var(--dim); }
    .opts.locked .opt { pointer-events: none; }

    .toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); opacity: 0; background: var(--night-3); color: var(--moon); font-size: 13px; padding: 8px 14px; border-radius: 999px; transition: opacity .2s, transform .2s; z-index: 40; pointer-events: none; white-space: nowrap; }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }

    /* sheet */
    .scrim { position: fixed; inset: 0; background: rgba(8,4,14,.55); z-index: 30; opacity: 0; transition: opacity .2s; }
    .scrim.on { opacity: 1; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); max-height: 90vh; max-height: 90dvh; overflow-y: auto; }
    .sheet.on { transform: none; }
    .sheet-in { max-width: var(--col); margin: 0 auto; background: var(--night-2); border-radius: 20px 20px 0 0; padding: 24px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
    .back-link { display: block; margin: 8px auto 0; font-size: 13px; color: var(--dim); padding: 8px; }
    .verdict h3 { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.2; }
    .verdict .pts { font-size: 13px; color: var(--mist); margin-top: 4px; }
    .verdict .note { font-size: 15px; line-height: 1.7; margin-top: 16px; }
    .trap { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .trap .kind { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .trap .kind b { font-family: var(--serif); font-weight: 400; font-size: 23px; }
    .trap .kind em { font-style: normal; font-size: 12px; color: var(--mist); }
    .trap .def { font-size: 14px; color: var(--mist); margin-top: 4px; }
    .trap h5 { font-size: 12px; color: var(--dim); font-weight: 500; margin: 16px 0 4px; }
    .trap .story { font-size: 14.5px; line-height: 1.75; color: var(--mist); }
    .trap .rule { font-family: var(--serif); font-size: 18px; line-height: 1.55; color: var(--moon); border-left: 1px solid var(--moon); padding-left: 12px; }
    .verdict .ecl-btn { width: 100%; margin-top: 24px; }

    /* end */
    .end { text-align: center; padding: 30px 0 48px; }
    .end .lbl { font-size: 13px; color: var(--mist); }
    .end .big { font-family: var(--serif); font-size: 68px; line-height: 1.05; margin: 8px 0 14px; }
    .dots { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 9px; max-width: 320px; }
    .dot { width: 15px; height: 15px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--moon); }
    .dot.full { background: var(--moon); }
    .dot.half { background: linear-gradient(90deg, var(--moon) 50%, transparent 50%); }
    .dot.none { box-shadow: inset 0 0 0 1.5px var(--dim); }
    .stats { display: flex; justify-content: center; gap: 22px; margin: 22px 0 6px; font-size: 13px; color: var(--mist); }
    .stats b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; color: var(--moon); }
    .end .note { font-size: 14px; color: var(--mist); margin-top: 14px; }
    .end .newkinds { margin-top: 18px; font-size: 14px; color: var(--mist); }
    .end .newkinds b { color: var(--moon); font-weight: 500; }
    .end .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
    .end .acts .ecl-btn { width: 100%; }
    .end .acts .plain { color: var(--mist); font-size: 14px; padding: 8px; }
    .review { text-align: left; margin-top: 36px; border-top: 1px solid var(--line); }
    .review h4 { font-size: 13px; color: var(--dim); font-weight: 500; margin: 16px 0 4px; }
    .rv { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .rv .dot { width: 11px; height: 11px; }
    .rv span { color: var(--mist); }
    .rv small { color: var(--dim); font-size: 12px; }

    /* dex */
    .dex-top { margin: 18px 0 8px; }
    .dex-top h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; }
    .dex-top p { color: var(--mist); font-size: 14px; }
    .kinds { margin: 18px 0 48px; border-top: 1px solid var(--line); }
    .kindrow { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .kindrow .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .kindrow b { font-family: var(--serif); font-weight: 400; font-size: 21px; }
    .kindrow .cnt { font-size: 12px; color: var(--mist); flex: none; }
    .kindrow p { font-size: 14px; color: var(--mist); margin-top: 3px; }
    .kindrow .story { font-size: 14px; line-height: 1.7; color: var(--mist); margin-top: 10px; }
    .kindrow .rule { font-family: var(--serif); font-size: 16.5px; line-height: 1.55; border-left: 1px solid var(--moon); padding-left: 12px; margin-top: 10px; }
    .kindrow.locked b, .kindrow.locked .cnt { color: var(--dim); }
  </style>
</head>
<body>

<section class="screen" id="lobby">
  <div class="wrap">
    <div class="rail"><a href="index.html" aria-label="홈으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>홈</a></div>
    <div class="lobby-head">
      <h1>궤변<br>사냥</h1>
      <div class="ecl-mark" aria-hidden="true"><i class="lit"></i><i class="rim"></i><i class="shade"></i></div>
    </div>
    <p class="lede">회의, 기사, 투자 리포트에는 숫자까지 갖춘 그럴듯한 주장이 많아요. 그 안에서 논리가 무너지는 지점을 찾아요.</p>
    <div class="rank"><b id="rankName">견습 사냥꾼</b><span id="rankSub"></span></div>
    <div class="modes">
      <div class="mode" id="dailyRow">
        <div><h2>오늘의 사냥 <i class="fresh" id="freshDot" aria-hidden="true"></i></h2><p id="dailySub">다섯 판 · 하루 한 번 · 모두 같은 문제</p></div>
        <div class="side" id="dailySide"><button class="ecl-btn" id="dailyBtn" type="button">시작</button></div>
      </div>
      <button class="mode" id="endlessBtn" type="button">
        <div><h2>연속 사냥</h2><p id="endlessSub">달 세 개가 다 가려질 때까지</p></div>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="mode" id="dexBtn" type="button">
        <div><h2>함정 도감</h2><p id="dexSub"></p></div>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="how">
      <h3>하는 법</h3>
      <ol>
        <li>주장을 읽고 질문에 답하세요. 왜 틀렸는지 고르거나, 무너지는 문장을 직접 짚어요.</li>
        <li>빨리 맞힐수록, 연속으로 맞힐수록 점수가 커져요.</li>
        <li>판이 끝나면 이 함정에 실제로 걸려든 사례와 기억할 한 줄이 나와요. 맞힌 함정은 도감에 모여요.</li>
      </ol>
    </div>
  </div>
</section>

<section class="screen" id="game" hidden>
  <div class="hud">
    <div class="l"><button id="quitBtn" type="button" aria-label="그만하기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span id="hudLeft"></span></div>
    <div class="c" id="hudCombo"></div>
    <div class="r num" id="hudScore">0</div>
  </div>
  <div class="timer" id="timer"><i id="timerFill"></i></div>
  <div class="stage" id="stage"><div class="stage-in" id="stageIn"></div></div>
</section>

<section class="screen" id="end" hidden>
  <div class="wrap">
    <div class="rail"><button id="endBack" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>궤변 사냥</button></div>
    <div class="end" id="endBody"></div>
  </div>
</section>

<section class="screen" id="dex" hidden>
  <div class="wrap">
    <div class="rail"><button id="dexBack" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>궤변 사냥</button></div>
    <div class="dex-top"><h1>함정 도감</h1><p id="dexCountLine"></p></div>
    <div class="kinds" id="kinds"></div>
  </div>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="hunt-data.js"></script>
<script>
(function () {
  const T = window.TRAPS, R = window.ROUNDS;
  const KEY = 'eclipse_hunt', PROFILE_KEY = 'eclipse_mindlab_profile';
  const URL_ = 'https://eclipse-mindlab.github.io/mindlab/hunt.html';
  const PENALTY = 5000;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => n.toLocaleString('ko-KR');
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  /* 날짜, 난수 */
  function today() { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
  function dayDiff(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
  function dateLabel(s) { const [, m, d] = s.split('-'); return `${+m}월 ${+d}일`; }
  function seedOf(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }
  function rngOf(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(a, rnd) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor((rnd || Math.random)() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  /* 저장 */
  function load() {
    let s = null; try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!s || typeof s !== 'object') s = {};
    s.v = 2; s.caught = s.caught || {}; s.first = s.first || {}; s.total = s.total || 0;
    s.best = s.best || 0; s.bestRound = s.bestRound || 0; s.daily = s.daily || {};
    s.streak = s.streak || 0; s.maxStreak = s.maxStreak || 0;
    return s;
  }
  let S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function grantExp(n) {
    try {
      let p = null; try { p = JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch (e) {}
      if (!p || typeof p !== 'object') p = { version: 5, name: '익명 탐험가', level: 1, exp: 0, completedSims: [], principles: [] };
      p.exp = (p.exp || 0) + n; p.level = p.level || 1;
      while (p.exp >= p.level * 100) { p.exp -= p.level * 100; p.level++; }
      localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
    } catch (e) {}
  }
  const RANKS = [[0, '견습 사냥꾼'], [10, '사냥꾼'], [30, '노련한 사냥꾼'], [70, '궤변 감별사'], [150, '소크라테스의 제자']];
  function rank(n) { let i = 0; while (i + 1 < RANKS.length && n >= RANKS[i + 1][0]) i++; return { name: RANKS[i][1], next: RANKS[i + 1] || null }; }

  /* 판 고르기 */
  function dailyRounds(date) {
    const rnd = rngOf(seedOf('hunt2-' + date));
    return shuffle(R, rnd).slice(0, 5).sort((a, b) => a.lv - b.lv);
  }
  function endlessNext(n) {
    const cap = n < 3 ? 1 : n < 7 ? 2 : 3;
    if (!G.q || !G.q.length) G.q = shuffle(R);
    let i = G.q.findIndex(r => r.lv <= cap && r !== G.lastR);
    if (i < 0) i = 0;
    return G.q.splice(i, 1)[0];
  }

  /* 화면 */
  function show(id) { ['lobby', 'game', 'end', 'dex'].forEach(s => { $('#' + s).hidden = s !== id; }); window.scrollTo(0, 0); }
  const dotCls = c => c === '●' ? 'full' : c === '◐' ? 'half' : 'none';
  const dotsHTML = grid => [...grid].map(c => `<i class="dot ${dotCls(c)}"></i>`).join('');

  function renderLobby() {
    const t = today(), d = S.daily[t], rk = rank(S.total), keys = Object.keys(T);
    $('#rankName').textContent = rk.name;
    $('#rankSub').textContent = S.total ? `지금까지 ${S.total}번 맞혔어요` + (rk.next ? ` · 다음 칭호까지 ${rk.next[0] - S.total}번` : '') : '';
    const streakOn = S.lastDaily && dayDiff(S.lastDaily, t) <= 1 && S.streak > 1;
    if (d) {
      $('#freshDot').hidden = true;
      $('#dailySub').innerHTML = `<span class="dots" style="gap:6px;vertical-align:middle">${dotsHTML(d.grid)}</span>` + (streakOn ? ` · ${S.streak}일 연속` : '');
      $('#dailySide').innerHTML = `<div class="num" style="font-family:var(--serif);font-size:22px;color:var(--moon)">${fmt(d.score)}</div><div>내일 새 문제</div>`;
      $('#dailyRow').onclick = showDailyDone; $('#dailyRow').style.cursor = 'pointer';
    } else {
      $('#freshDot').hidden = false;
      $('#dailySub').textContent = '다섯 판 · 하루 한 번 · 모두 같은 문제' + (streakOn ? ` · ${S.streak}일 연속 중` : '');
      $('#dailySide').innerHTML = '<button class="ecl-btn" id="dailyBtn" type="button">시작</button>';
      $('#dailyBtn').onclick = e => { e.stopPropagation(); startGame('daily'); };
      $('#dailyRow').onclick = null; $('#dailyRow').style.cursor = '';
    }
    $('#endlessSub').textContent = S.best ? `최고 ${fmt(S.best)}점 · ${S.bestRound}판까지` : '달 세 개가 다 가려질 때까지';
    $('#dexSub').textContent = `${keys.length}가지 중 ${keys.filter(k => S.caught[k]).length}가지를 모았어요`;
    show('lobby');
  }

  function renderDex() {
    const keys = Object.keys(T), got = keys.filter(k => S.caught[k]);
    $('#dexCountLine').textContent = `${keys.length}가지 중 ${got.length}가지. 맞힌 함정은 실제 사례와 기억할 한 줄이 열려요.`;
    $('#kinds').innerHTML = got.concat(keys.filter(k => !S.caught[k])).map(k => {
      const f = T[k], n = S.caught[k] || 0;
      return `<div class="kindrow ${n ? '' : 'locked'}"><div class="h"><b>${esc(f.name)}</b><span class="cnt">${n ? n + '번 맞힘' : '아직 못 만났어요'}</span></div>
        <p>${esc(f.def)}</p>${n ? `<p class="story">${esc(f.story)}</p><p class="rule">${esc(f.rule)}</p>` : ''}</div>`;
    }).join('');
    show('dex');
  }

  /* 게임 */
  let G = null, RS = null, raf = 0, lastTs = 0;

  function startGame(mode) {
    if (mode === 'daily' && S.daily[today()]) return showDailyDone();
    G = { mode, date: today(), i: 0, score: 0, combo: 0, maxCombo: 0, lives: 3, results: [], newKinds: [], rightN: 0 };
    if (mode === 'daily') G.list = dailyRounds(G.date);
    show('game'); nextRound();
    if (!raf) raf = requestAnimationFrame(loop);
  }

  function hud() {
    if (G.mode === 'daily') $('#hudLeft').textContent = `오늘의 사냥 ${Math.min(G.i + 1, G.list.length)} / ${G.list.length}`;
    else $('#hudLeft').innerHTML = `<span class="lives" aria-label="남은 달 ${G.lives}개">${[0, 1, 2].map(k => `<i class="life ${k < G.lives ? '' : 'out'}"></i>`).join('')}</span><span>${G.i + 1}판</span>`;
    $('#hudScore').textContent = fmt(G.score);
    $('#hudCombo').textContent = G.combo >= 2 ? `연속 ${G.combo}` : '';
  }

  function nextRound() {
    closeSheet();
    if (G.mode === 'daily' && G.i >= G.list.length) return finish();
    if (G.mode === 'endless' && G.lives <= 0) return finish();
    const r = G.mode === 'daily' ? G.list[G.i] : endlessNext(G.i);
    G.lastR = r;
    const chars = r.lines.join('').length + r.q.length + (r.opts ? r.opts.join('').length : 0);
    const diff = G.mode === 'endless' ? Math.max(0.6, 1 - 0.05 * Math.floor(G.i / 3)) : 1;
    RS = { r, budget: (9000 + chars * 75) * diff, t: 0, penalty: 0, done: false, wrongN: 0 };
    const where = r.type === 'where';
    $('#stageIn').innerHTML = `
      <div class="src">${esc(r.src)}</div>
      <div class="claim ${where ? 'where' : ''}">${r.lines.map((x, k) => where ? `<button class="ln" type="button" data-k="${k}">${esc(x)}</button>` : `<p class="ln">${esc(x)}</p>`).join('')}</div>
      <p class="q">${esc(r.q)}</p>
      ${where ? '<p class="hint">해당 문장을 누르세요. 틀리면 5초가 깎여요.</p>' :
        `<div class="opts" id="opts">${r.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}"><i>${'가나다라'[k]}</i><span>${esc(o)}</span></button>`).join('')}</div>`}`;
    if (where) document.querySelectorAll('#stageIn .ln').forEach(b => b.onclick = () => tapLine(+b.dataset.k, b));
    else document.querySelectorAll('#opts .opt').forEach(b => b.onclick = () => pickOpt(+b.dataset.k));
    $('#stage').scrollTop = 0;
    $('#timer').classList.remove('low');
    hud();
  }

  function loop(ts) {
    raf = requestAnimationFrame(loop);
    const dt = lastTs ? Math.min(100, ts - lastTs) : 0; lastTs = ts;
    if (!RS || RS.done || RS.paused || $('#game').hidden) return;
    RS.t += dt;
    const rem = RS.budget - RS.t - RS.penalty, frac = Math.max(0, rem / RS.budget);
    $('#timerFill').style.transform = `scaleX(${frac})`;
    $('#timer').classList.toggle('low', frac < 0.25);
    if (rem <= 0) endRound(false, 'timeout');
  }

  function tapLine(k, el) {
    if (!RS || RS.done || RS.paused || el.classList.contains('wrong')) return;
    const ok = [].concat(RS.r.ans).includes(k);
    if (ok) { el.classList.add('hit'); buzz(25); return endRound(true); }
    el.classList.add('wrong'); RS.penalty += PENALTY; RS.wrongN++; buzz(60);
    toast('여기는 아니에요. 5초가 깎였어요');
  }
  function pickOpt(k) {
    if (!RS || RS.done || RS.paused) return;
    const ok = k === RS.r.ans;
    document.querySelectorAll('#opts .opt').forEach((b, i) => b.classList.add(i === RS.r.ans ? 'right' : i === k ? 'wrongpick' : 'dim'));
    $('#opts').classList.add('locked');
    buzz(ok ? 25 : 60);
    endRound(ok, ok ? '' : 'wrong');
  }

  function endRound(ok, why) {
    if (RS.done) return; RS.done = true;
    const r = RS.r;
    if (!ok && r.type === 'where') [].concat(r.ans).forEach(k => { const e = $(`#stageIn .ln[data-k="${k}"]`); if (e) e.classList.add('reveal'); });
    if (!ok && r.type === 'why' && why === 'timeout') document.querySelectorAll('#opts .opt').forEach((b, i) => b.classList.add(i === r.ans ? 'right' : 'dim'));
    const speed = Math.round(100 * Math.max(0, (RS.budget - RS.t - RS.penalty) / RS.budget));
    const sym = ok ? (RS.wrongN ? '◐' : '●') : '○';
    if (sym === '●') { G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); } else G.combo = 0;
    const mult = sym === '●' ? Math.min(2, 1 + 0.2 * (G.combo - 1)) : 1;
    const pts = ok ? Math.round((100 + speed) * mult) : 0;
    G.score += pts;
    let isNew = false;
    if (ok) {
      G.rightN++; S.caught[r.trap] = (S.caught[r.trap] || 0) + 1; S.total++;
      if (!S.first[r.trap]) { S.first[r.trap] = today(); G.newKinds.push(r.trap); isNew = true; }
    }
    if (G.mode === 'endless' && !ok) G.lives--;
    G.results.push({ id: r.id, sym, pts });
    save(); hud();
    setTimeout(() => verdict(ok, why, pts, mult, isNew), 700);
  }

  function verdict(ok, why, pts, mult, isNew) {
    const r = RS.r, f = T[r.trap];
    const title = ok ? (RS.wrongN ? '찾았어요' : '맞았어요') : why === 'timeout' ? '시간이 다 됐어요' : '아쉬워요';
    const bits = [ok ? `+${fmt(pts)}점` : '0점'];
    if (mult > 1) bits.push(`연속 ${G.combo} · ${mult.toFixed(1)}배`);
    if (RS.wrongN) bits.push(`헛짚음 ${RS.wrongN}번`);
    if (G.mode === 'endless' && !ok) bits.push(G.lives > 0 ? '달이 하나 가려졌어요' : '마지막 달이 가려졌어요');
    const answer = r.type === 'why' && !ok ? `<p class="note" style="color:var(--mist);margin-top:12px">정답: ${esc(r.opts[r.ans])}</p>` : '';
    const last = G.mode === 'daily' ? G.i + 1 >= G.list.length : G.lives <= 0;
    openSheet(`<div class="verdict"><h3>${title}</h3><div class="pts">${bits.join(' · ')}</div>${answer}
      <p class="note">${esc(r.note)}</p>
      <div class="trap">
        <div class="kind"><b>${esc(f.name)}</b>${isNew ? '<em>도감에 새로 올렸어요</em>' : ''}</div>
        <p class="def">${esc(f.def)}</p>
        <h5>실제로 있었던 일</h5><p class="story">${esc(f.story)}</p>
        <h5>기억할 한 줄</h5><p class="rule">${esc(f.rule)}</p>
      </div>
      <button class="ecl-btn" type="button" id="nextBtn">${last ? '결과 보기' : '다음 판'}</button></div>`);
    $('#nextBtn').onclick = () => { G.i++; nextRound(); };
  }

  /* 끝 */
  function finish() {
    closeSheet(); RS = null;
    const grid = G.results.map(x => x.sym).join('');
    let note = '';
    if (G.mode === 'daily') {
      const t = G.date;
      if (!S.daily[t]) {
        S.daily[t] = { score: G.score, grid, ids: G.results.map(x => x.id) };
        S.streak = S.lastDaily && dayDiff(S.lastDaily, t) === 1 ? S.streak + 1 : 1;
        S.lastDaily = t; S.maxStreak = Math.max(S.maxStreak, S.streak);
        grantExp(10);
        note = (S.streak > 1 ? `${S.streak}일 연속이에요. ` : '') + '경험치 10을 받았어요.';
      }
    } else if (G.score > S.best) { S.best = G.score; S.bestRound = G.results.length; note = '최고 기록이에요.'; }
    save();
    renderEnd(G.mode, G.score, grid, note, G.results, false);
  }

  function renderEnd(mode, score, grid, note, results, already) {
    const rk = rank(S.total), newK = already ? [] : G.newKinds;
    const lbl = mode === 'daily' ? `오늘의 사냥 · ${dateLabel(already ? today() : G.date)}` : `연속 사냥 · ${results.length}판`;
    const rows = results.map(x => {
      const r = R.find(z => z.id === x.id); if (!r) return '';
      return `<div class="rv"><i class="dot ${dotCls(x.sym)}"></i><div>${esc(T[r.trap].name)} <span>${esc(r.src)}</span></div><small class="num">${x.pts !== undefined ? '+' + fmt(x.pts) : ''}</small></div>`;
    }).join('');
    $('#endBody').innerHTML = `
      <div class="lbl">${esc(lbl)}</div>
      <div class="big num">${fmt(score)}</div>
      <div class="dots">${dotsHTML(grid)}</div>
      ${already ? '<p class="note">오늘의 사냥은 끝났어요. 내일 새 문제가 나와요.</p>' : `<div class="stats"><div><b>${G.rightN}</b>맞힘</div><div><b>${G.results.length - G.rightN}</b>놓침</div><div><b>${G.maxCombo}</b>최고 연속</div></div>`}
      ${note ? `<p class="note">${esc(note)}</p>` : ''}
      ${newK.length ? `<p class="newkinds">도감에 새로 올린 함정 <b>${newK.map(k => esc(T[k].name)).join(', ')}</b></p>` : ''}
      <p class="note" style="color:var(--dim)">${esc(rk.name)} · 지금까지 ${S.total}번 맞혔어요</p>
      <div class="acts">
        <button class="ecl-btn" type="button" id="shareBtn">친구에게 보내기</button>
        <button class="ecl-btn ghost" type="button" id="goEndless">${mode === 'daily' ? '연속 사냥 하러 가기' : '다시 하기'}</button>
        <button class="plain" type="button" id="goDex">함정 도감 보기</button>
      </div>
      ${rows ? `<div class="review"><h4>이번 사냥</h4>${rows}</div>` : ''}`;
    $('#shareBtn').onclick = () => share(mode, score, grid, results.length);
    $('#goEndless').onclick = () => startGame('endless');
    $('#goDex').onclick = renderDex;
    show('end');
  }
  function showDailyDone() {
    const d = S.daily[today()]; if (!d) return startGame('daily');
    renderEnd('daily', d.score, d.grid, '', (d.ids || []).map((id, i) => ({ id, sym: d.grid[i] })), true);
  }
  async function share(mode, score, grid, n) {
    const head = mode === 'daily' ? `궤변 사냥 ${dateLabel(today())}` : `궤변 사냥 연속 모드 ${n}판`;
    const text = `${head}\n${grid} ${fmt(score)}점\n그럴듯한 주장에서 논리의 구멍을 찾는 게임\n${URL_}`;
    try { if (navigator.share) { await navigator.share({ title: '궤변 사냥', text }); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(text); toast('결과를 복사했어요'); } catch (e) { toast('복사하지 못했어요'); }
  }

  /* 시트, 토스트 */
  function openSheet(html) {
    $('#sheetIn').innerHTML = html; $('#sheet').scrollTop = 0;
    $('#scrim').hidden = false; $('#sheet').hidden = false;
    requestAnimationFrame(() => { $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); });
  }
  function closeSheet() { $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); $('#scrim').hidden = true; $('#sheet').hidden = true; $('#sheetIn').innerHTML = ''; }
  let toastT = 0;
  function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 1800); }

  $('#endlessBtn').onclick = () => startGame('endless');
  $('#dexBtn').onclick = renderDex;
  $('#dexBack').onclick = renderLobby;
  $('#endBack').onclick = renderLobby;
  $('#quitBtn').onclick = () => {
    if (!RS) return renderLobby();
    RS.paused = true;
    openSheet(`<div class="verdict"><h3>사냥을 멈출까요</h3><div class="pts">${G.mode === 'daily' ? '오늘의 사냥은 끝까지 해야 기록돼요.' : '지금까지 점수는 기록되지 않아요.'}</div>
      <button class="ecl-btn" type="button" id="keep">계속하기</button><button class="back-link" type="button" id="stop">그만하기</button></div>`);
    $('#keep').onclick = () => { closeSheet(); RS.paused = false; };
    $('#stop').onclick = () => { closeSheet(); RS = null; G = null; renderLobby(); };
  };

  window.Hunt = { get round() { return RS && { id: RS.r.id, type: RS.r.type, ans: RS.r.ans, done: RS.done }; }, dailyRounds };
  renderLobby();
})();
</script>
</body>
</html>
