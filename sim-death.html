            principle: {
              name: '아모르 파티',
              desc: '운명을 사랑하라. 일어난 모든 일, 일어날 모든 일을 긍정하라. 니체의 가장 높은 삶의 태도.',
              icon: '💜'
            },
            quote: '"운명을 사랑하라. 그것이 최고의 삶이다." - 프리드리히 니체'
          },
          {
            id: 'more',
            text: '"더 살고 싶었는데."',
            meaning: '삶에 대한 집착. 끝까지 살고 싶은 것, 그것도 자연스럽다.',
            principle: {
              name: '삶에의 의지',
              desc: '쇼펜하우어가 말한 맹목적 삶의 충동. 이성으로 제어할 수 없는 근원적 욕구. 살고 싶다는 것.',
              icon: '🔥'
            },
            quote: '"삶에의 의지는 가장 근원적이고 무조건적인 것이다." - 쇼펜하우어'
          },
          {
            id: 'thanks',
            text: '"고마웠어, 다들."',
            meaning: '감사로 마무리한다. 원망도, 미련도 아닌 감사.',
            principle: {
              name: '감사의 철학',
              desc: '삶 자체가 선물이다. 주어진 것에 감사하는 태도. 스토아 철학과 종교적 지혜가 공유하는 덕목.',
              icon: '🙏'
            },
            quote: '"감사하는 마음은 가장 위대한 덕이다." - 키케로'
          },
          {
            id: 'meaningless',
            text: '"결국 아무 의미 없었네."',
            meaning: '끝에서 돌아보니 다 부질없다. 노력도, 성취도, 관계도.',
            principle: {
              name: '허무',
              desc: '모든 의미는 인간이 만든 환상이다. 죽음 앞에서 그 환상이 벗겨진다. 니힐리즘의 직시.',
              icon: '🕳️'
            },
            quote: '"태어났다는 것이 이미 불행의 시작이다." - 에밀 시오랑'
          },
          {
            id: 'next',
            text: '"다음엔 더 잘 살아야지."',
            meaning: '이번 생은 끝나도 다음이 있다고 믿는다. 윤회, 환생, 새로운 시작.',
            principle: {
              name: '윤회적 희망',
              desc: '삶은 원환한다. 이번 생의 업은 다음 생으로 이어진다. 불교와 힌두교의 핵심 세계관.',
              icon: '🔄'
            },
            quote: '"죽음은 끝이 아니라 변화다." - 붓다'
          },
          {
            id: 'empty',
            text: '(아무 생각 없이 눈을 감는다)',
            meaning: '생각도 집착이다. 마지막 순간에도 무언가를 생각해야 한다는 강박을 놓는다.',
            principle: {
              name: '무심',
              desc: '마음을 비운다. 집착도, 미련도, 생각도 내려놓는다. 선불교가 추구하는 궁극의 경지.',
              icon: '🌊'
            },
            quote: '"생각이 일어나면 알아차리고 놓아라." - 선불교'
          }
        ]
      }
    ];
    
    // DOM 요소
    const gameScreen = document.getElementById('gameScreen');
    const explanationScreen = document.getElementById('explanationScreen');
    const resultScreen = document.getElementById('resultScreen');
    
    // 화면 전환
    function showScreen(screen) {
      [gameScreen, explanationScreen, resultScreen].forEach(s => s.classList.add('hidden'));
      screen.classList.remove('hidden');
    }
    
    // 스테이지 렌더링
    function renderStage() {
      const stage = stages[currentStageIndex];
      
      document.getElementById('stageLabel').textContent = `STAGE ${currentStageIndex + 1}`;
      document.getElementById('stageCount').textContent = `${currentStageIndex + 1}/${stages.length}`;
      document.getElementById('progressFill').style.width = `${((currentStageIndex + 1) / stages.length) * 100}%`;
      document.getElementById('stageBadge').textContent = stage.badge;
      document.getElementById('situationTitle').textContent = stage.title;
      document.getElementById('situationDesc').textContent = stage.desc;
      
      const highlightEl = document.getElementById('situationHighlight');
      if (stage.highlight) {
        highlightEl.textContent = stage.highlight;
        highlightEl.classList.remove('hidden');
      } else {
        highlightEl.classList.add('hidden');
      }
      
      const quoteEl = document.getElementById('situationQuote');
      if (stage.quote) {
        quoteEl.textContent = stage.quote;
        quoteEl.classList.remove('hidden');
      } else {
        quoteEl.classList.add('hidden');
      }
      
      // 선택지 렌더링
      const choicesContainer = document.getElementById('choices');
      choicesContainer.innerHTML = '';
      
      stage.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'sim-choice-btn';
        btn.innerHTML = `
          <span class="sim-choice-text">${choice.text}</span>
          ${choice.subtext ? `<span class="sim-choice-subtext">${choice.subtext}</span>` : ''}
        `;
        btn.addEventListener('click', () => handleChoice(choice));
        choicesContainer.appendChild(btn);
      });
      
      showScreen(gameScreen);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    // 선택 처리
    function handleChoice(choice) {
      choices.push({
        stage: currentStageIndex,
        choiceId: choice.id,
        choiceText: choice.text
      });
      
      if (choice.principle) {
        principles.push(choice.principle);
      }
      
      showExplanation(choice);
    }
    
    // 해설 화면
    function showExplanation(choice) {
      document.getElementById('yourChoice').textContent = choice.text;
      
      const meaningCard = document.getElementById('meaningCard');
      if (choice.meaning) {
        document.getElementById('choiceMeaning').textContent = choice.meaning;
        meaningCard.classList.remove('hidden');
      } else {
        meaningCard.classList.add('hidden');
      }
      
      const principleCard = document.getElementById('principleCard');
      if (choice.principle) {
        document.getElementById('principleName').textContent = `${choice.principle.icon} ${choice.principle.name}`;
        document.getElementById('principleDesc').textContent = choice.principle.desc;
        principleCard.classList.remove('hidden');
      } else {
        principleCard.classList.add('hidden');
      }
      
      const quoteCard = document.getElementById('quoteCard');
      if (choice.quote) {
        document.getElementById('quoteText').textContent = choice.quote;
        quoteCard.classList.remove('hidden');
      } else {
        quoteCard.classList.add('hidden');
      }
      
      const nextBtn = document.getElementById('nextBtn');
      if (currentStageIndex >= stages.length - 1) {
        nextBtn.textContent = '결과 보기';
      } else {
        nextBtn.textContent = '다음으로';
      }
      
      showScreen(explanationScreen);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    // 다음 버튼
    document.getElementById('nextBtn').addEventListener('click', () => {
      currentStageIndex++;
      if (currentStageIndex >= stages.length) {
        showResult();
      } else {
        renderStage();
      }
    });
    
    // 결과 계산
    function calculateResult() {
      const choiceIds = choices.map(c => c.choiceId);
      
      // Stage 1 반응 기반
      const stage1 = choiceIds[0];
      // Stage 2 시간 활용
      const stage2 = choiceIds[1];
      // Stage 3 죽음관
      const stage3 = choiceIds[2];
      // Stage 4 마지막
      const stage4 = choiceIds[3];
      
      // 유형 판정 로직
      // 스토아적 현자: 수용 + 일상 또는 담담한 선택들
      if ((stage1 === 'accept' || stage4 === 'enough' || stage4 === 'thanks') && 
          (stage2 === 'normal' || stage3 === 'nothing' || stage3 === 'meaning')) {
        return {
          icon: '🏛️',
          title: '스토아적 현자',
          desc: '당신은 죽음을 담담히 받아들입니다. 통제할 수 없는 것에 저항하지 않고, 주어진 삶에 감사합니다. 에픽테토스와 마르쿠스 아우렐리우스가 추구한 지혜의 길을 걷고 있습니다.'
        };
      }
      
      // 실존적 투사: 자유, 의미, 직시
      if ((stage1 === 'laugh' || stage3 === 'meaning') && 
          (stage4 === 'enough' || stage4 === 'more')) {
        return {
          icon: '⚔️',
          title: '실존적 투사',
          desc: '당신은 죽음을 직시하고 그 안에서 자유를 찾습니다. 삶의 유한함이 오히려 의미를 만든다고 믿습니다. 하이데거와 사르트르가 말한 본래적 실존을 살고 있습니다.'
        };
      }
      
      // 쾌락주의자: 버킷리스트, 카르페 디엠
      if (stage2 === 'bucket') {
        return {
          icon: '🎉',
          title: '쾌락주의자',
          desc: '당신은 남은 시간을 최대한 즐기려 합니다. 호라티우스의 "카르페 디엠"을 실천합니다. 내일은 없을 수 있으니, 오늘을 잡으세요.'
        };
      }
      
      // 허무주의자: 냉소, 무의미
      if ((stage1 === 'cynical' || stage4 === 'meaningless') && 
          (stage3 === 'avoid' || stage3 === 'nothing')) {
        return {
          icon: '🕳️',
          title: '허무주의자',
          desc: '당신은 삶의 무의미함을 직시합니다. 모든 것이 부질없다는 것을 알지만, 그래서 더 자유롭기도 합니다. 시오랑이 말한 "태어난 것의 불행"을 이해하는 사람입니다.'
        };
      }
      
      // 영적 순례자: 기도, 영혼 불멸, 윤회
      if ((stage2 === 'pray' || stage3 === 'afterlife' || stage4 === 'next')) {
        return {
          icon: '✨',
          title: '영적 순례자',
          desc: '당신은 죽음 너머의 세계를 믿습니다. 플라톤의 영혼 불멸이든, 종교적 내세든, 윤회든 - 이 세상이 전부가 아니라는 희망을 품고 있습니다.'
        };
      }
      
      // 관계 중심자: 사람, 감사
      if ((stage2 === 'people' || stage4 === 'thanks')) {
        return {
          icon: '🤝',
          title: '관계 중심자',
          desc: '당신에게 삶의 의미는 사람입니다. 마르틴 부버가 말한 "나와 너"의 만남이 진정한 삶이라고 믿습니다. 마지막까지 소중한 사람들과 함께하는 것이 당신의 선택입니다.'
        };
      }
      
      // 유산 건설자: 남기기
      if (stage2 === 'legacy') {
        return {
          icon: '📚',
          title: '유산 건설자',
          desc: '당신은 무언가를 남기고 싶어합니다. 어니스트 베커가 말한 "불멸 프로젝트"를 추구합니다. 육체는 죽어도 당신의 흔적은 남을 것입니다.'
        };
      }
      
      // 기본값: 구도자
      return {
        icon: '🌅',
        title: '삶의 구도자',
        desc: '당신은 하나의 태도로 정의되지 않습니다. 죽음 앞에서 다양한 감정과 생각이 교차합니다. 그것이 인간입니다. 답을 찾는 여정 자체가 의미 있습니다.'
      };
    }
    
    // 결과 화면
    function showResult() {
      const result = calculateResult();
      
      document.getElementById('resultIcon').textContent = result.icon;
      document.getElementById('resultTitle').textContent = result.title;
      document.getElementById('resultDesc').textContent = result.desc;
      
      // 발견한 원칙 표시
      if (principles.length > 0) {
        const principlesList = document.getElementById('principlesList');
        principlesList.innerHTML = '<div class="sim-principles-list-title">발견한 원칙</div>';
        principles.forEach(p => {
          const item = document.createElement('div');
          item.className = 'sim-principles-item';
          item.innerHTML = `
            <span class="sim-principles-item-icon">${p.icon}</span>
            <div>
              <div class="sim-principles-item-name">${p.name}</div>
              <div class="sim-principles-item-desc">${p.desc}</div>
            </div>
          `;
          principlesList.appendChild(item);
        });
        principlesList.classList.remove('hidden');
      }
      
      // 프로필 저장
      saveProgress(result);
      
      showScreen(resultScreen);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    // 프로필 저장
    function saveProgress(result) {
      let profile = JSON.parse(localStorage.getItem(STORAGE_KEY));
      
      if (!profile) {
        profile = { version: 5, name: '익명 탐험가', level: 1, exp: 0, completedSims: [], principles: [] };
      }
      
      if (!profile.completedSims) profile.completedSims = [];
      if (!profile.principles) profile.principles = [];
      
      // 완료 체크 및 경험치
      if (!profile.completedSims.includes('death')) {
        profile.completedSims.push('death');
        profile.exp = (profile.exp || 0) + 30;
      }
      
      // 원칙 저장 (문자열로)
      principles.forEach(p => {
        if (!profile.principles.includes(p.name)) {
          profile.principles.push(p.name);
        }
      });
      
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
    }
    
    // 공유
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const result = calculateResult();
      const text = `${result.icon} 나의 죽음관 유형: ${result.title}

"6개월 남았습니다."
이 말을 들으면 당신은 어떻게 하시겠습니까?

▶ 테스트 해보기
https://bit.ly/3Z9ZFPq`;
      
      if (navigator.share) {
        try {
          await navigator.share({ title: '죽음을 앞둔 선택', text });
        } catch (e) {}
      } else {
        try {
          await navigator.clipboard.writeText(text);
          alert('결과가 클립보드에 복사되었습니다!');
        } catch (e) {
          alert('공유 기능을 사용할 수 없습니다.');
        }
      }
    });
    
    // 시작
    renderStage();
  </script>
</body>
</html>
