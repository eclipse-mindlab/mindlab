  <script>
const SIDE={"next1": "S", "use1": "N", "why1": "S", "rest2": "S", "run2": "N", "easy2": "S", "score3": "S", "grow3": "N", "cry4": "S", "comfort4": "S", "ask4": "N", "music5": "S", "cut5": "S", "tragedy5": "N", "no6": "S", "pick6": "S", "yes6": "N"};
const RES={"T1": {"title": "인생은 고통이다", "body": "원하는 걸 얻어도 기쁨은 금방 식고, 좋은 일보다 나쁜 일이 더 오래 남는다는 걸 아는 사람입니다. 그래서 남의 고통에 쉽게 함께 아프고, 가끔은 아무것도 바라지 않는 시간을 찾습니다. 쇼펜하우어의 답과 거의 같습니다.\n\n쇼펜하우어는 부유한 상인이던 아버지의 유산으로 평생 돈 걱정 없이 살았습니다. 베를린에 콜레라가 돌자 서둘러 도시를 떠났고, 프랑크푸르트에서는 날마다 호텔 식당에서 점심을 먹었습니다. 일흔둘이던 1860년 9월의 어느 아침, 그는 소파에 앉은 채 숨져 있었습니다. 인생은 고통이라고 쓴 사람의 마지막은 그렇게 조용했습니다."}, "T2": {"title": "헌책방의 청년", "body": "쇼펜하우어의 답에서 출발했지만, 몇 번은 고통을 넘어서는 쪽을 골랐습니다. 니체도 여기서 시작했습니다.\n\n스물한 살의 니체는 라이프치히의 헌책방에서 쇼펜하우어의 책을 샀고, 2주 동안 새벽 2시에 자고 6시에 일어나며 그 책을 읽었습니다. 그 뒤 십 년 넘게 쇼펜하우어를 스승으로 삼았고, 그다음에야 스승의 결론을 하나씩 뒤집었습니다.\n\n스승은 돈 걱정 없이 일흔둘까지 살았고, 제자는 두통에 시달리며 값싼 하숙방을 떠돌았습니다. 인생은 고통이라는 말은 편안한 쪽에서, 고통을 긍정하라는 말은 아픈 쪽에서 나왔습니다."}, "T3": {"title": "오르막을 고르는 사람", "body": "고통을 손해로만 계산하지 않고, 넘어설 오르막이 있어야 기쁘다고 보는 사람입니다. 남의 불행 앞에서는 같이 우는 것보다 그 사람이 다시 일어설 자리를 묻습니다. 니체의 답에 가깝습니다.\n\n고통을 끌어안으라고 쓴 니체는 평생 지독한 두통에 시달렸습니다. 두통이 오면 며칠씩 토하며 어두운 방에 누워 있어야 했고, 서른넷에는 병 때문에 교수 자리를 내려놓았습니다. 그 뒤로는 연금으로 버티며 알프스 산골과 이탈리아 해안의 값싼 하숙방을 떠돌았습니다. 그의 긍정은 그 하숙방에서 쓰였습니다."}, "T4": {"title": "아모르 파티", "body": "좋은 순간만 골라 살 수 없다는 걸 알면서도, 이 삶을 통째로 다시 살겠다고 말하고 싶은 사람입니다. 니체가 끝까지 닿고 싶어 한 답입니다.\n\n니체는 이 말을 지키기 가장 어려운 자리에 있었습니다. 평생 두통에 시달렸고, 서른넷에 교수 자리를 내려놓았고, 하숙방을 떠돌며 쓴 책은 거의 팔리지 않았습니다. 마흔넷이던 1889년 1월, 그는 토리노에서 쓰러졌고 다시는 정신이 돌아오지 않았습니다. 그 뒤 11년을 어머니와 여동생의 간호를 받으며 지내다 쉰다섯에 죽었습니다. 그의 책은 그가 더는 읽을 수 없게 된 뒤에야 팔리기 시작했습니다."}};
const CONFIG={id:'life-pain',title:'인생은 고통인가',shareIcon:'',shareUrl:'https://eclipse-mindlab.github.io/mindlab/sim-life-pain.html',version:5,
stages:[{"badge": "욕망", "title": "새 차", "desc": "3년을 모아서 갖고 싶던 차를 샀다.\n\n처음 일주일은 주차장에 내려가 차를 보기만 해도 기분이 좋았다. 한 달이 지나자 그냥 출퇴근하는 차가 됐다.\n\n요즘은 한 단계 위 모델 광고가 자꾸 눈에 들어온다.", "highlight": "이제 어떻게 하겠는가?", "choices": [{"id": "next1", "text": "다음 차를 목표로 다시 모으기 시작한다.", "subtext": "열심히 일할 이유가 생긴다.", "meaning": "적금을 하나 더 들었다. 목표가 생기니 야근도 덜 힘들었다. 2년 뒤 그 차를 샀고, 이번에는 기쁨이 3주 갔다.\n\n지금은 그다음 모델이 눈에 들어온다.", "principle": {"name": "고통과 권태의 시계추", "desc": "쇼펜하우어는 삶이 시계추처럼 고통과 권태 사이를 오간다고 했다. 원하는 걸 못 가지면 괴롭고, 가지면 금방 지루해진다. 지루함을 못 견뎌 또 다른 걸 원한다.", "icon": ""}}, {"id": "use1", "text": "차는 그대로 두고, 그 차로 안 가 본 길을 찾아다닌다.", "subtext": "가진 걸 제대로 써 보고 싶다.", "meaning": "주말마다 지도에서 처음 보는 고갯길을 골랐다. 눈길 운전 교육도 받았다. 일 년이 지나자 차는 낡았는데, 운전 실력은 처음보다 훨씬 늘어 있었다.\n\n새 차 광고는 어느새 눈에 덜 들어왔다.", "principle": {"name": "힘에의 의지", "desc": "니체는 살아 있는 것이 무엇보다 자기 힘을 쓰고 키우려 한다고 봤다. 걸음마를 뗀 아이는 계단을 오르고, 그 위에서 뛰어내리려 한다. 살아남는 건 그 과정에서 따라오는 결과 중 하나다.", "icon": ""}}, {"id": "why1", "text": "왜 그 차가 갖고 싶은지 이유를 하나씩 적어 본다.", "subtext": "충동인지 확인하고 싶다.", "meaning": "연비와 안전 등급, 중고 시세, 넓은 뒷좌석까지 이유는 금방 열 개가 넘었다. 다 적고 보니 전부 광고를 보고 갖고 싶어진 다음에 찾아본 것들이었다.\n\n일주일 뒤 계약서에 서명했다.", "principle": {"name": "장님과 길잡이", "desc": "쇼펜하우어는 원하는 마음을 힘센 장님에, 이성을 그 어깨에 탄 사람에 빗댔다. 위에 탄 사람이 길을 알려 주지만, 어디로 갈지는 장님이 정한다. 원하는 마음이 먼저 생기고, 이성은 그 뒤에 이유를 붙인다.", "icon": ""}}]}, {"badge": "행복", "title": "하프 마라톤", "desc": "오랜만에 아무 일정도 없는 주말이다. 아픈 데도 없고 걱정거리도 없다.\n\n친구가 연락했다. \"석 달 뒤에 하프 마라톤 같이 나가자.\"\n\n지금 몸으로는 5km도 힘들다.", "highlight": "뭐라고 답하겠는가?", "choices": [{"id": "rest2", "text": "\"난 지금이 좋아. 이렇게 쉬는 게 행복이지.\"", "subtext": "굳이 고생할 이유가 없다.", "meaning": "주말 내내 늦잠을 자고 보고 싶던 드라마를 몰아 봤다. 아무 문제 없는 이틀이었다. 일요일 밤에 다음 주 일정을 보다가, 이번 주말에 무엇을 했는지 떠오르는 게 없다는 걸 알았다.\n\n편했던 날은 기억에 잘 남지 않는다.", "principle": {"name": "고통이 멈춘 상태", "desc": "이가 아픈 날에는 하루 종일 아픈 이만 생각나지만, 이가 멀쩡하다고 행복을 느끼는 사람은 없다. 쇼펜하우어는 그래서 행복을 고통이 잠시 멈춘 상태라고 정의했다.", "icon": ""}}, {"id": "run2", "text": "신청하고 석 달 동안 훈련한다.", "subtext": "한번 해 보고 싶다.", "meaning": "첫 주에는 3km를 뛰고 무릎이 아팠다. 두 달째에 처음으로 10km를 쉬지 않고 뛰었다. 대회 날 기록은 평범했다. 그런데 결승선을 지나고 마신 맥주 한 잔이 올해 가장 기억에 남았다.\n\n같은 맥주를 주말 소파에서 마셨을 때는 그런 맛이 나지 않았다.", "principle": {"name": "오르막의 기쁨", "desc": "니체에게 행복은 힘이 커지는 느낌, 가로막던 것을 넘어섰다는 느낌이었다. 산 정상에 선 사람이 기쁜 건 오르막을 올라왔기 때문이다. 케이블카로 올라온 사람은 같은 풍경을 보고도 같은 기쁨을 느끼지 못한다.", "icon": ""}}, {"id": "easy2", "text": "신청은 하되, 무리하지 말자며 5km 코스로 바꾼다.", "subtext": "적당히 하는 게 오래 간다.", "meaning": "훈련은 거의 하지 않았다. 대회 날 5km를 걷다 뛰다 하며 무난하게 들어왔다. 다친 데도 없고 힘든 데도 없었다. 인증 사진을 한 장 올렸다.\n\n한 달쯤 지나자 그날 일은 사진으로만 남았다.", "principle": {"name": "최후의 인간", "desc": "니체는 힘든 일도 위험한 일도 하지 않고, 적당히 일하고 적당히 즐기며 탈 없이 사는 사람들을 최후의 인간이라고 불렀다. 그들은 눈을 깜빡이며 말한다. 우리는 행복을 발명했다.", "icon": ""}}]}, {"badge": "정산", "title": "올해의 정산", "desc": "12월 말, 친구와 술을 마신다.\n\n올해는 이직에 실패했고, 3년 사귄 사람과 헤어졌고, 아버지가 수술을 받으셨다. 좋은 일은 승진 하나였다.\n\n친구가 묻는다. \"올해 어땠어?\"", "highlight": "뭐라고 답하겠는가?", "choices": [{"id": "score3", "text": "좋은 일과 나쁜 일을 하나씩 세어 본다.", "subtext": "숫자로 보면 정리가 된다.", "meaning": "승진의 기쁨은 일주일 갔고, 이별은 석 달을 갔다. 아버지 수술 날 병원 복도에서 기다린 네 시간은 승진 소식을 들은 순간보다 훨씬 또렷했다. 몇 번을 다시 세어도 올해는 마이너스였다.\n\n친구는 반박하지 못했다.", "principle": {"name": "고통의 저울", "desc": "쇼펜하우어는 한 동물이 다른 동물을 잡아먹을 때, 먹는 쪽의 기쁨과 먹히는 쪽의 고통을 나란히 놓아 보라고 했다. 사자의 한 끼와 산 채로 뜯기는 영양의 고통은 무게가 같지 않다. 그는 세상을 저울에 달면 언제나 고통 쪽으로 기운다고 봤다.", "icon": ""}}, {"id": "grow3", "text": "\"힘들었는데, 덕분에 혼자 버티는 법은 배웠어.\"", "subtext": "그렇게 생각하고 싶다.", "meaning": "말하고 나니 정말 그런 것 같았다. 친구가 작년보다 말이 단단해졌다고 했다. 혼자 밥 먹고 혼자 병원에 다니는 법은 올해 처음 배웠다.\n\n다만 그걸 배운 석 달을 다시 겪고 싶지는 않았다.", "principle": {"name": "깊은 뿌리", "desc": "니체는 쾌락과 고통을 저울에 다는 계산부터 순진하다고 했다. 그런 계산에서 고통은 무조건 손해이기 때문이다. 나무는 높이 자랄수록 뿌리를 더 깊이 뻗어야 한다. 그는 이렇게 썼다. 나를 죽이지 못하는 것은 나를 더 강하게 만든다.", "icon": ""}}]}, {"badge": "연민", "title": "불합격", "desc": "2년 동안 준비한 시험에 떨어진 친구가 밤 11시에 전화를 했다.\n\n친구는 말을 잇지 못하고 운다.", "highlight": "어떻게 하겠는가?", "choices": [{"id": "cry4", "text": "같이 울면서 친구 편을 든다.", "subtext": "\"그 시험이 이상한 거야. 너무 억울하다.\"", "meaning": "둘이서 한 시간을 울었다. 친구는 고맙다며 전화를 끊었다. 그 뒤로 친구는 만날 때마다 그 시험 얘기를 했고, 나도 매번 같이 화를 냈다.\n\n반년이 지나도 친구는 같은 자리에 있었다.", "principle": {"name": "연민의 윤리", "desc": "쇼펜하우어는 사람들이 몸은 따로여도 밑바닥에서는 같은 힘으로 움직인다고 봤다. 그래서 남의 고통을 자기 고통처럼 느끼는 연민을 모든 도덕의 바탕으로 삼았다. 모르는 사람을 구하려고 물에 뛰어드는 사람은 그를 남으로 느끼지 않은 것이다.", "icon": ""}}, {"id": "comfort4", "text": "\"괜찮아, 다음엔 꼭 될 거야.\" 하고 달랜다.", "subtext": "빨리 힘을 내게 해 주고 싶다.", "meaning": "\"응, 그렇겠지.\" 친구는 금방 울음을 그쳤고, 통화는 10분 만에 끝났다. 몇 달 뒤 친구가 말했다. 그 시험을 다시 볼지 그날 처음 망설였는데, 그 말을 꺼낼 틈이 없었다고.\n\n그날 나는 친구가 하려던 말을 듣기 전에 위로부터 했다.", "principle": {"name": "서두르는 위로", "desc": "니체는 쇼펜하우어의 연민을 직접 공격했다. 동정하는 사람은 서둘러 상대를 달랠 뿐, 그 실패가 상대에게 어떤 의미인지, 그 고통을 지나 어디로 가야 하는지는 묻지 않는다는 것이다. 그는 동정받는 사람이 스스로 일어설 힘을 잃는다고 봤다.", "icon": ""}}, {"id": "ask4", "text": "그날은 듣기만 하고, 다음 날 밥을 사며 묻는다.", "subtext": "\"이 2년이 너한테 뭐였어?\"", "meaning": "친구는 한참 말이 없다가, 사실 그 시험이 원래 하고 싶던 일은 아니었다고 했다. 반년 뒤 친구는 다른 분야에 합격했다. 소식을 듣고 같이 기뻐하는데, 솔직히 조금 배가 아팠다.\n\n그래도 그날 같이 웃은 기억이 울던 밤보다 오래 남았다.", "principle": {"name": "함께 기뻐하기", "desc": "남의 불행에 같이 우는 건 쉬워도, 남의 성공을 진심으로 같이 기뻐하기는 어렵다. 니체가 연민 대신 꼽은 건 이 어려운 쪽이었다. 그는 고통을 나누는 일보다 기쁨을 나누는 일이 사람을 친구로 만든다고 썼다.", "icon": ""}}]}, {"badge": "출구", "title": "안 풀리는 몇 달", "desc": "몇 달째 일이 안 풀린다. 퇴근하고 나면 아무것도 하기 싫다.\n\n오늘도 집에 와서 가방을 내려놓고 그대로 앉아 있다.", "highlight": "오늘 밤 무엇을 하겠는가?", "choices": [{"id": "music5", "text": "불을 끄고 좋아하는 앨범을 처음부터 끝까지 듣는다.", "subtext": "잠깐이라도 아무 생각 안 하고 싶다.", "meaning": "앨범 한 장을 듣는 40분 동안은 아무것도 바라지 않았다. 회사 생각도, 내일 할 일도 떠오르지 않았다. 마지막 곡이 끝나자 내일 아침 회의가 떠올랐다.\n\n다음 날 밤에도 같은 앨범을 틀었다.", "principle": {"name": "멈춘 바퀴", "desc": "그리스 신화의 익시온은 불타는 바퀴에 묶여 영원히 도는 벌을 받는다. 쇼펜하우어는 아름다운 것 앞에 선 순간 이 바퀴가 멈춘다고 썼다. 음악에 빠져 있는 동안에는 아무것도 원하지 않으니 괴롭지도 않다. 다만 음악이 끝나면 바퀴는 다시 돈다.", "icon": ""}}, {"id": "cut5", "text": "다 내려놓는다. 배달 앱과 SNS를 지우고 장바구니도 비운다.", "subtext": "원하는 게 없으면 괴로울 것도 없다.", "meaning": "한 달 동안 아무것도 사지 않았다. 처음 일주일은 홀가분했다. 그런데 어느새 하루에도 몇 번씩 오늘도 참았다고 스스로 세고 있었다. 참은 날이 늘수록 뿌듯했다.\n\n원하지 않으려는 마음이 무엇보다 강한 바람이 되어 있었다.", "principle": {"name": "무를 원하는 의지", "desc": "쇼펜하우어가 내놓은 마지막 길은 욕망 자체를 끄는 금욕이었다. 니체는 며칠씩 굶고 잠을 참는 수행자가 배고픔과 졸음을 이기는 것 자체를 누구보다 강하게 원한다고 봤다. 의지는 꺼지지 않고 방향만 자기 자신으로 바뀐다. 사람은 아무것도 원하지 않느니 차라리 무라도 원한다.", "icon": ""}}, {"id": "tragedy5", "text": "일부러 가장 슬픈 영화를 찾아본다.", "subtext": "울 거면 제대로 울고 싶다.", "meaning": "주인공이 모든 걸 잃는 영화였다. 엔딩 크레딧이 올라갈 때까지 울었다. 그런데 영화가 끝나자 이상하게 힘이 났다. 다음 날 미뤄 둔 메일 세 통을 보냈다.\n\n더 끔찍한 이야기를 보고 나니 내 일이 감당할 만해 보였다.", "principle": {"name": "비극의 긍정", "desc": "쇼펜하우어는 관객이 비극을 보며 삶이 붙잡을 가치가 없다는 걸 깨닫고 체념한다고 했다. 니체가 보기에 그리스인들은 삶이 얼마나 끔찍할 수 있는지 똑바로 보고도 그 삶을 축제의 무대에 올렸다. 니체는 비극을 삶을 긍정하는 가장 강한 방식으로 봤다.", "icon": ""}}]}, {"badge": "반복", "title": "할머니의 앨범", "desc": "할머니 발인을 마친 날 밤, 할머니 방에서 오래된 앨범을 넘긴다.\n\n할머니는 전쟁 때 피란을 내려와 평생 시장에서 장사를 하셨다. 다들 고생만 하다 가셨다고 했다.\n\n앨범 마지막 장에 할머니 글씨로 쓴 메모가 끼워져 있다. \"다시 태어나도 이렇게 살란다.\"", "highlight": "내 삶이 지금까지와 똑같이 한 번 더 반복된다면?", "choices": [{"id": "no6", "text": "\"한 번이면 충분하다. 다시 살고 싶지는 않다.\"", "subtext": "힘든 일을 또 겪고 싶지 않다.", "meaning": "군대와 첫 직장, 그 이별이 먼저 떠올랐다. 좋은 날도 많았지만, 그 날들을 위해 그 모든 걸 다시 지나갈 자신은 없었다.\n\n그날은 할머니가 왜 그렇게 쓰셨는지 이해하지 못했다.", "principle": {"name": "태어나지 않는 편", "desc": "쇼펜하우어는 무덤을 두드려 죽은 사람들에게 다시 살아나고 싶으냐고 물으면 모두 고개를 저을 거라고 했다. 그는 인간이 차라리 태어나지 않는 편이 나았다고 봤다.", "icon": ""}}, {"id": "pick6", "text": "\"좋았던 순간들만 골라서 다시 살고 싶다.\"", "subtext": "그건 몇 번이고 다시 살 수 있다.", "meaning": "다시 살고 싶은 장면을 꼽아 봤다. 첫 월급을 받던 날과 그 사람과 처음 여행 간 날이 떠올랐다. 그런데 장면마다 바로 옆에 힘든 시간이 붙어 있었다. 첫 월급 앞에는 1년의 취업 준비가, 그 여행 뒤에는 이별이 있었다.\n\n한 장면만 떼어 낼 방법은 없었다.", "principle": {"name": "엮인 순간들", "desc": "니체는 이런 상상을 해 보라고 했다. 어느 밤 악마가 찾아와, 지금 이 삶을 똑같은 순서로 셀 수 없이 다시 살아야 한다고 속삭인다. 기쁨과 고통은 사슬처럼 엮여 있어서 좋았던 순간만 골라낼 수 없다. 기쁜 순간 하나를 긍정한 사람은 그와 엮인 고통까지 긍정한 셈이다.", "icon": ""}}, {"id": "yes6", "text": "\"할머니처럼 말할 수 있으면 좋겠다.\"", "subtext": "아직은 아니지만.", "meaning": "지금 당장 그렇게 말할 자신은 없었다. 다시 살아도 괜찮을 만한 날이 아직 많지 않았다. 메모를 지갑에 넣으며, 다시 살아도 괜찮을 하루를 내일부터 하나씩 늘려 보기로 했다.\n\n할머니가 그 한 줄을 쓰기까지 몇 년이 걸렸을지 궁금해졌다.", "principle": {"name": "운명을 사랑하기", "desc": "니체는 자기 삶에 일어난 일을 하나도 바꾸고 싶어 하지 않는 태도를 가장 높은 경지로 꼽았다. 운명을 사랑하는 것, 아모르 파티다. 서른일곱 살 새해에 그는 이렇게 적었다. 언젠가는 오직 긍정하는 사람이 되고 싶다.", "icon": ""}}]}],
calculateResult(choices,principles){
  let s=0,n=0;choices.forEach(c=>{if(SIDE[c.choiceId]==='N')n++;else if(SIDE[c.choiceId]==='S')s++;});
  const k=n<=1?'T1':n<=3?'T2':n<=5?'T3':'T4';const r=RES[k];
  const head='여섯 번의 선택 가운데 쇼펜하우어의 답이 '+s+'번, 니체의 답이 '+n+'번이었습니다.\n\n';
  return {icon:'',label:'당신의 답',title:r.title,desc:head+r.body,stats:[{value:s+'번',label:'견디는 쪽 · 쇼펜하우어'},{value:n+'번',label:'넘어서는 쪽 · 니체'}]};
},
getShareText(t){return '인생은 고통인가\n\n나의 답: '+t+'\n\n행복은 고통이 멈춘 순간인가, 고통을 넘어선 순간인가?\n\nhttps://eclipse-mindlab.github.io/mindlab/sim-life-pain.html';}
};
